лена и теллура.<\/strong> Отсюда логика TMK по высокочистым Se и Te, тем более что рядом медное производство АГМК (логичное предположение; конкретный источник сырья уточните внутри компании).<\/li><\/ul>\n<p><strong>Закон Фарадея<\/strong> — сколько металла даёт ток:<\/p>\n<pre class=\"code\"><code>m = I · t · M / (z · F)\nI — ток (А), t — время (с), M — молярная масса (г/моль), z — заряд иона, F = 96 485 Кл/моль<\/code><\/pre>\n<p><strong>Пример.<\/strong> Ток 1 000 А в течение суток (86 400 с) для меди (M = 63,55; z = 2): m = 1 000 · 86 400 · 63,55 / (2 · 96 485) ≈ <strong>28,5 кг<\/strong> при 100% выходе по току.<\/p>\n<p><strong>Выход по току<\/strong> (current efficiency) — доля тока, ушедшая на целевую реакцию (у меди при EW обычно около 90–95%). Удельный расход энергии — кВт·ч на тонну металла; при EW он в разы выше, чем при ER, потому что напряжение на ванне больше.<\/p>\n<p><strong>Электролиз расплавленных солей<\/strong> (molten salt electrolysis) — для металлов, которые нельзя выделить из водных растворов:<\/p>\n<ul><li><strong>алюминий<\/strong> — процесс Холла–Эру (≈ 950–960 °C, криолит);<\/li><li><strong>магний, литий, натрий<\/strong>;<\/li><li><strong>неодим, празеодим (NdPr), другие РЗЭ-металлы<\/strong> — электролиз фторидных расплавов с подачей оксида; используют графитовый анод и <strong>вольфрамовый или молибденовый катод<\/strong>. Вольфрам и молибден TMK нужны даже производителям РЗЭ-металлов.<\/li><\/ul>\n<p><strong>Задачи для самопроверки:<\/strong><\/p>\n<ol><li>Сколько меди даст ванна при 30 000 А за сутки при выходе по току 92%?<\/li><li>Почему для никеля и кобальта электролиз чувствителен к примесям сильнее, чем для меди?<\/li><\/ol>\n<details><summary>Решения<\/summary>\n<ol><li>28,5 кг × 30 × 0,92 ≈ 787 кг/сутки.<\/li><li>Ni и Co осаждаются при более отрицательных потенциалах; примеси (Cu, Zn, Fe и др.) соосаждаются или снижают выход по току. Требования к чистоте электролита выше, отсюда сложная очистка растворов (экстракция Cyanex 272 и др.).<\/li><\/ol>\n<\/details>\n<h3>1.4 Рафинирование и высокая чистота<\/h3>\n<p><strong>Обозначения чистоты:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Обозначение<\/th><th>Чистота<\/th><th>Где встречается<\/th><\/tr><\/thead><tbody><tr><td>2N<\/td><td>99%<\/td><td>Технические продукты<\/td><\/tr><tr><td>3N<\/td><td>99,9%<\/td><td><strong>Металлический рений TMK (99,9%)<\/strong>, многие металлы<\/td><\/tr><tr><td>3N5<\/td><td>99,95%<\/td><td><strong>Штабики Mo TMK (99,95%)<\/strong><\/td><\/tr><tr><td>4N<\/td><td>99,99%<\/td><td>Катодная медь, многие электронные материалы<\/td><\/tr><tr><td>5N<\/td><td>99,999%<\/td><td>Полупроводниковые и оптические материалы, высокочистые Se, Te<\/td><\/tr><tr><td>6N+<\/td><td>99,9999% и выше<\/td><td>Мишени для напыления, полупроводники<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Методы рафинирования:<\/strong><\/p>\n<ul><li><strong>огневое<\/strong> (fire refining) — продувка расплава воздухом, затем восстановление (медь перед электрорафинированием);<\/li><li><strong>электрорафинирование<\/strong> — водное или в расплавах солей;<\/li><li><strong>химическое<\/strong> — перекристаллизация, повторное осаждение, ионный обмен и экстракция для «полировки» растворов;<\/li><li><strong>вакуумная дистилляция и сублимация<\/strong> — <strong>Se, Te<\/strong>, Mg, Zn, Cd;<\/li><li><strong>зонная плавка<\/strong> (zone refining) — сверхвысокая чистота для полупроводников;<\/li><li><strong>электронно-лучевая плавка<\/strong> (EBM) и <strong>вакуумно-дуговой переплав<\/strong> (VAR) — тугоплавкие металлы (Ta, Nb, Mo, W, Re), титан и суперсплавы.<\/li><\/ul>\n<p><strong>Аналитика высокой чистоты<\/strong> (без неё высокочистый металл не продать):<\/p>\n<ul><li><strong>GDMS<\/strong> (масс-спектрометрия тлеющего разряда) — десятки примесей на уровне ppb–ppm в твёрдом образце;<\/li><li><strong>ICP-MS<\/strong> — следы примесей в растворах;<\/li><li><strong>газоанализаторы<\/strong> (LECO и аналоги) — O, N, H, C, S.<\/li><\/ul>\n<p>Кто владеет GDMS и чистыми помещениями, тот может сертифицировать 5N–6N.<\/p>\n<p><strong>Где нужны высокочистые металлы TMK:<\/strong><\/p>\n<ul><li><strong>рений<\/strong> — суперсплавы для лопаток турбин (GE Aerospace, Rolls-Royce, Pratt &amp; Whitney и их поставщики сплавов) и платино-рениевые катализаторы риформинга;<\/li><li><strong>теллур<\/strong> — солнечные модули CdTe (First Solar), термоэлектрики (Bi₂Te₃);<\/li><li><strong>селен<\/strong> — электроника, стекло, металлургия;<\/li><li><strong>вольфрам и молибден 3N5–5N<\/strong> — мишени для напыления в электронике, рентгеновские трубки, тигли.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Жидкостная экстракция<\/td><td>Solvent extraction (SX)<\/td><td>Перенос металла из водной фазы в органическую<\/td><\/tr><tr><td>Экстрагент<\/td><td>Extractant<\/td><td>Активное вещество органической фазы<\/td><\/tr><tr><td>Разбавитель<\/td><td>Diluent<\/td><td>Керосиновая основа органической фазы<\/td><\/tr><tr><td>Органическая фаза<\/td><td>Organic phase<\/td><td>Несмешивающийся с водой раствор экстрагента<\/td><\/tr><tr><td>Водная фаза<\/td><td>Aqueous phase<\/td><td>Водный раствор металлов<\/td><\/tr><tr><td>Экстракция<\/td><td>Extraction / loading<\/td><td>Переход металла в органику<\/td><\/tr><tr><td>Промывка (скруббинг)<\/td><td>Scrubbing<\/td><td>Удаление примесей из насыщенной органики<\/td><\/tr><tr><td>Реэкстракция<\/td><td>Stripping<\/td><td>Возврат металла из органики в чистый водный раствор<\/td><\/tr><tr><td>Рафинат<\/td><td>Raffinate<\/td><td>Обеднённый водный раствор после экстракции<\/td><\/tr><tr><td>Смеситель-отстойник<\/td><td>Mixer-settler<\/td><td>Основной аппарат экстракции<\/td><\/tr><tr><td>Коэффициент распределения<\/td><td>Distribution coefficient (D)<\/td><td>Отношение концентраций в фазах<\/td><\/tr><tr><td>Коэффициент разделения<\/td><td>Separation factor (β)<\/td><td>Мера селективности для двух металлов<\/td><\/tr><tr><td>Каскад экстракции<\/td><td>Extraction cascade / circuit<\/td><td>Последовательность ступеней<\/td><\/tr><tr><td>Унос<\/td><td>Entrainment<\/td><td>Перенос капель одной фазы в другую<\/td><\/tr><tr><td>Межфазные образования<\/td><td>Crud<\/td><td>Эмульсионные отложения на границе фаз<\/td><\/tr><tr><td>Электроэкстракция<\/td><td>Electrowinning (EW)<\/td><td>Выделение металла из раствора на катоде с нерастворимым анодом<\/td><\/tr><tr><td>Электрорафинирование<\/td><td>Electrorefining (ER)<\/td><td>Очистка металла через растворимый анод<\/td><\/tr><tr><td>Катод / анод<\/td><td>Cathode / anode<\/td><td>Электроды: восстановление / окисление<\/td><\/tr><tr><td>Электролит<\/td><td>Electrolyte<\/td><td>Раствор, проводящий ток в ванне<\/td><\/tr><tr><td>Выход по току<\/td><td>Current efficiency<\/td><td>Доля тока, ушедшая на целевую реакцию<\/td><\/tr><tr><td>Анодный шлам<\/td><td>Anode slimes<\/td><td>Нерастворимый остаток анодов; источник Au, Ag, Se, Te<\/td><\/tr><tr><td>Электролиз расплавленных солей<\/td><td>Molten salt electrolysis<\/td><td>Получение Al, Mg, Li, РЗЭ-металлов из расплавов<\/td><\/tr><tr><td>Огневое рафинирование<\/td><td>Fire refining<\/td><td>Очистка расплава окислением и восстановлением<\/td><\/tr><tr><td>Вакуумная дистилляция<\/td><td>Vacuum distillation<\/td><td>Очистка испарением и конденсацией в вакууме<\/td><\/tr><tr><td>Зонная плавка<\/td><td>Zone refining<\/td><td>Метод получения сверхчистых веществ<\/td><\/tr><tr><td>Электронно-лучевая плавка<\/td><td>Electron beam melting (EBM)<\/td><td>Рафинирование тугоплавких металлов в вакууме<\/td><\/tr><tr><td>Высокочистый металл<\/td><td>High-purity metal (4N, 5N, 6N)<\/td><td>Металл с минимальным содержанием примесей<\/td><\/tr><tr><td>Масс-спектрометрия тлеющего разряда<\/td><td>GDMS (glow discharge mass spectrometry)<\/td><td>Анализ следовых примесей в твёрдых образцах<\/td><\/tr><tr><td>Мишень для напыления<\/td><td>Sputtering target<\/td><td>Изделие из высокочистого металла для электроники<\/td><\/tr><tr><td>Оксид неодима-празеодима<\/td><td>NdPr oxide<\/td><td>Главный товарный продукт РЗЭ для магнитов<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><\/tr><\/thead><tbody><tr><td>Начальник экстракционного участка / технолог SX<\/td><td>SX Superintendent / SX Process Engineer<\/td><td>Число ступеней, экстрагенты, потери органики (ppm), борьба с crud, пожарная безопасность<\/td><\/tr><tr><td>Технолог каскадного разделения РЗЭ<\/td><td>REE Separation Process Engineer / Chemist<\/td><td>Какие пары разделял, чистота продуктов, моделирование каскадов, промышленный масштаб<\/td><\/tr><tr><td>Начальник электролизного цеха<\/td><td>Tankhouse / Electrowinning Superintendent<\/td><td>Ток (кА), выход по току, качество катодов, короткие замыкания, кислотный туман<\/td><\/tr><tr><td>Начальник рафинировочного производства<\/td><td>Refinery Manager<\/td><td>Продукты, чистота, объёмы, извлечение благородных и попутных металлов<\/td><\/tr><tr><td>Технолог по высокочистым металлам<\/td><td>High-Purity Materials Engineer / Process Chemist (5N–6N)<\/td><td>Методы (вакуумная дистилляция, зонная плавка, EBM), чистота, аналитика GDMS<\/td><\/tr><tr><td>Электрохимик (расплавы)<\/td><td>Molten Salt Electrolysis Engineer<\/td><td>Ячейки, электроды, выход по току, металлы (Al, Mg, Li, NdPr)<\/td><\/tr><tr><td>Аналитик следовых примесей<\/td><td>Trace Analysis Chemist (ICP-MS, GDMS)<\/td><td>Пределы обнаружения, стандарты, аккредитация<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>(SX) «Какой экстрагент, сколько ступеней экстракции, промывки и реэкстракции?»<\/td><td>Точная конфигурация и почему такая<\/td><td>«Стандартная схема»<\/td><\/tr><tr><td>(SX) «Какие были потери органики и как вы с ними боролись?»<\/td><td>Цифры (ppm или кг на тонну), меры: коалесцеры, контроль фаз<\/td><td>Не измеряли<\/td><\/tr><tr><td>(РЗЭ) «Какие пары вы разделяли и какую чистоту получали? Сколько ступеней было в каскаде?»<\/td><td>Конкретные элементы, 99,9–99,99%, число ступеней<\/td><td>Только «работал с РЗЭ»<\/td><\/tr><tr><td>(EW) «Какой выход по току? Как боролись с короткими замыканиями и дендритами?»<\/td><td>Цифры, причины, системы контроля<\/td><td>Не знает показателя<\/td><\/tr><tr><td>(Высокая чистота) «Как вы подтверждали чистоту 5N? Какие примеси лимитировали?»<\/td><td>GDMS или ICP-MS, конкретные элементы, спецификации клиентов<\/td><td>«Лаборатория давала паспорт»<\/td><\/tr><tr><td>«С какими клиентами и спецификациями вы работали?»<\/td><td>Отрасли, стандарты, аудит клиентов<\/td><td>Не знает, куда шёл продукт<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Доноры<\/th><\/tr><\/thead><tbody><tr><td>SX-EW меди<\/td><td>Freeport-McMoRan (Аризона, Перу), Codelco, BHP (Эскондида), Antofagasta, First Quantum, Glencore (ДР Конго), ERG, CMOC, Zijin; казахстанские медные предприятия<\/td><\/tr><tr><td>Разделение РЗЭ<\/td><td>Lynas, Solvay (Ла-Рошель), Neo Performance Materials (Silmet), MP Materials, Energy Fuels, Iluka, Saskatchewan Research Council, Carester, IREL; Китай (с юридической оценкой)<\/td><\/tr><tr><td>Медное рафинирование, Se и Te из шламов<\/td><td>Aurubis (Гамбург), Boliden (Рённшер), Umicore (Хобокен — один из крупнейших переработчиков шламов и вторичного сырья), JX Metals, Mitsubishi Materials, Sumitomo Metal Mining, АГМК, медеплавильные предприятия Казахстана; предприятия России (с проверкой санкционных ограничений)<\/td><\/tr><tr><td>Высокочистые металлы<\/td><td><strong>5N Plus<\/strong> (Канада — Te, Se, Bi, полупроводниковые материалы), Umicore, JX Metals (мишени для напыления), Materion (США), Plansee, H.C. Starck Tungsten, Honeywell Electronic Materials, Vital Materials (Китай)<\/td><\/tr><tr><td>Электролиз расплавов (NdPr, Li)<\/td><td>Производители РЗЭ-металлов и магнитов вне Китая (Вьетнам, Япония, Великобритания, США), производители лития и магния<\/td><\/tr><tr><td>Экстрагенты (технические специалисты)<\/td><td>BASF (LIX), Syensqo (Acorga, Cyanex), Clariant<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Объяснение для менеджера.<\/strong> Напишите 5–7 предложений: «Почему найти технолога по разделению РЗЭ так сложно и долго». Без жаргона, но с фактами: химическое сходство, сотни ступеней, концентрация технологий в Китае, ограничения на экспорт технологий, малое число заводов вне Китая. Это ваш реальный инструмент для управления ожиданиями заказчика.<\/p>\n<p><strong>Задание 2 (10 мин). Карта доноров «Высокая чистота Se, Te, Re».<\/strong> Добавьте в вашу карту из Дня 1 десять компаний с ролями. Отметьте, где есть GDMS-лаборатории и чистые помещения.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Прочитайте вслух своё объяснение из Задания 1. Убедительно ли оно для руководителя, который «хочет кандидата через две недели»?<\/li><li>Какие три компании-донора по высокой чистоте вы выделили бы первыми?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 10: пирометаллургия, порошковая металлургия и финал модуля 2».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> завтра — финал Модуля 2 и треть всей программы. Вы соединяете цепочку TMK целиком: от концентрата до твёрдосплавной пластины. После завтрашнего дня вы будете понимать производство TMK лучше, чем большинство людей, которые о нём пишут.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>M. Schlesinger, K. Sole, W. Davenport, G. Alvear, <em>Extractive Metallurgy of Copper<\/em> — главы о SX, EW и электрорафинировании.<\/li><li>Публикации Solvomet KU Leuven (Koen Binnemans) о гидро- и сольвометаллургии РЗЭ — источник и знаний, и имён.<\/li><li>Отчёты Adamas Intelligence и Benchmark Mineral Intelligence о рынке РЗЭ и магнитов (частично платные; бесплатные обзоры и вебинары).<\/li><li>Видео: «solvent extraction mixer settler animation», «copper electrowinning tankhouse», «rare earth separation process».<\/li><\/ul>"},{"n":10,"module":2,"title":"Пирометаллургия и порошковая металлургия: от концентрата до изделия TMK","file":"module-02-processing-metallurgy/day-10-pyrometallurgy-powder-metallurgy.md","duration":"4 часа","challenge":"Собрать <strong>полные цепочки TMK<\/strong> для вольфрама, молибдена и рения: от концентрата до продукта из каталога TMK. На каждом шаге указать роль, дефицит и компанию-донора. Затем пройти итоговый тест модуля.","why":"То, что делает Чирчик, — твёрдые сплавы ВК6/ВК8, штабики вольфрама и молибдена, порошок рения, ферромолибден, — это пирометаллургия и порошковая металлургия. Здесь живёт ядро компетенций TMK и Smart Powder. Когда вы поймёте эту часть, вы сможете говорить с технологами Чирчика на их языке. Тогда они начнут доверять вам свои самые сложные вакансии.","checklist":[{"text":"Разминка: 5 вопросов по Дням 8–9 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.5 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Кейс-финал: три цепочки TMK (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Итоговый тест модуля 2 ≥ 16/20 — см. <a href=\"#module-2\">README модуля<\/a> (20 мин)","minutes":20},{"text":"Teach-back: 10 минут объясняете коллеге путь «концентрат → твёрдосплавная пластина»","minutes":0},{"text":"Рефлексия (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.3 и 1.4 → тест дня. Кейс и итоговый тест модуля — в ближайший выходной, до Модуля 3.","terms":[{"ru":"Пирометаллургия","en":"Pyrometallurgy","def":"Металлургия высоких температур"},{"ru":"Прокалка","en":"Calcination","def":"Термическое разложение соединения"},{"ru":"Обжиг","en":"Roasting","def":"Химическое превращение твёрдого вещества в газовой среде при нагреве"},{"ru":"Многоподовая печь","en":"Multiple hearth furnace (MHF)","def":"Печь для обжига молибденита"},{"ru":"Плавка","en":"Smelting","def":"Расплавление с разделением фаз"},{"ru":"Штейн","en":"Matte","def":"Сульфидный расплав Cu, Ni, Fe"},{"ru":"Шлак","en":"Slag","def":"Оксидный расплав пустой породы и флюсов"},{"ru":"Флюс","en":"Flux","def":"Добавка для формирования шлака"},{"ru":"Конвертирование","en":"Converting","def":"Продувка штейна воздухом"},{"ru":"Металлотермия","en":"Metallothermic reduction","def":"Восстановление оксида активным металлом"},{"ru":"Ферромолибден","en":"Ferromolybdenum (FeMo)","def":"Сплав Fe–Mo для легирования сталей"},{"ru":"Восстановление водородом","en":"Hydrogen reduction","def":"Получение металлических порошков из оксидов и солей"},{"ru":"Карбидизация","en":"Carburization","def":"Получение карбида (W + C → WC)"},{"ru":"Газоочистка","en":"Off-gas cleaning / gas handling","def":"Улавливание пыли, SO₂ и ценных компонентов из газов"},{"ru":"Огнеупоры","en":"Refractories","def":"Материалы футеровки печей"},{"ru":"Порошковая металлургия","en":"Powder metallurgy (PM)","def":"Изделия из порошков прессованием и спеканием"},{"ru":"Распыление расплава","en":"Atomization","def":"Получение порошка распылением жидкого металла"},{"ru":"Размер частиц по Фишеру","en":"Fisher sub-sieve size (FSSS)","def":"Стандартная характеристика порошков W, Mo, Re"},{"ru":"Насыпная плотность","en":"Apparent density","def":"Плотность свободно насыпанного порошка"},{"ru":"Прессование","en":"Compaction / pressing","def":"Формование порошка в пресс-форме"},{"ru":"Изостатическое прессование","en":"Isostatic pressing (CIP / HIP)","def":"Прессование равномерным давлением (холодное / горячее)"},{"ru":"Спекание","en":"Sintering","def":"Нагрев прессовки ниже температуры плавления для упрочнения"},{"ru":"Жидкофазное спекание","en":"Liquid phase sintering","def":"Спекание с расплавлением связки (Co в твёрдом сплаве)"},{"ru":"Твёрдый сплав","en":"Cemented carbide / hardmetal","def":"Композит WC + Co"},{"ru":"Карбид вольфрама","en":"Tungsten carbide (WC)","def":"Основа твёрдых сплавов"},{"ru":"Штабик","en":"Sintered bar / ingot (W, Mo)","def":"Спечённая заготовка для ковки и волочения"},{"ru":"Инжекционное формование металлов","en":"Metal injection molding (MIM)","def":"Литьё смеси порошка и связки под давлением"},{"ru":"Аддитивные технологии","en":"Additive manufacturing (AM)","def":"3D-печать металлами"},{"ru":"Пресс-инструмент (оснастка)","en":"Tooling (dies and punches)","def":"Матрицы и пуансоны для прессования"},{"ru":"Одобрение производства деталей","en":"PPAP (production part approval process)","def":"Процедура автопрома для запуска детали"},{"ru":"Перренат аммония","en":"Ammonium perrhenate (APR)","def":"Соединение рения перед восстановлением"}],"quiz":[{"q":"Что происходит с рением при окислительном обжиге молибденитового концентрата?","options":["Остаётся в огарке","Переходит в шлак","Окисляется до летучего Re₂O₇ и уходит с газами, откуда его улавливают","Сгорает без остатка"],"answer":2,"explain":"Рений улавливают мокрой газоочисткой и затем извлекают сорбцией или экстракцией."},{"q":"Почему тугоплавкие металлы (W, Mo, Re) обычно перерабатывают методами порошковой металлургии?","options":["Их температуры плавления очень высоки (W ≈ 3 420 °C), плавка и литьё практически неприменимы","Это дешевле","Так требует ГОСТ","Порошки легче транспортировать"],"answer":0,"explain":"Прессование и спекание позволяют получить изделие без полного расплавления."},{"q":"Что означает марка твёрдого сплава ВК8?","options":["8% вольфрама","8-й класс точности","Карбид вольфрама с 8% кобальта","8 мкм размер зерна"],"answer":2,"explain":"В — карбид вольфрама, К — кобальт, цифра — процент кобальта."},{"q":"Какую роль играет кобальт при жидкофазном спекании твёрдого сплава?","options":["Окрашивает изделие","Защищает от коррозии","Не участвует в спекании","Плавится и связывает зёрна карбида вольфрама в плотный материал"],"answer":3,"explain":"Кобальтовая связка обеспечивает прочность и вязкость, WC — твёрдость."},{"q":"Как получают ферромолибден?","options":["Электролизом","Металлотермическим восстановлением оксида молибдена (силико- и алюминотермия) с железом","Флотацией","Кучным выщелачиванием"],"answer":1,"explain":"Ферромолибден ФМо60 и ФМо70 — продукты TMK по ГОСТ 4759-91; используются для легирования сталей."},{"q":"Что такое «размер частиц по Фишеру» (FSSS)?","options":["Стандартная характеристика среднего размера частиц порошков W, Mo, Re","Сорт рыбы","Твёрдость сплава","Метод спекания"],"answer":0,"explain":"В спецификации рения TMK — 3,0–7,5 мкм по Фишеру. Технолог порошков управляет этим параметром."},{"q":"Какой стандарт обязателен для поставок деталей порошковой металлургии в автопром?","options":["JORC","GISTM","RMAP","IATF 16949 (+ процедура PPAP)"],"answer":3,"explain":"Для Smart Powder и экспорта автодеталей это обязательная компетенция инженеров по качеству."},{"q":"Что такое η-фаза в твёрдом сплаве?","options":["Хрупкая фаза при недостатке углерода — дефект углеродного баланса","Признак идеального качества","Название марки","Тип покрытия"],"answer":0,"explain":"Контроль углеродного баланса — классическая задача технолога. Вопрос про η-фазу быстро отличает практика."},{"q":"Какой газ создаёт главный риск взрыва в печах восстановления W, Mo, Re?","options":["Азот","Аргон","Водород","Углекислый газ"],"answer":2,"explain":"Водород — восстановитель и одновременно взрывоопасный газ. Требования безопасности к таким производствам очень высокие."},{"q":"Где эффективнее всего искать технологов твёрдых сплавов мирового уровня?","options":["На медных рудниках","В Sandvik Coromant, Kennametal, Ceratizit / Plansee, IMC (Iscar, TaeguTec), KORLOY, Mitsubishi Materials, Sumitomo Electric","В банках","В нефтяных компаниях"],"answer":1,"explain":"Это мировые лидеры инструментальных твёрдых сплавов. Корейские TaeguTec и KORLOY особенно интересны с учётом корейских партнёрств TMK."}],"html":"<h2>0. Разминка: вспомнить Дни 8–9<\/h2>\n<ol><li>Что такое экстракция, промывка и реэкстракция?<\/li><li>Почему разделение РЗЭ требует сотен ступеней?<\/li><li>Чем электроэкстракция отличается от электрорафинирования?<\/li><li>Откуда берутся селен и теллур?<\/li><li>Что означает 3N5 и какой продукт TMK имеет такую чистоту?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Экстракция — переход металла в органику; промывка — удаление примесей из органики; реэкстракция — возврат металла в чистый водный раствор.<\/li><li>Соседние РЗЭ почти одинаковы химически, коэффициенты разделения малы, нужны длинные каскады.<\/li><li>EW: нерастворимый анод, металл выделяется из раствора. ER: растворимый анод из чернового металла, очистка.<\/li><li>Из анодного шлама электролитического рафинирования меди.<\/li><li>99,95%; молибденовые штабики TMK.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Пирометаллургия: основные процессы<\/h3>\n<p><strong>Пирометаллургия<\/strong> (pyrometallurgy) — извлечение и рафинирование металлов при высоких температурах.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Процесс<\/th><th>Суть<\/th><th>Примеры, важные для TMK и рынка<\/th><\/tr><\/thead><tbody><tr><td><strong>Сушка<\/strong> (drying)<\/td><td>Удаление влаги<\/td><td>Концентраты перед обжигом<\/td><\/tr><tr><td><strong>Кальцинация / прокалка<\/strong> (calcination)<\/td><td>Термическое разложение<\/td><td><strong>APT → оксиды вольфрама<\/strong> (жёлтый WO₃ или «синий» оксид); <strong>α→β сподумен<\/strong> (≈ 1 050–1 100 °C); оксалаты РЗЭ → оксиды<\/td><\/tr><tr><td><strong>Обжиг<\/strong> (roasting): окислительный, сульфатизирующий, хлорирующий, восстановительный<\/td><td>Химическое превращение твёрдого вещества в газовой среде<\/td><td><strong>Окислительный обжиг молибденита<\/strong> MoS₂ → MoO₃ в многоподовых печах (≈ 600–650 °C) с <strong>возгонкой рения<\/strong>; обжиг цинковых концентратов в кипящем слое<\/td><\/tr><tr><td><strong>Плавка<\/strong> (smelting): восстановительная, на штейн<\/td><td>Расплавление с разделением на металл / штейн и шлак<\/td><td>Медь и никель: взвешенная плавка (flash smelting), плавка в ванне (Isasmelt, Ausmelt / TSL, <strong>печь Ванюкова<\/strong> — российская технология); железо — доменная печь<\/td><\/tr><tr><td><strong>Конвертирование<\/strong> (converting)<\/td><td>Продувка штейна воздухом → черновая медь<\/td><td>Конвертеры Пирса–Смита<\/td><\/tr><tr><td><strong>Огневое рафинирование<\/strong> (fire refining)<\/td><td>Очистка расплава<\/td><td>Медь перед электрорафинированием<\/td><\/tr><tr><td><strong>Металлотермия<\/strong> (metallothermic reduction)<\/td><td>Восстановление оксида более активным металлом (Al, Si, Ca, Mg)<\/td><td><strong>Ферромолибден<\/strong> (силико- и алюминотермия) — продукт TMK; кальциетермическое получение Tb и Dy; процесс Кролла (Ti, Zr — магнием)<\/td><\/tr><tr><td><strong>Восстановление водородом<\/strong> (hydrogen reduction)<\/td><td>Оксид или соль + H₂ → металлический порошок<\/td><td><strong>W, Mo, Re<\/strong> — основа Чирчика (подробно в 1.3)<\/td><\/tr><tr><td><strong>Карботермия / карбидизация<\/strong><\/td><td>Восстановление или науглероживание углеродом<\/td><td><strong>W + C → WC<\/strong> (карбид вольфрама)<\/td><\/tr><tr><td><strong>Возгонка, дистилляция<\/strong> (volatilization)<\/td><td>Перевод летучих соединений в газ<\/td><td>Re₂O₇ при обжиге молибденита; MoO₃ (возгоночный, высокой чистоты)<\/td><\/tr><tr><td><strong>Электродуговые и руднотермические печи<\/strong> (EAF / SAF)<\/td><td>Плавка электричеством<\/td><td>Ферросплавы, переработка шлаков, ильменит → титановый шлак<\/td><\/tr><tr><td><strong>Вакуумная и электронно-лучевая плавка<\/strong><\/td><td>Плавка и рафинирование в вакууме<\/td><td>Тугоплавкие металлы, суперсплавы<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Вспомогательные системы — тоже источник вакансий:<\/strong><\/p>\n<ul><li><strong>Газоочистка<\/strong> (off-gas handling): котлы-утилизаторы, электрофильтры, рукавные фильтры, мокрая очистка (здесь улавливают рений).<\/li><li><strong>Сернокислотное производство<\/strong> (acid plant): SO₂ из обжига и плавки → серная кислота (контактный процесс).<\/li><li><strong>Огнеупоры<\/strong> (refractories): футеровка печей. TMK сама выпускает огнеупорную и футеровочную продукцию.<\/li><li><strong>Шлаки<\/strong> (slags): состав, основность, вязкость; флюсы (кварц, известняк).<\/li><\/ul>\n<p><strong>Безопасность:<\/strong> расплавы (взрыв при контакте с водой), SO₂, CO, водород (взрывоопасен — критично для печей восстановления W, Mo, Re), выпуск расплава из печи.<\/p>\n<h3>1.2 Порошковая металлургия: основы<\/h3>\n<p><strong>Порошковая металлургия<\/strong> (powder metallurgy, PM) — изготовление металлов, сплавов и изделий <strong>из порошков<\/strong> прессованием и спеканием, без полного расплавления. Для <strong>тугоплавких металлов<\/strong> (W плавится при ≈ 3 420 °C, Mo — ≈ 2 620 °C, Re — ≈ 3 190 °C) это часто <strong>единственный практичный путь<\/strong> к изделию.<\/p>\n<p><strong>Технологическая цепочка:<\/strong><\/p>\n<pre class=\"code\"><code>ПОРОШОК (получение) → ХАРАКТЕРИЗАЦИЯ → СМЕШИВАНИЕ (связка, пластификатор, смазка)\n→ ФОРМОВАНИЕ (прессование в пресс-форме, изостатическое прессование, экструзия, инжекционное формование MIM)\n→ СПЕКАНИЕ (ниже температуры плавления основы: твердофазное или жидкофазное; H₂, вакуум, азот-водород)\n→ [ГИП — горячее изостатическое прессование; спекание с газостатом (sinter-HIP)]\n→ ДООБРАБОТКА (калибровка, шлифование, мехобработка, термообработка, покрытия) → КОНТРОЛЬ → ИЗДЕЛИЕ<\/code><\/pre>\n<p><strong>Способы получения порошков:<\/strong><\/p>\n<ul><li><strong>восстановление<\/strong> — W, Mo, Re (водородом), железо (губчатое);<\/li><li><strong>распыление расплава<\/strong> (atomization): водой — стальные порошки для конструкционных деталей; газом — суперсплавы, титан, порошки для 3D-печати;<\/li><li><strong>электролиз<\/strong> — медь;<\/li><li><strong>карбонильный процесс<\/strong> — Fe, Ni;<\/li><li><strong>плазменная сфероидизация<\/strong> — сферические порошки W, Re, Ta для аддитивных технологий.<\/li><\/ul>\n<p><strong>Характеристики порошка<\/strong> (язык технолога PM):<\/p>\n<ul><li>гранулометрический состав (лазерная дифракция, ситовой анализ);<\/li><li><strong>размер частиц по Фишеру (FSSS)<\/strong> — стандарт для порошков W, Mo, Re. В спецификации рения TMK указано <strong>3,0–7,5 мкм по Фишеру<\/strong>;<\/li><li>насыпная плотность и плотность утряски; текучесть (воронка Холла);<\/li><li>содержание кислорода и углерода;<\/li><li>морфология (СЭМ), удельная поверхность (BET).<\/li><\/ul>\n<p><strong>Аддитивные технологии<\/strong> (additive manufacturing, 3D-печать металлом): селективное лазерное сплавление (L-PBF), электронно-лучевое сплавление, струйная печать связующим (binder jetting). Для W и Mo это сложно, но развивается быстро.<\/p>\n<h3>1.3 Цепочки TMK: вольфрам, твёрдые сплавы, молибден, рений<\/h3>\n<p><strong>А) Вольфрам: от APT до штабика и проволоки<\/strong><\/p>\n<pre class=\"code\"><code>APT → ПРОКАЛКА → оксиды вольфрама (WO₃ жёлтый / синий оксид WO₂.₉)\n→ ВОССТАНОВЛЕНИЕ ВОДОРОДОМ (проходные или трубчатые печи, ≈ 600–1 000 °C)\n     → порошок W. Крупность (от долей до десятков мкм по Фишеру) задают температурой, влажностью H₂, высотой слоя\n→ ПРЕССОВАНИЕ → СПЕКАНИЕ (в водороде; классика — высокотемпературная «сварка» штабиков пропусканием тока)\n→ ШТАБИКИ W (у TMK — ≥ 99,8% W) → ковка, волочение → прутки, проволока, электроды\n     (иттрированные прутки СВИ-1 у TMK — W + Y₂O₃: электроды для сварки и плазменной резки)<\/code><\/pre>\n<p><strong>Б) Твёрдые сплавы (cemented carbides) — флагман Чирчика<\/strong><\/p>\n<pre class=\"code\"><code>Порошок W + сажа → КАРБИДИЗАЦИЯ (≈ 1 400–1 600 °C) → порошок WC (карбид вольфрама)\n→ ПРИГОТОВЛЕНИЕ СМЕСИ: WC + кобальт (+ ингибиторы роста зерна VC, Cr₃C₂) + пластификатор (воск или ПЭГ)\n     → размол в шаровых мельницах или аттриторах → распылительная сушка (гранулы)\n→ ПРЕССОВАНИЕ (пластины, коронки, фильеры) → ЖИДКОФАЗНОЕ СПЕКАНИЕ (≈ 1 350–1 500 °C, вакуум или sinter-HIP;\n     кобальт плавится и «склеивает» зёрна WC)\n→ ШЛИФОВКА, заточка, покрытия (CVD, PVD) → изделия: режущие пластины, свёрла, фрезы, горный инструмент, буровые коронки<\/code><\/pre>\n<p><strong>Марки:<\/strong><\/p>\n<ul><li>советские/российские (ГОСТ 3882-74): <strong>ВК6, ВК8<\/strong> — WC + 6 или 8% Co (цифра — процент кобальта); <strong>ТК<\/strong> (например, Т15К6 — WC + 15% TiC + 6% Co) — для обработки сталей; <strong>ТТК<\/strong> — с TaC;<\/li><li>международные: группы применения <strong>ISO 513 — P, M, K, N, S, H<\/strong> (стали, нержавеющие стали, чугуны, цветные металлы, жаропрочные сплавы, закалённые материалы).<\/li><\/ul>\n<p>Кандидат из западной компании будет говорить на языке ISO, кандидат из СНГ — на языке ГОСТ. Ценен тот, кто свободно говорит на обоих.<\/p>\n<p><strong>Ключевые параметры качества твёрдого сплава:<\/strong><\/p>\n<ul><li>размер зерна WC (наномелкозернистые, ультрамелкие, мелкие, средние, крупные);<\/li><li>содержание кобальта, плотность, твёрдость (HV, HRA), прочность на изгиб, коэрцитивная сила и магнитное насыщение (косвенный контроль углеродного баланса);<\/li><li>пористость (по ISO 4505);<\/li><li><strong>углеродный баланс<\/strong> (η-фаза при недостатке углерода, свободный углерод при избытке) — классическая головная боль технолога.<\/li><\/ul>\n<p><strong>В) Молибден: от концентрата до штабика и ферромолибдена<\/strong><\/p>\n<pre class=\"code\"><code>Молибденитовый концентрат MoS₂ (например, от Cu–Mo разделения АГМК)\n→ ОКИСЛИТЕЛЬНЫЙ ОБЖИГ (многоподовая печь, ≈ 600–650 °C): MoS₂ → MoO₃ (технический оксид молибдена)\n     + SO₂ (→ серная кислота) + Re₂O₇ в газах (→ улавливание рения)\n→ путь 1: МЕТАЛЛОТЕРМИЯ → ФЕРРОМОЛИБДЕН (ФМо60, ФМо70 — продукт TMK; для легирования сталей)\n→ путь 2: ХИМИЧЕСКАЯ ОЧИСТКА (аммиачное выщелачивание → молибдаты аммония (ADM, AHM) → прокалка → чистый MoO₃)\n     → ДВУХСТАДИЙНОЕ ВОССТАНОВЛЕНИЕ ВОДОРОДОМ (MoO₃ → MoO₂ → Mo) → порошок Mo\n     → прессование → спекание (≈ 1 800–2 000 °C в водороде) → ШТАБИКИ / БРИКЕТЫ Mo (у TMK 99,8–99,95%)\n     → прокатка, ковка, волочение → листы, прутки, проволока; сплавы TZM, лантанированный Mo<\/code><\/pre>\n<p><strong>Г) Рений: от газов до порошка<\/strong><\/p>\n<pre class=\"code\"><code>Газы обжига молибденита / растворы → мокрая газоочистка → сорбция или экстракция → десорбция\n→ кристаллизация ПЕРРЕНАТА АММОНИЯ (APR, NH₄ReO₄) → восстановление водородом\n→ ПОРОШОК РЕНИЯ (у TMK: 99,9%, частицы 3,0–7,5 мкм по Фишеру)\n→ (далее у потребителей) прессование и спекание: штабики, гранулы → легирование суперсплавов; катализаторы<\/code><\/pre>\n<h3>1.4 Smart Powder и конструкционная порошковая металлургия<\/h3>\n<p>Smart Powder — направление TMK по прецизионным металлическим изделиям методом порошковой металлургии с корейскими технологическими партнёрами. План экспорта — Корея, США, Малайзия, Мексика; первый транш 2026 г. включает <strong>автодетали методом порошковой металлургии<\/strong>. Это <strong>конструкционная порошковая металлургия<\/strong> (press-and-sinter): массовые детали из железных и стальных порошков.<\/p>\n<ul><li><strong>Типовые изделия:<\/strong> шестерни, звёздочки, детали масляных насосов, втулки и самосмазывающиеся подшипники, детали систем газораспределения (VVT), магнитомягкие детали.<\/li><li><strong>Ключевые технологии:<\/strong> прессы (механические, гидравлические, с ЧПУ), <strong>пресс-инструмент<\/strong> (матрицы и пуансоны; проектирование оснастки — отдельная редкая профессия), проходные печи спекания с защитной атмосферой, калибровка, термообработка, паровое оксидирование, мехобработка, контроль размеров (КИМ).<\/li><li><strong>Стандарты:<\/strong> <strong>IATF 16949<\/strong> (качество в автопроме), <strong>PPAP / APQP<\/strong> (одобрение производства деталей), MPIF Standard 35 (материалы PM).<\/li><li><strong>Ассоциации и выставки:<\/strong> MPIF (США), EPMA (Европа); конференции PowderMet, World PM Congress, Euro PM; для тугоплавких металлов и твёрдых сплавов — <strong>Plansee Seminar<\/strong> (Ройтте, Австрия) и мероприятия ITIA. Списки докладчиков этих конференций — готовые лонг-листы экспертов.<\/li><\/ul>\n<h3>1.5 Итог модуля 2 на одной странице<\/h3>\n<pre class=\"code\"><code>РУДОПОДГОТОВКА: дробление → измельчение (P80) → классификация; раскрытие; энергия\nОБОГАЩЕНИЕ: гравитация (плотность) / флотация (поверхность, реагенты) / магнитная (восприимчивость) / сортировка\n     → концентрат; формула извлечения; компромисс «качество — извлечение»\nГИДРОМЕТАЛЛУРГИЯ: выщелачивание → очистка (осаждение, ионный обмен, экстракция) → продукт (кристаллизация, электролиз)\nЭКСТРАКЦИЯ / ЭЛЕКТРОЛИЗ / РАФИНИРОВАНИЕ: каскады (РЗЭ), EW / ER, шламы → Se, Te; чистота 3N–6N; GDMS\nПИРОМЕТАЛЛУРГИЯ: обжиг (MoS₂ → MoO₃ + Re), прокалка (APT → WO₃), металлотермия (FeMo), восстановление H₂ (W, Mo, Re)\nПОРОШКОВАЯ МЕТАЛЛУРГИЯ: порошок → прессование → спекание → изделие; твёрдые сплавы ВК; Smart Powder<\/code><\/pre>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Пирометаллургия<\/td><td>Pyrometallurgy<\/td><td>Металлургия высоких температур<\/td><\/tr><tr><td>Прокалка<\/td><td>Calcination<\/td><td>Термическое разложение соединения<\/td><\/tr><tr><td>Обжиг<\/td><td>Roasting<\/td><td>Химическое превращение твёрдого вещества в газовой среде при нагреве<\/td><\/tr><tr><td>Многоподовая печь<\/td><td>Multiple hearth furnace (MHF)<\/td><td>Печь для обжига молибденита<\/td><\/tr><tr><td>Плавка<\/td><td>Smelting<\/td><td>Расплавление с разделением фаз<\/td><\/tr><tr><td>Штейн<\/td><td>Matte<\/td><td>Сульфидный расплав Cu, Ni, Fe<\/td><\/tr><tr><td>Шлак<\/td><td>Slag<\/td><td>Оксидный расплав пустой породы и флюсов<\/td><\/tr><tr><td>Флюс<\/td><td>Flux<\/td><td>Добавка для формирования шлака<\/td><\/tr><tr><td>Конвертирование<\/td><td>Converting<\/td><td>Продувка штейна воздухом<\/td><\/tr><tr><td>Металлотермия<\/td><td>Metallothermic reduction<\/td><td>Восстановление оксида активным металлом<\/td><\/tr><tr><td>Ферромолибден<\/td><td>Ferromolybdenum (FeMo)<\/td><td>Сплав Fe–Mo для легирования сталей<\/td><\/tr><tr><td>Восстановление водородом<\/td><td>Hydrogen reduction<\/td><td>Получение металлических порошков из оксидов и солей<\/td><\/tr><tr><td>Карбидизация<\/td><td>Carburization<\/td><td>Получение карбида (W + C → WC)<\/td><\/tr><tr><td>Газоочистка<\/td><td>Off-gas cleaning / gas handling<\/td><td>Улавливание пыли, SO₂ и ценных компонентов из газов<\/td><\/tr><tr><td>Огнеупоры<\/td><td>Refractories<\/td><td>Материалы футеровки печей<\/td><\/tr><tr><td>Порошковая металлургия<\/td><td>Powder metallurgy (PM)<\/td><td>Изделия из порошков прессованием и спеканием<\/td><\/tr><tr><td>Распыление расплава<\/td><td>Atomization<\/td><td>Получение порошка распылением жидкого металла<\/td><\/tr><tr><td>Размер частиц по Фишеру<\/td><td>Fisher sub-sieve size (FSSS)<\/td><td>Стандартная характеристика порошков W, Mo, Re<\/td><\/tr><tr><td>Насыпная плотность<\/td><td>Apparent density<\/td><td>Плотность свободно насыпанного порошка<\/td><\/tr><tr><td>Прессование<\/td><td>Compaction / pressing<\/td><td>Формование порошка в пресс-форме<\/td><\/tr><tr><td>Изостатическое прессование<\/td><td>Isostatic pressing (CIP / HIP)<\/td><td>Прессование равномерным давлением (холодное / горячее)<\/td><\/tr><tr><td>Спекание<\/td><td>Sintering<\/td><td>Нагрев прессовки ниже температуры плавления для упрочнения<\/td><\/tr><tr><td>Жидкофазное спекание<\/td><td>Liquid phase sintering<\/td><td>Спекание с расплавлением связки (Co в твёрдом сплаве)<\/td><\/tr><tr><td>Твёрдый сплав<\/td><td>Cemented carbide / hardmetal<\/td><td>Композит WC + Co<\/td><\/tr><tr><td>Карбид вольфрама<\/td><td>Tungsten carbide (WC)<\/td><td>Основа твёрдых сплавов<\/td><\/tr><tr><td>Штабик<\/td><td>Sintered bar / ingot (W, Mo)<\/td><td>Спечённая заготовка для ковки и волочения<\/td><\/tr><tr><td>Инжекционное формование металлов<\/td><td>Metal injection molding (MIM)<\/td><td>Литьё смеси порошка и связки под давлением<\/td><\/tr><tr><td>Аддитивные технологии<\/td><td>Additive manufacturing (AM)<\/td><td>3D-печать металлами<\/td><\/tr><tr><td>Пресс-инструмент (оснастка)<\/td><td>Tooling (dies and punches)<\/td><td>Матрицы и пуансоны для прессования<\/td><\/tr><tr><td>Одобрение производства деталей<\/td><td>PPAP (production part approval process)<\/td><td>Процедура автопрома для запуска детали<\/td><\/tr><tr><td>Перренат аммония<\/td><td>Ammonium perrhenate (APR)<\/td><td>Соединение рения перед восстановлением<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли Чирчика и Smart Powder<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Технолог восстановления порошков W, Mo, Re<\/td><td>Powder Production Engineer (Hydrogen Reduction)<\/td><td>Тип печей, управление крупностью (FSSS), кислород в порошке<\/td><td>★★★<\/td><\/tr><tr><td>Технолог твёрдых сплавов<\/td><td>Hardmetal / Cemented Carbide Process Engineer<\/td><td>Марки (ВК и ТК / ISO), размер зерна, углеродный баланс, sinter-HIP, брак<\/td><td>★★★<\/td><\/tr><tr><td>Технолог обжига молибденита<\/td><td>Roasting Engineer (MHF)<\/td><td>Производительность печей, остаточная сера, извлечение рения в газоочистке<\/td><td>★★★<\/td><\/tr><tr><td>Технолог металлотермии<\/td><td>Ferroalloy / Metallothermic Process Engineer<\/td><td>Плавки FeMo, извлечение Mo, шлаки<\/td><td>★★<\/td><\/tr><tr><td>Инженер по печам и огнеупорам<\/td><td>Furnace / Refractory Engineer<\/td><td>Тип печей, кампании футеровки, ремонты<\/td><td>★★<\/td><\/tr><tr><td>Технолог порошковой металлургии (конструкционные детали)<\/td><td>PM Process Engineer (Press &amp; Sinter)<\/td><td>Номенклатура деталей, плотность, допуски, процент брака<\/td><td>★★<\/td><\/tr><tr><td>Конструктор пресс-инструмента<\/td><td>Tooling Design Engineer (PM)<\/td><td>Проектирование матриц и пуансонов, CAD/CAE<\/td><td>★★★<\/td><\/tr><tr><td>Инженер по качеству (автопром)<\/td><td>Quality Engineer (IATF 16949, PPAP)<\/td><td>Запуск деталей для автопроизводителей, аудиты<\/td><td>★★<\/td><\/tr><tr><td>Металловед / инженер-исследователь<\/td><td>Materials Scientist / Metallographer<\/td><td>Металлография, СЭМ, механические испытания<\/td><td>★★<\/td><\/tr><tr><td>Начальник производства твёрдых сплавов / PM<\/td><td>Production Manager (Hardmetal / PM)<\/td><td>Объёмы, численность, OEE, внедрения<\/td><td>★★–★★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>(Твёрдые сплавы) «Как вы контролировали углеродный баланс и что делали при η-фазе?»<\/td><td>Магнитное насыщение, коэрцитивная сила, корректировка смесей, атмосфера печи<\/td><td>Не знает термина<\/td><\/tr><tr><td>«Какое спекание: вакуум или sinter-HIP? Какой процент брака и основные причины?»<\/td><td>Цифры, причины (пористость, трещины, коробление), решения<\/td><td>«Брака почти не было»<\/td><\/tr><tr><td>(Порошки W) «Как вы управляли крупностью порошка по Фишеру?»<\/td><td>Температура, влажность водорода, высота слоя, скорость подачи<\/td><td>Не знает FSSS<\/td><\/tr><tr><td>(Mo) «Какая остаточная сера в обожжённом оксиде? Какое извлечение рения в газоочистке?»<\/td><td>Конкретные цифры, режимы печи<\/td><td>Не связывает обжиг и рений<\/td><\/tr><tr><td>(PM-автопром) «Какие детали вы запускали? Какие этапы PPAP?»<\/td><td>Номенклатура, клиенты, этапы, сроки<\/td><td>Не знает PPAP<\/td><\/tr><tr><td>«Какой ваш самый сложный технологический провал и что вы изменили?»<\/td><td>Честный разбор с цифрами<\/td><td>«Провалов не было»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Доноры<\/th><\/tr><\/thead><tbody><tr><td>Твёрдые сплавы и порошки W<\/td><td><strong>Sandvik Coromant<\/strong>, <strong>Kennametal<\/strong>, <strong>Ceratizit<\/strong> и <strong>Plansee<\/strong>, <strong>IMC Group<\/strong> (Iscar, TaeguTec — Корея), Mitsubishi Materials, Sumitomo Electric (A.L.M.T.), <strong>KORLOY<\/strong> (Корея), <strong>H.C. Starck Tungsten<\/strong> (Mitsubishi Materials), <strong>Global Tungsten &amp; Powders<\/strong>, Wolfram Bergbau und Hütten, Xiamen Tungsten / ZCC (Китай); предприятия СНГ (Кировградский завод твёрдых сплавов, «Победит», МКТС и др. — с обязательной проверкой санкционных ограничений)<\/td><\/tr><tr><td>Молибден (обжиг, FeMo, металл)<\/td><td><strong>Molymet<\/strong>, Freeport-McMoRan (Climax Molybdenum), Plansee, Thompson Creek / Centerra (Langeloth), АГМК, производители ферросплавов Казахстана<\/td><\/tr><tr><td>Рений<\/td><td>Molymet, KGHM, Rhenium Alloys (США), производители суперсплавов (Cannon-Muskegon, PCC и др.)<\/td><\/tr><tr><td>Конструкционная PM (автопром)<\/td><td>GKN Powder Metallurgy, Miba, Sumitomo Electric Sintered Alloy, Höganäs (порошки), корейские и индийские производители PM-деталей, производители в Турции и Мексике<\/td><\/tr><tr><td>Наука и обучение<\/td><td>TU Bergakademie Freiberg, МИСИС (оба — партнёры TMK), Montanuniversität Leoben (Австрия), KIGAM и KIMS (Корея), Tohoku University (Япония), ТашГТУ<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Кейс-финал модуля 2: три цепочки TMK<\/h2>\n<p><strong>Задание (40 мин).<\/strong> Для каждой цепочки — <strong>вольфрам (до пластины ВК8), молибден (до штабика и FeMo), рений (до порошка)<\/strong> — заполните таблицу:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Передел<\/th><th>Процесс и ключевые условия<\/th><th>Продукт на выходе<\/th><th>Ключевая роль (RU / EN)<\/th><th>Дефицит (★–★★★)<\/th><th>3 компании-донора<\/th><th>1 вопрос для скрининга<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p><strong>Критерии качества:<\/strong><\/p>\n<ul><li>цепочка полная и в правильном порядке;<\/li><li>у каждой роли — две версии названия (RU / EN);<\/li><li>доноры соответствуют переделу, а не просто «металлу»;<\/li><li>вопросы проверяют реальный опыт (цифры, термины, причинность).<\/li><\/ul>\n<p><strong>Teach-back.<\/strong> Объясните одну цепочку технологу Чирчика за 10 минут и попросите оценить точность по шкале 1–10. Запишите его поправки — это золото.<\/p>\n<hr>\n<h2>6. Рефлексия: итог модуля 2 и трети программы<\/h2>\n<ol><li>Пройдите <strong>входной тест из Дня 1<\/strong> ещё раз. Сравните с первым результатом и с результатом после Дня 5.<\/li><li>Какое знание из Модуля 2 вы <strong>уже применили<\/strong> в реальной работе? Если никакое — примените на этой неделе на одной вакансии Чирчика.<\/li><li><strong>Teach-back<\/strong> выполнен? Какую оценку поставил технолог? Что исправил?<\/li><li><strong>Обязательство:<\/strong> «Модуль 3 начинаю ___ (дата) в ___:___».<\/li><\/ol>\n<blockquote><p><strong>Правило модуля:<\/strong> 10 дней из 30. Вы прошли путь от «что такое руда» до «как контролировать углеродный баланс твёрдого сплава». Большинство рекрутеров отрасли не проходят его никогда. Дальше будет интереснее и ближе к ежедневной работе: РЗЭ и критические минералы, затем лаборатории и оборудование, затем сам технический подбор. Не останавливайтесь сейчас: инерция — ваш главный союзник.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>R. German, <em>Powder Metallurgy Science<\/em> (MPIF) — классический учебник порошковой металлургии.<\/li><li>E. Lassner, W.-D. Schubert, <em>Tungsten<\/em> (Springer) — главы о порошках, карбидах и твёрдых сплавах.<\/li><li>Зеликман А. Н. «Металлургия тугоплавких редких металлов» — классика советской школы.<\/li><li>ITIA и IMOA — публикации о переработке W и Mo; MPIF и EPMA — образовательные материалы по порошковой металлургии.<\/li><li>Сборники Plansee Seminar — доклады по тугоплавким металлам и твёрдым сплавам (и имена экспертов).<\/li><li>Видео: «how tungsten carbide inserts are made», «powder metallurgy process animation», «molybdenum production process».<\/li><\/ul>"}],"profileHtml":"<h1>Профиль TMK для Executive Search<\/h1>\n<blockquote><p><strong>Что это.<\/strong> Выжимка публичной информации об АО «Узбекский комбинат технологических металлов» (ТМК, UzTMK) и выводы из неё для подбора. <strong>Срез данных:<\/strong> сайт <a href=\"https://uztmk.uz/ru\" target=\"_blank\" rel=\"noopener\">uztmk.uz/ru<\/a> (просмотрен 02.11.2026) и публикации 2024–2026 гг. (ссылки в конце). <strong>Как читать.<\/strong> Факты даны со ссылкой на источник. Всё, что помечено <strong>[Аналитика]<\/strong>, — это мои выводы для подбора, а не официальная позиция компании. Цифры из СМИ и пресс-релизов — это заявления и планы, а не проверенная отчётность.<\/p><\/blockquote>\n<hr>\n<h2>1. TMK за 60 секунд<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Параметр<\/th><th>Что известно<\/th><\/tr><\/thead><tbody><tr><td>Полное название<\/td><td>АО «Узбекский комбинат технологических металлов» (ТМК / UzTMK / UKTM)<\/td><\/tr><tr><td>Создание<\/td><td>Июнь 2024 г., постановлением Президента, на базе НПО «Редкие металлы и твердые сплавы», входившего в АО «Алмалыкский ГМК» (АГМК). По данным ЕГРПО на момент создания учредитель — АГМК (100%), уставный капитал — 257 млрд сумов<\/td><\/tr><tr><td>Историческая база<\/td><td>Чирчикское производство тугоплавких металлов и твёрдых сплавов. Узбекский комбинат тугоплавких и жаропрочных металлов (УзКТЖМ) был присоединён к АГМК (отражено в бизнес-плане АГМК на 2017 г.), затем работал как НПО «Редкие металлы и твердые сплавы» в составе АГМК, а в 2024 г. на его базе создан ТМК<\/td><\/tr><tr><td>Штаб-квартира<\/td><td>Ташкентская обл., г. Чирчик, ул. Вохида Хайдарова, 1<\/td><\/tr><tr><td>Площадки на карте активов (сайт)<\/td><td>г. Чирчик · Ахангаранский район · Самаркандская область<\/td><\/tr><tr><td>Бизнес-модель<\/td><td>Вертикальная интеграция «месторождение — металл — рынок»: upstream (добыча → концентраты), midstream (производство металлов), downstream (готовые изделия)<\/td><\/tr><tr><td>Масштаб планов<\/td><td>2026–2030 гг.: 120 инвестиционных проектов на $4,2 млрд по данным правительства (на сайте указано «более 140 проектов» и «свыше 30 видов стратегического сырья»). Цель — выпуск на $1 млрд к 2028 г. и $2 млрд к 2030 г.<\/td><\/tr><tr><td>Первый транш (2026)<\/td><td>12 проектов на $166 млн: высокочистые селен, теллур и рений; 21 импортозамещающий продукт, включая автодетали методом порошковой металлургии и серную кислоту<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Главная мысль для рекрутера.<\/strong> TMK — не «ещё одна горнодобывающая компания». Это <strong>государственный интегратор критических металлов<\/strong>, который одновременно:<\/p>\n<ol><li>Модернизирует советскую базу тугоплавких металлов (вольфрам, молибден, твёрдые сплавы по ГОСТ).<\/li><li>Строит новые переделы: рений, Se/Te, графит, серная кислота, порошковая металлургия, РЗЭ и рений из растворов.<\/li><li>Выходит на рынки США, ЕС, Кореи и Японии с их стандартами: JORC, RMI/RMAP, ESG, прослеживаемость.<\/li><\/ol>\n<p>Отсюда главный кадровый вызов: нужны люди, которые <strong>соединяют советскую инженерную школу и международные стандарты<\/strong>. Таких на рынке очень мало.<\/p>\n<hr>\n<h2>2. Активы, продукты и проекты<\/h2>\n<h3>2.1 Действующая продукция (по каталогу на сайте)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Группа<\/th><th>Продукты и характеристики<\/th><th>Что это говорит о технологиях<\/th><\/tr><\/thead><tbody><tr><td><strong>Вольфрам<\/strong><\/td><td>Штабики W ≥ 99,8%; спечённые брикеты W ≥ 99,29%; твёрдые сплавы марок ВК6/ВК8 по ГОСТ 3882-74: напаиваемые пластины, сменные многогранные пластины, изделия для горного инструмента, волоки (фильеры), свёрла, фрезы; иттрированные прутки СВИ-1 (W + 1,5–2,3% Y₂O₃); композиционный наплавочный пруток (ВК8 + латунь + никель)<\/td><td>Восстановление оксидов водородом → порошок W → прессование и спекание → штабики. Карбидизация → WC → твёрдый сплав WC–Co → прессование, спекание, шлифовка. Это <strong>порошковая металлургия тугоплавких металлов<\/strong> — редкая компетенция<\/td><\/tr><tr><td><strong>Молибден<\/strong><\/td><td>Брикеты Mo 99,8%; штабики Mo 99,95%; ферромолибден ФМо60/ФМо70 (ГОСТ 4759-91)<\/td><td>Химико-металлургическая переработка молибденового сырья → порошок Mo → спекание. Металлотермия для ферромолибдена<\/td><\/tr><tr><td><strong>Рений<\/strong><\/td><td>Рений металлический (порошок, средний диаметр частиц по Фишеру 3,0–7,5 мкм; классы 99,906% / 99,829%; отдельная марка 99,54%). Применение — катализаторы нефтепереработки, легирование. Первый экспорт металлического рения 99,9% — июль 2025 г. (покупатель из Эстонии)<\/td><td>Улавливание рения (обычно из газов обжига молибденитового концентрата) → сорбция или экстракция → перренат аммония → восстановление водородом<\/td><\/tr><tr><td><strong>Прочее<\/strong><\/td><td>Буровые коронки; огнеупорная и футеровочная продукция<\/td><td>Горный инструмент (твёрдый сплав) и огнеупоры для металлургических печей<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>2.2 Дочерние структуры и проекты<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Структура / проект<\/th><th>Что известно<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><strong>Ингичка<\/strong> (Самаркандская обл.) — вольфрам<\/td><td>Ингичкинская обогатительная фабрика перерабатывает техногенные отходы вольфрамового рудника. 1-я очередь — 2022 г. (100 т концентрата в год), 2-я очередь — август 2024 г. (+120 рабочих мест, химико-аналитическая лаборатория, опытный цех обогащения). Планы: горнорудный вольфрамовый комплекс в регионе; рост выпуска вольфрамового концентрата с 300 т до 14 950 т после выхода новых проектов на мощность<\/td><td>gov.uz/mingeo, Kursiv (2026)<\/td><\/tr><tr><td><strong>Технопарк «Металлы будущего»<\/strong> (Kelajak metallari)<\/td><td>Индустриальная зона глубокой переработки критических и редких металлов. TMK обеспечивает резидентов сырьём (W, Mo и др.). Для резидентов — One-Stop-Shop и юридические механизмы на основе английского права. Цель — более 18 тыс. рабочих мест<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>R&amp;D Park<\/strong><\/td><td>Центральная нано-аналитическая лаборатория (фазовый состав, кристаллическая структура, свойства на наноуровне; цифровая LIMS; по плану — до 1 000 проб в сутки). Центр технологических испытаний (пробоподготовка руд и концентратов, гидрометаллургическое выделение элементов, лабораторные и опытно-промышленные испытания). Центр коммерциализации. Лабораторию создают с SGS<\/td><td>uztmk.uz, yuz.uz<\/td><\/tr><tr><td><strong>Smart Powder<\/strong><\/td><td>Порошковая металлургия: прецизионные металлические изделия. Технологии внедряются с корейскими партнёрами. План экспорта — Корея, США, Малайзия, Мексика. Есть практический учебный центр для инженеров и техников<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>TMK Chemicals<\/strong><\/td><td>Серная кислота высокой чистоты, 500 тыс. т в год. Строится в Карманинском районе Навоийской обл., вместе с 2,5 км железной дороги<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>Тасказганский графитовый проект<\/strong><\/td><td>Пешкунский район, Бухарская обл. Оператор — СП «Graphtech Mining and Production» в составе ТМК. Разведка ведётся по JORC (магниторазведка с дронов, электроразведка методом ВП/IP, геотехника). Продукт — экспортный графитовый концентрат. К 2030 г. — полная цепочка на основе графита<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>РЗЭ и рений из растворов<\/strong><\/td><td>Соглашение с Solvomet (KU Leuven, Бельгия), старт — январь 2026 г. Цель — извлечение РЗЭ и рения из продуктивных растворов (после извлечения урана) месторождений U–РЗЭ–Re Узбекистана<\/td><td>solvomet.eu<\/td><\/tr><tr><td><strong>Портфель «прочих» металлов<\/strong><\/td><td>Литий, никель, кобальт, селен, теллур, тантал-ниобий, магний, германий и др. Детали большинства проектов публично не раскрыты<\/td><td>uztmk.uz, spot.uz, timesca.com<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>2.3 Партнёры, членства, статусы<\/h3>\n<ul><li><strong>Научные и технологические партнёры (по сайту):<\/strong> НИТУ МИСИС (Россия), TU Bergakademie Freiberg (Германия), KIGAM (Корея), Пизанский университет (Италия), Стамбульский технический университет (Турция), Университет Обуда (Венгрия), JOGMEC (Япония), USGS (США). Отдельно — Solvomet KU Leuven.<\/li><li><strong>Коммерческие и финансовые соглашения (по публикациям):<\/strong><ul><li>American Resources Corp. и ReElement Technologies (США): вольфрамовый концентрат и его рафинирование в США, ноябрь 2025.<\/li><li>Cove Capital (США): меморандум.<\/li><li>SGS: лаборатория.<\/li><li>Shaanxi Non-ferrous Metals Holding Group (Китай): меморандум.<\/li><li>Евразийский банк развития: меморандум и обсуждение финансирования.<\/li><li>Великобритания: дорожная карта на 2026–2028 гг.<\/li><li>CRONIMET (Германия): переговоры, октябрь 2026.<\/li><\/ul><\/li><li><strong>Членства:<\/strong> ITIA (Международная ассоциация вольфрамовой промышленности; с марта 2025 г., первая компания Центральной Азии), MMTA, IMOA, International Lithium Association, Rare Earth Industry Association, International Magnesium Association, Critical Minerals Institute, European Critical Raw Materials Alliance, европейская ассоциация по графиту и углеродным материалам.<\/li><li><strong>Статус RMI:<\/strong> RMAP Conformant (новость от 31.10.2026). Это аудит ответственных цепочек поставок, важный для западных покупателей вольфрама.<\/li><li><strong>Кадры:<\/strong> дуальное обучение с ТашГТУ; при ТМК открыты кафедры металлургии и материаловедения; 64 студента на практике (2026). Издание Times of Central Asia прямо пишет, что этого недостаточно для 120 проектов.<\/li><\/ul>\n<hr>\n<h2>3. Рыночный контекст: почему за этих людей идёт война<\/h2>\n<ul><li><strong>Вольфрам.<\/strong> В 2025 г. мировая добыча составила около 85 тыс. т, из них Китай — около 67 тыс. т. С февраля 2025 г. Китай ввёл экспортный контроль на вольфрам, молибден, теллур, висмут и индий. К маю 2026 г. цена APT в Европе выросла примерно до $3 185 за mtu, то есть на ~900% за год (Kursiv, 2026).<\/li><li><strong>РЗЭ.<\/strong> В апреле 2025 г. Китай ограничил экспорт ряда средних и тяжёлых РЗЭ и магнитов, а с конца 2023 г. — экспорт технологий извлечения и разделения РЗЭ. Практическое следствие: <strong>знания о разделении РЗЭ вне Китая — сверхдефицит<\/strong>.<\/li><li><strong>Последствие для TMK [Аналитика].<\/strong> Проекты в США, ЕС, Корее, Японии, Австралии и Казахстане ищут тех же немногих специалистов по вольфраму, молибдену, рению и РЗЭ вне Китая, что и TMK. Выигрывает компания, чей рекрутер:<ol><li>Говорит с кандидатом на его профессиональном языке с первой минуты.<\/li><li>Знает, где эти люди работают (компании-доноры).<\/li><li>Умеет быстро отличить практика от «презентационного» эксперта.<\/li><\/ol>\n<p>Этому и учит программа.<\/p><\/li><\/ul>\n<hr>\n<h2>4. Карта потребностей в талантах [Аналитика]<\/h2>\n<p>Это гипотеза для проверки на интервью с нанимающими менеджерами, а не утверждённый план найма.<\/p>\n<p>Дефицит: ★ — на рынке хватает · ★★ — сложно · ★★★ — единицы на рынке.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление TMK<\/th><th>Ключевые роли<\/th><th>Дефицит<\/th><th>Где искать в первую очередь<\/th><\/tr><\/thead><tbody><tr><td>Вольфрам: добыча и концентрат (Самаркандская обл.)<\/td><td>Начальник рудника (подземные работы), главный геолог (опыт со скарнами, статус JORC CP), геомеханик, начальник ОФ, технолог-обогатитель (гравитация + флотация шеелита)<\/td><td>★★–★★★<\/td><td>Almonty (Сандон, Корея; Панаскейра, Португалия), Wolfram Bergbau und Hütten (Миттерзиль, Sandvik), Masan High-Tech Materials (Нуй Фао, Вьетнам), EQ Resources (Mt Carbine), Group 6 Metals, вольфрамовые проекты Казахстана, АГМК и НГМК (горные кадры)<\/td><\/tr><tr><td>Металлургия W/Mo/Re и твёрдые сплавы (Чирчик)<\/td><td>Технологи по гидрометаллургии вольфрама (APT), специалисты по восстановлению водородом и карбидизации, технологи твёрдых сплавов, специалисты по обжигу молибденита, химики по извлечению рения, инженеры по качеству<\/td><td>★★★<\/td><td>Plansee Group (вкл. Ceratizit и Global Tungsten &amp; Powders), H.C. Starck Tungsten (с 2024 г. — Mitsubishi Materials), Wolfram Bergbau und Hütten, Kennametal, Sandvik Coromant, Molymet, Climax Molybdenum (Freeport), Japan New Metals, A.L.M.T. (Sumitomo Electric), предприятия твёрдых сплавов СНГ (см. примечание о санкциях)<\/td><\/tr><tr><td>Smart Powder (порошковые изделия)<\/td><td>Технолог порошковой металлургии, специалист по спеканию, конструктор пресс-инструмента, инженер по качеству (IATF 16949, PPAP), начальник производства<\/td><td>★★<\/td><td>GKN Powder Metallurgy, Miba, Sumitomo Electric Sintered Alloy, Höganäs, корейские и индийские производители порошковых деталей<\/td><\/tr><tr><td>Графит (Тасказган)<\/td><td>Геолог-разведчик (JORC), флотатор графита, специалисты по сфероидизации и очистке (на будущее)<\/td><td>★★ (руда и концентрат) / ★★★ (анодные материалы)<\/td><td>Syrah Resources, NextSource Materials, Nouveau Monde Graphite, Talga, Imerys Graphite &amp; Carbon, POSCO Future M (аноды)<\/td><\/tr><tr><td>РЗЭ и рений из растворов<\/td><td>Гидрометаллург (экстракция и ионный обмен), химик-технолог по разделению РЗЭ, специалист по радиационной безопасности (природные радионуклиды, NORM), технолог опытной установки<\/td><td>★★★<\/td><td>Lynas, MP Materials, Neo Performance Materials (Silmet), Solvay, Iluka, Energy Fuels, Saskatchewan Research Council, ANSTO, Carester, урановые предприятия ПВ (Навоийуран, Казатомпром)<\/td><\/tr><tr><td>Высокочистые Se, Te, Re<\/td><td>Химик-технолог аффинажа, специалисты по вакуумной дистилляции, аналитик (GDMS, ICP-MS)<\/ /* ===================== State & persistence ===================== */
const LS_KEY = "mmesa-academy-v1";
function defaultState() {
  return { v: 1, createdAt: ymd(), updatedAt: 0, contract: null, days: {}, modules: {}, cards: {}, activity: {}, best: 0, settings: { sound: true }, timer: null };
}
function migrate(s) {
  const d = defaultState();
  if (!s || typeof s !== "object") return d;
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  return s;
}
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? migrate(JSON.parse(raw)) : null; } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadLocal() || defaultState();

const remote = { ref: null, writing: false, pending: false, timer: null, status: "local" };
function persist() {
  state.updatedAt = Date.now();
  saveLocal();
  if (remote.ref) { clearTimeout(remote.timer); remote.timer = setTimeout(pushRemote, 1200); }
}
async function pushRemote() {
  if (!remote.ref) return;
  if (remote.writing) { remote.pending = true; return; }
  remote.writing = true;
  try { await remote.ref.set({ state: clone(state) }); setSync("synced"); }
  catch (e) { setSync(e && e.code === "quota_exceeded" ? "full" : "error"); }
  remote.writing = false;
  if (remote.pending) { remote.pending = false; pushRemote(); }
}
function setSync(s) { remote.status = s; renderStatus(); }
async function connectRemote() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/academy");
    remote.ref = ref; setSync("connecting");
    const t = setTimeout(() => { if (remote.status === "connecting") setSync("slow"); }, 10000);
    ref.onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(t);
      const data = snap.exists ? snap.data() : null;
      const incoming = data && data.state;
      if (incoming && (incoming.updatedAt || 0) > (state.updatedAt || 0)) {
        flushJournal(); state = migrate(clone(incoming)); saveLocal(); render();
      }
      if (!snap.metadata.fromCache) setSync("synced");
    }, () => { clearTimeout(t); remote.ref = null; setSync("local"); });
  } catch (e) { /* stay local */ }
}

/* ===================== Activity, streak, unlocks ===================== */
const today = () => ymd();
function bump(kind, amount = 1) {
  const t = today();
  const a = state.activity[t] || (state.activity[t] = { checks: 0, cards: 0, focus: 0, tests: 0, newCards: 0 });
  a[kind] = (a[kind] || 0) + amount;
}
function isActive(date) {
  const a = state.activity[date];
  return !!a && (a.tests >= 1 || a.checks >= 2 || a.cards >= 15 || a.focus >= 20);
}
function firstActivity() { const ks = Object.keys(state.activity).filter(isActive).sort(); return ks[0] || null; }
function streakInfo() {
  const start = firstActivity();
  if (!start) return { current: 0, best: state.best || 0, missedYesterday: false, broken: false, activeToday: false };
  const t = today();
  const activeToday = isActive(t);
  let current = 0, gap = 0, d = activeToday ? t : addDays(t, -1);
  // Walk back: single missed days are tolerated, two in a row end the chain.
  while (diffDays(start, d) >= 0) {
    if (isActive(d)) { current++; gap = 0; } else { gap++; if (gap >= 2) break; }
    d = addDays(d, -1);
  }
  const y1 = addDays(t, -1), y2 = addDays(t, -2);
  const missedYesterday = !activeToday && !isActive(y1) && diffDays(start, y1) >= 0;
  const broken = !activeToday && !isActive(y1) && !isActive(y2) && diffDays(start, y2) >= 0;
  if (broken) current = 0;
  const best = Math.max(state.best || 0, current);
  if (best !== state.best) { state.best = best; saveLocal(); }
  return { current, best, missedYesterday, broken, activeToday };
}
const dayState = n => state.days[n] || (state.days[n] = { checks: {}, quiz: { best: null, attempts: 0, lastFailAt: 0, passedAt: null }, journal: {}, minutes: 0, mode: "full", completedAt: null });
const passed = n => { const s = state.days[n]; return !!(s && s.quiz && s.quiz.passedAt); };
const modulePassed = m => !!(state.modules[m] && state.modules[m].passedAt);
function unlockReason(n) {
  const d = DAY(n);
  if (!d) return "soon";
  if (n === 1) return null;
  if (!passed(n - 1)) return `Сначала сдайте тест Дня ${n - 1} на ${PASS}/10 или выше.`;
  const m = moduleOfDay(n);
  if (m && m.from === n && m.n > 1 && !modulePassed(m.n - 1)) return `Сначала сдайте итоговый тест Модуля ${m.n - 1} (${MODULE_PASS}/20 или выше).`;
  return null;
}
const isOpen = n => !!DAY(n) && unlockReason(n) === null;
function currentDay() {
  for (const d of DAYS) if (isOpen(d.n) && !passed(d.n)) return d.n;
  for (const d of DAYS) if (!isOpen(d.n)) return d.n;
  return null;
}
function nextAction() {
  const cd = currentDay();
  if (cd && isOpen(cd)) return { kind: "day", n: cd };
  if (cd && !isOpen(cd)) {
    const m = moduleOfDay(cd);
    if (m && m.n > 1 && !modulePassed(m.n - 1) && passed(cd - 1)) return { kind: "module", n: m.n - 1 };
  }
  const lastReady = DATA.modules.filter(m => m.ready).pop();
  if (lastReady && !modulePassed(lastReady.n)) return { kind: "module", n: lastReady.n };
  return { kind: "done" };
}
const avgScore = () => { const s = DAYS.map(d => state.days[d.n]?.quiz?.best).filter(v => v != null); return s.length ? Math.round(s.reduce((a, b) => a + b, 0) / s.length * 10) : null; };

/* ===================== Flashcards (Leitner) ===================== */
function allCards() {
  const out = [];
  for (const d of DAYS) if (isOpen(d.n)) d.terms.forEach((t, i) => out.push({ id: `${d.n}-${i}`, day: d.n, ...t }));
  return out;
}
function cardStats() {
  const cards = allCards(); const boxes = [0, 0, 0, 0, 0, 0]; let due = 0, fresh = 0; const t = today();
  for (const c of cards) { const s = state.cards[c.id]; if (!s) { fresh++; boxes[0]++; continue; } boxes[s.box]++; if (s.due <= t) due++; }
  const newLeft = Math.max(0, NEW_CARDS_PER_DAY - ((state.activity[t] || {}).newCards || 0));
  return { total: cards.length, boxes, due, fresh, newLeft, todo: due + Math.min(fresh, newLeft) };
}
let fcSession = null;
function buildSession() {
  const t = today(); const cards = allCards();
  const due = cards.filter(c => state.cards[c.id] && state.cards[c.id].due <= t);
  shuffle(due);
  const newLeft = Math.max(0, NEW_CARDS_PER_DAY - ((state.activity[t] || {}).newCards || 0));
  const fresh = cards.filter(c => !state.cards[c.id]).slice(0, newLeft);
  fcSession = { queue: [...due, ...fresh], idx: 0, shown: false, dir: fcSession?.dir || "ru", done: 0, again: new Set() };
}
function gradeCard(ok) {
  const c = fcSession.queue[fcSession.idx]; if (!c) return;
  const t = today(); const prev = state.cards[c.id];
  if (!prev) bump("newCards");
  const box = ok ? Math.min(5, (prev ? prev.box : 0) + 1) : 1;
  state.cards[c.id] = { box, due: ok ? addDays(t, LEITNER[box]) : t };
  if (!ok && !fcSession.again.has(c.id)) { fcSession.again.add(c.id); fcSession.queue.push(c); }
  bump("cards"); fcSession.done++; fcSession.idx++; fcSession.shown = false;
  persist(); renderView(); renderStatus();
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ===================== Timer ===================== */
let tickHandle = null, wakeLock = null;
function startTimer(day, idx, minutes, label) {
  state.timer = { day, idx, minutes, label, endsAt: Date.now() + minutes * 60000 };
  persist(); runTimer();
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
  toast(`Таймер: ${minutes} мин. Телефон — в другую комнату.`);
}
function stopTimer(completed) {
  const tm = state.timer; if (!tm) return;
  const spent = Math.max(0, Math.round((Date.now() - (tm.endsAt - tm.minutes * 60000)) / 60000));
  const minutes = completed ? tm.minutes : Math.min(spent, tm.minutes);
  if (minutes > 0) { bump("focus", minutes); const ds = dayState(tm.day); ds.minutes = (ds.minutes || 0) + minutes; }
  if (completed) { const ds = dayState(tm.day); if (!ds.checks[tm.idx]) { ds.checks[tm.idx] = true; bump("checks"); } beep(); toast(`Блок «${tm.label}» завершён и отмечен. Следующий — без перерыва длиннее 10 минут.`); }
  state.timer = null; flushJournal(); persist();
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  runTimer(); renderView(); renderStatus();
}
function runTimer() {
  const el = $("#timer"); clearInterval(tickHandle);
  if (!state.timer) { el.hidden = true; return; }
  const draw = () => {
    const left = state.timer.endsAt - Date.now();
    if (left <= 0) { stopTimer(true); return; }
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    el.innerHTML = `<span class="t">${pad(m)}:${pad(s)}</span><span class="l">День ${state.timer.day} · ${esc(state.timer.label)}</span><button class="btn" data-act="timer-stop" type="button">Стоп</button>`;
  };
  el.hidden = false; draw(); tickHandle = setInterval(draw, 1000);
}
function beep() {
  if (!state.settings.sound) return;
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.25); } catch (e) {}
}

function route() { const h = (location.hash || "#today").slice(1); return h || "today"; }
function render() { renderStatus(); renderView(); runTimer(); }

  const active = document.querySelector(`#tabs a[href="${tab}"]`); if (active) active.setAttribute("aria-current", "page");

function lastPromise() {
  let best = null;
  for (const [n, ds] of Object.entries(state.days)) {
    const j = ds.journal || {};
    if (j.promiseDate && (!best || j.promiseDate > best.date)) best = { date: j.promiseDate, time: j.commitTime, place: j.commitPlace, day: +n };
  }
  return best;
}
function chainHtml() {
  const t = today(); const start = firstActivity(); let cells = ""; let gap = 0;
  const days = []; for (let i = 27; i >= 0; i--) days.push(addDays(t, -i));
  for (const d of days) {
    let cls = "";
    if (isActive(d)) { cls = "on"; gap = 0; }
    else if (start && d >= start && d < t) { gap++; cls = gap >= 2 ? "broken" : "gap"; }
    else gap = 0;
    if (d === t) cls += " today";
    cells += `<i class="${cls}" title="${fmtDate(d)}${isActive(d) ? " — занятие зачтено" : ""}"></i>`;
  }
  return `<div class="chain" role="img" aria-label="Активность за 28 дней">${cells}</div><div class="chain-legend"><span class="l-on">занятие</span><span class="l-gap">один пропуск</span><span class="l-broken">два пропуска подряд</span></div>`;
}
const SYMBOLS = {1:"Ин",2:"Гл",3:"Рз",4:"Гр",5:"Пр",6:"Об",7:"Фл",8:"Гм",9:"Эк",10:"Пм"};

    out += `<div class="mod-head"><h3>Модуль ${m.n}. ${esc(m.title)}</h3><span class="small muted mono">${m.ready ? `${done}/${total}` : "в разработке"}</span></div>`;
    out += `<div class="bar-track" aria-hidden="true"><i style="width:${Math.round(done / total * 100)}%"></i></div><div class="grid30" style="margin-top:10px">`;

      if (!d) { out += `<div class="dcell soon" aria-label="День ${n}: скоро"><span class="no">${n}</span><span class="sym">··</span><span class="nm">скоро</span></div>`; continue; }

}

let daySub = "content";
let quizRun = null;

function quizHtml(d, ds) {

}

  const items = d.quiz.map((qq, i) => {
    const order = quizRun.order[i]; const pick = quizRun.answers[i]; const right = pick === qq.answer;
    return `<div class="q ${right ? "" : "is-wrong"}"><div class="qn">Вопрос ${i + 1} · ${right ? "верно" : "ошибка"}</div><div class="qt">${qq.q}</div>${order.map((oi, k) => `<label class="${oi === qq.answer ? "right" : oi === pick ? "wrong" : ""}"><span class="lt">${"АБВГ"[k]})</span><span>${qq.options[oi]}</span></label>`).join("")}<div class="ex">${qq.explain}</div></div>`;
  }).join("");
  const next = d.n + 1;
  const cta = ok
    ? (DAY(next) ? (isOpen(next) ? `<a class="btn primary" href="#day-${next}">Открыт День ${next} →</a>` : `<a class="btn primary" href="#module-${d.module}">Итоговый тест модуля →</a>`) : `<a class="btn primary" href="#module-${d.module}">Итоговый тест модуля →</a>`) + `<button class="btn" type="button" data-act="sub" data-sub="finish">Заполнить итог дня</button>`
    : `<button class="btn primary" type="button" data-act="sub" data-sub="content">Перечитать материал</button>`;
  return `<div class="stack"><div class="panel row" style="gap:18px"><span class="stamp ${ok ? "ok" : "bad"}">${ok ? "ЗАЧТЕНО" : "НЕ ЗАЧТЕНО"} · ${score}/10</span><div style="flex:1;min-width:200px"><p style="margin:0;font-weight:600">${ok ? (score === 10 ? "Без единой ошибки. Так и выглядит экспертиза." : "Зачёт. Разберите ошибки ниже — это последние пробелы дня.") : `Нужно ${PASS}/10. Повтор откроется через ${COOLDOWN_MIN} минут.`}</p><div class="row" style="margin-top:10px">${cta}</div></div></div><div class="quiz">${items}</div></div>`;
}
