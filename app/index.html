. За часовое интервью вы должны понять, кто реально запускал передел, а кто читал о нём. Ошибка стоит TMK года проекта, а вам — доверия заказчика.","checklist":[{"text":"Разминка: 5 вопросов по Дню 26 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: проверка рекомендаций (25 мин)","minutes":25},{"text":"Практика: разбор трёх учебных резюме и план проверки (60 мин)","minutes":60},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Реальный опыт","en":"Hands-on experience","def":"Личная практика в процессе"},{"ru":"Поверхностное знакомство","en":"Superficial / surface-level familiarity","def":"Знание «о процессе», а не «в процессе»"},{"ru":"Глубина знаний","en":"Depth of expertise","def":"Способность отвечать вглубь"},{"ru":"Личный вклад","en":"Individual contribution","def":"Что сделал сам кандидат"},{"ru":"Завышение должности","en":"Title inflation","def":"Название сильнее реальных функций"},{"ru":"Модные слова","en":"Buzzwords","def":"Слова без конкретного содержания"},{"ru":"Согласованность фактов","en":"Consistency","def":"Совпадение цифр и рассказа"},{"ru":"Красный флаг","en":"Red flag","def":"Сигнал риска"},{"ru":"Проверка рекомендаций","en":"Reference check","def":"Разговоры с бывшими руководителями и коллегами"},{"ru":"Неформальная рекомендация","en":"Back-channel reference","def":"Мнение знакомых коллег вне списка кандидата"},{"ru":"Проверка биографии","en":"Background check","def":"Проверка образования, работы, документов"},{"ru":"Проверка документов об образовании","en":"Education verification","def":"Подтверждение дипломов"},{"ru":"Профессиональный статус","en":"Professional registration","def":"CP, QP, Chartered Engineer и др."},{"ru":"Технический кейс","en":"Technical case study","def":"Обсуждение реальной задачи"},{"ru":"Рабочий пример","en":"Work sample","def":"Выполнение задания, похожего на работу"},{"ru":"Экспертная панель","en":"Expert panel","def":"Оценка с участием экспертов компании"},{"ru":"Свидетельство","en":"Evidence","def":"Факт, подтверждающий оценку"},{"ru":"Риск найма","en":"Hiring risk","def":"Вероятность, что кандидат не справится"},{"ru":"Меры снижения риска","en":"Risk mitigation","def":"Заместитель, обучение, цели испытательного срока"},{"ru":"Ошибка найма","en":"Mis-hire / bad hire","def":"Найм, не оправдавший ожиданий"},{"ru":"Пробел в резюме","en":"CV gap","def":"Период без работы"},{"ru":"Частая смена работы","en":"Job hopping","def":"Короткие периоды на разных местах"},{"ru":"Публичные следы","en":"Public footprint","def":"Патенты, публикации, доклады, отчёты"},{"ru":"Рекомендатель","en":"Referee","def":"Человек, дающий рекомендацию"},{"ru":"Решение о найме","en":"Hiring decision","def":"Итоговое решение по кандидату"}],"quiz":[{"q":"Какой признак сильнее всего говорит о реальном опыте?","options":["Уверенная манера речи, хороший английский, презентабельный вид и харизма","Длинный список проектов и компаний в резюме за последние годы","Громкое название последней должности и размер компании","Конкретные цифры «было → стало», компромиссы и разбор собственных ошибок"],"answer":3,"explain":"Манера речи и должность не подтверждают опыт."},{"q":"Кандидат «работал со всеми переделами от добычи до магнитов». Что это может означать?","options":["Широту без глубины — нужна проверка одного передела вглубь","Идеальный опыт для любой роли TMK от рудника до изделия","Что он работал в крупной интегрированной компании","Что у него в подчинении была большая команда"],"answer":0,"explain":"Возьмите один передел и пройдите 2–3 уровня уточнений."},{"q":"Зачем просить кандидата нарисовать схему своего передела?","options":["Чтобы проверить художественные способности, аккуратность и почерк кандидата","Чтобы сэкономить время интервью и не задавать технических вопросов","Практик рисует быстро, уверенно и с параметрами, поверхностный кандидат — с трудом","Это требование ISO 9001 к оценке технического персонала"],"answer":2,"explain":"Рисунок — быстрый тест реального знания процесса."},{"q":"Что делать, если кандидат отвечает «проблем не было, всё шло по плану»?","options":["Поверить и перейти к следующему вопросу, чтобы не задеть кандидата недоверием","Отметить как зону проверки и спросить о конкретном сбое, его диагностике и решении","Немедленно отказать: проблемы бывают у всех, значит, он неискренен","Поставить высшую оценку за стабильную работу без сбоев и аварий"],"answer":1,"explain":"На реальном производстве проблемы бывают всегда; практик о них помнит."},{"q":"Какой вопрос в рекомендации самый информативный?","options":["«Хороший ли он человек и легко ли с ним работать?»","«Как долго он у вас работал и в какой должности?»","«Какой у него был оклад и почему он ушёл?»","«Наняли бы вы его снова и на какую роль?»"],"answer":3,"explain":"Пауза и интонация в ответе часто говорят больше слов."},{"q":"Почему не стоит полагаться на «язык тела» для выявления неправды?","options":["Исследования не подтверждают надёжность таких признаков; надёжны факты, глубина и согласованность","Анализ языка тела запрещён законом при проведении собеседований в большинстве стран, включая Узбекистан","На видеоинтервью язык тела не виден, поэтому метод бесполезен","Язык тела показывает только усталость и волнение, а не неправду"],"answer":0,"explain":"Оценка строится на свидетельствах, а не на интерпретации жестов."},{"q":"Маска «лабораторный эксперт» проверяется вопросом:","options":["«Сколько у вас публикаций в журналах с высоким рейтингом и какой у вас индекс Хирша?»","«Какой у вас индекс цитирования и сколько патентов?»","«Какая была непрерывная производительность и сколько часов работы на пилоте?»","«Какое у вас образование и где вы защищали диссертацию?»"],"answer":2,"explain":"Шкала масштаба: лаборатория ≠ пилот ≠ промышленность."},{"q":"В резюме: «директор по производству» в компании из 15 человек. Что проверить?","options":["Только наличие диплома о высшем техническом образовании и его подлинность","Реальный масштаб производства, зону ответственности и технические решения","Уровень знания иностранных языков и опыт командировок","Ничего: должность директора говорит сама за себя"],"answer":1,"explain":"Завышение должности — частый случай в малых компаниях."},{"q":"Как сообщить заказчику о сомнениях в кандидате?","options":["Не сообщать о сомнениях, чтобы не сорвать поиск и сроки, а проверить кандидата на испытательном сроке","Сказать заказчику, что кандидат вам лично не понравился","Сразу исключить кандидата из шорт-листа без объяснений","Изложить факты и предложить проверку: интервью с экспертом, кейс, дополнительную рекомендацию"],"answer":3,"explain":"Различайте «не подтверждено» и «опровергнуто»."},{"q":"Сомнение в ключевом опыте кандидата на важную роль следует решать:","options":["В пользу дополнительной проверки, потому что она дешевле ошибки найма","В пользу кандидата, чтобы не терять время и не затягивать поиск","Жребием между двумя финалистами, чтобы избежать субъективности","Голосованием всех сотрудников отдела, где будет работать кандидат"],"answer":0,"explain":"Дополнительный разговор или рекомендация стоят часы; ошибка найма — месяцы и годы."}],"html":"<h2>0. Разминка: вспомнить День 26<\/h2>\n<ol><li>Чем структурированное интервью отличается от свободной беседы?<\/li><li>Что такое метод воронки и «правило двух уровней»?<\/li><li>Назовите семь типов вопросов интервью.<\/li><li>Как правильно вести заметки?<\/li><li>Назовите три ошибки интервьюера.<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Заранее заданные вопросы, привязка к критериям, шкала с описаниями, независимые оценки.<\/li><li>Уточнение от общего к цифрам и причинам; практик отвечает на 2–3 уровня вглубь, поверхностный кандидат обрывается.<\/li><li>Поведенческий, ситуационный, технический на глубину, «научите меня», цифровой, провал и уроки, контрфактический.<\/li><li>Факты и цитаты (цифры, решения, результаты), а не впечатления.<\/li><li>Говорить больше кандидата, подсказывать ответ, принимать «мы» за «я», не доходить до цифр, эффект ореола, решение в первые минуты.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Признаки реального опыта<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Признак<\/th><th>Как звучит<\/th><\/tr><\/thead><tbody><tr><td><strong>Конкретные цифры с правильными единицами<\/strong><\/td><td>«Извлечение по W выросло с 74 до 79%, расход соды снизили на 12% на тонну концентрата»<\/td><\/tr><tr><td><strong>Диапазоны и изменчивость<\/strong><\/td><td>«В обычные смены кислород держался 800–1 000 ppm, при сбое влажности водорода уходил за 1 500»<\/td><\/tr><tr><td><strong>Компромиссы и причины<\/strong><\/td><td>«Мы не пошли на экстракцию, потому что органика давала бы пожарную категорию, а площадку не позволяла»<\/td><\/tr><tr><td><strong>Провалы и уроки<\/strong><\/td><td>«Первую кампанию печи мы сорвали из-за футеровки; после этого ввели приёмку по…»<\/td><\/tr><tr><td><strong>Естественный профессиональный язык<\/strong><\/td><td>Термины используются точно, без нарочитости, на двух языках, если кандидат работал в международной среде<\/td><\/tr><tr><td><strong>Границы знания<\/strong><\/td><td>«Это не моя зона, но я знаю, что там решали так-то; уточнить лучше у…»<\/td><\/tr><tr><td><strong>Связи между подразделениями<\/strong><\/td><td>Понимает, как его участок влияет на соседние: рудник → фабрика, печь → лаборатория<\/td><\/tr><tr><td><strong>Люди<\/strong><\/td><td>Помнит имена, роли, кто чему его научил, кого он вырастил<\/td><\/tr><tr><td><strong>Согласованность масштаба<\/strong><\/td><td>Цифры численности, бюджета, производительности сходятся между собой<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.2 Признаки поверхностного опыта<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Признак<\/th><th>Как звучит<\/th><\/tr><\/thead><tbody><tr><td><strong>Модные слова вместо фактов<\/strong><\/td><td>«Цифровая трансформация», «синергия», «оптимизация процессов» без конкретики<\/td><\/tr><tr><td><strong>«Мы» вместо «я»<\/strong><\/td><td>«Мы внедрили», «мы запустили» — без личной роли даже после уточнения<\/td><\/tr><tr><td><strong>Широта без глубины<\/strong><\/td><td>«Работал со всеми переделами: от добычи до магнитов»<\/td><\/tr><tr><td><strong>Обрыв на втором уровне<\/strong><\/td><td>Уточнение → общие слова → смена темы<\/td><\/tr><tr><td><strong>Только позитив<\/strong><\/td><td>«Проблем не было», «брака почти не было», «всё шло по плану»<\/td><\/tr><tr><td><strong>Несогласованные цифры<\/strong><\/td><td>50 человек в подчинении, но линия на 10 т в год; бюджет не соответствует масштабу<\/td><\/tr><tr><td><strong>Должность сильнее содержания<\/strong><\/td><td>«Директор по технологиям» в компании из 15 человек без производства<\/td><\/tr><tr><td><strong>Список проектов без результатов<\/strong><\/td><td>Перечень названий, ни одного «было → стало»<\/td><\/tr><tr><td><strong>Чужой язык<\/strong><\/td><td>Ошибки в базовых терминах своего процесса, путаница в единицах<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Важно:<\/strong> один признак — повод уточнить, а не приговор. Решение — по <strong>совокупности<\/strong> свидетельств.<\/p>\n<h3>1.3 Резюме: красные флаги и как их проверять<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Флаг в резюме<\/th><th>Что может стоять за ним<\/th><th>Как проверить<\/th><\/tr><\/thead><tbody><tr><td>Частые переходы (менее года)<\/td><td>Неудачи, конфликты, проектная работа<\/td><td>Причины каждого перехода; рекомендации<\/td><\/tr><tr><td>Длинные пробелы<\/td><td>Учёба, семья, болезнь, неудача<\/td><td>Спросить нейтрально, без давления<\/td><\/tr><tr><td>Раздутые должности<\/td><td>Маленькая компания, «звание» без функций<\/td><td>Масштаб: люди, бюджет, производство<\/td><\/tr><tr><td>«Руководил проектом»<\/td><td>От координатора встреч до директора проекта<\/td><td>Подчинённость, бюджет, решения, результат<\/td><\/tr><tr><td>Только участие<\/td><td>«Участвовал в пуске»<\/td><td>Конкретная зона ответственности на пуске<\/td><\/tr><tr><td>Нет цифр вообще<\/td><td>Нет результатов или неумение их показать<\/td><td>Метод воронки до цифр<\/td><\/tr><tr><td>Технология «с нуля» в каждой компании<\/td><td>Преувеличение<\/td><td>Кто ещё был в команде, кто был технологическим партнёром<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.4 Методы проверки<\/h3>\n<ol><li><strong>Метод воронки и техническая глубина<\/strong> (День 26): 2–3 уровня уточнений по каждому ключевому проекту.<\/li><li><strong>Рисунок от руки<\/strong>: попросите нарисовать схему своего передела с потоками и основными параметрами. Практик рисует быстро и уверенно.<\/li><li><strong>Баланс на салфетке<\/strong>: «Сколько примерно руды нужно на тонну концентрата при вашем содержании и извлечении?» Практик прикидывает за минуту (формулы Дня 6).<\/li><li><strong>Объяснение новичку<\/strong> («научите меня»): глубокое понимание даёт простые и точные объяснения.<\/li><li><strong>Технический кейс<\/strong> с экспертом TMK: обезличенная реальная проблема — 30–60 минут обсуждения.<\/li><li><strong>Панель с экспертами TMK<\/strong>: технолог Чирчика, руководитель R&amp;D Park. Эксперт за 10 минут увидит то, что не видно рекрутеру.<\/li><li><strong>Публичные следы<\/strong>: патенты, публикации, доклады, технические отчёты, новости компании о проекте (День 23). Совпадают ли с рассказом?<\/li><li><strong>Проверка документов<\/strong>: дипломы, сертификаты, статус Competent / Qualified Person (реестры профессиональных организаций), лицензии.<\/li><li><strong>Рекомендации<\/strong> (3.1).<\/li><\/ol>\n<p><strong>О «детекторах лжи».<\/strong> Не полагайтесь на «язык тела», направление взгляда и подобные приёмы: исследования не подтверждают их надёжность. Надёжны <strong>факты, глубина и согласованность<\/strong>.<\/p>\n<h3>1.5 Типичные «маски» в технических профессиях<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Маска<\/th><th>Что говорит<\/th><th>Что на самом деле<\/th><th>Вопрос-проверка<\/th><\/tr><\/thead><tbody><tr><td><strong>«Лабораторный эксперт»<\/strong><\/td><td>«Разработал технологию»<\/td><td>Работал в лаборатории, не масштабировал<\/td><td>«Какая непрерывная производительность и сколько часов работы на пилоте?»<\/td><\/tr><tr><td><strong>«Офисный технолог»<\/strong><\/td><td>«Отвечал за технологию передела»<\/td><td>Писал регламенты, редко бывал в цехе<\/td><td>«Опишите смену, когда процесс вышел из режима. Что вы делали руками?»<\/td><\/tr><tr><td><strong>«Консультант-обозреватель»<\/strong><\/td><td>«Участвовал в 30 проектах»<\/td><td>Писал отчёты, не отвечал за результат<\/td><td>«Где вы отвечали за KPI площадки не менее двух лет?»<\/td><\/tr><tr><td><strong>«Менеджер без техники»<\/strong><\/td><td>«Руководил заводом»<\/td><td>Сильный администратор без технической глубины<\/td><td>«Какое ваше лучшее техническое решение? Объясните его механизм»<\/td><\/tr><tr><td><strong>«Поставщик»<\/strong><\/td><td>«Запустил 20 заводов»<\/td><td>Шеф-наладка оборудования одного производителя<\/td><td>«Какой завод вы бы запустили иначе как владелец?»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.6 Как принимать решение<\/h3>\n<ul><li><strong>Сумма свидетельств<\/strong> по оценочной карте, а не одна яркая история.<\/li><li><strong>Риски<\/strong> явно названы и оценены: какой риск, насколько вероятен, чем закрывается (заместитель, обучение, испытательный срок с целями).<\/li><li><strong>Сомнение — в пользу проверки<\/strong>, а не в пользу кандидата: дополнительный разговор или рекомендация дешевле ошибки найма.<\/li><li><strong>Документируйте<\/strong>: почему «да» или «нет». Это защищает решение и учит систему.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Реальный опыт<\/td><td>Hands-on experience<\/td><td>Личная практика в процессе<\/td><\/tr><tr><td>Поверхностное знакомство<\/td><td>Superficial / surface-level familiarity<\/td><td>Знание «о процессе», а не «в процессе»<\/td><\/tr><tr><td>Глубина знаний<\/td><td>Depth of expertise<\/td><td>Способность отвечать вглубь<\/td><\/tr><tr><td>Личный вклад<\/td><td>Individual contribution<\/td><td>Что сделал сам кандидат<\/td><\/tr><tr><td>Завышение должности<\/td><td>Title inflation<\/td><td>Название сильнее реальных функций<\/td><\/tr><tr><td>Модные слова<\/td><td>Buzzwords<\/td><td>Слова без конкретного содержания<\/td><\/tr><tr><td>Согласованность фактов<\/td><td>Consistency<\/td><td>Совпадение цифр и рассказа<\/td><\/tr><tr><td>Красный флаг<\/td><td>Red flag<\/td><td>Сигнал риска<\/td><\/tr><tr><td>Проверка рекомендаций<\/td><td>Reference check<\/td><td>Разговоры с бывшими руководителями и коллегами<\/td><\/tr><tr><td>Неформальная рекомендация<\/td><td>Back-channel reference<\/td><td>Мнение знакомых коллег вне списка кандидата<\/td><\/tr><tr><td>Проверка биографии<\/td><td>Background check<\/td><td>Проверка образования, работы, документов<\/td><\/tr><tr><td>Проверка документов об образовании<\/td><td>Education verification<\/td><td>Подтверждение дипломов<\/td><\/tr><tr><td>Профессиональный статус<\/td><td>Professional registration<\/td><td>CP, QP, Chartered Engineer и др.<\/td><\/tr><tr><td>Технический кейс<\/td><td>Technical case study<\/td><td>Обсуждение реальной задачи<\/td><\/tr><tr><td>Рабочий пример<\/td><td>Work sample<\/td><td>Выполнение задания, похожего на работу<\/td><\/tr><tr><td>Экспертная панель<\/td><td>Expert panel<\/td><td>Оценка с участием экспертов компании<\/td><\/tr><tr><td>Свидетельство<\/td><td>Evidence<\/td><td>Факт, подтверждающий оценку<\/td><\/tr><tr><td>Риск найма<\/td><td>Hiring risk<\/td><td>Вероятность, что кандидат не справится<\/td><\/tr><tr><td>Меры снижения риска<\/td><td>Risk mitigation<\/td><td>Заместитель, обучение, цели испытательного срока<\/td><\/tr><tr><td>Ошибка найма<\/td><td>Mis-hire / bad hire<\/td><td>Найм, не оправдавший ожиданий<\/td><\/tr><tr><td>Пробел в резюме<\/td><td>CV gap<\/td><td>Период без работы<\/td><\/tr><tr><td>Частая смена работы<\/td><td>Job hopping<\/td><td>Короткие периоды на разных местах<\/td><\/tr><tr><td>Публичные следы<\/td><td>Public footprint<\/td><td>Патенты, публикации, доклады, отчёты<\/td><\/tr><tr><td>Рекомендатель<\/td><td>Referee<\/td><td>Человек, дающий рекомендацию<\/td><\/tr><tr><td>Решение о найме<\/td><td>Hiring decision<\/td><td>Итоговое решение по кандидату<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Проверка рекомендаций: как делать её правильно<\/h3>\n<p><strong>Кого спрашивать:<\/strong> 2–3 человека — бывший руководитель, коллега того же уровня, подчинённый. Плюс, где это допустимо и этично, <strong>неформальные рекомендации<\/strong> от знакомых экспертов. Учитывайте конфиденциальность: не звоните текущему работодателю без согласия кандидата.<\/p>\n<p><strong>Как спрашивать<\/strong> — о фактах и поведении, а не «хороший ли человек»:<\/p>\n<ol><li>«В каком качестве и сколько времени вы работали с кандидатом?»<\/li><li>«Какие результаты его работы вы видели сами? Можете назвать цифры?»<\/li><li>«В чём он сильнее большинства коллег?»<\/li><li>«Где ему нужна поддержка? Что вы как руководитель делали бы, чтобы он раскрылся?»<\/li><li>«Как он вёл себя в самой сложной ситуации, которую вы видели?»<\/li><li>«Наняли бы вы его снова? На какую роль?» — <strong>пауза и интонация<\/strong> в ответе часто говорят больше слов.<\/li><\/ol>\n<p><strong>Красные флаги в рекомендациях:<\/strong> уклончивость, только общие слова, рекомендатель не помнит конкретных результатов, «наняли бы снова, но на другую роль».<\/p>\n<h3>3.2 Технический кейс для TMK: пример<\/h3>\n<blockquote><p>«Через два месяца после пуска линии восстановления вольфрама содержание кислорода в порошке нестабильно, часть партий не проходит по спецификации для твёрдых сплавов. Что вы будете проверять, в каком порядке и какие данные запросите?»<\/p><\/blockquote>\n<p><strong>Сильный ответ<\/strong> структурирован: влажность и расход водорода, температурный профиль печи, высота слоя и скорость подачи лодочек, качество исходного оксида, герметичность, пассивация и хранение порошка, методика анализа кислорода; запрос данных историка и лаборатории; гипотезы и порядок проверки. <strong>Поверхностный<\/strong> — общие слова о «контроле технологии».<\/p>\n<h3>3.3 Как сообщать заказчику о сомнениях<\/h3>\n<ul><li>Говорите <strong>фактами<\/strong>: «В ответах о пуске кандидат не назвал ни одной цифры после трёх уточнений; рекомендатель подтвердил участие, но не руководство».<\/li><li>Предлагайте <strong>проверку<\/strong>: техническое интервью с экспертом TMK, кейс, ещё одна рекомендация.<\/li><li>Различайте <strong>«не подтверждено»<\/strong> и <strong>«опровергнуто»<\/strong>.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Разбор трёх учебных резюме (60 мин).<\/strong> Кандидаты вымышленные и созданы только для упражнения.<\/p>\n<p><strong>Резюме А — «Главный технолог по гидрометаллургии», 18 лет опыта.<\/strong><\/p>\n<blockquote><p>«Руководил технологией гидрометаллургических процессов предприятия. Курировал внедрение инновационных решений, обеспечил значительный рост эффективности. Участвовал в проектах по редким металлам, РЗЭ, литию, вольфраму и урану. Опыт цифровой трансформации. Свободно ориентируюсь во всех переделах от добычи до готовой продукции».<\/p><\/blockquote>\n<p><strong>Резюме Б — «Senior Process Engineer, APT plant», 9 лет опыта.<\/strong><\/p>\n<blockquote><p>«Process engineer at a 2,500 t/y APT plant (soda autoclave digestion, Mo removal by sulfide precipitation, IX conversion, evaporative crystallization). Led debottlenecking of the crystallizer section: throughput +14%, specific steam consumption −9%. Commissioning team member for a new IX line (2021). Co-author of a conference paper on Mo removal (2022)».<\/p><\/blockquote>\n<p><strong>Резюме В — «Директор по производству», 12 лет опыта, три компании за 4 года.<\/strong><\/p>\n<blockquote><p>«Директор по производству в компании по выпуску твёрдосплавного инструмента (15 человек). Ранее — технический директор, директор по развитию. Внедрил систему бережливого производства, вывел компанию на новые рынки, увеличил выручку в 3 раза».<\/p><\/blockquote>\n<p><strong>Задание:<\/strong><\/p>\n<ol><li>Для каждого резюме выпишите <strong>признаки реального и поверхностного опыта<\/strong> (таблицы 1.1–1.3).<\/li><li>Составьте <strong>5 вопросов проверки<\/strong> для каждого (метод воронки, рисунок, баланс, кейс).<\/li><li>Определите, <strong>какие публичные следы и документы<\/strong> проверить и <strong>кого спросить<\/strong> в рекомендациях.<\/li><li>Сформулируйте <strong>предварительный вывод<\/strong> и что должно произойти, чтобы его изменить.<\/li><\/ol>\n<details><summary>Ориентир для самопроверки (смотреть после выполнения)<\/summary>\n<ul><li><strong>А:<\/strong> модные слова, широта без глубины («все переделы»), нет ни одной цифры, нет масштаба. Не отказ, но высокий риск поверхностности. Проверка: один передел вглубь, цифры, рисунок схемы, рекомендация бывшего руководителя.<\/li><li><strong>Б:<\/strong> конкретный передел, масштаб, цифры «было → стало», роль на пуске честно указана как участие, публичный след (доклад). Сильный сигнал реального опыта. Проверка: глубина по Mo, роль в пуске, доклад, рекомендации; вопрос о готовности к роли руководителя (пока специалист).<\/li><li><strong>В:<\/strong> громкие должности при малом масштабе (15 человек), частые переходы, бизнес-результаты без технических. Проверка: причины переходов, технические решения, реальная зона ответственности, масштаб производства.<\/li><\/ul>\n<\/details>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какой признак поверхностности вы раньше пропускали в реальных интервью?<\/li><li>Какой метод проверки вы внедрите на следующей реальной вакансии?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 28: релевантность международного опыта для TMK».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> это главный навык курса. Возвращайтесь к таблицам 1.1–1.5 перед каждым техническим интервью, пока они не станут автоматическими.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>G. Smart, R. Street, <em>Who<\/em> — проверка рекомендаций и метод «Topgrading».<\/li><li>D. Kahneman, <em>Thinking, Fast and Slow<\/em> — когнитивные искажения, влияющие на суждения интервьюера.<\/li><li>Реестры профессиональных организаций (AusIMM, SME, EFG/EurGeol, провинциальные ассоциации Канады) для проверки статусов CP/QP.<\/li><li>Ваши заметки из пробного интервью Дня 26.<\/li><\/ul>"},{"n":28,"module":6,"title":"Релевантность международного опыта для проектов TMK","file":"module-06-screening-assessment-stakeholders/day-28-international-experience-relevance.md","duration":"3,5 часа","challenge":"Оценить <strong>трёх учебных кандидатов с международным опытом<\/strong> по «карте переноса контекста» для двух ролей TMK и написать для заказчика вывод: кто, на какую роль, с какими рисками и мерами поддержки.","why":"«20 Лет в Австралии на крупнейших проектах» звучит впечатляюще, но не гарантирует успеха в Чирчике. Технология может совпадать, а масштаб, стадия, стандарты, команда, язык и способ принятия решений — нет. Задача эксперта по поиску — оценить, <strong>какая часть опыта переносится в контекст TMK<\/strong>, и честно назвать, что придётся достраивать.","checklist":[{"text":"Разминка: 5 вопросов по Дню 27 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: вопросы о переносе опыта (25 мин)","minutes":25},{"text":"Практика: оценка трёх кандидатов по карте переноса (60 мин)","minutes":60},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Перенос опыта","en":"Experience transferability","def":"Применимость опыта в новом контексте"},{"ru":"Контекст","en":"Context","def":"Условия, в которых работал кандидат"},{"ru":"Межкультурная компетентность","en":"Cross-cultural competence","def":"Умение работать в разных культурах"},{"ru":"Культурное соответствие","en":"Cultural fit / culture add","def":"Совместимость с культурой компании"},{"ru":"Адаптивность","en":"Adaptability","def":"Способность приспосабливаться"},{"ru":"Экспат","en":"Expatriate (expat)","def":"Иностранный специалист"},{"ru":"Локальный специалист","en":"Local national","def":"Специалист из страны работы"},{"ru":"Соотечественник-возвращенец","en":"Returnee","def":"Специалист, вернувшийся из-за рубежа"},{"ru":"Передача знаний","en":"Knowledge transfer","def":"Обучение местной команды"},{"ru":"Строительство с нуля","en":"Greenfield","def":"Новый проект без существующей базы"},{"ru":"Действующее производство","en":"Brownfield / operating asset","def":"Существующий объект"},{"ru":"Зрелое производство","en":"Mature operation","def":"Стабильное производство с системами"},{"ru":"Сервисная экосистема","en":"Service ecosystem","def":"Подрядчики, сервис, поставщики рядом"},{"ru":"Профиль рисков кандидата","en":"Candidate risk profile","def":"Пробелы и меры поддержки"},{"ru":"Меры поддержки","en":"Support measures","def":"Наставник, переводчик, заместитель, обучение"},{"ru":"Удержание экспатов","en":"Expat retention","def":"Сохранение иностранных специалистов"},{"ru":"Неудачная командировка","en":"Failed assignment","def":"Досрочное прекращение работы экспата"},{"ru":"Языковой барьер","en":"Language barrier","def":"Трудности общения на рабочем языке"},{"ru":"Иерархическая культура","en":"Hierarchical culture","def":"Культура с выраженной субординацией"},{"ru":"Процедуры согласования","en":"Approval processes","def":"Порядок принятия решений"},{"ru":"Государственная компания","en":"State-owned enterprise (SOE)","def":"Компания под контролем государства"},{"ru":"Пара «экспат — преемник»","en":"Expat–successor pairing","def":"Схема локализации кадров"},{"ru":"Ознакомительный визит","en":"Site visit / look-see visit","def":"Визит кандидата до решения"},{"ru":"Семейная адаптация","en":"Family adjustment","def":"Адаптация семьи экспата"},{"ru":"Оценка релевантности","en":"Relevance assessment","def":"Оценка применимости опыта"}],"quiz":[{"q":"Что оценивает карта переноса контекста?","options":["Стоимость перелёта кандидата и его семьи в Узбекистан","Какая часть опыта кандидата переносится в контекст TMK по восьми измерениям","Уровень английского языка кандидата по международной шкале и опыт работы с переводчиком","Количество стран, в которых работал кандидат за карьеру"],"answer":1,"explain":"Технология, масштаб, стадия, стандарты, ресурсы, команда, язык и культура, принятие решений."},{"q":"Какой риск типичен для руководителя из крупной компании-мейджора на новом проекте TMK?","options":["Недостаток знаний о промышленной безопасности и охране труда","Слабое знание международных стандартов и отчётности","Отсутствие опыта руководства большими командами","Привычка к готовым системам и развитой сервисной экосистеме"],"answer":3,"explain":"Проверяйте, что он строил сам с нуля."},{"q":"Какой фактор — один из главных предикторов удержания экспата?","options":["Позиция семьи по переезду или вахте","Число предыдущих работодателей и стран работы","Размер последней компании","Наличие учёной степени"],"answer":0,"explain":"Ранний уход экспата чаще всего связан с семьёй и бытом."},{"q":"Что проверить у кандидата с опытом китайских производств W или РЗЭ?","options":["Только знание английского и китайского языков","Количество патентов, которые получила его компания за последние десять лет","Экспортные ограничения на передачу технологий и договорные обязательства","Наличие у него опыта работы в нефтегазовой отрасли"],"answer":2,"explain":"Это юридический риск для TMK, который оценивают с юристами."},{"q":"Какой вопрос лучше всего проверяет способность экспата передавать знания?","options":["«Сколько у вас было подчинённых?»","«Кого вы обучили и где эти люди сейчас?»","«Какой у вас опыт публичных выступлений?»","«Есть ли у вас сертификат тренера?»"],"answer":1,"explain":"Результат обучения — люди, которые выросли."},{"q":"Красный флаг у международного кандидата:","options":["Подробно интересуется школами для детей в Ташкенте и медициной","Задаёт много вопросов о команде, технологии и партнёрах TMK","Подробно спрашивает, как устроены процедуры согласования решений и кто подписывает бюджеты","Говорит, что «научит местных, как надо», и не приводит примеров собственной адаптации"],"answer":3,"explain":"Высокомерие разрушает команду и ведёт к раннему уходу."},{"q":"Что даёт схема «экспат + местный преемник»?","options":["Перенос опыта сейчас и локализацию кадров в будущем","Экономию на зарплате экспата за счёт преемника","Возможность обойтись без обучения местных сотрудников","Освобождение проекта от требований охраны труда"],"answer":0,"explain":"Это и задача TMK по подготовке кадров, и аргумент для экспата."},{"q":"Что важно проверить у соотечественника, работающего за рубежом?","options":["Только знание узбекского языка и местных обычаев","Наличие недвижимости, родственников и связей в Узбекистане и в TMK","Реальную глубину роли за рубежом и ожидания по статусу и вознаграждению","Количество лет, проведённых за пределами страны"],"answer":2,"explain":"Мотивация сильная, но роль за рубежом часто инженерная, а ожидания — руководящие."},{"q":"Сильный технолог с пробелом в опыте пуска. Как поступить?","options":["Отказать: пробел в пуске критичен для любой роли","Рассмотреть на роль, где пробел закрывается поддержкой (опытный пусконаладчик рядом)","Скрыть пробел от заказчика, чтобы не сорвать найм","Нанять на любую роль без обсуждения рисков с заказчиком, а пробел закрыть обучением потом"],"answer":1,"explain":"Решение — не только «кто лучше», но и «кого на какую роль и с какой поддержкой»."},{"q":"Что должно быть в выводе для заказчика по международному кандидату?","options":["Только итоговый балл по оценочной карте без комментариев, чтобы не влиять на решение заказчика","Только перечень стран и компаний, где работал кандидат","Только рекомендация «да» или «нет» без объяснения причин","Рекомендация по роли, что переносится, пробелы, меры поддержки, риски удержания"],"answer":3,"explain":"Так заказчик видит не только «кто», но и «что нужно, чтобы он справился»."}],"html":"<h2>0. Разминка: вспомнить День 27<\/h2>\n<ol><li>Назовите пять признаков реального опыта.<\/li><li>Назовите пять признаков поверхностного опыта.<\/li><li>Какие методы проверки можно использовать на интервью?<\/li><li>Как правильно проводить проверку рекомендаций?<\/li><li>Какие «маски» встречаются в технических профессиях?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Цифры «было → стало», диапазоны, компромиссы и причины, провалы и уроки, естественный язык, границы знания, связи между подразделениями, согласованность масштаба.<\/li><li>Модные слова, «мы» вместо «я», широта без глубины, обрыв на втором уровне, только позитив, несогласованные цифры, должность сильнее содержания.<\/li><li>Метод воронки, рисунок схемы, баланс на салфетке, «научите меня», технический кейс, экспертная панель, публичные следы, документы, рекомендации.<\/li><li>2–3 человека (руководитель, коллега, подчинённый); вопросы о фактах и поведении; «наняли бы снова и на какую роль?».<\/li><li>Лабораторный эксперт, офисный технолог, консультант-обозреватель, менеджер без техники, поставщик.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Карта переноса контекста<\/h3>\n<p>Опыт переносится не целиком. Оценивайте <strong>восемь измерений<\/strong> — что совпадает с контекстом TMK, а что придётся достраивать:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Измерение<\/th><th>Вопрос<\/th><th>Пример риска<\/th><\/tr><\/thead><tbody><tr><td><strong>1. Технология<\/strong><\/td><td>Тот же передел и сырьё?<\/td><td>Шеелит вместо вольфрамита; бастнезит вместо урановых растворов<\/td><\/tr><tr><td><strong>2. Масштаб<\/strong><\/td><td>Сопоставимы объёмы, команды, бюджеты?<\/td><td>Привык к 50 млн т/год, у TMK — 0,5 млн т/год<\/td><\/tr><tr><td><strong>3. Стадия<\/strong><\/td><td>Строил с нуля или эксплуатировал готовое?<\/td><td>Отличный эксплуатационник на стройке и пуске<\/td><\/tr><tr><td><strong>4. Стандарты и регулирование<\/strong><\/td><td>Знает ли нормы, которые действуют в TMK?<\/td><td>Работал только по западным нормам, не знает ГОСТ и местных процедур<\/td><\/tr><tr><td><strong>5. Ресурсы и инфраструктура<\/strong><\/td><td>Привык к развитой сервисной экосистеме?<\/td><td>Нет подрядчиков и запчастей «за углом», всё решается дольше<\/td><\/tr><tr><td><strong>6. Команда<\/strong><\/td><td>Какая квалификация и культура команды?<\/td><td>Привык к опытным специалистам; в TMK много молодых — нужно учить<\/td><\/tr><tr><td><strong>7. Язык и культура<\/strong><\/td><td>Русский, узбекский, английский; стиль общения<\/td><td>Работа через переводчика, иерархия, неявные правила<\/td><\/tr><tr><td><strong>8. Принятие решений<\/strong><\/td><td>Как принимались решения: автономно или через согласования?<\/td><td>Частная компания с быстрыми решениями против государственной с процедурами<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Итог по каждому измерению:<\/strong> «совпадает», «переносится с адаптацией», «пробел». Количество и критичность пробелов — основа рекомендации.<\/p>\n<h3>1.2 «Большая компания» против «строительства с нуля»<\/h3>\n<p><strong>Опыт мейджора даёт:<\/strong> системы, стандарты, безопасность, дисциплину, широкий кругозор.<\/p>\n<p><strong>Чего может не хватать:<\/strong><\/p>\n<ul><li>умения работать <strong>без готовых систем<\/strong>: самому написать процедуру, выбрать подрядчика, обучить людей;<\/li><li><strong>широты ответственности<\/strong>: в большой компании за каждый вопрос отвечает отдельный отдел;<\/li><li><strong>терпения к нехватке ресурсов<\/strong>: запчасти, специалисты, сервис.<\/li><\/ul>\n<p><strong>Проверочный вопрос:<\/strong> «Что в вашей последней работе вы построили сами с нуля, а что получили готовым? Как вы будете действовать, если на площадке нет ни процедуры, ни подрядчика, ни опытной команды?»<\/p>\n<h3>1.3 Опыт из разных регионов: на что смотреть<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Регион опыта<\/th><th>Обычно сильные стороны<\/th><th>Что проверить в контексте TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>Австралия, Канада<\/strong><\/td><td>Безопасность, системы, JORC / NI 43-101, гидрометаллургия, РЗЭ, литий<\/td><td>Работа без развитой сервисной экосистемы; готовность учить команду; язык<\/td><\/tr><tr><td><strong>ЮАР<\/strong><\/td><td>Подземные работы, металлургия, работа в сложной среде, развитие местных кадров<\/td><td>Адаптация к культуре и языку<\/td><\/tr><tr><td><strong>Европа<\/strong><\/td><td>Технологии высокой добавленной стоимости (W, Mo, твёрдые сплавы, РЗЭ, химия), качество<\/td><td>Масштаб и стадия (часто зрелые производства), работа в госкомпании<\/td><\/tr><tr><td><strong>Китай<\/strong><\/td><td>Глубокое знание процессов W и РЗЭ, скорость пусков<\/td><td>Экспортные ограничения на технологии, язык, стиль документирования<\/td><\/tr><tr><td><strong>Корея, Япония<\/strong><\/td><td>Материалы, порошки, магниты, качество, дисциплина<\/td><td>Язык, иерархия, мотивация к переезду<\/td><\/tr><tr><td><strong>Россия, Казахстан и СНГ<\/strong><\/td><td>Советская инженерная школа, ГОСТ, знание похожих предприятий, русский язык<\/td><td>Международные стандарты; санкционный комплаенс (Россия)<\/td><\/tr><tr><td><strong>Ближний Восток<\/strong><\/td><td>Крупные проекты, работа с экспатами разных стран<\/td><td>Масштаб и тип проектов<\/td><\/tr><tr><td><strong>Соотечественники за рубежом<\/strong><\/td><td>Международный опыт + язык и культура Узбекистана<\/td><td>Реальная глубина роли за рубежом; ожидания по вознаграждению и статусу<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.4 Факторы успеха экспата в Узбекистане<\/h3>\n<ol><li><strong>Способность учить<\/strong>: экспат ценен не только делом, но и передачей знаний местной команде.<\/li><li><strong>Гибкость и скромность<\/strong>: готовность понять, почему здесь делают иначе, прежде чем менять.<\/li><li><strong>Устойчивость к процедурам<\/strong>: умение добиваться решений в системе согласований.<\/li><li><strong>Межкультурная компетентность<\/strong>: уважение к иерархии и неявным правилам, умение строить отношения.<\/li><li><strong>Семья<\/strong>: позиция семьи по переезду или вахте — один из главных предикторов удержания.<\/li><li><strong>Мотивация «к», а не только «от»<\/strong>: интерес к задаче и стране, а не бегство.<\/li><li><strong>Языки<\/strong>: русский — сильный плюс; английский — для работы с партнёрами; хотя бы базовый узбекский — знак уважения.<\/li><\/ol>\n<h3>1.5 Оценочная карта релевантности<\/h3>\n<p>Для каждой роли — веса измерений из 1.1 по важности, оценка 1–5, итоговый балл и <strong>профиль рисков<\/strong>:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Измерение<\/th><th>Вес<\/th><th>Кандидат X<\/th><th>Свидетельства<\/th><th>Мера поддержки при пробеле<\/th><\/tr><\/thead><tbody><tr><td>Технология<\/td><td>25%<\/td><td>4<\/td><td>6 лет на APT-линии, доклад по удалению Mo<\/td><td>—<\/td><\/tr><tr><td>Стадия<\/td><td>20%<\/td><td>2<\/td><td>Только эксплуатация зрелой линии<\/td><td>Сильный руководитель пусконаладки рядом<\/td><\/tr><tr><td>Масштаб<\/td><td>10%<\/td><td>3<\/td><td>…<\/td><td>…<\/td><\/tr><tr><td>Стандарты<\/td><td>10%<\/td><td>…<\/td><td>…<\/td><td>…<\/td><\/tr><tr><td>Команда<\/td><td>10%<\/td><td>…<\/td><td>…<\/td><td>…<\/td><\/tr><tr><td>Язык и культура<\/td><td>10%<\/td><td>…<\/td><td>…<\/td><td>Переводчик, наставник<\/td><\/tr><tr><td>Принятие решений<\/td><td>10%<\/td><td>…<\/td><td>…<\/td><td>…<\/td><\/tr><tr><td>Ресурсы<\/td><td>5%<\/td><td>…<\/td><td>…<\/td><td>…<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Решение<\/strong> — не только «кто лучше», но и <strong>«кого на какую роль»<\/strong>: сильный технолог с пробелом в стадии может быть идеальным главным технологом при опытном директоре проекта.<\/p>\n<h3>1.6 Соотечественники и местные кандидаты: особые вопросы<\/h3>\n<ul><li><strong>Соотечественники<\/strong>: проверяйте реальную роль за рубежом (часто инженерный, а не руководящий уровень) и ожидания по статусу и вознаграждению. Сильная сторона — мотивация и культура.<\/li><li><strong>Местные кандидаты из АГМК, НГМК, Навоийурана<\/strong>: глубокое знание местных условий и людей; проверяйте международные стандарты и готовность к изменениям. Учитывайте этику найма внутри государственного сектора и договорённости TMK с другими предприятиями.<\/li><li><strong>Комбинация<\/strong> «экспат + местный преемник» — часто лучшее решение для новых переделов.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Перенос опыта<\/td><td>Experience transferability<\/td><td>Применимость опыта в новом контексте<\/td><\/tr><tr><td>Контекст<\/td><td>Context<\/td><td>Условия, в которых работал кандидат<\/td><\/tr><tr><td>Межкультурная компетентность<\/td><td>Cross-cultural competence<\/td><td>Умение работать в разных культурах<\/td><\/tr><tr><td>Культурное соответствие<\/td><td>Cultural fit / culture add<\/td><td>Совместимость с культурой компании<\/td><\/tr><tr><td>Адаптивность<\/td><td>Adaptability<\/td><td>Способность приспосабливаться<\/td><\/tr><tr><td>Экспат<\/td><td>Expatriate (expat)<\/td><td>Иностранный специалист<\/td><\/tr><tr><td>Локальный специалист<\/td><td>Local national<\/td><td>Специалист из страны работы<\/td><\/tr><tr><td>Соотечественник-возвращенец<\/td><td>Returnee<\/td><td>Специалист, вернувшийся из-за рубежа<\/td><\/tr><tr><td>Передача знаний<\/td><td>Knowledge transfer<\/td><td>Обучение местной команды<\/td><\/tr><tr><td>Строительство с нуля<\/td><td>Greenfield<\/td><td>Новый проект без существующей базы<\/td><\/tr><tr><td>Действующее производство<\/td><td>Brownfield / operating asset<\/td><td>Существующий объект<\/td><\/tr><tr><td>Зрелое производство<\/td><td>Mature operation<\/td><td>Стабильное производство с системами<\/td><\/tr><tr><td>Сервисная экосистема<\/td><td>Service ecosystem<\/td><td>Подрядчики, сервис, поставщики рядом<\/td><\/tr><tr><td>Профиль рисков кандидата<\/td><td>Candidate risk profile<\/td><td>Пробелы и меры поддержки<\/td><\/tr><tr><td>Меры поддержки<\/td><td>Support measures<\/td><td>Наставник, переводчик, заместитель, обучение<\/td><\/tr><tr><td>Удержание экспатов<\/td><td>Expat retention<\/td><td>Сохранение иностранных специалистов<\/td><\/tr><tr><td>Неудачная командировка<\/td><td>Failed assignment<\/td><td>Досрочное прекращение работы экспата<\/td><\/tr><tr><td>Языковой барьер<\/td><td>Language barrier<\/td><td>Трудности общения на рабочем языке<\/td><\/tr><tr><td>Иерархическая культура<\/td><td>Hierarchical culture<\/td><td>Культура с выраженной субординацией<\/td><\/tr><tr><td>Процедуры согласования<\/td><td>Approval processes<\/td><td>Порядок принятия решений<\/td><\/tr><tr><td>Государственная компания<\/td><td>State-owned enterprise (SOE)<\/td><td>Компания под контролем государства<\/td><\/tr><tr><td>Пара «экспат — преемник»<\/td><td>Expat–successor pairing<\/td><td>Схема локализации кадров<\/td><\/tr><tr><td>Ознакомительный визит<\/td><td>Site visit / look-see visit<\/td><td>Визит кандидата до решения<\/td><\/tr><tr><td>Семейная адаптация<\/td><td>Family adjustment<\/td><td>Адаптация семьи экспата<\/td><\/tr><tr><td>Оценка релевантности<\/td><td>Relevance assessment<\/td><td>Оценка применимости опыта<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Вопросы о переносе опыта<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Что слушать<\/th><\/tr><\/thead><tbody><tr><td>«Что вы построили с нуля, а что получили готовым?»<\/td><td>Опыт greenfield, самостоятельность<\/td><\/tr><tr><td>«Как вы работали, когда не было подрядчика или запчасти под рукой?»<\/td><td>Изобретательность, планирование, терпение<\/td><\/tr><tr><td>«Кого вы обучили, и где они сейчас?»<\/td><td>Способность передавать знания<\/td><\/tr><tr><td>«Расскажите о самом трудном культурном различии в вашей работе за рубежом»<\/td><td>Межкультурная компетентность, отсутствие высокомерия<\/td><\/tr><tr><td>«Как вы добивались решений в компании с долгими согласованиями?»<\/td><td>Устойчивость к процедурам<\/td><\/tr><tr><td>«Что вы знаете об Узбекистане и TMK? Что вас смущает?»<\/td><td>Подготовленность, мотивация, честность<\/td><\/tr><tr><td>«Что думает ваша семья о переезде или вахте?»<\/td><td>Реальность решения<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Красные флаги у международных кандидатов<\/h3>\n<ul><li>Пренебрежительное отношение к «местным», «мы научим их, как надо».<\/li><li>Не может назвать ни одного случая, когда сам адаптировался к чужим правилам.<\/li><li>Не интересуется страной, командой и задачей, только условиями.<\/li><li>Неясная позиция семьи на финальной стадии.<\/li><li>Ожидает такой же скорости решений и инфраструктуры, как в прежней компании, и не готов это обсуждать.<\/li><\/ul>\n<h3>3.3 Как писать вывод для заказчика<\/h3>\n<p>Структура на полстраницы для каждого кандидата:<\/p>\n<ol><li><strong>Рекомендация<\/strong>: на какую роль, «да / да с условиями / нет».<\/li><li><strong>Что переносится полностью<\/strong> (2–3 пункта со свидетельствами).<\/li><li><strong>Пробелы<\/strong> и их критичность.<\/li><li><strong>Меры поддержки<\/strong>: наставник, заместитель, переводчик, обучение, цели испытательного срока.<\/li><li><strong>Риски удержания<\/strong>: семья, мотивация, вознаграждение.<\/li><\/ol>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Оценка трёх кандидатов (60 мин).<\/strong> Кандидаты вымышленные и созданы только для упражнения. Роли: <strong>«Главный технолог APT (новая линия)»<\/strong> и <strong>«Директор вольфрамового горнорудного комплекса»<\/strong>.<\/p>\n<ul><li><strong>Кандидат 1.<\/strong> 22 года в Австралии и Канаде: золото и медь, крупные карьеры и фабрики (20–40 млн т/год), последние 5 лет — генеральный директор действующего рудника. Английский, без русского. Семья готова к вахте 28/28.<\/li><li><strong>Кандидат 2.<\/strong> 11 лет на вольфрамовом заводе в Европе: 6 лет технолог участка APT, 3 года — руководитель участка; участвовал в пуске новой ионообменной линии; доклад на отраслевой конференции. Английский и немецкий. Готов к переезду с семьёй, спрашивает о школах.<\/li><li><strong>Кандидат 3.<\/strong> Соотечественник: выпускник ТашГТУ, 8 лет в Корее в компании по порошковой металлургии и твёрдым сплавам, инженер-технолог спекания, затем ведущий инженер. Русский, узбекский, корейский, английский. Хочет вернуться, ожидает «руководящую роль».<\/li><\/ul>\n<p><strong>Задание:<\/strong><\/p>\n<ol><li>Для каждого кандидата и каждой роли оцените восемь измерений (таблица 1.1): «совпадает / с адаптацией / пробел».<\/li><li>Постройте оценочную карту релевантности (1.5) для обеих ролей.<\/li><li>Напишите вывод для заказчика (3.3): кого на какую роль, с какими мерами.<\/li><li>Для кандидата 3 предложите <strong>роль и план роста<\/strong> так, чтобы не потерять его из-за ожиданий «руководящей роли».<\/li><\/ol>\n<details><summary>Ориентир для самопроверки (смотреть после выполнения)<\/summary>\n<ul><li><strong>Кандидат 1:<\/strong> сильный операционный руководитель, но другой металл, масштаб и стадия; нет русского. Для директора вольфрамового комплекса — «да с условиями» при сильной местной команде и технологическом заместителе по вольфраму; для главного технолога APT — нет.<\/li><li><strong>Кандидат 2:<\/strong> лучший кандидат на главного технолога APT (процесс, участие в пуске, доклад); пробелы — руководство уровня передела целиком и язык. Меры: переводчик и наставник, сильный пусконаладчик, проработка семейной адаптации.<\/li><li><strong>Кандидат 3:<\/strong> не главный технолог APT (другой передел), но сильный кандидат для твёрдых сплавов или Smart Powder: руководитель участка спекания с планом роста до руководителя производства через 12–24 месяца при выполнении целей.<\/li><\/ul>\n<\/details>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какое из восьми измерений вы раньше не учитывали?<\/li><li>Как вы решили вопрос с ожиданиями кандидата 3?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 29: работа с заказчиками — технические директора, главные инженеры, учёные».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы оцениваете не «насколько крут кандидат», а «насколько он справится здесь и что для этого нужно». Это и есть экспертная позиция в Executive Search.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>E. Meyer, <em>The Culture Map<\/em> — практическое руководство по межкультурным различиям в работе.<\/li><li>Исследования международной мобильности и удержания экспатов (обзоры глобальных консалтинговых компаний).<\/li><li>Профиль TMK: <a href=\"#tmk\">../00-start/tmk-profile.md<\/a> — контекст, который вы «продаёте» международным кандидатам.<\/li><\/ul>"},{"n":29,"module":6,"title":"Работа с заказчиками: технические директора, главные инженеры, учёные, руководители проектов","file":"module-06-screening-assessment-stakeholders/day-29-stakeholder-management.md","duration":"3,5 часа","challenge":"Подготовить <strong>«карту стейкхолдеров»<\/strong> одного поиска TMK и <strong>сценарии трёх трудных разговоров<\/strong>: заказчик хочет «единорога» в невозможный срок; заказчик отклоняет всех кандидатов без объяснений; учёный не может определиться между двумя кандидатами.","why":"Поиск проваливается не только на рынке, но и внутри компании. Технический директор думает о рисках и надёжности, учёный — о новизне и оборудовании, директор проекта — о сроках, HR и комплаенс — о процедурах. Рекрутер, который говорит с каждым на его языке, опирается на данные и умеет спорить без конфликта, становится партнёром, а не «исполнителем заявок».","checklist":[{"text":"Разминка: 5 вопросов по Дню 28 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: фразы для трудных разговоров (25 мин)","minutes":25},{"text":"Практика: карта стейкхолдеров + три сценария (60 мин)","minutes":60},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.3, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Стейкхолдер","en":"Stakeholder","def":"Заинтересованная сторона"},{"ru":"Карта стейкхолдеров","en":"Stakeholder map","def":"Кто влияет на решение и чего хочет"},{"ru":"Владелец решения","en":"Decision owner","def":"Человек, принимающий итоговое решение"},{"ru":"Управление ожиданиями","en":"Expectation management","def":"Согласование реалистичных целей"},{"ru":"Возражение на данных","en":"Data-driven pushback","def":"Несогласие, подкреплённое фактами"},{"ru":"Эскалация","en":"Escalation","def":"Передача вопроса на уровень выше"},{"ru":"Калибровочная встреча","en":"Calibration meeting","def":"Согласование критериев на реальных кандидатах"},{"ru":"Презентация шорт-листа","en":"Shortlist presentation","def":"Встреча с обсуждением кандидатов"},{"ru":"Сравнительная матрица","en":"Comparison matrix","def":"Кандидаты против критериев"},{"ru":"Обратная связь заказчика","en":"Hiring manager feedback","def":"Мнение заказчика о кандидате"},{"ru":"Влияние без полномочий","en":"Influence without authority","def":"Умение убеждать без прямой власти"},{"ru":"Доверенный советник","en":"Trusted advisor","def":"Партнёр, к мнению которого прислушиваются"},{"ru":"Межкультурная коммуникация","en":"Cross-cultural communication","def":"Общение с учётом культурных различий"},{"ru":"Прямой / непрямой стиль","en":"Direct / indirect communication style","def":"Явное или неявное выражение мнения"},{"ru":"Протокол встречи","en":"Meeting minutes","def":"Письменная фиксация решений"},{"ru":"Согласование","en":"Approval / sign-off","def":"Утверждение решения"},{"ru":"Срок решения","en":"Decision deadline","def":"Дата, к которой нужно решение"},{"ru":"Отказ кандидату","en":"Candidate rejection","def":"Сообщение о решении не в его пользу"},{"ru":"Опыт кандидата","en":"Candidate experience","def":"Как кандидат ощущает процесс"},{"ru":"Внутренняя справедливость вознаграждения","en":"Internal pay equity","def":"Соответствие оплаты внутри компании"},{"ru":"Конфликт интересов","en":"Conflict of interest","def":"Личная заинтересованность в решении"},{"ru":"Партнёр по бизнесу","en":"Business partner","def":"Роль HR как партнёра руководителя"},{"ru":"Статус-встреча","en":"Status meeting","def":"Регулярная встреча по ходу поиска"},{"ru":"Риск-реестр поиска","en":"Search risk register","def":"Перечень рисков поиска и мер"},{"ru":"Сценарий разговора","en":"Conversation script","def":"Заготовка ключевых фраз"}],"quiz":[{"q":"Что больше всего беспокоит технического директора при найме ключевого технолога?","options":["Цвет корпоративного стиля презентации кандидатов","Количество откликов на опубликованную вакансию","Надёжность, безопасность и риск нанять «теоретика»","Скорость, с которой кандидат заполняет анкету"],"answer":2,"explain":"Говорите с ним на языке процессов, цифр и рисков."},{"q":"Какова формула возражения заказчику на данных?","options":["Признать цель → показать данные → предложить варианты → попросить решение","Сразу отказаться от вакансии, если требования заказчика выглядят нереальными","Согласиться на всё, а потом объяснить провал рынком","Пожаловаться руководству заказчика на его требования"],"answer":0,"explain":"Так вы спорите без конфликта и сохраняете доверие."},{"q":"Как быстрее всего заслужить доверие технического руководителя на первой встрече?","options":["Подробно рассказать о своём опыте в HR, о прошлых успехах и закрытых вакансиях","Пообещать первых кандидатов уже через неделю после встречи","Похвалить его проект и команду, чтобы расположить к себе","Задать один-два точных вопроса о процессе, показывающих понимание"],"answer":3,"explain":"Это то, ради чего вы проходили модули 1–4."},{"q":"Заказчик отклоняет всех кандидатов без объяснений. Первый шаг:","options":["Искать ещё больше кандидатов тем же способом, увеличив поток","Провести калибровочную встречу и разобрать кандидатов по критериям профиля","Перестать отправлять кандидатов, пока заказчик сам не позвонит и не объяснит причину","Пожаловаться в HR на заказчика и попросить сменить его"],"answer":1,"explain":"Обычно за этим стоит несогласованный профиль или скрытые требования."},{"q":"Почему важно договориться о сроке решения по кандидату заранее?","options":["Это требование трудового законодательства для всех вакансий","Чтобы заказчик меньше думал и быстрее подписывал документы","Сильные кандидаты уходят к конкурентам, пока компания «думает»","Так проще вести отчётность и закрывать вакансии в системе"],"answer":2,"explain":"Скорость решения — часть конкурентоспособности TMK как работодателя."},{"q":"Как правильно отказывать кандидату?","options":["Не отвечать: он сам поймёт","Отказать через полгода, когда закроется поиск","Подробно объяснить все недостатки кандидата","Быстро, уважительно, с краткой обратной связью"],"answer":3,"explain":"Отрасль маленькая: кандидат сегодня — рекомендатель или кандидат завтра."},{"q":"Руководитель R&amp;D не может выбрать между двумя кандидатами. Что помогает?","options":["Вернуться к результатам на 12 месяцев и оценить, кто вероятнее их достигнет","Выбрать того, кто моложе и сможет дольше работать","Выбрать того, у кого больше публикаций, цитирований и международных грантов","Нанять обоих и через полгода оставить лучшего"],"answer":0,"explain":"Решение по результатам профиля успеха, а не по отдельным впечатлениям."},{"q":"Заказчик хочет взять «своего» знакомого без оценки. Ваш ход:","options":["Согласиться: заказчик всегда прав и лучше знает своих людей","Предложить провести знакомого через ту же оценку, что и других кандидатов","Отказаться от участия в найме и передать вакансию другому","Сообщить в службу безопасности о возможном конфликте интересов и приостановить найм"],"answer":1,"explain":"Единый стандарт оценки снижает риск ошибки и конфликта интересов."},{"q":"Как фиксировать ключевые договорённости с заказчиком?","options":["Устно, чтобы не перегружать заказчика письмами","Только в личных заметках рекрутера","Коротким письмом: «Фиксирую: …»","В протоколе раз в квартал"],"answer":2,"explain":"Короткое подтверждение письменно снимает неявные разночтения."},{"q":"Что ценят технические руководители в рекрутере больше всего?","options":["Много новых кандидатов каждую неделю, даже если не все подходят под профиль и бюджет","Умение увлекательно рассказывать о бренде и истории компании","Знание всех технологий лучше, чем знают их сами технологи","Точные вопросы, меньше, но точнее кандидатов, правду о рынке и рисках, управляемый процесс"],"answer":3,"explain":"Притворяться экспертом не нужно: важны точность и честность."}],"html":"<h2>0. Разминка: вспомнить День 28<\/h2>\n<ol><li>Назовите восемь измерений карты переноса контекста.<\/li><li>Чего может не хватать руководителю из крупной компании на новом проекте?<\/li><li>Назовите три фактора успеха экспата в Узбекистане.<\/li><li>Что такое схема «экспат + преемник»?<\/li><li>Что должно быть в выводе для заказчика по международному кандидату?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Технология, масштаб, стадия, стандарты, ресурсы, команда, язык и культура, принятие решений.<\/li><li>Умения работать без готовых систем, широты ответственности, терпения к нехватке ресурсов.<\/li><li>Способность учить, гибкость и скромность, устойчивость к процедурам, межкультурная компетентность, позиция семьи, мотивация «к», языки.<\/li><li>Экспат передаёт опыт и одновременно готовит местного преемника.<\/li><li>Рекомендация по роли, что переносится, пробелы, меры поддержки, риски удержания.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Кто есть кто: приоритеты и язык стейкхолдеров<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Стейкхолдер<\/th><th>Что важно<\/th><th>На каком языке говорить<\/th><th>Чего боится<\/th><\/tr><\/thead><tbody><tr><td><strong>Технический директор / главный инженер<\/strong><\/td><td>Надёжность, безопасность, технология, KPI производства<\/td><td>Процессы, оборудование, цифры, риски<\/td><td>Аварии, срыв плана, «теоретик» на ключевой роли<\/td><\/tr><tr><td><strong>Директор проекта<\/strong><\/td><td>Сроки, бюджет, интерфейсы, пуск<\/td><td>Графики, вехи, критический путь<\/td><td>Задержка пуска из-за отсутствия людей<\/td><\/tr><tr><td><strong>Учёный / руководитель R&amp;D<\/strong><\/td><td>Новизна, научный уровень, оборудование, свобода исследований<\/td><td>Публикации, методы, масштабирование<\/td><td>«Производственник» без научного мышления; потеря научной репутации<\/td><\/tr><tr><td><strong>Председатель правления / топ-менеджмент<\/strong><\/td><td>Стратегия, скорость, репутация, международные партнёры<\/td><td>Короткие выводы, риски для бизнеса, сроки<\/td><td>Провал проектов, репутационные скандалы<\/td><\/tr><tr><td><strong>HR-директор<\/strong><\/td><td>Процедуры, грейды, вознаграждение, справедливость<\/td><td>Политики, бюджеты, рынок<\/td><td>Нарушение внутренней справедливости, прецеденты<\/td><\/tr><tr><td><strong>Комплаенс и юристы<\/strong><\/td><td>Санкции, экспортный контроль, трудовое и миграционное право<\/td><td>Риски, документы, нормы<\/td><td>Юридические и репутационные риски<\/td><\/tr><tr><td><strong>Финансы<\/strong><\/td><td>Стоимость найма и пакета, бюджет<\/td><td>Цифры, сравнение вариантов<\/td><td>Перерасход<\/td><\/tr><tr><td><strong>Будущая команда<\/strong><\/td><td>Каким будет новый руководитель<\/td><td>Конкретика: стиль, опыт, отношение к людям<\/td><td>«Варяг», который всех заменит<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.2 Как строить доверие технического руководителя<\/h3>\n<ol><li><strong>Подготовка<\/strong>: перед встречей прочитайте о переделе (модули 1–4), профиле TMK и проекте.<\/li><li><strong>Точный вопрос<\/strong>: в первые 5 минут задайте один-два вопроса, которые показывают понимание процесса («Какая стадия пуска? Через ионный обмен или экстракцию будете конверсию делать?»).<\/li><li><strong>Данные, а не мнения<\/strong>: размер пула, конкуренты, вознаграждение рынка, статистика воронки.<\/li><li><strong>Обещайте меньше, делайте больше<\/strong>: реалистичные сроки, еженедельный отчёт.<\/li><li><strong>Честность о рисках кандидатов<\/strong>: заказчик быстро перестаёт доверять тому, кто «продаёт» каждого кандидата.<\/li><li><strong>Признавайте границы своего знания<\/strong>: «Это вопрос для вашего технолога, я организую техническое интервью».<\/li><\/ol>\n<h3>1.3 Возражение на данных: как говорить «нет» заказчику<\/h3>\n<p><strong>Формула:<\/strong> признать цель → показать данные → предложить варианты → попросить решение.<\/p>\n<blockquote><p>«Я понимаю, что вам нужен человек, который уже запускал линию APT, через месяц. По карте рынка таких специалистов вне Китая около 25–40, реально досягаемых — около 10, а интерес к переезду обычно проявляют немногие. Предлагаю три варианта: 1) срок 4–5 месяцев и поиск по кольцам 1–2; 2) сильный технолог с опытом эксплуатации плюс консультант на время пуска; 3) временный эксперт уже сейчас, параллельно — поиск постоянного. Какой вариант вам ближе?»<\/p><\/blockquote>\n<p><strong>Чего не делать:<\/strong> спорить на эмоциях, соглашаться на невозможное, молча проваливать сроки.<\/p>\n<h3>1.4 Презентация шорт-листа и управление решением<\/h3>\n<ul><li><strong>Перед встречей<\/strong>: разошлите презентации кандидатов и сравнительную матрицу (День 25).<\/li><li><strong>На встрече<\/strong>: начните с напоминания о профиле успеха и оценочной карте. Обсуждайте <strong>по критериям<\/strong>, а не «кто понравился».<\/li><li><strong>После интервью заказчика<\/strong>: соберите <strong>независимые оценки<\/strong> каждого участника (День 26), затем обсуждение.<\/li><li><strong>Скорость решения<\/strong>: договоритесь о сроке решения заранее. Сильные кандидаты уходят к конкурентам, пока компания «думает».<\/li><li><strong>Отказ кандидату<\/strong>: быстро, уважительно, с краткой обратной связью. Отрасль маленькая, и кандидат сегодня — рекомендатель или кандидат завтра.<\/li><\/ul>\n<h3>1.5 Трудные ситуации и как с ними работать<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Ситуация<\/th><th>Что за ней обычно стоит<\/th><th>Что делать<\/th><\/tr><\/thead><tbody><tr><td>Заказчик отклоняет всех без объяснений<\/td><td>Несогласованный профиль, скрытые требования, страх ошибки<\/td><td>Калибровочная встреча: разобрать каждого по критериям, обновить профиль<\/td><\/tr><tr><td>Заказчик не отвечает неделями<\/td><td>Перегрузка, низкий приоритет, сомнения в бюджете<\/td><td>Короткое письмо с конкретным решением и сроком; эскалация через руководителя<\/td><\/tr><tr><td>Заказчик хочет кандидата из «своего круга» без оценки<\/td><td>Доверие к знакомым<\/td><td>Предложить того же человека пропустить через ту же оценку — это защищает и заказчика<\/td><\/tr><tr><td>Учёный не может выбрать между двумя кандидатами<\/td><td>Разные сильные стороны, нет приоритетов<\/td><td>Вернуться к результатам на 12 месяцев: кто вероятнее их достигнет?<\/td><\/tr><tr><td>Конфликт двух руководителей о профиле<\/td><td>Разные цели<\/td><td>Совместная встреча; решение — за владельцем роли; зафиксировать письменно<\/td><\/tr><tr><td>Требование «срочно, но без бюджета»<\/td><td>Нереалистичные ожидания<\/td><td>Данные рынка и варианты (1.3)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.6 Межкультурная коммуникация в TMK<\/h3>\n<ul><li><strong>Иерархия<\/strong>: в государственной компании Узбекистана важны статус, порядок согласований и уважение к руководителям. Готовьте решения так, чтобы их было легко согласовать по цепочке.<\/li><li><strong>Языки<\/strong>: русский, узбекский, английский. Документы для иностранных партнёров и кандидатов — на английском; для внутренних согласований — на языке, принятом в компании.<\/li><li><strong>Международные партнёры<\/strong> (США, ЕС, Корея, Япония, Китай): разные стили общения, от прямого до очень вежливого и неявного. Узнавайте ожидания до встречи.<\/li><li><strong>Неявные договорённости<\/strong>: подтверждайте ключевые решения письменно и коротко («Фиксирую: …»).<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Стейкхолдер<\/td><td>Stakeholder<\/td><td>Заинтересованная сторона<\/td><\/tr><tr><td>Карта стейкхолдеров<\/td><td>Stakeholder map<\/td><td>Кто влияет на решение и чего хочет<\/td><\/tr><tr><td>Владелец решения<\/td><td>Decision owner<\/td><td>Человек, принимающий итоговое решение<\/td><\/tr><tr><td>Управление ожиданиями<\/td><td>Expectation management<\/td><td>Согласование реалистичных целей<\/td><\/tr><tr><td>Возражение на данных<\/td><td>Data-driven pushback<\/td><td>Несогласие, подкреплённое фактами<\/td><\/tr><tr><td>Эскалация<\/td><td>Escalation<\/td><td>Передача вопроса на уровень выше<\/td><\/tr><tr><td>Калибровочная встреча<\/td><td>Calibration meeting<\/td><td>Согласование критериев на реальных кандидатах<\/td><\/tr><tr><td>Презентация шорт-листа<\/td><td>Shortlist presentation<\/td><td>Встреча с обсуждением кандидатов<\/td><\/tr><tr><td>Сравнительная матрица<\/td><td>Comparison matrix<\/td><td>Кандидаты против критериев<\/td><\/tr><tr><td>Обратная связь заказчика<\/td><td>Hiring manager feedback<\/td><td>Мнение заказчика о кандидате<\/td><\/tr><tr><td>Влияние без полномочий<\/td><td>Influence without authority<\/td><td>Умение убеждать без прямой власти<\/td><\/tr><tr><td>Доверенный советник<\/td><td>Trusted advisor<\/td><td>Партнёр, к мнению которого прислушиваются<\/td><\/tr><tr><td>Межкультурная коммуникация<\/td><td>Cross-cultural communication<\/td><td>Общение с учётом культурных различий<\/td><\/tr><tr><td>Прямой / непрямой стиль<\/td><td>Direct / indirect communication style<\/td><td>Явное или неявное выражение мнения<\/td><\/tr><tr><td>Протокол встречи<\/td><td>Meeting minutes<\/td><td>Письменная фиксация решений<\/td><\/tr><tr><td>Согласование<\/td><td>Approval / sign-off<\/td><td>Утверждение решения<\/td><\/tr><tr><td>Срок решения<\/td><td>Decision deadline<\/td><td>Дата, к которой нужно решение<\/td><\/tr><tr><td>Отказ кандидату<\/td><td>Candidate rejection<\/td><td>Сообщение о решении не в его пользу<\/td><\/tr><tr><td>Опыт кандидата<\/td><td>Candidate experience<\/td><td>Как кандидат ощущает процесс<\/td><\/tr><tr><td>Внутренняя справедливость вознаграждения<\/td><td>Internal pay equity<\/td><td>Соответствие оплаты внутри компании<\/td><\/tr><tr><td>Конфликт интересов<\/td><td>Conflict of interest<\/td><td>Личная заинтересованность в решении<\/td><\/tr><tr><td>Партнёр по бизнесу<\/td><td>Business partner<\/td><td>Роль HR как партнёра руководителя<\/td><\/tr><tr><td>Статус-встреча<\/td><td>Status meeting<\/td><td>Регулярная встреча по ходу поиска<\/td><\/tr><tr><td>Риск-реестр поиска<\/td><td>Search risk register<\/td><td>Перечень рисков поиска и мер<\/td><\/tr><tr><td>Сценарий разговора<\/td><td>Conversation script<\/td><td>Заготовка ключевых фраз<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Фразы для трудных разговоров (RU / EN)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Ситуация<\/th><th>Русский<\/th><th>English<\/th><\/tr><\/thead><tbody><tr><td>Нереалистичный срок<\/td><td>«Понимаю срочность. По данным рынка реалистичный срок — N месяцев. Вот три варианта ускорения…»<\/td><td>\"I understand the urgency. Market data suggests N months. Here are three ways to speed this up…\"<\/td><\/tr><tr><td>Отказ без объяснений<\/td><td>«Чтобы следующие кандидаты были точнее, мне нужна ваша оценка по трём критериям профиля»<\/td><td>\"To make the next candidates more precise, I need your view on three criteria from the profile\"<\/td><\/tr><tr><td>Скрытое требование<\/td><td>«Это важное требование. Давайте внесём его в профиль и посмотрим, как оно меняет пул кандидатов»<\/td><td>\"This is an important requirement. Let's add it to the profile and see how it changes the talent pool\"<\/td><\/tr><tr><td>Затянувшееся решение<\/td><td>«Кандидат получил другое предложение и ждёт нашего решения до пятницы. Что нужно, чтобы решить к четвергу?»<\/td><td>\"The candidate has another offer and needs our decision by Friday. What do we need to decide by Thursday?\"<\/td><\/tr><tr><td>Сомнения в кандидате<\/td><td>«Сильные стороны подтверждены, а опыт пуска — нет. Предлагаю техническое интервью с вашим экспертом»<\/td><td>\"His strengths are confirmed, but start-up experience is not. I suggest a technical interview with your expert\"<\/td><\/tr><tr><td>Конфликт двух руководителей<\/td><td>«Чтобы не терять время, предлагаю встречу втроём и зафиксировать профиль письменно»<\/td><td>\"To save time, let's meet together and agree the profile in writing\"<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Что ценят технические руководители в рекрутере<\/h3>\n<ul><li>Задаёт <strong>точные вопросы<\/strong> и не притворяется экспертом.<\/li><li>Приносит <strong>меньше, но точнее<\/strong> кандидатов.<\/li><li>Говорит <strong>правду о рынке и рисках<\/strong> кандидатов.<\/li><li><strong>Держит процесс<\/strong>: сроки, отчёты, обратная связь.<\/li><li><strong>Бережёт время<\/strong>: готовит материалы заранее, в интервью — по делу.<\/li><\/ul>\n<h3>3.3 Как работать с учёными (R&amp;D Park, исследовательские партнёры)<\/h3>\n<ul><li>Учёные ценят <strong>научный уровень<\/strong> кандидата: публикации, методы, оборудование. Покажите, что вы это изучили (День 23).<\/li><li>Обсуждайте <strong>баланс науки и масштабирования<\/strong>: для R&amp;D Park нужен человек, способный довести идею до пилота и промышленности.<\/li><li>Уважайте <strong>научную этику<\/strong>: авторство, открытость, сотрудничество с университетами (TU Freiberg, МИСИС, KU Leuven).<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Карта стейкхолдеров и три сценария (60 мин).<\/strong><\/p>\n<ol><li><strong>Карта стейкхолдеров<\/strong> для одного поиска TMK (например, «Руководитель нано-аналитической лаборатории» или «Главный технолог APT»): кто участвует, что важно каждому, чего боится, как и когда с ним коммуницировать, кто принимает решение.<\/li><li><strong>Три сценария трудных разговоров<\/strong> (по 10–12 реплик, ваши и заказчика):<ul><li>заказчик хочет «единорога» за месяц;<\/li><li>заказчик отклонил трёх кандидатов подряд без объяснений;<\/li><li>руководитель R&amp;D не может выбрать между учёным с сильными публикациями и производственником с опытом пилота.<\/li><\/ul><\/li><li>Проиграйте один сценарий с коллегой. Что было самым трудным?<\/li><\/ol>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какой стейкхолдер в вашей реальной работе самый трудный? Какую фразу из 3.1 вы используете с ним?<\/li><li>Что было самым трудным в проигрывании сценария?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 30: финальный проект. Выпуск».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> завтра — последний день. Вы соберёте всё, чему научились, в один полный поиск. Сделайте его на реальной вакансии TMK, если можете: так курс закончится результатом для компании.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>D. Maister, C. Green, R. Galford, <em>The Trusted Advisor<\/em> — как стать советником, которому доверяют.<\/li><li>R. Fisher, W. Ury, <em>Getting to Yes<\/em> — переговоры по интересам.<\/li><li>E. Meyer, <em>The Culture Map<\/em> — межкультурная коммуникация.<\/li><li>Ваши записи teach-back из модулей 1–5 — реальные реакции экспертов TMK.<\/li><\/ul>"},{"n":30,"module":6,"title":"Финальный проект: полный цикл Executive Search для TMK","file":"module-06-screening-assessment-stakeholders/day-30-capstone-full-search.md","duration":"4–5 часов","challenge":"Собрать <strong>полный пакет поиска<\/strong> по одной позиции TMK (лучше — реальной): профиль, карта талантов, стратегия, сообщения, гайд интервью, оценка, шорт-лист, оффер и план адаптации. Затем сдать выпускной экзамен и составить личный план развития на 90 дней.","why":"29 Дней вы собирали отдельные инструменты. Эксперта отличает умение соединить их в один управляемый процесс, который даёт TMK нужного человека в разумный срок. Сегодня вы делаете это от начала до конца. Пакет, который вы соберёте, — шаблон для всех следующих поисков.","checklist":[{"text":"Разминка: 10 вопросов по всей программе (15 мин)","minutes":15},{"text":"Повторение: карта программы на одной странице (20 мин)","minutes":20},{"text":"Финальный проект: полный пакет поиска (150 мин; можно разделить на два дня)","minutes":150},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Выпускной экзамен — итоговый тест модуля 6 ≥ 16/20, см. <a href=\"#module-6\">README модуля<\/a> (25 мин)","minutes":25},{"text":"Teach-back: 20 минут защищаете финальный проект перед руководителем","minutes":0},{"text":"Личный план развития на 90 дней (15 мин)","minutes":15},{"text":"Рефлексия: что изменилось за 30 дней (10 мин)","minutes":10}],"minVersion":"разминка → тест дня → выпускной экзамен. Финальный проект — в течение ближайшей недели, без него программа не завершена.","terms":[{"ru":"Полный цикл поиска","en":"End-to-end search / full-cycle search","def":"Поиск от брифинга до адаптации"},{"ru":"Пакет поиска","en":"Search pack","def":"Комплект документов проекта поиска"},{"ru":"Профиль позиции","en":"Position specification","def":"Задача, требования и условия"},{"ru":"Оценочная карта","en":"Scorecard","def":"Критерии с весами и шкалами"},{"ru":"Карта талантов","en":"Talent map","def":"Компании, имена, размер пула"},{"ru":"Стратегия поиска","en":"Search strategy","def":"Каналы, доноры, сроки"},{"ru":"Лонг-лист","en":"Long list","def":"Широкий список кандидатов"},{"ru":"Шорт-лист","en":"Shortlist","def":"Отобранные кандидаты"},{"ru":"Гайд интервью","en":"Interview guide","def":"План структурированного интервью"},{"ru":"Презентация кандидата","en":"Candidate report","def":"Документ для заказчика"},{"ru":"Сравнительная матрица","en":"Comparison matrix","def":"Кандидаты против критериев"},{"ru":"Проверка рекомендаций","en":"Reference check","def":"Разговоры о фактах и поведении"},{"ru":"Предложение о работе","en":"Offer","def":"Условия для кандидата"},{"ru":"План адаптации на 90 дней","en":"90-day onboarding plan","def":"Цели и шаги первых месяцев"},{"ru":"Ретроспектива","en":"Retrospective / post-mortem","def":"Разбор после закрытия поиска"},{"ru":"Качество найма","en":"Quality of hire","def":"Результаты и удержание"},{"ru":"Личный план развития","en":"Personal development plan (PDP)","def":"Цели обучения на следующий период"},{"ru":"Профессиональное сообщество","en":"Professional network","def":"Ассоциации, конференции, эксперты"},{"ru":"Отраслевая экспертиза","en":"Industry expertise","def":"Глубокое знание отрасли"},{"ru":"Доверенный советник","en":"Trusted advisor","def":"Партнёр, к мнению которого прислушиваются"},{"ru":"Защита проекта","en":"Project defence / presentation","def":"Представление результата руководителю"},{"ru":"Сертификат о прохождении","en":"Certificate of completion","def":"Подтверждение окончания программы"},{"ru":"Непрерывное обучение","en":"Continuous learning","def":"Регулярное обновление знаний"},{"ru":"Наставничество","en":"Mentoring","def":"Передача опыта младшим коллегам"},{"ru":"Экспертная позиция","en":"Expert positioning","def":"Репутация специалиста в отрасли"}],"quiz":[{"q":"С чего начинается любой поиск в логике курса?","options":["С публикации вакансии на всех доступных сайтах, в соцсетях и телеграм-каналах","С поиска в LinkedIn по названию должности на английском","С отправки сообщений знакомым и бывшим коллегам","С понимания задачи через процесс и формулировки роли через результаты"],"answer":3,"explain":"Сначала задача и профиль, потом поиск."},{"q":"Что отличает эксперта по поиску от исполнителя заявок?","options":["Количество отправленных заказчику резюме в месяц","Умение соединить понимание отрасли, поиск, оценку и работу с заказчиком в управляемый процесс","Знание всех технологий отрасли лучше, чем у самих технологов, и умение экзаменовать кандидатов","Умение работать без брифингов, профилей и отчётов"],"answer":1,"explain":"Это и есть цель 30-дневной программы."},{"q":"Какой документ — «контракт на поиск» с заказчиком?","options":["Утверждённый одностраничный профиль позиции","Резюме лучшего кандидата из лонг-листа с комментариями","Еженедельный отчёт о ходе поиска","Протокол собеседования с кандидатом"],"answer":0,"explain":"С ним вы управляете поиском, а не угадываете ожидания."},{"q":"Кандидат блестяще говорит, но после трёх уточнений не называет ни одной цифры по ключевому проекту. Ваш вывод:","options":["Сильный кандидат: хорошо говорит, уверенно держится, значит, опыт у него реальный","Отказать немедленно, без дополнительных проверок","Опыт не подтверждён: нужна дополнительная проверка (эксперт, кейс, рекомендации)","Сразу передать оффер, пока его не перехватили"],"answer":2,"explain":"«Не подтверждено» ≠ «опровергнуто», но и не «подтверждено»."},{"q":"Что важнее при выборе между двумя финалистами?","options":["Кто больше понравился председателю комиссии на финальном интервью и лучше держался","Кто из двух финалистов просит меньшую зарплату","Кто моложе и дольше проработает в компании","Кто вероятнее достигнет результатов профиля успеха и с какими мерами поддержки"],"answer":3,"explain":"Решение по результатам и свидетельствам, с учётом рисков."},{"q":"Зачем после закрытия поиска ретроспектива?","options":["Чтобы найти виновных в задержке поиска и учесть это в их годовой оценке и премии","Чтобы превратить опыт в систему: какие доноры, каналы и сообщения сработали","Это требование внешних аудиторов к службе персонала","Чтобы отчитаться о количестве звонков и сообщений"],"answer":1,"explain":"Каждый поиск делает следующий быстрее."},{"q":"Что делает карту талантов активом TMK?","options":["Однотипные роли повторяются, и живая карта обслуживает много вакансий","Её можно продать другим компаниям и агентствам","Она нужна только для отчёта руководству","Её составляют один раз для самой сложной вакансии и больше никогда не обновляют"],"answer":0,"explain":"Карта живёт и обновляется после каждого разговора."},{"q":"Как курс предлагает работать с заказчиком, который требует невозможного?","options":["Согласиться и попытаться выполнить любой ценой","Отказаться от вакансии без объяснения причин","Признать цель, показать данные рынка, предложить варианты и попросить решение","Сразу эскалировать вопрос на председателя правления, чтобы он повлиял на заказчика"],"answer":2,"explain":"Возражение на данных, а не на эмоциях."},{"q":"Какой элемент финального проекта защищает TMK от решения «понравился / не понравился»?","options":["Красивый шаблон презентации кандидатов для комиссии","Длинный лонг-лист из сотни профилей","Быстрый оффер лучшему кандидату сразу после первого интервью, пока его не перехватили","Оценочная карта с весами и описанными уровнями, согласованная до интервью"],"answer":3,"explain":"Плюс независимые оценки интервьюеров."},{"q":"Что делать после завершения программы, чтобы знания не «остыли»?","options":["Перечитать весь курс через год, чтобы освежить знания","Применять инструменты на каждой вакансии, вести карты и учиться через ассоциации и эк
