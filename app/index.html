льство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.3 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Обогатительная фабрика (ОФ)","en":"Concentrator / processing plant","def":"Предприятие по обогащению руды"},{"ru":"Рудоподготовка","en":"Comminution","def":"Дробление и измельчение"},{"ru":"Дробление","en":"Crushing","def":"Уменьшение крупности кусков руды"},{"ru":"Щековая дробилка","en":"Jaw crusher","def":"Дробилка крупного дробления с подвижной щекой"},{"ru":"Конусная дробилка","en":"Cone crusher / gyratory crusher","def":"Дробилка с вращающимся конусом"},{"ru":"Валковый пресс высокого давления","en":"HPGR (high pressure grinding rolls)","def":"Энергоэффективное измельчение между валками"},{"ru":"Грохот","en":"Screen","def":"Разделение материала по крупности на ситах"},{"ru":"Измельчение","en":"Grinding / milling","def":"Тонкое измельчение руды в мельницах"},{"ru":"Мельница полусамоизмельчения","en":"SAG mill (semi-autogenous grinding)","def":"Мельница, где руда измельчает сама себя с добавкой шаров"},{"ru":"Шаровая мельница","en":"Ball mill","def":"Мельница со стальными шарами"},{"ru":"Мелющие тела","en":"Grinding media","def":"Шары и стержни для измельчения"},{"ru":"Футеровка","en":"Liner","def":"Износостойкая облицовка мельниц"},{"ru":"Классификация","en":"Classification","def":"Разделение по крупности в потоке пульпы"},{"ru":"Гидроциклон","en":"Hydrocyclone","def":"Аппарат классификации центробежной силой"},{"ru":"Циркулирующая нагрузка","en":"Circulating load","def":"Материал, возвращаемый в мельницу"},{"ru":"Крупность 80%","en":"P80","def":"Размер, мельче которого 80% массы"},{"ru":"Индекс Бонда","en":"Bond Work Index","def":"Показатель трудности измельчения"},{"ru":"Раскрытие минералов","en":"Liberation","def":"Освобождение зёрен ценного минерала от породы"},{"ru":"Пульпа","en":"Slurry / pulp","def":"Смесь измельчённой руды с водой"},{"ru":"Концентрат","en":"Concentrate","def":"Продукт с высоким содержанием ценного минерала"},{"ru":"Хвосты","en":"Tailings","def":"Отходы обогащения"},{"ru":"Промпродукт","en":"Middlings","def":"Промежуточный продукт для доработки"},{"ru":"Выход концентрата","en":"Mass pull / yield","def":"Доля массы руды, перешедшая в концентрат"},{"ru":"Извлечение","en":"Recovery","def":"Доля металла, перешедшая в концентрат"},{"ru":"Качество концентрата","en":"Concentrate grade","def":"Содержание ценного компонента в концентрате"},{"ru":"Сгуститель","en":"Thickener","def":"Аппарат осаждения твёрдого из пульпы"},{"ru":"Фильтр-пресс","en":"Filter press","def":"Аппарат обезвоживания под давлением"},{"ru":"Хвостохранилище","en":"Tailings storage facility (TSF)","def":"Сооружение для хранения хвостов"},{"ru":"Сухое складирование хвостов","en":"Dry stacking","def":"Складирование отфильтрованных хвостов"},{"ru":"Металлургический баланс","en":"Metallurgical accounting / mass balance","def":"Учёт металла по продуктам фабрики"},{"ru":"Технологическая минералогия","en":"Process mineralogy","def":"Изучение минералогии для технологии"},{"ru":"Геометаллургия","en":"Geometallurgy","def":"Связка геологии и технологии переработки"}],"quiz":[{"q":"Чем обогащение отличается от металлургии?","options":["Ничем: в СНГ это называют обогащением, а на Западе — металлургией, процесс один и тот же","Обогащение проводится только на руднике, а металлургия — только на металлургическом заводе в другом городе","Обогащение отделяет ценные минералы без изменения их химического состава; металлургия химически извлекает металл","Металлургия — это часть обогащения, которая отвечает за сушку и отгрузку концентрата"],"answer":2,"explain":"Обогащение — физические и физико-химические методы разделения минералов. Металлургия — химические превращения (растворение, восстановление, плавка)."},{"q":"Руда — 0,5% WO₃, концентрат — 65% WO₃, хвосты — 0,1% WO₃. Извлечение примерно:","options":["50%","65%","80%","99%"],"answer":2,"explain":"R = 65 · (0,5 − 0,1) / [0,5 · (65 − 0,1)] ≈ 80%."},{"q":"Что такое P80?","options":["Размер, мельче которого 80% массы продукта","Извлечение металла в концентрат, равное 80%","Производительность мельницы 80 т/ч по питанию","Загрузка мельницы мелющими телами на 80% объёма"],"answer":0,"explain":"Главный параметр крупности помола. От него зависят раскрытие минералов и показатели обогащения."},{"q":"Зачем гидроциклон работает в замкнутом цикле с шаровой мельницей?","options":["Охлаждает мельницу водой, чтобы не перегревались подшипники, футеровка и мелющие шары","Удаляет воду из готового концентрата перед фильтрацией и сушкой","Дозирует флотационные реагенты в пульпу перед флотомашинами","Возвращает крупный материал на доизмельчение, а готовый по крупности отправляет дальше"],"answer":3,"explain":"Пески гидроциклона возвращаются в мельницу (циркулирующая нагрузка), слив идёт на обогащение."},{"q":"Что означает компромисс «качество — извлечение»?","options":["Качество и извлечение всегда растут вместе при правильной настройке процесса","Чем выше качество концентрата, тем, как правило, ниже извлечение, и наоборот","Это понятие из бухгалтерии: учёт стоимости концентрата по качеству","Извлечение не зависит от качества концентрата и определяется только рудой"],"answer":1,"explain":"Технолог ищет экономический оптимум с учётом цены, требований покупателя и штрафов за примеси."},{"q":"Какой процесс — крупнейший потребитель энергии на обогатительной фабрике?","options":["Флотация (аэрация и перемешивание пульпы)","Фильтрация и сушка концентрата","Освещение и отопление корпусов фабрики","Рудоподготовка (дробление и измельчение)"],"answer":3,"explain":"По оценкам CEEC, рудоподготовка может давать порядка половины энергопотребления горно-обогатительного предприятия."},{"q":"После какой аварии был принят глобальный стандарт по хвостохранилищам GISTM?","options":["Авария на Чернобыльской АЭС (СССР, 1986)","Авария на АЭС Фукусима (Япония, 2011)","Брумадинью (Vale, Бразилия, 2019)","Пожар на заводе Олимпик-Дам (Австралия, 2001)"],"answer":2,"explain":"Катастрофа на дамбе в Брумадинью в 2019 г. и предыдущие аварии (Маунт-Полли, Фундан) привели к принятию GISTM в 2020 г."},{"q":"Почему переработка старых хвостов (как на Ингичке) — особая задача?","options":["Хвосты уже измельчены, минералы частично окислены и ошламованы, содержание низкое","Хвосты радиоактивны, и их переработка требует специальной лицензии","Хвосты не содержат вольфрама, поэтому из них извлекают только кварц","Это проще, чем переработка руды: дробление и измельчение уже не нужны, а содержание всегда выше"],"answer":0,"explain":"Нужны технологи с опытом переработки тонкого, окисленного, бедного сырья, особенно по вольфраму."},{"q":"Технолог говорит: «Мы улучшили показатели фабрики». Лучший уточняющий вопрос:","options":["«Вам нравилась работа на фабрике и коллектив, с которым вы работали?»","«Какие именно показатели, с каких значений на какие, за счёт чего и какая ваша личная роль?»","«Сколько лет вы проработали на этой фабрике и на каких должностях?»","«Какое у вас образование, где вы учились и проходили ли вы курсы повышения квалификации за рубежом?»"],"answer":1,"explain":"Практик ответит цифрами и причинами. Поверхностный кандидат уйдёт в общие слова."},{"q":"Что изучает технологическая минералогия (QEMSCAN, MLA)?","options":["Цены на минералы и их изменение на мировых рынках сырья","Историю образования месторождения и возраст горных пород","Минеральный состав, раскрытие и формы потерь металла для управления технологией","Химический состав оборотной воды, стоков и выбросов обогатительной фабрики для экологов"],"answer":2,"explain":"Она отвечает на вопрос «почему металл теряется» и связывает геологию с технологией (геометаллургия)."}],"html":"<h2>0. Разминка: вспомнить Модуль 1<\/h2>\n<ol><li>Почему «руда — понятие экономическое»?<\/li><li>Какие свойства минералов используют гравитация, магнитная сепарация и флотация?<\/li><li>Почему вольфрамовые минералы склонны к ошламованию и чем это грозит?<\/li><li>Что такое mine-to-mill?<\/li><li>Кто на западной фабрике называется metallurgist?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Порода становится рудой, только если извлечение металла выгодно при текущих ценах и технологиях.<\/li><li>Плотность, магнитная восприимчивость, свойства поверхности (гидрофобность).<\/li><li>Шеелит и вольфрамит хрупкие, легко переизмельчаются в тонкие шламы, которые плохо улавливаются. Растут потери, падает извлечение.<\/li><li>Оптимизация буровзрывных работ ради производительности и затрат фабрики.<\/li><li>Технолог-обогатитель.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Зачем обогащать: логика фабрики<\/h3>\n<p>Руда содержит доли процента ценного минерала. Везти её на металлургический завод или растворять целиком невыгодно. <strong>Обогащение<\/strong> (mineral processing, beneficiation) отделяет ценные минералы от пустой породы <strong>без изменения их химического состава<\/strong> (в отличие от металлургии). Получаются:<\/p>\n<ul><li><strong>концентрат<\/strong> (concentrate) — продукт с высоким содержанием ценного минерала;<\/li><li><strong>хвосты<\/strong> (tailings) — отходы обогащения;<\/li><li>иногда <strong>промпродукт<\/strong> (middlings) — промежуточный продукт для доработки.<\/li><\/ul>\n<p>Общая схема любой фабрики:<\/p>\n<pre class=\"code\"><code>Руда (ROM) → ДРОБЛЕНИЕ → ИЗМЕЛЬЧЕНИЕ + КЛАССИФИКАЦИЯ → РАЗДЕЛЕНИЕ (гравитация / флотация / магнитная сепарация)\n           → ОБЕЗВОЖИВАНИЕ концентрата (сгущение, фильтрация, сушка) → КОНЦЕНТРАТ\n           → ХВОСТЫ → сгущение → хвостохранилище (или сухое складирование, или закладка)<\/code><\/pre>\n<p><strong>Раскрытие<\/strong> (liberation) — главная идея. Ценный минерал «запечатан» в породе. Чтобы его отделить, руду нужно измельчить до крупности, при которой зёрна ценного минерала освобождаются от пустой породы. Измельчение не до конца — минерал остаётся в сростках и уходит в хвосты. Слишком тонкое — шламы и потери (особенно для вольфрама), а ещё лишние затраты энергии.<\/p>\n<h3>1.2 Три главных показателя и формула двух продуктов<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Показатель<\/th><th>Обозначение<\/th><th>Смысл<\/th><\/tr><\/thead><tbody><tr><td>Содержание в руде (питании)<\/td><td>f (feed grade)<\/td><td>% ценного компонента в исходной руде<\/td><\/tr><tr><td>Содержание в концентрате (качество)<\/td><td>c (concentrate grade)<\/td><td>% ценного компонента в концентрате<\/td><\/tr><tr><td>Содержание в хвостах<\/td><td>t (tailings grade)<\/td><td>% ценного компонента, ушедшего в отходы<\/td><\/tr><tr><td>Выход концентрата<\/td><td>γ (mass pull / yield)<\/td><td>Доля массы руды, перешедшая в концентрат<\/td><\/tr><tr><td><strong>Извлечение<\/strong><\/td><td>ε, R (recovery)<\/td><td>Доля <strong>металла<\/strong> руды, перешедшая в концентрат<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Формулы (баланс двух продуктов):<\/strong><\/p>\n<pre class=\"code\"><code>Выход концентрата  γ = (f − t) / (c − t)\nИзвлечение         R = c · (f − t) / [ f · (c − t) ] × 100%\nСтепень концентрации K = c / f<\/code><\/pre>\n<p><strong>Пример (вольфрам).<\/strong> f = 0,5% WO₃, c = 65% WO₃, t = 0,1% WO₃.<\/p>\n<ul><li>γ = (0,5 − 0,1) / (65 − 0,1) = 0,4 / 64,9 ≈ <strong>0,62%<\/strong>: из 1 000 т руды получается ≈ 6,2 т концентрата.<\/li><li>R = 65 · 0,4 / (0,5 · 64,9) = 26 / 32,45 ≈ <strong>80%<\/strong>: 80% вольфрама попало в концентрат, 20% ушло в хвосты.<\/li><\/ul>\n<p><strong>Компромисс «качество — извлечение»<\/strong> (grade-recovery trade-off). Хотите более чистый концентрат — потеряете часть металла в хвостах. Хотите извлечь больше — загрязните концентрат. Задача технолога — найти экономический оптимум. Сильный кандидат объясняет <strong>свою кривую<\/strong> «качество — извлечение» и где на ней работала фабрика.<\/p>\n<p><strong>Задачи для самопроверки:<\/strong><\/p>\n<ol><li>f = 1,0% Cu, c = 25% Cu, t = 0,1% Cu. Найдите γ и R.<\/li><li>Извлечение выросло с 75% до 80% при той же руде и производительности 500 тыс. т/год, f = 0,5% WO₃. Сколько дополнительных тонн WO₃ в год это даёт?<\/li><li>Почему для вольфрама снижение t с 0,10% до 0,08% — серьёзное достижение?<\/li><\/ol>\n<details><summary>Решения<\/summary>\n<ol><li>γ = (1,0 − 0,1) / (25 − 0,1) = 0,9 / 24,9 ≈ 3,6%; R = 25 · 0,9 / (1,0 · 24,9) ≈ 90,4%.<\/li><li>WO₃ в руде: 500 000 × 0,005 = 2 500 т/год. +5 п. п. извлечения = +125 т WO₃ в год (≈ 192 т концентрата с 65% WO₃). При высоких ценах на вольфрам это миллионы долларов.<\/li><li>При f = 0,5% это 0,02 п. п. в хвостах, или около 4% всего вольфрама руды. Вольфрамовые шламы трудно улавливать, поэтому каждая сотая доля процента в хвостах — результат серьёзной технологической работы.<\/li><\/ol>\n<\/details>\n<h3>1.3 Дробление (crushing)<\/h3>\n<p>Цель — уменьшить куски руды от сотен миллиметров (а после взрыва до 1–1,5 м) до крупности, подходящей для мельниц.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Стадия<\/th><th>Оборудование<\/th><th>Крупность (ориентир)<\/th><\/tr><\/thead><tbody><tr><td>Крупное (primary)<\/td><td><strong>Конусная дробилка крупного дробления<\/strong> (gyratory) — для больших потоков; <strong>щековая<\/strong> (jaw) — для меньших<\/td><td>До ~150–250 мм<\/td><\/tr><tr><td>Среднее и мелкое (secondary / tertiary)<\/td><td><strong>Конусные дробилки<\/strong> (cone crushers)<\/td><td>До ~10–50 мм<\/td><\/tr><tr><td>Высоконапорное измельчение<\/td><td><strong>Валковые прессы высокого давления<\/strong> (HPGR)<\/td><td>Мелкий продукт с микротрещинами; энергоэффективно<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Дополнительное оборудование: <strong>грохоты<\/strong> (screens) — разделяют по крупности; конвейеры; питатели; <strong>склад крупнодроблёной руды<\/strong> (stockpile) — буфер между рудником и фабрикой.<\/p>\n<p><strong>Производители:<\/strong> Metso (до 2024 г. — Metso Outotec), FLSmidth, Sandvik, Weir (Trio, Enduron), thyssenkrupp Polysius / KHD (HPGR), в СНГ — Уралмашзавод и др.<\/p>\n<h3>1.4 Измельчение и классификация (grinding &amp; classification)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Мельница<\/th><th>Как работает<\/th><th>Где применяется<\/th><\/tr><\/thead><tbody><tr><td><strong>Мельница самоизмельчения / полусамоизмельчения<\/strong> (AG / SAG)<\/td><td>Руда измельчает сама себя; в SAG добавляют немного шаров. Диаметр — до 40 футов (≈ 12 м)<\/td><td>Первая стадия измельчения на крупных фабриках<\/td><\/tr><tr><td><strong>Шаровая мельница<\/strong> (ball mill)<\/td><td>Стальные шары измельчают руду<\/td><td>Вторая стадия, тонкое измельчение<\/td><\/tr><tr><td><strong>Стержневая мельница<\/strong> (rod mill)<\/td><td>Стальные стержни<\/td><td>Старые схемы; на фабриках СНГ встречается<\/td><\/tr><tr><td><strong>Вертикальные / перемешивающие мельницы<\/strong> (stirred mills: Vertimill, IsaMill, HIGmill)<\/td><td>Мелющая среда перемешивается ротором<\/td><td>Доизмельчение и сверхтонкое измельчение (до десятков микрон и тоньше)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Типовые схемы:<\/strong><\/p>\n<ul><li><strong>SABC<\/strong> — SAG-мельница + шаровая мельница + дробилка для «галей» (pebble crusher);<\/li><li>HPGR + шаровая мельница;<\/li><li>классические схемы СНГ — многостадиальное дробление + стержневые и шаровые мельницы.<\/li><\/ul>\n<p><strong>Классификация<\/strong> — разделение по крупности: <strong>гидроциклоны<\/strong> (hydrocyclones) и тонкие грохоты. Мельница и гидроциклон работают в <strong>замкнутом цикле<\/strong>: крупная фракция (пески) возвращается в мельницу (<strong>циркулирующая нагрузка<\/strong>, часто 200–300%), тонкая (слив) идёт на обогащение.<\/p>\n<p><strong>Ключевые параметры:<\/strong><\/p>\n<ul><li><strong>P80<\/strong> — размер, мельче которого 80% массы продукта (например, P80 = 75 мкм). Главный параметр помола.<\/li><li><strong>F80<\/strong> — то же для питания.<\/li><li><strong>Индекс Бонда<\/strong> (Bond Work Index, кВт·ч/т) — показатель трудности измельчения руды. Тесты JK Drop Weight и SMC — для расчёта SAG-мельниц.<\/li><li><strong>Удельный расход энергии<\/strong> (кВт·ч/т), расход мелющих тел и футеровки (кг/т).<\/li><\/ul>\n<p><strong>Энергия.<\/strong> Рудоподготовка (дробление и измельчение) — крупнейший потребитель энергии на фабрике. По оценкам CEEC (Coalition for Eco-Efficient Comminution), на неё может приходиться порядка половины энергопотребления горно-обогатительного предприятия. Отсюда спрос на специалистов по оптимизации измельчения.<\/p>\n<p><strong>Мировая школа:<\/strong> <strong>JKMRC<\/strong> (University of Queensland) — центр исследований измельчения и флотации; программы симуляции JKSimMet и JKSimFloat. Упоминание JKMRC или JKTech в резюме — сильный сигнал.<\/p>\n<h3>1.5 Обезвоживание и хвосты (dewatering &amp; tailings)<\/h3>\n<ul><li><strong>Сгущение<\/strong> (thickening): сгустители (thickeners) — обычные, высокопроизводительные (high-rate), пастовые; флокулянты.<\/li><li><strong>Фильтрация<\/strong> (filtration): вакуумные дисковые и ленточные фильтры, <strong>фильтр-прессы<\/strong> (Metso Larox, FLSmidth, Diemme).<\/li><li><strong>Сушка<\/strong> (drying): сушильные барабаны и печи для концентратов, если нужна низкая влажность.<\/li><li><strong>Хвостохранилища<\/strong> (tailings storage facilities, TSF). Способы наращивания дамб: upstream (наиболее рискованный; после аварий в Бразилии запрещён в ряде стран), downstream, centerline. Альтернативы — <strong>сухое складирование<\/strong> (dry stacking) отфильтрованных хвостов и <strong>пастовые хвосты<\/strong>.<\/li><li>Крупные аварии изменили отрасль: Маунт-Полли (Канада, 2014), Фундан / Samarco (Бразилия, 2015), <strong>Брумадинью<\/strong> (Vale, Бразилия, 2019, более 270 погибших). После них появился <strong>GISTM<\/strong> (2020) — глобальный стандарт управления хвостохранилищами. Новая роль: <strong>Engineer of Record<\/strong> и <strong>Responsible Tailings Facility Engineer<\/strong>.<\/li><\/ul>\n<h3>1.6 Управление фабрикой: автоматизация и учёт<\/h3>\n<ul><li><strong>АСУ ТП<\/strong> (process control): DCS / PLC / SCADA (ABB 800xA, Siemens PCS 7, Emerson DeltaV, Honeywell Experion, Yokogawa).<\/li><li><strong>Анализаторы в потоке<\/strong> (on-stream analyzers): содержание металла в пульпе в реальном времени; гранулометрия слива гидроциклонов.<\/li><li><strong>Системы продвинутого управления<\/strong> (APC — advanced process control) — стабилизация и оптимизация мельниц и флотации.<\/li><li><strong>Металлургический баланс<\/strong> (metallurgical accounting) — учёт металла по фабрике: сколько пришло, сколько в концентрате, сколько в хвостах. Ответственность технолога.<\/li><li><strong>Технологическая минералогия<\/strong> (process mineralogy): автоматизированные системы QEMSCAN, MLA, TIMA. Показывают раскрытие и формы потерь металла. Связка геологии и обогащения называется <strong>геометаллургией<\/strong> (geometallurgy) — очень востребованное направление.<\/li><li><strong>KPI фабрики:<\/strong> производительность (т/ч), <strong>коэффициент готовности<\/strong> (availability, %), P80, извлечение, качество концентрата, удельный расход энергии, расход реагентов (г/т), расход воды (м³/т), содержание в хвостах.<\/li><\/ul>\n<blockquote><p><strong>TMK:<\/strong> Ингичкинская фабрика перерабатывает <strong>техногенные отходы<\/strong> (старые хвосты) вольфрамового рудника. Это особая задача: материал уже измельчён, минералы частично окислены и ошламованы, а содержание низкое. Для этого нужны технологи с опытом <strong>переработки хвостов<\/strong> (tailings retreatment) и тонкого вольфрамового материала. Планы TMK по росту выпуска концентрата с 300 до 14 950 т означают и новые фабрики, и большой найм обогатителей.<\/p><\/blockquote>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Обогатительная фабрика (ОФ)<\/td><td>Concentrator / processing plant<\/td><td>Предприятие по обогащению руды<\/td><\/tr><tr><td>Рудоподготовка<\/td><td>Comminution<\/td><td>Дробление и измельчение<\/td><\/tr><tr><td>Дробление<\/td><td>Crushing<\/td><td>Уменьшение крупности кусков руды<\/td><\/tr><tr><td>Щековая дробилка<\/td><td>Jaw crusher<\/td><td>Дробилка крупного дробления с подвижной щекой<\/td><\/tr><tr><td>Конусная дробилка<\/td><td>Cone crusher / gyratory crusher<\/td><td>Дробилка с вращающимся конусом<\/td><\/tr><tr><td>Валковый пресс высокого давления<\/td><td>HPGR (high pressure grinding rolls)<\/td><td>Энергоэффективное измельчение между валками<\/td><\/tr><tr><td>Грохот<\/td><td>Screen<\/td><td>Разделение материала по крупности на ситах<\/td><\/tr><tr><td>Измельчение<\/td><td>Grinding / milling<\/td><td>Тонкое измельчение руды в мельницах<\/td><\/tr><tr><td>Мельница полусамоизмельчения<\/td><td>SAG mill (semi-autogenous grinding)<\/td><td>Мельница, где руда измельчает сама себя с добавкой шаров<\/td><\/tr><tr><td>Шаровая мельница<\/td><td>Ball mill<\/td><td>Мельница со стальными шарами<\/td><\/tr><tr><td>Мелющие тела<\/td><td>Grinding media<\/td><td>Шары и стержни для измельчения<\/td><\/tr><tr><td>Футеровка<\/td><td>Liner<\/td><td>Износостойкая облицовка мельниц<\/td><\/tr><tr><td>Классификация<\/td><td>Classification<\/td><td>Разделение по крупности в потоке пульпы<\/td><\/tr><tr><td>Гидроциклон<\/td><td>Hydrocyclone<\/td><td>Аппарат классификации центробежной силой<\/td><\/tr><tr><td>Циркулирующая нагрузка<\/td><td>Circulating load<\/td><td>Материал, возвращаемый в мельницу<\/td><\/tr><tr><td>Крупность 80%<\/td><td>P80<\/td><td>Размер, мельче которого 80% массы<\/td><\/tr><tr><td>Индекс Бонда<\/td><td>Bond Work Index<\/td><td>Показатель трудности измельчения<\/td><\/tr><tr><td>Раскрытие минералов<\/td><td>Liberation<\/td><td>Освобождение зёрен ценного минерала от породы<\/td><\/tr><tr><td>Пульпа<\/td><td>Slurry / pulp<\/td><td>Смесь измельчённой руды с водой<\/td><\/tr><tr><td>Концентрат<\/td><td>Concentrate<\/td><td>Продукт с высоким содержанием ценного минерала<\/td><\/tr><tr><td>Хвосты<\/td><td>Tailings<\/td><td>Отходы обогащения<\/td><\/tr><tr><td>Промпродукт<\/td><td>Middlings<\/td><td>Промежуточный продукт для доработки<\/td><\/tr><tr><td>Выход концентрата<\/td><td>Mass pull / yield<\/td><td>Доля массы руды, перешедшая в концентрат<\/td><\/tr><tr><td>Извлечение<\/td><td>Recovery<\/td><td>Доля металла, перешедшая в концентрат<\/td><\/tr><tr><td>Качество концентрата<\/td><td>Concentrate grade<\/td><td>Содержание ценного компонента в концентрате<\/td><\/tr><tr><td>Сгуститель<\/td><td>Thickener<\/td><td>Аппарат осаждения твёрдого из пульпы<\/td><\/tr><tr><td>Фильтр-пресс<\/td><td>Filter press<\/td><td>Аппарат обезвоживания под давлением<\/td><\/tr><tr><td>Хвостохранилище<\/td><td>Tailings storage facility (TSF)<\/td><td>Сооружение для хранения хвостов<\/td><\/tr><tr><td>Сухое складирование хвостов<\/td><td>Dry stacking<\/td><td>Складирование отфильтрованных хвостов<\/td><\/tr><tr><td>Металлургический баланс<\/td><td>Metallurgical accounting / mass balance<\/td><td>Учёт металла по продуктам фабрики<\/td><\/tr><tr><td>Технологическая минералогия<\/td><td>Process mineralogy<\/td><td>Изучение минералогии для технологии<\/td><\/tr><tr><td>Геометаллургия<\/td><td>Geometallurgy<\/td><td>Связка геологии и технологии переработки<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли обогатительной фабрики<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Зона ответственности<\/th><th>Маркеры уровня<\/th><\/tr><\/thead><tbody><tr><td>Директор / начальник ОФ<\/td><td>Processing Manager / Concentrator Manager<\/td><td>Вся фабрика: производство, люди, бюджет, безопасность<\/td><td>Производительность (млн т/год), продукция, численность<\/td><\/tr><tr><td>Главный технолог / ведущий обогатитель<\/td><td>Chief / Senior Metallurgist<\/td><td>Технология, баланс, оптимизация, испытания<\/td><td>Проекты с цифрами «было → стало»<\/td><\/tr><tr><td>Технолог фабрики<\/td><td>Plant Metallurgist / Process Engineer<\/td><td>Ежедневная технология участка<\/td><td>Схема, реагенты, KPI участка<\/td><\/tr><tr><td>Начальник смены / участка<\/td><td>Shift Supervisor / Area Supervisor<\/td><td>Производство в смене<\/td><td>Численность, стабильность<\/td><\/tr><tr><td>Инженер по технологической минералогии<\/td><td>Process Mineralogist / Geometallurgist<\/td><td>Минералогия потерь, модели переработки<\/td><td>QEMSCAN/MLA, геометаллургические модели<\/td><\/tr><tr><td>Инженер АСУ ТП<\/td><td>Process Control Engineer<\/td><td>DCS, APC, контуры регулирования<\/td><td>Системы, проекты APC с эффектом<\/td><\/tr><tr><td>Инженер по хвостохранилищам<\/td><td>Tailings Engineer / Engineer of Record<\/td><td>Безопасность хвостохранилищ<\/td><td>GISTM, мониторинг, проектирование<\/td><\/tr><tr><td>Механик фабрики<\/td><td>Fixed Plant Maintenance Superintendent<\/td><td>ТОиР дробилок, мельниц, насосов<\/td><td>Готовность фабрики, крупные ремонты мельниц<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга технолога-обогатителя<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Назовите содержание в питании, качество концентрата, извлечение и производительность вашей фабрики»<\/td><td>Четыре цифры сразу, в правильных единицах, с разбросом по сменам<\/td><td>Не помнит или называет только одну цифру<\/td><\/tr><tr><td>«Где на кривой \"качество — извлечение\" работала фабрика и почему?»<\/td><td>Объясняет экономику: цена, штрафы за примеси, требования покупателя<\/td><td>Не понимает компромисса<\/td><\/tr><tr><td>«Какой P80 и как вы его контролировали?»<\/td><td>Цифра, анализаторы, циклоны, влияние на флотацию<\/td><td>«Помол нормальный»<\/td><\/tr><tr><td>«Где основные потери металла? Как вы это узнали?»<\/td><td>Классы крупности, минералогия потерь, сростки, шламы; данные QEMSCAN/MLA<\/td><td>«В хвостах» без анализа<\/td><\/tr><tr><td>«Какой проект улучшения вы вели лично? Какой результат?»<\/td><td>Конкретный проект, цифры, затраты, сроки, роль<\/td><td>Перечисляет обязанности вместо результатов<\/td><\/tr><tr><td>(Вольфрам) «Как вы боролись с потерями вольфрама в шламах?»<\/td><td>Щадящее измельчение, ранний вывод готового класса, тонкая гравитация, флотация шламов<\/td><td>Не знает, что это главная проблема вольфрама<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать обогатителей<\/h3>\n<ul><li><strong>Крупные медно-порфировые фабрики<\/strong> — мощная школа измельчения и флотации: АГМК (рядом и с понятным контекстом), Казахстан (KAZ Minerals — Актогай, Бозшаколь; Kazzinc), Монголия (Эрдэнэт, Оюу-Толгой), Чили, Перу.<\/li><li><strong>Вольфрам и олово:<\/strong> Almonty (Португалия, Корея), Wolfram Bergbau und Hütten (Миттерзиль, Австрия), Masan High-Tech Materials (Вьетнам), китайские фабрики (Цзянси, Хунань), Россия (Приморье — с проверкой санкционных ограничений).<\/li><li><strong>Поставщики оборудования и технологий:<\/strong> Metso, FLSmidth, Weir — у них работают технологи по процессам (process specialists).<\/li><li><strong>Лаборатории технологических испытаний:<\/strong> SGS (Лейкфилд, Канада), ALS Metallurgy, Bureau Veritas, Mintek, JKTech.<\/li><li><strong>Университеты:<\/strong> JKMRC (Квинсленд), Camborne School of Mines, McGill, UBC, TU Bergakademie Freiberg, НИТУ МИСИС, Горный университет (Санкт-Петербург), ТашГТУ, НГГТУ.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Схема фабрики.<\/strong> Нарисуйте от руки схему: дробление → измельчение (SAG + шаровая мельница с гидроциклонами) → флотация → сгущение и фильтрация → концентрат; хвосты → хвостохранилище. Подпишите аппараты по-русски и по-английски. Отметьте, где стоят ключевые роли (кто отвечает за какой участок).<\/p>\n<p><strong>Задание 2 (10 мин). Вопросы для интервью.<\/strong> Подготовьте 7 вопросов для позиции «Начальник обогатительной фабрики (вольфрам, переработка техногенного сырья)». К каждому — маркер сильного ответа.<\/p>\n<p><strong>Бонус.<\/strong> Спросите технолога Ингичкинской фабрики или технолога TMK: «Какое извлечение сейчас и где основные потери?». Сверьте с теорией.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Объясните формулу извлечения своими словами за 30 секунд.<\/li><li>Какой один вопрос вы теперь обязательно зададите любому обогатителю?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 7: флотация, гравитация, магнитная сепарация».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы только что сделали то, чего боятся многие HR, — посчитали технологический баланс. Цифры перестали быть страшными. Завтра вы узнаете, как именно фабрика отделяет шеелит от кальцита. Это одна из самых тонких задач обогащения в мире.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>B. A. Wills, J. A. Finch, <em>Wills' Mineral Processing Technology<\/em> — главный учебник по обогащению в мире.<\/li><li>Авдохин В. М. «Основы обогащения полезных ископаемых» (МГГУ) — учебник советской и российской школы.<\/li><li><a href=\"https://www.911metallurgist.com\" target=\"_blank\" rel=\"noopener\">911metallurgist.com<\/a> — тысячи практических статей по обогащению.<\/li><li><a href=\"https://www.ceecthefuture.org\" target=\"_blank\" rel=\"noopener\">CEEC<\/a> — материалы по энергоэффективному измельчению.<\/li><li>Видео: «SAG mill animation», «hydrocyclone how it works», «HPGR explained»; каналы Metso, FLSmidth, Weir Minerals.<\/li><\/ul>"},{"n":7,"module":2,"title":"Методы обогащения: флотация, гравитация, магнитная сепарация","file":"module-02-processing-metallurgy/day-07-flotation-gravity-magnetic.md","duration":"3,5 часа","challenge":"Для каждого из пяти видов сырья TMK (шеелит, вольфрамит, молибденит, графит, сподумен) за одну минуту назвать <strong>главный метод обогащения и главную технологическую проблему<\/strong>. Без шпаргалки.","why":"Флотатор медно-порфировой фабрики и флотатор шеелита используют одну машину, но разную химию. Если вы знаете, что шеелит флотируют жирными кислотами и мучаются с кальцитом и флюоритом, вы найдёте одного нужного эксперта среди тысячи «флотаторов». Это и есть точность поиска.","checklist":[{"text":"Разминка: 5 вопросов по Дню 6 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.5 (90 мин)","minutes":90},{"text":"Видео: флотационная машина, концентрационный стол, сепаратор (15 мин)","minutes":15},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: матрица «сырьё → метод → проблема → эксперт» (25 мин)","minutes":25},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блок 1.1 и таблица 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Флотация","en":"Froth flotation","def":"Разделение по смачиваемости поверхности с помощью пузырьков воздуха"},{"ru":"Гидрофобный","en":"Hydrophobic","def":"Не смачиваемый водой, прилипает к пузырькам"},{"ru":"Гидрофильный","en":"Hydrophilic","def":"Смачиваемый водой, остаётся в пульпе"},{"ru":"Собиратель","en":"Collector","def":"Реагент, делающий минерал гидрофобным"},{"ru":"Пенообразователь","en":"Frother","def":"Реагент для устойчивой пены"},{"ru":"Депрессор","en":"Depressant","def":"Реагент, подавляющий флотацию ненужного минерала"},{"ru":"Активатор","en":"Activator","def":"Реагент, усиливающий флотацию нужного минерала"},{"ru":"Регулятор среды","en":"pH modifier","def":"Реагент для задания pH"},{"ru":"Ксантогенат","en":"Xanthate","def":"Классический собиратель для сульфидов"},{"ru":"Жирные кислоты","en":"Fatty acids","def":"Собиратели для шеелита, флюорита, апатита, сподумена"},{"ru":"Гидроксамовые кислоты","en":"Hydroxamates","def":"Собиратели для вольфрамита, касситерита, РЗЭ"},{"ru":"Жидкое стекло","en":"Sodium silicate / water glass","def":"Депрессор кальцита, флюорита, силикатов"},{"ru":"Основная флотация","en":"Rougher flotation","def":"Первая стадия флотации"},{"ru":"Контрольная флотация","en":"Scavenger flotation","def":"Доизвлечение из хвостов основной флотации"},{"ru":"Перечистка","en":"Cleaner flotation","def":"Повышение качества концентрата"},{"ru":"Флотационная колонна","en":"Flotation column","def":"Аппарат для перечисток с чистым концентратом"},{"ru":"Коллективная флотация","en":"Bulk flotation","def":"Совместная флотация нескольких минералов"},{"ru":"Селективная флотация","en":"Selective flotation","def":"Разделение минералов друг от друга"},{"ru":"Процесс Петрова","en":"Petrov process","def":"Доводка шеелитового концентрата с прогревом и жидким стеклом"},{"ru":"Гравитационное обогащение","en":"Gravity separation","def":"Разделение по плотности"},{"ru":"Отсадочная машина","en":"Jig","def":"Гравитационный аппарат с пульсирующим потоком воды"},{"ru":"Винтовой сепаратор","en":"Spiral concentrator","def":"Гравитационный аппарат со спиральным жёлобом"},{"ru":"Концентрационный стол","en":"Shaking table","def":"Гравитационный аппарат с колеблющейся декой"},{"ru":"Центробежный концентратор","en":"Centrifugal concentrator","def":"Гравитация в центробежном поле (Knelson, Falcon)"},{"ru":"Обогащение в тяжёлых средах","en":"Dense media separation (DMS)","def":"Разделение в суспензии заданной плотности"},{"ru":"Магнитная сепарация","en":"Magnetic separation","def":"Разделение по магнитной восприимчивости"},{"ru":"Сепаратор сильного поля","en":"WHIMS / high-intensity magnetic separator","def":"Для слабомагнитных минералов"},{"ru":"Парамагнитный","en":"Paramagnetic","def":"Слабомагнитный (вольфрамит, монацит)"},{"ru":"Электростатическая сепарация","en":"Electrostatic separation","def":"Разделение по электропроводности"},{"ru":"Рентгенорадиометрическая сортировка","en":"XRT sensor-based sorting","def":"Сортировка кусков руды по рентгеновскому сигналу"},{"ru":"Обесшламливание","en":"Desliming","def":"Удаление тонких шламов перед обогащением"}],"quiz":[{"q":"Какое свойство поверхности использует флотация?","options":["Плотность (удельный вес) частиц","Гидрофобность (несмачиваемость водой)","Цвет и блеск минералов","Магнитную восприимчивость частиц"],"answer":1,"explain":"Гидрофобные частицы прилипают к пузырькам и выносятся в пену. Реагенты управляют гидрофобностью минералов."},{"q":"Главная сложность флотации шеелита:","options":["Шеелит слишком лёгкий и уносится водой из флотомашины вместе с хвостами","Шеелит радиоактивен, поэтому флотацию ведут в закрытых помещениях","Шеелит растворяется в воде, и значительная часть вольфрама теряется с оборотной водой и стоками фабрики","Отделение от кальцита, флюорита и апатита — кальциевых минералов со схожей поверхностной химией"],"answer":3,"explain":"Жирные кислоты собирают все кальциевые минералы. Для селективности используют жидкое стекло, прогрев (процесс Петрова) и многостадийные перечистки."},{"q":"Какой реагент подавляет медные минералы при флотации молибденита из коллективного Cu–Mo концентрата?","options":["Гидросульфид натрия (NaHS)","Ксантогенат калия (PAX)","Жирная кислота (талловое масло)","Пенообразователь MIBC"],"answer":0,"explain":"NaHS подавляет сульфиды меди, а молибденит, природно гидрофобный, флотируется аполярным собирателем."},{"q":"Почему вольфрамит отделяют от касситерита магнитной сепарацией?","options":["Касситерит сильно магнитен и притягивается слабым полем","Вольфрамит парамагнитен, касситерит практически немагнитен","Оба немагнитны, но различаются цветом при сортировке","Это делают флотацией, а не магнитной сепарацией"],"answer":1,"explain":"Вольфрамит содержит Fe и Mn и поэтому слабомагнитен. Его выделяют сепараторами сильного поля."},{"q":"Каким методом обычно обогащают крупный класс сподуменовой руды?","options":["В тяжёлых средах (DMS)","Флотацией с ксантогенатом","Цианированием","Электролизом"],"answer":0,"explain":"Сподумен (≈ 3,1–3,2 г/см³) тяжелее кварца и полевых шпатов (≈ 2,6–2,7). Суспензия ферросилиция заданной плотности разделяет их."},{"q":"Почему при обогащении графита делают много перечисток с мягким доизмельчением?","options":["Графит тяжёлый и плохо флотируется, поэтому его приходится доизмельчать много раз","Этого требует JORC для всех графитовых проектов с экспортом концентрата","Чтобы увеличить расход реагентов и стабилизировать пену во флотомашинах","Чтобы получить чистый концентрат, не разрушив крупную чешую, которая стоит дороже"],"answer":3,"explain":"Цена графита сильно зависит от размера чешуи. Агрессивное измельчение разрушает чешую."},{"q":"Критерий гравитационного обогащения для пары «вольфрамит — кварц» в воде ≈ 3,8. Что это значит?","options":["Разделение невозможно, потому что минералы слишком близки по плотности","Нужна только флотация: гравитация для вольфрама не применяется","Разделение по плотности эффективно, кроме очень тонких классов","Вольфрамит легче кварца и уходит в лёгкую фракцию"],"answer":2,"explain":"При критерии больше 2,5 гравитация работает хорошо. Проблема — тонкие шламы, где гравитация теряет эффективность."},{"q":"Какой тип сортировки особенно хорош для вольфрамовых руд?","options":["Оптическая сортировка по цвету кусков руды","Рентгенорадиометрическая (XRT) и УФ-сортировка","Сортировка по весу и размеру кусков на грохоте","Ручная рудоразборка по внешнему виду на ленте"],"answer":1,"explain":"Вольфрам с высоким атомным номером хорошо виден в рентгеновском диапазоне, а шеелит люминесцирует под УФ."},{"q":"Кандидат 15 лет работал флотатором на медной фабрике (ксантогенаты, известь). Для флотации шеелита это:","options":["Идеальный опыт: флотация везде одинакова, отличаются только названия реагентов и марки флотомашин","Опыт не имеет значения: шеелит обогащают только гравитацией, а не флотацией","Опыт другого «мира» флотации; нужны доказательства работы с несульфидными (солевыми) минералами","Даже лучше, чем опыт по шеелиту, потому что медные фабрики крупнее и сложнее"],"answer":2,"explain":"Принципы общие, но химия и проблемы другие. Без опыта с несульфидными минералами это кандидат на обучение, а не готовый эксперт."},{"q":"Какие минералы на минеральных песках разделяют электростатической сепарацией?","options":["Проводники (ильменит, рутил) от непроводников (циркон, монацит)","Шеелит от кальцита и флюорита в кальциевых скарновых рудах после флотации","Графит от кварца и слюды в метаморфических рудах","Сподумен от слюды и полевого шпата в пегматитах"],"answer":0,"explain":"Электростатическая сепарация — стандартный передел на заводах минеральных песков, вместе с магнитной сепарацией."}],"html":"<h2>0. Разминка: вспомнить День 6<\/h2>\n<ol><li>Запишите формулу извлечения через содержания f, c, t.<\/li><li>Что такое P80 и почему он важен?<\/li><li>Что такое раскрытие минералов?<\/li><li>Почему для вольфрама опасно переизмельчение?<\/li><li>Что такое GISTM и почему он появился?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>R = c · (f − t) / [f · (c − t)] × 100%.<\/li><li>Размер, мельче которого 80% массы продукта. Определяет раскрытие и показатели обогащения.<\/li><li>Освобождение зёрен ценного минерала от сростков с пустой породой за счёт измельчения.<\/li><li>Хрупкие минералы уходят в тонкие шламы, которые плохо улавливаются: растут потери.<\/li><li>Глобальный стандарт управления хвостохранилищами (2020), принят после аварий, в первую очередь в Брумадинью (2019).<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Флотация (froth flotation)<\/h3>\n<p><strong>Принцип.<\/strong> В пульпу с реагентами подают воздух. Частицы с <strong>гидрофобной<\/strong> (несмачиваемой) поверхностью прилипают к пузырькам и выносятся в пену — это концентрат. <strong>Гидрофильные<\/strong> частицы остаются в пульпе — это хвосты. Флотация — самый распространённый метод обогащения в мире, ею перерабатывают миллиарды тонн руды в год.<\/p>\n<p><strong>Реагенты<\/strong> — это «химия флотации», в ней и заключается экспертиза:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Класс<\/th><th>Функция<\/th><th>Примеры<\/th><\/tr><\/thead><tbody><tr><td><strong>Собиратели<\/strong> (collectors)<\/td><td>Делают поверхность нужного минерала гидрофобной<\/td><td>Ксантогенаты и дитиофосфаты (сульфиды Cu, Mo, Ni, Pb, Zn); <strong>жирные кислоты<\/strong> — олеиновая кислота, талловое масло (шеелит, флюорит, апатит, сподумен); <strong>гидроксаматы<\/strong> (вольфрамит, касситерит, минералы РЗЭ); амины (силикаты, обратная флотация); аполярные масла — керосин, дизельное топливо (молибденит, графит)<\/td><\/tr><tr><td><strong>Пенообразователи<\/strong> (frothers)<\/td><td>Создают устойчивую пену<\/td><td>MIBC (метилизобутилкарбинол), полигликоли, сосновое масло<\/td><\/tr><tr><td><strong>Депрессоры<\/strong> (depressants)<\/td><td>Подавляют флотацию ненужных минералов<\/td><td><strong>Жидкое стекло<\/strong> (силикат натрия) — для кальцита, флюорита, силикатов; крахмал, декстрин; КМЦ (для талька); <strong>гидросульфид натрия NaHS<\/strong> — подавляет медные сульфиды при разделении Cu–Mo<\/td><\/tr><tr><td><strong>Активаторы<\/strong> (activators)<\/td><td>Усиливают флотацию нужного минерала<\/td><td>Медный купорос (сфалерит); нитрат свинца (вольфрамит и шеелит с гидроксаматами — китайская практика)<\/td><\/tr><tr><td><strong>Регуляторы среды<\/strong> (pH modifiers)<\/td><td>Задают pH<\/td><td>Известь, сода, NaOH, серная кислота<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Оборудование:<\/strong><\/p>\n<ul><li><strong>механические флотомашины<\/strong> (Metso TankCell, FLSmidth и др.) — объём камер до сотен м³;<\/li><li><strong>флотационные колонны<\/strong> (column flotation) — для перечисток, чище концентрат;<\/li><li><strong>пневматические машины<\/strong> — Jameson Cell (Glencore Technology), Concorde Cell (Metso);<\/li><li><strong>флотация крупных частиц<\/strong> — Eriez HydroFloat.<\/li><\/ul>\n<p><strong>Схема флотации:<\/strong><\/p>\n<pre class=\"code\"><code>Питание → ОСНОВНАЯ (rougher) → черновой концентрат → [доизмельчение] → ПЕРЕЧИСТКИ (cleaner 1, 2, 3…) → КОНЦЕНТРАТ\n                ↓\n           КОНТРОЛЬНАЯ (scavenger) → ХВОСТЫ\n                ↑ промпродукты возвращаются в цикл<\/code><\/pre>\n<p><strong>Ключевые случаи для TMK:<\/strong><\/p>\n<ol><li><strong>Разделение медно-молибденового концентрата<\/strong> (АГМК → молибденовое сырьё). Сначала коллективная Cu–Mo флотация. Затем медные минералы подавляют гидросульфидом натрия (NaHS), а молибденит флотируют аполярным собирателем (керосин или дизель) с несколькими перечистками, часто в колоннах. Результат — молибденовый концентрат (обычно 45–55% Mo) и медный концентрат. Это источник молибдена <strong>и рения<\/strong> для Чирчика.<\/li><\/ol>\n<ol><li><strong>Флотация шеелита — одна из самых сложных задач обогащения.<\/strong> Шеелит, кальцит, флюорит и апатит — кальциевые минералы с похожей поверхностной химией. Жирные кислоты «цепляются» за все сразу. Классическое решение — <strong>процесс Петрова<\/strong>: черновой концентрат с высоким расходом жидкого стекла прогревают (около 80–90 °C) и перемешивают. Собиратель снимается с кальцита и флюорита, но остаётся на шеелите. Технолог, который реально вёл процесс Петрова или его современные аналоги, — редкий специалист.<\/li><\/ol>\n<ol><li><strong>Вольфрамит.<\/strong> Сначала гравитация (он тяжёлый). Затем магнитная сепарация. Тонкие классы доизвлекают флотацией с гидроксаматами и солями свинца (китайская практика).<\/li><\/ol>\n<ol><li><strong>Графит.<\/strong> Природно гидрофобен, флотируется керосином и пенообразователем. Главная тонкость — <strong>сохранить крупную чешую<\/strong>: крупночешуйчатый графит стоит дороже. Поэтому доизмельчение мягкое (в перемешивающих мельницах), а перечисток много: нередко 5–8 стадий. Концентрат — 94–97% C. Для анодов батарей нужна дальнейшая очистка до ≥ 99,95% C.<\/li><\/ol>\n<ol><li><strong>Сподумен.<\/strong> Мелкие классы флотируют жирными кислотами после обесшламливания. Крупные классы обогащают в тяжёлых средах (см. 1.2). Железосодержащие примеси удаляют магнитной сепарацией: покупатели жёстко ограничивают содержание Fe₂O₃.<\/li><\/ol>\n<ol><li><strong>Минералы РЗЭ.<\/strong> Бастнезит флотируют гидроксаматами или жирными кислотами при повышенной температуре (Маунтин-Пасс). Монацит и ксенотим из россыпей выделяют гравитацией, магнитной и электростатической сепарацией.<\/li><\/ol>\n<h3>1.2 Гравитационное обогащение (gravity separation)<\/h3>\n<p><strong>Принцип.<\/strong> Разделение по <strong>плотности<\/strong> (и крупности) в потоке воды или в тяжёлой среде. Метод дешёвый, без реагентов, поэтому его любят в начале схемы.<\/p>\n<p><strong>Критерий эффективности:<\/strong> CC = (ρ тяжёлого − ρ среды) / (ρ лёгкого − ρ среды). Если CC &gt; 2,5, разделение лёгкое даже для довольно мелких частиц. Пример: шеелит (6,1) против кварца (2,65) в воде (1,0): (6,1 − 1) / (2,65 − 1) ≈ 3,1. Вольфрамит (≈ 7,3) — ≈ 3,8. Поэтому вольфрам традиционно начинают обогащать гравитацией.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Аппарат<\/th><th>Принцип<\/th><th>Применение<\/th><\/tr><\/thead><tbody><tr><td><strong>Отсадочные машины<\/strong> (jigs)<\/td><td>Пульсирующий поток воды расслаивает частицы<\/td><td>Крупные классы W, Sn, Au, уголь<\/td><\/tr><tr><td><strong>Винтовые сепараторы<\/strong> (spirals)<\/td><td>Поток по спиральному жёлобу<\/td><td>Минеральные пески, хромит, W, Sn<\/td><\/tr><tr><td><strong>Концентрационные столы<\/strong> (shaking tables)<\/td><td>Колеблющаяся дека с рифлями<\/td><td>Доводка концентратов W, Sn, Au, Ta<\/td><\/tr><tr><td><strong>Центробежные концентраторы<\/strong> (Knelson, Falcon)<\/td><td>Усиленная гравитация в центробежном поле<\/td><td>Тонкое золото, тонкие классы W и Sn<\/td><\/tr><tr><td><strong>Обогащение в тяжёлых средах<\/strong> (DMS — dense media separation)<\/td><td>Суспензия ферросилиция заданной плотности: лёгкое всплывает, тяжёлое тонет<\/td><td><strong>Сподумен<\/strong> (SC6), алмазы, уголь, предобогащение<\/td><\/tr><tr><td>Шлюзы, конусы Райхерта, мультигравитационный сепаратор<\/td><td>—<\/td><td>Россыпи, тонкие классы<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Проблема тонких классов:<\/strong> гравитация плохо работает на частицах мельче примерно 20–40 мкм. Вольфрамовые шламы уходят в хвосты, поэтому схемы комбинированные: гравитация + флотация.<\/p>\n<h3>1.3 Магнитная и электростатическая сепарация<\/h3>\n<p><strong>Магнитные свойства минералов:<\/strong><\/p>\n<ul><li><strong>ферромагнитные<\/strong> (сильномагнитные): магнетит, пирротин;<\/li><li><strong>парамагнитные<\/strong> (слабомагнитные): ильменит, гематит, <strong>вольфрамит<\/strong>, <strong>монацит<\/strong>, ксенотим, гранат;<\/li><li><strong>диамагнитные<\/strong> (немагнитные): кварц, кальцит, <strong>шеелит<\/strong>, касситерит, циркон.<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>Аппарат<\/th><th>Поле<\/th><th>Применение<\/th><\/tr><\/thead><tbody><tr><td>Барабанные сепараторы слабого поля (LIMS)<\/td><td>Слабое (≈ 0,1–0,3 Тл)<\/td><td>Магнетит, удаление стального скрапа<\/td><\/tr><tr><td>Мокрые сепараторы сильного поля (WHIMS), высокоградиентные (HGMS; например, китайские SLon)<\/td><td>Сильное поле с матрицей<\/td><td>Гематит, ильменит, <strong>вольфрамит<\/strong>, удаление железа из сподумена<\/td><\/tr><tr><td>Сухие валковые сепараторы на постоянных редкоземельных магнитах (RER)<\/td><td>Сильное, сухое<\/td><td>Минеральные пески: монацит, ильменит, гранат<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ключевые применения:<\/strong><\/p>\n<ul><li>отделение <strong>вольфрамита<\/strong> (парамагнитен) от <strong>касситерита<\/strong> и <strong>шеелита<\/strong> (немагнитны);<\/li><li>выделение <strong>монацита<\/strong> и ксенотима из минеральных песков;<\/li><li>очистка <strong>сподуменового<\/strong> концентрата от железа.<\/li><\/ul>\n<p><strong>Электростатическая сепарация<\/strong> (electrostatic separation). На коронном барабане (HTR) <strong>проводники<\/strong> (ильменит, рутил, касситерит) отделяются от <strong>непроводников<\/strong> (циркон, монацит). Основа переработки минеральных песков.<\/p>\n<h3>1.4 Сортировка руды (sensor-based ore sorting)<\/h3>\n<p>Куски руды на конвейере «просвечивают» датчиками, и сжатый воздух отстреливает руду или пустую породу. Датчики:<\/p>\n<ul><li><strong>рентгеновские<\/strong> (XRT) — по атомной плотности (вольфрам с высоким атомным номером виден отлично);<\/li><li><strong>оптические<\/strong> и <strong>лазерные<\/strong>;<\/li><li><strong>УФ<\/strong> (шеелит люминесцирует);<\/li><li><strong>NIR<\/strong> (ближний инфракрасный).<\/li><\/ul>\n<p>Ведущий производитель — TOMRA Mining; есть и другие (например, Steinert). Смысл — убрать часть пустой породы <strong>до<\/strong> дорогого измельчения. Повышается содержание в питании фабрики, снижаются затраты. Для вольфрамовых проектов это очень актуально.<\/p>\n<h3>1.5 Сводная матрица: сырьё TMK → метод → проблема<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Сырьё<\/th><th>Основные методы<\/th><th>Главная технологическая проблема<\/th><th>Профиль эксперта<\/th><\/tr><\/thead><tbody><tr><td><strong>Шеелит<\/strong> (скарны)<\/td><td>Гравитация (крупные классы) + <strong>флотация жирными кислотами<\/strong> + доводка (процесс Петрова); сортировка<\/td><td>Отделение от кальцита, флюорита, апатита; потери в шламах<\/td><td>Флотатор по несульфидным (солевым) минералам, опыт с шеелитом<\/td><\/tr><tr><td><strong>Вольфрамит<\/strong> (жилы, грейзены)<\/td><td><strong>Гравитация<\/strong> (отсадка, столы, спирали) + магнитная сепарация + флотация шламов<\/td><td>Потери в тонких классах; разделение с касситеритом<\/td><td>Гравитационщик по W и Sn<\/td><\/tr><tr><td><strong>Молибденит<\/strong> (Cu–Mo руды)<\/td><td>Коллективная флотация + <strong>селективная Cu–Mo флотация<\/strong> (NaHS) + колонны<\/td><td>Чистота Mo-концентрата (Cu, Pb, нерастворимый остаток); сохранение рения<\/td><td>Флотатор по сульфидам с опытом Cu–Mo разделения<\/td><\/tr><tr><td><strong>Графит<\/strong><\/td><td><strong>Флотация<\/strong> с многостадийной перечисткой и мягким доизмельчением<\/td><td>Сохранение крупной чешуи; чистота<\/td><td>Технолог по графиту, флотация неметаллов<\/td><\/tr><tr><td><strong>Сподумен<\/strong> (пегматиты)<\/td><td><strong>Тяжёлые среды (DMS)<\/strong> + флотация мелочи + магнитная сепарация<\/td><td>Железо и слюды в концентрате; тонкие потери<\/td><td>Технолог литиевых фабрик (Австралия, Канада, Африка)<\/td><\/tr><tr><td><strong>Минералы РЗЭ<\/strong><\/td><td>Флотация (бастнезит), гравитация + магнитная + электростатическая сепарация (россыпи)<\/td><td>Сложная минералогия, радиоактивность, тонкие срастания<\/td><td>Технолог по РЗЭ (Lynas, MP Materials, Iluka, ANSTO)<\/td><\/tr><tr><td><strong>Хвосты Ингички<\/strong> (техногенное сырьё)<\/td><td>Тонкая гравитация (центробежные концентраторы) + флотация шламов<\/td><td>Тонкий, окисленный, бедный материал<\/td><td>Специалист по переработке хвостов и тонких классов W<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Флотация<\/td><td>Froth flotation<\/td><td>Разделение по смачиваемости поверхности с помощью пузырьков воздуха<\/td><\/tr><tr><td>Гидрофобный<\/td><td>Hydrophobic<\/td><td>Не смачиваемый водой, прилипает к пузырькам<\/td><\/tr><tr><td>Гидрофильный<\/td><td>Hydrophilic<\/td><td>Смачиваемый водой, остаётся в пульпе<\/td><\/tr><tr><td>Собиратель<\/td><td>Collector<\/td><td>Реагент, делающий минерал гидрофобным<\/td><\/tr><tr><td>Пенообразователь<\/td><td>Frother<\/td><td>Реагент для устойчивой пены<\/td><\/tr><tr><td>Депрессор<\/td><td>Depressant<\/td><td>Реагент, подавляющий флотацию ненужного минерала<\/td><\/tr><tr><td>Активатор<\/td><td>Activator<\/td><td>Реагент, усиливающий флотацию нужного минерала<\/td><\/tr><tr><td>Регулятор среды<\/td><td>pH modifier<\/td><td>Реагент для задания pH<\/td><\/tr><tr><td>Ксантогенат<\/td><td>Xanthate<\/td><td>Классический собиратель для сульфидов<\/td><\/tr><tr><td>Жирные кислоты<\/td><td>Fatty acids<\/td><td>Собиратели для шеелита, флюорита, апатита, сподумена<\/td><\/tr><tr><td>Гидроксамовые кислоты<\/td><td>Hydroxamates<\/td><td>Собиратели для вольфрамита, касситерита, РЗЭ<\/td><\/tr><tr><td>Жидкое стекло<\/td><td>Sodium silicate / water glass<\/td><td>Депрессор кальцита, флюорита, силикатов<\/td><\/tr><tr><td>Основная флотация<\/td><td>Rougher flotation<\/td><td>Первая стадия флотации<\/td><\/tr><tr><td>Контрольная флотация<\/td><td>Scavenger flotation<\/td><td>Доизвлечение из хвостов основной флотации<\/td><\/tr><tr><td>Перечистка<\/td><td>Cleaner flotation<\/td><td>Повышение качества концентрата<\/td><\/tr><tr><td>Флотационная колонна<\/td><td>Flotation column<\/td><td>Аппарат для перечисток с чистым концентратом<\/td><\/tr><tr><td>Коллективная флотация<\/td><td>Bulk flotation<\/td><td>Совместная флотация нескольких минералов<\/td><\/tr><tr><td>Селективная флотация<\/td><td>Selective flotation<\/td><td>Разделение минералов друг от друга<\/td><\/tr><tr><td>Процесс Петрова<\/td><td>Petrov process<\/td><td>Доводка шеелитового концентрата с прогревом и жидким стеклом<\/td><\/tr><tr><td>Гравитационное обогащение<\/td><td>Gravity separation<\/td><td>Разделение по плотности<\/td><\/tr><tr><td>Отсадочная машина<\/td><td>Jig<\/td><td>Гравитационный аппарат с пульсирующим потоком воды<\/td><\/tr><tr><td>Винтовой сепаратор<\/td><td>Spiral concentrator<\/td><td>Гравитационный аппарат со спиральным жёлобом<\/td><\/tr><tr><td>Концентрационный стол<\/td><td>Shaking table<\/td><td>Гравитационный аппарат с колеблющейся декой<\/td><\/tr><tr><td>Центробежный концентратор<\/td><td>Centrifugal concentrator<\/td><td>Гравитация в центробежном поле (Knelson, Falcon)<\/td><\/tr><tr><td>Обогащение в тяжёлых средах<\/td><td>Dense media separation (DMS)<\/td><td>Разделение в суспензии заданной плотности<\/td><\/tr><tr><td>Магнитная сепарация<\/td><td>Magnetic separation<\/td><td>Разделение по магнитной восприимчивости<\/td><\/tr><tr><td>Сепаратор сильного поля<\/td><td>WHIMS / high-intensity magnetic separator<\/td><td>Для слабомагнитных минералов<\/td><\/tr><tr><td>Парамагнитный<\/td><td>Paramagnetic<\/td><td>Слабомагнитный (вольфрамит, монацит)<\/td><\/tr><tr><td>Электростатическая сепарация<\/td><td>Electrostatic separation<\/td><td>Разделение по электропроводности<\/td><\/tr><tr><td>Рентгенорадиометрическая сортировка<\/td><td>XRT sensor-based sorting<\/td><td>Сортировка кусков руды по рентгеновскому сигналу<\/td><\/tr><tr><td>Обесшламливание<\/td><td>Desliming<\/td><td>Удаление тонких шламов перед обогащением<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Как отличить «флотатора вообще» от нужного эксперта<\/h3>\n<p>Флотаторы делятся на два мира:<\/p>\n<ol><li><strong>Сульфидный<\/strong> (Cu, Mo, Ni, Pb, Zn, Au): ксантогенаты, известь, NaHS. Это большинство обогатителей мира.<\/li><li><strong>Несульфидный / солевой<\/strong> (шеелит, флюорит, апатит, сподумен, РЗЭ, графит): жирные кислоты, гидроксаматы, жидкое стекло, температура. Специалистов здесь в разы меньше.<\/li><\/ol>\n<p><strong>Для шеелита Ингички нужен второй мир.<\/strong> Флотатор медной фабрики АГМК хорош для Cu–Mo разделения (источник Mo и Re), но не автоматически для шеелита.<\/p>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Какой собиратель, депрессор и pH вы использовали и почему?»<\/td><td>Конкретные реагенты, расход (г/т), логика выбора, опыт замен<\/td><td>«Реагенты подбирала лаборатория»<\/td><\/tr><tr><td>(Шеелит) «Как вы отделяли шеелит от кальцита и флюорита?»<\/td><td>Жидкое стекло, процесс Петрова или его аналоги, температура, стадии перечистки<\/td><td>Не видит проблемы<\/td><\/tr><tr><td>(Cu–Mo) «Как вы подавляли медь при молибденовой флотации? Какое качество Mo-концентрата получали?»<\/td><td>NaHS, контроль потенциала, колонны, 45–55% Mo, примеси меди<\/td><td>Путается в стадиях<\/td><\/tr><tr><td>(Графит) «Как вы сохраняли крупную чешую?»<\/td><td>Мягкое доизмельчение, число перечисток, классы крупности и их доли<\/td><td>Не знает, что чешуя определяет цену<\/td><\/tr><tr><td>(Сподумен) «Какое содержание Fe₂O₃ было в концентрате и как вы его снижали?»<\/td><td>Магнитная сепарация, контроль износа, цифры<\/td><td>Не знает спецификаций покупателя<\/td><\/tr><tr><td>«Какие аппараты стояли на перечистках и почему?»<\/td><td>Колонны, механические машины, Jameson; объясняет выбор<\/td><td>Не помнит оборудование<\/td><\/tr><tr><td>«Какой эксперимент на фабрике вы спланировали сами? Что получилось?»<\/td><td>Гипотеза → испытание → цифры → внедрение<\/td><td>Только «участвовал»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать по методам<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Компании и пулы<\/th><\/tr><\/thead><tbody><tr><td>Шеелит, вольфрамит<\/td><td>Almonty (Панаскейра, Сандон), Wolfram Bergbau und Hütten (Миттерзиль), Masan High-Tech Materials (Нуй Фао), EQ Resources (Mt Carbine), китайские вольфрамовые компании, бывшие специалисты российских вольфрамовых ГОКов (с проверкой санкционных ограничений)<\/td><\/tr><tr><td>Cu–Mo разделение<\/td><td>АГМК, Эрдэнэт (Монголия), KAZ Minerals, Codelco, Freeport, Southern Copper, Antofagasta<\/td><\/tr><tr><td>Графит<\/td><td>Syrah Resources (Балама), NextSource, Nouveau Monde Graphite, Imerys Graphite &amp; Carbon<\/td><\/tr><tr><td>Сподумен<\/td><td>Pilbara Minerals (PLS), Mineral Resources, Talison Lithium (Гринбушес; Tianqi/IGO и Albemarle), Liontown, Sigma Lithium (Бразилия), литиевые проекты китайских компаний в Зимбабве (Bikita, Arcadia)<\/td><\/tr><tr><td>РЗЭ<\/td><td>Lynas, MP Materials, Iluka, Arafura, ANSTO Minerals<\/td><\/tr><tr><td>Технологии и испытания<\/td><td>SGS, ALS Metallurgy, Mintek, JKTech, Metso, FLSmidth, Eriez, TOMRA<\/td><\/tr><tr><td>Реагенты (технические эксперты)<\/td><td>Syensqo (бывш. Solvay, направление горных реагентов), Clariant, Nouryon<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Матрица без шпаргалки.<\/strong> Закройте таблицу 1.5 и заполните её по памяти: сырьё → метод → проблема → профиль эксперта. Потом сверьте и отметьте ошибки.<\/p>\n<p><strong>Задание 2 (10 мин). Булев поиск.<\/strong> Составьте три запроса для LinkedIn или Google X-ray:<\/p>\n<ol><li>Флотатор по шеелиту.<\/li><li>Технолог по Cu–Mo разделению.<\/li><li>Технолог графитовой фабрики.<\/li><\/ol>\n<p>Пример: <code>(\"scheelite\" OR \"tungsten\") AND (flotation OR metallurgist) AND (\"fatty acid\" OR \"sodium silicate\")<\/code>. Запустите каждый и запишите, сколько релевантных профилей среди первых 20 результатов.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Вызов дня: назовите метод и проблему для пяти видов сырья за одну минуту. Засеките время.<\/li><li>Какой профиль эксперта для TMK сейчас кажется вам самым дефицитным и почему?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 8: гидрометаллургия и выщелачивание».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы прошли обогащение — половину пути от руды до металла. С завтрашнего дня начинается химия: зона, где работает самая дорогая и дефицитная экспертиза TMK. Сегодня лягте спать с мыслью: «Шеелит — жирные кислоты, кальцит — враг».<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li><em>Wills' Mineral Processing Technology<\/em> — главы Froth Flotation, Gravity Concentration, Magnetic and Electrical Separation.<\/li><li>Абрамов А. А. «Флотационные методы обогащения» — классика российской школы.<\/li><li>Публикации ITIA о переработке вольфрама: <a href=\"https://www.itia.info\" target=\"_blank\" rel=\"noopener\">itia.info<\/a>.<\/li><li><a href=\"https://www.911metallurgist.com\" target=\"_blank\" rel=\"noopener\">911metallurgist.com<\/a> — разделы «Scheelite flotation», «Molybdenite flotation», «Graphite flotation».<\/li><li>Видео: «froth flotation animation», «shaking table gold tungsten», «dense media separation spodumene», «TOMRA XRT sorting».<\/li><\/ul>"},{"n":8,"module":2,"title":"Гидрометаллургия и выщелачивание","file":"module-02-processing-metallurgy/day-08-hydrometallurgy-leaching.md","duration":"3,5 часа","challenge":"Нарисовать по памяти <strong>гидрометаллургическую схему вольфрама<\/strong> от концентрата до APT и отметить на ней, где работает какой специалист.","why":"Гидрометаллургия — сердце новых переделов TMK: APT, рений, РЗЭ и рений из урановых растворов, литий, никель и кобальт. Это самая дефицитная экспертиза на рынке. Вне Китая технологов, которые запускали такие установки, считанное число. Если вы не понимаете схему, вы не отличите химика-лаборанта от технолога, который вёл промышленный передел. Ошибка здесь обходится TMK в годы задержки пуска.","checklist":[{"text":"Разминка: 5 вопросов по Дням 6–7 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (95 мин)","minutes":95},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: схема APT по памяти + профиль гидрометаллурга (25 мин)","minutes":25},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Гидрометаллургия","en":"Hydrometallurgy","def":"Извлечение металлов водными растворами"},{"ru":"Выщелачивание","en":"Leaching","def":"Растворение ценного компонента"},{"ru":"Выщелачивающий реагент","en":"Lixiviant","def":"Раствор для выщелачивания (кислота, щёлочь, цианид)"},{"ru":"Продуктивный раствор","en":"Pregnant leach solution (PLS)","def":"Раствор с растворённым ценным компонентом"},{"ru":"Кек","en":"Leach residue / cake","def":"Твёрдый остаток после выщелачивания"},{"ru":"Кучное выщелачивание","en":"Heap leaching","def":"Выщелачивание руды в штабелях"},{"ru":"Агитационное выщелачивание","en":"Agitated tank leaching","def":"Выщелачивание пульпы в реакторах с перемешиванием"},{"ru":"Автоклавное выщелачивание","en":"Pressure leaching / autoclave leaching","def":"Выщелачивание при повышенных давлении и температуре"},{"ru":"Автоклавное кислотное выщелачивание","en":"HPAL (high pressure acid leach)","def":"Технология для никелевых латеритов"},{"ru":"Бактериальное выщелачивание","en":"Bioleaching","def":"Выщелачивание с помощью бактерий"},{"ru":"Вскрытие (разложение) концентрата","en":"Cracking / decomposition / digestion","def":"Перевод упорного концентрата в растворимую форму"},{"ru":"Сернокислотный обжиг","en":"Acid baking / sulfation roasting","def":"Обработка концентрата серной кислотой при нагреве"},{"ru":"Противоточная промывка","en":"Counter-current decantation (CCD)","def":"Отмывка кека в каскаде сгустителей"},{"ru":"Осаждение","en":"Precipitation","def":"Выделение вещества из раствора в осадок"},{"ru":"Цементация","en":"Cementation","def":"Вытеснение металла более активным металлом"},{"ru":"Ионный обмен","en":"Ion exchange (IX)","def":"Сорбция ионов смолой и их десорбция"},{"ru":"Сорбция / десорбция (элюирование)","en":"Loading / elution","def":"Поглощение металла смолой и его снятие"},{"ru":"Анионит","en":"Anion exchange resin","def":"Смола для поглощения анионов (вольфрамат, перренат, уранил-сульфат)"},{"ru":"Кристаллизация","en":"Crystallization","def":"Выделение твёрдых кристаллов из раствора"},{"ru":"Маточный раствор","en":"Mother liquor","def":"Раствор, остающийся после кристаллизации"},{"ru":"Паравольфрамат аммония","en":"Ammonium paratungstate (APT)","def":"Ключевой промежуточный продукт вольфрама"},{"ru":"Вольфрамат натрия","en":"Sodium tungstate","def":"Раствор после щелочного или содового разложения"},{"ru":"Перренат аммония","en":"Ammonium perrhenate (APR)","def":"Ключевое соединение рения"},{"ru":"Декрепитация сподумена","en":"Spodumene decrepitation / calcination","def":"Перевод α-сподумена в β-форму обжигом"},{"ru":"Карбонат лития / гидроксид лития","en":"Lithium carbonate / lithium hydroxide","def":"Литиевые продукты для аккумуляторов"},{"ru":"Смешанный гидроксидный осадок","en":"MHP (mixed hydroxide precipitate)","def":"Промежуточный продукт Ni–Co из HPAL"},{"ru":"Скважинное подземное выщелачивание","en":"In-situ recovery (ISR)","def":"Выщелачивание металла в пласте через скважины"},{"ru":"Природные радионуклиды","en":"NORM (naturally occurring radioactive material)","def":"Th, U и продукты распада в сырье и отходах"},{"ru":"Опытно-промышленные испытания","en":"Pilot plant testing","def":"Проверка технологии на пилотной установке"},{"ru":"Масштабирование","en":"Scale-up","def":"Перенос технологии с лабораторного на промышленный масштаб"}],"quiz":[{"q":"Что такое продуктивный раствор (PLS)?","options":["Отработанный раствор после электролиза, который возвращают на выщелачивание","Вода для промывки оборудования и полов в гидрометаллургическом цехе","Раствор реагента, который подают на флотацию для активации минералов","Раствор, полученный при выщелачивании и содержащий растворённый ценный компонент"],"answer":3,"explain":"Pregnant leach solution — «беременный» металлом раствор, который дальше очищают и из которого выделяют продукт."},{"q":"Какой реагент обычно используют для разложения вольфрамитового концентрата?","options":["Цианид натрия (NaCN)","Ксантогенат калия","Гидроксид натрия (NaOH)","Азотная кислота (HNO₃)"],"answer":2,"explain":"Щелочное разложение даёт раствор вольфрамата натрия. Шеелит вскрывают содой в автоклавах или щёлочью под давлением."},{"q":"Почему отделение молибдена — критическая задача при производстве APT?","options":["Mo химически похож на W, его трудно отделить, а он ухудшает чистоту продукта","Молибден взрывоопасен в смеси с аммиаком при кристаллизации APT","Молибден дороже вольфрама, поэтому его выгоднее продать отдельно","Это не проблема: молибден не влияет на качество APT и твёрдых сплавов"],"answer":0,"explain":"Близость химических свойств W и Mo — классическая проблема вольфрамовой химии. Остаточный Mo в APT — важный показатель качества."},{"q":"Каким способом обычно извлекают рений из растворов?","options":["Пенной флотацией рения из раствора с ксантогенатом","Сорбцией на анионитах (ионным обменом) или экстракцией","Гравитационным осаждением на концентрационных столах","Магнитной сепарацией в сильном поле"],"answer":1,"explain":"Перренат-ион хорошо сорбируется анионитами и экстрагируется аминами. После десорбции кристаллизуют перренат аммония."},{"q":"Зачем сподумен перед выщелачиванием обжигают при ≈ 1 050–1 100 °C?","options":["Чтобы расплавить сподумен и отделить шлак","Чтобы удалить радиоактивные примеси тория и урана","Чтобы сразу получить металлический литий в печи","Чтобы перевести α-сподумен в реакционноспособную β-форму"],"answer":3,"explain":"Природный α-сподумен практически не вскрывается кислотой. После декрепитации β-сподумен реагирует с серной кислотой при ≈ 250 °C."},{"q":"Что такое HPAL?","options":["Кучное выщелачивание золота раствором цианида на гидроизолированных площадках под открытым небом","Автоклавное сернокислотное выщелачивание никелевых латеритов при высоких температуре и давлении","Метод флотации латеритных руд с высоким расходом пенообразователя","Тип электролизёра для получения катодного никеля высокой чистоты"],"answer":1,"explain":"High pressure acid leach. Массово применяется в Индонезии, исторически сложна в выходе на мощность."},{"q":"Почему для стратегии TMK важен собственный завод серной кислоты?","options":["Серную кислоту используют как основной собиратель при флотации шеелита и вольфрамита","Собственная кислота — обязательное требование аудита RMAP","Кислоту планируют в основном экспортировать в Китай","Серная кислота — самый массовый реагент гидрометаллургии (Cu, U, Ni, РЗЭ, Li)"],"answer":3,"explain":"Надёжная собственная кислота — основа для развития гидрометаллургических переделов и снабжения отрасли."},{"q":"Кандидат: «Я разработала технологию извлечения РЗЭ». Ваш первый уточняющий вопрос:","options":["«На каком масштабе — лаборатория, пилот или промышленность — и сколько времени непрерывной работы?»","«Сколько вам лет и сколько из них вы работаете в отрасли РЗЭ?»","«Какой у вас диплом и есть ли учёная степень по химии?»","«Почему вы выбрали именно РЗЭ и что вас больше всего привлекает в работе с редкоземельными металлами?»"],"answer":0,"explain":"Шкала масштаба — главный фильтр гидрометаллурга. Опыт пуска и промышленной эксплуатации встречается намного реже лабораторного."},{"q":"Какая опасность специфична для переработки сырья РЗЭ?","options":["Сильные магнитные поля от готовых магнитов NdFeB","Взрывы метана при вскрытии концентратов кислотой","Природная радиоактивность (торий, уран) в продуктах и отходах","Ничего специфичного: опасности такие же, как при переработке медных концентратов"],"answer":2,"explain":"Нужны радиационный контроль, специалист по радиационной безопасности и разрешения на обращение с NORM."},{"q":"Что такое элюирование (десорбция) в ионном обмене?","options":["Промывка смолы чистой водой от взвесей, шламов и грязи перед следующим циклом сорбции металла","Снятие поглощённого металла со смолы концентрированным раствором с получением богатого элюата","Сжигание отработанной смолы с извлечением металла из золы","Замена старой смолы на новую при снижении ёмкости колонны"],"answer":1,"explain":"Цикл ионного обмена: сорбция → промывка → элюирование → регенерация. Богатый элюат идёт на получение продукта."}],"html":"<h2>0. Разминка: вспомнить Дни 6–7<\/h2>\n<ol><li>Чем обогащение отличается от металлургии?<\/li><li>Какой собиратель и какой депрессор используют при флотации шеелита?<\/li><li>Что делает NaHS при Cu–Mo разделении?<\/li><li>Каким методом обогащают крупный класс сподумена?<\/li><li>Почему вольфрамит отделяют от касситерита магнитной сепарацией?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Обогащение физически разделяет минералы без изменения химического состава; металлургия химически извлекает металл.<\/li><li>Жирные кислоты (собиратель) и жидкое стекло (депрессор кальцита и флюорита); доводка — процесс Петрова.<\/li><li>Подавляет медные сульфиды; молибденит флотируется.<\/li><li>В тяжёлых средах (DMS).<\/li><li>Вольфрамит парамагнитен, касситерит практически немагнитен.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Что такое гидрометаллургия<\/h3>\n<p><strong>Гидрометаллургия<\/strong> (hydrometallurgy) — извлечение металлов с помощью <strong>водных растворов<\/strong>. Металл переводят в раствор, очищают раствор от примесей, затем выделяют металл или его соединение.<\/p>\n<pre class=\"code\"><code>Сырьё (руда / концентрат / промпродукт)\n  → [Подготовка: измельчение, обжиг, вскрытие]\n  → ВЫЩЕЛАЧИВАНИЕ → продуктивный раствор (PLS)\n  → Разделение твёрдого и жидкого (сгущение, противоточная промывка (CCD), фильтрация)\n  → ОЧИСТКА РАСТВОРА: осаждение примесей, цементация, ионный обмен, экстракция\n  → ВЫДЕЛЕНИЕ ПРОДУКТА: электролиз, кристаллизация, осаждение, восстановление водородом\n  → Обращение с маточными растворами и стоками: оборот воды, нейтрализация<\/code><\/pre>\n<p><strong>Чем гидрометаллургия отличается от пирометаллургии:<\/strong><\/p>\n<ul><li><strong>Гидро:<\/strong> низкие температуры (обычно до 100 °C; в автоклавах — до 250–270 °C), подходит для бедного и сложного сырья, высокая селективность, но много растворов, реагентов и стоков.<\/li><li><strong>Пиро:<\/strong> высокие температуры (сотни–тысячи °C), большие объёмы, хороша для богатых концентратов, но энергоёмка и даёт газы (SO₂).<\/li><\/ul>\n<p>Для редких металлов (W, Mo, Re, РЗЭ, Li, Ta, Nb) почти всегда нужна гидрометаллургия: только она даёт высокую чистоту и разделение похожих элементов.<\/p>\n<h3>1.2 Выщелачивание: типы и реагенты<\/h3>\n<p><strong>Выщелачивание<\/strong> (leaching) — растворение ценного компонента реагентом (выщелачивающим агентом, lixiviant).<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Как<\/th><th>Где применяется<\/th><\/tr><\/thead><tbody><tr><td><strong>Скважинное подземное (СПВ / ISR)<\/strong><\/td><td>Раствор через скважины прямо в пласт<\/td><td>Уран (Узбекистан, Казахстан); попутно Re, РЗЭ, Sc, V<\/td><\/tr><tr><td><strong>Кучное<\/strong> (heap leaching)<\/td><td>Штабель руды на гидроизолированном основании орошают раствором, цикл — месяцы<\/td><td>Золото (цианид), медь (серная кислота)<\/td><\/tr><tr><td><strong>Отвальное<\/strong> (dump leaching)<\/td><td>То же на бедных отвалах, без подготовки<\/td><td>Медь<\/td><\/tr><tr><td><strong>Чановое<\/strong> (vat leaching)<\/td><td>Руду заливают раствором в чанах<\/td><td>Малые объёмы<\/td><\/tr><tr><td><strong>Агитационное<\/strong> (agitated tank leaching)<\/td><td>Пульпу перемешивают в реакторах при атмосферном давлении<\/td><td>Золото (CIL/CIP), цинк, концентраты редких металлов<\/td><\/tr><tr><td><strong>Автоклавное<\/strong> (pressure leaching)<\/td><td>Реакторы под давлением и при высокой температуре<\/td><td><strong>HPAL<\/strong> — никелевые латериты (≈ 250 °C, H₂SO₄); <strong>POX<\/strong> — упорные золотые руды; <strong>щелочное / содовое разложение вольфрамовых концентратов<\/strong><\/td><\/tr><tr><td><strong>Бактериальное<\/strong> (bioleaching)<\/td><td>Бактерии окисляют сульфиды<\/td><td>Упорное золото (BIOX), вторичные сульфиды меди<\/td><\/tr><tr><td><strong>Сульфатизирующий обжиг / вскрытие<\/strong> (acid baking, cracking)<\/td><td>Концентрат обрабатывают концентрированной кислотой или щёлочью при нагреве, затем выщелачивают водой<\/td><td><strong>Концентраты РЗЭ<\/strong> (монацит, бастнезит), <strong>сподумен<\/strong> после обжига<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Основные реагенты:<\/strong><\/p>\n<ul><li><strong>Серная кислота<\/strong> H₂SO₄ — самый массовый и дешёвый реагент (медь, уран, никель, РЗЭ, литий). Отсюда стратегический смысл <strong>TMK Chemicals<\/strong> (500 тыс. т/год): своя кислота — основа будущей гидрометаллургии;<\/li><li>соляная (HCl) и азотная (HNO₃) кислоты — РЗЭ, редкие металлы;<\/li><li><strong>щёлочь NaOH и сода Na₂CO₃<\/strong> — вольфрам, монацит;<\/li><li><strong>аммиак и аммонийные соли<\/strong> — молибден, вольфрам, никель, кобальт;<\/li><li>цианид натрия NaCN — золото и серебро.<\/li><\/ul>\n<h3>1.3 Очистка растворов и выделение продукта<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Метод<\/th><th>Принцип<\/th><th>Примеры<\/th><\/tr><\/thead><tbody><tr><td><strong>Осаждение<\/strong> (precipitation)<\/td><td>Перевод примеси или продукта в нерастворимое соединение изменением pH или реагентом<\/td><td>Удаление Fe и Al гидролизом; <strong>оксалаты РЗЭ<\/strong>; карбонат лития (с содой); сульфиды металлов<\/td><\/tr><tr><td><strong>Цементация<\/strong> (cementation)<\/td><td>Вытеснение металла более активным металлом<\/td><td>Медь на железе, примеси на цинковой пыли<\/td><\/tr><tr><td><strong>Ионный обмен<\/strong> (ion exchange, IX)<\/td><td>Смолы обменивают ионы раствора на свои: сорбция, затем десорбция (элюирование) концентрированным раствором<\/td><td><strong>Уран при СПВ<\/strong>, <strong>рений<\/strong>, вольфрам, золото (смолы в пульпе), очистка воды<\/td><\/tr><tr><td><strong>Жидкостная экстракция<\/strong> (solvent extraction, SX)<\/td><td>Органический экстрагент избирательно «забирает» металл из водного раствора<\/td><td>Медь, РЗЭ, Ni/Co, W, Mo, U — подробно в Дне 9<\/td><\/tr><tr><td><strong>Кристаллизация<\/strong> (crystallization)<\/td><td>Выпаривание или охлаждение до выпадения кристаллов<\/td><td><strong>APT<\/strong>, сульфаты Ni и Co, LiOH·H₂O<\/td><\/tr><tr><td><strong>Восстановление водородом<\/strong><\/td><td>Из раствора под давлением или из твёрдых солей в печах<\/td><td>Порошки Ni, Co; W, Mo, Re из оксидов и солей (День 10)<\/td><\/tr><tr><td><strong>Электролиз<\/strong> (electrowinning)<\/td><td>Выделение металла на катоде током<\/td><td>Медь, цинк, кобальт (День 9)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.4 Ключевые схемы для TMK<\/h3>\n<p><strong>А) Вольфрам: от концентрата до APT<\/strong><\/p>\n<pre class=\"code\"><code>Шеелитовый (CaWO₄) или вольфрамитовый ((Fe,Mn)WO₄) концентрат\n  → РАЗЛОЖЕНИЕ (вскрытие):\n       шеелит — содовое автоклавное (Na₂CO₃, ≈ 200 °C+) или щелочное (NaOH) под давлением;\n       вольфрамит — щелочное (NaOH)\n       (исторически шеелит вскрывали также соляной кислотой с получением вольфрамовой кислоты H₂WO₄)\n  → Раствор вольфрамата натрия Na₂WO₄ + кек (CaCO₃, гидроксиды Fe/Mn)\n  → ОЧИСТКА: удаление Si, P, As и особенно Mo (молибден химически очень похож на вольфрам;\n       его отделяют, например, осаждением сульфида молибдена или селективной сорбцией)\n  → КОНВЕРСИЯ в аммонийную форму: жидкостная экстракция аминами или ионный обмен на анионитах\n       → раствор вольфрамата аммония\n  → ВЫПАРНАЯ КРИСТАЛЛИЗАЦИЯ → APT (паравольфрамат аммония, ≈ 88,5% WO₃)<\/code><\/pre>\n<p>Дальше APT прокаливают до оксидов и восстанавливают водородом до порошка вольфрама (День 10).<\/p>\n<p><strong>Где нужны люди:<\/strong> технолог разложения (автоклавы, щёлочь), технолог очистки растворов (тонкая химия примесей, отделение Mo), технолог экстракции или ионного обмена, технолог кристаллизации (размер и чистота кристаллов APT), аналитики (следовые примеси), инженеры по стокам (аммиак, натрий).<\/p>\n<p><strong>Б) Рений: из газов и растворов<\/strong><\/p>\n<ul><li>При окислительном обжиге молибденита рений окисляется до летучего Re₂O₇ и уходит с газами. В системе мокрой газоочистки он переходит в промывные растворы.<\/li><li>Рений есть также в промывных растворах медеплавильного производства и в растворах <strong>СПВ урана<\/strong>.<\/li><li>Его извлекают <strong>сорбцией на анионитах<\/strong> (ионный обмен) или <strong>экстракцией<\/strong> (амины), затем десорбируют (элюируют), очищают и кристаллизуют <strong>перренат аммония<\/strong> NH₄ReO₄ (APR). Восстановление водородом даёт порошок рения — продукт TMK с характеристикой «размер частиц по Фишеру 3,0–7,5 мкм».<\/li><\/ul>\n<p><strong>В) РЗЭ: от концентрата до смешанного продукта<\/strong><\/p>\n<pre class=\"code\"><code>Концентрат РЗЭ (бастнезит / монацит)\n  → ВСКРЫТИЕ: сернокислотный обжиг (acid baking) или щелочное разложение (NaOH — классика для монацита)\n  → Водное или кислотное выщелачивание → раствор РЗЭ + остаток (с торием → радиационный контроль)\n  → Очистка от Fe, Al, Th, U\n  → Осаждение суммы РЗЭ (карбонаты, оксалаты, гидроксиды) или сразу экстракционное разделение\n  → Разделение на индивидуальные РЗЭ — жидкостная экстракция в каскадах (День 9)<\/code><\/pre>\n<p>Для <strong>растворов СПВ урана<\/strong> (проект TMK и Solvomet): РЗЭ и рений присутствуют в низких концентрациях в больших объёмах раствора. Ключевые задачи — <strong>селективное концентрирование<\/strong> (ионный обмен, экстракция) без вреда основному урановому процессу и соблюдение радиационной безопасности.<\/p>\n<p><strong>Г) Литий из сподумена<\/strong><\/p>\n<pre class=\"code\"><code>Сподуменовый концентрат (SC6)\n  → ДЕКРЕПИТАЦИЯ (обжиг ≈ 1 050–1 100 °C): α-сподумен → β-сподумен, реакционноспособная форма\n  → СЕРНОКИСЛОТНЫЙ ОБЖИГ (≈ 250 °C) → водное выщелачивание → раствор Li₂SO₄\n  → Очистка: удаление Fe, Al, Mg, Ca (pH, осаждение, ионный обмен)\n  → Li₂CO₃ (осаждение содой) или LiOH·H₂O (каустификация или электромембранные технологии + кристаллизация)<\/code><\/pre>\n<p><strong>Д) Никель и кобальт из латеритов (HPAL)<\/strong><\/p>\n<pre class=\"code\"><code>Латеритная руда → автоклав (≈ 250 °C, H₂SO₄) → раствор Ni, Co + примеси\n  → нейтрализация и удаление Fe, Al → MHP (смешанный гидроксидный осадок) или MSP (сульфидный)\n  → рафинирование: выщелачивание, экстракция (Cyanex 272 для разделения Co/Ni), кристаллизация\n  → сульфаты никеля и кобальта батарейного качества<\/code><\/pre>\n<p>HPAL массово строят китайские компании в Индонезии. Выход на мощность исторически сложный (см. кривые МакНалти в Дне 5).<\/p>\n<h3>1.5 Оборудование и материалы<\/h3>\n<ul><li><strong>Автоклавы<\/strong> — титановые или футеров
