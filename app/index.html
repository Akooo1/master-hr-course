анные кирпичом; сосуды под давлением с жёсткими требованиями безопасности.<\/li><li><strong>Реакторы с перемешиванием<\/strong> (агитаторы), сгустители и противоточная промывка (CCD), фильтр-прессы.<\/li><li><strong>Ионообменные колонны<\/strong> (неподвижный слой, непрерывный противоток), смолы в пульпе (RIP).<\/li><li><strong>Выпарные аппараты и кристаллизаторы<\/strong> (в т. ч. с механической рекомпрессией пара — MVR).<\/li><li><strong>Материалы:<\/strong> стеклопластик (FRP), гуммированная сталь, дуплексные нержавеющие стали, титан, сплавы Hastelloy. Коррозия — постоянная тема.<\/li><\/ul>\n<h3>1.6 Безопасность и экология гидрометаллургии<\/h3>\n<ul><li>Кислоты, щёлочи, аммиак, <strong>H₂S<\/strong> (при осаждении сульфидов), <strong>HF<\/strong> (очистка графита, некоторые схемы РЗЭ), цианиды.<\/li><li>Сосуды под давлением (автоклавы).<\/li><li><strong>Радиационная безопасность<\/strong> при переработке РЗЭ и урановых растворов (торий, уран, продукты их распада — NORM).<\/li><li>Стоки и хвосты выщелачивания; водный баланс.<\/li><\/ul>\n<blockquote><p><strong>TMK:<\/strong> R&amp;D Park включает Центр технологических испытаний с «выделением элементов гидрометаллургическими методами» и опытно-промышленными испытаниями. Это место, где схемы для W, Re, РЗЭ и Li будут доводить от пробирки до пилотной установки. Профиль руководителя такого центра — один из самых сложных в подборе: наука + масштабирование + управление проектами.<\/p><\/blockquote>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Гидрометаллургия<\/td><td>Hydrometallurgy<\/td><td>Извлечение металлов водными растворами<\/td><\/tr><tr><td>Выщелачивание<\/td><td>Leaching<\/td><td>Растворение ценного компонента<\/td><\/tr><tr><td>Выщелачивающий реагент<\/td><td>Lixiviant<\/td><td>Раствор для выщелачивания (кислота, щёлочь, цианид)<\/td><\/tr><tr><td>Продуктивный раствор<\/td><td>Pregnant leach solution (PLS)<\/td><td>Раствор с растворённым ценным компонентом<\/td><\/tr><tr><td>Кек<\/td><td>Leach residue / cake<\/td><td>Твёрдый остаток после выщелачивания<\/td><\/tr><tr><td>Кучное выщелачивание<\/td><td>Heap leaching<\/td><td>Выщелачивание руды в штабелях<\/td><\/tr><tr><td>Агитационное выщелачивание<\/td><td>Agitated tank leaching<\/td><td>Выщелачивание пульпы в реакторах с перемешиванием<\/td><\/tr><tr><td>Автоклавное выщелачивание<\/td><td>Pressure leaching / autoclave leaching<\/td><td>Выщелачивание при повышенных давлении и температуре<\/td><\/tr><tr><td>Автоклавное кислотное выщелачивание<\/td><td>HPAL (high pressure acid leach)<\/td><td>Технология для никелевых латеритов<\/td><\/tr><tr><td>Бактериальное выщелачивание<\/td><td>Bioleaching<\/td><td>Выщелачивание с помощью бактерий<\/td><\/tr><tr><td>Вскрытие (разложение) концентрата<\/td><td>Cracking / decomposition / digestion<\/td><td>Перевод упорного концентрата в растворимую форму<\/td><\/tr><tr><td>Сернокислотный обжиг<\/td><td>Acid baking / sulfation roasting<\/td><td>Обработка концентрата серной кислотой при нагреве<\/td><\/tr><tr><td>Противоточная промывка<\/td><td>Counter-current decantation (CCD)<\/td><td>Отмывка кека в каскаде сгустителей<\/td><\/tr><tr><td>Осаждение<\/td><td>Precipitation<\/td><td>Выделение вещества из раствора в осадок<\/td><\/tr><tr><td>Цементация<\/td><td>Cementation<\/td><td>Вытеснение металла более активным металлом<\/td><\/tr><tr><td>Ионный обмен<\/td><td>Ion exchange (IX)<\/td><td>Сорбция ионов смолой и их десорбция<\/td><\/tr><tr><td>Сорбция / десорбция (элюирование)<\/td><td>Loading / elution<\/td><td>Поглощение металла смолой и его снятие<\/td><\/tr><tr><td>Анионит<\/td><td>Anion exchange resin<\/td><td>Смола для поглощения анионов (вольфрамат, перренат, уранил-сульфат)<\/td><\/tr><tr><td>Кристаллизация<\/td><td>Crystallization<\/td><td>Выделение твёрдых кристаллов из раствора<\/td><\/tr><tr><td>Маточный раствор<\/td><td>Mother liquor<\/td><td>Раствор, остающийся после кристаллизации<\/td><\/tr><tr><td>Паравольфрамат аммония<\/td><td>Ammonium paratungstate (APT)<\/td><td>Ключевой промежуточный продукт вольфрама<\/td><\/tr><tr><td>Вольфрамат натрия<\/td><td>Sodium tungstate<\/td><td>Раствор после щелочного или содового разложения<\/td><\/tr><tr><td>Перренат аммония<\/td><td>Ammonium perrhenate (APR)<\/td><td>Ключевое соединение рения<\/td><\/tr><tr><td>Декрепитация сподумена<\/td><td>Spodumene decrepitation / calcination<\/td><td>Перевод α-сподумена в β-форму обжигом<\/td><\/tr><tr><td>Карбонат лития / гидроксид лития<\/td><td>Lithium carbonate / lithium hydroxide<\/td><td>Литиевые продукты для аккумуляторов<\/td><\/tr><tr><td>Смешанный гидроксидный осадок<\/td><td>MHP (mixed hydroxide precipitate)<\/td><td>Промежуточный продукт Ni–Co из HPAL<\/td><\/tr><tr><td>Скважинное подземное выщелачивание<\/td><td>In-situ recovery (ISR)<\/td><td>Выщелачивание металла в пласте через скважины<\/td><\/tr><tr><td>Природные радионуклиды<\/td><td>NORM (naturally occurring radioactive material)<\/td><td>Th, U и продукты распада в сырье и отходах<\/td><\/tr><tr><td>Опытно-промышленные испытания<\/td><td>Pilot plant testing<\/td><td>Проверка технологии на пилотной установке<\/td><\/tr><tr><td>Масштабирование<\/td><td>Scale-up<\/td><td>Перенос технологии с лабораторного на промышленный масштаб<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли гидрометаллургии<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Зона<\/th><th>Маркеры уровня<\/th><\/tr><\/thead><tbody><tr><td>Главный гидрометаллург / директор по технологии<\/td><td>Chief Hydrometallurgist / Head of Process Technology<\/td><td>Технологическая стратегия переделов<\/td><td>Запущенные промышленные установки, патенты, масштаб<\/td><\/tr><tr><td>Технолог гидрометаллургического цеха<\/td><td>Hydrometallurgical Process Engineer / Plant Metallurgist (Hydromet)<\/td><td>Ежедневная технология<\/td><td>Реальный передел, KPI извлечения и чистоты<\/td><\/tr><tr><td>Начальник гидрометаллургического цеха<\/td><td>Hydromet Superintendent / Refinery Superintendent<\/td><td>Производство, люди, безопасность<\/td><td>Численность, продукт, объёмы<\/td><\/tr><tr><td>Специалист по ионному обмену<\/td><td>Ion Exchange Specialist<\/td><td>Сорбция, элюирование, смолы<\/td><td>Тип смол, металлы, промышленный масштаб<\/td><\/tr><tr><td>Инженер-технолог по автоклавам<\/td><td>Pressure Leach / Autoclave Engineer<\/td><td>Автоклавы, безопасность сосудов<\/td><td>HPAL / POX опыт<\/td><\/tr><tr><td>Руководитель технологических испытаний<\/td><td>Testwork Manager / Pilot Plant Manager<\/td><td>Лабораторные и пилотные испытания<\/td><td>Пилоты от и до, отчёты для FS<\/td><\/tr><tr><td>Специалист по радиационной безопасности<\/td><td>Radiation Safety Officer (RSO)<\/td><td>NORM, дозиметрия, разрешения<\/td><td>Опыт с РЗЭ или ураном<\/td><\/tr><tr><td>Инженер по водоподготовке и стокам<\/td><td>Water Treatment / Effluent Engineer<\/td><td>Оборот воды, нейтрализация<\/td><td>Сложные стоки (аммиак, сульфаты, фториды)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Шкала масштаба — главный фильтр гидрометаллурга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Уровень<\/th><th>Что делал<\/th><th>Ценность для TMK<\/th><\/tr><\/thead><tbody><tr><td>1. Лаборатория<\/td><td>Опыты в стаканах<\/td><td>Низкая для производственной роли<\/td><\/tr><tr><td>2. Укрупнённые испытания<\/td><td>Килограммы, непрерывные мини-установки<\/td><td>Средняя<\/td><\/tr><tr><td>3. Пилотная установка<\/td><td>Непрерывная работа неделями, данные для проектирования<\/td><td>Высокая для R&amp;D Park и проектов<\/td><\/tr><tr><td>4. Проектирование<\/td><td>Схема, баланс, выбор оборудования (у EPCM)<\/td><td>Высокая для проектной стадии<\/td><\/tr><tr><td>5. Пуск и вывод на мощность<\/td><td>Пусконаладка новой установки<\/td><td><strong>Очень высокая и редкая<\/strong><\/td><\/tr><tr><td>6. Стабильная эксплуатация<\/td><td>Промышленный передел годами<\/td><td>Высокая для действующих цехов<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Правило:<\/strong> всегда спрашивайте, <strong>на каком уровне масштаба<\/strong> кандидат делал то, о чём говорит. «Я разработала технологию извлечения рения» может означать как пробирку, так и промышленный цех.<\/p>\n<h3>3.3 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Опишите схему вашего передела от питания до продукта»<\/td><td>Последовательность операций, реагенты, условия (T, pH, время), продукты и потоки<\/td><td>Знает только свой участок, не видит схему<\/td><\/tr><tr><td>«Какое извлечение на выщелачивании и какая чистота продукта? Какие примеси критичны?»<\/td><td>Цифры, лимитирующие примеси и как их контролировали<\/td><td>Без цифр; не знает спецификаций<\/td><\/tr><tr><td>«Какой у вас был крупнейший масштаб?»<\/td><td>Чётко: лаборатория, пилот, промышленность, с объёмами<\/td><td>Размывает ответ<\/td><\/tr><tr><td>(Вольфрам) «Как вы отделяли молибден от вольфрама?»<\/td><td>Конкретный метод, остаточный Mo в APT<\/td><td>Не знает, что это проблема<\/td><\/tr><tr><td>(IX) «Какие смолы, ёмкость, условия элюирования, как боролись с отравлением смолы?»<\/td><td>Марки и типы смол, цифры, проблемы и решения<\/td><td>Только общая теория<\/td><\/tr><tr><td>«Расскажите о пуске новой установки: что пошло не так?»<\/td><td>Честный разбор, сроки выхода на мощность, решения<\/td><td>«Всё прошло гладко»<\/td><\/tr><tr><td>«Какие требования безопасности были критичны: автоклавы, H₂S, HF, радиация?»<\/td><td>Конкретные системы, процедуры, инциденты и выводы<\/td><td>Безопасность — «это отдел ОТ»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.4 Где искать гидрометаллургов<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Доноры<\/th><\/tr><\/thead><tbody><tr><td>Вольфрам (APT)<\/td><td>Masan High-Tech Materials (Вьетнам), H.C. Starck Tungsten (Mitsubishi Materials), Wolfram Bergbau und Hütten (Sandvik), Global Tungsten &amp; Powders (Plansee), Japan New Metals, китайские производители APT, бывшие специалисты предприятий СНГ (с проверкой санкционных ограничений)<\/td><\/tr><tr><td>Рений, молибден<\/td><td>Molymet (Чили, Бельгия, Германия), KGHM (Польша), Freeport-McMoRan (Climax), АГМК (рядом!), предприятия Казахстана с опытом извлечения рения<\/td><\/tr><tr><td>Уран (СПВ, ионный обмен)<\/td><td>Навоийуран (Узбекистан), Казатомпром и его СП (Казахстан), Cameco (Канада, США), Orano (Франция), Boss Energy (Австралия)<\/td><\/tr><tr><td>РЗЭ<\/td><td>Lynas (Австралия, Малайзия), MP Materials (США), Neo Performance Materials (Silmet, Эстония), Solvay (Ла-Рошель, Франция), Iluka (Австралия), Energy Fuels (США), Saskatchewan Research Council (Канада), ANSTO (Австралия), Carester (Франция), IREL (Индия)<\/td><\/tr><tr><td>Литий<\/td><td>Albemarle, SQM, Ganfeng, Tianqi (Квинана, Австралия), Covalent Lithium (Австралия), литиевые проекты Европы (Германия, Финляндия)<\/td><\/tr><tr><td>Ni–Co<\/td><td>Sherritt (Канада), Sumitomo Metal Mining (Япония, Филиппины), Vale, Glencore (Murrin Murrin), китайские HPAL-проекты в Индонезии, BHP (бывшие специалисты Nickel West)<\/td><\/tr><tr><td>Испытания и инжиниринг<\/td><td>SGS, ALS, Bureau Veritas, Core Resources, Mintek, Hazen Research, Kemetco, ANSTO; инжиниринг — Hatch, Worley, Ausenco, Lycopodium<\/td><\/tr><tr><td>Наука<\/td><td>KU Leuven (Solvomet — партнёр TMK), TU Bergakademie Freiberg (партнёр TMK), Murdoch University, Curtin University, Colorado School of Mines, МИСИС (партнёр TMK), РХТУ им. Менделеева (химия редких элементов)<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Схема по памяти.<\/strong> Нарисуйте схему «вольфрамовый концентрат → APT», не глядя в текст. Сверьте. На каждом шаге подпишите профиль специалиста и одну критичную проблему.<\/p>\n<p><strong>Задание 2 (10 мин). Профиль позиции.<\/strong> «Главный технолог гидрометаллургического передела вольфрама (APT), Чирчик». Сформулируйте:<\/p>\n<ul><li>4 must-have, включая <strong>уровень масштаба<\/strong>;<\/li><li>3 nice-to-have;<\/li><li>8 компаний-доноров;<\/li><li>5 вопросов скрининга с маркерами сильного ответа.<\/li><\/ul>\n<p><strong>Бонус.<\/strong> Найдите в LinkedIn 5 человек по запросу <code>(\"ammonium paratungstate\" OR \"APT\") AND (process OR plant OR production)<\/code>. Определите уровень масштаба каждого по шкале 3.2.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Объясните коллеге за минуту, чем гидрометаллургия отличается от обогащения и от пирометаллургии.<\/li><li>Какой профиль гидрометаллурга для TMK самый дефицитный? Почему?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 9: экстракция, электролиз, рафинирование».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> сегодня был самый плотный день модуля. Если голова гудит, это нормально: так ощущается рост. Не разрешайте себе «отдохнуть пару дней». Завтра — минимальная версия, если нужно, но не пропуск.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Зеликман А. Н., Коршунов Б. Г. «Металлургия редких металлов» — классика по W, Mo, Re, РЗЭ.<\/li><li>E. Lassner, W.-D. Schubert, <em>Tungsten: Properties, Chemistry, Technology of the Element, Alloys, and Chemical Compounds<\/em> (Springer) — главная книга по вольфраму.<\/li><li>C. K. Gupta, N. Krishnamurthy, <em>Extractive Metallurgy of Rare Earths<\/em> (CRC Press).<\/li><li>F. Habashi, <em>Handbook of Extractive Metallurgy<\/em> — энциклопедия по извлечению металлов.<\/li><li>Конференции ALTA (Перт) — Uranium-REE, Ni-Co-Cu, Lithium; сборники докладов — источник имён экспертов.<\/li><li>Видео: «hydrometallurgy explained», «heap leach process», «HPAL nickel process», «ion exchange resin how it works».<\/li><\/ul>"},{"n":9,"module":2,"title":"Жидкостная экстракция, электролиз и рафинирование","file":"module-02-processing-metallurgy/day-09-solvent-extraction-electrowinning-refining.md","duration":"3,5 часа","challenge":"Объяснить «на пальцах» нанимающему менеджеру, <strong>почему разделение РЗЭ требует сотен ступеней экстракции<\/strong> и почему поэтому найти такого технолога вне Китая крайне трудно.","why":"Экстракция, электролиз и рафинирование — это то место, где металл получает чистоту «три девятки» и выше и становится товаром для аэрокосмоса, электроники и аккумуляторов. В плане TMK на 2026 г. — высокочистые селен, теллур и рений. Специалисты по высокой чистоте — самая узкая ниша рынка. Их не найти по ключевому слову «металлург». Их находят те, кто понимает, что именно они делают.","checklist":[{"text":"Разминка: 5 вопросов по Дню 8 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.5 (90 мин)","minutes":90},{"text":"Расчёт: закон Фарадея, 2 задачи (15 мин)","minutes":15},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: объяснение для менеджера + карта доноров по высокой чистоте (25 мин)","minutes":25},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2 (РЗЭ), 1.4 (обозначения чистоты) → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Жидкостная экстракция","en":"Solvent extraction (SX)","def":"Перенос металла из водной фазы в органическую"},{"ru":"Экстрагент","en":"Extractant","def":"Активное вещество органической фазы"},{"ru":"Разбавитель","en":"Diluent","def":"Керосиновая основа органической фазы"},{"ru":"Органическая фаза","en":"Organic phase","def":"Несмешивающийся с водой раствор экстрагента"},{"ru":"Водная фаза","en":"Aqueous phase","def":"Водный раствор металлов"},{"ru":"Экстракция","en":"Extraction / loading","def":"Переход металла в органику"},{"ru":"Промывка (скруббинг)","en":"Scrubbing","def":"Удаление примесей из насыщенной органики"},{"ru":"Реэкстракция","en":"Stripping","def":"Возврат металла из органики в чистый водный раствор"},{"ru":"Рафинат","en":"Raffinate","def":"Обеднённый водный раствор после экстракции"},{"ru":"Смеситель-отстойник","en":"Mixer-settler","def":"Основной аппарат экстракции"},{"ru":"Коэффициент распределения","en":"Distribution coefficient (D)","def":"Отношение концентраций в фазах"},{"ru":"Коэффициент разделения","en":"Separation factor (β)","def":"Мера селективности для двух металлов"},{"ru":"Каскад экстракции","en":"Extraction cascade / circuit","def":"Последовательность ступеней"},{"ru":"Унос","en":"Entrainment","def":"Перенос капель одной фазы в другую"},{"ru":"Межфазные образования","en":"Crud","def":"Эмульсионные отложения на границе фаз"},{"ru":"Электроэкстракция","en":"Electrowinning (EW)","def":"Выделение металла из раствора на катоде с нерастворимым анодом"},{"ru":"Электрорафинирование","en":"Electrorefining (ER)","def":"Очистка металла через растворимый анод"},{"ru":"Катод / анод","en":"Cathode / anode","def":"Электроды: восстановление / окисление"},{"ru":"Электролит","en":"Electrolyte","def":"Раствор, проводящий ток в ванне"},{"ru":"Выход по току","en":"Current efficiency","def":"Доля тока, ушедшая на целевую реакцию"},{"ru":"Анодный шлам","en":"Anode slimes","def":"Нерастворимый остаток анодов; источник Au, Ag, Se, Te"},{"ru":"Электролиз расплавленных солей","en":"Molten salt electrolysis","def":"Получение Al, Mg, Li, РЗЭ-металлов из расплавов"},{"ru":"Огневое рафинирование","en":"Fire refining","def":"Очистка расплава окислением и восстановлением"},{"ru":"Вакуумная дистилляция","en":"Vacuum distillation","def":"Очистка испарением и конденсацией в вакууме"},{"ru":"Зонная плавка","en":"Zone refining","def":"Метод получения сверхчистых веществ"},{"ru":"Электронно-лучевая плавка","en":"Electron beam melting (EBM)","def":"Рафинирование тугоплавких металлов в вакууме"},{"ru":"Высокочистый металл","en":"High-purity metal (4N, 5N, 6N)","def":"Металл с минимальным содержанием примесей"},{"ru":"Масс-спектрометрия тлеющего разряда","en":"GDMS (glow discharge mass spectrometry)","def":"Анализ следовых примесей в твёрдых образцах"},{"ru":"Мишень для напыления","en":"Sputtering target","def":"Изделие из высокочистого металла для электроники"},{"ru":"Оксид неодима-празеодима","en":"NdPr oxide","def":"Главный товарный продукт РЗЭ для магнитов"}],"quiz":[{"q":"Что происходит на стадии реэкстракции (stripping)?","options":["Металл переходит из водного раствора в органическую фазу экстрагента","Отработанную органику сжигают и заменяют свежим экстрагентом","Водный раствор нейтрализуют известью перед сбросом в хвостохранилище","Металл возвращается из органики в чистый водный раствор с высокой концентрацией"],"answer":3,"explain":"Цикл: экстракция → промывка → реэкстракция. После реэкстракции органика возвращается на экстракцию."},{"q":"Почему разделение РЗЭ требует сотен ступеней экстракции?","options":["Из-за высокой цены РЗЭ каждую ступень повторяют несколько раз для надёжности","Из-за радиоактивности потоки приходится многократно разбавлять на каждой ступени","Соседние РЗЭ химически почти одинаковы, и на одной ступени они разделяются слабо","Так исторически сложилось в Китае, и западные заводы копируют китайские схемы"],"answer":2,"explain":"Малые коэффициенты разделения требуют длинных каскадов. Отсюда сложность технологии и дефицит специалистов."},{"q":"Какой экстрагент — основа китайских каскадов разделения РЗЭ?","options":["P507 (PC88A)","LIX","Ксантогенат","Цианид"],"answer":0,"explain":"P507 / PC88A — фосфорорганическая кислота. LIX — экстрагент для меди."},{"q":"Чем электроэкстракция отличается от электрорафинирования?","options":["Ничем: это два названия одного процесса в разных странах и отраслях","Электрорафинирование проводят без тока, только за счёт химических реакций в растворе","EW: нерастворимый анод, металл выделяется из раствора; ER: растворяется анод из чернового металла","Электроэкстракция используется только для золота и серебра, а электрорафинирование — для меди"],"answer":2,"explain":"EW получает металл из раствора (например, после SX). ER очищает уже полученный черновой металл."},{"q":"Главный мировой источник селена и теллура:","options":["Собственные селеновые и теллуровые месторождения","Анодный шлам электролитического рафинирования меди","Морская вода и рассолы солёных озёр","Угольная зола тепловых электростанций"],"answer":1,"explain":"Se и Te — попутные продукты медного производства. Поэтому их выпуск привязан к медеплавильным и рафинировочным заводам."},{"q":"Ток 1 000 А течёт сутки, металл — медь, выход по току 100%. Масса меди примерно:","options":["2,8 кг","28,5 кг","285 кг","2,85 т"],"answer":1,"explain":"m = 1 000 · 86 400 · 63,55 / (2 · 96 485) ≈ 28,5 кг."},{"q":"Что означает обозначение 3N5?","options":["99,9%","99,995%","35 примесей","99,95%"],"answer":3,"explain":"Три девятки и пятёрка: 99,95%. Например, молибденовые штабики TMK — 99,95% Mo."},{"q":"Каким методом анализируют десятки следовых примесей в твёрдом высокочистом металле?","options":["GDMS (масс-спектрометрия тлеющего разряда)","Пробирный анализ со свинцовым коллектором","Титрование с потенциометрическим окончанием","Визуальный осмотр под оптическим микроскопом"],"answer":0,"explain":"GDMS — стандарт для сертификации 5N–6N. Без такой аналитики высокочистый металл не продать."},{"q":"Почему вольфрам и молибден нужны производителям металлов РЗЭ?","options":["Вольфрам и молибден добавляют в магниты NdFeB для прочности","Соединения W и Mo служат экстрагентами при разделении РЗЭ","Не нужны: в производстве металлов РЗЭ их не используют","Из них делают катоды для электролиза фторидных расплавов РЗЭ"],"answer":3,"explain":"При электролизе NdPr в фторидных расплавах используют вольфрамовые или молибденовые катоды: эти металлы выдерживают высокие температуры и агрессивную среду."},{"q":"Кандидат на роль технолога по высокочистому теллуру говорит: «Чистоту подтверждала лаборатория, я в это не вникала». Ваш вывод:","options":["Нормально: подтверждение чистоты — работа лаборатории, а технолог отвечает только за режимы процесса","Тревожный сигнал: технолог высокой чистоты должен знать лимитирующие примеси и методы их анализа","Это плюс: кандидат доверяет коллегам и умеет делегировать","Вопрос не важен: для теллура достаточно паспорта поставщика сырья"],"answer":1,"explain":"В высокой чистоте технология и аналитика неразделимы. Непонимание аналитики говорит о поверхностном опыте."}],"html":"<h2>0. Разминка: вспомнить День 8<\/h2>\n<ol><li>Назовите шаги схемы «вольфрамовый концентрат → APT».<\/li><li>Чем ионный обмен отличается от осаждения?<\/li><li>Как извлекают рений из газов обжига молибденита?<\/li><li>Что такое шкала масштаба гидрометаллурга и какой уровень самый редкий?<\/li><li>Зачем TMK собственная серная кислота?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Разложение (сода или NaOH) → раствор вольфрамата натрия → очистка (Si, P, As, Mo) → экстракция или ионный обмен → вольфрамат аммония → выпарная кристаллизация → APT.<\/li><li>Ионный обмен поглощает ионы смолой с последующей десорбцией (концентрирование, разделение). Осаждение переводит вещество в нерастворимый осадок.<\/li><li>Re₂O₇ возгоняется при обжиге, улавливается мокрой газоочисткой; из промывных растворов рений сорбируют или экстрагируют, затем кристаллизуют перренат аммония.<\/li><li>Лаборатория → укрупнённые испытания → пилот → проектирование → пуск и вывод на мощность → эксплуатация. Самый редкий — пуск и вывод на мощность.<\/li><li>Серная кислота — самый массовый реагент гидрометаллургии; своя кислота — основа будущих переделов.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Жидкостная экстракция (solvent extraction, SX)<\/h3>\n<p><strong>Принцип.<\/strong> Водный раствор металлов смешивают с несмешивающейся с водой <strong>органической фазой<\/strong>, в которой растворён <strong>экстрагент<\/strong>. Экстрагент избирательно «забирает» нужный металл из воды в органику. Затем органику отделяют и <strong>реэкстрагируют<\/strong> (возвращают) металл в чистый водный раствор с высокой концентрацией.<\/p>\n<p><strong>Цикл экстракции:<\/strong><\/p>\n<pre class=\"code\"><code>Водный раствор (PLS) ──► ЭКСТРАКЦИЯ ──► рафинат (обеднённый раствор, возврат на выщелачивание)\n                              │ насыщенная органика\n                              ▼\n                         ПРОМЫВКА (скруббинг) — удаление соэкстрагированных примесей\n                              │\n                              ▼\n                         РЕЭКСТРАКЦИЯ ──► богатый чистый водный раствор → электролиз / осаждение / кристаллизация\n                              │ регенерированная органика\n                              └──────────► обратно на экстракцию<\/code><\/pre>\n<p><strong>Состав органической фазы:<\/strong><\/p>\n<ul><li><strong>экстрагент<\/strong> — активное вещество;<\/li><li><strong>разбавитель<\/strong> (diluent) — очищенный керосин;<\/li><li><strong>модификатор<\/strong> — улучшает расслаивание фаз.<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>Экстрагент (класс)<\/th><th>Примеры<\/th><th>Для чего<\/th><\/tr><\/thead><tbody><tr><td>Оксимы<\/td><td>LIX (BASF), Acorga (Syensqo)<\/td><td><strong>Медь<\/strong> — массовая технология SX-EW<\/td><\/tr><tr><td>Фосфорорганические кислоты<\/td><td><strong>D2EHPA<\/strong>, <strong>PC88A / P507<\/strong>, Cyanex 272<\/td><td><strong>РЗЭ<\/strong> (P507 — основа китайских каскадов), Zn; Cyanex 272 — разделение <strong>Co/Ni<\/strong><\/td><\/tr><tr><td>Нейтральные фосфорорганические<\/td><td><strong>ТБФ<\/strong> (трибутилфосфат), Cyanex 923<\/td><td>Уран, Zr/Hf, РЗЭ в нитратных средах<\/td><\/tr><tr><td>Амины<\/td><td>Alamine 336 (третичные), Aliquat 336 (четвертичные)<\/td><td><strong>Уран, вольфрам, молибден, рений, ванадий<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Оборудование:<\/strong><\/p>\n<ul><li><strong>смесители-отстойники<\/strong> (mixer-settlers) — основной аппарат: камера смешения + отстойник;<\/li><li><strong>пульсационные колонны<\/strong> (pulsed columns);<\/li><li><strong>центробежные экстракторы<\/strong> (centrifugal contactors).<\/li><\/ul>\n<p><strong>Ключевые параметры и проблемы:<\/strong><\/p>\n<ul><li><strong>коэффициент распределения<\/strong> D — отношение концентраций металла в органике и воде;<\/li><li><strong>коэффициент разделения<\/strong> β = D₁ / D₂ — насколько легко разделить два металла;<\/li><li>отношение потоков органики и воды (O/A); число ступеней (рассчитывают по диаграмме МакКейба–Тиле);<\/li><li><strong>унос органики<\/strong> с водой и воды с органикой (entrainment) — потери дорогого экстрагента и загрязнение продукта;<\/li><li><strong>межфазные образования<\/strong> (crud) — «грязь» на границе фаз, бич SX-установок;<\/li><li><strong>пожароопасность<\/strong>: органика горит. На SX-установках в мире случались крупные пожары, поэтому пожарная безопасность — отдельная компетенция.<\/li><\/ul>\n<h3>1.2 Почему разделение РЗЭ — «высшая лига» экстракции<\/h3>\n<p>РЗЭ (особенно соседние лантаноиды) химически <strong>почти одинаковы<\/strong>. Коэффициенты разделения соседних пар в типовых системах невелики (часто в диапазоне ~1,5–3 и ниже). Если на одной ступени металлы разделяются чуть-чуть, нужны <strong>каскады из десятков ступеней на одно разделение<\/strong>. Полная схема разделения на индивидуальные элементы — это <strong>сотни, а на крупных заводах — тысячи ступеней<\/strong> смесителей-отстойников.<\/p>\n<p><strong>Типовая логика:<\/strong><\/p>\n<ol><li>Разделение на группы: лёгкие (La, Ce, Pr, Nd) / средние (Sm, Eu, Gd) / тяжёлые (Tb, Dy, Ho, Er, Y…).<\/li><li>Затем выделение ценных индивидуальных элементов или пар: <strong>NdPr-оксид<\/strong> (для магнитов), <strong>Dy, Tb<\/strong> (жаростойкие магниты), Y, La, Ce.<\/li><li>Осаждение (оксалаты, карбонаты) → прокалка → <strong>оксиды РЗЭ<\/strong> чистотой 99–99,999%.<\/li><\/ol>\n<p><strong>Что из этого следует для подбора:<\/strong><\/p>\n<ul><li>Технолог каскадного разделения РЗЭ умеет моделировать каскады, управлять сотнями ступеней, держать баланс по каждому элементу и быстро реагировать на сбои. Таких людей в мире немного, большинство работает в Китае.<\/li><li>Вне Китая разделение РЗЭ промышленно ведут единицы компаний: Lynas (Малайзия), Solvay (Ла-Рошель, Франция), Neo Performance Materials (Silmet, Эстония), MP Materials (США), IREL (Индия) и несколько новых заводов (Energy Fuels, Iluka, Saskatchewan Research Council, Carester и др.).<\/li><li><strong>Экспорт китайских технологий извлечения и разделения РЗЭ запрещён с конца 2023 г.<\/strong> Найм специалистов из китайских компаний требует юридической оценки рисков передачи технологий.<\/li><\/ul>\n<h3>1.3 Электролиз: электроэкстракция и электрорафинирование<\/h3>\n<p><strong>Электроэкстракция<\/strong> (electrowinning, EW) — выделение металла из раствора на катоде с <strong>нерастворимым<\/strong> анодом.<\/p>\n<ul><li>На катоде: Me²⁺ + 2e⁻ → Me.<\/li><li>На аноде выделяется кислород, а кислота регенерируется и возвращается в процесс.<\/li><li>Медь: богатый электролит после SX → катоды на постоянных матрицах из нержавеющей стали (технология ISA и аналоги) → <strong>катодная медь класса Grade A<\/strong> (≈ 99,99% Cu).<\/li><li>Также электроэкстракцией получают цинк, кобальт, никель, марганец.<\/li><\/ul>\n<p><strong>Электрорафинирование<\/strong> (electrorefining, ER) — очистка металла: <strong>растворимый<\/strong> анод из чернового металла растворяется, чистый металл осаждается на катоде.<\/p>\n<ul><li>Медь: аноды после огневого рафинирования → катоды 99,99%.<\/li><li>Примеси идут в электролит (Ni, As, Sb, Bi) или в <strong>анодный шлам<\/strong> (Au, Ag, <strong>Se, Te<\/strong>, платиноиды).<\/li><li><strong>Анодный шлам медного рафинирования — главный мировой источник селена и теллура.<\/strong> Отсюда логика TMK по высокочистым Se и Te, тем более что рядом медное производство АГМК (логичное предположение; конкретный источник сырья уточните внутри компании).<\/li><\/ul>\n<p><strong>Закон Фарадея<\/strong> — сколько металла даёт ток:<\/p>\n<pre class=\"code\"><code>m = I · t · M / (z · F)\nI — ток (А), t — время (с), M — молярная масса (г/моль), z — заряд иона, F = 96 485 Кл/моль<\/code><\/pre>\n<p><strong>Пример.<\/strong> Ток 1 000 А в течение суток (86 400 с) для меди (M = 63,55; z = 2): m = 1 000 · 86 400 · 63,55 / (2 · 96 485) ≈ <strong>28,5 кг<\/strong> при 100% выходе по току.<\/p>\n<p><strong>Выход по току<\/strong> (current efficiency) — доля тока, ушедшая на целевую реакцию (у меди при EW обычно около 90–95%). Удельный расход энергии — кВт·ч на тонну металла; при EW он в разы выше, чем при ER, потому что напряжение на ванне больше.<\/p>\n<p><strong>Электролиз расплавленных солей<\/strong> (molten salt electrolysis) — для металлов, которые нельзя выделить из водных растворов:<\/p>\n<ul><li><strong>алюминий<\/strong> — процесс Холла–Эру (≈ 950–960 °C, криолит);<\/li><li><strong>магний, литий, натрий<\/strong>;<\/li><li><strong>неодим, празеодим (NdPr), другие РЗЭ-металлы<\/strong> — электролиз фторидных расплавов с подачей оксида; используют графитовый анод и <strong>вольфрамовый или молибденовый катод<\/strong>. Вольфрам и молибден TMK нужны даже производителям РЗЭ-металлов.<\/li><\/ul>\n<p><strong>Задачи для самопроверки:<\/strong><\/p>\n<ol><li>Сколько меди даст ванна при 30 000 А за сутки при выходе по току 92%?<\/li><li>Почему для никеля и кобальта электролиз чувствителен к примесям сильнее, чем для меди?<\/li><\/ol>\n<details><summary>Решения<\/summary>\n<ol><li>28,5 кг × 30 × 0,92 ≈ 787 кг/сутки.<\/li><li>Ni и Co осаждаются при более отрицательных потенциалах; примеси (Cu, Zn, Fe и др.) соосаждаются или снижают выход по току. Требования к чистоте электролита выше, отсюда сложная очистка растворов (экстракция Cyanex 272 и др.).<\/li><\/ol>\n<\/details>\n<h3>1.4 Рафинирование и высокая чистота<\/h3>\n<p><strong>Обозначения чистоты:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Обозначение<\/th><th>Чистота<\/th><th>Где встречается<\/th><\/tr><\/thead><tbody><tr><td>2N<\/td><td>99%<\/td><td>Технические продукты<\/td><\/tr><tr><td>3N<\/td><td>99,9%<\/td><td><strong>Металлический рений TMK (99,9%)<\/strong>, многие металлы<\/td><\/tr><tr><td>3N5<\/td><td>99,95%<\/td><td><strong>Штабики Mo TMK (99,95%)<\/strong><\/td><\/tr><tr><td>4N<\/td><td>99,99%<\/td><td>Катодная медь, многие электронные материалы<\/td><\/tr><tr><td>5N<\/td><td>99,999%<\/td><td>Полупроводниковые и оптические материалы, высокочистые Se, Te<\/td><\/tr><tr><td>6N+<\/td><td>99,9999% и выше<\/td><td>Мишени для напыления, полупроводники<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Методы рафинирования:<\/strong><\/p>\n<ul><li><strong>огневое<\/strong> (fire refining) — продувка расплава воздухом, затем восстановление (медь перед электрорафинированием);<\/li><li><strong>электрорафинирование<\/strong> — водное или в расплавах солей;<\/li><li><strong>химическое<\/strong> — перекристаллизация, повторное осаждение, ионный обмен и экстракция для «полировки» растворов;<\/li><li><strong>вакуумная дистилляция и сублимация<\/strong> — <strong>Se, Te<\/strong>, Mg, Zn, Cd;<\/li><li><strong>зонная плавка<\/strong> (zone refining) — сверхвысокая чистота для полупроводников;<\/li><li><strong>электронно-лучевая плавка<\/strong> (EBM) и <strong>вакуумно-дуговой переплав<\/strong> (VAR) — тугоплавкие металлы (Ta, Nb, Mo, W, Re), титан и суперсплавы.<\/li><\/ul>\n<p><strong>Аналитика высокой чистоты<\/strong> (без неё высокочистый металл не продать):<\/p>\n<ul><li><strong>GDMS<\/strong> (масс-спектрометрия тлеющего разряда) — десятки примесей на уровне ppb–ppm в твёрдом образце;<\/li><li><strong>ICP-MS<\/strong> — следы примесей в растворах;<\/li><li><strong>газоанализаторы<\/strong> (LECO и аналоги) — O, N, H, C, S.<\/li><\/ul>\n<p>Кто владеет GDMS и чистыми помещениями, тот может сертифицировать 5N–6N.<\/p>\n<p><strong>Где нужны высокочистые металлы TMK:<\/strong><\/p>\n<ul><li><strong>рений<\/strong> — суперсплавы для лопаток турбин (GE Aerospace, Rolls-Royce, Pratt &amp; Whitney и их поставщики сплавов) и платино-рениевые катализаторы риформинга;<\/li><li><strong>теллур<\/strong> — солнечные модули CdTe (First Solar), термоэлектрики (Bi₂Te₃);<\/li><li><strong>селен<\/strong> — электроника, стекло, металлургия;<\/li><li><strong>вольфрам и молибден 3N5–5N<\/strong> — мишени для напыления в электронике, рентгеновские трубки, тигли.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Жидкостная экстракция<\/td><td>Solvent extraction (SX)<\/td><td>Перенос металла из водной фазы в органическую<\/td><\/tr><tr><td>Экстрагент<\/td><td>Extractant<\/td><td>Активное вещество органической фазы<\/td><\/tr><tr><td>Разбавитель<\/td><td>Diluent<\/td><td>Керосиновая основа органической фазы<\/td><\/tr><tr><td>Органическая фаза<\/td><td>Organic phase<\/td><td>Несмешивающийся с водой раствор экстрагента<\/td><\/tr><tr><td>Водная фаза<\/td><td>Aqueous phase<\/td><td>Водный раствор металлов<\/td><\/tr><tr><td>Экстракция<\/td><td>Extraction / loading<\/td><td>Переход металла в органику<\/td><\/tr><tr><td>Промывка (скруббинг)<\/td><td>Scrubbing<\/td><td>Удаление примесей из насыщенной органики<\/td><\/tr><tr><td>Реэкстракция<\/td><td>Stripping<\/td><td>Возврат металла из органики в чистый водный раствор<\/td><\/tr><tr><td>Рафинат<\/td><td>Raffinate<\/td><td>Обеднённый водный раствор после экстракции<\/td><\/tr><tr><td>Смеситель-отстойник<\/td><td>Mixer-settler<\/td><td>Основной аппарат экстракции<\/td><\/tr><tr><td>Коэффициент распределения<\/td><td>Distribution coefficient (D)<\/td><td>Отношение концентраций в фазах<\/td><\/tr><tr><td>Коэффициент разделения<\/td><td>Separation factor (β)<\/td><td>Мера селективности для двух металлов<\/td><\/tr><tr><td>Каскад экстракции<\/td><td>Extraction cascade / circuit<\/td><td>Последовательность ступеней<\/td><\/tr><tr><td>Унос<\/td><td>Entrainment<\/td><td>Перенос капель одной фазы в другую<\/td><\/tr><tr><td>Межфазные образования<\/td><td>Crud<\/td><td>Эмульсионные отложения на границе фаз<\/td><\/tr><tr><td>Электроэкстракция<\/td><td>Electrowinning (EW)<\/td><td>Выделение металла из раствора на катоде с нерастворимым анодом<\/td><\/tr><tr><td>Электрорафинирование<\/td><td>Electrorefining (ER)<\/td><td>Очистка металла через растворимый анод<\/td><\/tr><tr><td>Катод / анод<\/td><td>Cathode / anode<\/td><td>Электроды: восстановление / окисление<\/td><\/tr><tr><td>Электролит<\/td><td>Electrolyte<\/td><td>Раствор, проводящий ток в ванне<\/td><\/tr><tr><td>Выход по току<\/td><td>Current efficiency<\/td><td>Доля тока, ушедшая на целевую реакцию<\/td><\/tr><tr><td>Анодный шлам<\/td><td>Anode slimes<\/td><td>Нерастворимый остаток анодов; источник Au, Ag, Se, Te<\/td><\/tr><tr><td>Электролиз расплавленных солей<\/td><td>Molten salt electrolysis<\/td><td>Получение Al, Mg, Li, РЗЭ-металлов из расплавов<\/td><\/tr><tr><td>Огневое рафинирование<\/td><td>Fire refining<\/td><td>Очистка расплава окислением и восстановлением<\/td><\/tr><tr><td>Вакуумная дистилляция<\/td><td>Vacuum distillation<\/td><td>Очистка испарением и конденсацией в вакууме<\/td><\/tr><tr><td>Зонная плавка<\/td><td>Zone refining<\/td><td>Метод получения сверхчистых веществ<\/td><\/tr><tr><td>Электронно-лучевая плавка<\/td><td>Electron beam melting (EBM)<\/td><td>Рафинирование тугоплавких металлов в вакууме<\/td><\/tr><tr><td>Высокочистый металл<\/td><td>High-purity metal (4N, 5N, 6N)<\/td><td>Металл с минимальным содержанием примесей<\/td><\/tr><tr><td>Масс-спектрометрия тлеющего разряда<\/td><td>GDMS (glow discharge mass spectrometry)<\/td><td>Анализ следовых примесей в твёрдых образцах<\/td><\/tr><tr><td>Мишень для напыления<\/td><td>Sputtering target<\/td><td>Изделие из высокочистого металла для электроники<\/td><\/tr><tr><td>Оксид неодима-празеодима<\/td><td>NdPr oxide<\/td><td>Главный товарный продукт РЗЭ для магнитов<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><\/tr><\/thead><tbody><tr><td>Начальник экстракционного участка / технолог SX<\/td><td>SX Superintendent / SX Process Engineer<\/td><td>Число ступеней, экстрагенты, потери органики (ppm), борьба с crud, пожарная безопасность<\/td><\/tr><tr><td>Технолог каскадного разделения РЗЭ<\/td><td>REE Separation Process Engineer / Chemist<\/td><td>Какие пары разделял, чистота продуктов, моделирование каскадов, промышленный масштаб<\/td><\/tr><tr><td>Начальник электролизного цеха<\/td><td>Tankhouse / Electrowinning Superintendent<\/td><td>Ток (кА), выход по току, качество катодов, короткие замыкания, кислотный туман<\/td><\/tr><tr><td>Начальник рафинировочного производства<\/td><td>Refinery Manager<\/td><td>Продукты, чистота, объёмы, извлечение благородных и попутных металлов<\/td><\/tr><tr><td>Технолог по высокочистым металлам<\/td><td>High-Purity Materials Engineer / Process Chemist (5N–6N)<\/td><td>Методы (вакуумная дистилляция, зонная плавка, EBM), чистота, аналитика GDMS<\/td><\/tr><tr><td>Электрохимик (расплавы)<\/td><td>Molten Salt Electrolysis Engineer<\/td><td>Ячейки, электроды, выход по току, металлы (Al, Mg, Li, NdPr)<\/td><\/tr><tr><td>Аналитик следовых примесей<\/td><td>Trace Analysis Chemist (ICP-MS, GDMS)<\/td><td>Пределы обнаружения, стандарты, аккредитация<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>(SX) «Какой экстрагент, сколько ступеней экстракции, промывки и реэкстракции?»<\/td><td>Точная конфигурация и почему такая<\/td><td>«Стандартная схема»<\/td><\/tr><tr><td>(SX) «Какие были потери органики и как вы с ними боролись?»<\/td><td>Цифры (ppm или кг на тонну), меры: коалесцеры, контроль фаз<\/td><td>Не измеряли<\/td><\/tr><tr><td>(РЗЭ) «Какие пары вы разделяли и какую чистоту получали? Сколько ступеней было в каскаде?»<\/td><td>Конкретные элементы, 99,9–99,99%, число ступеней<\/td><td>Только «работал с РЗЭ»<\/td><\/tr><tr><td>(EW) «Какой выход по току? Как боролись с короткими замыканиями и дендритами?»<\/td><td>Цифры, причины, системы контроля<\/td><td>Не знает показателя<\/td><\/tr><tr><td>(Высокая чистота) «Как вы подтверждали чистоту 5N? Какие примеси лимитировали?»<\/td><td>GDMS или ICP-MS, конкретные элементы, спецификации клиентов<\/td><td>«Лаборатория давала паспорт»<\/td><\/tr><tr><td>«С какими клиентами и спецификациями вы работали?»<\/td><td>Отрасли, стандарты, аудит клиентов<\/td><td>Не знает, куда шёл продукт<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Доноры<\/th><\/tr><\/thead><tbody><tr><td>SX-EW меди<\/td><td>Freeport-McMoRan (Аризона, Перу), Codelco, BHP (Эскондида), Antofagasta, First Quantum, Glencore (ДР Конго), ERG, CMOC, Zijin; казахстанские медные предприятия<\/td><\/tr><tr><td>Разделение РЗЭ<\/td><td>Lynas, Solvay (Ла-Рошель), Neo Performance Materials (Silmet), MP Materials, Energy Fuels, Iluka, Saskatchewan Research Council, Carester, IREL; Китай (с юридической оценкой)<\/td><\/tr><tr><td>Медное рафинирование, Se и Te из шламов<\/td><td>Aurubis (Гамбург), Boliden (Рённшер), Umicore (Хобокен — один из крупнейших переработчиков шламов и вторичного сырья), JX Metals, Mitsubishi Materials, Sumitomo Metal Mining, АГМК, медеплавильные предприятия Казахстана; предприятия России (с проверкой санкционных ограничений)<\/td><\/tr><tr><td>Высокочистые металлы<\/td><td><strong>5N Plus<\/strong> (Канада — Te, Se, Bi, полупроводниковые материалы), Umicore, JX Metals (мишени для напыления), Materion (США), Plansee, H.C. Starck Tungsten, Honeywell Electronic Materials, Vital Materials (Китай)<\/td><\/tr><tr><td>Электролиз расплавов (NdPr, Li)<\/td><td>Производители РЗЭ-металлов и магнитов вне Китая (Вьетнам, Япония, Великобритания, США), производители лития и магния<\/td><\/tr><tr><td>Экстрагенты (технические специалисты)<\/td><td>BASF (LIX), Syensqo (Acorga, Cyanex), Clariant<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Объяснение для менеджера.<\/strong> Напишите 5–7 предложений: «Почему найти технолога по разделению РЗЭ так сложно и долго». Без жаргона, но с фактами: химическое сходство, сотни ступеней, концентрация технологий в Китае, ограничения на экспорт технологий, малое число заводов вне Китая. Это ваш реальный инструмент для управления ожиданиями заказчика.<\/p>\n<p><strong>Задание 2 (10 мин). Карта доноров «Высокая чистота Se, Te, Re».<\/strong> Добавьте в вашу карту из Дня 1 десять компаний с ролями. Отметьте, где есть GDMS-лаборатории и чистые помещения.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Прочитайте вслух своё объяснение из Задания 1. Убедительно ли оно для руководителя, который «хочет кандидата через две недели»?<\/li><li>Какие три компании-донора по высокой чистоте вы выделили бы первыми?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 10: пирометаллургия, порошковая металлургия и финал модуля 2».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> завтра — финал Модуля 2 и треть всей программы. Вы соединяете цепочку TMK целиком: от концентрата до твёрдосплавной пластины. После завтрашнего дня вы будете понимать производство TMK лучше, чем большинство людей, которые о нём пишут.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>M. Schlesinger, K. Sole, W. Davenport, G. Alvear, <em>Extractive Metallurgy of Copper<\/em> — главы о SX, EW и электрорафинировании.<\/li><li>Публикации Solvomet KU Leuven (Koen Binnemans) о гидро- и сольвометаллургии РЗЭ — источник и знаний, и имён.<\/li><li>Отчёты Adamas Intelligence и Benchmark Mineral Intelligence о рынке РЗЭ и магнитов (частично платные; бесплатные обзоры и вебинары).<\/li><li>Видео: «solvent extraction mixer settler animation», «copper electrowinning tankhouse», «rare earth separation process».<\/li><\/ul>"},{"n":10,"module":2,"title":"Пирометаллургия и порошковая металлургия: от концентрата до изделия TMK","file":"module-02-processing-metallurgy/day-10-pyrometallurgy-powder-metallurgy.md","duration":"4 часа","challenge":"Собрать <strong>полные цепочки TMK<\/strong> для вольфрама, молибдена и рения: от концентрата до продукта из каталога TMK. На каждом шаге указать роль, дефицит и компанию-донора. Затем пройти итоговый тест модуля.","why":"То, что делает Чирчик, — твёрдые сплавы ВК6/ВК8, штабики вольфрама и молибдена, порошок рения, ферромолибден, — это пирометаллургия и порошковая металлургия. Здесь живёт ядро компетенций TMK и Smart Powder. Когда вы поймёте эту часть, вы сможете говорить с технологами Чирчика на их языке. Тогда они начнут доверять вам свои самые сложные вакансии.","checklist":[{"text":"Разминка: 5 вопросов по Дням 8–9 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.5 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Кейс-финал: три цепочки TMK (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Итоговый тест модуля 2 ≥ 16/20 — см. <a href=\"#module-2\">README модуля<\/a> (20 мин)","minutes":20},{"text":"Teach-back: 10 минут объясняете коллеге путь «концентрат → твёрдосплавная пластина»","minutes":0},{"text":"Рефлексия (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.3 и 1.4 → тест дня. Кейс и итоговый тест модуля — в ближайший выходной, до Модуля 3.","terms":[{"ru":"Пирометаллургия","en":"Pyrometallurgy","def":"Металлургия высоких температур"},{"ru":"Прокалка","en":"Calcination","def":"Термическое разложение соединения"},{"ru":"Обжиг","en":"Roasting","def":"Химическое превращение твёрдого вещества в газовой среде при нагреве"},{"ru":"Многоподовая печь","en":"Multiple hearth furnace (MHF)","def":"Печь для обжига молибденита"},{"ru":"Плавка","en":"Smelting","def":"Расплавление с разделением фаз"},{"ru":"Штейн","en":"Matte","def":"Сульфидный расплав Cu, Ni, Fe"},{"ru":"Шлак","en":"Slag","def":"Оксидный расплав пустой породы и флюсов"},{"ru":"Флюс","en":"Flux","def":"Добавка для формирования шлака"},{"ru":"Конвертирование","en":"Converting","def":"Продувка штейна воздухом"},{"ru":"Металлотермия","en":"Metallothermic reduction","def":"Восстановление оксида активным металлом"},{"ru":"Ферромолибден","en":"Ferromolybdenum (FeMo)","def":"Сплав Fe–Mo для легирования сталей"},{"ru":"Восстановление водородом","en":"Hydrogen reduction","def":"Получение металлических порошков из оксидов и солей"},{"ru":"Карбидизация","en":"Carburization","def":"Получение карбида (W + C → WC)"},{"ru":"Газоочистка","en":"Off-gas cleaning / gas handling","def":"Улавливание пыли, SO₂ и ценных компонентов из газов"},{"ru":"Огнеупоры","en":"Refractories","def":"Материалы футеровки печей"},{"ru":"Порошковая металлургия","en":"Powder metallurgy (PM)","def":"Изделия из порошков прессованием и спеканием"},{"ru":"Распыление расплава","en":"Atomization","def":"Получение порошка распылением жидкого металла"},{"ru":"Размер частиц по Фишеру","en":"Fisher sub-sieve size (FSSS)","def":"Стандартная характеристика порошков W, Mo, Re"},{"ru":"Насыпная плотность","en":"Apparent density","def":"Плотность свободно насыпанного порошка"},{"ru":"Прессование","en":"Compaction / pressing","def":"Формование порошка в пресс-форме"},{"ru":"Изостатическое прессование","en":"Isostatic pressing (CIP / HIP)","def":"Прессование равномерным давлением (холодное / горячее)"},{"ru":"Спекание","en":"Sintering","def":"Нагрев прессовки ниже температуры плавления для упрочнения"},{"ru":"Жидкофазное спекание","en":"Liquid phase sintering","def":"Спекание с расплавлением связки (Co в твёрдом сплаве)"},{"ru":"Твёрдый сплав","en":"Cemented carbide / hardmetal","def":"Композит WC + Co"},{"ru":"Карбид вольфрама","en":"Tungsten carbide (WC)","def":"Основа твёрдых сплавов"},{"ru":"Штабик","en":"Sintered bar / ingot (W, Mo)","def":"Спечённая заготовка для ковки и волочения"},{"ru":"Инжекционное формование металлов","en":"Metal injection molding (MIM)","def":"Литьё смеси порошка и связки под давлением"},{"ru":"Аддитивные технологии","en":"Additive manufacturing (AM)","def":"3D-печать металлами"},{"ru":"Пресс-инструмент (оснастка)","en":"Tooling (dies and punches)","def":"Матрицы и пуансоны для прессования"},{"ru":"Одобрение производства деталей","en":"PPAP (production part approval process)","def":"Процедура автопрома для запуска детали"},{"ru":"Перренат аммония","en":"Ammonium perrhenate (APR)","def":"Соединение рения перед восстановлением"}],"quiz":[{"q":"Что происходит с рением при окислительном обжиге молибденитового концентрата?","options":["Остаётся в огарке, переходит в технический оксид молибдена и затем в ферромолибден","Переходит в шлак вместе с медью и железом","Окисляется до летучего Re₂O₇ и уходит с газами, откуда его улавливают","Сгорает без остатка и теряется безвозвратно"],"answer":2,"explain":"Рений улавливают мокрой газоочисткой и затем извлекают сорбцией или экстракцией."},{"q":"Почему тугоплавкие металлы (W, Mo, Re) обычно перерабатывают методами порошковой металлургии?","options":["Их температуры плавления очень высоки (W ≈ 3 420 °C), плавка и литьё практически неприменимы","Порошковая металлургия дешевле плавки для любых металлов и не требует защитной атмосферы","Так требует ГОСТ на тугоплавкие металлы и твёрдые сплавы","Порошки легче транспортировать и хранить, чем слитки"],"answer":0,"explain":"Прессование и спекание позволяют получить изделие без полного расплавления."},{"q":"Что означает марка твёрдого сплава ВК8?","options":["Сталь с добавкой 8% вольфрама","8-й класс точности по ГОСТ","Карбид вольфрама с 8% кобальта","Средний размер зерна WC — 8 мкм"],"answer":2,"explain":"В — карбид вольфрама, К — кобальт, цифра — процент кобальта."},{"q":"Какую роль играет кобальт при жидкофазном спекании твёрдого сплава?","options":["Окрашивает изделие и защищает его поверхность от окисления","Образует твёрдое покрытие на поверхности готовых пластин","Не участвует в спекании и удаляется при нагреве в вакууме","Плавится и связывает зёрна карбида вольфрама в плотный материал"],"answer":3,"explain":"Кобальтовая связка обеспечивает прочность и вязкость, WC — твёрдость."},{"q":"Как получают ферромолибден?","options":["Электролизом водного раствора молибдата натрия на стальных катодах","Металлотермическим восстановлением оксида молибдена в присутствии железа","Флотацией молибденита с железным порошком в одной машине","Кучным выщелачиванием молибденовой руды с последующим осаждением"],"answer":1,"explain":"Ферромолибден ФМо60 и ФМо70 — продукты TMK по ГОСТ 4759-91; используются для легирования сталей."},{"q":"Что такое «размер частиц по Фишеру» (FSSS)?","options":["Стандартная характеристика среднего размера частиц порошков W, Mo, Re","Сорт порошка, названный в честь изобретателя технологии водородного восстановления","Твёрдость спечённого сплава по шкале Виккерса","Метод спекания порошков под давлением"],"answer":0,"explain":"В спецификации рения TMK — 3,0–7,5 мкм по Фишеру. Технолог порошков управляет этим параметром."},{"q":"Какой стандарт обязателен для поставок деталей порошковой металлургии в автопром?","options":["JORC (кодекс публичной отчётности)","GISTM (стандарт хвостохранилищ)","RMAP (аудит цепочек поставок)","IATF 16949 (+ процедура PPAP)"],"answer":3,"explain":"Для Smart Powder и экспорта автодеталей это обязательная компетенция инженеров по качеству."},{"q":"Что такое η-фаза в твёрдом сплаве?","options":["Хрупкая фаза при недостатке углерода — дефект углеродного баланса","Признак идеального качества и высокой износостойкости сплава","Название марки сплава с повышенным содержанием кобальта","Тип износостойкого покрытия, наносимого методом CVD"],"answer":0,"explain":"Контроль углеродного баланса — классическая задача технолога. Вопрос про η-фазу быстро отличает практика."},{"q":"Какой газ создаёт главный риск взрыва в печах восстановления W, Mo, Re?","options":["Азот","Аргон","Водород","Углекислый газ"],"answer":2,"explain":"Водород — восстановитель и одновременно взрывоопасный газ. Требования безопасности к таким производствам очень высокие."},{"q":"Где эффективнее всего искать технологов твёрдых сплавов мирового уровня?","options":["На медных рудниках и обогатительных фабриках крупных горных компаний","У лидеров твёрдых сплавов: Sandvik Coromant, Kennametal, Ceratizit, IMC, KORLOY","В банках и инвестиционных фондах, финансирующих металлургию","В нефтяных и газовых компаниях, где много инженеров по оборудованию"],"answer":1,"explain":"Это мировые лидеры инструментальных твёрдых сплавов. Корейские TaeguTec и KORLOY особенно интересны с учётом корейских партнёрств TMK."}],"html":"<h2>0. Разминка: вспомнить Дни 8–9<\/h2>\n<ol><li>Что такое экстракция, промывка и реэкстракция?<\/li><li>Почему разделение РЗЭ требует сотен ступеней?<\/li><li>Чем электроэкстракция отличается от электрорафинирования?<\/li><li>Откуда берутся селен и теллур?<\/li><li>Что означает 3N5 и какой продукт TMK имеет такую чистоту?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Экстракция — переход металла в органику; промывка — удаление примесей из органики; реэкстракция — возврат металла в чистый водный раствор.<\/li><li>Соседние РЗЭ почти одинаковы химически, коэффициенты разделения малы, нужны длинные каскады.<\/li><li>EW: нерастворимый анод, металл выделяется из раствора. ER: растворимый анод из чернового металла, очистка.<\/li><li>Из анодного шлама электролитического рафинирования меди.<\/li><li>99,95%; молибденовые штабики TMK.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Пирометаллургия: основные процессы<\/h3>\n<p><strong>Пирометаллургия<\/strong> (pyrometallurgy) — извлечение и рафинирование металлов при высоких температурах.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Процесс<\/th><th>Суть<\/th><th>Примеры, важные для TMK и рынка<\/th><\/tr><\/thead><tbody><tr><td><strong>Сушка<\/strong> (drying)<\/td><td>Удаление влаги<\/td><td>Концентраты перед обжигом<\/td><\/tr><tr><td><strong>Кальцинация / прокалка<\/strong> (calcination)<\/td><td>Термическое разложение<\/td><td><strong>APT → оксиды вольфрама<\/strong> (жёлтый WO₃ или «синий» оксид); <strong>α→β сподумен<\/strong> (≈ 1 050–1 100 °C); оксалаты РЗЭ → оксиды<\/td><\/tr><tr><td><strong>Обжиг<\/strong> (roasting): окислительный, сульфатизирующий, хлорирующий, восстановительный<\/td><td>Химическое превращение твёрдого вещества в газовой среде<\/td><td><strong>Окислительный обжиг молибденита<\/strong> MoS₂ → MoO₃ в многоподовых печах (≈ 600–650 °C) с <strong>возгонкой рения<\/strong>; обжиг цинковых концентратов в кипящем слое<\/td><\/tr><tr><td><strong>Плавка<\/strong> (smelting): восстановительная, на штейн<\/td><td>Расплавление с разделением на металл / штейн и шлак<\/td><td>Медь и никель: взвешенная плавка (flash smelting), плавка в ванне (Isasmelt, Ausmelt / TSL, <strong>печь Ванюкова<\/strong> — российская технология); железо — доменная печь<\/td><\/tr><tr><td><strong>Конвертирование<\/strong> (converting)<\/td><td>Продувка штейна воздухом → черновая медь<\/td><td>Конвертеры Пирса–Смита<\/td><\/tr><tr><td><strong>Огневое рафинирование<\/strong> (fire refining)<\/td><td>Очистка расплава<\/td><td>Медь перед электрорафинированием<\/td><\/tr><tr><td><strong>Металлотермия<\/strong> (metallothermic reduction)<\/td><td>Восстановление оксида более активным металлом (Al, Si, Ca, Mg)<\/td><td><strong>Ферромолибден<\/strong> (силико- и алюминотермия) — продукт TMK; кальциетермическое получение Tb и Dy; процесс Кролла (Ti, Zr — магнием)<\/td><\/tr><tr><td><strong>Восстановление водородом<\/strong> (hydrogen reduction)<\/td><td>Оксид или соль + H₂ → металлический порошок<\/td><td><strong>W, Mo, Re<\/strong> — основа Чирчика (подробно в 1.3)<\/td><\/tr><tr><td><strong>Карботермия / карбидизация<\/strong><\/td><td>Восстановление или науглероживание углеродом<\/td><td><strong>W + C → WC<\/strong> (карбид вольфрама)<\/td><\/tr><tr><td><strong>Возгонка, дистилляция<\/strong> (volatilization)<\/td><td>Перевод летучих соединений в газ<\/td><td>Re₂O₇ при обжиге молибденита; MoO₃ (возгоночный, высокой чистоты)<\/td><\/tr><tr><td><strong>Электродуговые и руднотермические печи<\/strong> (EAF / SAF)<\/td><td>Плавка электричеством<\/td><td>Ферросплавы, переработка шлаков, ильменит → титановый шлак<\/td><\/tr><tr><td><strong>Вакуумная и электронно-лучевая плавка<\/strong><\/td><td>Плавка и рафинирование в вакууме<\/td><td>Тугоплавкие металлы, суперсплавы<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Вспомогательные системы — тоже источник вакансий:<\/strong><\/p>\n<ul><li><strong>Газоочистка<\/strong> (off-gas handling): котлы-утилизаторы, электрофильтры, рукавные фильтры, мокрая очистка (здесь улавливают рений).<\/li><li><strong>Сернокислотное производство<\/strong> (acid plant): SO₂ из обжига и плавки → серная кислота (контактный процесс).<\/li><li><strong>Огнеупоры<\/strong> (refractories): футеровка печей. TMK сама выпускает огнеупорную и футеровочную продукцию.<\/li><li><strong>Шлаки<\/strong> (slags): состав, основность, вязкость; флюсы (кварц, известняк).<\/li><\/ul>\n<p><strong>Безопасность:<\/strong> расплавы (взрыв при контакте с водой), SO₂, CO, водород (взрывоопасен — критично для печей восстановления W, Mo, Re), выпуск расплава из печи.<\/p>\n<h3>1.2 Порошковая металлургия: основы<\/h3>\n<p><strong>Порошковая металлургия<\/strong> (powder metallurgy, PM) — изготовление металлов, сплавов и изделий <strong>из порошков<\/strong> прессованием и спеканием, без полного расплавления. Для <strong>тугоплавких металлов<\/strong> (W плавится при ≈ 3 420 °C, Mo — ≈ 2 620 °C, Re — ≈ 3 190 °C) это часто <strong>единственный практичный путь<\/strong> к изделию.<\/p>\n<p><strong>Технологическая цепочка:<\/strong><\/p>\n<pre class=\"code\"><code>ПОРОШОК (получение) → ХАРАКТЕРИЗАЦИЯ → СМЕШИВАНИЕ (связка, пластификатор, смазка)\n→ ФОРМОВАНИЕ (прессование в пресс-форме, изостатическое прессование, экструзия, инжекционное формование MIM)\n→ СПЕКАНИЕ (ниже температуры плавления основы: твердофазное или жидкофазное; H₂, вакуум, азот-водород)\n→ [ГИП — горячее изостатическое прессование; спекание с газостатом (sinter-HIP)]\n→ ДООБРАБОТКА (калибровка, шлифование, мехобработка, термообработка, покрытия) → КОНТРОЛЬ → ИЗДЕЛИЕ<\/code><\/pre>\n<p><strong>Способы получения порошков:<\/strong><\/p>\n<ul><li><strong>восстановление<\/strong> — W, Mo, Re (водородом), железо (губчатое);<\/li><li><strong>распыление расплава<\/strong> (atomization): водой — стальные порошки для конструкционных деталей; газом — суперсплавы, титан, порошки для 3D-печати;<\/li><li><strong>электролиз<\/strong> — медь;<\/li><li><strong>карбонильный процесс<\/strong> — Fe, Ni;<\/li><li><strong>плазменная сфероидизация<\/strong> — сферические порошки W, Re, Ta для аддитивных технологий.<\/li><\/ul>\n<p><strong>Характеристики порошка<\/strong> (язык технолога PM):<\/p>\n<ul><li>гранулометрический состав (лазерная дифракция, ситовой анализ);<\/li><li><strong>размер частиц по Фишеру (FSSS)<\/strong> — стандарт для порошков W, Mo, Re. В спецификации рения TMK указано <strong>3,0–7,5 мкм по Фишеру<\/strong>;<\/li><li>насыпная плотность и плотность утряски; текучесть (воронка Холла);<\/li><li>содержание кислорода и углерода;<\/li><li>морфология (СЭМ), удельная поверхность (BET).<\/li><\/ul>\n<p><strong>Аддитивные технологии<\/strong> (additive manufacturing, 3D-печать металлом): селективное лазерное сплавление (L-PBF), электронно-лучевое сплавление, струйная печать связующим (binder jetting). Для W и Mo это сложно, но развивается быстро.<\/p>\n<h3>1.3 Цепочки TMK: вольфрам, твёрдые сплавы, молибден, рений<\/h3>\n<p><strong>А) Вольфрам: от APT до штабика и проволоки<\/strong><\/p>\n<pre class=\"code\"><code>APT → ПРОКАЛКА → оксиды вольфрама (WO₃ жёлтый / синий оксид WO₂.₉)\n→ ВОССТАНОВЛЕНИЕ ВОДОРОДОМ (проходные или трубчатые печи, ≈ 600–1 000 °C)\n     → порошок W. Крупность (от долей до десятков мкм по Фишеру) задают температурой, влажностью H₂, высотой слоя\n→ ПРЕССОВАНИЕ → СПЕКАНИЕ (в водороде; классика — высокотемпературная «сварка» штабиков пропусканием тока)\n→ ШТАБИКИ W (у TMK — ≥ 99,8% W) → ковка, волочение → прутки, проволока, электроды\n     (иттрированные прутки СВИ-1 у TMK — W + Y₂O₃: электроды для сварки и плазменной резки)<\/code><\/pre>\n<p><strong>Б) Твёрдые сплавы (cemented carbides) — флагман Чирчика<\/strong><\/p>\n<pre class=\"code\"><code>Порошок W + сажа → КАРБИДИЗАЦИЯ (≈ 1 400–1 600 °C) → порошок WC (карбид вольфрама)\n→ ПРИГОТОВЛЕНИЕ СМЕСИ: WC + кобальт (+ ингибиторы роста зерна VC, Cr₃C₂) + пластификатор (воск или ПЭГ)\n     → размол в шаровых мельницах или аттриторах → распылительная сушка (гранулы)\n→ ПРЕССОВАНИЕ (пластины, коронки, фильеры) → ЖИДКОФАЗНОЕ СПЕКАНИЕ (≈ 1 350–1 500 °C, вакуум или sinter-HIP;\n     кобальт плавится и «склеивает» зёрна WC)\n→ ШЛИФОВКА, заточка, покрытия (CVD, PVD) → изделия: режущие пластины, свёрла, фрезы, горный инструмент, буровые коронки<\/code><\/pre>\n<p><strong>Марки:<\/strong><\/p>\n<ul><li>советские/российские (ГОСТ 3882-74): <strong>ВК6, ВК8<\/strong> — WC + 6 или 8% Co (цифра — процент кобальта); <strong>ТК<\/strong> (например, Т15К6 — WC + 15% TiC + 6% Co) — для обработки сталей; <strong>ТТК<\/strong> — с TaC;<\/li><li>международные: группы применения <strong>ISO 513 — P, M, K, N, S, H<\/strong> (стали, нержавеющие стали, чугуны, цветные металлы, жаропрочные сплавы, закалённые материалы).<\/li><\/ul>\n<p>Кандидат из западной компании будет говорить на языке ISO, кандидат из СНГ — на языке ГОСТ. Ценен тот, кто свободно говорит на обоих.<\/p>\n<p><strong>Ключевые параметры качества твёрдого сплава:<\/strong><\/p>\n<ul><li>размер зерна WC (наномелкозернистые, ультрамелкие, мелкие, средние, крупные);<\/li><li>содержание кобальта, плотность, твёрдость (HV, HRA), прочность на изгиб, коэрцитивная сила и магнитное насыщение (косвенный контроль углеродного баланса);<\/li><li>пористость (по ISO 4505);<\/li><li><strong>углеродный баланс<\/strong> (η-фаза при недостатке углерода, свободный углерод при избытке) — классическая головная боль технолога.<\/li><\/ul>\n<p><strong>В) Молибден: от концентрата до штабика и ферромолибдена<\/strong><\/p>\n<pre class=\"code\"><code>Молибденитовый концентрат MoS₂ (например, от Cu–Mo разделения АГМК)\n→ ОКИСЛИТЕЛЬНЫЙ ОБЖИГ (многоподовая печь, ≈ 600–650 °C): MoS₂ → MoO₃ (технический оксид молибдена)\n     + SO₂ (→ серная кислота) + Re₂O₇ в газах (→ улавливание рения)\n→ путь 1: МЕТАЛЛОТЕРМИЯ → ФЕРРОМОЛИБДЕН (ФМо60, ФМо70 — продукт TMK; для легирования сталей)\n→ путь 2: ХИМИЧЕСКАЯ ОЧИСТКА (аммиачное выщелачивание → молибдаты аммония (ADM, AHM) → прокалка → чистый MoO₃)\n     → ДВУХСТАДИЙНОЕ ВОССТАНОВЛЕНИЕ ВОДОРОДОМ (MoO₃ → MoO₂ → Mo) → порошок Mo\n     → прессование → спекание (≈ 1 800–2 000 °C в водороде) → ШТАБИКИ / БРИКЕТЫ Mo (у TMK 99,8–99,95%)\n     → прокатка, ковка, волочение → листы, прутки, проволока; сплавы TZM, лантанированный Mo<\/code><\/pre>\n<p><strong>Г) Рений: от газов до порошка<\/strong><\/p>\n<pre class=\"code\"><code>Газы обжига молибденита / растворы → мокрая газоочистка → сорбция или экстракция → десорбция\n→ кристаллизация ПЕРРЕНАТА АММОНИЯ (APR, NH₄ReO₄) → восстановление водородом\n→ ПОРОШОК РЕНИЯ (у TMK: 99,9%, частицы 3,0–7,5 мкм по Фишеру)\n→ (далее у потребителей) прессование и спекание: штабики, гранулы → легирование суперсплавов; катализаторы<\/code><\/pre>\n<h3>1.4 Smart Powder и конструкционная порошковая металлургия<\/h3>\n<p>Smart Powder — направление TMK по прецизионным металлическим изделиям методом порошковой металлургии с корейскими технологическими партнёрами. План экспорта — Корея, США, Малайзия, Мексика; первый транш 2026 г. включает <strong>автодетали методом порошковой металлургии<\/strong>. Это <strong>конструкционная порошковая металлургия<\/strong> (press-and-sinter): массовые детали из железных и стальных порошков.<\/p>\n<ul><li><strong>Типовые изделия:<\/strong> шестерни, звёздочки, детали масляных насосов, втулки и самосмазывающиеся подшипники, детали систем газораспределения (VVT), магнитомягкие детали.<\/li><li><strong>Ключевые технологии:<\/strong> прессы (механические, гидравлические, с ЧПУ), <strong>пресс-инструмент<\/strong> (матрицы и пуансоны; проектирование оснастки — отдельная редкая профессия), проходные печи спекания с защитной атмосферой, калибровка, термообработка, паровое оксидирование, мехобработка, контроль размеров (КИМ).<\/li><li><strong>Стандарты:<\/strong> <strong>IATF 16949<\/strong> (качество в автопроме), <strong>PPAP / APQP<\/strong> (одобрение производства деталей), MPIF Standard 35 (материалы PM).<\/li><li><strong>Ассоциации и выставки:<\/strong> MPIF (США), EPMA (Европа); конференции PowderMet, World PM Congress, Euro PM; для тугоплавких металлов и твёрдых сплавов — <strong>Plansee Seminar<\/strong> (Ройтте, Австрия) и мероприятия ITIA. Списки докладчиков этих конференций — готовые лонг-листы экспертов.<\/li><\/ul>\n<h3>1.5 Итог модуля 2 на одной странице<\/h3>\n<pre class=\"code\"><code>РУДОПОДГОТОВКА: дробление → измельчение (P80) → классификация; раскрытие; энергия\nОБОГАЩЕНИЕ: гравитация (плотность) / флотация (поверхность, реагенты) / магнитная (восприимчивость) / сортировка\n     → концентрат; формула извлечения; компромисс «качество — извлечение»\nГИДРОМЕТАЛЛУРГИЯ: выщелачивание → очистка (осаждение, ионный обмен, экстракция) → продукт (кристаллизация, электролиз)\nЭКСТРАКЦИЯ / ЭЛЕКТРОЛИЗ / РАФИНИРОВАНИЕ: каскады (РЗЭ), EW / ER, шламы → Se, Te; чистота 3N–6N; GDMS\nПИРОМЕТАЛЛУРГИЯ: обжиг (MoS₂ → MoO₃ + Re), прокалка (APT → WO₃), металлотермия (FeMo), восстановление H₂ (W, Mo, Re)\nПОРОШКОВАЯ МЕТАЛЛУРГИЯ: порошок → прессование → спекание → изделие; твёрдые сплавы ВК; Smart Powder<\/code><\/pre>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Пирометаллургия<\/td><td>Pyrometallurgy<\/td><td>Металлургия высоких температур<\/td><\/tr><tr><td>Прокалка<\/td><td>Calcination<\/td><td>Термическое разложение соединения<\/td><\/tr><tr><td>Обжиг<\/td><td>Roasting<\/td><td>Химическое превращение твёрдого вещества в газовой среде при нагреве<\/td><\/tr><tr><td>Многоподовая печь<\/td><td>Multiple hearth furnace (MHF)<\/td><td>Печь для обжига молибденита<\/td><\/tr><tr><td>Плавка<\/td><td>Smelting<\/td><td>Расплавление с разделением фаз<\/td><\/tr><tr><td>Штейн<\/td><td>Matte<\/td><td>Сульфидный расплав Cu, Ni, Fe<\/td><\/tr><tr><td>Шлак<\/td><td>Slag<\/td><td>Оксидный расплав пустой породы и флюсов<\/td><\/tr><tr><td>Флюс<\/td><td>Flux<\/td><td>Добавка для формирования шлака<\/td><\/tr><tr><td>Конвертирование<\/td><td>Converting<\/td><td>Продувка штейна воздухом<\/td><\/tr><tr><td>Металлотермия<\/td><td>Metallothermic reduction<\/td><td>Восстановление оксида активным металлом<\/td><\/tr><tr><td>Ферромолибден<\/td><td>Ferromolybdenum (FeMo)<\/td><td>Сплав Fe–Mo для легирования сталей<\/td><\/tr><tr><td>Восстановление водородом<\/td><td>Hydrogen reduction<\/td><td>Получение металлических порошков из оксидов и солей<\/td><\/tr><tr><td>Карбидизация<\/td><td>Carburization<\/td><td>Получение карбида (W + C → WC)<\/td><\/tr><tr><td>Газоочистка<\/td><td>Off-gas cleaning / gas handling<\/td><td>Улавливание пыли, SO₂ и ценных компонентов из газов<\/td><\/tr><tr><td>Огнеупоры<\/td><td>Refractories<\/td><td>Материалы футеровки печей<\/td><\/tr><tr><td>Порошковая металлургия<\/td><td>Powder metallurgy (PM)<\/td><td>Изделия из порошков прессованием и спеканием<\/td><\/tr><tr><td>Распыление расплава<\/td><td>Atomization<\/td><td>Получение порошка распылением жидкого металла<\/td><\/tr><tr><td>Размер частиц по Фишеру<\/td><td>Fisher sub-sieve size (FSSS)<\/td><td>Стандартная характеристика порошков W, Mo, Re<\/td><\/tr><tr><td>Насыпная плотность<\/td><td>Apparent density<\/td><td>Плотность свободно насыпанного порошка<\/td><\/tr><tr><td>Прессование<\/td><td>Compaction / pressing<\/td><td>Формование порошка в пресс-форме<\/td><\/tr><tr><td>Изостатическое прессование<\/td><td>Isostatic pressing (CIP / HIP)<\/td><td>Прессование равномерным давлением (холодное / горячее)<\/td><\/tr><tr><td>Спекание<\/td><td>Sintering<\/td><td>Нагрев прессовки ниже температуры плавления для упрочнения<\/td><\/tr><tr><td>Жидкофазное спекание<\/td><td>Liquid phase sintering<\/td><td>Спекание с расплавлением связки (Co в твёрдом сплаве)<\/td><\/tr><tr><td>Твёрдый сплав<\/td><td>Cemented carbide / hardmetal<\/td><td>Композит WC + Co<\/td><\/tr><tr><td>Карбид вольфрама<\/td><td>Tungsten carbide (WC)<\/td><td>Основа твёрдых сплавов<\/td><\/tr><tr><td>Штабик<\/td><td>Sintered bar / ingot (W, Mo)<\/td><td>Спечённая заготовка для ковки и волочения<\/td><\/tr><tr><td>Инжекционное формование металлов<\/td><td>Metal injection molding (MIM)<\/td><td>Литьё смеси порошка и связки под давлением<\/td><\/tr><tr><td>Аддитивные технологии<\/td><td>Additive manufacturing (AM)<\/td><td>3D-печать металлами<\/td><\/tr><tr><td>Пресс-инструмент (оснастка)<\/td><td>Tooling (dies and punches)<\/td><td>Матрицы и пуансоны для прессования<\/td><\/tr><tr><td>Одобрение производства деталей<\/td><td>PPAP (production part approval process)<\/td><td>Процедура автопрома для запуска детали<\/td><\/tr><tr><td>Перренат аммония<\/td><td>Ammonium perrhenate (APR)<\/td><td>Соединение рения перед восстановлением<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли Чирчика и Smart Powder<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Технолог восстановления порошков W, Mo, Re<\/td><td>Powder Production Engineer (Hydrogen Reduction)<\/td><td>Тип печей, управление крупностью (FSSS), кислород в порошке<\/td><td>★★★<\/td><\/tr><tr><td>Технолог твёрдых сплавов<\/td><td>Hardmetal / Cemented Carbide Process Engineer<\/td><td>Марки (ВК и ТК / ISO), размер зерна, углеродный баланс, sinter-HIP, брак<\/td><td>★★★<\/td><\/tr><tr><td>Технолог обжига молибденита<\/td><td>Roasting Engineer (MHF)<\/td><td>Производительность печей, остаточная сера, извлечение рения в газоочистке<\/td><td>★★★<\/td><\/tr><tr><td>Технолог металлотермии<\/td><td>Ferroalloy / Metallothermic Process Engineer<\/td><td>Плавки FeMo, извлечение Mo, шлаки<\/td><td>★★<\/td><\/tr><tr><td>Инженер по печам и огнеупорам<\/td><td>Furnace / Refractory Engineer<\/td><td>Тип печей, кампании футеровки, ремонты<\/td><td>★★<\/td><\/tr><tr><td>Технолог порошковой металлургии (конструкционные детали)<\/td><td>PM Process Engineer (Press &amp; Sinter)<\/td><td>Номенклатура деталей, плотность, допуски, процент брака<\/td><td>★★<\/td><\/tr><tr><td>Конструктор пресс-инструмента<\/td><td>Tooling Design Engineer (PM)<\/td><td>Проектирование матриц и пуансонов, CAD/CAE<\/td><td>★★★<\/td><\/tr><tr><td>Инженер по качеству (автопром)<\/td><td>Quality Engineer (IATF 16949, PPAP)<\/td><td>Запуск деталей для автопроизводителей, аудиты<\/td><td>★★<\/td><\/tr><tr><td>Металловед / инженер-исследователь<\/td><td>Materials Scientist / Metallographer<\/td><td>Металлография, СЭМ, механические испытания<\/td><td>★★<\/td><\/tr><tr><td>Начальник производства твёрдых сплавов / PM<\/td><td>Production Manager (Hardmetal / PM)<\/td><td>Объёмы, численность, OEE, внедрения<\/td><td>★★–★★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>(Твёрдые сплавы) «Как вы контролировали углеродный баланс и что делали при η-фазе?»<\/td><td>Магнитное насыщение, коэрцитивная сила, корректировка смесей, атмосфера печи<\/td><td>Не знает термина<\/td><\/tr><tr><td>«Какое спекание: вакуум или sinter-HIP? Какой процент брака и основные причины?»<\/td><td>Цифры, причины (пористость, трещины, коробление), решения<\/td><td>«Брака почти не было»<\/td><\/tr><tr><td>(Порошки W) «Как вы управляли крупностью порошка по Фишеру?»<\/td><td>Температура, влажность водорода, высота слоя, скорость подачи<\/td><td>Не знает FSSS<\/td><\/tr><tr><td>(Mo) «Какая остаточная сера в обожжённом оксиде? Какое извлечение рения в газоочистке?»<\/td><td>Конкретные цифры, режимы печи<\/td><td>Не связывает обжиг и рений<\/td><\/tr><tr><td>(PM-автопром) «Какие детали вы запускали? Какие этапы PPAP?»<\/td><td>Номенклатура, клиенты, этапы, сроки<\/td><td>Не знает PPAP<\/td><\/tr><tr><td>«Какой ваш самый сложный технологический провал и что вы изменили?»<\/td><td>Честный разбор с цифрами<\/td><td>«Провалов не было»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Доноры<\/th><\/tr><\/thead><tbody><tr><td>Твёрдые сплавы и порошки W<\/td><td><strong>Sandvik Coromant<\/strong>, <strong>Kennametal<\/strong>, <strong>Ceratizit<\/strong> и <strong>Plansee<\/strong>, <strong>IMC Group<\/strong> (Iscar, TaeguTec — Корея), Mitsubishi Materials, Sumitomo Electric (A.L.M.T.), <strong>KORLOY<\/strong> (Корея), <strong>H.C. Starck Tungsten<\/strong> (Mitsubishi Materials), <strong>Global Tungsten &amp; Powders<\/strong>, Wolfram Bergbau und Hütten, Xiamen Tungsten / ZCC (Китай); предприятия СНГ (Кировградский завод твёрдых сплавов, «Победит», МКТС и др. — с обязательной проверкой санкционных ограничений)<\/td><\/tr><tr><td>Молибден (обжиг, FeMo, металл)<\/td><td><strong>Molymet<\/strong>, Freeport-McMoRan (Climax Molybdenum), Plansee, Thompson Creek / Centerra (Langeloth), АГМК, производители ферросплавов Казахстана<\/td><\/tr><tr><td>Рений<\/td><td>Molymet, KGHM, Rhenium Alloys (США), производители суперсплавов (Cannon-Muskegon, PCC и др.)<\/td><\/tr><tr><td>Конструкционная PM (автопром)<\/td><td>GKN Powder Metallurgy, Miba, Sumitomo Electric Sintered Alloy, Höganäs (порошки), корейские и индийские производители PM-деталей, производители в Турции и Мексике<\/td><\/tr><tr><td>Наука и обучение<\/td><td>TU Bergakademie Freiberg, МИСИС (оба — партнёры TMK), Montanuniversität Leoben (Австрия), KIGAM и KIMS (Корея), Tohoku University (Япония), ТашГТУ<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Кейс-финал модуля 2: три цепочки TMK<\/h2>\n<p><strong>Задание (40 мин).<\/strong> Для каждой цепочки — <strong>вольфрам (до пластины ВК8), молибден (до штабика и FeMo), рений (до порошка)<\/strong> — заполните таблицу:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Передел<\/th><th>Процесс и ключевые условия<\/th><th>Продукт на выходе<\/th><th>Ключевая роль (RU / EN)<\/th><th>Дефицит (★–★★★)<\/th><th>3 компании-донора<\/th><th>1 вопрос для скрининга<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p><strong>Критерии качества:<\/strong><\/p>\n<ul><li>цепочка полная и в правильном порядке;<\/li><li>у каждой роли — две версии названия (RU / EN);<\/li><li>доноры соответствуют переделу, а не просто «металлу»;<\/li><li>вопросы проверяют реальный опыт (цифры, термины, причинность).<\/li><\/ul>\n<p><strong>Teach-back.<\/strong> Объясните одну цепочку технологу Чирчика за 10 минут и попросите оценить точность по шкале 1–10. Запишите его поправки — это золото.<\/p>\n<hr>\n<h2>6. Рефлексия: итог модуля 2 и трети программы<\/h2>\n<ol><li>Пройдите <strong>входной тест из Дня 1<\/strong> ещё раз. Сравните с первым результатом и с результатом после Дня 5.<\/li><li>Какое знание из Модуля 2 вы <strong>уже применили<\/strong> в реальной работе? Если никакое — примените на этой неделе на одной вакансии Чирчика.<\/li><li><strong>Teach-back<\/strong> выполнен? Какую оценку поставил технолог? Что исправил?<\/li><li><strong>Обязательство:<\/strong> «Модуль 3 начинаю ___ (дата) в ___:___».<\/li><\/ol>\n<blockquote><p><strong>Правило модуля:<\/strong> 10 дней из 30. Вы прошли путь от «что такое руда» до «как контролировать углеродный баланс твёрдого сплава». Большинство рекрутеров отрасли не проходят его никогда. Дальше будет интереснее и ближе к ежедневной работе: РЗЭ и критические минералы, затем лаборатории и оборудование, затем сам технический подбор. Не останавливайтесь сейчас: инерция — ваш главный союзник.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>R. German, <em>Powder Metallurgy Science<\/em> (MPIF) — классический учебник порошковой металлургии.<\/li><li>E. Lassner, W.-D. Schubert, <em>Tungsten<\/em> (Springer) — главы о порошках, карбидах и твёрдых сплавах.<\/li><li>Зеликман А. Н. «Металлургия тугоплавких редких металлов» — классика советской школы.<\/li><li>ITIA и IMOA — публикации о переработке W и Mo; MPIF и EPMA — образовательные материалы по порошковой металлургии.<\/li><li>Сборники Plansee Seminar — доклады по тугоплавким металлам и твёрдым сплавам (и имена экспертов).<\/li><li>Видео: «how tungsten carbide inserts are made», «powder metallurgy process animation», «molybdenum production process».<\/li><\/ul>"},{"n":11,"module":3,"title":"Редкоземельные элементы: химия, применение, рынок и цепочка поставок","file":"module-03-ree-critical-minerals/day-11-ree-fundamentals-market.md","duration":"3,5 часа","challenge":"Нарисовать <strong>цепочку РЗЭ «рудник → магнит»<\/strong> с указанием, кто контролирует каждое звено (Китай и не-Китай), и отметить на ней три звена, где TMK может конкурировать за людей.","why":"РЗЭ — самый политизированный сегмент критических минералов. Специалистов по разделению и магнитам вне Китая единицы, и за них одновременно борются США, ЕС, Япония, Корея и Австралия. Рекрутер, который не различает «NdPr-оксид» и «смешанный карбонат РЗЭ», будет искать не тех людей и не там. Сегодня вы получаете карту этого рынка.","checklist":[{"text":"Разминка: 5 вопросов по Модулю 2 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (35 мин)","minutes":35},{"text":"Практика: цепочка РЗЭ «рудник → магнит» + карта доноров (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.3, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Редкоземельные элементы (РЗЭ)","en":"Rare earth elements (REE)","def":"15 лантаноидов + иттрий и скандий"},{"ru":"Лантаноиды","en":"Lanthanides","def":"Элементы от La (57) до Lu (71)"},{"ru":"Лёгкие РЗЭ","en":"Light rare earths (LREE)","def":"La, Ce, Pr, Nd, Sm"},{"ru":"Тяжёлые РЗЭ","en":"Heavy rare earths (HREE)","def":"Tb, Dy, Ho, Er, Tm, Yb, Lu (и Y)"},{"ru":"Магнитные РЗЭ","en":"Magnet rare earths","def":"Nd, Pr, Dy, Tb — основа рынка по стоимости"},{"ru":"Оксид неодима-празеодима","en":"NdPr oxide (didymium oxide)","def":"Главный товарный продукт для магнитов"},{"ru":"Сумма оксидов РЗЭ","en":"TREO (total rare earth oxides)","def":"Единица содержания и состава"},{"ru":"Корзина РЗЭ","en":"REE basket / distribution","def":"Относительный состав элементов в сырье"},{"ru":"Смешанный карбонат РЗЭ","en":"Mixed rare earth carbonate (MREC)","def":"Промежуточный продукт до разделения"},{"ru":"Разделение РЗЭ","en":"REE separation","def":"Получение индивидуальных оксидов"},{"ru":"Постоянный магнит","en":"Permanent magnet","def":"Магнит, сохраняющий намагниченность"},{"ru":"Магнит NdFeB","en":"NdFeB magnet (neodymium magnet)","def":"Самый сильный тип постоянных магнитов"},{"ru":"Магнит SmCo","en":"Samarium-cobalt magnet","def":"Магнит для высоких температур"},{"ru":"Мишметалл","en":"Mischmetal","def":"Сплав лёгких РЗЭ (Ce, La) для металлургии"},{"ru":"Бастнезит","en":"Bastnäsite","def":"Главный минерал лёгких РЗЭ"},{"ru":"Монацит","en":"Monazite","def":"Фосфат РЗЭ с торием"},{"ru":"Ионно-адсорбционные глины",
