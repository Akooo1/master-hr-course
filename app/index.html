фазовый анализ по дифрактограмме"},{"ru":"Сканирующая электронная микроскопия","en":"Scanning electron microscopy (SEM)","def":"Изображение микроструктуры"},{"ru":"Энергодисперсионная спектроскопия","en":"Energy-dispersive spectroscopy (EDS)","def":"Локальный состав в SEM"},{"ru":"Электронно-зондовый микроанализ","en":"Electron probe microanalysis (EPMA)","def":"Точный локальный количественный анализ"},{"ru":"Автоматизированная минералогия","en":"Automated mineralogy (QEMSCAN, MLA, TIMA)","def":"Автоматический анализ минералов и раскрытия"},{"ru":"Металлография","en":"Metallography","def":"Исследование структуры на шлифах"},{"ru":"Лазерная дифракция","en":"Laser diffraction","def":"Гранулометрия порошков и пульп"},{"ru":"Удельная поверхность","en":"Specific surface area (BET)","def":"Площадь поверхности порошка на грамм"},{"ru":"Термогравиметрия","en":"Thermogravimetric analysis (TGA)","def":"Изменение массы при нагреве"},{"ru":"Предел обнаружения","en":"Detection limit","def":"Наименьшее определяемое содержание"},{"ru":"Матричный эффект","en":"Matrix effect","def":"Влияние основного компонента на результат"},{"ru":"Арбитражный анализ","en":"Umpire / referee analysis","def":"Анализ третьей лабораторией при споре"},{"ru":"Сертификат анализа","en":"Certificate of analysis (CoA)","def":"Документ о составе партии продукции"},{"ru":"Время выполнения анализа","en":"Turnaround time (TAT)","def":"Срок от поступления пробы до результата"}],"quiz":[{"q":"Каким методом обычно определяют следовые количества РЗЭ в растворе?","options":["Рентгеновской дифракцией порошка с методом Ритвельда","Масс-спектрометрией с индуктивно связанной плазмой (ICP-MS)","Металлографией шлифов под оптическим микроскопом","Пробирным анализом со свинцовым коллектором и купелированием"],"answer":1,"explain":"ICP-MS определяет РЗЭ на уровнях от ppm до ppt."},{"q":"Какой метод используют для сертификации высокочистого металла 5N–6N по десяткам примесей?","options":["Ситовой анализ по стандартному набору сит","Атомно-абсорбционный анализ одного элемента","Портативный рентгенофлуоресцентный анализатор","Масс-спектрометрию тлеющего разряда (GDMS)"],"answer":3,"explain":"GDMS анализирует твёрдый образец на десятки примесей до уровня ppb."},{"q":"Что покажет рентгеновская дифракция (XRD)?","options":["Какие кристаллические фазы присутствуют и в каком количестве","Содержание углерода и серы в твёрдом сплаве и порошках","Средний размер частиц порошка по Фишеру и их удельную поверхность","Следовые примеси на уровне ppt в растворах гидрометаллургии"],"answer":0,"explain":"Например, η-фазу в твёрдом сплаве или минералы в руде."},{"q":"Зачем нужна автоматизированная минералогия (QEMSCAN, MLA, TIMA)?","options":["Для сертификации чистоты катодной меди и высокочистых металлов","Для измерения магнитных свойств готовых магнитов и сплавов","Для анализа минерального состава, раскрытия и причин потерь металла","Для определения кислорода и азота в порошках рения и вольфрама"],"answer":2,"explain":"Это основной инструмент технологической минералогии и геометаллургии."},{"q":"Почему для проб на вольфрам нельзя использовать истирающие чаши из карбида вольфрама?","options":["Карбид вольфрама слишком мягкий для истирания руды","Чаши вносят вольфрам в пробу и завышают результат","Такие чаши запрещены стандартом JORC","Чаши из карбида вольфрама слишком дороги"],"answer":1,"explain":"Загрязнение при пробоподготовке — частая скрытая ошибка."},{"q":"Каким прибором определяют углерод в карбиде вольфрама и твёрдом сплаве?","options":["Сканирующим электронным микроскопом с EDS","Лазерным дифракционным анализатором крупности частиц в водной суспензии","Ситовым анализатором с вибропитателем","Газовым анализатором углерода и серы (сжигание пробы)"],"answer":3,"explain":"Также косвенно — по коэрцитивной силе и магнитному насыщению сплава."},{"q":"Почему упорные минералы (шеелит, монацит, колумбит) анализируют после сплавления?","options":["Кислотное разложение растворяет их не полностью, и результат будет занижен","Сплавление позволяет обойтись без прибора и анализировать визуально","Сплавление нужно только для экономии дорогих кислот высокой чистоты","Так требует таможенное законодательство при экспорте концентратов"],"answer":0,"explain":"Это вопрос, который быстро выявляет опыт аналитика горной лаборатории."},{"q":"Что такое TAT в работе лаборатории?","options":["Тип атомного спектрометра с плазменным источником","Таблица аналитических терминов лаборатории","Время от поступления пробы до выдачи результата","Стандарт аккредитации испытательных лабораторий"],"answer":2,"explain":"Turnaround time — ключевой KPI лаборатории: фабрика без быстрых анализов управляется вслепую."},{"q":"Аналитик на вопрос про матричные эффекты отвечает: «Не знаю такого термина». Вывод:","options":["Это нормально: опытные аналитики ICP этим термином не пользуются","Тревожный сигнал: опыт работы с ICP, вероятно, поверхностный","Это говорит о высокой квалификации: термин устарел и не нужен","Термин используют только в геологии, а не в аналитической химии"],"answer":1,"explain":"Борьба с матричными эффектами и интерференциями — ежедневная работа аналитика ICP."},{"q":"Где искать аналитиков горной отрасли в первую очередь?","options":["В банковских и страховых компаниях, которые финансируют и страхуют горные и металлургические проекты","В строительных компаниях и девелоперах промышленных объектов","В рекламных и маркетинговых агентствах, работающих с отраслью","В коммерческих лабораториях (SGS, ALS, Bureau Veritas, Intertek) и лабораториях горных компаний"],"answer":3,"explain":"Плюс производители высокочистых материалов и аппликационные специалисты производителей приборов."}],"html":"<h2>0. Разминка: вспомнить День 16<\/h2>\n<ol><li>В какой печи восстанавливают оксид вольфрама?<\/li><li>Что такое FAT и SAT?<\/li><li>Какие риски у сервисного инженера производителя на роли владельца?<\/li><li>Почему водородная станция критична для Чирчика?<\/li><li>Назовите двух производителей вакуумных печей и одного — прессов порошковой металлургии.<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>В толкательной печи в токе водорода.<\/li><li>Приёмочные испытания на заводе-изготовителе и на площадке после монтажа.<\/li><li>Позиция поставщика; нет ответственности за KPI завода; может знать только своего производителя.<\/li><li>Водород — восстановитель в печах получения порошков W, Mo, Re; плюс жёсткие требования безопасности.<\/li><li>Например, ALD Vacuum Technologies, PVA TePla, Seco/Warwick; прессы — Dorst, Osterwalder.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Логика лаборатории: пять вопросов, на которые она отвечает<\/h3>\n<ol><li><strong>Сколько?<\/strong> — элементный состав: содержание металла и примесей.<\/li><li><strong>В какой форме?<\/strong> — фазовый и минеральный состав: какие минералы и соединения.<\/li><li><strong>Как распределено?<\/strong> — микроструктура, раскрытие, размер зёрен, морфология частиц.<\/li><li><strong>Какие свойства?<\/strong> — крупность порошка, плотность, твёрдость, магнитные свойства.<\/li><li><strong>Можно ли доверять результату?<\/strong> — контроль качества, неопределённость, аккредитация (День 18).<\/li><\/ol>\n<h3>1.2 Пробоподготовка: где рождаются половина ошибок<\/h3>\n<pre class=\"code\"><code>Отбор пробы → сушка → дробление → сокращение (делители) → истирание (до ~75 мкм) → навеска → разложение или прессование<\/code><\/pre>\n<ul><li><strong>Представительность:<\/strong> проба должна отражать партию; ошибки отбора и сокращения не исправит никакой прибор.<\/li><li><strong>Загрязнение:<\/strong> истирающие чаши из стали, карбида вольфрама или агата вносят Fe, W, Co, Si. В лаборатории, где определяют вольфрам, чаши из карбида вольфрама недопустимы для этих проб.<\/li><li><strong>Разложение:<\/strong> кислотное (смеси кислот), <strong>сплавление<\/strong> (с боратом лития или перекисью натрия) — для упорных минералов (W, Sn, Ta, Nb, РЗЭ, Zr).<\/li><\/ul>\n<h3>1.3 Методы элементного анализа<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Метод<\/th><th>Что даёт<\/th><th>Диапазон<\/th><th>Типичное применение в TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>Рентгенофлуоресцентный анализ (XRF)<\/strong>: волнодисперсионный (WDXRF), энергодисперсионный (EDXRF), портативный (pXRF)<\/td><td>Многоэлементный анализ твёрдых проб, быстро<\/td><td>От долей % до десятков ppm<\/td><td>WO₃ в рудах и концентратах, состав шихты, контроль на фабрике, экспресс-анализ в поле<\/td><\/tr><tr><td><strong>ICP-OES<\/strong> (атомно-эмиссионная спектрометрия с индуктивно связанной плазмой)<\/td><td>Многоэлементный анализ растворов<\/td><td>% … ppm<\/td><td>Растворы гидрометаллургии, примеси в продуктах<\/td><\/tr><tr><td><strong>ICP-MS<\/strong> (масс-спектрометрия с индуктивно связанной плазмой)<\/td><td>Следы элементов, изотопы<\/td><td>ppm … ppt<\/td><td><strong>РЗЭ<\/strong>, рений, примеси в высокочистых продуктах<\/td><\/tr><tr><td><strong>Лазерная абляция + ICP-MS<\/strong> (LA-ICP-MS)<\/td><td>Локальный анализ твёрдого образца<\/td><td>Следы в микрообъёмах<\/td><td>Распределение элементов в минералах<\/td><\/tr><tr><td><strong>Атомно-абсорбционная спектрометрия (AAS)<\/strong><\/td><td>Отдельные элементы в растворах<\/td><td>% … ppm<\/td><td>Классика заводских лабораторий СНГ<\/td><\/tr><tr><td><strong>Пробирный анализ<\/strong> (fire assay)<\/td><td>Золото, серебро, платиноиды<\/td><td>г/т<\/td><td>Попутные благородные металлы, шламы<\/td><\/tr><tr><td><strong>Газовый анализ<\/strong> (анализаторы LECO, Eltra и др.)<\/td><td>C, S, O, N, H<\/td><td>% … ppm<\/td><td><strong>Углерод в WC и твёрдых сплавах<\/strong>, кислород в порошках W, Mo, Re, сера в обожжённом молибдените, графитовый углерод<\/td><\/tr><tr><td><strong>Масс-спектрометрия тлеющего разряда (GDMS)<\/strong><\/td><td>Десятки примесей в твёрдом металле<\/td><td>ppm … ppb<\/td><td><strong>Сертификация 5N–6N<\/strong>: Se, Te, Re, мишени для напыления<\/td><\/tr><tr><td><strong>Титриметрия, гравиметрия<\/strong> («мокрая химия»)<\/td><td>Основной компонент с высокой точностью<\/td><td>Высокие содержания<\/td><td>Арбитражный анализ, WO₃ в концентратах, основной компонент продукта<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.4 Фазовый, минералогический и структурный анализ<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Метод<\/th><th>Что даёт<\/th><th>Применение<\/th><\/tr><\/thead><tbody><tr><td><strong>Рентгеновская дифракция (XRD)<\/strong>, метод Ритвельда<\/td><td>Какие кристаллические фазы и сколько<\/td><td>Минералы руды, фазы в продуктах (η-фаза в твёрдом сплаве, оксиды вольфрама)<\/td><\/tr><tr><td><strong>Сканирующая электронная микроскопия (SEM) + EDS<\/strong><\/td><td>Изображение микроструктуры и локальный состав<\/td><td>Морфология порошков, дефекты, включения<\/td><\/tr><tr><td><strong>Электронно-зондовый микроанализ (EPMA)<\/strong><\/td><td>Точный количественный локальный анализ<\/td><td>Состав минералов, распределение примесей<\/td><\/tr><tr><td><strong>Автоматизированная минералогия<\/strong>: QEMSCAN, MLA, TIMA, Mineralogic<\/td><td>Минеральный состав, раскрытие, ассоциации — тысячи частиц автоматически<\/td><td>Технологическая минералогия, причины потерь на фабрике, геометаллургия<\/td><\/tr><tr><td><strong>Просвечивающая электронная микроскопия (TEM)<\/strong><\/td><td>Наноструктура<\/td><td>Исследования, наноматериалы<\/td><\/tr><tr><td><strong>Металлография<\/strong> (оптическая микроскопия шлифов)<\/td><td>Структура, пористость, размер зерна<\/td><td>Твёрдые сплавы, порошковые изделия<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.5 Анализ частиц и свойств<\/h3>\n<ul><li><strong>Гранулометрия:<\/strong> лазерная дифракция (Malvern Mastersizer и аналоги), ситовой анализ, <strong>средний размер по Фишеру (FSSS)<\/strong> — стандарт для порошков W, Mo, Re.<\/li><li><strong>Удельная поверхность (BET)<\/strong> — газовая адсорбция (Micromeritics и др.).<\/li><li><strong>Насыпная плотность, плотность утряски, текучесть<\/strong> (воронка Холла).<\/li><li><strong>Термический анализ<\/strong> (ТГА, ДСК) — поведение при нагреве, восстановление, окисление.<\/li><li><strong>Механические и физические свойства:<\/strong> твёрдость (HV, HRA), прочность на изгиб, плотность, <strong>коэрцитивная сила и магнитное насыщение<\/strong> (косвенный контроль углерода в твёрдых сплавах), магнитные измерения для магнитов.<\/li><\/ul>\n<h3>1.6 Производители приборов и место лаборатории в TMK<\/h3>\n<p><strong>Производители:<\/strong> Thermo Fisher Scientific, Agilent, PerkinElmer, Shimadzu, Bruker, Malvern Panalytical, Rigaku, Spectro (AMETEK), Horiba, LECO, Eltra, Hitachi High-Tech, JEOL, Zeiss, Tescan, Oxford Instruments, Micromeritics, Anton Paar. <strong>Автоматизированная минералогия:<\/strong> QEMSCAN (Thermo Fisher), MLA, TIMA (Tescan), Mineralogic (Zeiss).<\/p>\n<p><strong>Сервисные лаборатории<\/strong> (испытания на коммерческой основе): <strong>SGS<\/strong> (партнёр TMK по нано-лаборатории), ALS, Bureau Veritas, Intertek, MSALABS; технологические испытания — SGS Lakefield, ALS Metallurgy, Mintek, ANSTO.<\/p>\n<p><strong>TMK [по публичным данным]:<\/strong> Центральная нано-аналитическая лаборатория R&amp;D Park — фазовый состав, кристаллическая структура, свойства на наноуровне, цифровая LIMS; по плану — до 1 000 проб в сутки, замещение импорта аналитических услуг и экспорт услуг. Химико-аналитическая лаборатория на Ингичкинской фабрике. <strong>Вывод:<\/strong> понадобятся руководитель лаборатории, аналитики по методам (XRF, ICP-OES/MS, газовый анализ, XRD, SEM, автоматизированная минералогия, GDMS), специалисты пробоподготовки, администратор LIMS, менеджер по качеству (ISO/IEC 17025).<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Пробоподготовка<\/td><td>Sample preparation<\/td><td>Сушка, дробление, сокращение, истирание пробы<\/td><\/tr><tr><td>Представительность пробы<\/td><td>Sample representativeness<\/td><td>Соответствие пробы партии<\/td><\/tr><tr><td>Сокращение пробы<\/td><td>Sample splitting / reduction<\/td><td>Уменьшение массы пробы без потери представительности<\/td><\/tr><tr><td>Истирание<\/td><td>Pulverizing<\/td><td>Измельчение пробы до аналитической крупности<\/td><\/tr><tr><td>Кислотное разложение<\/td><td>Acid digestion<\/td><td>Растворение пробы смесью кислот<\/td><\/tr><tr><td>Сплавление<\/td><td>Fusion<\/td><td>Разложение упорных проб плавнем<\/td><\/tr><tr><td>Рентгенофлуоресцентный анализ<\/td><td>X-ray fluorescence (XRF)<\/td><td>Быстрый многоэлементный анализ твёрдых проб<\/td><\/tr><tr><td>Портативный XRF<\/td><td>Portable XRF (pXRF)<\/td><td>Ручной анализатор для поля и склада<\/td><\/tr><tr><td>Атомно-эмиссионная спектрометрия с ИСП<\/td><td>ICP-OES<\/td><td>Многоэлементный анализ растворов<\/td><\/tr><tr><td>Масс-спектрометрия с ИСП<\/td><td>ICP-MS<\/td><td>Анализ следов и РЗЭ<\/td><\/tr><tr><td>Лазерная абляция<\/td><td>Laser ablation (LA-ICP-MS)<\/td><td>Локальный анализ твёрдого образца<\/td><\/tr><tr><td>Атомно-абсорбционная спектрометрия<\/td><td>Atomic absorption spectrometry (AAS)<\/td><td>Анализ отдельных элементов в растворах<\/td><\/tr><tr><td>Пробирный анализ<\/td><td>Fire assay<\/td><td>Анализ на Au, Ag, платиноиды<\/td><\/tr><tr><td>Газовый анализатор<\/td><td>Combustion / inert gas fusion analyzer<\/td><td>Определение C, S, O, N, H<\/td><\/tr><tr><td>Масс-спектрометрия тлеющего разряда<\/td><td>Glow discharge mass spectrometry (GDMS)<\/td><td>Примеси в высокочистых металлах<\/td><\/tr><tr><td>Рентгеновская дифракция<\/td><td>X-ray diffraction (XRD)<\/td><td>Фазовый анализ<\/td><\/tr><tr><td>Метод Ритвельда<\/td><td>Rietveld refinement<\/td><td>Количественный фазовый анализ по дифрактограмме<\/td><\/tr><tr><td>Сканирующая электронная микроскопия<\/td><td>Scanning electron microscopy (SEM)<\/td><td>Изображение микроструктуры<\/td><\/tr><tr><td>Энергодисперсионная спектроскопия<\/td><td>Energy-dispersive spectroscopy (EDS)<\/td><td>Локальный состав в SEM<\/td><\/tr><tr><td>Электронно-зондовый микроанализ<\/td><td>Electron probe microanalysis (EPMA)<\/td><td>Точный локальный количественный анализ<\/td><\/tr><tr><td>Автоматизированная минералогия<\/td><td>Automated mineralogy (QEMSCAN, MLA, TIMA)<\/td><td>Автоматический анализ минералов и раскрытия<\/td><\/tr><tr><td>Металлография<\/td><td>Metallography<\/td><td>Исследование структуры на шлифах<\/td><\/tr><tr><td>Лазерная дифракция<\/td><td>Laser diffraction<\/td><td>Гранулометрия порошков и пульп<\/td><\/tr><tr><td>Удельная поверхность<\/td><td>Specific surface area (BET)<\/td><td>Площадь поверхности порошка на грамм<\/td><\/tr><tr><td>Термогравиметрия<\/td><td>Thermogravimetric analysis (TGA)<\/td><td>Изменение массы при нагреве<\/td><\/tr><tr><td>Предел обнаружения<\/td><td>Detection limit<\/td><td>Наименьшее определяемое содержание<\/td><\/tr><tr><td>Матричный эффект<\/td><td>Matrix effect<\/td><td>Влияние основного компонента на результат<\/td><\/tr><tr><td>Арбитражный анализ<\/td><td>Umpire / referee analysis<\/td><td>Анализ третьей лабораторией при споре<\/td><\/tr><tr><td>Сертификат анализа<\/td><td>Certificate of analysis (CoA)<\/td><td>Документ о составе партии продукции<\/td><\/tr><tr><td>Время выполнения анализа<\/td><td>Turnaround time (TAT)<\/td><td>Срок от поступления пробы до результата<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли лаборатории<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Руководитель лаборатории<\/td><td>Laboratory Manager<\/td><td>Численность, поток проб в сутки, аккредитация, бюджет<\/td><td>★★<\/td><\/tr><tr><td>Химик-аналитик ICP-OES/ICP-MS<\/td><td>ICP Analyst / Analytical Chemist<\/td><td>Матрицы, методики, пределы обнаружения, валидация<\/td><td>★★<\/td><\/tr><tr><td>Специалист по GDMS и высокой чистоте<\/td><td>GDMS / Trace Analysis Specialist<\/td><td>Сертификация 5N–6N, работа с клиентами<\/td><td>★★★<\/td><\/tr><tr><td>Специалист по XRF<\/td><td>XRF Specialist<\/td><td>Калибровки, сплавление, стандартные образцы<\/td><td>★<\/td><\/tr><tr><td>Минералог автоматизированной минералогии<\/td><td>Automated Mineralogist (QEMSCAN/MLA)<\/td><td>Проекты технологической минералогии, отчёты для фабрик<\/td><td>★★★<\/td><\/tr><tr><td>Специалист по XRD и электронной микроскопии<\/td><td>XRD / SEM Specialist<\/td><td>Фазовый анализ, Ритвельд, подготовка образцов<\/td><td>★★<\/td><\/tr><tr><td>Начальник участка пробоподготовки<\/td><td>Sample Preparation Supervisor<\/td><td>Поток проб, контроль загрязнений, безопасность<\/td><td>★<\/td><\/tr><tr><td>Металлограф, специалист по порошкам<\/td><td>Metallographer / Powder Characterization Specialist<\/td><td>Твёрдые сплавы, FSSS, BET, свойства<\/td><td>★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга аналитика<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«С какими матрицами и элементами вы работали на ICP-MS?»<\/td><td>Конкретные матрицы (растворы РЗЭ, металлы), элементы, пределы обнаружения<\/td><td>«Со всеми»<\/td><\/tr><tr><td>«Как вы боролись с интерференциями и матричными эффектами?»<\/td><td>Коллизионная ячейка, внутренние стандарты, отделение матрицы, разбавление<\/td><td>Не знает термина<\/td><\/tr><tr><td>«Как вы валидировали методику?»<\/td><td>Правильность, прецизионность, линейность, пределы, стандартные образцы<\/td><td>«Методика уже была»<\/td><\/tr><tr><td>«Какой поток проб и время выполнения анализа было в лаборатории?»<\/td><td>Цифры: пробы в сутки, TAT в часах<\/td><td>Не знает<\/td><\/tr><tr><td>(Пробоподготовка) «Как исключали загрязнение проб вольфрамом или железом?»<\/td><td>Материал чаш, очистка, холостые пробы<\/td><td>Не задумывался<\/td><\/tr><tr><td>(Высокая чистота) «Какие примеси лимитировали ваш продукт и как вы их подтверждали?»<\/td><td>GDMS, ICP-MS, конкретные элементы и уровни<\/td><td>«Делал по ГОСТу» без деталей<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<ul><li><strong>Коммерческие лаборатории:<\/strong> SGS, ALS, Bureau Veritas, Intertek — крупнейшие работодатели аналитиков горной отрасли; есть офисы в Центральной Азии и соседних странах.<\/li><li><strong>Лаборатории горных компаний:<\/strong> центральные лаборатории АГМК и НГМК (Узбекистан), Казахстана, Монголии.<\/li><li><strong>Производители высокочистых материалов:<\/strong> 5N Plus, Umicore, JX Metals, Plansee — специалисты по следовому анализу.<\/li><li><strong>Производители приборов:<\/strong> аппликационные специалисты Thermo Fisher, Agilent, Malvern Panalytical, Bruker, LECO знают методики и много лабораторий.<\/li><li><strong>Университеты и институты:<\/strong> ТашГТУ, Национальный университет Узбекистана, институты Академии наук Узбекистана, МИСИС, TU Freiberg (партнёры TMK).<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Матрица лаборатории TMK (40 мин).<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос производства<\/th><th>Метод<\/th><th>Прибор (тип)<\/th><th>Предел или точность (ориентир)<\/th><th>Специалист (RU / EN)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p>Минимум 12 строк, например:<\/p>\n<ul><li>содержание WO₃ в руде и хвостах Ингички;<\/li><li>качество вольфрамового концентрата (WO₃, Mo, As, P, S);<\/li><li>примеси в APT;<\/li><li>кислород в порошке вольфрама;<\/li><li>углерод в WC и в смеси ВК8;<\/li><li>η-фаза и пористость твёрдого сплава;<\/li><li>крупность порошка рения по Фишеру;<\/li><li>примеси в рении 99,99%;<\/li><li>распределение РЗЭ в растворе;<\/li><li>причины потерь вольфрама в хвостах;<\/li><li>сера в обожжённом молибдените;<\/li><li>графитовый углерод в руде Тасказгана.<\/li><\/ul>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какие три метода из матрицы вам нужно объяснять нанимающему менеджеру чаще всего?<\/li><li>Какой лабораторный профиль для TMK самый дефицитный?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 18: качество и управление лабораторией».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы знаете, на какие вопросы отвечает каждый прибор. Теперь вы не перепутаете аналитика XRF с минералогом QEMSCAN — а для лаборатории на 1 000 проб в сутки это разные люди.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Аппликационные заметки производителей (Thermo Fisher, Agilent, Malvern Panalytical, LECO) — бесплатные и практичные.<\/li><li>Материалы SGS и ALS о методах анализа минерального сырья (на сайтах компаний).<\/li><li>Lassner, Schubert, <em>Tungsten<\/em> — главы об анализе вольфрамовых материалов.<\/li><li>Видео: «ICP-MS how it works», «XRF fusion bead preparation», «QEMSCAN automated mineralogy».<\/li><\/ul>"},{"n":18,"module":4,"title":"Качество и управление лабораторией: QA/QC, ISO/IEC 17025, LIMS, сертификаты","file":"module-04-equipment-lab-production-systems/day-18-quality-lab-management.md","duration":"3,5 часа","challenge":"Написать <strong>профиль позиции «Руководитель Центральной нано-аналитической лаборатории TMK»<\/strong>: результаты на 12 месяцев, must-have, вопросы о системе качества и аккредитации.","why":"Лаборатория на 1 000 проб в сутки, которая планирует продавать услуги и замещать импорт, живёт или умирает в зависимости от <strong>доверия к результатам<\/strong>. Доверие подтверждается аккредитацией по ISO/IEC 17025, межлабораторными сличениями и прослеживаемостью. Руководитель, который этого не строил, превратит дорогие приборы в музей. Сегодня вы научитесь отличать «хорошего химика» от «руководителя аккредитованной лаборатории».","checklist":[{"text":"Разминка: 5 вопросов по Дню 17 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: профиль руководителя нано-аналитической лаборатории (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Обеспечение качества","en":"Quality assurance (QA)","def":"Система, гарантирующая надёжность процесса"},{"ru":"Контроль качества","en":"Quality control (QC)","def":"Проверка конкретных результатов"},{"ru":"Аккредитация","en":"Accreditation","def":"Официальное признание компетентности лаборатории"},{"ru":"Орган по аккредитации","en":"Accreditation body","def":"Национальная организация, аккредитующая лаборатории"},{"ru":"Испытательная лаборатория","en":"Testing laboratory","def":"Лаборатория, выполняющая анализы и испытания"},{"ru":"Валидация методики","en":"Method validation","def":"Подтверждение пригодности метода"},{"ru":"Верификация методики","en":"Method verification","def":"Подтверждение, что лаборатория выполняет стандартный метод"},{"ru":"Неопределённость измерений","en":"Measurement uncertainty","def":"Количественная оценка сомнения в результате"},{"ru":"Метрологическая прослеживаемость","en":"Metrological traceability","def":"Связь результата с эталонами через калибровки"},{"ru":"Калибровка","en":"Calibration","def":"Установление связи показаний прибора с эталоном"},{"ru":"Стандартный образец","en":"Certified reference material (CRM)","def":"Материал с аттестованным составом"},{"ru":"Контрольная карта","en":"Control chart","def":"График стабильности метода во времени"},{"ru":"Межлабораторные сличения","en":"Interlaboratory comparison","def":"Сравнение результатов разных лабораторий"},{"ru":"Проверка квалификации","en":"Proficiency testing (PT)","def":"Регулярная внешняя проверка лаборатории"},{"ru":"Z-оценка","en":"Z-score","def":"Мера отклонения результата в PT"},{"ru":"Правильность","en":"Trueness / accuracy","def":"Близость к истинному значению"},{"ru":"Прецизионность","en":"Precision","def":"Близость повторных результатов"},{"ru":"Повторяемость и воспроизводимость","en":"Repeatability and reproducibility (Gage R&R)","def":"Оценка измерительной системы"},{"ru":"Анализ измерительных систем","en":"Measurement system analysis (MSA)","def":"Требование автопрома к измерениям"},{"ru":"Статистическое управление процессами","en":"Statistical process control (SPC)","def":"Контроль стабильности производства"},{"ru":"Индекс воспроизводимости процесса","en":"Process capability index (Cp, Cpk)","def":"Способность процесса выдерживать допуск"},{"ru":"Несоответствие","en":"Nonconformity","def":"Невыполнение требования"},{"ru":"Корректирующее действие","en":"Corrective action (CAPA)","def":"Устранение причины несоответствия"},{"ru":"Внутренний аудит","en":"Internal audit","def":"Самопроверка системы качества"},{"ru":"Сертификат анализа","en":"Certificate of analysis (CoA)","def":"Документ о составе партии"},{"ru":"Арбитражная лаборатория","en":"Umpire laboratory","def":"Независимая лаборатория для разрешения споров"},{"ru":"Цепочка хранения пробы","en":"Chain of custody","def":"Документированный путь пробы"},{"ru":"Лабораторная информационная система","en":"LIMS","def":"Система управления пробами и результатами"},{"ru":"Контрактная лаборатория на площадке","en":"On-site contract laboratory","def":"Лаборатория, которой управляет внешний оператор"},{"ru":"Система менеджмента качества","en":"Quality management system (QMS)","def":"Система управления качеством организации"}],"quiz":[{"q":"Чем обеспечение качества (QA) отличается от контроля качества (QC)?","options":["QA проверяет отдельные результаты, а QC строит систему процедур","Это синонимы, которые просто используют в разных странах, отраслях и стандартах качества","QC проверяет конкретные результаты, а QA — система надёжности всего процесса","QA применяют только в автопроме, а QC — только в горной отрасли"],"answer":2,"explain":"Стандартные образцы и контрольные карты — QC; процедуры, обучение, валидация, аудиты — QA."},{"q":"Какой стандарт определяет компетентность испытательных лабораторий?","options":["ISO/IEC 17025","ISO 14001","IATF 16949","ISO 50001"],"answer":0,"explain":"ISO 14001 — экология, IATF 16949 — автопром, ISO 50001 — энергоменеджмент."},{"q":"Что означает z-оценка, равная 3,5, в проверке квалификации?","options":["Лучший результат среди всех участников проверки квалификации","Результат точно совпал с аттестованным значением образца","Лаборатории выдан сертификат аккредитации на пять лет","Неудовлетворительный результат: нужно расследовать причину"],"answer":3,"explain":"Обычно |z| ≤ 2 — удовлетворительно, 2–3 — сомнительно, &gt; 3 — неудовлетворительно."},{"q":"Что такое метрологическая прослеживаемость?","options":["Учёт перемещения проб внутри лаборатории по штрихкодам от приёмки до утилизации","Связь результата с эталонами через непрерывную цепь калибровок","Отслеживание поставок сырья от рудника до завода","Хранение архивов результатов не менее пяти лет"],"answer":1,"explain":"Цепочка хранения пробы — это chain of custody, а прослеживаемость сырья — supply chain traceability."},{"q":"Что делает арбитражная лаборатория при торговле концентратами?","options":["Устанавливает цену концентрата на бирже по итогам торгов","Выдаёт лицензии на добычу и переработку минерального сырья","Анализирует пробу при расхождении результатов продавца и покупателя","Аккредитует лаборатории продавца и покупателя по ISO/IEC 17025"],"answer":2,"explain":"Её результат обязателен для сторон — отсюда вес аккредитации и репутации."},{"q":"Какие инструменты обязательно знает инженер по качеству в автопроме?","options":["PPAP, APQP, FMEA, MSA, SPC","JORC, NI 43-101, S-K 1300","RMAP, CMRT, EMRT","LTIFR, TRIFR, MTBF"],"answer":0,"explain":"Это ядро IATF 16949. Остальные наборы — из геологии, прослеживаемости и охраны труда / надёжности."},{"q":"Что такое LIMS?","options":["Международный стандарт оценки неопределённости измерений","Система государственного лицензирования испытательных лабораторий и их сотрудников","Метод элементного анализа твёрдых проб с лазерной абляцией","Информационная система управления пробами и результатами лаборатории"],"answer":3,"explain":"Распространённые системы: LabWare, SampleManager, STARLIMS, в горной отрасли — CCLAS."},{"q":"Кандидат на роль руководителя лаборатории говорит: «Аккредитацией у нас занимался отдел качества». Вывод:","options":["Это сильная сторона: он сосредоточен на науке, а не на бумагах","Тревожный сигнал: руководитель аккредитованной лаборатории должен владеть системой качества сам","Это не имеет значения: система качества и аккредитация — задача отдельного отдела, а не руководителя","Нужно сразу сделать оффер, пока его не перехватили конкуренты"],"answer":1,"explain":"Для лаборатории, которая будет продавать услуги, система качества — ядро роли."},{"q":"Почему для экспортной лаборатории важно международное признание её аккредитации?","options":["Иначе зарубежные клиенты и покупатели могут не принимать её результаты","Так проще купить приборы у западных производителей без экспортных лицензий","Это требование таможенного оформления импортных реагентов","Без него лаборатория не может нанимать иностранных сотрудников"],"answer":0,"explain":"Признание обеспечивают соглашения о взаимном признании (ILAC MRA и региональные)."},{"q":"Какую роль играет SGS в лабораторном направлении TMK по публичным данным?","options":["SGS — национальный аккредитационный орган Узбекистана","SGS — производитель масс-спектрометров и рентгеновских анализаторов для лаборатории","Партнёр в создании Центральной нано-аналитической лаборатории","SGS — арбитр в спорах о цене вольфрамового концентрата"],"answer":2,"explain":"Поэтому руководителю TMK нужно уметь владеть системой качества, которую частично привносит партнёр."}],"html":"<h2>0. Разминка: вспомнить День 17<\/h2>\n<ol><li>Чем ICP-OES отличается от ICP-MS по назначению?<\/li><li>Какой метод используют для сертификации 5N–6N?<\/li><li>Что показывает автоматизированная минералогия?<\/li><li>Почему упорные минералы анализируют после сплавления?<\/li><li>Что такое TAT и почему он важен для фабрики?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>ICP-OES — многоэлементный анализ растворов от % до ppm; ICP-MS — следы до ppt, РЗЭ, изотопы.<\/li><li>GDMS.<\/li><li>Минеральный состав, раскрытие, ассоциации и причины потерь металла.<\/li><li>Кислоты растворяют их не полностью, результат занижается.<\/li><li>Время от поступления пробы до результата; без быстрых анализов фабрика управляется вслепую.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 QA и QC: в чём разница<\/h3>\n<ul><li><strong>Контроль качества (QC, quality control)<\/strong> — проверки конкретных результатов: стандартные образцы, холостые пробы, дубликаты, контрольные карты.<\/li><li><strong>Обеспечение качества (QA, quality assurance)<\/strong> — система, которая гарантирует надёжность всего процесса: процедуры, обучение, валидация методик, аудиты, управление оборудованием и документами.<\/li><\/ul>\n<p><strong>Инструменты QC в лаборатории:<\/strong><\/p>\n<ul><li><strong>стандартные образцы<\/strong> (CRM) с известным составом — проверка правильности;<\/li><li><strong>холостые пробы<\/strong> (blanks) — проверка загрязнения;<\/li><li><strong>дубликаты<\/strong> — проверка воспроизводимости;<\/li><li><strong>контрольные карты<\/strong> (Шухарта) — отслеживание стабильности метода во времени;<\/li><li><strong>межлабораторные сличения<\/strong> и <strong>проверки квалификации<\/strong> (proficiency testing, PT) — сравнение с другими лабораториями; результат часто выражают <strong>z-оценкой<\/strong> (|z| ≤ 2 — удовлетворительно).<\/li><\/ul>\n<h3>1.2 ISO/IEC 17025: стандарт компетентности лабораторий<\/h3>\n<p><strong>ISO/IEC 17025:2017<\/strong> — международный стандарт «Общие требования к компетентности испытательных и калибровочных лабораторий». Аккредитация по нему — признание того, что лаборатория <strong>компетентна и выдаёт достоверные результаты<\/strong>.<\/p>\n<p><strong>Ключевые требования:<\/strong><\/p>\n<ul><li><strong>беспристрастность и конфиденциальность<\/strong>;<\/li><li><strong>компетентность персонала<\/strong>: подтверждённая квалификация, обучение, допуски к методикам;<\/li><li><strong>валидация и верификация методик<\/strong>: правильность, прецизионность, пределы обнаружения, диапазон, линейность, устойчивость;<\/li><li><strong>неопределённость измерений<\/strong> — количественная оценка «насколько можно доверять числу»;<\/li><li><strong>метрологическая прослеживаемость<\/strong>: калибровки приборов и стандартные образцы с прослеживаемостью к национальным или международным эталонам;<\/li><li><strong>обеспечение достоверности результатов<\/strong>: внутренний контроль, участие в PT;<\/li><li><strong>управление оборудованием, записями, жалобами, несоответствиями<\/strong>, внутренние аудиты и анализ со стороны руководства;<\/li><li><strong>подход на основе рисков<\/strong>.<\/li><\/ul>\n<p><strong>Аккредитация<\/strong> выдаётся национальным органом по аккредитации; международное признание результатов обеспечивается соглашениями о взаимном признании (ILAC MRA и региональные). Для экспортно ориентированной лаборатории важно, признаётся ли её аккредитация за рубежом — это уточняют при выборе органа аккредитации.<\/p>\n<h3>1.3 Смежные стандарты качества<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Стандарт<\/th><th>О чём<\/th><th>Где важен для TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>ISO 9001<\/strong><\/td><td>Система менеджмента качества организации<\/td><td>Всё производство, требования покупателей<\/td><\/tr><tr><td><strong>IATF 16949<\/strong><\/td><td>Качество в автомобильной промышленности (на базе ISO 9001) + PPAP, APQP, FMEA, SPC, MSA<\/td><td>Smart Powder (автодетали)<\/td><\/tr><tr><td><strong>ISO 14001<\/strong><\/td><td>Экологический менеджмент<\/td><td>Экспорт, ESG<\/td><\/tr><tr><td><strong>ISO 45001<\/strong><\/td><td>Охрана здоровья и безопасность труда<\/td><td>Все производства<\/td><\/tr><tr><td><strong>ISO 50001<\/strong><\/td><td>Энергоменеджмент<\/td><td>Энергоёмкие переделы<\/td><\/tr><tr><td><strong>ISO 17034<\/strong><\/td><td>Требования к производителям стандартных образцов<\/td><td>Если TMK будет выпускать стандартные образцы руд и продуктов<\/td><\/tr><tr><td><strong>ISO/IEC 17043<\/strong><\/td><td>Требования к провайдерам проверок квалификации<\/td><td>—<\/td><\/tr><tr><td>ГОСТ, ТУ, национальные стандарты<\/td><td>Требования к продукции и методикам анализа<\/td><td>Действующая продукция TMK (ГОСТ 3882-74, ГОСТ 4759-91 и др.)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>MSA и SPC<\/strong> — термины, которые обязательно знает инженер по качеству в автопроме: анализ измерительных систем (повторяемость и воспроизводимость измерений, Gage R&amp;R) и статистическое управление процессами (контрольные карты, индексы воспроизводимости Cp, Cpk).<\/p>\n<h3>1.4 Сертификат анализа и спор о качестве<\/h3>\n<ul><li><strong>Сертификат анализа<\/strong> (CoA, certificate of analysis) сопровождает каждую партию продукции: содержание основного компонента, примеси, методы, номер партии, подпись.<\/li><li>В торговле концентратами и металлами часто действует схема <strong>«анализ продавца — анализ покупателя — арбитраж»<\/strong>: при расхождении больше допустимого пробу анализирует <strong>независимая арбитражная лаборатория<\/strong> (umpire), а её результат обязателен для сторон. Отсюда вес аккредитации и репутации лаборатории.<\/li><li><strong>Независимые инспекции<\/strong> (SGS, Bureau Veritas, Intertek, Alex Stewart) отбирают пробы при отгрузке и выдают сертификаты, на которые опираются платежи.<\/li><\/ul>\n<h3>1.5 LIMS и цифровая лаборатория<\/h3>\n<p><strong>LIMS<\/strong> (laboratory information management system) — система, которая ведёт пробу от регистрации до результата:<\/p>\n<ul><li>регистрация и штрихкодирование проб, цепочка хранения (chain of custody);<\/li><li>распределение задач по приборам и аналитикам, сроки;<\/li><li>автоматический приём данных с приборов;<\/li><li>контроль качества (стандартные образцы, контрольные карты), утверждение результатов;<\/li><li>выпуск отчётов и сертификатов, интеграция с ERP и производством.<\/li><\/ul>\n<p>Распространённые системы: LabWare, Thermo Fisher SampleManager, STARLIMS; в горной отрасли — CCLAS. У TMK заявлена цифровая LIMS в нано-аналитической лаборатории.<\/p>\n<p><strong>Роли цифровой лаборатории:<\/strong> администратор LIMS, специалист по интеграции приборов, аналитик данных.<\/p>\n<h3>1.6 Экономика лаборатории и модели работы<\/h3>\n<ul><li><strong>Собственная лаборатория или аутсорсинг:<\/strong> коммерческие лаборатории дают скорость запуска, систему качества и признание; собственная — контроль, сроки, конфиденциальность. Часто комбинируют: <strong>контрактная лаборатория на площадке<\/strong> (оператор — SGS, ALS и др.).<\/li><li><strong>KPI лаборатории:<\/strong> TAT, доля результатов QC в допусках, результаты PT (z-оценки), стоимость пробы, загрузка приборов, повторные анализы, жалобы клиентов.<\/li><li><strong>Коммерческая лаборатория<\/strong> (если TMK будет продавать услуги): ценообразование, договоры, маркетинг, признание аккредитации клиентами, конфиденциальность данных клиентов.<\/li><\/ul>\n<blockquote><p><strong>TMK:<\/strong> нано-аналитическую лабораторию создают с SGS. Значит, часть системы качества и методик может прийти от партнёра. Но руководителю TMK нужно уметь этой системой <strong>владеть<\/strong>: аккредитация, обучение местных аналитиков, переход от «лаборатории партнёра» к собственной компетенции.<\/p><\/blockquote>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Обеспечение качества<\/td><td>Quality assurance (QA)<\/td><td>Система, гарантирующая надёжность процесса<\/td><\/tr><tr><td>Контроль качества<\/td><td>Quality control (QC)<\/td><td>Проверка конкретных результатов<\/td><\/tr><tr><td>Аккредитация<\/td><td>Accreditation<\/td><td>Официальное признание компетентности лаборатории<\/td><\/tr><tr><td>Орган по аккредитации<\/td><td>Accreditation body<\/td><td>Национальная организация, аккредитующая лаборатории<\/td><\/tr><tr><td>Испытательная лаборатория<\/td><td>Testing laboratory<\/td><td>Лаборатория, выполняющая анализы и испытания<\/td><\/tr><tr><td>Валидация методики<\/td><td>Method validation<\/td><td>Подтверждение пригодности метода<\/td><\/tr><tr><td>Верификация методики<\/td><td>Method verification<\/td><td>Подтверждение, что лаборатория выполняет стандартный метод<\/td><\/tr><tr><td>Неопределённость измерений<\/td><td>Measurement uncertainty<\/td><td>Количественная оценка сомнения в результате<\/td><\/tr><tr><td>Метрологическая прослеживаемость<\/td><td>Metrological traceability<\/td><td>Связь результата с эталонами через калибровки<\/td><\/tr><tr><td>Калибровка<\/td><td>Calibration<\/td><td>Установление связи показаний прибора с эталоном<\/td><\/tr><tr><td>Стандартный образец<\/td><td>Certified reference material (CRM)<\/td><td>Материал с аттестованным составом<\/td><\/tr><tr><td>Контрольная карта<\/td><td>Control chart<\/td><td>График стабильности метода во времени<\/td><\/tr><tr><td>Межлабораторные сличения<\/td><td>Interlaboratory comparison<\/td><td>Сравнение результатов разных лабораторий<\/td><\/tr><tr><td>Проверка квалификации<\/td><td>Proficiency testing (PT)<\/td><td>Регулярная внешняя проверка лаборатории<\/td><\/tr><tr><td>Z-оценка<\/td><td>Z-score<\/td><td>Мера отклонения результата в PT<\/td><\/tr><tr><td>Правильность<\/td><td>Trueness / accuracy<\/td><td>Близость к истинному значению<\/td><\/tr><tr><td>Прецизионность<\/td><td>Precision<\/td><td>Близость повторных результатов<\/td><\/tr><tr><td>Повторяемость и воспроизводимость<\/td><td>Repeatability and reproducibility (Gage R&amp;R)<\/td><td>Оценка измерительной системы<\/td><\/tr><tr><td>Анализ измерительных систем<\/td><td>Measurement system analysis (MSA)<\/td><td>Требование автопрома к измерениям<\/td><\/tr><tr><td>Статистическое управление процессами<\/td><td>Statistical process control (SPC)<\/td><td>Контроль стабильности производства<\/td><\/tr><tr><td>Индекс воспроизводимости процесса<\/td><td>Process capability index (Cp, Cpk)<\/td><td>Способность процесса выдерживать допуск<\/td><\/tr><tr><td>Несоответствие<\/td><td>Nonconformity<\/td><td>Невыполнение требования<\/td><\/tr><tr><td>Корректирующее действие<\/td><td>Corrective action (CAPA)<\/td><td>Устранение причины несоответствия<\/td><\/tr><tr><td>Внутренний аудит<\/td><td>Internal audit<\/td><td>Самопроверка системы качества<\/td><\/tr><tr><td>Сертификат анализа<\/td><td>Certificate of analysis (CoA)<\/td><td>Документ о составе партии<\/td><\/tr><tr><td>Арбитражная лаборатория<\/td><td>Umpire laboratory<\/td><td>Независимая лаборатория для разрешения споров<\/td><\/tr><tr><td>Цепочка хранения пробы<\/td><td>Chain of custody<\/td><td>Документированный путь пробы<\/td><\/tr><tr><td>Лабораторная информационная система<\/td><td>LIMS<\/td><td>Система управления пробами и результатами<\/td><\/tr><tr><td>Контрактная лаборатория на площадке<\/td><td>On-site contract laboratory<\/td><td>Лаборатория, которой управляет внешний оператор<\/td><\/tr><tr><td>Система менеджмента качества<\/td><td>Quality management system (QMS)<\/td><td>Система управления качеством организации<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли качества<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Руководитель лаборатории (аккредитованной)<\/td><td>Laboratory Manager (ISO/IEC 17025)<\/td><td>Проводил аккредитацию или её подтверждение, численность, поток проб<\/td><td>★★<\/td><\/tr><tr><td>Менеджер по качеству лаборатории<\/td><td>Laboratory Quality Manager<\/td><td>Система качества, PT, неопределённость, аудиты<\/td><td>★★<\/td><\/tr><tr><td>Директор по качеству производства<\/td><td>Quality Director / Head of Quality<\/td><td>ISO 9001, работа с претензиями, сертификаты продукции<\/td><td>★★<\/td><\/tr><tr><td>Инженер по качеству (автопром)<\/td><td>Supplier / Customer Quality Engineer (IATF 16949)<\/td><td>PPAP, APQP, FMEA, MSA, SPC, аудиты клиентов<\/td><td>★★<\/td><\/tr><tr><td>Метролог<\/td><td>Metrologist<\/td><td>Калибровки, прослеживаемость, поверка<\/td><td>★<\/td><\/tr><tr><td>Администратор LIMS<\/td><td>LIMS Administrator / Specialist<\/td><td>Внедрение, интеграция приборов, отчёты<\/td><td>★★<\/td><\/tr><tr><td>Руководитель коммерческой лаборатории<\/td><td>Commercial Laboratory Manager<\/td><td>Клиенты, ценообразование, рост выручки<\/td><td>★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга руководителя лаборатории<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Проводили ли вы аккредитацию по ISO/IEC 17025? Что было самым трудным?»<\/td><td>Конкретные этапы, сроки, замечания экспертов и их устранение<\/td><td>«Аккредитацией занимался отдел качества»<\/td><\/tr><tr><td>«Как вы оцениваете неопределённость измерений для основной методики?»<\/td><td>Объясняет подход (бюджет неопределённости или данные валидации и QC)<\/td><td>Не может объяснить<\/td><\/tr><tr><td>«Какие были результаты проверок квалификации и что делали при неудовлетворительной z-оценке?»<\/td><td>Расследование причин, корректирующие действия, повторная проверка<\/td><td>Не участвовали в PT<\/td><\/tr><tr><td>«Какие KPI лаборатории вы отслеживали?»<\/td><td>TAT, QC, PT, стоимость пробы, загрузка<\/td><td>Не измеряли<\/td><\/tr><tr><td>«Как вы решали споры о качестве с клиентами или покупателями?»<\/td><td>Арбитраж, повторный анализ, разбор методик<\/td><td>Не сталкивался<\/td><\/tr><tr><td>«Как вы обучали и допускали аналитиков к методикам?»<\/td><td>Программа обучения, проверка компетентности, матрица допусков<\/td><td>«Учились на рабочем месте»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<ul><li><strong>SGS, ALS, Bureau Veritas, Intertek<\/strong> — лучшая школа систем качества лабораторий; руководители лабораторий и менеджеры по качеству.<\/li><li><strong>Центральные лаборатории горных и металлургических компаний<\/strong> с аккредитацией (АГМК, НГМК, предприятия Казахстана).<\/li><li><strong>Производители высокочистых материалов и твёрдых сплавов<\/strong> — системы качества продукции, требования аэрокосмоса и электроники.<\/li><li><strong>Автокомпоненты<\/strong> (для Smart Powder): производители комплектующих в Узбекистане (автомобильный кластер страны), Турции, Корее — инженеры по качеству с IATF 16949.<\/li><li><strong>Национальные метрологические и стандартизационные организации<\/strong> — метрологи.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Профиль позиции (40 мин).<\/strong> «Руководитель Центральной нано-аналитической лаборатории TMK (R&amp;D Park)».<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Блок<\/th><th>Что написать<\/th><\/tr><\/thead><tbody><tr><td>Результаты на 12 месяцев<\/td><td>Например: запуск методик по приоритетным продуктам; подготовка к аккредитации по ISO/IEC 17025; участие в PT; TAT не более N часов<\/td><\/tr><tr><td>Must-have (5)<\/td><td>Руководство лабораторией не менее N человек; аккредитация по ISO/IEC 17025; методы (ICP, XRF, XRD/SEM); LIMS; работа с внешним партнёром<\/td><\/tr><tr><td>Nice-to-have (3–4)<\/td><td>Опыт коммерческой лаборатории; автоматизированная минералогия; английский и русский<\/td><\/tr><tr><td>8 компаний-доноров<\/td><td><\/td><\/tr><tr><td>6 вопросов скрининга<\/td><td>Из 3.2 и своих<\/td><\/tr><tr><td>Главный риск позиции и как его закрыть<\/td><td>Например: сильный учёный без опыта аккредитации → менеджер по качеству в паре<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какие три вопроса из блока 3.2 вы считаете самыми сильными?<\/li><li>Какой главный риск позиции руководителя нано-лаборатории вы нашли?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 19: АСУ ТП, цифровизация, ТОиР и надёжность».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> качество — это язык, на котором говорят западные покупатели. Если вы им владеете, вы закрываете позиции, которые иначе висят месяцами.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Текст ISO/IEC 17025:2017 (платный) и бесплатные руководства органов аккредитации и Eurachem (валидация методик, неопределённость).<\/li><li>Eurachem / CITAC Guide «Quantifying Uncertainty in Analytical Measurement» (бесплатно).<\/li><li>Материалы AIAG по PPAP, APQP, FMEA, MSA, SPC (автопром).<\/li><li>Видео: «ISO 17025 explained», «control charts laboratory», «Gage R&amp;R explained».<\/li><\/ul>"},{"n":19,"module":4,"title":"Производственные системы: АСУ ТП, цифровизация, ТОиР и надёжность","file":"module-04-equipment-lab-production-systems/day-19-automation-digital-maintenance.md","duration":"3,5 часа","challenge":"Построить <strong>«пирамиду автоматизации» TMK<\/strong> (уровни 0–4) с ролями на каждом уровне и составить профиль «Главный механик / Head of Maintenance &amp; Reliability» для нового передела.","why":"Современный завод ломается не только железом, но и данными. Если на новом гидрометаллургическом цехе нет сильной АСУ ТП, а ремонтная служба живёт по советскому графику ППР без анализа надёжности, выход на мощность растянется на годы. Главный механик, инженер по надёжности и руководитель автоматизации — роли, которые часто нанимают слишком поздно. Сегодня вы научитесь объяснять, зачем нанимать их рано.","checklist":[{"text":"Разминка: 5 вопросов по Дню 18 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: пирамида автоматизации TMK + профиль главного механика (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.4, 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Автоматизированная система управления технологическим процессом (АСУ ТП)","en":"Process control system / industrial automation","def":"Системы управления производством"},{"ru":"Контрольно-измерительные приборы и автоматика (КИПиА)","en":"Instrumentation and control (I&C)","def":"Датчики, приборы, исполнительные механизмы"},{"ru":"Программируемый логический контроллер","en":"PLC (programmable logic controller)","def":"Контроллер управления машинами и участками"},{"ru":"Распределённая система управления","en":"DCS (distributed control system)","def":"Система управления непрерывным процессом"},{"ru":"Диспетчерская система","en":"SCADA","def":"Сбор данных и диспетчерское управление"},{"ru":"Человеко-машинный интерфейс","en":"HMI","def":"Экраны операторов"},{"ru":"Продвинутое управление процессом","en":"Advanced process control (APC)","def":"Многомерная оптимизация процесса"},{"ru":"Система противоаварийной защиты (ПАЗ)","en":"Safety instrumented system (SIS)","def":"Автоматическая защита от аварий"},{"ru":"Историк данных","en":"Data historian","def":"Хранилище временных рядов параметров"},{"ru":"Система управления производством","en":"MES (manufacturing execution system)","def":"Учёт и управление на уровне цеха"},{"ru":"Система управления предприятием","en":"ERP","def":"Финансы, закупки, кадры, продажи"},{"ru":"Цифровой двойник","en":"Digital twin","def":"Модель процесса или оборудования"},{"ru":"Промышленный интернет вещей","en":"Industrial IoT (IIoT)","def":"Сеть датчиков и устройств"},{"ru":"Кибербезопасность АСУ ТП","en":"OT cybersecurity (IEC 62443)","def":"Защита технологических систем"},{"ru":"Техническое обслуживание и ремонт (ТОиР)","en":"Maintenance","def":"Обслуживание и ремонт оборудования"},{"ru":"Планово-предупредительный ремонт (ППР)","en":"Preventive maintenance","def":"Ремонты по графику"},{"ru":"Обслуживание по состоянию","en":"Condition-based maintenance","def":"Ремонт по признакам деградации"},{"ru":"Предиктивное обслуживание","en":"Predictive maintenance","def":"Ремонт по прогнозу отказа"},{"ru":"Обслуживание, ориентированное на надёжность","en":"Reliability-centered maintenance (RCM)","def":"Выбор стратегии по последствиям отказов"},{"ru":"Анализ видов и последствий отказов","en":"FMEA","def":"Систематический анализ отказов"},{"ru":"Анализ корневых причин","en":"Root cause analysis (RCA)","def":"Поиск первопричины отказа"},{"ru":"Вибродиагностика","en":"Vibration analysis","def":"Диагностика вращающегося оборудования"},{"ru":"Система управления ТОиР","en":"CMMS / EAM","def":"SAP PM, IBM Maximo и др."},{"ru":"Остановочный ремонт","en":"Shutdown / turnaround","def":"Плановая остановка для крупных работ"},{"ru":"Общая эффективность оборудования","en":"Overall equipment effectiveness (OEE)","def":"Готовность × производительность × качество"},{"ru":"Наработка на отказ","en":"Mean time between failures (MTBF)","def":"Средняя наработка между отказами"},{"ru":"Среднее время восстановления","en":"Mean time to repair (MTTR)","def":"Среднее время ремонта"},{"ru":"Выполнение графика ППР","en":"PM compliance","def":"Доля выполненных плановых работ"},{"ru":"Отставание по заявкам","en":"Maintenance backlog","def":"Объём невыполненных работ"},{"ru":"Частота аварийных сигналов","en":"Alarm rate","def":"Число сигналов оператору в час"}],"quiz":[{"q":"Какая система управляет непрерывным химическим или гидрометаллургическим процессом?","options":["Распределённая система управления (DCS)","Система управления предприятием (ERP)","Лабораторная информационная система (LIMS)","Система управления персоналом (HRM)"],"answer":0,"explain":"DCS — уровень 2 пирамиды; ERP — уровень 4."},{"q":"Что хранит историк данных?","options":["Финансовую отчётность предприятия","Кадровые записи сотрудников","Результаты лабораторных анализов проб","Временные ряды технологических параметров"],"answer":3,"explain":"Это основа аналитики процесса и расследований."},{"q":"Чем RCM отличается от классического ППР?","options":["RCM полностью запрещает плановые ремонты оборудования","Стратегию ТОиР выбирают для каждой единицы по последствиям отказов","RCM применяется только для конвейеров и насосов фабрики","RCM означает, что любое оборудование ремонтируют только после отказа"],"answer":1,"explain":"ППР — ремонты по графику; RCM комбинирует стратегии в зависимости от критичности."},{"q":"Как рассчитывается OEE?","options":["Затраты на ремонт, делённые на выручку","Число отказов за год, делённое на число машин","Готовность × производительность × качество","Время ремонта плюс время ожидания запчастей"],"answer":2,"explain":"Общая эффективность оборудования объединяет три потери."},{"q":"Что такое система противоаварийной защиты (ПАЗ, SIS)?","options":["Автоматическая система, переводящая процесс в безопасное состояние при опасных отклонениях","Система видеонаблюдения за проходной и периметром предприятия","План эвакуации персонала при пожаре с маршрутами выхода","Программа обучения операторов на компьютерном тренажёре процесса с имитацией аварийных ситуаций"],"answer":0,"explain":"Обязательна для опасных химических производств, например TMK Chemicals."},{"q":"Кандидат на роль главного механика: «Мы всё выполняли строго по графику ППР». Лучший уточняющий вопрос:","options":["«Сколько у вас было подчинённых слесарей и электриков?»","«Нравится ли вам работа с графиками и планированием?»","«Какая у вас группа по электробезопасности, какие допуски и когда вы проходили аттестацию?»","«Как при вас изменились MTBF, доля аварийных ремонтов и затраты на ТОиР?»"],"answer":3,"explain":"Выполнение графика — не результат. Результат — меньше отказов и затрат."},{"q":"Зачем Smart Powder нужна MES?","options":["Для расчёта заработной платы операторов прессов и печей","Для учёта производства и прослеживаемости партий, которых требует автопром","Для автоматического управления химической реакцией в автоклаве выщелачивания концентрата","Для бухгалтерского учёта запасов сырья и готовой продукции"],"answer":1,"explain":"Автопроизводители требуют прослеживаемости каждой партии деталей."},{"q":"Что такое остановочный ремонт (turnaround)?","options":["Ремонт отдельного насоса без остановки производства","Ежедневный обход оборудования механиком смены","Плановая остановка завода для крупных работ","Замена смазки в редукторе по графику"],"answer":2,"explain":"Отдельная дисциплина планирования, подрядчиков и безопасности."},{"q":"Как проверить кандидата, который пишет «руководил цифровой трансформацией»?","options":["Попросить показать презентацию проекта, которую он делал для руководства, акционеров и совета директоров","Спросить, сколько у него сертификатов и дипломов по цифровым технологиям","Уточнить, какие языки программирования он знает и на каком уровне","Спросить про конкретный процесс, данные, измеримый эффект и кто пользуется результатом сейчас"],"answer":3,"explain":"Презентация — не результат. Живой эффект в производстве — результат."},{"q":"Почему руководителя АСУ ТП нужно нанимать за 12–18 месяцев до пуска?","options":["Ошибки архитектуры систем управления дорого исправлять после пуска","Так требует трудовое законодательство","Чтобы он успел пройти обучение по охране труда","Потому что системы автоматизации устанавливают после пуска"],"answer":0,"explain":"Руководитель АСУ ТП участвует в проектировании, выборе платформы, приёмке и пусконаладке."}],"html":"<h2>0. Разминка: вспомнить День 18<\/h2>\n<ol><li>Чем QA отличается от QC?<\/li><li>Что требует ISO/IEC 17025 (назовите четыре элемента)?<\/li><li>Что означает z-оценка больше 3 в проверке квалификации?<\/li><li>Какие инструменты IATF 16949 нужны Smart Powder?<\/li><li>Что такое LIMS?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>QC проверяет конкретные результаты; QA — система, гарантирующая надёжность процесса.<\/li><li>Компетентность персонала, валидация методик, неопределённость, прослеживаемость, участие в PT, управление оборудованием, беспристрастность.<\/li><li>Неудовлетворительный результат, требуется расследование.<\/li><li>PPAP, APQP, FMEA, MSA, SPC.<\/li><li>Информационная система управления пробами и результатами лаборатории.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Пирамида автоматизации (модель ISA-95)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Уровень<\/th><th>Что это<\/th><th>Примеры систем<\/th><th>Кто работает<\/th><\/tr><\/thead><tbody><tr><td><strong>0 — процесс<\/strong><\/td><td>Датчики и исполнительные механизмы<\/td><td>Расходомеры, датчики давления, температуры, pH, уровнемеры, анализаторы, клапаны, приводы<\/td><td>Инженеры и слесари КИПиА<\/td><\/tr><tr><td><strong>1 — управление<\/strong><\/td><td>Контроллеры<\/td><td>ПЛК (PLC), контроллеры РСУ<\/td><td>Инженеры АСУ ТП, программисты ПЛК<\/td><\/tr><tr><td><strong>2 — диспетчеризация<\/strong><\/td><td>Человеко-машинный интерфейс, операторские станции<\/td><td>РСУ (DCS), SCADA, системы продвинутого управления (APC)<\/td><td>Операторы, инженеры АСУ ТП, технологи<\/td><\/tr><tr><td><strong>3 — управление производством<\/strong><\/td><td>Учёт, планирование, качество, лаборатория<\/td><td>MES, LIMS, историк данных (data historian), системы ТОиР<\/td><td>Инженеры MES, аналитики данных, технологи<\/td><\/tr><tr><td><strong>4 — предприятие<\/strong><\/td><td>Финансы, закупки, кадры, продажи<\/td><td>ERP (SAP, Oracle; в СНГ — часто 1С)<\/td><td>ИТ, финансы, снабжение<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ключевые системы:<\/strong><\/p>\n<ul><li><strong>РСУ / DCS<\/strong> (распределённая система управления): ABB 800xA, Siemens PCS 7, Emerson DeltaV, Honeywell Experion, Yokogawa CENTUM — для непрерывных химических и гидрометаллургических процессов;<\/li><li><strong>ПЛК + SCADA<\/strong> — для машин и участков (печи, прессы, конвейеры);<\/li><li><strong>историк данных<\/strong> (например, AVEVA PI) — хранит временные ряды тысяч параметров; основа аналитики;<\/li><li><strong>MES<\/strong> — учёт производства, партий, прослеживаемость продукции, особенно важна для твёрдых сплавов и автодеталей;<\/li><li><strong>APC<\/strong> (advanced process control) — многомерное управление для стабилизации и оптимизации (мельницы, флотация, печи).<\/li><\/ul>\n<h3>1.2 Цифровизация: что реально работает<\/h3>\n<ul><li><strong>Аналитика данных процесса<\/strong>: поиск причин потерь и нестабильности по данным историка.<\/li><li><strong>Цифровые двойники<\/strong>: модели процессов и оборудования для обучения операторов, оптимизации и проектирования.<\/li><li><strong>Промышленный интернет вещей<\/strong> (IIoT): беспроводные датчики вибрации и температуры, удалённый мониторинг оборудования.<\/li><li><strong>Машинное обучение<\/strong> в обогащении (прогноз извлечения, управление измельчением) и в ТОиР (предиктивная диагностика).<\/li><li><strong>Кибербезопасность технологических систем<\/strong> (OT security, стандарт IEC 62443): после атак на промышленность это обязательная компетенция.<\/li><\/ul>\n<p><strong>Скепсис рекрутера:<\/strong> «цифровая трансформация» в резюме часто означает презентации. Спрашивайте: <strong>какой процесс, какие данные, какой измеримый эффект и кто им пользуется сейчас<\/strong>.<\/p>\n<h3>1.3 ТОиР: от «чинить, когда сломалось» до надёжности<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Стратегия<\/th><th>Суть<\/th><th>Когда применять<\/th><\/tr><\/thead><tbody><tr><td><strong>Реактивная<\/strong> (run to failure)<\/td><td>Ремонт после отказа<\/td><td>Дешёвое некритичное оборудование<\/td><\/tr><tr><td><strong>Планово-предупредительная<\/strong> (ППР, preventive maintenance)<\/td><td>Ремонты по графику (часы, календарь)<\/td><td>Основа советской и российской системы<\/td><\/tr><tr><td><strong>По состоянию<\/strong> (condition-based)<\/td><td>Ремонт при признаках деградации<\/td><td>Критичное вращающееся оборудование<\/td><\/tr><tr><td><strong>Предиктивная<\/strong> (predictive)<\/td><td>Прогноз отказа по трендам и моделям<\/td><td>Высокая цена простоя<\/td><\/tr><tr><td><strong>RCM<\/strong> (reliability-centered maintenance)<\/td><td>Выбор стратегии для каждой единицы по анализу последствий отказов<\/td><td>Зрелые предприятия<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Инструменты надёжности:<\/strong><\/p>\n<ul><li><strong>FMEA / FMECA<\/strong> — анализ видов и последствий отказов;<\/li><li><strong>анализ корневых причин<\/strong> (RCA: «5 почему», диаграмма Исикавы);<\/li><li><strong>анализ Вейбулла<\/strong> — статистика отказов;<\/li><li><strong>диагностика<\/strong>: вибродиагностика, анализ масел, термография, ультразвук, контроль толщины (коррозия);<\/li><li><strong>управление критичными запасными частями<\/strong>.<\/li><\/ul>\n<p><strong>Планирование ТОиР:<\/strong> заявки → планирование → график → выполнение → закрытие с фиксацией причины. Системы: <strong>SAP PM<\/strong>, <strong>IBM Maximo<\/strong>, 1С:ТОиР и другие (CMMS/EAM).<\/p>\n<p><strong>Остановочные ремонты<\/strong> (shutdowns, turnarounds) — плановые остановки завода для крупных работ; отдельная дисциплина планирования, подрядчиков и безопасности.<\/p>\n<h3>1.4 KPI производственных систем<\/h3>\n<ul><li><strong>OEE<\/strong> (общая эффективность оборудования) = готовность × производительность × качество.<\/li><li><strong>MTBF<\/strong> (наработка на отказ), <strong>MTTR<\/strong> (среднее время восстановления).<\/li><li><strong>Доля плановых работ<\/strong> (planned vs. reactive), <strong>выполнение графика ППР<\/strong> (PM compliance), <strong>отставание по заявкам<\/strong> (backlog).<\/li><li><strong>Затраты на ТОиР<\/strong> к стоимости замещения активов или на тонну продукции.<\/li><li><strong>Время работы АСУ ТП<\/strong>, доля контуров в автоматическом режиме, число аварийных сигналов на оператора в час (alarm rate).<\/li><\/ul>\n<h3>1.5 Особенности СНГ и «двойная школа»<\/h3>\n<ul><li><strong>ППР<\/strong> — сильная дисциплина графиков, но часто без анализа надёжности и с избыточными ремонтами.<\/li><li><strong>КИПиА, АСУ ТП<\/strong> — отдельные службы; на старых предприятиях — смесь советских приборов и современных систем.<\/li><li><strong>Документация и нормы<\/strong>: ГОСТ, правила промышленной безопасности, допуски.<\/li><li><strong>1С<\/strong> — массовая ERP и учётная система в СНГ; SAP — у крупных компаний.<\/li><li>Ценнейший кандидат — <strong>«двуязычный»<\/strong>: знает дисциплину ППР и внедрял современные подходы (диагностика, RCM, CMMS) с измеримым эффектом.<\/li><\/ul>\n<h3>1.6 Что это значит для TMK [Аналитика]<\/h3>\n<ul><li><strong>Новые переделы<\/strong> (гидрометаллургия APT, РЗЭ, серная кислота, порошковая металлургия) требуют <strong>РСУ, историков данных и MES<\/strong> с первого дня. Ошибки в архитектуре АСУ ТП дорого исправлять после пуска.<\/li><li><strong>Smart Powder<\/strong> (автокомпоненты) — <strong>MES и прослеживаемость партий<\/strong> обязательны для автопрома.<\/li><li><strong>TMK Chemicals<\/strong> (серная кислота) — опасный химический процесс: РСУ, система противоаварийной защиты (ПАЗ / SIS), высокие требования к КИПиА.<\/li><li><strong>Нанимать рано:<\/strong> руководитель АСУ ТП и главный механик — участники проекта за 12–18 месяцев до пуска (см. День 5).<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Автоматизированная система управления технологическим процессом (АСУ ТП)<\/td><td>Process control system / industrial automation<\/td><td>Системы управления производством<\/td><\/tr><tr><td>Контрольно-измерительные приборы и автоматика (КИПиА)<\/td><td>Instrumentation and control (I&amp;C)<\/td><td>Датчики, приборы, исполнительные механизмы<\/td><\/tr><tr><td>Программируемый логический контроллер<\/td><td>PLC (programmable logic controller)<\/td><td>Контроллер управления машинами и участками<\/td><\/tr><tr><td>Распределённая система управления<\/td><td>DCS (distributed control system)<\/td><td>Система управления непрерывным процессом<\/td><\/tr><tr><td>Диспетчерская система<\/td><td>SCADA<\/td><td>Сбор данных и диспетчерское управление<\/td><\/tr><tr><td>Человеко-машинный интерфейс<\/td><td>HMI<\/td><td>Экраны операторов<\/td><\/tr><tr><td>Продвинутое управление процессом<\/td><td>Advanced process control (APC)<\/td><td>Многомерная оптимизация процесса<\/td><\/tr><tr><td>Система противоаварийной защиты (ПАЗ)<\/td><td>Safety instrumented system (SIS)<\/td><td>Автоматическая защита от аварий<\/td><\/tr><tr><td>Историк данных<\/td><td>Data historian<\/td><td>Хранилище временных рядов параметров<\/td><\/tr><tr><td>Система управления производством<\/td><td>MES (manufacturing execution system)<\/td><td>Учёт и управление на уровне цеха<\/td><\/tr><tr><td>Система управления предприятием<\/td><td>ERP<\/td><td>Финансы, закупки, кадры, продажи<\/td><\/tr><tr><td>Цифровой двойник<\/td><td>Digital twin<\/td><td>Модель процесса или оборудования<\/td><\/tr><tr><td>Промышленный интернет вещей<\/td><td>Industrial IoT (IIoT)<\/td><td>Сеть датчиков и устройств<\/td><\/tr><tr><td>Кибербезопасность АСУ ТП<\/td><td>OT cybersecurity (IEC 62443)<\/td><td>Защита технологических систем<\/td><\/tr><tr><td>Техническое обслуживание и ремонт (ТОиР)<\/td><td>Maintenance<\/td><td>Обслуживание и ремонт оборудования<\/td><\/tr><tr><td>Планово-предупредительный ремонт (ППР)<\/td><td>Preventive maintenance<\/td><td>Ремонты по графику<\/td><\/tr><tr><td>Обслуживание по состоянию<\/td><td>Condition-based maintenance<\/td><td>Ремонт по признакам деградации<\/td><\/tr><tr><td>Предиктивное обслуживание<\/td><td>Predictive maintenance<\/td><td>Ремонт по прогнозу отказа<\/td><\/tr><tr><td>Обслуживание, ориентированное на надёжность<\/td><td>Reliability-centered maintenance (RCM)<\/td><td>Выбор стратегии по последствиям отказов<\/td><\/tr><tr><td>Анализ видов и последствий отказов<\/td><td>FMEA<\/td><td>Систематический анализ отказов<\/td><\/tr><tr><td>Анализ корневых причин<\/td><td>Root cause analysis (RCA)<\/td><td>Поиск первопричины отказа<\/td><\/tr><tr><td>Вибродиагностика<\/td><td>Vibration analysis<\/td><td>Диагностика вращающегося оборудования<\/td><\/tr><tr><td>Система управления ТОиР<\/td><td>CMMS / EAM<\/td><td>SAP PM, IBM Maximo и др.<\/td><\/tr><tr><td>Остановочный ремонт<\/td><td>Shutdown / turnaround<\/td><td>Плановая остановка для крупных работ<\/td><\/tr><tr><td>Общая эффективность оборудования<\/td><td>Overall equipment effectiveness (OEE)<\/td><td>Готовность × производительность × качество<\/td><\/tr><tr><td>Наработка на отказ<\/td><td>Mean time between failures (MTBF)<\/td><td>Средняя наработка между отказами<\/td><\/tr><tr><td>Среднее время восстановления<\/td><td>Mean time to repair (MTTR)<\/td><td>Среднее время ремонта<\/td><\/tr><tr><td>Выполнение графика ППР<\/td><td>PM compliance<\/td><td>Доля выполненных плановых работ<\/td><\/tr><tr><td>Отставание по заявкам<\/td><td>Maintenance backlog<\/td><td>Объём невыполненных работ<\/td><\/tr><tr><td>Частота аварийных сигналов<\/td><td>Alarm rate<\/td><td>Число сигналов оператору в час<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Руководитель АСУ ТП<\/td><td>Head of Automation / Process Control Manager<\/td><td>Архитектура систем, проекты внедрения РСУ, команда<\/td><td>★★<\/td><\/tr><tr><td>Инженер АСУ ТП / APC<\/td><td>Process Control / APC Engineer<\/td><td>Контуры, APC-проекты с эффектом в цифрах<\/td><td>★★<\/td><\/tr><tr><td>Инженер КИПиА<\/td><td>Instrumentation Engineer<\/td><td>Анализаторы, калибровки, взрывозащита<\/td><td>★<\/td><\/tr><tr><td>Главный механик / руководитель ТОиР<\/td><td>Head of Maintenance / Maintenance Manager<\/td><td>Бюджет, численность, переход к RCM, KPI<\/td><td>★★<\/td><\/tr><tr><td>Инженер по надёжности<\/td><td>Reliability Engineer<\/td><td>FMEA, RCA, Вейбулл, снижение отказов в цифрах<\/td><td>★★<\/td><\/tr><tr><td>Планировщик ТОиР<\/td><td>Maintenance Planner / Scheduler<\/td><td>CMMS, планы, остановочные ремонты<\/td><td>★<\/td><\/tr><tr><td>Руководитель остановочных ремонтов<\/td><td>Shutdown / Turnaround Manager<\/td><td>Масштаб остановок (дни, люди, бюджет), безопасность<\/td><td>★★<\/td><\/tr><tr><td>Инженер по кибербезопасности АСУ ТП<\/td><td>OT Security Engineer<\/td><td>IEC 62443, сегментация сетей, инциденты<\/td><td>★★★<\/td><\/tr><tr><td>Инженер MES / аналитик данных<\/td><td>MES Engineer / Industrial Data Scientist<\/td><td>Внедрённые системы и модели с пользователями<\/td><td>★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>(Главный механик) «Как изменились MTBF, доля плановых работ и затраты на ТОиР при вас?»<\/td><td>Цифры «было → стало» и конкретные меры<\/td><td>«Мы всё выполняли по графику ППР»<\/td><\/tr><tr><td>«Расскажите о самом дорогом отказе и анализе его причин»<\/td><td>RCA, найденная первопричина, изменения в системе<\/td><td>Виноват поставщик или оператор, без системных выводов<\/td><\/tr><tr><td>«Какую CMMS вы использовали и что в ней реально работало?»<\/td><td>Система, дисциплина заявок, отчёты, KPI<\/td><td>«Была, но пользовались мало»<\/td><\/tr><tr><td>(АСУ ТП) «Какую РСУ вы внедряли, сколько входов-выходов, какие были проблемы при пуске?»<\/td><td>Платформа, масштаб, проблемы и решения<\/td><td>Только эксплуатация чужих настроек<\/td><\/tr><tr><td>(APC / цифровые проекты) «Какой измеримый эффект дал ваш проект и кто им пользуется сейчас?»<\/td><td>Проценты, тонны, деньги; проект живёт после внедрения<\/td><td>«Сделали пилот, показали руководству»<\/td><\/tr><tr><td>(OT security) «Как была устроена сегментация технологической сети?»<\/td><td>Зоны и каналы, DMZ, удалённый доступ, мониторинг<\/td><td>Общие слова об антивирусах<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<ul><li><strong>Горные и металлургические компании<\/strong> с сильными программами надёжности (крупные медные, золотые, алюминиевые предприятия; АГМК, НГМК, предприятия Казахстана).<\/li><li><strong>Химия и нефтехимия<\/strong> — сильнейшая школа РСУ, ПАЗ и остановочных ремонтов; для TMK Chemicals и гидрометаллургии особенно релевантна.<\/li><li><strong>Интеграторы и производители систем<\/strong> (ABB, Siemens, Emerson, Honeywell, Yokogawa, Schneider) и их партнёры в регионе.<\/li><li><strong>Автокомпоненты<\/strong> (для Smart Powder): MES, прослеживаемость, OEE.<\/li><li><strong>Сервисные компании по диагностике<\/strong> — вибродиагностика, анализ масел.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (20 мин). Пирамида автоматизации TMK.<\/strong> Нарисуйте пять уровней для одного передела (например, гидрометаллургия APT или Smart Powder). На каждом уровне укажите системы и роли (RU / EN).<\/p>\n<p><strong>Задание 2 (20 мин). Профиль позиции<\/strong> «Главный механик / Head of Maintenance &amp; Reliability — новый гидрометаллургический передел TMK»:<\/p>\n<ul><li>результаты на 12 месяцев (до и после пуска);<\/li><li>must-have (5), включая опыт пуска и переход от ППР к стратегии по надёжности;<\/li><li>6 вопросов скрининга;<\/li><li>8 компаний-доноров.<\/li><\/ul>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какая роль из блока 3.1 для TMK, по-вашему, самая недооценённая?<\/li><li>Какой вопрос из блока 3.2 вы зададите на ближайшем интервью с техническим кандидатом?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 20: охрана труда, ESG и прослеживаемость. Финал модуля».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы можете объяснить нанимающему менеджеру, почему главного механика нанимают до пуска, а не после первой аварии. Такой аргумент экономит компании месяцы простоя.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Стандарт ISA-95 (обзорные материалы ISA) — уровни производственных систем.<\/li><li>J. Moubray, <em>Reliability-Centered Maintenance<\/em> — классика RCM.<\/li><li>Материалы SMRP (Society for Maintenance &amp; Reliability Professionals) о метриках ТОиР.<\/li><li>Видео: «ISA-95 automation pyramid», «DCS vs PLC», «reliability centered maintenance explained».<\/li><\/ul>"},{"n":20,"module":4,"title":"Охрана труда, промышленная безопасность, ESG и прослеживаемость","file":"module-04-equipment-lab-production-systems/day-20-hse-esg-traceability.md","duration":"4 часа","challenge":"Составить <strong>«карту обязательных компетенций по безопасности и ESG»<\/strong> для трёх объектов TMK — гидрометаллургического передела, TMK Chemicals и вольфрамового рудника — и пройти итоговый тест модуля.","why":"В химии и металлургии TMK есть водород, серная кислота, автоклавы, взрывчатка под землёй, радиоактивность в РЗЭ-потоках. Одна серьёзная авария останавливает проект, а иногда и всю компанию. Западные покупатели и банки требуют ESG-отчётности и прослеживаемости. Руководители охраны труда, промышленной безопасности и ESG — роли, где ошибка найма стоит жизней и контрактов.","checklist":[{"text":"Разминка: 5 вопросов по Дням 17–19 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Кейс-финал: карта компетенций по безопасности и ESG (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Итоговый тест модуля 4 ≥ 16/20 — см. <a href=\"#module-4\">README модуля<\/a> (20 мин)","minutes":20},{"text":"Teach-back: 10 минут объясняете коллеге, зачем TMK нужны специалисты по промышленной безопасности и ESG","minutes":0},{"text":"Рефлексия (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Кейс и итоговый тест модуля — до начала Модуля 5.","terms":[{"ru":"Охрана труда","en":"Occupational health and safety (OHS)","def":"Защита здоровья и безопасности работников"},{"ru":"Промышленная (процессная) безопасность","en":"Process safety","def":"Предотвращение крупных аварий"},{"ru":"Иерархия мер защиты","en":"Hierarchy of controls","def":"От устранения опасности до СИЗ"},{"ru":"Средства индивидуальной защиты (СИЗ)","en":"Personal protective equipment (PPE)","def":"Последний рубеж защиты"},{"ru":"Критическая мера контроля","en":"Critical control","def":"Мера, предотвращающая смертельный исход"},{"ru":"Частота травм с потерей времени","en":"LTIFR","def":"Травмы с потерей рабочего времени на 1 млн часов"},{"ru":"Частота регистрируемых травм","en":"TRIFR","def":"Все регистрируемые травмы на 1 млн часов"},{"ru":"Почти случившееся происшествие","en":"Near miss","def":"Событие без последствий, которое могло их иметь"},{"ru":"Право остановить работу","en":"Stop work authority","def":"Право любого работника остановить опасную работу"},{"ru":"Идентификация опасностей","en":"HAZID","def":"Ранний анализ опасностей проекта"},{"ru":"Анализ опасностей и работоспособности","en":"HAZOP","def":"Разбор отклонений процесса по узлам"},{"ru":"Анализ слоёв защиты","en":"LOPA","def":"Оценка достаточности защит"},{"ru":"Уровень полноты безопасности","en":"Safety integrity level (SIL)","def":"Требование к надёжности ПАЗ"},{"ru":"Управление изменениями","en":"Management of change (MOC)","def":"Анализ рисков любых изменений"},{"ru":"Сосуд под давлением","en":"Pressure vessel","def":"Автоклавы, ресиверы и др."},{"ru":"Оценка воздействия на окружающую среду","en":"ESIA / EIA (ОВОС)","def":"Экологическая и социальная оценка проекта"},{"ru":"План закрытия","en":"Closure plan","def":"План вывода объекта и рекультивации"},{"ru":"Устойчивое развитие","en":"Sustainability","def":"Учёт экологических, социальных и управленческих факторов"},{"ru":"Стандарты деятельности IFC","en":"IFC Performance Standards","def":"Экологические и социальные требования к проектам"},{"ru":"Принципы экватора","en":"Equator Principles","def":"Требования банков к финансированию проектов"},{"ru":"Отчётность об устойчивом развитии","en":"Sustainability reporting (GRI, ISSB)","def":"Раскрытие ESG-информации"},{"ru":"Выбросы парниковых газов (охваты 1–3)","en":"GHG emissions (Scope 1, 2, 3)","def":"Прямые, энергетические и цепочечные выбросы"},{"ru":"Социальная лицензия","en":"Social licence to operate","def":"Согласие местных сообществ"},{"ru":"Прослеживаемость","en":"Traceability","def":"Подтверждение происхождения сырья"},{"ru":"Комплексная проверка цепочки поставок","en":"Supply chain due diligence","def":"Проверка рисков у поставщиков"},{"ru":"Процесс подтверждения ответственных минералов","en":"RMAP (Responsible Minerals Assurance Process)","def":"Аудит перерабатывающих предприятий RMI"},{"ru":"Шаблон отчётности по конфликтным минералам","en":"CMRT","def":"Раскрытие источников 3TG"},{"ru":"Экспортный контроль","en":"Export control","def":"Ограничения на экспорт товаров и технологий"},{"ru":"Товары двойного назначения","en":"Dual-use goods","def":"Товары гражданского и военного применения"},{"ru":"Санкционный комплаенс","en":"Sanctions compliance","def":"Соблюдение санкционных режимов"}],"quiz":[{"q":"Почему низкий LTIFR не гарантирует отсутствия крупной аварии?","options":["LTIFR учитывает только аварии с погибшими, а мелкие травмы и происшествия в него вообще не входят","Крупные аварии предотвращают отдельные системы процессной безопасности, их не видно в частоте травм","LTIFR считают только для подрядчиков, а свой персонал в нём не учитывается","Крупные аварии происходят только на рудниках, а не на химических заводах"],"answer":1,"explain
