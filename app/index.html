нологи по процессам (process specialists).<\/li><li><strong>Лаборатории технологических испытаний:<\/strong> SGS (Лейкфилд, Канада), ALS Metallurgy, Bureau Veritas, Mintek, JKTech.<\/li><li><strong>Университеты:<\/strong> JKMRC (Квинсленд), Camborne School of Mines, McGill, UBC, TU Bergakademie Freiberg, НИТУ МИСИС, Горный университет (Санкт-Петербург), ТашГТУ, НГГТУ.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Схема фабрики.<\/strong> Нарисуйте от руки схему: дробление → измельчение (SAG + шаровая мельница с гидроциклонами) → флотация → сгущение и фильтрация → концентрат; хвосты → хвостохранилище. Подпишите аппараты по-русски и по-английски. Отметьте, где стоят ключевые роли (кто отвечает за какой участок).<\/p>\n<p><strong>Задание 2 (10 мин). Вопросы для интервью.<\/strong> Подготовьте 7 вопросов для позиции «Начальник обогатительной фабрики (вольфрам, переработка техногенного сырья)». К каждому — маркер сильного ответа.<\/p>\n<p><strong>Бонус.<\/strong> Спросите технолога Ингичкинской фабрики или технолога TMK: «Какое извлечение сейчас и где основные потери?». Сверьте с теорией.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Объясните формулу извлечения своими словами за 30 секунд.<\/li><li>Какой один вопрос вы теперь обязательно зададите любому обогатителю?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 7: флотация, гравитация, магнитная сепарация».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы только что сделали то, чего боятся многие HR, — посчитали технологический баланс. Цифры перестали быть страшными. Завтра вы узнаете, как именно фабрика отделяет шеелит от кальцита. Это одна из самых тонких задач обогащения в мире.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>B. A. Wills, J. A. Finch, <em>Wills' Mineral Processing Technology<\/em> — главный учебник по обогащению в мире.<\/li><li>Авдохин В. М. «Основы обогащения полезных ископаемых» (МГГУ) — учебник советской и российской школы.<\/li><li><a href=\"https://www.911metallurgist.com\" target=\"_blank\" rel=\"noopener\">911metallurgist.com<\/a> — тысячи практических статей по обогащению.<\/li><li><a href=\"https://www.ceecthefuture.org\" target=\"_blank\" rel=\"noopener\">CEEC<\/a> — материалы по энергоэффективному измельчению.<\/li><li>Видео: «SAG mill animation», «hydrocyclone how it works», «HPGR explained»; каналы Metso, FLSmidth, Weir Minerals.<\/li><\/ul>"},{"n":7,"module":2,"title":"Методы обогащения: флотация, гравитация, магнитная сепарация","file":"module-02-processing-metallurgy/day-07-flotation-gravity-magnetic.md","duration":"3,5 часа","challenge":"Для каждого из пяти видов сырья TMK (шеелит, вольфрамит, молибденит, графит, сподумен) за одну минуту назвать <strong>главный метод обогащения и главную технологическую проблему<\/strong>. Без шпаргалки.","why":"Флотатор медно-порфировой фабрики и флотатор шеелита используют одну машину, но разную химию. Если вы знаете, что шеелит флотируют жирными кислотами и мучаются с кальцитом и флюоритом, вы найдёте одного нужного эксперта среди тысячи «флотаторов». Это и есть точность поиска.","checklist":[{"text":"Разминка: 5 вопросов по Дню 6 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.5 (90 мин)","minutes":90},{"text":"Видео: флотационная машина, концентрационный стол, сепаратор (15 мин)","minutes":15},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: матрица «сырьё → метод → проблема → эксперт» (25 мин)","minutes":25},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блок 1.1 и таблица 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Флотация","en":"Froth flotation","def":"Разделение по смачиваемости поверхности с помощью пузырьков воздуха"},{"ru":"Гидрофобный","en":"Hydrophobic","def":"Не смачиваемый водой, прилипает к пузырькам"},{"ru":"Гидрофильный","en":"Hydrophilic","def":"Смачиваемый водой, остаётся в пульпе"},{"ru":"Собиратель","en":"Collector","def":"Реагент, делающий минерал гидрофобным"},{"ru":"Пенообразователь","en":"Frother","def":"Реагент для устойчивой пены"},{"ru":"Депрессор","en":"Depressant","def":"Реагент, подавляющий флотацию ненужного минерала"},{"ru":"Активатор","en":"Activator","def":"Реагент, усиливающий флотацию нужного минерала"},{"ru":"Регулятор среды","en":"pH modifier","def":"Реагент для задания pH"},{"ru":"Ксантогенат","en":"Xanthate","def":"Классический собиратель для сульфидов"},{"ru":"Жирные кислоты","en":"Fatty acids","def":"Собиратели для шеелита, флюорита, апатита, сподумена"},{"ru":"Гидроксамовые кислоты","en":"Hydroxamates","def":"Собиратели для вольфрамита, касситерита, РЗЭ"},{"ru":"Жидкое стекло","en":"Sodium silicate / water glass","def":"Депрессор кальцита, флюорита, силикатов"},{"ru":"Основная флотация","en":"Rougher flotation","def":"Первая стадия флотации"},{"ru":"Контрольная флотация","en":"Scavenger flotation","def":"Доизвлечение из хвостов основной флотации"},{"ru":"Перечистка","en":"Cleaner flotation","def":"Повышение качества концентрата"},{"ru":"Флотационная колонна","en":"Flotation column","def":"Аппарат для перечисток с чистым концентратом"},{"ru":"Коллективная флотация","en":"Bulk flotation","def":"Совместная флотация нескольких минералов"},{"ru":"Селективная флотация","en":"Selective flotation","def":"Разделение минералов друг от друга"},{"ru":"Процесс Петрова","en":"Petrov process","def":"Доводка шеелитового концентрата с прогревом и жидким стеклом"},{"ru":"Гравитационное обогащение","en":"Gravity separation","def":"Разделение по плотности"},{"ru":"Отсадочная машина","en":"Jig","def":"Гравитационный аппарат с пульсирующим потоком воды"},{"ru":"Винтовой сепаратор","en":"Spiral concentrator","def":"Гравитационный аппарат со спиральным жёлобом"},{"ru":"Концентрационный стол","en":"Shaking table","def":"Гравитационный аппарат с колеблющейся декой"},{"ru":"Центробежный концентратор","en":"Centrifugal concentrator","def":"Гравитация в центробежном поле (Knelson, Falcon)"},{"ru":"Обогащение в тяжёлых средах","en":"Dense media separation (DMS)","def":"Разделение в суспензии заданной плотности"},{"ru":"Магнитная сепарация","en":"Magnetic separation","def":"Разделение по магнитной восприимчивости"},{"ru":"Сепаратор сильного поля","en":"WHIMS / high-intensity magnetic separator","def":"Для слабомагнитных минералов"},{"ru":"Парамагнитный","en":"Paramagnetic","def":"Слабомагнитный (вольфрамит, монацит)"},{"ru":"Электростатическая сепарация","en":"Electrostatic separation","def":"Разделение по электропроводности"},{"ru":"Рентгенорадиометрическая сортировка","en":"XRT sensor-based sorting","def":"Сортировка кусков руды по рентгеновскому сигналу"},{"ru":"Обесшламливание","en":"Desliming","def":"Удаление тонких шламов перед обогащением"}],"quiz":[{"q":"Какое свойство поверхности использует флотация?","options":["Плотность","Гидрофобность (несмачиваемость водой)","Цвет","Магнитность"],"answer":1,"explain":"Гидрофобные частицы прилипают к пузырькам и выносятся в пену. Реагенты управляют гидрофобностью минералов."},{"q":"Главная сложность флотации шеелита:","options":["Шеелит слишком лёгкий","Шеелит радиоактивен","Шеелит растворяется в воде","Отделение от кальцита, флюорита и апатита — кальциевых минералов со схожей поверхностной химией"],"answer":3,"explain":"Жирные кислоты собирают все кальциевые минералы. Для селективности используют жидкое стекло, прогрев (процесс Петрова) и многостадийные перечистки."},{"q":"Какой реагент подавляет медные минералы при флотации молибденита из коллективного Cu–Mo концентрата?","options":["Гидросульфид натрия (NaHS)","Ксантогенат","Жирная кислота","MIBC"],"answer":0,"explain":"NaHS подавляет сульфиды меди, а молибденит, природно гидрофобный, флотируется аполярным собирателем."},{"q":"Почему вольфрамит отделяют от касситерита магнитной сепарацией?","options":["Касситерит сильно магнитен","Вольфрамит парамагнитен, касситерит практически немагнитен","Оба немагнитны, но разного цвета","Это делают флотацией, а не магнитной сепарацией"],"answer":1,"explain":"Вольфрамит содержит Fe и Mn и поэтому слабомагнитен. Его выделяют сепараторами сильного поля."},{"q":"Каким методом обычно обогащают крупный класс сподуменовой руды?","options":["В тяжёлых средах (DMS)","Флотацией с ксантогенатом","Цианированием","Электролизом"],"answer":0,"explain":"Сподумен (≈ 3,1–3,2 г/см³) тяжелее кварца и полевых шпатов (≈ 2,6–2,7). Суспензия ферросилиция заданной плотности разделяет их."},{"q":"Почему при обогащении графита делают много перечисток с мягким доизмельчением?","options":["Графит тяжёлый и плохо флотируется","Этого требует JORC","Чтобы увеличить расход реагентов","Чтобы получить чистый концентрат, не разрушив крупную чешую, которая стоит дороже"],"answer":3,"explain":"Цена графита сильно зависит от размера чешуи. Агрессивное измельчение разрушает чешую."},{"q":"Критерий гравитационного обогащения для пары «вольфрамит — кварц» в воде ≈ 3,8. Что это значит?","options":["Разделение невозможно","Нужна только флотация","Разделение по плотности эффективно, кроме очень тонких классов","Вольфрамит легче кварца"],"answer":2,"explain":"При критерии больше 2,5 гравитация работает хорошо. Проблема — тонкие шламы, где гравитация теряет эффективность."},{"q":"Какой тип сортировки особенно хорош для вольфрамовых руд?","options":["По цвету","Рентгенорадиометрическая (XRT) и УФ-сортировка","По весу куска","По запаху"],"answer":1,"explain":"Вольфрам с высоким атомным номером хорошо виден в рентгеновском диапазоне, а шеелит люминесцирует под УФ."},{"q":"Кандидат 15 лет работал флотатором на медной фабрике (ксантогенаты, известь). Для флотации шеелита это:","options":["Идеальный опыт","Опыт не имеет значения","Опыт другого «мира» флотации; нужны доказательства работы с несульфидными (солевыми) минералами","Лучше, чем опыт по шеелиту"],"answer":2,"explain":"Принципы общие, но химия и проблемы другие. Без опыта с несульфидными минералами это кандидат на обучение, а не готовый эксперт."},{"q":"Какие минералы на минеральных песках разделяют электростатической сепарацией?","options":["Проводники (ильменит, рутил) от непроводников (циркон, монацит)","Шеелит от кальцита","Графит от кварца","Сподумен от слюды"],"answer":0,"explain":"Электростатическая сепарация — стандартный передел на заводах минеральных песков, вместе с магнитной сепарацией."}],"html":"<h2>0. Разминка: вспомнить День 6<\/h2>\n<ol><li>Запишите формулу извлечения через содержания f, c, t.<\/li><li>Что такое P80 и почему он важен?<\/li><li>Что такое раскрытие минералов?<\/li><li>Почему для вольфрама опасно переизмельчение?<\/li><li>Что такое GISTM и почему он появился?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>R = c · (f − t) / [f · (c − t)] × 100%.<\/li><li>Размер, мельче которого 80% массы продукта. Определяет раскрытие и показатели обогащения.<\/li><li>Освобождение зёрен ценного минерала от сростков с пустой породой за счёт измельчения.<\/li><li>Хрупкие минералы уходят в тонкие шламы, которые плохо улавливаются: растут потери.<\/li><li>Глобальный стандарт управления хвостохранилищами (2020), принят после аварий, в первую очередь в Брумадинью (2019).<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Флотация (froth flotation)<\/h3>\n<p><strong>Принцип.<\/strong> В пульпу с реагентами подают воздух. Частицы с <strong>гидрофобной<\/strong> (несмачиваемой) поверхностью прилипают к пузырькам и выносятся в пену — это концентрат. <strong>Гидрофильные<\/strong> частицы остаются в пульпе — это хвосты. Флотация — самый распространённый метод обогащения в мире, ею перерабатывают миллиарды тонн руды в год.<\/p>\n<p><strong>Реагенты<\/strong> — это «химия флотации», в ней и заключается экспертиза:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Класс<\/th><th>Функция<\/th><th>Примеры<\/th><\/tr><\/thead><tbody><tr><td><strong>Собиратели<\/strong> (collectors)<\/td><td>Делают поверхность нужного минерала гидрофобной<\/td><td>Ксантогенаты и дитиофосфаты (сульфиды Cu, Mo, Ni, Pb, Zn); <strong>жирные кислоты<\/strong> — олеиновая кислота, талловое масло (шеелит, флюорит, апатит, сподумен); <strong>гидроксаматы<\/strong> (вольфрамит, касситерит, минералы РЗЭ); амины (силикаты, обратная флотация); аполярные масла — керосин, дизельное топливо (молибденит, графит)<\/td><\/tr><tr><td><strong>Пенообразователи<\/strong> (frothers)<\/td><td>Создают устойчивую пену<\/td><td>MIBC (метилизобутилкарбинол), полигликоли, сосновое масло<\/td><\/tr><tr><td><strong>Депрессоры<\/strong> (depressants)<\/td><td>Подавляют флотацию ненужных минералов<\/td><td><strong>Жидкое стекло<\/strong> (силикат натрия) — для кальцита, флюорита, силикатов; крахмал, декстрин; КМЦ (для талька); <strong>гидросульфид натрия NaHS<\/strong> — подавляет медные сульфиды при разделении Cu–Mo<\/td><\/tr><tr><td><strong>Активаторы<\/strong> (activators)<\/td><td>Усиливают флотацию нужного минерала<\/td><td>Медный купорос (сфалерит); нитрат свинца (вольфрамит и шеелит с гидроксаматами — китайская практика)<\/td><\/tr><tr><td><strong>Регуляторы среды<\/strong> (pH modifiers)<\/td><td>Задают pH<\/td><td>Известь, сода, NaOH, серная кислота<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Оборудование:<\/strong><\/p>\n<ul><li><strong>механические флотомашины<\/strong> (Metso TankCell, FLSmidth и др.) — объём камер до сотен м³;<\/li><li><strong>флотационные колонны<\/strong> (column flotation) — для перечисток, чище концентрат;<\/li><li><strong>пневматические машины<\/strong> — Jameson Cell (Glencore Technology), Concorde Cell (Metso);<\/li><li><strong>флотация крупных частиц<\/strong> — Eriez HydroFloat.<\/li><\/ul>\n<p><strong>Схема флотации:<\/strong><\/p>\n<pre class=\"code\"><code>Питание → ОСНОВНАЯ (rougher) → черновой концентрат → [доизмельчение] → ПЕРЕЧИСТКИ (cleaner 1, 2, 3…) → КОНЦЕНТРАТ\n                ↓\n           КОНТРОЛЬНАЯ (scavenger) → ХВОСТЫ\n                ↑ промпродукты возвращаются в цикл<\/code><\/pre>\n<p><strong>Ключевые случаи для TMK:<\/strong><\/p>\n<ol><li><strong>Разделение медно-молибденового концентрата<\/strong> (АГМК → молибденовое сырьё). Сначала коллективная Cu–Mo флотация. Затем медные минералы подавляют гидросульфидом натрия (NaHS), а молибденит флотируют аполярным собирателем (керосин или дизель) с несколькими перечистками, часто в колоннах. Результат — молибденовый концентрат (обычно 45–55% Mo) и медный концентрат. Это источник молибдена <strong>и рения<\/strong> для Чирчика.<\/li><\/ol>\n<ol><li><strong>Флотация шеелита — одна из самых сложных задач обогащения.<\/strong> Шеелит, кальцит, флюорит и апатит — кальциевые минералы с похожей поверхностной химией. Жирные кислоты «цепляются» за все сразу. Классическое решение — <strong>процесс Петрова<\/strong>: черновой концентрат с высоким расходом жидкого стекла прогревают (около 80–90 °C) и перемешивают. Собиратель снимается с кальцита и флюорита, но остаётся на шеелите. Технолог, который реально вёл процесс Петрова или его современные аналоги, — редкий специалист.<\/li><\/ol>\n<ol><li><strong>Вольфрамит.<\/strong> Сначала гравитация (он тяжёлый). Затем магнитная сепарация. Тонкие классы доизвлекают флотацией с гидроксаматами и солями свинца (китайская практика).<\/li><\/ol>\n<ol><li><strong>Графит.<\/strong> Природно гидрофобен, флотируется керосином и пенообразователем. Главная тонкость — <strong>сохранить крупную чешую<\/strong>: крупночешуйчатый графит стоит дороже. Поэтому доизмельчение мягкое (в перемешивающих мельницах), а перечисток много: нередко 5–8 стадий. Концентрат — 94–97% C. Для анодов батарей нужна дальнейшая очистка до ≥ 99,95% C.<\/li><\/ol>\n<ol><li><strong>Сподумен.<\/strong> Мелкие классы флотируют жирными кислотами после обесшламливания. Крупные классы обогащают в тяжёлых средах (см. 1.2). Железосодержащие примеси удаляют магнитной сепарацией: покупатели жёстко ограничивают содержание Fe₂O₃.<\/li><\/ol>\n<ol><li><strong>Минералы РЗЭ.<\/strong> Бастнезит флотируют гидроксаматами или жирными кислотами при повышенной температуре (Маунтин-Пасс). Монацит и ксенотим из россыпей выделяют гравитацией, магнитной и электростатической сепарацией.<\/li><\/ol>\n<h3>1.2 Гравитационное обогащение (gravity separation)<\/h3>\n<p><strong>Принцип.<\/strong> Разделение по <strong>плотности<\/strong> (и крупности) в потоке воды или в тяжёлой среде. Метод дешёвый, без реагентов, поэтому его любят в начале схемы.<\/p>\n<p><strong>Критерий эффективности:<\/strong> CC = (ρ тяжёлого − ρ среды) / (ρ лёгкого − ρ среды). Если CC &gt; 2,5, разделение лёгкое даже для довольно мелких частиц. Пример: шеелит (6,1) против кварца (2,65) в воде (1,0): (6,1 − 1) / (2,65 − 1) ≈ 3,1. Вольфрамит (≈ 7,3) — ≈ 3,8. Поэтому вольфрам традиционно начинают обогащать гравитацией.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Аппарат<\/th><th>Принцип<\/th><th>Применение<\/th><\/tr><\/thead><tbody><tr><td><strong>Отсадочные машины<\/strong> (jigs)<\/td><td>Пульсирующий поток воды расслаивает частицы<\/td><td>Крупные классы W, Sn, Au, уголь<\/td><\/tr><tr><td><strong>Винтовые сепараторы<\/strong> (spirals)<\/td><td>Поток по спиральному жёлобу<\/td><td>Минеральные пески, хромит, W, Sn<\/td><\/tr><tr><td><strong>Концентрационные столы<\/strong> (shaking tables)<\/td><td>Колеблющаяся дека с рифлями<\/td><td>Доводка концентратов W, Sn, Au, Ta<\/td><\/tr><tr><td><strong>Центробежные концентраторы<\/strong> (Knelson, Falcon)<\/td><td>Усиленная гравитация в центробежном поле<\/td><td>Тонкое золото, тонкие классы W и Sn<\/td><\/tr><tr><td><strong>Обогащение в тяжёлых средах<\/strong> (DMS — dense media separation)<\/td><td>Суспензия ферросилиция заданной плотности: лёгкое всплывает, тяжёлое тонет<\/td><td><strong>Сподумен<\/strong> (SC6), алмазы, уголь, предобогащение<\/td><\/tr><tr><td>Шлюзы, конусы Райхерта, мультигравитационный сепаратор<\/td><td>—<\/td><td>Россыпи, тонкие классы<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Проблема тонких классов:<\/strong> гравитация плохо работает на частицах мельче примерно 20–40 мкм. Вольфрамовые шламы уходят в хвосты, поэтому схемы комбинированные: гравитация + флотация.<\/p>\n<h3>1.3 Магнитная и электростатическая сепарация<\/h3>\n<p><strong>Магнитные свойства минералов:<\/strong><\/p>\n<ul><li><strong>ферромагнитные<\/strong> (сильномагнитные): магнетит, пирротин;<\/li><li><strong>парамагнитные<\/strong> (слабомагнитные): ильменит, гематит, <strong>вольфрамит<\/strong>, <strong>монацит<\/strong>, ксенотим, гранат;<\/li><li><strong>диамагнитные<\/strong> (немагнитные): кварц, кальцит, <strong>шеелит<\/strong>, касситерит, циркон.<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>Аппарат<\/th><th>Поле<\/th><th>Применение<\/th><\/tr><\/thead><tbody><tr><td>Барабанные сепараторы слабого поля (LIMS)<\/td><td>Слабое (≈ 0,1–0,3 Тл)<\/td><td>Магнетит, удаление стального скрапа<\/td><\/tr><tr><td>Мокрые сепараторы сильного поля (WHIMS), высокоградиентные (HGMS; например, китайские SLon)<\/td><td>Сильное поле с матрицей<\/td><td>Гематит, ильменит, <strong>вольфрамит<\/strong>, удаление железа из сподумена<\/td><\/tr><tr><td>Сухие валковые сепараторы на постоянных редкоземельных магнитах (RER)<\/td><td>Сильное, сухое<\/td><td>Минеральные пески: монацит, ильменит, гранат<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ключевые применения:<\/strong><\/p>\n<ul><li>отделение <strong>вольфрамита<\/strong> (парамагнитен) от <strong>касситерита<\/strong> и <strong>шеелита<\/strong> (немагнитны);<\/li><li>выделение <strong>монацита<\/strong> и ксенотима из минеральных песков;<\/li><li>очистка <strong>сподуменового<\/strong> концентрата от железа.<\/li><\/ul>\n<p><strong>Электростатическая сепарация<\/strong> (electrostatic separation). На коронном барабане (HTR) <strong>проводники<\/strong> (ильменит, рутил, касситерит) отделяются от <strong>непроводников<\/strong> (циркон, монацит). Основа переработки минеральных песков.<\/p>\n<h3>1.4 Сортировка руды (sensor-based ore sorting)<\/h3>\n<p>Куски руды на конвейере «просвечивают» датчиками, и сжатый воздух отстреливает руду или пустую породу. Датчики:<\/p>\n<ul><li><strong>рентгеновские<\/strong> (XRT) — по атомной плотности (вольфрам с высоким атомным номером виден отлично);<\/li><li><strong>оптические<\/strong> и <strong>лазерные<\/strong>;<\/li><li><strong>УФ<\/strong> (шеелит люминесцирует);<\/li><li><strong>NIR<\/strong> (ближний инфракрасный).<\/li><\/ul>\n<p>Ведущий производитель — TOMRA Mining; есть и другие (например, Steinert). Смысл — убрать часть пустой породы <strong>до<\/strong> дорогого измельчения. Повышается содержание в питании фабрики, снижаются затраты. Для вольфрамовых проектов это очень актуально.<\/p>\n<h3>1.5 Сводная матрица: сырьё TMK → метод → проблема<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Сырьё<\/th><th>Основные методы<\/th><th>Главная технологическая проблема<\/th><th>Профиль эксперта<\/th><\/tr><\/thead><tbody><tr><td><strong>Шеелит<\/strong> (скарны)<\/td><td>Гравитация (крупные классы) + <strong>флотация жирными кислотами<\/strong> + доводка (процесс Петрова); сортировка<\/td><td>Отделение от кальцита, флюорита, апатита; потери в шламах<\/td><td>Флотатор по несульфидным (солевым) минералам, опыт с шеелитом<\/td><\/tr><tr><td><strong>Вольфрамит<\/strong> (жилы, грейзены)<\/td><td><strong>Гравитация<\/strong> (отсадка, столы, спирали) + магнитная сепарация + флотация шламов<\/td><td>Потери в тонких классах; разделение с касситеритом<\/td><td>Гравитационщик по W и Sn<\/td><\/tr><tr><td><strong>Молибденит<\/strong> (Cu–Mo руды)<\/td><td>Коллективная флотация + <strong>селективная Cu–Mo флотация<\/strong> (NaHS) + колонны<\/td><td>Чистота Mo-концентрата (Cu, Pb, нерастворимый остаток); сохранение рения<\/td><td>Флотатор по сульфидам с опытом Cu–Mo разделения<\/td><\/tr><tr><td><strong>Графит<\/strong><\/td><td><strong>Флотация<\/strong> с многостадийной перечисткой и мягким доизмельчением<\/td><td>Сохранение крупной чешуи; чистота<\/td><td>Технолог по графиту, флотация неметаллов<\/td><\/tr><tr><td><strong>Сподумен<\/strong> (пегматиты)<\/td><td><strong>Тяжёлые среды (DMS)<\/strong> + флотация мелочи + магнитная сепарация<\/td><td>Железо и слюды в концентрате; тонкие потери<\/td><td>Технолог литиевых фабрик (Австралия, Канада, Африка)<\/td><\/tr><tr><td><strong>Минералы РЗЭ<\/strong><\/td><td>Флотация (бастнезит), гравитация + магнитная + электростатическая сепарация (россыпи)<\/td><td>Сложная минералогия, радиоактивность, тонкие срастания<\/td><td>Технолог по РЗЭ (Lynas, MP Materials, Iluka, ANSTO)<\/td><\/tr><tr><td><strong>Хвосты Ингички<\/strong> (техногенное сырьё)<\/td><td>Тонкая гравитация (центробежные концентраторы) + флотация шламов<\/td><td>Тонкий, окисленный, бедный материал<\/td><td>Специалист по переработке хвостов и тонких классов W<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Флотация<\/td><td>Froth flotation<\/td><td>Разделение по смачиваемости поверхности с помощью пузырьков воздуха<\/td><\/tr><tr><td>Гидрофобный<\/td><td>Hydrophobic<\/td><td>Не смачиваемый водой, прилипает к пузырькам<\/td><\/tr><tr><td>Гидрофильный<\/td><td>Hydrophilic<\/td><td>Смачиваемый водой, остаётся в пульпе<\/td><\/tr><tr><td>Собиратель<\/td><td>Collector<\/td><td>Реагент, делающий минерал гидрофобным<\/td><\/tr><tr><td>Пенообразователь<\/td><td>Frother<\/td><td>Реагент для устойчивой пены<\/td><\/tr><tr><td>Депрессор<\/td><td>Depressant<\/td><td>Реагент, подавляющий флотацию ненужного минерала<\/td><\/tr><tr><td>Активатор<\/td><td>Activator<\/td><td>Реагент, усиливающий флотацию нужного минерала<\/td><\/tr><tr><td>Регулятор среды<\/td><td>pH modifier<\/td><td>Реагент для задания pH<\/td><\/tr><tr><td>Ксантогенат<\/td><td>Xanthate<\/td><td>Классический собиратель для сульфидов<\/td><\/tr><tr><td>Жирные кислоты<\/td><td>Fatty acids<\/td><td>Собиратели для шеелита, флюорита, апатита, сподумена<\/td><\/tr><tr><td>Гидроксамовые кислоты<\/td><td>Hydroxamates<\/td><td>Собиратели для вольфрамита, касситерита, РЗЭ<\/td><\/tr><tr><td>Жидкое стекло<\/td><td>Sodium silicate / water glass<\/td><td>Депрессор кальцита, флюорита, силикатов<\/td><\/tr><tr><td>Основная флотация<\/td><td>Rougher flotation<\/td><td>Первая стадия флотации<\/td><\/tr><tr><td>Контрольная флотация<\/td><td>Scavenger flotation<\/td><td>Доизвлечение из хвостов основной флотации<\/td><\/tr><tr><td>Перечистка<\/td><td>Cleaner flotation<\/td><td>Повышение качества концентрата<\/td><\/tr><tr><td>Флотационная колонна<\/td><td>Flotation column<\/td><td>Аппарат для перечисток с чистым концентратом<\/td><\/tr><tr><td>Коллективная флотация<\/td><td>Bulk flotation<\/td><td>Совместная флотация нескольких минералов<\/td><\/tr><tr><td>Селективная флотация<\/td><td>Selective flotation<\/td><td>Разделение минералов друг от друга<\/td><\/tr><tr><td>Процесс Петрова<\/td><td>Petrov process<\/td><td>Доводка шеелитового концентрата с прогревом и жидким стеклом<\/td><\/tr><tr><td>Гравитационное обогащение<\/td><td>Gravity separation<\/td><td>Разделение по плотности<\/td><\/tr><tr><td>Отсадочная машина<\/td><td>Jig<\/td><td>Гравитационный аппарат с пульсирующим потоком воды<\/td><\/tr><tr><td>Винтовой сепаратор<\/td><td>Spiral concentrator<\/td><td>Гравитационный аппарат со спиральным жёлобом<\/td><\/tr><tr><td>Концентрационный стол<\/td><td>Shaking table<\/td><td>Гравитационный аппарат с колеблющейся декой<\/td><\/tr><tr><td>Центробежный концентратор<\/td><td>Centrifugal concentrator<\/td><td>Гравитация в центробежном поле (Knelson, Falcon)<\/td><\/tr><tr><td>Обогащение в тяжёлых средах<\/td><td>Dense media separation (DMS)<\/td><td>Разделение в суспензии заданной плотности<\/td><\/tr><tr><td>Магнитная сепарация<\/td><td>Magnetic separation<\/td><td>Разделение по магнитной восприимчивости<\/td><\/tr><tr><td>Сепаратор сильного поля<\/td><td>WHIMS / high-intensity magnetic separator<\/td><td>Для слабомагнитных минералов<\/td><\/tr><tr><td>Парамагнитный<\/td><td>Paramagnetic<\/td><td>Слабомагнитный (вольфрамит, монацит)<\/td><\/tr><tr><td>Электростатическая сепарация<\/td><td>Electrostatic separation<\/td><td>Разделение по электропроводности<\/td><\/tr><tr><td>Рентгенорадиометрическая сортировка<\/td><td>XRT sensor-based sorting<\/td><td>Сортировка кусков руды по рентгеновскому сигналу<\/td><\/tr><tr><td>Обесшламливание<\/td><td>Desliming<\/td><td>Удаление тонких шламов перед обогащением<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Как отличить «флотатора вообще» от нужного эксперта<\/h3>\n<p>Флотаторы делятся на два мира:<\/p>\n<ol><li><strong>Сульфидный<\/strong> (Cu, Mo, Ni, Pb, Zn, Au): ксантогенаты, известь, NaHS. Это большинство обогатителей мира.<\/li><li><strong>Несульфидный / солевой<\/strong> (шеелит, флюорит, апатит, сподумен, РЗЭ, графит): жирные кислоты, гидроксаматы, жидкое стекло, температура. Специалистов здесь в разы меньше.<\/li><\/ol>\n<p><strong>Для шеелита Ингички нужен второй мир.<\/strong> Флотатор медной фабрики АГМК хорош для Cu–Mo разделения (источник Mo и Re), но не автоматически для шеелита.<\/p>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Какой собиратель, депрессор и pH вы использовали и почему?»<\/td><td>Конкретные реагенты, расход (г/т), логика выбора, опыт замен<\/td><td>«Реагенты подбирала лаборатория»<\/td><\/tr><tr><td>(Шеелит) «Как вы отделяли шеелит от кальцита и флюорита?»<\/td><td>Жидкое стекло, процесс Петрова или его аналоги, температура, стадии перечистки<\/td><td>Не видит проблемы<\/td><\/tr><tr><td>(Cu–Mo) «Как вы подавляли медь при молибденовой флотации? Какое качество Mo-концентрата получали?»<\/td><td>NaHS, контроль потенциала, колонны, 45–55% Mo, примеси меди<\/td><td>Путается в стадиях<\/td><\/tr><tr><td>(Графит) «Как вы сохраняли крупную чешую?»<\/td><td>Мягкое доизмельчение, число перечисток, классы крупности и их доли<\/td><td>Не знает, что чешуя определяет цену<\/td><\/tr><tr><td>(Сподумен) «Какое содержание Fe₂O₃ было в концентрате и как вы его снижали?»<\/td><td>Магнитная сепарация, контроль износа, цифры<\/td><td>Не знает спецификаций покупателя<\/td><\/tr><tr><td>«Какие аппараты стояли на перечистках и почему?»<\/td><td>Колонны, механические машины, Jameson; объясняет выбор<\/td><td>Не помнит оборудование<\/td><\/tr><tr><td>«Какой эксперимент на фабрике вы спланировали сами? Что получилось?»<\/td><td>Гипотеза → испытание → цифры → внедрение<\/td><td>Только «участвовал»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать по методам<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Компании и пулы<\/th><\/tr><\/thead><tbody><tr><td>Шеелит, вольфрамит<\/td><td>Almonty (Панаскейра, Сандон), Wolfram Bergbau und Hütten (Миттерзиль), Masan High-Tech Materials (Нуй Фао), EQ Resources (Mt Carbine), китайские вольфрамовые компании, бывшие специалисты российских вольфрамовых ГОКов (с проверкой санкционных ограничений)<\/td><\/tr><tr><td>Cu–Mo разделение<\/td><td>АГМК, Эрдэнэт (Монголия), KAZ Minerals, Codelco, Freeport, Southern Copper, Antofagasta<\/td><\/tr><tr><td>Графит<\/td><td>Syrah Resources (Балама), NextSource, Nouveau Monde Graphite, Imerys Graphite &amp; Carbon<\/td><\/tr><tr><td>Сподумен<\/td><td>Pilbara Minerals (PLS), Mineral Resources, Talison Lithium (Гринбушес; Tianqi/IGO и Albemarle), Liontown, Sigma Lithium (Бразилия), литиевые проекты китайских компаний в Зимбабве (Bikita, Arcadia)<\/td><\/tr><tr><td>РЗЭ<\/td><td>Lynas, MP Materials, Iluka, Arafura, ANSTO Minerals<\/td><\/tr><tr><td>Технологии и испытания<\/td><td>SGS, ALS Metallurgy, Mintek, JKTech, Metso, FLSmidth, Eriez, TOMRA<\/td><\/tr><tr><td>Реагенты (технические эксперты)<\/td><td>Syensqo (бывш. Solvay, направление горных реагентов), Clariant, Nouryon<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Матрица без шпаргалки.<\/strong> Закройте таблицу 1.5 и заполните её по памяти: сырьё → метод → проблема → профиль эксперта. Потом сверьте и отметьте ошибки.<\/p>\n<p><strong>Задание 2 (10 мин). Булев поиск.<\/strong> Составьте три запроса для LinkedIn или Google X-ray:<\/p>\n<ol><li>Флотатор по шеелиту.<\/li><li>Технолог по Cu–Mo разделению.<\/li><li>Технолог графитовой фабрики.<\/li><\/ol>\n<p>Пример: <code>(\"scheelite\" OR \"tungsten\") AND (flotation OR metallurgist) AND (\"fatty acid\" OR \"sodium silicate\")<\/code>. Запустите каждый и запишите, сколько релевантных профилей среди первых 20 результатов.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Вызов дня: назовите метод и проблему для пяти видов сырья за одну минуту. Засеките время.<\/li><li>Какой профиль эксперта для TMK сейчас кажется вам самым дефицитным и почему?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 8: гидрометаллургия и выщелачивание».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы прошли обогащение — половину пути от руды до металла. С завтрашнего дня начинается химия: зона, где работает самая дорогая и дефицитная экспертиза TMK. Сегодня лягте спать с мыслью: «Шеелит — жирные кислоты, кальцит — враг».<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li><em>Wills' Mineral Processing Technology<\/em> — главы Froth Flotation, Gravity Concentration, Magnetic and Electrical Separation.<\/li><li>Абрамов А. А. «Флотационные методы обогащения» — классика российской школы.<\/li><li>Публикации ITIA о переработке вольфрама: <a href=\"https://www.itia.info\" target=\"_blank\" rel=\"noopener\">itia.info<\/a>.<\/li><li><a href=\"https://www.911metallurgist.com\" target=\"_blank\" rel=\"noopener\">911metallurgist.com<\/a> — разделы «Scheelite flotation», «Molybdenite flotation», «Graphite flotation».<\/li><li>Видео: «froth flotation animation», «shaking table gold tungsten», «dense media separation spodumene», «TOMRA XRT sorting».<\/li><\/ul>"},{"n":8,"module":2,"title":"Гидрометаллургия и выщелачивание","file":"module-02-processing-metallurgy/day-08-hydrometallurgy-leaching.md","duration":"3,5 часа","challenge":"Нарисовать по памяти <strong>гидрометаллургическую схему вольфрама<\/strong> от концентрата до APT и отметить на ней, где работает какой специалист.","why":"Гидрометаллургия — сердце новых переделов TMK: APT, рений, РЗЭ и рений из урановых растворов, литий, никель и кобальт. Это самая дефицитная экспертиза на рынке. Вне Китая технологов, которые запускали такие установки, считанное число. Если вы не понимаете схему, вы не отличите химика-лаборанта от технолога, который вёл промышленный передел. Ошибка здесь обходится TMK в годы задержки пуска.","checklist":[{"text":"Разминка: 5 вопросов по Дням 6–7 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (95 мин)","minutes":95},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: схема APT по памяти + профиль гидрометаллурга (25 мин)","minutes":25},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Гидрометаллургия","en":"Hydrometallurgy","def":"Извлечение металлов водными растворами"},{"ru":"Выщелачивание","en":"Leaching","def":"Растворение ценного компонента"},{"ru":"Выщелачивающий реагент","en":"Lixiviant","def":"Раствор для выщелачивания (кислота, щёлочь, цианид)"},{"ru":"Продуктивный раствор","en":"Pregnant leach solution (PLS)","def":"Раствор с растворённым ценным компонентом"},{"ru":"Кек","en":"Leach residue / cake","def":"Твёрдый остаток после выщелачивания"},{"ru":"Кучное выщелачивание","en":"Heap leaching","def":"Выщелачивание руды в штабелях"},{"ru":"Агитационное выщелачивание","en":"Agitated tank leaching","def":"Выщелачивание пульпы в реакторах с перемешиванием"},{"ru":"Автоклавное выщелачивание","en":"Pressure leaching / autoclave leaching","def":"Выщелачивание при повышенных давлении и температуре"},{"ru":"Автоклавное кислотное выщелачивание","en":"HPAL (high pressure acid leach)","def":"Технология для никелевых латеритов"},{"ru":"Бактериальное выщелачивание","en":"Bioleaching","def":"Выщелачивание с помощью бактерий"},{"ru":"Вскрытие (разложение) концентрата","en":"Cracking / decomposition / digestion","def":"Перевод упорного концентрата в растворимую форму"},{"ru":"Сернокислотный обжиг","en":"Acid baking / sulfation roasting","def":"Обработка концентрата серной кислотой при нагреве"},{"ru":"Противоточная промывка","en":"Counter-current decantation (CCD)","def":"Отмывка кека в каскаде сгустителей"},{"ru":"Осаждение","en":"Precipitation","def":"Выделение вещества из раствора в осадок"},{"ru":"Цементация","en":"Cementation","def":"Вытеснение металла более активным металлом"},{"ru":"Ионный обмен","en":"Ion exchange (IX)","def":"Сорбция ионов смолой и их десорбция"},{"ru":"Сорбция / десорбция (элюирование)","en":"Loading / elution","def":"Поглощение металла смолой и его снятие"},{"ru":"Анионит","en":"Anion exchange resin","def":"Смола для поглощения анионов (вольфрамат, перренат, уранил-сульфат)"},{"ru":"Кристаллизация","en":"Crystallization","def":"Выделение твёрдых кристаллов из раствора"},{"ru":"Маточный раствор","en":"Mother liquor","def":"Раствор, остающийся после кристаллизации"},{"ru":"Паравольфрамат аммония","en":"Ammonium paratungstate (APT)","def":"Ключевой промежуточный продукт вольфрама"},{"ru":"Вольфрамат натрия","en":"Sodium tungstate","def":"Раствор после щелочного или содового разложения"},{"ru":"Перренат аммония","en":"Ammonium perrhenate (APR)","def":"Ключевое соединение рения"},{"ru":"Декрепитация сподумена","en":"Spodumene decrepitation / calcination","def":"Перевод α-сподумена в β-форму обжигом"},{"ru":"Карбонат лития / гидроксид лития","en":"Lithium carbonate / lithium hydroxide","def":"Литиевые продукты для аккумуляторов"},{"ru":"Смешанный гидроксидный осадок","en":"MHP (mixed hydroxide precipitate)","def":"Промежуточный продукт Ni–Co из HPAL"},{"ru":"Скважинное подземное выщелачивание","en":"In-situ recovery (ISR)","def":"Выщелачивание металла в пласте через скважины"},{"ru":"Природные радионуклиды","en":"NORM (naturally occurring radioactive material)","def":"Th, U и продукты распада в сырье и отходах"},{"ru":"Опытно-промышленные испытания","en":"Pilot plant testing","def":"Проверка технологии на пилотной установке"},{"ru":"Масштабирование","en":"Scale-up","def":"Перенос технологии с лабораторного на промышленный масштаб"}],"quiz":[{"q":"Что такое продуктивный раствор (PLS)?","options":["Отработанный раствор после электролиза","Вода для промывки оборудования","Реагент для флотации","Раствор, полученный при выщелачивании и содержащий растворённый ценный компонент"],"answer":3,"explain":"Pregnant leach solution — «беременный» металлом раствор, который дальше очищают и из которого выделяют продукт."},{"q":"Какой реагент обычно используют для разложения вольфрамитового концентрата?","options":["Цианид натрия","Ксантогенат","Гидроксид натрия (NaOH)","Азот"],"answer":2,"explain":"Щелочное разложение даёт раствор вольфрамата натрия. Шеелит вскрывают содой в автоклавах или щёлочью под давлением."},{"q":"Почему отделение молибдена — критическая задача при производстве APT?","options":["Mo химически очень похож на W и ухудшает чистоту продукта; его нужно удалять специальными методами","Молибден взрывоопасен","Молибден слишком дорогой","Это не проблема"],"answer":0,"explain":"Близость химических свойств W и Mo — классическая проблема вольфрамовой химии. Остаточный Mo в APT — важный показатель качества."},{"q":"Каким способом обычно извлекают рений из растворов?","options":["Флотацией","Сорбцией на анионитах (ионным обменом) или экстракцией","Гравитацией","Магнитной сепарацией"],"answer":1,"explain":"Перренат-ион хорошо сорбируется анионитами и экстрагируется аминами. После десорбции кристаллизуют перренат аммония."},{"q":"Зачем сподумен перед выщелачиванием обжигают при ≈ 1 050–1 100 °C?","options":["Чтобы расплавить его","Чтобы удалить радиоактивность","Чтобы получить металлический литий","Чтобы перевести α-сподумен в реакционноспособную β-форму"],"answer":3,"explain":"Природный α-сподумен практически не вскрывается кислотой. После декрепитации β-сподумен реагирует с серной кислотой при ≈ 250 °C."},{"q":"Что такое HPAL?","options":["Кучное выщелачивание золота","Автоклавное сернокислотное выщелачивание никелевых латеритов при высоких температуре и давлении","Метод флотации","Тип электролизёра"],"answer":1,"explain":"High pressure acid leach. Массово применяется в Индонезии, исторически сложна в выходе на мощность."},{"q":"Почему для стратегии TMK важен собственный завод серной кислоты?","options":["Её используют для флотации шеелита","Это требование RMAP","Для экспорта в Китай","Серная кислота — самый массовый реагент гидрометаллургии (Cu, U, Ni, РЗЭ, Li)"],"answer":3,"explain":"Надёжная собственная кислота — основа для развития гидрометаллургических переделов и снабжения отрасли."},{"q":"Кандидат: «Я разработала технологию извлечения РЗЭ». Ваш первый уточняющий вопрос:","options":["«На каком масштабе: лаборатория, пилот или промышленность? Какие объёмы и сколько времени непрерывной работы?»","«Сколько вам лет?»","«Какой у вас диплом?»","«Любите ли вы химию?»"],"answer":0,"explain":"Шкала масштаба — главный фильтр гидрометаллурга. Опыт пуска и промышленной эксплуатации встречается намного реже лабораторного."},{"q":"Какая опасность специфична для переработки сырья РЗЭ?","options":["Магнитные поля","Взрыв метана","Природная радиоактивность (торий, уран) в продуктах и отходах","Ничего специфичного"],"answer":2,"explain":"Нужны радиационный контроль, специалист по радиационной безопасности и разрешения на обращение с NORM."},{"q":"Что такое элюирование (десорбция) в ионном обмене?","options":["Промывка смолы водой от грязи","Снятие поглощённого металла со смолы концентрированным раствором с получением богатого элюата","Сжигание смолы","Покупка новой смолы"],"answer":1,"explain":"Цикл ионного обмена: сорбция → промывка → элюирование → регенерация. Богатый элюат идёт на получение продукта."}],"html":"<h2>0. Разминка: вспомнить Дни 6–7<\/h2>\n<ol><li>Чем обогащение отличается от металлургии?<\/li><li>Какой собиратель и какой депрессор используют при флотации шеелита?<\/li><li>Что делает NaHS при Cu–Mo разделении?<\/li><li>Каким методом обогащают крупный класс сподумена?<\/li><li>Почему вольфрамит отделяют от касситерита магнитной сепарацией?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Обогащение физически разделяет минералы без изменения химического состава; металлургия химически извлекает металл.<\/li><li>Жирные кислоты (собиратель) и жидкое стекло (депрессор кальцита и флюорита); доводка — процесс Петрова.<\/li><li>Подавляет медные сульфиды; молибденит флотируется.<\/li><li>В тяжёлых средах (DMS).<\/li><li>Вольфрамит парамагнитен, касситерит практически немагнитен.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Что такое гидрометаллургия<\/h3>\n<p><strong>Гидрометаллургия<\/strong> (hydrometallurgy) — извлечение металлов с помощью <strong>водных растворов<\/strong>. Металл переводят в раствор, очищают раствор от примесей, затем выделяют металл или его соединение.<\/p>\n<pre class=\"code\"><code>Сырьё (руда / концентрат / промпродукт)\n  → [Подготовка: измельчение, обжиг, вскрытие]\n  → ВЫЩЕЛАЧИВАНИЕ → продуктивный раствор (PLS)\n  → Разделение твёрдого и жидкого (сгущение, противоточная промывка (CCD), фильтрация)\n  → ОЧИСТКА РАСТВОРА: осаждение примесей, цементация, ионный обмен, экстракция\n  → ВЫДЕЛЕНИЕ ПРОДУКТА: электролиз, кристаллизация, осаждение, восстановление водородом\n  → Обращение с маточными растворами и стоками: оборот воды, нейтрализация<\/code><\/pre>\n<p><strong>Чем гидрометаллургия отличается от пирометаллургии:<\/strong><\/p>\n<ul><li><strong>Гидро:<\/strong> низкие температуры (обычно до 100 °C; в автоклавах — до 250–270 °C), подходит для бедного и сложного сырья, высокая селективность, но много растворов, реагентов и стоков.<\/li><li><strong>Пиро:<\/strong> высокие температуры (сотни–тысячи °C), большие объёмы, хороша для богатых концентратов, но энергоёмка и даёт газы (SO₂).<\/li><\/ul>\n<p>Для редких металлов (W, Mo, Re, РЗЭ, Li, Ta, Nb) почти всегда нужна гидрометаллургия: только она даёт высокую чистоту и разделение похожих элементов.<\/p>\n<h3>1.2 Выщелачивание: типы и реагенты<\/h3>\n<p><strong>Выщелачивание<\/strong> (leaching) — растворение ценного компонента реагентом (выщелачивающим агентом, lixiviant).<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Как<\/th><th>Где применяется<\/th><\/tr><\/thead><tbody><tr><td><strong>Скважинное подземное (СПВ / ISR)<\/strong><\/td><td>Раствор через скважины прямо в пласт<\/td><td>Уран (Узбекистан, Казахстан); попутно Re, РЗЭ, Sc, V<\/td><\/tr><tr><td><strong>Кучное<\/strong> (heap leaching)<\/td><td>Штабель руды на гидроизолированном основании орошают раствором, цикл — месяцы<\/td><td>Золото (цианид), медь (серная кислота)<\/td><\/tr><tr><td><strong>Отвальное<\/strong> (dump leaching)<\/td><td>То же на бедных отвалах, без подготовки<\/td><td>Медь<\/td><\/tr><tr><td><strong>Чановое<\/strong> (vat leaching)<\/td><td>Руду заливают раствором в чанах<\/td><td>Малые объёмы<\/td><\/tr><tr><td><strong>Агитационное<\/strong> (agitated tank leaching)<\/td><td>Пульпу перемешивают в реакторах при атмосферном давлении<\/td><td>Золото (CIL/CIP), цинк, концентраты редких металлов<\/td><\/tr><tr><td><strong>Автоклавное<\/strong> (pressure leaching)<\/td><td>Реакторы под давлением и при высокой температуре<\/td><td><strong>HPAL<\/strong> — никелевые латериты (≈ 250 °C, H₂SO₄); <strong>POX<\/strong> — упорные золотые руды; <strong>щелочное / содовое разложение вольфрамовых концентратов<\/strong><\/td><\/tr><tr><td><strong>Бактериальное<\/strong> (bioleaching)<\/td><td>Бактерии окисляют сульфиды<\/td><td>Упорное золото (BIOX), вторичные сульфиды меди<\/td><\/tr><tr><td><strong>Сульфатизирующий обжиг / вскрытие<\/strong> (acid baking, cracking)<\/td><td>Концентрат обрабатывают концентрированной кислотой или щёлочью при нагреве, затем выщелачивают водой<\/td><td><strong>Концентраты РЗЭ<\/strong> (монацит, бастнезит), <strong>сподумен<\/strong> после обжига<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Основные реагенты:<\/strong><\/p>\n<ul><li><strong>Серная кислота<\/strong> H₂SO₄ — самый массовый и дешёвый реагент (медь, уран, никель, РЗЭ, литий). Отсюда стратегический смысл <strong>TMK Chemicals<\/strong> (500 тыс. т/год): своя кислота — основа будущей гидрометаллургии;<\/li><li>соляная (HCl) и азотная (HNO₃) кислоты — РЗЭ, редкие металлы;<\/li><li><strong>щёлочь NaOH и сода Na₂CO₃<\/strong> — вольфрам, монацит;<\/li><li><strong>аммиак и аммонийные соли<\/strong> — молибден, вольфрам, никель, кобальт;<\/li><li>цианид натрия NaCN — золото и серебро.<\/li><\/ul>\n<h3>1.3 Очистка растворов и выделение продукта<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Метод<\/th><th>Принцип<\/th><th>Примеры<\/th><\/tr><\/thead><tbody><tr><td><strong>Осаждение<\/strong> (precipitation)<\/td><td>Перевод примеси или продукта в нерастворимое соединение изменением pH или реагентом<\/td><td>Удаление Fe и Al гидролизом; <strong>оксалаты РЗЭ<\/strong>; карбонат лития (с содой); сульфиды металлов<\/td><\/tr><tr><td><strong>Цементация<\/strong> (cementation)<\/td><td>Вытеснение металла более активным металлом<\/td><td>Медь на железе, примеси на цинковой пыли<\/td><\/tr><tr><td><strong>Ионный обмен<\/strong> (ion exchange, IX)<\/td><td>Смолы обменивают ионы раствора на свои: сорбция, затем десорбция (элюирование) концентрированным раствором<\/td><td><strong>Уран при СПВ<\/strong>, <strong>рений<\/strong>, вольфрам, золото (смолы в пульпе), очистка воды<\/td><\/tr><tr><td><strong>Жидкостная экстракция<\/strong> (solvent extraction, SX)<\/td><td>Органический экстрагент избирательно «забирает» металл из водного раствора<\/td><td>Медь, РЗЭ, Ni/Co, W, Mo, U — подробно в Дне 9<\/td><\/tr><tr><td><strong>Кристаллизация<\/strong> (crystallization)<\/td><td>Выпаривание или охлаждение до выпадения кристаллов<\/td><td><strong>APT<\/strong>, сульфаты Ni и Co, LiOH·H₂O<\/td><\/tr><tr><td><strong>Восстановление водородом<\/strong><\/td><td>Из раствора под давлением или из твёрдых солей в печах<\/td><td>Порошки Ni, Co; W, Mo, Re из оксидов и солей (День 10)<\/td><\/tr><tr><td><strong>Электролиз<\/strong> (electrowinning)<\/td><td>Выделение металла на катоде током<\/td><td>Медь, цинк, кобальт (День 9)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.4 Ключевые схемы для TMK<\/h3>\n<p><strong>А) Вольфрам: от концентрата до APT<\/strong><\/p>\n<pre class=\"code\"><code>Шеелитовый (CaWO₄) или вольфрамитовый ((Fe,Mn)WO₄) концентрат\n  → РАЗЛОЖЕНИЕ (вскрытие):\n       шеелит — содовое автоклавное (Na₂CO₃, ≈ 200 °C+) или щелочное (NaOH) под давлением;\n       вольфрамит — щелочное (NaOH)\n       (исторически шеелит вскрывали также соляной кислотой с получением вольфрамовой кислоты H₂WO₄)\n  → Раствор вольфрамата натрия Na₂WO₄ + кек (CaCO₃, гидроксиды Fe/Mn)\n  → ОЧИСТКА: удаление Si, P, As и особенно Mo (молибден химически очень похож на вольфрам;\n       его отделяют, например, осаждением сульфида молибдена или селективной сорбцией)\n  → КОНВЕРСИЯ в аммонийную форму: жидкостная экстракция аминами или ионный обмен на анионитах\n       → раствор вольфрамата аммония\n  → ВЫПАРНАЯ КРИСТАЛЛИЗАЦИЯ → APT (паравольфрамат аммония, ≈ 88,5% WO₃)<\/code><\/pre>\n<p>Дальше APT прокаливают до оксидов и восстанавливают водородом до порошка вольфрама (День 10).<\/p>\n<p><strong>Где нужны люди:<\/strong> технолог разложения (автоклавы, щёлочь), технолог очистки растворов (тонкая химия примесей, отделение Mo), технолог экстракции или ионного обмена, технолог кристаллизации (размер и чистота кристаллов APT), аналитики (следовые примеси), инженеры по стокам (аммиак, натрий).<\/p>\n<p><strong>Б) Рений: из газов и растворов<\/strong><\/p>\n<ul><li>При окислительном обжиге молибденита рений окисляется до летучего Re₂O₇ и уходит с газами. В системе мокрой газоочистки он переходит в промывные растворы.<\/li><li>Рений есть также в промывных растворах медеплавильного производства и в растворах <strong>СПВ урана<\/strong>.<\/li><li>Его извлекают <strong>сорбцией на анионитах<\/strong> (ионный обмен) или <strong>экстракцией<\/strong> (амины), затем десорбируют (элюируют), очищают и кристаллизуют <strong>перренат аммония<\/strong> NH₄ReO₄ (APR). Восстановление водородом даёт порошок рения — продукт TMK с характеристикой «размер частиц по Фишеру 3,0–7,5 мкм».<\/li><\/ul>\n<p><strong>В) РЗЭ: от концентрата до смешанного продукта<\/strong><\/p>\n<pre class=\"code\"><code>Концентрат РЗЭ (бастнезит / монацит)\n  → ВСКРЫТИЕ: сернокислотный обжиг (acid baking) или щелочное разложение (NaOH — классика для монацита)\n  → Водное или кислотное выщелачивание → раствор РЗЭ + остаток (с торием → радиационный контроль)\n  → Очистка от Fe, Al, Th, U\n  → Осаждение суммы РЗЭ (карбонаты, оксалаты, гидроксиды) или сразу экстракционное разделение\n  → Разделение на индивидуальные РЗЭ — жидкостная экстракция в каскадах (День 9)<\/code><\/pre>\n<p>Для <strong>растворов СПВ урана<\/strong> (проект TMK и Solvomet): РЗЭ и рений присутствуют в низких концентрациях в больших объёмах раствора. Ключевые задачи — <strong>селективное концентрирование<\/strong> (ионный обмен, экстракция) без вреда основному урановому процессу и соблюдение радиационной безопасности.<\/p>\n<p><strong>Г) Литий из сподумена<\/strong><\/p>\n<pre class=\"code\"><code>Сподуменовый концентрат (SC6)\n  → ДЕКРЕПИТАЦИЯ (обжиг ≈ 1 050–1 100 °C): α-сподумен → β-сподумен, реакционноспособная форма\n  → СЕРНОКИСЛОТНЫЙ ОБЖИГ (≈ 250 °C) → водное выщелачивание → раствор Li₂SO₄\n  → Очистка: удаление Fe, Al, Mg, Ca (pH, осаждение, ионный обмен)\n  → Li₂CO₃ (осаждение содой) или LiOH·H₂O (каустификация или электромембранные технологии + кристаллизация)<\/code><\/pre>\n<p><strong>Д) Никель и кобальт из латеритов (HPAL)<\/strong><\/p>\n<pre class=\"code\"><code>Латеритная руда → автоклав (≈ 250 °C, H₂SO₄) → раствор Ni, Co + примеси\n  → нейтрализация и удаление Fe, Al → MHP (смешанный гидроксидный осадок) или MSP (сульфидный)\n  → рафинирование: выщелачивание, экстракция (Cyanex 272 для разделения Co/Ni), кристаллизация\n  → сульфаты никеля и кобальта батарейного качества<\/code><\/pre>\n<p>HPAL массово строят китайские компании в Индонезии. Выход на мощность исторически сложный (см. кривые МакНалти в Дне 5).<\/p>\n<h3>1.5 Оборудование и материалы<\/h3>\n<ul><li><strong>Автоклавы<\/strong> — титановые или футерованные кирпичом; сосуды под давлением с жёсткими требованиями безопасности.<\/li><li><strong>Реакторы с перемешиванием<\/strong> (агитаторы), сгустители и противоточная промывка (CCD), фильтр-прессы.<\/li><li><strong>Ионообменные колонны<\/strong> (неподвижный слой, непрерывный противоток), смолы в пульпе (RIP).<\/li><li><strong>Выпарные аппараты и кристаллизаторы<\/strong> (в т. ч. с механической рекомпрессией пара — MVR).<\/li><li><strong>Материалы:<\/strong> стеклопластик (FRP), гуммированная сталь, дуплексные нержавеющие стали, титан, сплавы Hastelloy. Коррозия — постоянная тема.<\/li><\/ul>\n<h3>1.6 Безопасность и экология гидрометаллургии<\/h3>\n<ul><li>Кислоты, щёлочи, аммиак, <strong>H₂S<\/strong> (при осаждении сульфидов), <strong>HF<\/strong> (очистка графита, некоторые схемы РЗЭ), цианиды.<\/li><li>Сосуды под давлением (автоклавы).<\/li><li><strong>Радиационная безопасность<\/strong> при переработке РЗЭ и урановых растворов (торий, уран, продукты их распада — NORM).<\/li><li>Стоки и хвосты выщелачивания; водный баланс.<\/li><\/ul>\n<blockquote><p><strong>TMK:<\/strong> R&amp;D Park включает Центр технологических испытаний с «выделением элементов гидрометаллургическими методами» и опытно-промышленными испытаниями. Это место, где схемы для W, Re, РЗЭ и Li будут доводить от пробирки до пилотной установки. Профиль руководителя такого центра — один из самых сложных в подборе: наука + масштабирование + управление проектами.<\/p><\/blockquote>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Гидрометаллургия<\/td><td>Hydrometallurgy<\/td><td>Извлечение металлов водными растворами<\/td><\/tr><tr><td>Выщелачивание<\/td><td>Leaching<\/td><td>Растворение ценного компонента<\/td><\/tr><tr><td>Выщелачивающий реагент<\/td><td>Lixiviant<\/td><td>Раствор для выщелачивания (кислота, щёлочь, цианид)<\/td><\/tr><tr><td>Продуктивный раствор<\/td><td>Pregnant leach solution (PLS)<\/td><td>Раствор с растворённым ценным компонентом<\/td><\/tr><tr><td>Кек<\/td><td>Leach residue / cake<\/td><td>Твёрдый остаток после выщелачивания<\/td><\/tr><tr><td>Кучное выщелачивание<\/td><td>Heap leaching<\/td><td>Выщелачивание руды в штабелях<\/td><\/tr><tr><td>Агитационное выщелачивание<\/td><td>Agitated tank leaching<\/td><td>Выщелачивание пульпы в реакторах с перемешиванием<\/td><\/tr><tr><td>Автоклавное выщелачивание<\/td><td>Pressure leaching / autoclave leaching<\/td><td>Выщелачивание при повышенных давлении и температуре<\/td><\/tr><tr><td>Автоклавное кислотное выщелачивание<\/td><td>HPAL (high pressure acid leach)<\/td><td>Технология для никелевых латеритов<\/td><\/tr><tr><td>Бактериальное выщелачивание<\/td><td>Bioleaching<\/td><td>Выщелачивание с помощью бактерий<\/td><\/tr><tr><td>Вскрытие (разложение) концентрата<\/td><td>Cracking / decomposition / digestion<\/td><td>Перевод упорного концентрата в растворимую форму<\/td><\/tr><tr><td>Сернокислотный обжиг<\/td><td>Acid baking / sulfation roasting<\/td><td>Обработка концентрата серной кислотой при нагреве<\/td><\/tr><tr><td>Противоточная промывка<\/td><td>Counter-current decantation (CCD)<\/td><td>Отмывка кека в каскаде сгустителей<\/td><\/tr><tr><td>Осаждение<\/td><td>Precipitation<\/td><td>Выделение вещества из раствора в осадок<\/td><\/tr><tr><td>Цементация<\/td><td>Cementation<\/td><td>Вытеснение металла более активным металлом<\/td><\/tr><tr><td>Ионный обмен<\/td><td>Ion exchange (IX)<\/td><td>Сорбция ионов смолой и их десорбция<\/td><\/tr><tr><td>Сорбция / десорбция (элюирование)<\/td><td>Loading / elution<\/td><td>Поглощение металла смолой и его снятие<\/td><\/tr><tr><td>Анионит<\/td><td>Anion exchange resin<\/td><td>Смола для поглощения анионов (вольфрамат, перренат, уранил-сульфат)<\/td><\/tr><tr><td>Кристаллизация<\/td><td>Crystallization<\/td><td>Выделение твёрдых кристаллов из раствора<\/td><\/tr><tr><td>Маточный раствор<\/td><td>Mother liquor<\/td><td>Раствор, остающийся после кристаллизации<\/td><\/tr><tr><td>Паравольфрамат аммония<\/td><td>Ammonium paratungstate (APT)<\/td><td>Ключевой промежуточный продукт вольфрама<\/td><\/tr><tr><td>Вольфрамат натрия<\/td><td>Sodium tungstate<\/td><td>Раствор после щелочного или содового разложения<\/td><\/tr><tr><td>Перренат аммония<\/td><td>Ammonium perrhenate (APR)<\/td><td>Ключевое соединение рения<\/td><\/tr><tr><td>Декрепитация сподумена<\/td><td>Spodumene decrepitation / calcination<\/td><td>Перевод α-сподумена в β-форму обжигом<\/td><\/tr><tr><td>Карбонат лития / гидроксид лития<\/td><td>Lithium carbonate / lithium hydroxide<\/td><td>Литиевые продукты для аккумуляторов<\/td><\/tr><tr><td>Смешанный гидроксидный осадок<\/td><td>MHP (mixed hydroxide precipitate)<\/td><td>Промежуточный продукт Ni–Co из HPAL<\/td><\/tr><tr><td>Скважинное подземное выщелачивание<\/td><td>In-situ recovery (ISR)<\/td><td>Выщелачивание металла в пласте через скважины<\/td><\/tr><tr><td>Природные радионуклиды<\/td><td>NORM (naturally occurring radioactive material)<\/td><td>Th, U и продукты распада в сырье и отходах<\/td><\/tr><tr><td>Опытно-промышленные испытания<\/td><td>Pilot plant testing<\/td><td>Проверка технологии на пилотной установке<\/td><\/tr><tr><td>Масштабирование<\/td><td>Scale-up<\/td><td>Перенос технологии с лабораторного на промышленный масштаб<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли гидрометаллургии<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Зона<\/th><th>Маркеры уровня<\/th><\/tr><\/thead><tbody><tr><td>Главный гидрометаллург / директор по технологии<\/td><td>Chief Hydrometallurgist / Head of Process Technology<\/td><td>Технологическая стратегия переделов<\/td><td>Запущенные промышленные установки, патенты, масштаб<\/td><\/tr><tr><td>Технолог гидрометаллургического цеха<\/td><td>Hydrometallurgical Process Engineer / Plant Metallurgist (Hydromet)<\/td><td>Ежедневная технология<\/td><td>Реальный передел, KPI извлечения и чистоты<\/td><\/tr><tr><td>Начальник гидрометаллургического цеха<\/td><td>Hydromet Superintendent / Refinery Superintendent<\/td><td>Производство, люди, безопасность<\/td><td>Численность, продукт, объёмы<\/td><\/tr><tr><td>Специалист по ионному обмену<\/td><td>Ion Exchange Specialist<\/td><td>Сорбция, элюирование, смолы<\/td><td>Тип смол, металлы, промышленный масштаб<\/td><\/tr><tr><td>Инженер-технолог по автоклавам<\/td><td>Pressure Leach / Autoclave Engineer<\/td><td>Автоклавы, безопасность сосудов<\/td><td>HPAL / POX опыт<\/td><\/tr><tr><td>Руководитель технологических испытаний<\/td><td>Testwork Manager / Pilot Plant Manager<\/td><td>Лабораторные и пилотные испытания<\/td><td>Пилоты от и до, отчёты для FS<\/td><\/tr><tr><td>Специалист по радиационной безопасности<\/td><td>Radiation Safety Officer (RSO)<\/td><td>NORM, дозиметрия, разрешения<\/td><td>Опыт с РЗЭ или ураном<\/td><\/tr><tr><td>Инженер по водоподготовке и стокам<\/td><td>Water Treatment / Effluent Engineer<\/td><td>Оборот воды, нейтрализация<\/td><td>Сложные стоки (аммиак, сульфаты, фториды)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Шкала масштаба — главный фильтр гидрометаллурга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Уровень<\/th><th>Что делал<\/th><th>Ценность для TMK<\/th><\/tr><\/thead><tbody><tr><td>1. Лаборатория<\/td><td>Опыты в стаканах<\/td><td>Низкая для производственной роли<\/td><\/tr><tr><td>2. Укрупнённые испытания<\/td><td>Килограммы, непрерывные мини-установки<\/td><td>Средняя<\/td><\/tr><tr><td>3. Пилотная установка<\/td><td>Непрерывная работа неделями, данные для проектирования<\/td><td>Высокая для R&amp;D Park и проектов<\/td><\/tr><tr><td>4. Проектирование<\/td><td>Схема, баланс, выбор оборудования (у EPCM)<\/td><td>Высокая для проектной стадии<\/td><\/tr><tr><td>5. Пуск и вывод на мощность<\/td><td>Пусконаладка новой установки<\/td><td><strong>Очень высокая и редкая<\/strong><\/td><\/tr><tr><td>6. Стабильная эксплуатация<\/td><td>Промышленный передел годами<\/td><td>Высокая для действующих цехов<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Правило:<\/strong> всегда спрашивайте, <strong>на каком уровне масштаба<\/strong> кандидат делал то, о чём говорит. «Я разработала технологию извлечения рения» может означать как пробирку, так и промышленный цех.<\/p>\n<h3>3.3 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Опишите схему вашего передела от питания до продукта»<\/td><td>Последовательность операций, реагенты, условия (T, pH, время), продукты и потоки<\/td><td>Знает только свой участок, не видит схему<\/td><\/tr><tr><td>«Какое извлечение на выщелачивании и какая чистота продукта? Какие примеси критичны?»<\/td><td>Цифры, лимитирующие примеси и как их контролировали<\/td><td>Без цифр; не знает спецификаций<\/td><\/tr><tr><td>«Какой у вас был крупнейший масштаб?»<\/td><td>Чётко: лаборатория, пилот, промышленность, с объёмами<\/td><td>Размывает ответ<\/td><\/tr><tr><td>(Вольфрам) «Как вы отделяли молибден от вольфрама?»<\/td><td>Конкретный метод, остаточный Mo в APT<\/td><td>Не знает, что это проблема<\/td><\/tr><tr><td>(IX) «Какие смолы, ёмкость, условия элюирования, как боролись с отравлением смолы?»<\/td><td>Марки и типы смол, цифры, проблемы и решения<\/td><td>Только общая теория<\/td><\/tr><tr><td>«Расскажите о пуске новой установки: что пошло не так?»<\/td><td>Честный разбор, сроки выхода на мощность, решения<\/td><td>«Всё прошло гладко»<\/td><\/tr><tr><td>«Какие требования безопасности были критичны: автоклавы, H₂S, HF, радиация?»<\/td><td>Конкретные системы, процедуры, инциденты и выводы<\/td><td>Безопасность — «это отдел ОТ»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.4 Где искать гидрометаллургов<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Доноры<\/th><\/tr><\/thead><tbody><tr><td>Вольфрам (APT)<\/td><td>Masan High-Tech Materials (Вьетнам), H.C. Starck Tungsten (Mitsubishi Materials), Wolfram Bergbau und Hütten (Sandvik), Global Tungsten &amp; Powders (Plansee), Japan New Metals, китайские производители APT, бывшие специалисты предприятий СНГ (с проверкой санкционных ограничений)<\/td><\/tr><tr><td>Рений, молибден<\/td><td>Molymet (Чили, Бельгия, Германия), KGHM (Польша), Freeport-McMoRan (Climax), АГМК (рядом!), предприятия Казахстана с опытом извлечения рения<\/td><\/tr><tr><td>Уран (СПВ, ионный обмен)<\/td><td>Навоийуран (Узбекистан), Казатомпром и его СП (Казахстан), Cameco (Канада, США), Orano (Франция), Boss Energy (Австралия)<\/td><\/tr><tr><td>РЗЭ<\/td><td>Lynas (Австралия, Малайзия), MP Materials (США), Neo Performance Materials (Silmet, Эстония), Solvay (Ла-Рошель, Франция), Iluka (Австралия), Energy Fuels (США), Saskatchewan Research Council (Канада), ANSTO (Австралия), Carester (Франция), IREL (Индия)<\/td><\/tr><tr><td>Литий<\/td><td>Albemarle, SQM, Ganfeng, Tianqi (Квинана, Австралия), Covalent Lithium (Австралия), литиевые проекты Европы (Германия, Финляндия)<\/td><\/tr><tr><td>Ni–Co<\/td><td>Sherritt (Канада), Sumitomo Metal Mining (Япония, Филиппины), Vale, Glencore (Murrin Murrin), китайские HPAL-проекты в Индонезии, BHP (бывшие специалисты Nickel West)<\/td><\/tr><tr><td>Испытания и инжиниринг<\/td><td>SGS, ALS, Bureau Veritas, Core Resources, Mintek, Hazen Research, Kemetco, ANSTO; инжиниринг — Hatch, Worley, Ausenco, Lycopodium<\/td><\/tr><tr><td>Наука<\/td><td>KU Leuven (Solvomet — партнёр TMK), TU Bergakademie Freiberg (партнёр TMK), Murdoch University, Curtin University, Colorado School of Mines, МИСИС (партнёр TMK), РХТУ им. Менделеева (химия редких элементов)<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (15 мин). Схема по памяти.<\/strong> Нарисуйте схему «вольфрамовый концентрат → APT», не глядя в текст. Сверьте. На каждом шаге подпишите профиль специалиста и одну критичную проблему.<\/p>\n<p><strong>Задание 2 (10 мин). Профиль позиции.<\/strong> «Главный технолог гидрометаллургического передела вольфрама (APT), Чирчик». Сформулируйте:<\/p>\n<ul><li>4 must-have, включая <strong>уровень масштаба<\/strong>;<\/li><li>3 nice-to-have;<\/li><li>8 компаний-доноров;<\/li><li>5 вопросов скрининга с маркерами сильного ответа.<\/li><\/ul>\n<p><strong>Бонус.<\/strong> Найдите в LinkedIn 5 человек по запросу <code>(\"ammonium paratungstate\" OR \"APT\") AND (process OR plant OR production)<\/code>. Определите уровень масштаба каждого по шкале 3.2.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Объясните коллеге за минуту, чем гидрометаллургия отличается от обогащения и от пирометаллургии.<\/li><li>Какой профиль гидрометаллурга для TMK самый дефицитный? Почему?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 9: экстракция, электролиз, рафинирование».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> сегодня был самый плотный день модуля. Если голова гудит, это нормально: так ощущается рост. Не разрешайте себе «отдохнуть пару дней». Завтра — минимальная версия, если нужно, но не пропуск.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Зеликман А. Н., Коршунов Б. Г. «Металлургия редких металлов» — классика по W, Mo, Re, РЗЭ.<\/li><li>E. Lassner, W.-D. Schubert, <em>Tungsten: Properties, Chemistry, Technology of the Element, Alloys, and Chemical Compounds<\/em> (Springer) — главная книга по вольфраму.<\/li><li>C. K. Gupta, N. Krishnamurthy, <em>Extractive Metallurgy of Rare Earths<\/em> (CRC Press).<\/li><li>F. Habashi, <em>Handbook of Extractive Metallurgy<\/em> — энциклопедия по извлечению металлов.<\/li><li>Конференции ALTA (Перт) — Uranium-REE, Ni-Co-Cu, Lithium; сборники докладов — источник имён экспертов.<\/li><li>Видео: «hydrometallurgy explained», «heap leach process», «HPAL nickel process», «ion exchange resin how it works».<\/li><\/ul>"},{"n":9,"module":2,"title":"Жидкостная экстракция, электролиз и рафинирование","file":"module-02-processing-metallurgy/day-09-solvent-extraction-electrowinning-refining.md","duration":"3,5 часа","challenge":"Объяснить «на пальцах» нанимающему менеджеру, <strong>почему разделение РЗЭ требует сотен ступеней экстракции<\/strong> и почему поэтому найти такого технолога вне Китая крайне трудно.","why":"Экстракция, электролиз и рафинирование — это то место, где металл получает чистоту «три девятки» и выше и становится товаром для аэрокосмоса, электроники и аккумуляторов. В плане TMK на 2026 г. — высокочистые селен, теллур и рений. Специалисты по высокой чистоте — самая узкая ниша рынка. Их не найти по ключевому слову «металлург». Их находят те, кто понимает, что именно они делают.","checklist":[{"text":"Разминка: 5 вопросов по Дню 8 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.5 (90 мин)","minutes":90},{"text":"Расчёт: закон Фарадея, 2 задачи (15 мин)","minutes":15},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: объяснение для менеджера + карта доноров по высокой чистоте (25 мин)","minutes":25},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2 (РЗЭ), 1.4 (обозначения чистоты) → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Жидкостная экстракция","en":"Solvent extraction (SX)","def":"Перенос металла из водной фазы в органическую"},{"ru":"Экстрагент","en":"Extractant","def":"Активное вещество органической фазы"},{"ru":"Разбавитель","en":"Diluent","def":"Керосиновая основа органической фазы"},{"ru":"Органическая фаза","en":"Organic phase","def":"Несмешивающийся с водой раствор экстрагента"},{"ru":"Водная фаза","en":"Aqueous phase","def":"Водный раствор металлов"},{"ru":"Экстракция","en":"Extraction / loading","def":"Переход металла в органику"},{"ru":"Промывка (скруббинг)","en":"Scrubbing","def":"Удаление примесей из насыщенной органики"},{"ru":"Реэкстракция","en":"Stripping","def":"Возврат металла из органики в чистый водный раствор"},{"ru":"Рафинат","en":"Raffinate","def":"Обеднённый водный раствор после экстракции"},{"ru":"Смеситель-отстойник","en":"Mixer-settler","def":"Основной аппарат экстракции"},{"ru":"Коэффициент распределения","en":"Distribution coefficient (D)","def":"Отношение концентраций в фазах"},{"ru":"Коэффициент разделения","en":"Separation factor (β)","def":"Мера селективности для двух металлов"},{"ru":"Каскад экстракции","en":"Extraction cascade / circuit","def":"Последовательность ступеней"},{"ru":"Унос","en":"Entrainment","def":"Перенос капель одной фазы в другую"},{"ru":"Межфазные образования","en":"Crud","def":"Эмульсионные отложения на границе фаз"},{"ru":"Электроэкстракция","en":"Electrowinning (EW)","def":"Выделение металла из раствора на катоде с нерастворимым анодом"},{"ru":"Электрорафинирование","en":"Electrorefining (ER)","def":"Очистка металла через растворимый анод"},{"ru":"Катод / анод","en":"Cathode / anode","def":"Электроды: восстановление / окисление"},{"ru":"Электролит","en":"Electrolyte","def":"Раствор, проводящий ток в ванне"},{"ru":"Выход по току","en":"Current efficiency","def":"Доля тока, ушедшая на целевую реакцию"},{"ru":"Анодный шлам","en":"Anode slimes","def":"Нерастворимый остаток анодов; источник Au, Ag, Se, Te"},{"ru":"Электролиз расплавленных солей","en":"Molten salt electrolysis","def":"Получение Al, Mg, Li, РЗЭ-металлов из расплавов"},{"ru":"Огневое рафинирование","en":"Fire refining","def":"Очистка расплава окислением и восстановлением"},{"ru":"Вакуумная дистилляция","en":"Vacuum distillation","def":"Очистка испарением и конденсацией в вакууме"},{"ru":"Зонная плавка","en":"Zone refining","def":"Метод получения сверхчистых веществ"},{"ru":"Электронно-лучевая плавка","en":"Electron beam melting (EBM)","def":"Рафинирование тугоплавких металлов в вакууме"},{"ru":"Высокочистый металл","en":"High-purity metal (4N, 5N, 6N)","def":"Металл с минимальным содержанием примесей"},{"ru":"Масс-спектрометрия тлеющего разряда","en":"GDMS (glow discharge mass spectrometry)","def":"Анализ следовых примесей в твёрдых образцах"},{"ru":"Мишень для напыления","en":"Sputtering target","def":"Изделие из высокочистого металла для электроники"},{"ru":"Оксид неодима-празеодима","en":"NdPr oxide","def":"Главный товарный продукт РЗЭ для магнитов"}],"quiz":[{"q":"Что происходит на стадии реэкстракции (stripping)?","options":["Металл переходит из водного раствора в органику","Органику сжигают","Раствор нейтрализуют известью","Металл возвращается из органики в чистый водный раствор с высокой концентрацией"],"answer":3,"explain":"Цикл: экстракция → промывка → реэкстракция. После реэкстракции органика возвращается на экстракцию."},{"q":"Почему разделение РЗЭ требует сотен ступеней экстракции?","options":["Из-за высокой цены РЗЭ","Из-за радиоактивности","Соседние РЗЭ химически почти одинаковы, коэффициенты разделения малы, на одной ступени они разделяются слабо","Так исторически сложилось в Китае"],"answer":2,"explain":"Малые коэффициенты разделения требуют длинных каскадов. Отсюда сложность технологии и дефицит специалистов."},{"q":"Какой экстрагент — основа китайских каскадов разделения РЗЭ?","options":["P507 (PC88A)","LIX","Ксантогенат","Цианид"],"answer":0,"explain":"P507 / PC88A — фосфорорганическая кислота. LIX — экстрагент для меди."},{"q":"Чем электроэкстракция отличается от электрорафинирования?","options":["Ничем","Электрорафинирование проводят без тока","При электроэкстракции анод нерастворимый и металл выделяется из раствора; при электрорафинировании растворяется анод из чернового металла","Электроэкстракция используется только для золота"],"answer":2,"explain":"EW получает металл из раствора (например, после SX). ER очищает уже полученный черновой металл."},{"q":"Главный мировой источник селена и теллура:","options":["Собственные селеновые месторождения","Анодный шлам электролитического рафинирования меди","Морская вода","Уголь"],"answer":1,"explain":"Se и Te — попутные продукты медного производства. Поэтому их выпуск привязан к медеплавильным и рафинировочным заводам."},{"q":"Ток 1 000 А течёт сутки, металл — медь, выход по току 100%. Масса меди примерно:","options":["2,8 кг","28,5 кг","285 кг","2,85 т"],"answer":1,"explain":"m = 1 000 · 86 400 · 63,55 / (2 · 96 485) ≈ 28,5 кг."},{"q":"Что означает обозначение 3N5?","options":["99,9%","99,995%","35 примесей","99,95%"],"answer":3,"explain":"Три девятки и пятёрка: 99,95%. Например, молибденовые штабики TMK — 99,95% Mo."},{"q":"Каким методом анализируют десятки следовых примесей в твёрдом высокочистом металле?","options":["GDMS (масс-спектрометрия тлеющего разряда)","Пробирный анализ","Титрование","Визуальный осмотр"],"answer":0,"explain":"GDMS — стандарт для сертификации 5N–6N. Без такой аналитики высокочистый металл не продать."},{"q":"Почему вольфрам и молибден нужны производителям металлов РЗЭ?","options":["Их добавляют в магниты","Они служат экстрагентами","Не нужны","Из них делают катоды для электролиза фторидных расплавов РЗЭ"],"answer":3,"explain":"При электролизе NdPr в фторидных расплавах используют вольфрамовые или молибденовые катоды: эти металлы выдерживают высокие температуры и агрессивную среду."},{"q":"Кандидат на роль технолога по высокочистому теллуру говорит: «Чистоту подтверждала лаборатория, я в это не вникала». Ваш вывод:","options":["Нормально: это работа лаборатории","Тревожный сигнал: технолог высокой чистоты должен понимать, какие примеси лимитируют и как они анализируются","Это плюс: кандидат доверяет коллегам","Вопрос не важен"],"answer":1,"explain":"В высокой чистоте технология и аналитика неразделимы. Непонимание аналитики говорит о поверхностном опыте."}],"html":"<h2>0. Разминка: вспомнить День 8<\/h2>\n<ol><li>Назовите шаги схемы «вольфрамовый концентрат → APT».<\/li><li>Чем ионный обмен отличается от осаждения?<\/li><li>Как извлекают рений из газов обжига молибденита?<\/li><li>Что такое шкала масштаба гидрометаллурга и какой уровень самый редкий?<\/li><li>Зачем TMK собственная серная кислота?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Разложение (сода или NaOH) → раствор вольфрамата натрия → очистка (Si, P, As, Mo) → экстракция или ионный обмен → вольфрамат аммония → выпарная кристаллизация → APT.<\/li><li>Ионный обмен поглощает ионы смолой с последующей десорбцией (концентрирование, разделение). Осаждение переводит вещество в нерастворимый осадок.<\/li><li>Re₂O₇ возгоняется при обжиге, улавливается мокрой газоочисткой; из промывных растворов рений сорбируют или экстрагируют, затем кристаллизуют перренат аммония.<\/li><li>Лаборатория → укрупнённые испытания → пилот → проектирование → пуск и вывод на мощность → эксплуатация. Самый редкий — пуск и вывод на мощность.<\/li><li>Серная кислота — самый массовый реагент гидрометаллургии; своя кислота — основа будущих переделов.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Жидкостная экстракция (solvent extraction, SX)<\/h3>\n<p><strong>Принцип.<\/strong> Водный раствор металлов смешивают с несмешивающейся с водой <strong>органической фазой<\/strong>, в которой растворён <strong>экстрагент<\/strong>. Экстрагент избирательно «забирает» нужный металл из воды в органику. Затем органику отделяют и <strong>реэкстрагируют<\/strong> (возвращают) металл в чистый водный раствор с высокой концентрацией.<\/p>\n<p><strong>Цикл экстракции:<\/strong><\/p>\n<pre class=\"code\"><code>Водный раствор (PLS) ──► ЭКСТРАКЦИЯ ──► рафинат (обеднённый раствор, возврат на выщелачивание)\n                              │ насыщенная органика\n                              ▼\n                         ПРОМЫВКА (скруббинг) — удаление соэкстрагированных примесей\n                              │\n                              ▼\n                         РЕЭКСТРАКЦИЯ ──► богатый чистый водный раствор → электролиз / осаждение / кристаллизация\n                              │ регенерированная органика\n                              └──────────► обратно на экстракцию<\/code><\/pre>\n<p><strong>Состав органической фазы:<\/strong><\/p>\n<ul><li><strong>экстрагент<\/strong> — активное вещество;<\/li><li><strong>разбавитель<\/strong> (diluent) — очищенный керосин;<\/li><li><strong>модификатор<\/strong> — улучшает расслаивание фаз.<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>Экстрагент (класс)<\/th><th>Примеры<\/th><th>Для чего<\/th><\/tr><\/thead><tbody><tr><td>Оксимы<\/td><td>LIX (BASF), Acorga (Syensqo)<\/td><td><strong>Медь<\/strong> — массовая технология SX-EW<\/td><\/tr><tr><td>Фосфорорганические кислоты<\/td><td><strong>D2EHPA<\/strong>, <strong>PC88A / P507<\/strong>, Cyanex 272<\/td><td><strong>РЗЭ<\/strong> (P507 — основа китайских каскадов), Zn; Cyanex 272 — разделение <strong>Co/Ni<\/strong><\/td><\/tr><tr><td>Нейтральные фосфорорганические<\/td><td><strong>ТБФ<\/strong> (трибутилфосфат), Cyanex 923<\/td><td>Уран, Zr/Hf, РЗЭ в нитратных средах<\/td><\/tr><tr><td>Амины<\/td><td>Alamine 336 (третичные), Aliquat 336 (четвертичные)<\/td><td><strong>Уран, вольфрам, молибден, рений, ванадий<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Оборудование:<\/strong><\/p>\n<ul><li><strong>смесители-отстойники<\/strong> (mixer-settlers) — основной аппарат: камера смешения + отстойник;<\/li><li><strong>пульсационные колонны<\/strong> (pulsed columns);<\/li><li><strong>центробежные экстракторы<\/strong> (centrifugal contactors).<\/li><\/ul>\n<p><strong>Ключевые параметры и проблемы:<\/strong><\/p>\n<ul><li><strong>коэффициент распределения<\/strong> D — отношение концентраций металла в органике и воде;<\/li><li><strong>коэффициент разделения<\/strong> β = D₁ / D₂ — насколько легко разделить два металла;<\/li><li>отношение потоков органики и воды (O/A); число ступеней (рассчитывают по диаграмме МакКейба–Тиле);<\/li><li><strong>унос органики<\/strong> с водой и воды с органикой (entrainment) — потери дорогого экстрагента и загрязнение продукта;<\/li><li><strong>межфазные образования<\/strong> (crud) — «грязь» на границе фаз, бич SX-установок;<\/li><li><strong>пожароопасность<\/strong>: органика горит. На SX-установках в мире случались крупные пожары, поэтому пожарная безопасность — отдельная компетенция.<\/li><\/ul>\n<h3>1.2 Почему разделение РЗЭ — «высшая лига» экстракции<\/h3>\n<p>РЗЭ (особенно соседние лантаноиды) химически <strong>почти одинаковы<\/strong>. Коэффициенты разделения соседних пар в типовых системах невелики (часто в диапазоне ~1,5–3 и ниже). Если на одной ступени металлы разделяются чуть-чуть, нужны <strong>каскады из десятков ступеней на одно разделение<\/strong>. Полная схема разделения на индивидуальные элементы — это <strong>сотни, а на крупных заводах — тысячи ступеней<\/strong> смесителей-отстойников.<\/p>\n<p><strong>Типовая логика:<\/strong><\/p>\n<ol><li>Разделение на группы: лёгкие (La, Ce, Pr, Nd) / средние (Sm, Eu, Gd) / тяжёлые (Tb, Dy, Ho, Er, Y…).<\/li><li>Затем выделение ценных индивидуальных элементов или пар: <strong>NdPr-оксид<\/strong> (для магнитов), <strong>Dy, Tb<\/strong> (жаростойкие магниты), Y, La, Ce.<\/li><li>Осаждение (оксалаты, карбонаты) → прокалка → <strong>оксиды РЗЭ<\/strong> чистотой 99–99,999%.<\/li><\/ol>\n<p><strong>Что из этого следует для подбора:<\/strong><\/p>\n<ul><li>Технолог каскадного разделения РЗЭ умеет моделировать каскады, управлять сотнями ступеней, держать баланс по каждому элементу и быстро реагировать на сбои. Таких людей в мире немного, большинство работает в Китае.<\/li><li>Вне Китая разделение РЗЭ промышленно ведут единицы компаний: Lynas (Малайзия), Solvay (Ла-Рошель, Франция), Neo Performance Materials (Silmet, Эстония), MP Materials (США), IREL (Индия) и несколько новых заводов (Energy Fuels, Iluka, Saskatchewan Research Council, Carester и др.).<\/li><li><strong>Экспорт китайских технологий извлечения и разделения РЗЭ запрещён с конца 2023 г.<\/strong> Найм специалистов из китайских компаний требует юридической оценки рисков передачи технологий.<\/li><\/ul>\n<h3>1.3 Электролиз: электроэкстракция и электрорафинирование<\/h3>\n<p><strong>Электроэкстракция<\/strong> (electrowinning, EW) — выделение металла из раствора на катоде с <strong>нерастворимым<\/strong> анодом.<\/p>\n<ul><li>На катоде: Me²⁺ + 2e⁻ → Me.<\/li><li>На аноде выделяется кислород, а кислота регенерируется и возвращается в процесс.<\/li><li>Медь: богатый электролит после SX → катоды на постоянных матрицах из нержавеющей стали (технология ISA и аналоги) → <strong>катодная медь класса Grade A<\/strong> (≈ 99,99% Cu).<\/li><li>Также электроэкстракцией получают цинк, кобальт, никель, марганец.<\/li><\/ul>\n<p><strong>Электрорафинирование<\/strong> (electrorefining, ER) — очистка металла: <strong>растворимый<\/strong> анод из чернового металла растворяется, чистый металл осаждается на катоде.<\/p>\n<ul><li>Медь: аноды после огневого рафинирования → катоды 99,99%.<\/li><li>Примеси идут в электролит (Ni, As, Sb, Bi) или в <strong>анодный шлам<\/strong> (Au, Ag, <strong>Se, Te<\/strong>, платиноиды).<\/li><li><strong>Анодный шлам медного рафинирования — главный мировой источник се
