ите вместе с REE и полными названиями;<\/li><li>слишком длинные строки ломаются: у Google есть ограничение на длину запроса, у LinkedIn — на сложность;<\/li><li><strong>не исключайте лишнего<\/strong>: <code>NOT sales<\/code> уберёт технического директора, который когда-то работал в продажах оборудования.<\/li><\/ul>\n<h3>1.2 LinkedIn: как искать технических людей<\/h3>\n<ul><li><strong>Поиск по ключевым словам + фильтры<\/strong>: текущая компания, бывшая компания, должность, география, отрасль, язык профиля.<\/li><li><strong>Поиск по бывшим сотрудникам<\/strong> закрытых или проданных предприятий: «Past company» — важнейший фильтр после сокращений.<\/li><li><strong>Поиск по компании → «Люди»<\/strong>: восстановление структуры подразделения (картирование).<\/li><li><strong>Сигналы<\/strong>: недавние изменения должности (часто не время для переезда), «Open to work» (редко у сильных технологов), публикации и комментарии по теме.<\/li><li><strong>Профили на русском и английском<\/strong>: многие специалисты СНГ ведут профиль на русском — ищите на обоих языках.<\/li><\/ul>\n<p><strong>Пример строки<\/strong> (технолог гидрометаллургии вольфрама):<\/p>\n<pre class=\"code\"><code>(\"ammonium paratungstate\" OR APT OR \"tungsten chemicals\" OR \"tungsten hydrometallurgy\" OR \"паравольфрамат\")\nAND (engineer OR technologist OR manager OR \"технолог\" OR \"начальник\")<\/code><\/pre>\n<h3>1.3 Google X-ray и поиск по открытому интернету<\/h3>\n<p><strong>X-ray<\/strong> — поиск по одному сайту через Google:<\/p>\n<pre class=\"code\"><code>site:linkedin.com/in (\"cemented carbide\" OR hardmetal) (\"sintering\" OR \"sinter-HIP\") (engineer OR manager)\nsite:linkedin.com/in \"rare earth\" (\"solvent extraction\" OR \"separation\") -jobs<\/code><\/pre>\n<p>Дополнительные приёмы:<\/p>\n<ul><li>поиск документов: <code>filetype:pdf \"technical report\" tungsten \"qualified person\"<\/code>;<\/li><li>программы конференций: <code>\"Plansee Seminar\" program pdf<\/code>, <code>ALTA \"uranium-REE\" presenters<\/code>;<\/li><li>сайты ассоциаций и университетов (списки докладчиков, сотрудников, выпускников).<\/li><\/ul>\n<p><strong>Региональные площадки<\/strong>: базы резюме hh.uz, hh.kz (для Узбекистана и Казахстана); телеграм-каналы и сообщества горняков и металлургов СНГ; профессиональные сообщества выпускников.<\/p>\n<h3>1.4 Патенты: поиск по изобретателям<\/h3>\n<p>Изобретатели в патентах — <strong>практики технологии<\/strong>. Патент указывает имя, компанию-заявителя, страну и дату.<\/p>\n<p><strong>Бесплатные базы:<\/strong> Google Patents, Espacenet (Европейское патентное ведомство), Lens.org, WIPO Patentscope.<\/p>\n<p><strong>Коды патентной классификации (CPC / МПК)<\/strong> — точнее ключевых слов:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Код<\/th><th>Область<\/th><\/tr><\/thead><tbody><tr><td>C22B 34/36<\/td><td>Получение вольфрама<\/td><\/tr><tr><td>C22B 34/34<\/td><td>Получение молибдена<\/td><\/tr><tr><td>C22B 59<\/td><td>Получение редкоземельных металлов<\/td><\/tr><tr><td>C01G 41<\/td><td>Соединения вольфрама (в т. ч. APT)<\/td><\/tr><tr><td>C01F 17<\/td><td>Соединения редкоземельных металлов<\/td><\/tr><tr><td>C01D 15<\/td><td>Соединения лития<\/td><\/tr><tr><td>C22C 29<\/td><td>Сплавы на основе карбидов (твёрдые сплавы)<\/td><\/tr><tr><td>B22F<\/td><td>Порошковая металлургия<\/td><\/tr><tr><td>H01F 1/057<\/td><td>Магниты R–Fe–B (NdFeB)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Как использовать:<\/strong> запрос «код + ключевые слова + последние 10 лет» → список изобретателей → аффилиация → LinkedIn, публикации, конференции. Обратите внимание на <strong>повторяющиеся имена<\/strong> — это лидеры технологии в компании.<\/p>\n<h3>1.5 Публикации, конференции, технические отчёты<\/h3>\n<ul><li><strong>Научные публикации<\/strong>: Google Scholar, Scopus, Web of Science, Semantic Scholar, OpenAlex, ResearchGate; на русском — eLibrary. Ищите авторов <strong>из компаний<\/strong> (не только университетов): соавторство с производством — признак прикладного опыта.<\/li><li><strong>Конференции<\/strong>: доклады и постеры (ITIA, IMOA, REIA, ALTA, Plansee Seminar, PowderMet, Euro PM, IMPC, COM (Conference of Metallurgists), MINEX, UIMF, Mining &amp; Metals Central Asia). Докладчик из компании-донора — почти гарантированно практик.<\/li><li><strong>Технические отчёты NI 43-101 и JORC<\/strong> (День 3) — эксперты по геологии, горным работам, переработке, с указанием разделов ответственности.<\/li><li><strong>Отраслевые медиа<\/strong>: интервью и новости о назначениях.<\/li><\/ul>\n<h3>1.6 Инструменты ИИ и данные кандидатов<\/h3>\n<ul><li><strong>ИИ-ассистенты<\/strong> полезны для: построения словарей синонимов, черновиков Boolean-строк, перевода профилей, сводок по компаниям.<\/li><li><strong>Обязательные ограничения:<\/strong><ul><li>проверяйте факты: ИИ может уверенно ошибаться в названиях компаний и должностей;<\/li><li><strong>не загружайте персональные данные кандидатов<\/strong> и конфиденциальную информацию TMK в инструменты, не одобренные компанией;<\/li><li>соблюдайте политику TMK по информационной безопасности.<\/li><\/ul><\/li><li><strong>Персональные данные<\/strong>: собирайте только нужное, храните в утверждённой системе, соблюдайте законодательство Узбекистана о персональных данных, а для граждан ЕС — GDPR (законное основание, уведомление, право на удаление).<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Поиск кандидатов<\/td><td>Sourcing<\/td><td>Выявление потенциальных кандидатов<\/td><\/tr><tr><td>Булев поиск<\/td><td>Boolean search<\/td><td>Поиск с операторами AND, OR, NOT<\/td><\/tr><tr><td>Поисковая строка<\/td><td>Search string<\/td><td>Запрос с операторами и синонимами<\/td><\/tr><tr><td>Словарь синонимов<\/td><td>Synonym list / keyword taxonomy<\/td><td>Варианты написания одного опыта<\/td><\/tr><tr><td>X-ray поиск<\/td><td>X-ray search<\/td><td>Поиск по одному сайту через Google (site:)<\/td><\/tr><tr><td>Поиск по бывшим сотрудникам<\/td><td>Alumni / past company search<\/td><td>Поиск людей, ушедших из компании<\/td><\/tr><tr><td>Изобретатель<\/td><td>Inventor<\/td><td>Автор изобретения в патенте<\/td><\/tr><tr><td>Патентный заявитель<\/td><td>Patent applicant / assignee<\/td><td>Компания, подавшая патент<\/td><\/tr><tr><td>Патентная классификация<\/td><td>Patent classification (CPC / IPC)<\/td><td>Коды областей техники<\/td><\/tr><tr><td>Патентная база<\/td><td>Patent database<\/td><td>Google Patents, Espacenet, Lens.org<\/td><\/tr><tr><td>Научная публикация<\/td><td>Scientific publication<\/td><td>Статья в журнале или сборнике<\/td><\/tr><tr><td>Аффилиация<\/td><td>Affiliation<\/td><td>Организация автора<\/td><\/tr><tr><td>Индекс цитирования<\/td><td>Citation index<\/td><td>Scopus, Web of Science<\/td><\/tr><tr><td>Доклад на конференции<\/td><td>Conference presentation / paper<\/td><td>Выступление с публикацией тезисов<\/td><\/tr><tr><td>Список докладчиков<\/td><td>Speaker list<\/td><td>Источник имён практиков<\/td><\/tr><tr><td>База резюме<\/td><td>CV database / resume database<\/td><td>hh.uz, hh.kz и др.<\/td><\/tr><tr><td>Пассивный поиск<\/td><td>Passive sourcing<\/td><td>Поиск людей, не ищущих работу<\/td><\/tr><tr><td>Выход на кандидата<\/td><td>Approach / outreach<\/td><td>Первый контакт<\/td><\/tr><tr><td>Персональные данные<\/td><td>Personal data<\/td><td>Информация о кандидате<\/td><\/tr><tr><td>Согласие на обработку данных<\/td><td>Consent to data processing<\/td><td>Законное основание обработки<\/td><\/tr><tr><td>Право на удаление<\/td><td>Right to erasure<\/td><td>Право кандидата удалить свои данные<\/td><\/tr><tr><td>Система управления кандидатами<\/td><td>Applicant tracking system (ATS) / CRM<\/td><td>Хранилище данных о кандидатах<\/td><\/tr><tr><td>Журнал поиска<\/td><td>Sourcing log<\/td><td>Запись запросов, источников и результатов<\/td><\/tr><tr><td>Ложноположительный результат<\/td><td>False positive<\/td><td>Нерелевантный профиль в выдаче<\/td><\/tr><tr><td>Охват поиска<\/td><td>Search coverage / recall<\/td><td>Доля найденных релевантных людей<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Признаки качественного поиска<\/h3>\n<ul><li><strong>Многоканальность<\/strong>: LinkedIn + X-ray + патенты + публикации + конференции + рекомендации. Один канал даёт перекос.<\/li><li><strong>Точность<\/strong>: в первых 20 результатах не меньше трети релевантных профилей.<\/li><li><strong>Журнал поиска<\/strong>: какие строки, какие источники, сколько найдено, сколько релевантно. Это позволяет повторить и улучшить поиск и отчитаться заказчику.<\/li><li><strong>Двуязычность<\/strong>: русские и английские строки, учёт местных названий должностей.<\/li><\/ul>\n<h3>3.2 Рекомендации: самый сильный канал<\/h3>\n<ul><li>Спрашивайте каждого эксперта и кандидата: <strong>«Кого вы считаете лучшим специалистом по этому процессу? Кто вас учил? С кем вы работали на пуске?»<\/strong><\/li><li>Рекомендация от уважаемого специалиста резко повышает вероятность ответа.<\/li><li>Записывайте связи между людьми: со временем карта превращается в <strong>сеть<\/strong>, где видно, кто кого знает.<\/li><\/ul>\n<h3>3.3 Этика поиска<\/h3>\n<ul><li>Не представляйтесь тем, кем вы не являетесь; не используйте ложные предлоги для получения информации.<\/li><li>Уважайте отказ и просьбу удалить данные.<\/li><li>Конфиденциальность поиска: не раскрывайте имена других кандидатов и детали, которые заказчик просил не раскрывать.<\/li><li>Не просите кандидатов передавать конфиденциальную информацию их работодателей.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Набор поисковых строк + 10 новых имён (65 мин).<\/strong> Позиция — из Дней 21–22.<\/p>\n<ol><li><strong>Словарь синонимов<\/strong>: 8–12 понятий, для каждого — 3–6 вариантов на английском и русском.<\/li><li><strong>Строки<\/strong>:<ul><li>2 строки для LinkedIn (EN и RU);<\/li><li>2 строки Google X-ray;<\/li><li>1 запрос в патентной базе (код CPC + ключевые слова + годы);<\/li><li>1 запрос в базе публикаций (тема + аффилиация компаний-доноров);<\/li><li>1 запрос для поиска программ конференций.<\/li><\/ul><\/li><li><strong>Журнал поиска<\/strong>: для каждой строки — количество результатов, релевантных среди первых 20, лучшие находки.<\/li><li><strong>10 новых имён<\/strong>, которых нет в карте Дня 22: источник, компания, роль, почему релевантен.<\/li><\/ol>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какой источник дал больше всего новых имён? Какой — меньше всего?<\/li><li>Какой синоним вы раньше не использовали, а он дал релевантные результаты?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 24: работа с кандидатом — контакт, мотивация, оффер, релокация».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы видите людей, которых не видят конкуренты: изобретателей, докладчиков, авторов отчётов. Завтра вы научитесь превращать имя из списка в разговор.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Руководства по Boolean-поиску от сообществ сорсеров (SourceCon и др.).<\/li><li>Справочные материалы Espacenet и Google Patents по поиску по классификации CPC.<\/li><li>Справка LinkedIn Recruiter по фильтрам и булевым операторам.<\/li><li>Текст Закона Республики Узбекистан «О персональных данных» и обзорные материалы по GDPR для рекрутеров.<\/li><\/ul>"},{"n":24,"module":5,"title":"Работа с кандидатом: первый контакт, мотивация, оффер и релокация","file":"module-05-technical-recruitment-talent-intelligence/day-24-candidate-engagement-offer-relocation.md","duration":"3,5 часа","challenge":"Написать <strong>три персонализированных первых сообщения<\/strong> (технолог из Европы, инженер из Казахстана, соотечественник за рубежом) и <strong>структуру оффера с пакетом релокации<\/strong> для иностранного специалиста.","why":"Найти имя — половина дела. Сильный технолог получает десятки сообщений от рекрутеров. Он ответит тому, кто в первых двух строках покажет, что понимает его работу и предлагает задачу, которая ему интересна. А потом поиск часто ломается на оффере: контрпредложение, семья, налоги, школа для детей. Сегодня вы научитесь доводить кандидата от первого сообщения до выхода на работу.","checklist":[{"text":"Разминка: 5 вопросов по Дню 23 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: возражения и ответы (30 мин)","minutes":30},{"text":"Практика: 3 сообщения + структура оффера с релокацией (55 мин)","minutes":55},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Первое сообщение","en":"Outreach message / approach","def":"Первый контакт с кандидатом"},{"ru":"Последовательность касаний","en":"Outreach sequence / follow-ups","def":"Серия контактов с паузами"},{"ru":"Факторы «от» и «к»","en":"Push and pull factors","def":"Причины уйти и причины прийти"},{"ru":"Мотивация кандидата","en":"Candidate motivation","def":"Что движет решением о переходе"},{"ru":"Возражение","en":"Objection","def":"Причина сомнений кандидата"},{"ru":"Работа с возражениями","en":"Objection handling","def":"Ответы на сомнения"},{"ru":"Предложение о работе","en":"Job offer","def":"Формальное предложение условий"},{"ru":"Письмо-предложение","en":"Offer letter","def":"Письменный оффер"},{"ru":"Брутто / нетто","en":"Gross / net","def":"До и после налогов"},{"ru":"Надбавка за удалённость","en":"Remote location / hardship allowance","def":"Доплата за сложную локацию"},{"ru":"Налоговое выравнивание","en":"Tax equalization","def":"Сохранение налоговой нагрузки экспата"},{"ru":"Релокационный пакет","en":"Relocation package","def":"Переезд, временное жильё, помощь"},{"ru":"Разрешение на работу","en":"Work permit","def":"Документ для работы иностранца"},{"ru":"Вахтовый график","en":"Rotation roster (e.g., 28/28)","def":"Смены работы и отдыха"},{"ru":"Контрпредложение","en":"Counteroffer","def":"Попытка удержать со стороны текущего работодателя"},{"ru":"Проверка рекомендаций","en":"Reference check","def":"Разговоры с бывшими руководителями и коллегами"},{"ru":"Срок уведомления","en":"Notice period","def":"Время до увольнения с текущего места"},{"ru":"Удерживающий бонус","en":"Retention bonus","def":"Выплата за отработанный срок"},{"ru":"Адаптация","en":"Onboarding","def":"Ввод нового сотрудника в работу"},{"ru":"План первых 90 дней","en":"90-day plan","def":"Цели и шаги первых трёх месяцев"},{"ru":"Наставник","en":"Mentor / buddy","def":"Сотрудник, помогающий адаптироваться"},{"ru":"Временный руководитель","en":"Interim manager","def":"Эксперт на срок проекта"},{"ru":"Передача знаний","en":"Knowledge transfer","def":"Обучение местных преемников"},{"ru":"Опыт кандидата","en":"Candidate experience","def":"Как кандидат ощущает процесс"},{"ru":"Отказ от оффера","en":"Offer decline / reneging","def":"Отказ после принятия или до выхода"}],"quiz":[{"q":"С чего должно начинаться первое сообщение сильному технологу?","options":["С конкретной детали его опыта, объясняющей, почему пишут именно ему","С размера зарплаты, бонуса и пакета для экспата","С подробного описания истории, структуры и достижений компании за последние годы","С просьбы прислать актуальное резюме на английском"],"answer":0,"explain":"Например, доклад, патент, проект или передел, который он вёл."},{"q":"Сколько касаний без ответа разумно сделать до паузы?","options":["Одно касание: второе сообщение уже навязчиво","Десять касаний подряд, пока кандидат не ответит","Обычно 3–4 касания с новыми аргументами и разными каналами","Писать каждый день в разные мессенджеры, пока не ответит"],"answer":2,"explain":"Каждое касание должно добавлять ценность, а не напоминать «я писала»."},{"q":"Какой вопрос даёт карту мотивации кандидата?","options":["«Сколько вы сейчас зарабатываете вместе с бонусами и какую сумму хотите получать у нас?»","«Почему вы когда-то выбрали именно эту профессию?»","«Где вы видите себя через десять лет в карьере?»","«Что должно измениться в вашей работе, чтобы вы серьёзно рассмотрели переход?»"],"answer":3,"explain":"Ответ показывает факторы «от» и «к», по которым строится оффер."},{"q":"Кандидат говорит: «Семья не поедет в Узбекистан». Лучший ход:","options":["Закончить разговор: без семьи кандидат не подходит для релокации в другую страну","Уточнить причины и обсудить варианты: вахту, школы, медицину, поездки домой","Пообещать, что семья быстро привыкнет к новой стране и городу","Предложить ему переехать одному, не обсуждая условия для семьи"],"answer":1,"explain":"Возражение — это информация о том, что нужно решить, а не всегда отказ."},{"q":"Почему ожидания по пакету нужно проверять до финального этапа?","options":["Чтобы оффер не стал сюрпризом и поиск не сорвался в конце","Чтобы снизить зарплату кандидату перед подписанием","Это требование налогового законодательства для экспатов","Чтобы кандидат перестал общаться с другими компаниями"],"answer":0,"explain":"Расхождение ожиданий в конце процесса — частая причина провала поиска."},{"q":"Что такое налоговое выравнивание?","options":["Снижение налогов по закону для всех сотрудников компании, включая местных специалистов","Полное освобождение экспата от налогов в стране работы","Механизм, сохраняющий для экспата налоговую нагрузку на уровне его страны","Ежегодная налоговая проверка сотрудника по месту работы"],"answer":2,"explain":"Сложная тема — решается с юристами и налоговыми консультантами."},{"q":"Как подготовить кандидата к контрпредложению текущего работодателя?","options":["Посоветовать не сообщать работодателю об уходе до последнего дня","Пообещать ему ещё более высокую зарплату, чем в контрпредложении","Запретить ему вести любые переговоры с текущим работодателем","Заранее обсудить, что он ответит, и напомнить о его причинах ухода"],"answer":3,"explain":"Факторы «от» редко решаются деньгами — контрпредложение часто лишь откладывает уход."},{"q":"Самая частая причина раннего ухода экспата:","options":["Сложность технических задач","Проблемы семьи и быта","Слишком высокая зарплата","Слишком много обучения"],"answer":1,"explain":"Поэтому адаптация включает поддержку семьи, а не только рабочий план."},{"q":"Когда разумно привлечь эксперта на время вместо найма в штат?","options":["Для ограниченной задачи: пуск передела, аудит технологии, подготовка к аккредитации","Всегда, потому что временный эксперт обходится дешевле штатного сотрудника с пакетом","Никогда: временные эксперты неэффективны и не передают знания","Только если лучший кандидат отказался от оффера в последний момент"],"answer":0,"explain":"Обязательно — с местным преемником и передачей знаний."},{"q":"Какой красный флаг в мотивации кандидата?","options":["Он хочет масштабную задачу и реальные полномочия","Он задаёт много вопросов о команде и технологии","Он подробно интересуется условиями для семьи","Его интересуют только деньги, а задача безразлична"],"answer":3,"explain":"Высокий риск раннего ухода при первом более выгодном предложении."}],"html":"<h2>0. Разминка: вспомнить День 23<\/h2>\n<ol><li>Зачем группировать синонимы через OR?<\/li><li>Что такое X-ray поиск? Приведите пример.<\/li><li>Почему изобретатели в патентах — ценный источник?<\/li><li>Какой канал даёт самую высокую вероятность ответа?<\/li><li>Что нельзя делать с ИИ-ассистентами при поиске?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Чтобы найти людей, описывающих тот же опыт разными словами.<\/li><li>Поиск по одному сайту через Google: <code>site:linkedin.com/in \"cemented carbide\" sintering<\/code>.<\/li><li>Это практики технологии с указанием компании, страны и даты.<\/li><li>Рекомендация от уважаемого коллеги.<\/li><li>Загружать персональные данные кандидатов и конфиденциальную информацию в неодобренные инструменты; полагаться на непроверенные факты.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Первое сообщение: формула<\/h3>\n<p><strong>Принцип:<\/strong> первое сообщение — не вакансия, а <strong>приглашение к разговору о задаче<\/strong>, понятной именно этому человеку.<\/p>\n<p><strong>Структура (5–7 предложений):<\/strong><\/p>\n<ol><li><strong>Почему именно вы<\/strong> — конкретная деталь из его опыта (доклад, патент, проект, передел).<\/li><li><strong>Задача<\/strong> — одной фразой и на его профессиональном языке.<\/li><li><strong>Почему это интересно<\/strong> — масштаб, «построить с нуля», стратегическая значимость, полномочия.<\/li><li><strong>Честная рамка<\/strong> — компания, страна, формат (возможна вахта или релокация).<\/li><li><strong>Маленький шаг<\/strong> — 20 минут разговора, без обязательств.<\/li><\/ol>\n<p><strong>Пример (EN, технолог из Европы):<\/strong><\/p>\n<blockquote><p>Hello Dr. Müller, I read your Plansee Seminar paper on carbon balance control in submicron WC–Co grades. I lead technical searches for TMK in Uzbekistan, a state-owned integrated tungsten and molybdenum producer from concentrate to hardmetal tools. We are building a new hardmetal line and need someone to set up the sintering and quality process from scratch, with real authority and a strong budget. Would you be open to a 20-minute confidential call next week, simply to hear the scope? No commitments.<\/p><\/blockquote>\n<p><strong>Пример (RU, инженер из Казахстана):<\/strong><\/p>\n<blockquote><p>Добрый день, Айдар! Видела ваш доклад на MINEX о пуске сорбционного передела на полигоне ПВ. Я веду поиск технических специалистов для TMK (Узбекистан, Чирчик): мы запускаем пилот по извлечению рения и РЗЭ из продуктивных растворов урановых месторождений вместе с KU Leuven. Задача — довести пилот до промышленного модуля, и ваш опыт сорбции на больших потоках здесь ключевой. Готовы 20 минут поговорить конфиденциально, просто чтобы узнать подробности?<\/p><\/blockquote>\n<p><strong>Ошибки, которые убивают ответ:<\/strong><\/p>\n<ul><li>шаблон «Уважаемый кандидат, у нас интересная вакансия»;<\/li><li>неправильный язык профессии (ошибки в терминах сразу видны);<\/li><li>зарплата в первой строке (кроме случаев, когда она — главный аргумент и вы уверены в ней);<\/li><li>длинная простыня текста;<\/li><li>давление и срочность.<\/li><\/ul>\n<p><strong>Последовательность касаний:<\/strong> первое сообщение → напоминание через 4–7 дней (новый аргумент, а не «я писала») → третье касание через другой канал (почта, рекомендация) → пауза. Больше 3–4 касаний без ответа — навязчивость.<\/p>\n<h3>1.2 Мотивация кандидата: факторы «от» и «к»<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Факторы «от» (push)<\/th><th>Факторы «к» (pull)<\/th><\/tr><\/thead><tbody><tr><td>Застой, нет роста<\/td><td>Масштаб задачи, строительство с нуля<\/td><\/tr><tr><td>Закрытие проекта, сокращения<\/td><td>Полномочия и влияние<\/td><\/tr><tr><td>Конфликт с руководством<\/td><td>Новая технология, стратегический металл<\/td><\/tr><tr><td>Нестабильность компании<\/td><td>Вознаграждение, пакет, накопления<\/td><\/tr><tr><td>Ограниченный бюджет на развитие<\/td><td>Международные партнёры, видимость в отрасли<\/td><\/tr><tr><td>Санкционные ограничения нынешнего работодателя<\/td><td>Близость к дому (соотечественники), язык<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Правило:<\/strong> главный вопрос первого разговора — <strong>«Что должно измениться в вашей работе, чтобы вы серьёзно рассмотрели переход?»<\/strong> Ответ даёт карту мотивации, по которой строится вся дальнейшая работа и оффер.<\/p>\n<h3>1.3 Возражения кандидатов и честные ответы<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Возражение<\/th><th>Что стоит за ним<\/th><th>Ответ (направление)<\/th><\/tr><\/thead><tbody><tr><td>«Узбекистан? Не рассматриваю»<\/td><td>Неизвестность, стереотипы<\/td><td>Факты о проекте, партнёрах (США, ЕС, Корея, Япония), предложение поговорить с экспатом TMK или партнёром<\/td><\/tr><tr><td>«Государственная компания — медленно и бюрократично»<\/td><td>Страх процедур<\/td><td>Честно о процедурах + полномочия роли, поддержка руководства, скорость решений по конкретному проекту<\/td><\/tr><tr><td>«Семья не поедет»<\/td><td>Школа, работа супруга, медицина<\/td><td>Варианты вахты, международные школы в Ташкенте, медицинская страховка, поездки домой<\/td><\/tr><tr><td>«Санкционные риски»<\/td><td>Опасения за карьеру и безопасность<\/td><td>Факты о партнёрах и комплаенсе TMK; не преуменьшайте, отвечайте честно<\/td><\/tr><tr><td>«Меня не отпустят, будет контрпредложение»<\/td><td>Лояльность, зависимость<\/td><td>Обсудить заранее: что изменится через 6 месяцев, если он останется<\/td><\/tr><tr><td>«Мне нужна зарплата X»<\/td><td>Ожидания рынка<\/td><td>Уточнить структуру ожиданий (на руки, налоги, пакет), сравнить итоговую стоимость пакета<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.4 Оффер и пакет экспата<\/h3>\n<p><strong>Структура пакета<\/strong> (не все элементы обязательны; формирует HR и юристы TMK):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Элемент<\/th><th>Комментарий<\/th><\/tr><\/thead><tbody><tr><td>Базовый оклад<\/td><td>Брутто или нетто — фиксировать явно; валюта выплаты<\/td><\/tr><tr><td>Надбавка за удалённость или сложность локации<\/td><td>Для площадок вне Ташкента<\/td><\/tr><tr><td>Бонус<\/td><td>Связь с результатами из профиля успеха<\/td><\/tr><tr><td>Жильё<\/td><td>Предоставляемое или компенсация<\/td><\/tr><tr><td>Перелёты<\/td><td>Вахта: билеты на каждую ротацию; релокация: ежегодные поездки семьи<\/td><\/tr><tr><td>Медицинская страховка<\/td><td>Международная, для семьи<\/td><\/tr><tr><td>Обучение детей<\/td><td>Компенсация международной школы<\/td><\/tr><tr><td>Налоги<\/td><td>Налоговое выравнивание или защита — сложная тема для юристов<\/td><\/tr><tr><td>Релокационный пакет<\/td><td>Переезд, временное жильё, помощь с документами<\/td><\/tr><tr><td>Разрешения на работу и визы<\/td><td>Процедуры для иностранных специалистов — заранее с юристами TMK<\/td><\/tr><tr><td>Удержание<\/td><td>Бонус за отработанный срок, программа долгосрочной мотивации<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Вахта или релокация.<\/strong> Для удалённых площадок экспаты часто работают <strong>вахтой<\/strong> (распространены графики 28/28, 21/21, 14/14), для Ташкента и Чирчика — с переездом семьи. Выбор влияет и на стоимость, и на пул кандидатов.<\/p>\n<p><strong>Правила оффера:<\/strong><\/p>\n<ul><li><strong>проверяйте ожидания до финального этапа<\/strong>: оффер не должен быть сюрпризом ни для кого;<\/li><li><strong>оффер в письменном виде<\/strong> со всеми элементами пакета и датой выхода;<\/li><li><strong>срок ответа<\/strong> — разумный (обычно несколько дней), с готовностью ответить на вопросы.<\/li><\/ul>\n<h3>1.5 Контрпредложение, рекомендации, выход на работу<\/h3>\n<ul><li><strong>Контрпредложение<\/strong> (counteroffer): готовьте кандидата заранее: «Что вы ответите, если вам предложат повышение?» Напомните о факторах «от»: деньги редко решают их.<\/li><li><strong>Проверка рекомендаций<\/strong> (references): 2–3 разговора с бывшими руководителями и коллегами. Спрашивайте о <strong>конкретных результатах и поведении<\/strong>, а не «хороший ли человек» (подробно — День 27).<\/li><li><strong>Срок уведомления<\/strong> у нынешнего работодателя различается по странам и должностям — от пары недель до нескольких месяцев. Учитывайте его в плане.<\/li><li><strong>Период до выхода<\/strong>: держите контакт (новости проекта, знакомство с командой), риск «перехвата» в этот период высок.<\/li><li><strong>Адаптация<\/strong> (onboarding): план первых 90 дней, наставник, знакомство со стейкхолдерами, переводчик при необходимости, поддержка семьи. Ранний уход экспата чаще всего связан с <strong>семьёй и бытом<\/strong>, а не с работой.<\/li><\/ul>\n<h3>1.6 Альтернативы найму в штат<\/h3>\n<ul><li><strong>Консультант или эксперт на время<\/strong> (interim): пуск передела, аудит технологии, подготовка к аккредитации.<\/li><li><strong>Ротационный эксперт<\/strong> с передачей знаний местному преемнику.<\/li><li><strong>Технологический партнёр<\/strong> (KU Leuven, ReElement, SGS, корейские партнёры Smart Powder) — часть экспертизы приходит через партнёрство.<\/li><li><strong>Вышедшие на пенсию эксперты<\/strong> — для обучения и консультаций (ценный и часто недоиспользуемый ресурс).<\/li><\/ul>\n<p><strong>Локализация:<\/strong> у каждого экспата должен быть <strong>местный преемник<\/strong> и план передачи знаний. Это и задача TMK по подготовке кадров, и аргумент для экспата: «вы строите школу».<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Первое сообщение<\/td><td>Outreach message / approach<\/td><td>Первый контакт с кандидатом<\/td><\/tr><tr><td>Последовательность касаний<\/td><td>Outreach sequence / follow-ups<\/td><td>Серия контактов с паузами<\/td><\/tr><tr><td>Факторы «от» и «к»<\/td><td>Push and pull factors<\/td><td>Причины уйти и причины прийти<\/td><\/tr><tr><td>Мотивация кандидата<\/td><td>Candidate motivation<\/td><td>Что движет решением о переходе<\/td><\/tr><tr><td>Возражение<\/td><td>Objection<\/td><td>Причина сомнений кандидата<\/td><\/tr><tr><td>Работа с возражениями<\/td><td>Objection handling<\/td><td>Ответы на сомнения<\/td><\/tr><tr><td>Предложение о работе<\/td><td>Job offer<\/td><td>Формальное предложение условий<\/td><\/tr><tr><td>Письмо-предложение<\/td><td>Offer letter<\/td><td>Письменный оффер<\/td><\/tr><tr><td>Брутто / нетто<\/td><td>Gross / net<\/td><td>До и после налогов<\/td><\/tr><tr><td>Надбавка за удалённость<\/td><td>Remote location / hardship allowance<\/td><td>Доплата за сложную локацию<\/td><\/tr><tr><td>Налоговое выравнивание<\/td><td>Tax equalization<\/td><td>Сохранение налоговой нагрузки экспата<\/td><\/tr><tr><td>Релокационный пакет<\/td><td>Relocation package<\/td><td>Переезд, временное жильё, помощь<\/td><\/tr><tr><td>Разрешение на работу<\/td><td>Work permit<\/td><td>Документ для работы иностранца<\/td><\/tr><tr><td>Вахтовый график<\/td><td>Rotation roster (e.g., 28/28)<\/td><td>Смены работы и отдыха<\/td><\/tr><tr><td>Контрпредложение<\/td><td>Counteroffer<\/td><td>Попытка удержать со стороны текущего работодателя<\/td><\/tr><tr><td>Проверка рекомендаций<\/td><td>Reference check<\/td><td>Разговоры с бывшими руководителями и коллегами<\/td><\/tr><tr><td>Срок уведомления<\/td><td>Notice period<\/td><td>Время до увольнения с текущего места<\/td><\/tr><tr><td>Удерживающий бонус<\/td><td>Retention bonus<\/td><td>Выплата за отработанный срок<\/td><\/tr><tr><td>Адаптация<\/td><td>Onboarding<\/td><td>Ввод нового сотрудника в работу<\/td><\/tr><tr><td>План первых 90 дней<\/td><td>90-day plan<\/td><td>Цели и шаги первых трёх месяцев<\/td><\/tr><tr><td>Наставник<\/td><td>Mentor / buddy<\/td><td>Сотрудник, помогающий адаптироваться<\/td><\/tr><tr><td>Временный руководитель<\/td><td>Interim manager<\/td><td>Эксперт на срок проекта<\/td><\/tr><tr><td>Передача знаний<\/td><td>Knowledge transfer<\/td><td>Обучение местных преемников<\/td><\/tr><tr><td>Опыт кандидата<\/td><td>Candidate experience<\/td><td>Как кандидат ощущает процесс<\/td><\/tr><tr><td>Отказ от оффера<\/td><td>Offer decline / reneging<\/td><td>Отказ после принятия или до выхода<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Первый разговор с кандидатом: план на 20–30 минут<\/h3>\n<ol><li><strong>Рамка<\/strong> (2 мин): кто вы, почему звоните, конфиденциальность.<\/li><li><strong>Его история<\/strong> (10 мин): текущая роль, масштаб, что нравится, что нет. Задавайте 1–2 технических вопроса по процессу: это строит доверие.<\/li><li><strong>Задача TMK<\/strong> (5 мин): контекст, результаты, почему это интересно.<\/li><li><strong>Мотивация<\/strong> (5 мин): «Что должно измениться, чтобы вы рассмотрели переход?»<\/li><li><strong>Рамки<\/strong> (3 мин): семья, локация, вахта или переезд, ожидания по вознаграждению (структурно), сроки.<\/li><li><strong>Следующий шаг<\/strong> (2 мин): что дальше и когда.<\/li><\/ol>\n<h3>3.2 Красные флаги в мотивации<\/h3>\n<ul><li>Интересуют <strong>только деньги<\/strong>, задача безразлична — высокий риск раннего ухода.<\/li><li><strong>Не может объяснить<\/strong>, почему уходит с прошлых мест, или во всех уходах «виноваты другие».<\/li><li><strong>Неясная позиция семьи<\/strong> по переезду в конце процесса.<\/li><li><strong>Ведёт параллельно много процессов<\/strong> и использует оффер TMK для торга с текущим работодателем.<\/li><\/ul>\n<h3>3.3 Узбекистан для иностранного кандидата: что подготовить заранее<\/h3>\n<ul><li>Короткий <strong>информационный пакет<\/strong>: о TMK и проекте, о Ташкенте и Чирчике (жильё, школы, медицина, безопасность, перелёты), о налогах и визах (с юристами TMK).<\/li><li>Возможность <strong>поговорить с экспатом<\/strong>, который уже работает в Узбекистане (в TMK или у партнёров).<\/li><li><strong>Видеоэкскурсия<\/strong> по площадке или визит кандидата на площадку до оффера — для ключевых ролей окупается.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (30 мин). Три первых сообщения<\/strong> по формуле 1.1:<\/p>\n<ol><li>технологу твёрдых сплавов из Европы (на английском);<\/li><li>инженеру по сорбции на урановых полигонах из Казахстана (на русском);<\/li><li>узбекскому специалисту по гидрометаллургии, работающему в Корее или Германии (на русском или узбекском).<\/li><\/ol>\n<p>Каждое — не длиннее 7 предложений, с конкретной деталью из «его» опыта (можно вымышленной, но правдоподобной) и маленьким следующим шагом.<\/p>\n<p><strong>Задание 2 (25 мин). Структура оффера<\/strong> для иностранного «Главного технолога APT» с переездом семьи в Ташкент или Чирчик: элементы пакета из таблицы 1.4, что обязательно, что опционально, какие вопросы нужно заранее решить с юристами и HR TMK.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какое из трёх сообщений далось труднее? Почему?<\/li><li>Какие вопросы по пакету экспата нужно обсудить с юристами и HR TMK до первого реального оффера?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 25: управление проектом поиска и отчётность. Финал модуля».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы умеете не только находить, но и вести кандидата. Это и есть разница между «искать резюме» и Executive Search.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Материалы отраслевых сообществ рекрутеров о персонализированном outreach и candidate experience.<\/li><li>Обзоры экспатских пакетов и мобильности от крупных консалтинговых компаний (обзоры международной мобильности).<\/li><li>C. Fernández-Aráoz, <em>It's Not the How or the What but the Who<\/em> — о мотивации и потенциале руководителей.<\/li><li>Внутренние политики TMK по найму иностранных специалистов (запросите у HR и юристов).<\/li><\/ul>"},{"n":25,"module":5,"title":"Управление проектом поиска: этапы, метрики, отчётность и пайплайн талантов TMK","file":"module-05-technical-recruitment-talent-intelligence/day-25-search-project-management.md","duration":"4 часа","challenge":"Написать <strong>стратегию поиска<\/strong> для одной позиции TMK — от брифинга до выхода на работу, с графиком, метриками воронки, форматом еженедельного отчёта — и пройти итоговый тест модуля.","why":"У TMK 120+ проектов, и вакансий будет много одновременно. Без управления поиски «зависают», заказчики теряют доверие, кандидаты уходят к конкурентам. Рекрутер, который приходит к руководителю с понятным планом, цифрами воронки и честным статусом, получает больше полномочий и бюджета. Сегодня вы собираете всё из модуля в одну систему.","checklist":[{"text":"Разминка: 5 вопросов по Дням 21–24 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: внешние агентства и пайплайн (25 мин)","minutes":25},{"text":"Кейс-финал: стратегия поиска для позиции TMK (50 мин)","minutes":50},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Итоговый тест модуля 5 ≥ 16/20 — см. <a href=\"#module-5\">README модуля<\/a> (20 мин)","minutes":20},{"text":"Teach-back: 10 минут показываете руководителю стратегию поиска","minutes":0},{"text":"Рефлексия (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.3 → тест дня. Кейс и итоговый тест модуля — до начала Модуля 6.","terms":[{"ru":"Проект поиска","en":"Search assignment / search project","def":"Поиск на конкретную позицию"},{"ru":"Стратегия поиска","en":"Search strategy","def":"План каналов, доноров, сроков"},{"ru":"Воронка подбора","en":"Recruitment funnel / pipeline","def":"Этапы от выявления до найма"},{"ru":"Конверсия","en":"Conversion rate","def":"Доля перешедших на следующий этап"},{"ru":"Время до шорт-листа","en":"Time to shortlist","def":"Срок до первых сильных кандидатов"},{"ru":"Время до закрытия","en":"Time to fill / time to hire","def":"Срок до найма"},{"ru":"Доля принятых офферов","en":"Offer acceptance rate","def":"Принятые офферы ко всем выданным"},{"ru":"Качество найма","en":"Quality of hire","def":"Результаты и удержание нанятых"},{"ru":"Охват рынка","en":"Market coverage","def":"Доля целевых компаний с контактом"},{"ru":"Еженедельный отчёт","en":"Weekly status report","def":"Статус поиска для заказчика"},{"ru":"Презентация кандидата","en":"Candidate presentation / report","def":"Документ о кандидате для заказчика"},{"ru":"Сравнительная матрица","en":"Comparison matrix","def":"Кандидаты против критериев"},{"ru":"Эксклюзивный поиск","en":"Retained search","def":"Поиск с поэтапной оплатой агентству"},{"ru":"Оплата за результат","en":"Contingency search","def":"Оплата только при найме"},{"ru":"Исследование рынка по заказу","en":"Research-only engagement","def":"Агентство делает карту и лонг-лист"},{"ru":"Исключения из поиска","en":"Off-limits / exclusions","def":"Компании, где нельзя искать"},{"ru":"Сообщество кандидатов","en":"Talent community","def":"Пул людей для будущих позиций"},{"ru":"Пайплайн талантов","en":"Talent pipeline","def":"Система постоянного наполнения пула"},{"ru":"План преемственности","en":"Succession plan","def":"Подготовка внутренних преемников"},{"ru":"Внутренний кандидат","en":"Internal candidate","def":"Сотрудник компании"},{"ru":"Бренд работодателя","en":"Employer brand","def":"Репутация компании как работодателя"},{"ru":"Стажировочная программа","en":"Graduate / internship programme","def":"Программа для молодых специалистов"},{"ru":"Дуальное обучение","en":"Dual education","def":"Обучение с практикой на предприятии"},{"ru":"Испытательный срок","en":"Probation period","def":"Период проверки нового сотрудника"},{"ru":"Ретроспектива поиска","en":"Search post-mortem / retrospective","def":"Разбор поиска после закрытия"}],"quiz":[{"q":"Сколько обычно занимает путь от брифинга до выхода на работу для редкой технической роли с релокацией?","options":["1–2 недели","Нередко 3–6 месяцев и больше","Ровно 30 дней по стандарту","Не меньше двух лет"],"answer":1,"explain":"Это нужно проговорить с заказчиком на старте."},{"q":"Много кандидатов отклоняются после интервью заказчика. Вероятная причина:","options":["Плохие и шаблонные сообщения кандидатам при первом контакте","Неверно выбраны компании-доноры в карте талантов","Слишком короткий срок уведомления у кандидатов","Несогласованный профиль или скрытые требования заказчика"],"answer":3,"explain":"Лечится оценочной картой до интервью и ранней калибровкой."},{"q":"Какая метрика главная, но поздняя?","options":["Качество найма — результаты и удержание через 6–12 месяцев","Число просмотренных профилей в LinkedIn за неделю на одного рекрутера","Число отправленных сообщений кандидатам за месяц","Число звонков и встреч рекрутера в неделю"],"answer":0,"explain":"Остальные метрики — промежуточные."},{"q":"Когда сообщать заказчику плохие новости о ходе поиска?","options":["После закрытия вакансии в отчёте","Только если заказчик спросит сам","Рано и с вариантами решения","Никогда: это подрывает доверие"],"answer":2,"explain":"Ранняя честность сохраняет доверие; поздняя — разрушает."},{"q":"Что должно быть в презентации кандидата для шорт-листа?","options":["Только полное резюме кандидата без комментариев рекрутера, чтобы заказчик составил мнение сам","Карьера с цифрами масштаба, оценки по карте, сильные стороны и риски, мотивация, рекомендация","Фотография, возраст и семейное положение кандидата","Список хобби, интересов и личных качеств кандидата"],"answer":1,"explain":"Плюс сравнительная матрица по всем кандидатам."},{"q":"Когда оправдан эксклюзивный поиск с предоплатой (retained search)?","options":["Для массового найма операторов и рабочих","Для временных сезонных работников на стройке","Для любой вакансии без исключений и приоритетов, включая массовые роли","Для топ-позиций, конфиденциальных и сверхдефицитных ролей"],"answer":3,"explain":"Для массовых ролей разумнее оплата за результат или собственный поиск."},{"q":"Что такое калибровка в проекте поиска?","options":["Ранний показ 2–3 кандидатов заказчику для уточнения профиля по обратной связи","Настройка и поверка измерительных приборов лаборатории перед интервью с аналитиками","Проверка зарплатных ожиданий кандидатов перед оффером","Согласование бюджета на поиск с финансовой службой"],"answer":0,"explain":"Обратная связь на реальных кандидатах уточняет профиль быстрее любых обсуждений."},{"q":"Зачем TMK пайплайн талантов, а не только поиск под каждую вакансию?","options":["Чтобы вообще не нанимать специалистов из-за рубежа","Пайплайн нужен только для отчёта акционерам и наблюдательному совету","Однотипные роли повторяются, и система быстрее и дешевле разовых поисков","Это прямое требование стандарта ISO 9001 к компании"],"answer":2,"explain":"Карты по семействам ролей, сообщество кандидатов, волны найма, преемники, студенты, соотечественники."},{"q":"Что делать после закрытия каждого поиска?","options":["Немедленно удалить все данные кандидатов и переписку","Провести ретроспективу: что сработало, какие доноры дали кандидатов, что изменить","Закрыть заказчику доступ к отчётам и материалам поиска, чтобы защитить данные кандидатов","Ничего: поиск завершён, можно переходить к следующему"],"answer":1,"explain":"Ретроспективы превращают опыт в систему. Данные храните по правилам, а не удаляйте бессистемно."},{"q":"Какой ответ рекрутера говорит о зрелом процессе?","options":["«Я ищу через личные связи, а процесс держу в голове — так быстрее и не нужна бюрократия»","«Шлю заказчику все найденные резюме, пусть сам выбирает лучших»","«Отчитываюсь заказчику, когда появляется подходящий кандидат»","«Каждый поиск: профиль, стратегия, еженедельный отчёт, шорт-лист с оценками, ретроспектива»"],"answer":3,"explain":"Так выглядит управляемый Executive Search."}],"html":"<h2>0. Разминка: вспомнить Дни 21–24<\/h2>\n<ol><li>Какие пять измерений технической роли?<\/li><li>Что такое кольца 1–3 в карте талантов?<\/li><li>Какие источники дают имена, которых не видят конкуренты?<\/li><li>Какова формула первого сообщения кандидату?<\/li><li>Самая частая причина раннего ухода экспата?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Металл, процесс, стадия, масштаб, уровень роли.<\/li><li>Прямые аналоги по процессу; смежные процессы; переносимые отрасли.<\/li><li>Патенты (изобретатели), публикации (авторы из компаний), программы конференций, технические отчёты, рекомендации.<\/li><li>Почему именно вы → задача на его языке → почему интересно → честная рамка → маленький шаг.<\/li><li>Семья и быт.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Жизненный цикл проекта поиска<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Этап<\/th><th>Результат<\/th><th>Ориентир по срокам (для сложной технической роли)<\/th><\/tr><\/thead><tbody><tr><td>1. Брифинг и профиль позиции<\/td><td>Утверждённый одностраничный профиль, оценочная карта<\/td><td>1 неделя<\/td><\/tr><tr><td>2. Стратегия и карта талантов<\/td><td>Список целевых компаний (3 кольца), размер пула, план каналов<\/td><td>1–2 недели<\/td><\/tr><tr><td>3. Поиск и выход на кандидатов<\/td><td>Лонг-лист, первые разговоры<\/td><td>2–6 недель (параллельно с этапом 2)<\/td><\/tr><tr><td>4. Скрининг и оценка<\/td><td>Структурированные интервью, проверка опыта (Модуль 6)<\/td><td>2–4 недели<\/td><\/tr><tr><td>5. Шорт-лист и презентация заказчику<\/td><td>3–5 кандидатов с оценками и рисками<\/td><td>Обычно через 4–8 недель от старта<\/td><\/tr><tr><td>6. Интервью заказчика и финальная оценка<\/td><td>Решение по кандидату<\/td><td>2–4 недели<\/td><\/tr><tr><td>7. Рекомендации, оффер, переговоры<\/td><td>Принятый оффер<\/td><td>1–3 недели<\/td><\/tr><tr><td>8. Срок уведомления и выход<\/td><td>Выход на работу<\/td><td>От пары недель до нескольких месяцев<\/td><\/tr><tr><td>9. Адаптация и контроль<\/td><td>План 90 дней, обратная связь через 1, 3, 6 месяцев<\/td><td>3–6 месяцев<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Итог:<\/strong> для редкой технической или руководящей роли путь от брифинга до выхода нередко занимает <strong>3–6 месяцев и больше<\/strong>, особенно с релокацией. Это нужно проговорить с заказчиком на старте.<\/p>\n<h3>1.2 Метрики воронки<\/h3>\n<pre class=\"code\"><code>Выявлено (лонг-лист) → Контакт установлен → Интерес подтверждён → Проведён скрининг\n→ Шорт-лист → Интервью заказчика → Оффер → Оффер принят → Выход на работу → Прошёл испытательный срок<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>Метрика<\/th><th>Зачем<\/th><\/tr><\/thead><tbody><tr><td><strong>Конверсия по этапам<\/strong><\/td><td>Где «течёт» воронка: нет откликов — плохие сообщения или неверные доноры; много отказов после интервью — несогласованный профиль<\/td><\/tr><tr><td><strong>Время до шорт-листа<\/strong> (time to shortlist)<\/td><td>Скорость первых результатов<\/td><\/tr><tr><td><strong>Время до закрытия<\/strong> (time to fill, time to hire)<\/td><td>Итоговый срок<\/td><\/tr><tr><td><strong>Доля принятых офферов<\/strong> (offer acceptance rate)<\/td><td>Качество работы с мотивацией и пакетом<\/td><\/tr><tr><td><strong>Качество найма<\/strong> (quality of hire): результаты через 6–12 месяцев, удержание<\/td><td>Главная метрика, но поздняя<\/td><\/tr><tr><td><strong>Охват рынка<\/strong>: доля целевых компаний, где установлен контакт<\/td><td>Полнота поиска<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ориентиры конверсии<\/strong> сильно зависят от роли и рынка. Не обещайте заказчику универсальных цифр — показывайте <strong>собственную статистику<\/strong> по прошлым поискам.<\/p>\n<h3>1.3 Еженедельный отчёт заказчику<\/h3>\n<p><strong>Формат на одну страницу:<\/strong><\/p>\n<ol><li><strong>Статус<\/strong> (одна фраза): «Идём по плану / есть риск / нужна помощь».<\/li><li><strong>Воронка в цифрах<\/strong>: выявлено, контакт, интерес, скрининг, шорт-лист.<\/li><li><strong>Ключевые кандидаты<\/strong>: 2–3 строки на каждого (без лишних персональных данных).<\/li><li><strong>Что узнали о рынке<\/strong>: отказы и их причины (вознаграждение, локация, семья), конкурирующие работодатели.<\/li><li><strong>Решения, нужные от заказчика<\/strong>: обратная связь по кандидатам, бюджет, изменение профиля, дата интервью.<\/li><li><strong>План на следующую неделю.<\/strong><\/li><\/ol>\n<p><strong>Правило:<\/strong> плохие новости — рано и с вариантами решения. Заказчик прощает «рынок сложнее, чем мы думали» в первую неделю и не прощает в восьмую.<\/p>\n<h3>1.4 Шорт-лист и презентация кандидатов<\/h3>\n<p><strong>Каждый кандидат в шорт-листе<\/strong> — одна-две страницы:<\/p>\n<ul><li>краткая карьера с цифрами масштаба;<\/li><li>соответствие оценочной карте (баллы по критериям);<\/li><li>сильные стороны и риски (честно);<\/li><li>мотивация и условия (локация, семья, ожидания, сроки);<\/li><li>рекомендация рекрутера.<\/li><\/ul>\n<p><strong>Сравнительная матрица<\/strong> — кандидаты в столбцах, критерии оценочной карты в строках. Помогает заказчику принять решение по данным, а не по впечатлению от одного интервью.<\/p>\n<h3>1.5 Внешние агентства и сотрудничество<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Модель<\/th><th>Суть<\/th><th>Когда использовать<\/th><\/tr><\/thead><tbody><tr><td><strong>Retained search<\/strong> (эксклюзивный поиск с предоплатой)<\/td><td>Агентство получает оплату поэтапно и ведёт поиск полностью<\/td><td>Топ-позиции, конфиденциальные поиски, сверхдефицитные роли<\/td><\/tr><tr><td><strong>Contingency<\/strong> (оплата за результат)<\/td><td>Оплата только при найме<\/td><td>Массовые и менее сложные роли<\/td><\/tr><tr><td><strong>Research only<\/strong> (только исследование рынка)<\/td><td>Агентство делает карту и лонг-лист, контакты — ваша команда<\/td><td>Когда нужна скорость картирования в незнакомом регионе<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Глобальные компании Executive Search:<\/strong> Korn Ferry, Spencer Stuart, Egon Zehnder, Heidrick &amp; Struggles, Russell Reynolds Associates. Существуют и специализированные агентства по горной отрасли в Австралии, Канаде, ЮАР, Великобритании.<\/p>\n<p><strong>Ваша роль при работе с агентством:<\/strong> владелец процесса и профиля, проверка качества кандидатов, защита интересов TMK (конфиденциальность, исключения из поиска, этика), передача знаний внутрь.<\/p>\n<h3>1.6 Пайплайн талантов для 120 проектов TMK<\/h3>\n<p>Отдельный поиск под каждую вакансию — дорого и медленно. Нужна <strong>система<\/strong>:<\/p>\n<ul><li><strong>карты талантов по семействам ролей<\/strong> (вольфрамовая цепочка, гидрометаллургия, порошковая металлургия, лаборатории, автоматизация и ТОиР, безопасность и ESG);<\/li><li><strong>сообщество кандидатов<\/strong> (talent community): люди, с которыми уже был хороший разговор, получают новости TMK и предложения раньше рынка;<\/li><li><strong>план волн найма<\/strong> по стадиям проектов (День 5) — согласованный с проектным офисом;<\/li><li><strong>внутренние кадры и преемники<\/strong>: оценка своих специалистов, программы развития, ротации;<\/li><li><strong>студенты и молодые специалисты<\/strong>: дуальное обучение с ТашГТУ, практика, кафедры TMK; программы для выпускников вузов, в том числе зарубежных;<\/li><li><strong>соотечественники<\/strong> за рубежом: регулярная коммуникация, мероприятия, истории возвращения;<\/li><li><strong>бренд работодателя<\/strong>: истории проектов, люди TMK на отраслевых конференциях, публикации.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Проект поиска<\/td><td>Search assignment / search project<\/td><td>Поиск на конкретную позицию<\/td><\/tr><tr><td>Стратегия поиска<\/td><td>Search strategy<\/td><td>План каналов, доноров, сроков<\/td><\/tr><tr><td>Воронка подбора<\/td><td>Recruitment funnel / pipeline<\/td><td>Этапы от выявления до найма<\/td><\/tr><tr><td>Конверсия<\/td><td>Conversion rate<\/td><td>Доля перешедших на следующий этап<\/td><\/tr><tr><td>Время до шорт-листа<\/td><td>Time to shortlist<\/td><td>Срок до первых сильных кандидатов<\/td><\/tr><tr><td>Время до закрытия<\/td><td>Time to fill / time to hire<\/td><td>Срок до найма<\/td><\/tr><tr><td>Доля принятых офферов<\/td><td>Offer acceptance rate<\/td><td>Принятые офферы ко всем выданным<\/td><\/tr><tr><td>Качество найма<\/td><td>Quality of hire<\/td><td>Результаты и удержание нанятых<\/td><\/tr><tr><td>Охват рынка<\/td><td>Market coverage<\/td><td>Доля целевых компаний с контактом<\/td><\/tr><tr><td>Еженедельный отчёт<\/td><td>Weekly status report<\/td><td>Статус поиска для заказчика<\/td><\/tr><tr><td>Презентация кандидата<\/td><td>Candidate presentation / report<\/td><td>Документ о кандидате для заказчика<\/td><\/tr><tr><td>Сравнительная матрица<\/td><td>Comparison matrix<\/td><td>Кандидаты против критериев<\/td><\/tr><tr><td>Эксклюзивный поиск<\/td><td>Retained search<\/td><td>Поиск с поэтапной оплатой агентству<\/td><\/tr><tr><td>Оплата за результат<\/td><td>Contingency search<\/td><td>Оплата только при найме<\/td><\/tr><tr><td>Исследование рынка по заказу<\/td><td>Research-only engagement<\/td><td>Агентство делает карту и лонг-лист<\/td><\/tr><tr><td>Исключения из поиска<\/td><td>Off-limits / exclusions<\/td><td>Компании, где нельзя искать<\/td><\/tr><tr><td>Сообщество кандидатов<\/td><td>Talent community<\/td><td>Пул людей для будущих позиций<\/td><\/tr><tr><td>Пайплайн талантов<\/td><td>Talent pipeline<\/td><td>Система постоянного наполнения пула<\/td><\/tr><tr><td>План преемственности<\/td><td>Succession plan<\/td><td>Подготовка внутренних преемников<\/td><\/tr><tr><td>Внутренний кандидат<\/td><td>Internal candidate<\/td><td>Сотрудник компании<\/td><\/tr><tr><td>Бренд работодателя<\/td><td>Employer brand<\/td><td>Репутация компании как работодателя<\/td><\/tr><tr><td>Стажировочная программа<\/td><td>Graduate / internship programme<\/td><td>Программа для молодых специалистов<\/td><\/tr><tr><td>Дуальное обучение<\/td><td>Dual education<\/td><td>Обучение с практикой на предприятии<\/td><\/tr><tr><td>Испытательный срок<\/td><td>Probation period<\/td><td>Период проверки нового сотрудника<\/td><\/tr><tr><td>Ретроспектива поиска<\/td><td>Search post-mortem / retrospective<\/td><td>Разбор поиска после закрытия<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Признаки зрелого процесса поиска<\/h3>\n<ul><li>Каждый поиск начинается с <strong>утверждённого профиля<\/strong> и <strong>оценочной карты<\/strong>.<\/li><li>У каждого поиска есть <strong>стратегия<\/strong> с картой и каналами.<\/li><li>Заказчик получает <strong>еженедельный отчёт<\/strong> с воронкой и решениями.<\/li><li>Шорт-лист — с <strong>оценками по карте<\/strong> и рисками, а не «вот резюме».<\/li><li>После закрытия — <strong>ретроспектива<\/strong>: что сработало, какие доноры дали кандидатов, что изменить.<\/li><li>Данные о кандидатах — в <strong>системе<\/strong> (ATS/CRM), а не в личной почте.<\/li><\/ul>\n<h3>3.2 Типичные провалы и как их избежать<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Провал<\/th><th>Причина<\/th><th>Профилактика<\/th><\/tr><\/thead><tbody><tr><td>Поиск идёт 6 месяцев без результата<\/td><td>Нереалистичный профиль, узкий пул<\/td><td>Карта и размер пула на старте; кольцо 2<\/td><\/tr><tr><td>Заказчик отклоняет всех кандидатов<\/td><td>Несогласованные критерии, скрытые требования<\/td><td>Оценочная карта до интервью; калибровка на первых кандидатах<\/td><\/tr><tr><td>Кандидат отказался от оффера<\/td><td>Не выявлена мотивация, сюрприз в пакете<\/td><td>Проверка ожиданий до финала; работа с семьёй<\/td><\/tr><tr><td>Кандидат ушёл в первые 6 месяцев<\/td><td>Плохая адаптация, «продали мечту»<\/td><td>Честные риски, план 90 дней, поддержка семьи<\/td><\/tr><tr><td>Заказчик «пропал» на недели<\/td><td>Нет согласованного процесса<\/td><td>Даты интервью и решений в стратегии; эскалация<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Калибровка: ранний тест профиля<\/h3>\n<p>Покажите заказчику <strong>2–3 кандидатов<\/strong> через 2–3 недели после старта, даже если они не идеальны. Обратная связь («этот слишком академичный», «нужен опыт пуска») уточняет профиль лучше любого брифинга. Это экономит недели.<\/p>\n<hr>\n<h2>4. Кейс-финал модуля 5: стратегия поиска<\/h2>\n<p><strong>Задание (50 мин).<\/strong> Для позиции из Дней 21–24 подготовьте документ на 2–3 страницы:<\/p>\n<ol><li><strong>Профиль позиции<\/strong> (одна страница — из Дня 21, обновлённая).<\/li><li><strong>Карта талантов<\/strong>: три кольца, размер пула, конкуренты (из Дня 22, кратко).<\/li><li><strong>Каналы и строки поиска<\/strong> (из Дня 23, кратко).<\/li><li><strong>План выхода на кандидатов<\/strong>: шаблоны сообщений, последовательность касаний (из Дня 24).<\/li><li><strong>Процесс оценки<\/strong>: этапы, участники, оценочная карта (подготовка к Модулю 6).<\/li><li><strong>График<\/strong> по этапам 1.1 с датами.<\/li><li><strong>Метрики воронки<\/strong> и цели по ним.<\/li><li><strong>Формат еженедельного отчёта.<\/strong><\/li><li><strong>Риски поиска<\/strong> и план действий (вознаграждение, локация, санкции, сроки уведомления).<\/li><\/ol>\n<p><strong>Teach-back.<\/strong> Покажите стратегию руководителю. Спросите: «Что в этом плане вы изменили бы и почему?»<\/p>\n<hr>\n<h2>6. Рефлексия: итог модуля 5<\/h2>\n<ol><li>Какой этап поиска в вашей реальной работе сейчас самый слабый? Что изменить на следующей вакансии?<\/li><li>Что сказал руководитель о вашей стратегии поиска?<\/li><li><strong>Обязательство:<\/strong> «Модуль 6 начинаю ___ (дата) в ___:___».<\/li><\/ol>\n<blockquote><p><strong>Правило модуля:<\/strong> пять модулей из шести. Вы умеете понимать отрасль, формулировать задачу, находить и вести людей. Последний модуль — оценка: как за час отличить реальный опыт от красивого рассказа и как убедить технических руководителей принять решение. Это финальный навык эксперта.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Отчёты Association of Executive Search and Leadership Consultants (AESC) о практике Executive Search.<\/li><li>G. Smart, R. Street, <em>Who<\/em> — процесс от профиля до решения.<\/li><li>Материалы о метриках подбора (quality of hire, time to fill) от SHRM и LinkedIn Talent Solutions.<\/li><li>Внутренние данные TMK: график stage-gate проектов (для плана волн найма).<\/li><\/ul>"},{"n":26,"module":6,"title":"Структурированное техническое интервью","file":"module-06-screening-assessment-stakeholders/day-26-structured-technical-interview.md","duration":"3,5 часа","challenge":"Составить <strong>гайд структурированного интервью на 60 минут<\/strong> для одной позиции TMK: блоки, вопросы, уточнения «воронкой», оценочную шкалу с описанными уровнями — и провести пробное интервью (с коллегой или в роли).","why":"Неструктурированная беседа «расскажите о себе» — один из самых слабых методов отбора. Мета-анализы исследований отбора персонала показывают: структурированные интервью — среди самых валидных методов и заметно точнее свободной беседы. Для технических ролей TMK это значит: меньше ошибок найма, меньше споров с заказчиком и решения, которые можно объяснить.","checklist":[{"text":"Разминка: 5 вопросов по Модулю 5 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: ошибки интервьюера (25 мин)","minutes":25},{"text":"Практика: гайд интервью + пробное интервью (60 мин)","minutes":60},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.2, 1.3, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Структурированное интервью","en":"Structured interview","def":"Интервью с заранее заданными вопросами и шкалой"},{"ru":"Неструктурированное интервью","en":"Unstructured interview","def":"Свободная беседа без плана"},{"ru":"Гайд интервью","en":"Interview guide","def":"Документ с блоками и вопросами"},{"ru":"Поведенческий вопрос","en":"Behavioural question","def":"Вопрос о прошлом опыте"},{"ru":"Ситуационный вопрос","en":"Situational question","def":"Вопрос о гипотетической ситуации"},{"ru":"Метод STAR","en":"STAR method","def":"Ситуация, задача, действия, результат"},{"ru":"Уточняющий вопрос","en":"Probing / follow-up question","def":"Вопрос вглубь ответа"},{"ru":"Метод воронки","en":"Funnel technique","def":"Уточнение от общего к конкретному"},{"ru":"Технический кейс","en":"Technical case / work sample","def":"Практическое задание по профилю роли"},{"ru":"Панельное интервью","en":"Panel interview","def":"Интервью с несколькими экспертами"},{"ru":"Шкала оценки","en":"Rating scale","def":"Шкала 1–5 с описаниями уровней"},{"ru":"Свидетельство","en":"Evidence","def":"Факт из ответа, подтверждающий оценку"},{"ru":"Калибровка интервьюеров","en":"Interviewer calibration","def":"Согласование понимания шкалы"},{"ru":"Независимая оценка","en":"Independent rating","def":"Оценка до обсуждения с коллегами"},{"ru":"Валидность метода","en":"Predictive validity","def":"Способность метода предсказывать успех на работе"},{"ru":"Эффект ореола","en":"Halo effect","def":"Перенос одного впечатления на всё"},{"ru":"Эффект сходства","en":"Similarity bias","def":"Симпатия к похожим на себя"},{"ru":"Эффект контраста","en":"Contrast effect","def":"Оценка относительно предыдущего кандидата"},{"ru":"Предвзятость подтверждения","en":"Confirmation bias","def":"Поиск подтверждений первого впечатления"},{"ru":"Эффект первого впечатления","en":"First impression bias","def":"Решение в первые минуты"},{"ru":"Оценочный центр","en":"Assessment centre","def":"Комплексная оценка несколькими методами"},{"ru":"Психометрический тест","en":"Psychometric test","def":"Стандартизированный тест способностей или личности"},{"ru":"Обратная связь кандидату","en":"Candidate feedback","def":"Сообщение о результатах этапа"},{"ru":"Интервью с переводчиком","en":"Interpreted interview","def":"Интервью на другом языке через переводчика"},{"ru":"Видеоинтервью","en":"Video interview","def":"Интервью по видеосвязи"}],"quiz":[{"q":"Главная особенность структурированного интервью:","options":["Интервьюер свободно меняет вопросы под настроение и ход беседы","Кандидат сам выбирает, о каких проектах и навыках рассказывать","Вопросы заданы заранее, привязаны к критериям и оцениваются по шкале","Интервью всегда длится не больше 15 минут и проходит по телефону"],"answer":2,"explain":"Плюс независимые оценки сразу после интервью."},{"q":"Что значит «правило двух уровней» в методе воронки?","options":["Практик отвечает на 2–3 уровня уточнений вглубь, поверхностный кандидат обрывается","На каждый вопрос интервьюер может задать не больше двух уточнений, иначе это давление","Интервью обязательно проводят два интервьюера одновременно","Интервью состоит из двух этапов: технического и поведенческого"],"answer":0,"explain":"На втором уровне поверхностный кандидат уходит в общие слова, переходит на «мы» или меняет тему."},{"q":"Какой элемент чаще всего пропускают кандидаты в ответе по STAR?","options":["Описание исходной ситуации и контекста","Описание компании, её размера и рынков","Название должности и подчинённость","Собственные действия и результат в цифрах"],"answer":3,"explain":"Задача интервьюера — добиться именно этих элементов."},{"q":"Кандидат говорит: «Мы запустили линию за 6 месяцев». Лучшее уточнение:","options":["«Отлично, это хороший результат. Переходим к следующему вопросу»","«Что лично вы делали на пуске и какие решения принимали сами?»","«Сколько человек было в вашей команде и кому вы подчинялись?»","«Вам понравился этот проект? Что было самым интересным?»"],"answer":1,"explain":"«Мы» скрывает реальную роль кандидата."},{"q":"Что такое эффект ореола?","options":["Одно сильное впечатление переносится на оценку всех остальных качеств","Симпатия интервьюера к кандидатам, похожим на него самого","Оценка кандидата в сравнении с предыдущим, а не по критериям","Поиск только тех фактов, которые подтверждают первое впечатление"],"answer":0,"explain":"Например: «хороший английский — значит, хороший технолог»."},{"q":"Как правильно вести заметки на интервью?","options":["Записывать общие впечатления: «уверенный», «приятный», «харизматичный»","Не вести заметок, чтобы не отвлекаться","Записывать только вопросы, без ответов","Записывать факты и цитаты: цифры, решения, результаты"],"answer":3,"explain":"Оценка должна опираться на свидетельства, а не на ощущения."},{"q":"Почему каждый интервьюер ставит оценки до обсуждения с коллегами?","options":["Чтобы сэкономить время на обсуждении после интервью","Чтобы обсуждение не подменилось мнением самого громкого участника","Это прямое требование трудового законодательства","Чтобы кандидат не узнал промежуточные результаты оценки от кого-то из комиссии"],"answer":1,"explain":"Независимые оценки дают честную картину расхождений."},{"q":"Какой вопрос относится к типу «научите меня»?","options":["«Почему вы ушли с прошлой работы, что вас там не устраивало и что могло бы вас удержать?»","«Какая у вас была зарплата и какие бонусы вы получали?»","«Объясните, как работает каскад экстракции, человеку без химического образования»","«Где вы видите себя через пять лет и какую должность хотите?»"],"answer":2,"explain":"Умение просто объяснить сложное — признак глубокого понимания и способности обучать людей."},{"q":"Какое правило важно для интервью через переводчика?","options":["Задавать длинные составные вопросы, чтобы сэкономить время перевода","Переводчику не нужен отраслевой глоссарий: хороший переводчик всегда переведёт по контексту","Планировать столько же времени, сколько для интервью без переводчика","Короткие вопросы, паузы, проверка понимания терминов и глоссарий для переводчика заранее"],"answer":3,"explain":"И закладывать больше времени: глубина ответов через переводчика ниже."},{"q":"Какой вопрос НЕЛЬЗЯ задавать, если он не связан с требованиями роли?","options":["«Какой была производительность вашей линии?»","«Как вы обучали подчинённых?»","«Планируете ли вы детей в ближайшие годы?»","«Какое ваше решение оказалось ошибочным?»"],"answer":2,"explain":"Вопросы о семье, возрасте, религии, здоровье, национальности — вне границ, если не связаны с требованиями роли и не разрешены законом."}],"html":"<h2>0. Разминка: вспомнить Модуль 5<\/h2>\n<ol><li>Чем профиль успеха отличается от должностной инструкции?<\/li><li>Что такое оценочная карта с описанными уровнями?<\/li><li>Какой вопрос выявляет мотивацию кандидата?<\/li><li>Что такое калибровка в проекте поиска?<\/li><li>Что входит в презентацию кандидата для шорт-листа?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Описывает результаты, по которым судят об успехе, а не обязанности.<\/li><li>Критерии с весами и шкалой 1–5, где каждый уровень описан поведением или опытом.<\/li><li>«Что должно измениться в вашей работе, чтобы вы серьёзно рассмотрели переход?»<\/li><li>Ранний показ 2–3 кандидатов заказчику для уточнения профиля.<\/li><li>Карьера с цифрами масштаба, баллы по оценочной карте, сильные стороны и риски, мотивация, рекомендация рекрутера.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Почему структура<\/h3>\n<p><strong>Структурированное интервью:<\/strong><\/p>\n<ul><li>вопросы <strong>заранее определены<\/strong> и привязаны к критериям оценочной карты;<\/li><li>всем кандидатам задают <strong>одни и те же ключевые вопросы<\/strong>;<\/li><li>ответы оценивают <strong>по шкале с описанием уровней<\/strong>;<\/li><li>оценки ставят <strong>сразу после интервью<\/strong>, независимо, до обсуждения с коллегами.<\/li><\/ul>\n<p><strong>Почему это работает:<\/strong> снижается влияние первого впечатления, симпатии, «похожести на меня». Оценки разных интервьюеров можно сравнивать. Решение можно объяснить заказчику и кандидату.<\/p>\n<h3>1.2 Структура интервью на 60 минут<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Блок<\/th><th>Время<\/th><th>Цель<\/th><\/tr><\/thead><tbody><tr><td>1. Открытие<\/td><td>3 мин<\/td><td>Рамка, план, конфиденциальность, разрешение делать заметки<\/td><\/tr><tr><td>2. Карьерный маршрут<\/td><td>10 мин<\/td><td>Ключевые роли, масштаб, причины переходов<\/td><\/tr><tr><td>3. Глубокое погружение в 2 проекта<\/td><td>25 мин<\/td><td>Реальная роль, решения, цифры, результаты (метод воронки)<\/td><\/tr><tr><td>4. Технические проверки<\/td><td>10 мин<\/td><td>Вопросы по процессу из модулей 1–4<\/td><\/tr><tr><td>5. Ситуационные вопросы<\/td><td>5 мин<\/td><td>«Что вы сделаете, если…» в контексте TMK<\/td><\/tr><tr><td>6. Мотивация и условия<\/td><td>5 мин<\/td><td>Факторы «от» и «к», семья, локация, сроки<\/td><\/tr><tr><td>7. Вопросы кандидата и завершение<\/td><td>2 мин<\/td><td>Следующие шаги<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.3 Типы вопросов<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Формула<\/th><th>Пример для технолога<\/th><\/tr><\/thead><tbody><tr><td><strong>Поведенческий<\/strong> (что было)<\/td><td>«Расскажите о случае, когда…»<\/td><td>«Расскажите о пуске, который шёл хуже плана. Что вы сделали?»<\/td><\/tr><tr><td><strong>Ситуационный<\/strong> (что сделаете)<\/td><td>«Представьте, что…»<\/td><td>«Через месяц после пуска чистота APT вышла из спецификации по Mo. Ваши первые три шага?»<\/td><\/tr><tr><td><strong>Технический на глубину<\/strong><\/td><td>«Объясните, как и почему…»<\/td><td>«Почему вы выбрали ионный обмен, а не экстракцию для конверсии?»<\/td><\/tr><tr><td><strong>«Научите меня»<\/strong><\/td><td>«Объясните новому оператору…»<\/td><td>«Объясните, как работает каскад экстракции, человеку без химического образования»<\/td><\/tr><tr><td><strong>Цифровой<\/strong><\/td><td>«Какие были показатели?»<\/td><td>«Извлечение, расход реагентов, производительность до и после ваших изменений?»<\/td><\/tr><tr><td><strong>Провал и уроки<\/strong><\/td><td>«Что не получилось?»<\/td><td>«Какое ваше техническое решение оказалось ошибочным? Что вы поняли?»<\/td><\/tr><tr><td><strong>Контрфактический<\/strong><\/td><td>«Что бы вы сделали иначе?»<\/td><td>«Если бы вы запускали этот передел снова, что изменили бы?»<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>STAR(R)<\/strong> — структура хорошего ответа на поведенческий вопрос: <strong>Ситуация → Задача → Действия → Результат → (Рефлексия)<\/strong>. Ваша задача — добиться всех пяти элементов, особенно <strong>действий самого кандидата<\/strong> и <strong>результата в цифрах<\/strong>.<\/p>\n<h3>1.4 Метод воронки: как уточнять<\/h3>\n<pre class=\"code\"><code>ШИРОКО: «Расскажите о пуске линии восстановления вольфрама»\n→ КОНКРЕТНО: «Какая была проектная мощность и сколько времени заняло выйти на неё?»\n→ ЛИЧНАЯ РОЛЬ: «Что лично вы решали? Кто ещё был в команде и кому вы подчинялись?»\n→ ДЕТАЛИ: «Какая проблема была самой сложной? Как вы её диагностировали?»\n→ ЦИФРЫ: «Каким был кислород в порошке до и после? Как вы это измеряли?»\n→ ПРИЧИНЫ: «Почему именно это решение, какие варианты отвергли?»\n→ УРОКИ: «Что вы сделали бы иначе?»<\/code><\/pre>\n<p><strong>Правило двух уровней:<\/strong> сильный практик спокойно отвечает на 2–3 уровня уточнений вглубь. Поверхностный кандидат «обрывается» на втором уровне: уходит в общие слова, переходит на «мы», меняет тему.<\/p>\n<p><strong>Уточняющие фразы:<\/strong> «Что именно сделали вы?», «Какая была цифра?», «Как вы это узнали?», «Что было альтернативой?», «Что сказал бы ваш руководитель?»<\/p>\n<h3>1.5 Оценка и заметки<\/h3>\n<ul><li><strong>Заметки<\/strong> — факты и цитаты, а не впечатления: «вывел на 80% за 7 мес.; кислород снизили с … до … ppm; решение — …» вместо «уверенный, приятный».<\/li><li><strong>Оценка по критериям<\/strong> — сразу после интервью, по шкале с описанием уровней (1–5).<\/li><li><strong>Свидетельства<\/strong> — к каждой оценке 1–2 факта из интервью.<\/li><li><strong>Независимость<\/strong> — каждый интервьюер ставит оценки сам до обсуждения; иначе побеждает самый громкий голос.<\/li><li><strong>Решение<\/strong> — по сумме взвешенных оценок плюс обсуждение рисков, а не «понравился».<\/li><\/ul>\n<h3>1.6 Особенности форматов<\/h3>\n<ul><li><strong>Видеоинтервью<\/strong>: стабильная связь, камера включена, документы для показа (схема передела) — по экрану.<\/li><li><strong>Интервью через переводчика<\/strong>: короткие вопросы, паузы, проверка понимания терминов; переводчик должен знать отраслевую терминологию (или получить глоссарий заранее). Глубина ответов через переводчика ниже — планируйте больше времени.<\/li><li><strong>Панельное интервью<\/strong> с экспертами TMK: заранее распределите критерии между участниками.<\/li><li><strong>Технический кейс или домашнее задание<\/strong>: например, нарисовать схему передела с балансом, разобрать реальную (обезличенную) проблему TMK. Ограничьте объём: 1–2 часа, не «бесплатный консалтинг».<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Структурированное интервью<\/td><td>Structured interview<\/td><td>Интервью с заранее заданными вопросами и шкалой<\/td><\/tr><tr><td>Неструктурированное интервью<\/td><td>Unstructured interview<\/td><td>Свободная беседа без плана<\/td><\/tr><tr><td>Гайд интервью<\/td><td>Interview guide<\/td><td>Документ с блоками и вопросами<\/td><\/tr><tr><td>Поведенческий вопрос<\/td><td>Behavioural question<\/td><td>Вопрос о прошлом опыте<\/td><\/tr><tr><td>Ситуационный вопрос<\/td><td>Situational question<\/td><td>Вопрос о гипотетической ситуации<\/td><\/tr><tr><td>Метод STAR<\/td><td>STAR method<\/td><td>Ситуация, задача, действия, результат<\/td><\/tr><tr><td>Уточняющий вопрос<\/td><td>Probing / follow-up question<\/td><td>Вопрос вглубь ответа<\/td><\/tr><tr><td>Метод воронки<\/td><td>Funnel technique<\/td><td>Уточнение от общего к конкретному<\/td><\/tr><tr><td>Технический кейс<\/td><td>Technical case / work sample<\/td><td>Практическое задание по профилю роли<\/td><\/tr><tr><td>Панельное интервью<\/td><td>Panel interview<\/td><td>Интервью с несколькими экспертами<\/td><\/tr><tr><td>Шкала оценки<\/td><td>Rating scale<\/td><td>Шкала 1–5 с описаниями уровней<\/td><\/tr><tr><td>Свидетельство<\/td><td>Evidence<\/td><td>Факт из ответа, подтверждающий оценку<\/td><\/tr><tr><td>Калибровка интервьюеров<\/td><td>Interviewer calibration<\/td><td>Согласование понимания шкалы<\/td><\/tr><tr><td>Независимая оценка<\/td><td>Independent rating<\/td><td>Оценка до обсуждения с коллегами<\/td><\/tr><tr><td>Валидность метода<\/td><td>Predictive validity<\/td><td>Способность метода предсказывать успех на работе<\/td><\/tr><tr><td>Эффект ореола<\/td><td>Halo effect<\/td><td>Перенос одного впечатления на всё<\/td><\/tr><tr><td>Эффект сходства<\/td><td>Similarity bias<\/td><td>Симпатия к похожим на себя<\/td><\/tr><tr><td>Эффект контраста<\/td><td>Contrast effect<\/td><td>Оценка относительно предыдущего кандидата<\/td><\/tr><tr><td>Предвзятость подтверждения<\/td><td>Confirmation bias<\/td><td>Поиск подтверждений первого впечатления<\/td><\/tr><tr><td>Эффект первого впечатления<\/td><td>First impression bias<\/td><td>Решение в первые минуты<\/td><\/tr><tr><td>Оценочный центр<\/td><td>Assessment centre<\/td><td>Комплексная оценка несколькими методами<\/td><\/tr><tr><td>Психометрический тест<\/td><td>Psychometric test<\/td><td>Стандартизированный тест способностей или личности<\/td><\/tr><tr><td>Обратная связь кандидату<\/td><td>Candidate feedback<\/td><td>Сообщение о результатах этапа<\/td><\/tr><tr><td>Интервью с переводчиком<\/td><td>Interpreted interview<\/td><td>Интервью на другом языке через переводчика<\/td><\/tr><tr><td>Видеоинтервью<\/td><td>Video interview<\/td><td>Интервью по видеосвязи<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Ошибки интервьюера<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Ошибка<\/th><th>Как выглядит<\/th><th>Профилактика<\/th><\/tr><\/thead><tbody><tr><td><strong>Говорите больше кандидата<\/strong><\/td><td>Рассказываете о TMK половину времени<\/td><td>Правило 70/30: говорит кандидат<\/td><\/tr><tr><td><strong>Подсказываете ответ<\/strong><\/td><td>«Вы ведь контролировали кислород, да?»<\/td><td>Открытые вопросы: «Как вы контролировали…?»<\/td><\/tr><tr><td><strong>Принимаете «мы» за «я»<\/strong><\/td><td>«Мы запустили линию»<\/td><td>«Что лично вы делали?»<\/td><\/tr><tr><td><strong>Не доходите до цифр<\/strong><\/td><td>Довольствуетесь «улучшили»<\/td><td>Метод воронки до цифр<\/td><\/tr><tr><td><strong>Эффект ореола<\/strong><\/td><td>Сильный английский = сильный технолог<\/td><td>Оценка по каждому критерию отдельно<\/td><\/tr><tr><td><strong>Решение в первые 5 минут<\/strong><\/td><td>Дальше только подтверждение<\/td><td>Оценки только после интервью, по свидетельствам<\/td><\/tr><tr><td><strong>Импровизация<\/strong><\/td><td>Каждому кандидату — разные вопросы<\/td><td>Ключевые вопросы — всем одинаковые<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Банк вопросов: универсальное ядро для технических ролей TMK<\/h3>\n<ol><li>«Опишите ваш передел от входа до выхода: продукт, масштаб, ключевые показатели».<\/li><li>«Какие три решения последних двух лет вы приняли сами? Какой был результат в цифрах?»<\/li><li>«Расскажите о самой тяжёлой проблеме в производстве: как вы её диагностировали и решили?»<\/li><li>«Какое ваше решение оказалось ошибочным? Как вы это поняли?»<\/li><li>«Как вы обучали людей? Кто из ваших подчинённых вырос и до какого уровня?»<\/li><li>«Как устроена безопасность на вашем участке? Какой инцидент изменил ваш подход?»<\/li><li>«Объясните мне, как работает [ключевой процесс], так, чтобы понял новый оператор».<\/li><li>«Через 3 месяца после вашего выхода в TMK [типичная проблема]. Ваши первые шаги?»<\/li><\/ol>\n<h3>3.3 Юридические и этические границы<\/h3>\n<ul><li><strong>Не задавайте<\/strong> вопросов о возрасте, семейном положении и планах на детей, религии, национальности, здоровье, если они не связаны с требованиями роли и не разрешены законом. Вопросы о готовности к переезду и вахте задавайте <strong>всем одинаково<\/strong> и в контексте условий работы.<\/li><li><strong>Конфиденциальность<\/strong> кандидата: не раскрывайте его участие в поиске его работодателю.<\/li><li><strong>Конфиденциальная информация его работодателя<\/strong>: не просите её раскрывать; если кандидат сам начинает — остановите.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Гайд интервью и пробное интервью (60 мин).<\/strong><\/p>\n<ol><li>Возьмите позицию из Модуля 5 и её оценочную карту.<\/li><li>Составьте гайд на 60 минут по структуре 1.2:<ul><li>для каждого критерия карты — 1–2 ключевых вопроса и 3–4 уточнения по методу воронки;<\/li><li>3 технических вопроса из модулей 1–4;<\/li><li>1 ситуационный вопрос в контексте TMK;<\/li><li>шкалу с описанием уровней 1, 3, 5 для каждого критерия.<\/li><\/ul><\/li><li>Проведите пробное интервью 30 минут с коллегой (пусть он сыграет кандидата: сначала сильного, потом поверхностного). Заполните оценки и свидетельства.<\/li><li>Запишите: на каком уровне уточнения «поверхностный» кандидат обрывался?<\/li><\/ol>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>На каком уровне уточнения обрывался «поверхностный» кандидат в пробном интервью?<\/li><li>Какая ошибка интервьюера у вас проявилась сильнее всего?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 27: реальный опыт против поверхностного».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> с сегодняшнего дня у каждой вашей оценки есть свидетельство. Это делает вас интервьюером, которому технические руководители доверяют решение.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>F. Schmidt, J. Hunter (1998) и P. Sackett и соавт. (2022) — мета-анализы валидности методов отбора (обзоры доступны в открытых источниках).<\/li><li>G. Smart, R. Street, <em>Who<\/em> — структурированное интервью «Topgrading».<\/li><li>Материалы Google re:Work о структурированных интервью (бесплатно).<\/li><li>Ваш гайд интервью — сохраните как шаблон для всех технических ролей TMK.<\/li><\/ul>"},{"n":27,"module":6,"title":"Реальный опыт против поверхностного: как распознать и как проверить","file":"module-06-screening-assessment-stakeholders/day-27-real-vs-superficial-experience.md","duration":"3,5 часа","challenge":"Разобрать <strong>три учебных резюме<\/strong> (ниже), найти признаки реального и поверхностного опыта и составить <strong>план проверки<\/strong> для каждого: какие вопросы, какие документы, какие рекомендации.","why":"Это ключевой навык, ради которого вы проходили модули 1–4. На рынке критических металлов много людей, которые «участвовали», «курировали», «имеют представление»
