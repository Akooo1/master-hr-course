"en":"Ion-adsorption clays","def":"Источник тяжёлых РЗЭ (Южный Китай, Мьянма)"},{"ru":"Экспортный контроль","en":"Export controls","def":"Лицензирование или запрет экспорта товаров и технологий"},{"ru":"Квоты добычи и разделения","en":"Mining and smelting/separation quotas","def":"Государственные лимиты Китая"},{"ru":"Цепочка поставок","en":"Supply chain","def":"Звенья от рудника до изделия"},{"ru":"Диверсификация поставок","en":"Supply diversification","def":"Снижение зависимости от одного поставщика"},{"ru":"Минимальная цена (гарантированная)","en":"Price floor","def":"Гарантия цены продукту со стороны государства или покупателя"},{"ru":"Офтейк","en":"Offtake","def":"Долгосрочный договор покупки продукции"},{"ru":"Стратегический резерв","en":"Strategic stockpile","def":"Государственные запасы сырья"},{"ru":"Электродвигатель с постоянными магнитами","en":"Permanent magnet motor","def":"Основной потребитель магнитов NdFeB"},{"ru":"Тяговый двигатель","en":"Traction motor","def":"Двигатель электромобиля"},{"ru":"Переработка магнитов","en":"Magnet recycling","def":"Возврат РЗЭ из лома и отработанных магнитов"},{"ru":"Попутное извлечение","en":"By-product recovery","def":"Получение РЗЭ из чужих потоков (урановые растворы, фосфаты)"},{"ru":"Природные радионуклиды","en":"NORM","def":"Th, U и продукты распада в сырье РЗЭ"},{"ru":"Скандий","en":"Scandium","def":"РЗЭ для алюминиевых сплавов и твёрдооксидных топливных элементов"}],"quiz":[{"q":"Почему РЗЭ называют «редкими», хотя церия в земной коре больше, чем меди?","options":["Потому что их добывают только в Китае и ещё в одной-двух странах","Потому что они радиоактивны, и их добычу во многих странах ограничивают","Редки богатые технологичные месторождения и, главное, технологии разделения","Потому что их цена выше цены золота на всех мировых рынках"],"answer":2,"explain":"Элементы распространены, но богатых месторождений мало, а разделение похожих лантаноидов — сложнейшая технология."},{"q":"Какие РЗЭ определяют стоимость рынка?","options":["Магнитные: Nd, Pr, Dy, Tb","Лантан и церий","Скандий и иттрий","Прометий и европий"],"answer":0,"explain":"По объёму доминируют La и Ce, но по стоимости — магнитные элементы. Экономика проекта зависит от их доли в корзине."},{"q":"Зачем в магниты NdFeB добавляют диспрозий и тербий?","options":["Чтобы снизить цену магнита за счёт более дешёвых элементов","Чтобы магнит размагничивался при нагреве и был безопасен","Чтобы облегчить механическую обработку и шлифовку заготовок","Чтобы магнит сохранял свойства при высоких рабочих температурах"],"answer":3,"explain":"Dy и Tb повышают коэрцитивную силу, что критично для двигателей, которые нагреваются при работе."},{"q":"Какое звено цепочки РЗЭ сильнее всего сконцентрировано в Китае?","options":["Добыча руды (около 90% мировой добычи)","Разделение и производство магнитов (около 90%)","Геологоразведка новых месторождений РЗЭ","Продажа готовых электромобилей с магнитами"],"answer":1,"explain":"Добыча в Китае — около двух третей мировой, а разделение и магниты — около 90%."},{"q":"Что Китай запретил экспортировать с конца 2023 г.?","options":["Технологии извлечения и разделения РЗЭ и производства магнитов","Все металлы и сплавы без исключения, включая медь, алюминий и сталь","Только лантан и церий для катализаторов и полировки","Оборудование для геологоразведки и бурения скважин"],"answer":0,"explain":"Отсюда юридические риски при найме специалистов из китайских компаний для передачи технологий."},{"q":"Что такое MREC?","options":["Международная организация производителей редкоземельных металлов","Марка спечённого магнита NdFeB для двигателей","Метод электролиза фторидных расплавов РЗЭ","Смешанный карбонат РЗЭ — промежуточный продукт до разделения"],"answer":3,"explain":"Mixed rare earth carbonate — типичный товар между добытчиком и разделителем."},{"q":"Какая компания — крупнейший производитель разделённых РЗЭ вне Китая с заводом в Малайзии?","options":["MP Materials","Solvay","Lynas","Iluka"],"answer":2,"explain":"Lynas: рудник Маунт-Уэлд, вскрытие в Калгурли, разделение в Куантане (Малайзия)."},{"q":"Какой ранний вход TMK в РЗЭ выглядит наиболее реалистичным по публичным данным?","options":["Сразу производство магнитов NdFeB для электромобилей","Попутное извлечение РЗЭ и рения из растворов урановых месторождений","Добыча ионно-адсорбционных глин с высоким содержанием РЗЭ","Покупка и перенос китайской технологии каскадного разделения"],"answer":1,"explain":"Это соглашение с Solvomet KU Leuven. Первые профили — гидрометаллурги с опытом урановых растворов и РЗЭ, сорбции и экстракции, радиационной безопасности."},{"q":"Кандидат говорит: «Я 10 лет работал с редкоземельными металлами». Лучший уточняющий вопрос:","options":["«Вам понравилась работа с РЗЭ, что вы в ней цените больше всего и почему решили сменить работу?»","«Сколько вы зарабатываете сейчас и какой у вас бонус?»","«Вы свободно говорите по-английски и по-китайски?»","«На каком звене цепочки, с каким сырьём и какой продукт какой чистоты вы выпускали?»"],"answer":3,"explain":"«РЗЭ» — это пять разных профессий: геология, вскрытие, разделение, металлы, магниты. Без уточнения звена оценить релевантность невозможно."},{"q":"Почему зарплаты специалистов по РЗЭ на Западе высоки?","options":["Проекты вне Китая финансируются государствами, а специалистов мало","Из-за высокой радиоактивности, за которую положена доплата","Потому что работа на заводах РЗЭ идёт в ночные смены","Потому что для работы в РЗЭ обязательно нужен диплом MBA"],"answer":0,"explain":"Государственная поддержка (США, Япония, ЕС, Австралия) плюс дефицит кадров. TMK конкурирует с этими работодателями и должна предлагать не только деньги: масштаб задачи, полномочия, возможность построить с нуля."}],"html":"<h2>0. Разминка: вспомнить Модуль 2<\/h2>\n<ol><li>Почему разделение соседних РЗЭ требует сотен ступеней экстракции?<\/li><li>Какой экстрагент — основа китайских каскадов разделения РЗЭ?<\/li><li>Из каких катодов и в каком расплаве получают металлический NdPr?<\/li><li>Чем опасна переработка монацита?<\/li><li>По какой шкале оценивать гидрометаллурга и какой уровень самый редкий?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Соседние лантаноиды химически почти одинаковы, коэффициенты разделения малы, поэтому нужны длинные каскады.<\/li><li>P507 (PC88A).<\/li><li>Электролиз фторидного расплава с подачей оксида; катоды вольфрамовые или молибденовые, анод графитовый.<\/li><li>Монацит содержит торий (и часто уран) — природная радиоактивность в продуктах и отходах.<\/li><li>Лаборатория → укрупнённые испытания → пилот → проектирование → пуск и вывод на мощность → эксплуатация. Самый редкий — пуск и вывод на мощность.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Что такое РЗЭ<\/h3>\n<p><strong>Редкоземельные элементы<\/strong> (rare earth elements, REE) — 17 элементов: 15 <strong>лантаноидов<\/strong> (от лантана La, № 57, до лютеция Lu, № 71), а также <strong>иттрий<\/strong> (Y, № 39) и <strong>скандий<\/strong> (Sc, № 21). Прометий (Pm) радиоактивен и в природе практически не встречается.<\/p>\n<p><strong>«Редкие» — неправильное слово.<\/strong> Церия в земной коре больше, чем меди. Редки не сами элементы, а <strong>богатые и технологичные месторождения<\/strong> и, главное, <strong>умение разделять<\/strong> элементы друг от друга.<\/p>\n<p><strong>Группы<\/strong> (классификации различаются, но логика одна):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Группа<\/th><th>Элементы<\/th><th>Особенности<\/th><\/tr><\/thead><tbody><tr><td><strong>Лёгкие РЗЭ<\/strong> (LREE)<\/td><td>La, Ce, Pr, Nd, Sm<\/td><td>Доминируют в бастнезите и монаците; La и Ce — массовые и дешёвые<\/td><\/tr><tr><td><strong>Средние<\/strong> (MREE)<\/td><td>Eu, Gd (иногда Sm, Tb, Dy)<\/td><td>Часть классификаций выделяет их отдельно<\/td><\/tr><tr><td><strong>Тяжёлые РЗЭ<\/strong> (HREE) + Y<\/td><td>Tb, Dy, Ho, Er, Tm, Yb, Lu, Y<\/td><td>Редки; главные источники — ионно-адсорбционные глины Южного Китая и Мьянмы, ксенотим<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Магнитные РЗЭ<\/strong> — ключевые для рынка:<\/p>\n<ul><li><strong>неодим (Nd) и празеодим (Pr)<\/strong> — основа магнитов NdFeB; торгуются как <strong>NdPr-оксид<\/strong>;<\/li><li><strong>диспрозий (Dy) и тербий (Tb)<\/strong> — добавки, сохраняющие магнитные свойства при нагреве (электродвигатели);<\/li><li><strong>самарий (Sm)<\/strong> — магниты SmCo для высоких температур и оборонной техники.<\/li><\/ul>\n<h3>1.2 Где используются РЗЭ<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Применение<\/th><th>Элементы<\/th><th>Комментарий<\/th><\/tr><\/thead><tbody><tr><td><strong>Постоянные магниты<\/strong> NdFeB<\/td><td>Nd, Pr, Dy, Tb<\/td><td>Электромобили, ветрогенераторы, промышленные двигатели, электроника, робототехника, оборона. <strong>По стоимости — главный рынок РЗЭ<\/strong><\/td><\/tr><tr><td>Магниты SmCo<\/td><td>Sm<\/td><td>Высокие температуры, авиация и оборона<\/td><\/tr><tr><td>Катализаторы<\/td><td>La (крекинг нефти), Ce (автокатализаторы)<\/td><td>Крупный рынок по объёму<\/td><\/tr><tr><td>Полирование стекла<\/td><td>Ce (оксид церия)<\/td><td>Оптика, экраны<\/td><\/tr><tr><td>Металлургия<\/td><td>Ce, La (мишметалл)<\/td><td>Модифицирование сталей и сплавов<\/td><\/tr><tr><td>Аккумуляторы NiMH<\/td><td>La<\/td><td>Гибридные автомобили<\/td><\/tr><tr><td>Люминофоры, лазеры, оптоволокно<\/td><td>Eu, Tb, Y, Nd, Er<\/td><td>Nd:YAG-лазеры, эрбиевые усилители<\/td><\/tr><tr><td>Керамика<\/td><td>Y (стабилизированный цирконий)<\/td><td>Конструкционная и техническая керамика<\/td><\/tr><tr><td>Медицина<\/td><td>Gd<\/td><td>Контрастные вещества для МРТ<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Главная экономическая мысль:<\/strong> <strong>объём рынка РЗЭ определяют лантан и церий, а стоимость — магнитные элементы.<\/strong> Проект РЗЭ живёт или умирает в зависимости от доли Nd, Pr, Dy, Tb в сырье. Лантан и церий часто продают с трудом или складируют.<\/p>\n<h3>1.3 Цепочка поставок: от рудника до магнита<\/h3>\n<pre class=\"code\"><code>Добыча руды → Обогащение (концентрат РЗЭ) → Вскрытие и выщелачивание → Смешанный продукт РЗЭ (карбонат, хлорид, оксид)\n→ РАЗДЕЛЕНИЕ (экстракция) → индивидуальные оксиды (NdPr, Dy, Tb, La, Ce…) → МЕТАЛЛЫ (электролиз, металлотермия)\n→ СПЛАВЫ (NdFeB, DyFe) → МАГНИТЫ (спечённые, связанные) → двигатели и генераторы → изделия\n                                                 + переработка лома и магнитов (recycling)<\/code><\/pre>\n<p><strong>Где контроль у Китая<\/strong> (порядок величин по данным USGS и МЭА последних лет):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Звено<\/th><th>Доля Китая (ориентир)<\/th><th>Комментарий<\/th><\/tr><\/thead><tbody><tr><td>Добыча<\/td><td>Около двух третей мировой добычи<\/td><td>Также крупный импорт концентратов из Мьянмы<\/td><\/tr><tr><td>Разделение<\/td><td>Около 90%<\/td><td>Технологии каскадов, масштаб, дешёвые реагенты<\/td><\/tr><tr><td>Металлы и сплавы<\/td><td>Около 90% и выше<\/td><td>—<\/td><\/tr><tr><td>Спечённые магниты NdFeB<\/td><td>Около 90%<\/td><td>Япония — следующая, остальные — малые доли<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Структура китайской отрасли.<\/strong> Отрасль консолидирована вокруг государственных групп: <strong>China Northern Rare Earth<\/strong> (Баотоу, лёгкие РЗЭ месторождения Баян-Обо) и <strong>China Rare Earth Group<\/strong> (создана в 2021 г. объединением активов Chinalco, China Minmetals и Ганьчжоу; тяжёлые РЗЭ юга). Добыча и разделение регулируются <strong>государственными квотами<\/strong>.<\/p>\n<p><strong>Экспортный контроль Китая<\/strong> — главный фактор рынка последних лет:<\/p>\n<ul><li><strong>с конца 2023 г.<\/strong> — запрет экспорта технологий извлечения и разделения РЗЭ и производства магнитов;<\/li><li><strong>апрель 2025 г.<\/strong> — лицензирование экспорта семи средних и тяжёлых РЗЭ (Sm, Gd, Tb, Dy, Lu, Sc, Y) и магнитов с ними. У производителей двигателей в Европе, США и Японии были перебои;<\/li><li><strong>октябрь 2025 г.<\/strong> — объявлено расширение контроля (новые элементы и экстерриториальные правила), затем, по сообщениям, часть мер была отложена после переговоров с США.<\/li><\/ul>\n<p>Ситуация меняется быстро: проверяйте свежие новости перед каждым разговором с кандидатом из отрасли.<\/p>\n<h3>1.4 Цепочка вне Китая: кто есть кто<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Звено<\/th><th>Компании и проекты (вне Китая)<\/th><\/tr><\/thead><tbody><tr><td>Добыча и концентрат<\/td><td><strong>Lynas<\/strong> (Маунт-Уэлд, Австралия), <strong>MP Materials<\/strong> (Маунтин-Пасс, США), <strong>Iluka<\/strong> (Энеабба, Австралия; монацит), Arafura (Nolans, Австралия), Serra Verde (ионно-адсорбционные глины, Бразилия), Pensana (Ангола), Mkango (Малави), проекты Гренландии, Канады, Швеции (LKAB — РЗЭ из апатита)<\/td><\/tr><tr><td>Вскрытие и смешанные продукты<\/td><td>Lynas (Калгурли), Iluka, Energy Fuels (White Mesa, США), Saskatchewan Research Council (Канада)<\/td><\/tr><tr><td><strong>Разделение<\/strong><\/td><td><strong>Lynas<\/strong> (Куантан, Малайзия; в 2025 г. сообщила о выпуске разделённых Dy и Tb), <strong>MP Materials<\/strong>, <strong>Solvay<\/strong> (Ла-Рошель, Франция), <strong>Neo Performance Materials<\/strong> (Silmet, Эстония), Energy Fuels, <strong>IREL<\/strong> (Индия), Carester (Франция, проект), Iluka (интегрированный завод в Энеаббе, строится)<\/td><\/tr><tr><td>Металлы и сплавы<\/td><td>Производители во Вьетнаме, Японии, Великобритании (Less Common Metals), США<\/td><\/tr><tr><td><strong>Магниты<\/strong><\/td><td><strong>Proterial<\/strong> (бывш. Hitachi Metals), <strong>Shin-Etsu Chemical<\/strong>, <strong>TDK<\/strong>, Daido Electronics (Япония); <strong>VAC<\/strong> (Германия; завод eVAC в США); <strong>Neo Performance Materials<\/strong> (Нарва, Эстония); <strong>MP Materials<\/strong> (Форт-Уэрт, США); Noveon Magnetics, USA Rare Earth (США)<\/td><\/tr><tr><td>Переработка магнитов<\/td><td>HyProMag (Великобритания, Германия, США), Noveon, Ionic Rare Earths (Великобритания), Carester (Франция)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Государственная поддержка.<\/strong> В 2025 г. Министерство обороны США, по сообщениям, стало крупнейшим акционером MP Materials и установило минимальную цену на NdPr-оксид для этой компании. Япония (JOGMEC) с 2010-х годов финансирует Lynas. ЕС принял Critical Raw Materials Act (2024). Корея (KOMIR) создаёт запасы. <strong>Следствие для рынка труда: проекты вне Китая финансируются государствами, поэтому зарплаты и бонусы специалистов по РЗЭ на Западе высоки.<\/strong><\/p>\n<h3>1.5 РЗЭ в Центральной Азии и у TMK<\/h3>\n<ul><li><strong>Узбекистан.<\/strong> TMK заключила соглашение с Solvomet (KU Leuven) об извлечении <strong>РЗЭ и рения из продуктивных растворов<\/strong> урановых месторождений U–РЗЭ–Re (старт — январь 2026 г.). В 2024 г. президент объявил о планах проектов по РЗЭ (в СМИ называлась сумма около $500 млн). TMK — член Rare Earth Industry Association.<\/li><li><strong>Казахстан.<\/strong> Интерес к РЗЭ у государственных компаний; в прошлом существовало СП Казатомпрома и Sumitomo по получению РЗЭ из урановых хвостов.<\/li><li><strong>Россия.<\/strong> Ловозерский ГОК (лопарит) и Соликамский магниевый завод (переработка лопарита); проекты Росатома. Работа с кандидатами отсюда требует санкционной проверки.<\/li><\/ul>\n<p><strong>Что это означает для TMK [Аналитика].<\/strong> Самый реалистичный ранний вход TMK в РЗЭ — <strong>попутное извлечение из растворов<\/strong>: ионный обмен и экстракция малых концентраций в больших объёмах, радиационная безопасность, затем получение смешанного продукта. Профиль первых специалистов — гидрометаллурги с опытом <strong>урановых растворов и РЗЭ<\/strong>, а не магнитчики. Магнитные компетенции станут актуальны позже, если цепочка пойдёт дальше.<\/p>\n<h3>1.6 Цены и единицы<\/h3>\n<ul><li>Основные котировки: <strong>NdPr-оксид<\/strong> ($/кг), <strong>Dy-оксид<\/strong>, <strong>Tb-оксид<\/strong> ($/кг), <strong>смешанный карбонат РЗЭ<\/strong> (по содержанию REO и составу).<\/li><li>Цены формируют ценовые агентства (Asian Metal, SMM, Fastmarkets, Argus, Benchmark) и рынок Китая; появились ценовые разрывы «Китай / вне Китая».<\/li><li><strong>TREO<\/strong> (total rare earth oxides) — сумма оксидов РЗЭ; <strong>корзина<\/strong> (basket) — состав РЗЭ в сырье; <strong>стоимость корзины<\/strong> ($/кг TREO) определяет экономику месторождения.<\/li><li><strong>MREC<\/strong> (mixed rare earth carbonate) — типичный товарный продукт между добытчиком и разделителем.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Редкоземельные элементы (РЗЭ)<\/td><td>Rare earth elements (REE)<\/td><td>15 лантаноидов + иттрий и скандий<\/td><\/tr><tr><td>Лантаноиды<\/td><td>Lanthanides<\/td><td>Элементы от La (57) до Lu (71)<\/td><\/tr><tr><td>Лёгкие РЗЭ<\/td><td>Light rare earths (LREE)<\/td><td>La, Ce, Pr, Nd, Sm<\/td><\/tr><tr><td>Тяжёлые РЗЭ<\/td><td>Heavy rare earths (HREE)<\/td><td>Tb, Dy, Ho, Er, Tm, Yb, Lu (и Y)<\/td><\/tr><tr><td>Магнитные РЗЭ<\/td><td>Magnet rare earths<\/td><td>Nd, Pr, Dy, Tb — основа рынка по стоимости<\/td><\/tr><tr><td>Оксид неодима-празеодима<\/td><td>NdPr oxide (didymium oxide)<\/td><td>Главный товарный продукт для магнитов<\/td><\/tr><tr><td>Сумма оксидов РЗЭ<\/td><td>TREO (total rare earth oxides)<\/td><td>Единица содержания и состава<\/td><\/tr><tr><td>Корзина РЗЭ<\/td><td>REE basket / distribution<\/td><td>Относительный состав элементов в сырье<\/td><\/tr><tr><td>Смешанный карбонат РЗЭ<\/td><td>Mixed rare earth carbonate (MREC)<\/td><td>Промежуточный продукт до разделения<\/td><\/tr><tr><td>Разделение РЗЭ<\/td><td>REE separation<\/td><td>Получение индивидуальных оксидов<\/td><\/tr><tr><td>Постоянный магнит<\/td><td>Permanent magnet<\/td><td>Магнит, сохраняющий намагниченность<\/td><\/tr><tr><td>Магнит NdFeB<\/td><td>NdFeB magnet (neodymium magnet)<\/td><td>Самый сильный тип постоянных магнитов<\/td><\/tr><tr><td>Магнит SmCo<\/td><td>Samarium-cobalt magnet<\/td><td>Магнит для высоких температур<\/td><\/tr><tr><td>Мишметалл<\/td><td>Mischmetal<\/td><td>Сплав лёгких РЗЭ (Ce, La) для металлургии<\/td><\/tr><tr><td>Бастнезит<\/td><td>Bastnäsite<\/td><td>Главный минерал лёгких РЗЭ<\/td><\/tr><tr><td>Монацит<\/td><td>Monazite<\/td><td>Фосфат РЗЭ с торием<\/td><\/tr><tr><td>Ионно-адсорбционные глины<\/td><td>Ion-adsorption clays<\/td><td>Источник тяжёлых РЗЭ (Южный Китай, Мьянма)<\/td><\/tr><tr><td>Экспортный контроль<\/td><td>Export controls<\/td><td>Лицензирование или запрет экспорта товаров и технологий<\/td><\/tr><tr><td>Квоты добычи и разделения<\/td><td>Mining and smelting/separation quotas<\/td><td>Государственные лимиты Китая<\/td><\/tr><tr><td>Цепочка поставок<\/td><td>Supply chain<\/td><td>Звенья от рудника до изделия<\/td><\/tr><tr><td>Диверсификация поставок<\/td><td>Supply diversification<\/td><td>Снижение зависимости от одного поставщика<\/td><\/tr><tr><td>Минимальная цена (гарантированная)<\/td><td>Price floor<\/td><td>Гарантия цены продукту со стороны государства или покупателя<\/td><\/tr><tr><td>Офтейк<\/td><td>Offtake<\/td><td>Долгосрочный договор покупки продукции<\/td><\/tr><tr><td>Стратегический резерв<\/td><td>Strategic stockpile<\/td><td>Государственные запасы сырья<\/td><\/tr><tr><td>Электродвигатель с постоянными магнитами<\/td><td>Permanent magnet motor<\/td><td>Основной потребитель магнитов NdFeB<\/td><\/tr><tr><td>Тяговый двигатель<\/td><td>Traction motor<\/td><td>Двигатель электромобиля<\/td><\/tr><tr><td>Переработка магнитов<\/td><td>Magnet recycling<\/td><td>Возврат РЗЭ из лома и отработанных магнитов<\/td><\/tr><tr><td>Попутное извлечение<\/td><td>By-product recovery<\/td><td>Получение РЗЭ из чужих потоков (урановые растворы, фосфаты)<\/td><\/tr><tr><td>Природные радионуклиды<\/td><td>NORM<\/td><td>Th, U и продукты распада в сырье РЗЭ<\/td><\/tr><tr><td>Скандий<\/td><td>Scandium<\/td><td>РЗЭ для алюминиевых сплавов и твёрдооксидных топливных элементов<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли цепочки РЗЭ<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Звено<\/th><th>Роли (RU / EN)<\/th><th>Дефицит вне Китая<\/th><\/tr><\/thead><tbody><tr><td>Геология и добыча<\/td><td>Геолог по РЗЭ (REE Geologist), технолог-обогатитель по РЗЭ<\/td><td>★★<\/td><\/tr><tr><td>Вскрытие и выщелачивание<\/td><td>Гидрометаллург по РЗЭ (REE Hydrometallurgist), специалист по радиационной безопасности (Radiation Safety Officer)<\/td><td>★★★<\/td><\/tr><tr><td>Разделение<\/td><td>Технолог экстракционного разделения (REE Separation / SX Engineer), специалист по моделированию каскадов<\/td><td>★★★<\/td><\/tr><tr><td>Металлы и сплавы<\/td><td>Электрохимик (Molten Salt Electrolysis Engineer), металлург РЗЭ-металлов<\/td><td>★★★<\/td><\/tr><tr><td>Магниты<\/td><td>Технолог магнитов NdFeB (Magnet Process Engineer), специалист по магнитным измерениям, инженер по применению (Application Engineer)<\/td><td>★★★<\/td><\/tr><tr><td>Рынок<\/td><td>Специалист по продажам и маркетингу РЗЭ (REE Marketing / Commercial Manager), аналитик<\/td><td>★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Первые вопросы, которые отделяют специалиста РЗЭ от «соседа»<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«С каким сырьём и с какой корзиной РЗЭ вы работали?»<\/td><td>Минерал или источник, TREO, доли Nd+Pr и Dy+Tb, радиоактивность<\/td><td>«С редкоземельными металлами» без деталей<\/td><\/tr><tr><td>«На каком звене цепочки ваш опыт: вскрытие, разделение, металлы, магниты?»<\/td><td>Чётко называет звено и соседние, с которыми взаимодействовал<\/td><td>Перечисляет все звенья — подозрительно широко<\/td><\/tr><tr><td>«Какой продукт вы выпускали и какой чистоты?»<\/td><td>NdPr-оксид 99%+, Dy-оксид 99,9% и т. п., спецификации покупателей<\/td><td>Не знает спецификаций<\/td><\/tr><tr><td>«Как в вашем производстве обращались с торием и ураном?»<\/td><td>Схема удаления, обращение с отходами, дозиметрия, разрешения<\/td><td>«Это не моя зона» (для технолога — плохой знак)<\/td><\/tr><tr><td>«Работали ли вы с китайскими технологиями или оборудованием? Какие у вас обязательства по конфиденциальности?»<\/td><td>Честно описывает, что можно и что нельзя переносить<\/td><td>Предлагает «привезти технологию» — юридический риск для TMK<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать специалистов по РЗЭ<\/h3>\n<ul><li><strong>Австралия:<\/strong> Lynas, Iluka, Arafura, ANSTO, CSIRO; университеты Curtin, Murdoch, UQ. Пул вырос, но конкуренция высокая.<\/li><li><strong>Малайзия:<\/strong> Lynas Advanced Materials Plant (Куантан) — крупнейший вне Китая пул операторов и инженеров разделения.<\/li><li><strong>США:<\/strong> MP Materials, Energy Fuels, Ames National Laboratory (Critical Materials Innovation Hub), Idaho и Oak Ridge National Laboratories, ReElement Technologies (партнёр TMK).<\/li><li><strong>Европа:<\/strong> Solvay (Франция), Neo Performance Materials (Эстония), KU Leuven (Solvomet — партнёр TMK), LKAB (Швеция), Carester (Франция), Less Common Metals (Великобритания), VAC (Германия).<\/li><li><strong>Япония и Корея:<\/strong> Shin-Etsu, Proterial, TDK, JOGMEC (партнёр TMK), KIGAM (партнёр TMK).<\/li><li><strong>Индия и Вьетнам:<\/strong> IREL, вьетнамские РЗЭ-компании.<\/li><li><strong>Китай:<\/strong> самый большой пул, но высокие юридические и экспортные риски. Только с согласования юристов TMK.<\/li><li><strong>СНГ:<\/strong> Соликамский магниевый завод, Ловозерский ГОК, институты Росатома (ВНИИХТ, Гиредмет) — с обязательной санкционной проверкой; Казахстан — опыт урановых растворов и сорбции.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (25 мин). Цепочка «рудник → магнит».<\/strong> Нарисуйте цепочку (блоки 1.3–1.4). Для каждого звена укажите:<\/p>\n<ul><li>продукт на выходе;<\/li><li>2–3 компании вне Китая;<\/li><li>ключевую роль (RU / EN) и дефицит (★–★★★).<\/li><\/ul>\n<p>Отметьте три звена, на которых TMK реально может конкурировать за людей в ближайшие 2–3 года (подсказка: блок 1.5).<\/p>\n<p><strong>Задание 2 (15 мин). Мониторинг.<\/strong> Подпишитесь в LinkedIn на страницы Lynas, MP Materials, Solvay, Neo Performance Materials, Iluka, Rare Earth Industry Association. Создайте папку «РЗЭ — сигналы рынка» и сохраняйте новости о закрытиях, запусках и перестановках руководителей.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Объясните за минуту, почему «РЗЭ» — это пять разных профессий.<\/li><li>Какие три звена цепочки вы отметили для TMK? Почему именно они?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 12: сырьё РЗЭ, вскрытие, радиационная безопасность».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> с сегодняшнего дня вы работаете в самом горячем сегменте рынка критических минералов. Каждый день курса теперь прямо конвертируется в ваше преимущество над рекрутерами, которые ищут «специалиста по РЗЭ» по ключевому слову.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>USGS Mineral Commodity Summaries — Rare Earths (ежегодно, бесплатно).<\/li><li>IEA Global Critical Minerals Outlook — разделы о РЗЭ и магнитах.<\/li><li>C. K. Gupta, N. Krishnamurthy, <em>Extractive Metallurgy of Rare Earths<\/em> (CRC Press).<\/li><li>Rare Earth Industry Association (REIA) — новости и мероприятия (TMK — член ассоциации).<\/li><li>Видео: «rare earth supply chain explained», «how rare earth magnets are made».<\/li><\/ul>"},{"n":12,"module":3,"title":"Сырьё РЗЭ: обогащение, вскрытие, выщелачивание и радиационная безопасность","file":"module-03-ree-critical-minerals/day-12-ree-processing-cracking.md","duration":"3,5 часа","challenge":"Составить <strong>профиль позиции «Гидрометаллург по РЗЭ и редким металлам из растворов»<\/strong> для проекта TMK с Solvomet: must-have, шкала масштаба, 8 доноров, 6 вопросов скрининга.","why":"Прежде чем разделять РЗЭ, их нужно «вытащить» из минерала или раствора. Именно здесь проекты чаще всего теряют деньги и годы: упорные минералы, торий, огромные объёмы бедных растворов. У TMK первый шаг в РЗЭ — именно здесь. Позиция, которую вы сегодня опишете, — одна из первых, которую вас реально попросят закрыть.","checklist":[{"text":"Разминка: 5 вопросов по Дню 11 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: профиль позиции «Гидрометаллург по РЗЭ из растворов» (45 мин)","minutes":45},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.3, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Вскрытие концентрата","en":"Cracking / decomposition","def":"Перевод упорного минерала в растворимую форму"},{"ru":"Сернокислотный обжиг","en":"Sulfuric acid baking","def":"Обработка концентрата H₂SO₄ при нагреве"},{"ru":"Щелочное разложение","en":"Caustic cracking","def":"Разложение монацита гидроксидом натрия"},{"ru":"Солянокислотное выщелачивание","en":"Hydrochloric acid leaching","def":"Растворение РЗЭ в HCl"},{"ru":"Выщелачивание солевым раствором","en":"Salt leaching (ion exchange leaching)","def":"Десорбция РЗЭ с глин раствором соли"},{"ru":"Ионно-адсорбционные глины","en":"Ionic (ion-adsorption) clays","def":"Источник тяжёлых РЗЭ"},{"ru":"Хлорирование","en":"Chlorination","def":"Высокотемпературная переработка лопарита"},{"ru":"Остаток выщелачивания","en":"Leach residue","def":"Твёрдый остаток после выщелачивания"},{"ru":"Очистка раствора от примесей","en":"Impurity removal","def":"Удаление Fe, Al, Th, U перед разделением"},{"ru":"Смешанный хлорид РЗЭ","en":"Mixed rare earth chloride","def":"Промежуточный продукт для экстракции"},{"ru":"Групповой концентрат","en":"Group concentrate (e.g., SEG, HREE)","def":"Смесь нескольких РЗЭ одной группы"},{"ru":"Осаждение оксалатов","en":"Oxalate precipitation","def":"Выделение РЗЭ щавелевой кислотой"},{"ru":"Торий","en":"Thorium","def":"Радиоактивный спутник монацита"},{"ru":"Радиоактивные отходы","en":"Radioactive waste","def":"Отходы с повышенной активностью"},{"ru":"Природные радионуклиды","en":"NORM / TENORM","def":"Th, U, Ra в сырье и технологически концентрированные"},{"ru":"Специалист по радиационной безопасности","en":"Radiation Safety Officer (RSO)","def":"Обязательная роль на производстве с NORM"},{"ru":"Дозиметрия","en":"Dosimetry","def":"Измерение доз облучения персонала"},{"ru":"Радон","en":"Radon","def":"Радиоактивный газ — продукт распада урана и тория"},{"ru":"Фосфогипс","en":"Phosphogypsum","def":"Отход производства фосфорной кислоты, содержит РЗЭ"},{"ru":"Красный шлам","en":"Red mud","def":"Отход производства глинозёма, содержит Sc и РЗЭ"},{"ru":"Попутные потоки","en":"Side streams / by-product streams","def":"Потоки чужого процесса, из которых извлекают РЗЭ"},{"ru":"Сорбция на смолах","en":"Resin adsorption (IX)","def":"Концентрирование малых количеств РЗЭ и рения"},{"ru":"Пилотная установка","en":"Pilot plant","def":"Непрерывные испытания перед промышленным проектом"},{"ru":"Переработка магнитов (короткий цикл)","en":"Short-loop magnet recycling","def":"Водородная обработка и повторное спекание лома"},{"ru":"Переработка магнитов (длинный цикл)","en":"Long-loop recycling","def":"Возврат РЗЭ до оксидов гидрометаллургией"},{"ru":"Водородное охрупчивание","en":"Hydrogen decrepitation (HD)","def":"Разрушение сплава NdFeB водородом"},{"ru":"Аммонийный азот","en":"Ammonium nitrogen","def":"Загрязнитель сточных вод РЗЭ-производств"},{"ru":"Газоочистка от HF и SO₂","en":"Off-gas scrubbing","def":"Очистка газов сернокислотного обжига"},{"ru":"Минеральные пески","en":"Mineral sands","def":"Россыпи с ильменитом, цирконом, монацитом"},{"ru":"Скандий из попутных источников","en":"By-product scandium","def":"Скандий из растворов, шламов, хвостов"}],"quiz":[{"q":"Какой способ вскрытия классически применяют для монацита?","options":["Цианирование в агитационных чанах","Флотация с ксантогенатом и известью","Электролиз водного раствора концентрата","Щелочное разложение гидроксидом натрия"],"answer":3,"explain":"NaOH при ~140–170 °C даёт гидроксиды РЗЭ и раствор фосфата натрия. Затем отделяют торий и уран."},{"q":"Как извлекают РЗЭ из ионно-адсорбционных глин?","options":["Плавкой глины в дуговой электропечи с последующим выделением металлов РЗЭ из шлака","Выщелачиванием солевым раствором: катион соли вытесняет РЗЭ с поверхности глины","Флотацией бастнезита из глины с жирными кислотами","Гравитационным обогащением на винтовых сепараторах"],"answer":1,"explain":"Используют сульфат аммония или сульфат магния. Метод простой, но с серьёзными экологическими рисками."},{"q":"Главная технологическая особенность извлечения РЗЭ из растворов урановых месторождений:","options":["Малые концентрации в огромных объёмах раствора и запрет вредить основному процессу","Очень высокие концентрации РЗЭ, близкие к концентратам, поэтому их сразу направляют на разделение","Отсутствие радиоактивности, поэтому лицензии не нужны","Необходимость флотации растворов перед сорбцией"],"answer":0,"explain":"Нужен селективный метод концентрирования (ионный обмен, экстракция) и контроль раствора, который возвращается на полигон."},{"q":"Почему радиационная безопасность — обязательная тема в РЗЭ-проектах?","options":["Все РЗЭ сами по себе сильно радиоактивны, особенно лантан и церий, поэтому нужна особая защита","Этого требуют только китайские нормы для экспортёров РЗЭ","Торий, уран и продукты их распада концентрируются в остатках, осадках и на оборудовании","Из-за рентгеновских анализаторов в заводских лабораториях"],"answer":2,"explain":"Нужны лицензии, дозиметрия, обращение с отходами и специалист по радиационной безопасности (RSO)."},{"q":"Что происходит с газами при сернокислотном обжиге концентратов РЗЭ?","options":["Газов не образуется: процесс идёт в закрытых чанах","Образуются HF и SO₂ — нужна серьёзная газоочистка","Выделяется чистый кислород, который возвращают в печь","Выделяется водород, который сжигают в факеле"],"answer":1,"explain":"Фтор из бастнезита и сера из кислоты переходят в газы. Газоочистка — отдельная компетенция и источник вакансий."},{"q":"Чем короткий цикл переработки магнитов отличается от длинного?","options":["Короткий цикл возвращает лом в магниты водородной обработкой и спеканием без разделения элементов","Короткий цикл длится меньше суток, а длинный занимает несколько недель из-за медленного растворения","Длинный цикл не использует химию, только механическое дробление","Различий нет: это два названия одного и того же процесса"],"answer":0,"explain":"Длинный цикл растворяет лом и выделяет РЗЭ до оксидов; короткий сохраняет сплав."},{"q":"Какой отход производства фосфорной кислоты рассматривают как источник РЗЭ?","options":["Красный шлам","Угольная зола","Хвосты золотодобычи","Фосфогипс"],"answer":3,"explain":"Красный шлам — отход глинозёмного производства (источник скандия), а фосфогипс — фосфорной кислоты."},{"q":"Кандидат: «Я разрабатывала сорбцию рения из урановых растворов». Что уточнить в первую очередь?","options":["Какую марку смолы она считает лучшей и почему","Есть ли у неё публикации и патенты по сорбции рения","Масштаб (лаборатория, пилот, промышленность), объёмы раствора и длительность непрерывной работы","Сколько лет она работает в отрасли, на каких должностях и в каких компаниях, сколько у неё подчинённых"],"answer":2,"explain":"Шкала масштаба — главный фильтр гидрометаллурга."},{"q":"Какой опыт ближе всего к задаче TMK по РЗЭ и рению из растворов?","options":["Сорбция и десорбция на полигонах скважинного подземного выщелачивания урана","Производство спечённых магнитов NdFeB для двигателей","Флотация медных и молибденовых руд на крупной обогатительной фабрике с колоннами","Электролиз алюминия в криолитовом расплаве"],"answer":0,"explain":"Работа с большими объёмами бедных растворов, смолы, циклы сорбции и десорбции, радиационная безопасность — прямо переносимые навыки."},{"q":"Какая проблема характерна для ионно-адсорбционной добычи в Южном Китае?","options":["Слишком высокое содержание РЗЭ","Загрязнение вод аммонием и оползни","Высокая радиоактивность руды","Отсутствие тяжёлых РЗЭ"],"answer":1,"explain":"Поэтому переходят на сульфат магния и ужесточают контроль. Экологический опыт таких проектов ценен."}],"html":"<h2>0. Разминка: вспомнить День 11<\/h2>\n<ol><li>Какие элементы относятся к магнитным РЗЭ и зачем каждый из них нужен?<\/li><li>Что такое TREO и «корзина» РЗЭ?<\/li><li>Назовите три компании, разделяющие РЗЭ вне Китая.<\/li><li>Что Китай ограничил в 2023 и 2025 гг.?<\/li><li>Почему «специалист по РЗЭ» — это пять разных профессий?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Nd и Pr — основа магнитов NdFeB; Dy и Tb — сохранение свойств при нагреве; Sm — магниты SmCo.<\/li><li>TREO — сумма оксидов РЗЭ; корзина — относительный состав элементов, определяющий стоимость сырья.<\/li><li>Lynas, Solvay, Neo Performance Materials (Silmet), MP Materials, Energy Fuels, IREL.<\/li><li>2023 — экспорт технологий извлечения, разделения и производства магнитов; 2025 — лицензирование экспорта семи средних и тяжёлых РЗЭ и магнитов.<\/li><li>Геология, вскрытие и выщелачивание, разделение, металлы и сплавы, магниты.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Пять источников РЗЭ и их технологические «характеры»<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Источник<\/th><th>Минералы / форма<\/th><th>Обогащение<\/th><th>Вскрытие<\/th><th>Главная сложность<\/th><\/tr><\/thead><tbody><tr><td><strong>Карбонатиты<\/strong> (Маунтин-Пасс, Баян-Обо, Маунт-Уэлд)<\/td><td>Бастнезит, монацит<\/td><td>Флотация (жирные кислоты, гидроксаматы), магнитная сепарация (Баян-Обо — комплексная Fe–РЗЭ–Nb руда)<\/td><td>Сернокислотный обжиг; окислительный обжиг + солянокислотное выщелачивание<\/td><td>Сложная минералогия, фтор, торий<\/td><\/tr><tr><td><strong>Россыпи и минеральные пески<\/strong><\/td><td>Монацит, ксенотим<\/td><td>Гравитация, магнитная и электростатическая сепарация<\/td><td><strong>Щелочное разложение<\/strong> (NaOH) или сернокислотный обжиг<\/td><td>Торий и уран; радиационная безопасность<\/td><\/tr><tr><td><strong>Ионно-адсорбционные глины<\/strong> (Южный Китай, Мьянма, Бразилия)<\/td><td>РЗЭ адсорбированы на глинах<\/td><td>Не требуется<\/td><td><strong>Выщелачивание солевым раствором<\/strong> (сульфат аммония, сейчас всё чаще сульфат магния) — в отвалах, кучах или прямо в массиве<\/td><td>Экология: аммоний, оползни, загрязнение вод; низкое содержание<\/td><\/tr><tr><td><strong>Щелочные породы<\/strong> (Ловозеро, Кванефьельд, Норра-Кярр)<\/td><td>Лопарит, эвдиалит<\/td><td>Гравитация, магнитная сепарация, флотация<\/td><td>Хлорирование (лопарит), кислотное выщелачивание (эвдиалит — образование геля кремнезёма)<\/td><td>Технологии уникальны для каждого сырья<\/td><\/tr><tr><td><strong>Попутные источники<\/strong><\/td><td>Фосфаты (апатит, фосфогипс), <strong>урановые растворы<\/strong>, угольная зола, красный шлам<\/td><td>Зависит от источника<\/td><td>Сорбция, экстракция, выщелачивание<\/td><td>Низкие концентрации в огромных потоках; нельзя мешать основному процессу<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.2 Вскрытие: перевести РЗЭ из минерала в раствор<\/h3>\n<p><strong>Сернокислотный обжиг<\/strong> (sulfuric acid baking) — концентрат смешивают с концентрированной серной кислотой и нагревают в печах (сотни °C). Минерал разрушается, РЗЭ переходят в сульфаты, которые затем выщелачивают водой. Так перерабатывают концентраты Баян-Обо и Маунт-Уэлд (Lynas делает это на заводе в Калгурли). Отходящие газы содержат HF и SO₂ — нужна серьёзная газоочистка.<\/p>\n<p><strong>Щелочное разложение<\/strong> (caustic cracking) — классика для монацита. Концентрат обрабатывают концентрированным NaOH при ~140–170 °C:<\/p>\n<ul><li>образуются гидроксиды РЗЭ (и тория) и раствор фосфата натрия (попутный продукт);<\/li><li>гидроксиды растворяют в соляной кислоте, затем торий и уран отделяют селективным осаждением или экстракцией.<\/li><\/ul>\n<p><strong>Выщелачивание ионно-адсорбционных глин<\/strong> — ионный обмен: катион соли (NH₄⁺ или Mg²⁺) вытесняет РЗЭ с поверхности глины. Из раствора РЗЭ осаждают щавелевой кислотой или бикарбонатом аммония → смешанный продукт, богатый тяжёлыми РЗЭ.<\/p>\n<p><strong>Очистка раствора<\/strong> перед разделением:<\/p>\n<ul><li>удаление Fe, Al, Th, U (pH-осаждение, экстракция);<\/li><li>удаление Ca, Mg, сульфатов, фторидов.<\/li><\/ul>\n<p><strong>Продукты:<\/strong> смешанный карбонат РЗЭ (MREC), смешанный хлорид РЗЭ, смешанный оксид, групповые концентраты (например, SEG — Sm-Eu-Gd, тяжёлые РЗЭ).<\/p>\n<h3>1.3 РЗЭ из растворов: случай TMK<\/h3>\n<p>У TMK — потоки продуктивных растворов урановых месторождений (после извлечения урана). Особенности таких проектов:<\/p>\n<ul><li><strong>концентрации малы<\/strong> (миллиграммы на литр), <strong>объёмы огромны<\/strong> (тысячи м³ в час на крупных полигонах СПВ) → нужен селективный метод концентрирования, обычно <strong>ионный обмен<\/strong> (смолы) или <strong>экстракция<\/strong>;<\/li><li><strong>нельзя навредить основному процессу<\/strong>: возвращаемый на полигон раствор не должен портить извлечение урана;<\/li><li>в растворе есть <strong>рений<\/strong> (ценный попутный компонент, у TMK он уже стратегический продукт) и, возможно, скандий, ванадий;<\/li><li><strong>радиационная безопасность<\/strong>: уран и продукты распада в потоках и на смолах;<\/li><li>путь развития: лабораторные испытания (Solvomet) → <strong>пилотная установка на площадке<\/strong> → промышленный модуль → смешанный продукт РЗЭ и перренат аммония.<\/li><\/ul>\n<p><strong>Где такой опыт есть в мире [Аналитика]:<\/strong> урановые предприятия СПВ (Казахстан, Узбекистан, США, Австралия) — сорбция и десорбция; проекты извлечения РЗЭ и скандия из попутных потоков (фосфорная кислота, красный шлам, урановые растворы); исследовательские группы гидрометаллургии.<\/p>\n<h3>1.4 Радиационная безопасность: то, что нельзя игнорировать<\/h3>\n<p><strong>Почему это важно:<\/strong> торий-232 и уран-238 — родоначальники радиоактивных рядов. При переработке они и продукты их распада (радий, радон) концентрируются в отдельных потоках: остатках выщелачивания, осадках, на смолах, в отложениях оборудования.<\/p>\n<p><strong>Что требуется:<\/strong><\/p>\n<ul><li><strong>разрешения и лицензии<\/strong> на обращение с источниками ионизирующего излучения (NORM/TENORM);<\/li><li><strong>радиационный контроль<\/strong>: дозиметрия персонала, мониторинг рабочих мест, радона, воздуха и сбросов;<\/li><li><strong>обращение с радиоактивными отходами<\/strong>: хранение, захоронение, план закрытия;<\/li><li><strong>специалист по радиационной безопасности<\/strong> (Radiation Safety Officer, RSO) — обязательная роль;<\/li><li><strong>коммуникация с обществом<\/strong>: история Lynas в Малайзии показывает, что вопрос остатков с торием может стать политическим и годами определять судьбу завода.<\/li><\/ul>\n<h3>1.5 Вторичное сырьё: переработка магнитов<\/h3>\n<ul><li><strong>Короткий цикл<\/strong> (short loop): отработанные магниты NdFeB обрабатывают водородом (водородное охрупчивание), измельчают и снова спекают в магниты, без разделения элементов. Пример — HyProMag.<\/li><li><strong>Длинный цикл<\/strong> (long loop): лом растворяют, РЗЭ выделяют гидрометаллургией до оксидов и затем возвращают в цепочку. Примеры — Solvay, Carester, Ionic Rare Earths.<\/li><li>Источники: отходы магнитного производства (шлам после шлифовки — до трети массы заготовки может уходить в отходы при обработке), жёсткие диски, двигатели, ветрогенераторы.<\/li><li>Значение: переработка не закроет потребность целиком, но быстро растёт при поддержке ЕС и США.<\/li><\/ul>\n<h3>1.6 KPI и терминология практика<\/h3>\n<ul><li><strong>Извлечение РЗЭ на вскрытии и выщелачивании<\/strong>, %; отдельно по Nd, Pr, Dy, Tb.<\/li><li><strong>Расход реагентов<\/strong>: кг кислоты или щёлочи на тонну концентрата.<\/li><li><strong>Содержание примесей<\/strong> в смешанном продукте: Fe, Al, Th, U, Ca, SO₄.<\/li><li><strong>Радиационные показатели<\/strong>: удельная активность продуктов и отходов, дозы персонала.<\/li><li><strong>Экология<\/strong>: аммонийный азот в сточных водах, фториды, SO₂.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Вскрытие концентрата<\/td><td>Cracking / decomposition<\/td><td>Перевод упорного минерала в растворимую форму<\/td><\/tr><tr><td>Сернокислотный обжиг<\/td><td>Sulfuric acid baking<\/td><td>Обработка концентрата H₂SO₄ при нагреве<\/td><\/tr><tr><td>Щелочное разложение<\/td><td>Caustic cracking<\/td><td>Разложение монацита гидроксидом натрия<\/td><\/tr><tr><td>Солянокислотное выщелачивание<\/td><td>Hydrochloric acid leaching<\/td><td>Растворение РЗЭ в HCl<\/td><\/tr><tr><td>Выщелачивание солевым раствором<\/td><td>Salt leaching (ion exchange leaching)<\/td><td>Десорбция РЗЭ с глин раствором соли<\/td><\/tr><tr><td>Ионно-адсорбционные глины<\/td><td>Ionic (ion-adsorption) clays<\/td><td>Источник тяжёлых РЗЭ<\/td><\/tr><tr><td>Хлорирование<\/td><td>Chlorination<\/td><td>Высокотемпературная переработка лопарита<\/td><\/tr><tr><td>Остаток выщелачивания<\/td><td>Leach residue<\/td><td>Твёрдый остаток после выщелачивания<\/td><\/tr><tr><td>Очистка раствора от примесей<\/td><td>Impurity removal<\/td><td>Удаление Fe, Al, Th, U перед разделением<\/td><\/tr><tr><td>Смешанный хлорид РЗЭ<\/td><td>Mixed rare earth chloride<\/td><td>Промежуточный продукт для экстракции<\/td><\/tr><tr><td>Групповой концентрат<\/td><td>Group concentrate (e.g., SEG, HREE)<\/td><td>Смесь нескольких РЗЭ одной группы<\/td><\/tr><tr><td>Осаждение оксалатов<\/td><td>Oxalate precipitation<\/td><td>Выделение РЗЭ щавелевой кислотой<\/td><\/tr><tr><td>Торий<\/td><td>Thorium<\/td><td>Радиоактивный спутник монацита<\/td><\/tr><tr><td>Радиоактивные отходы<\/td><td>Radioactive waste<\/td><td>Отходы с повышенной активностью<\/td><\/tr><tr><td>Природные радионуклиды<\/td><td>NORM / TENORM<\/td><td>Th, U, Ra в сырье и технологически концентрированные<\/td><\/tr><tr><td>Специалист по радиационной безопасности<\/td><td>Radiation Safety Officer (RSO)<\/td><td>Обязательная роль на производстве с NORM<\/td><\/tr><tr><td>Дозиметрия<\/td><td>Dosimetry<\/td><td>Измерение доз облучения персонала<\/td><\/tr><tr><td>Радон<\/td><td>Radon<\/td><td>Радиоактивный газ — продукт распада урана и тория<\/td><\/tr><tr><td>Фосфогипс<\/td><td>Phosphogypsum<\/td><td>Отход производства фосфорной кислоты, содержит РЗЭ<\/td><\/tr><tr><td>Красный шлам<\/td><td>Red mud<\/td><td>Отход производства глинозёма, содержит Sc и РЗЭ<\/td><\/tr><tr><td>Попутные потоки<\/td><td>Side streams / by-product streams<\/td><td>Потоки чужого процесса, из которых извлекают РЗЭ<\/td><\/tr><tr><td>Сорбция на смолах<\/td><td>Resin adsorption (IX)<\/td><td>Концентрирование малых количеств РЗЭ и рения<\/td><\/tr><tr><td>Пилотная установка<\/td><td>Pilot plant<\/td><td>Непрерывные испытания перед промышленным проектом<\/td><\/tr><tr><td>Переработка магнитов (короткий цикл)<\/td><td>Short-loop magnet recycling<\/td><td>Водородная обработка и повторное спекание лома<\/td><\/tr><tr><td>Переработка магнитов (длинный цикл)<\/td><td>Long-loop recycling<\/td><td>Возврат РЗЭ до оксидов гидрометаллургией<\/td><\/tr><tr><td>Водородное охрупчивание<\/td><td>Hydrogen decrepitation (HD)<\/td><td>Разрушение сплава NdFeB водородом<\/td><\/tr><tr><td>Аммонийный азот<\/td><td>Ammonium nitrogen<\/td><td>Загрязнитель сточных вод РЗЭ-производств<\/td><\/tr><tr><td>Газоочистка от HF и SO₂<\/td><td>Off-gas scrubbing<\/td><td>Очистка газов сернокислотного обжига<\/td><\/tr><tr><td>Минеральные пески<\/td><td>Mineral sands<\/td><td>Россыпи с ильменитом, цирконом, монацитом<\/td><\/tr><tr><td>Скандий из попутных источников<\/td><td>By-product scandium<\/td><td>Скандий из растворов, шламов, хвостов<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли этого звена<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><\/tr><\/thead><tbody><tr><td>Гидрометаллург по РЗЭ<\/td><td>REE Hydrometallurgist / Process Engineer<\/td><td>Конкретное сырьё, режимы вскрытия, извлечение по элементам, примеси в продукте<\/td><\/tr><tr><td>Специалист по сорбции и экстракции из бедных растворов<\/td><td>IX / SX Specialist (dilute streams)<\/td><td>Типы смол и экстрагентов, ёмкость, циклы, отравление смол, масштаб (м³/ч)<\/td><\/tr><tr><td>Руководитель пилотной установки<\/td><td>Pilot Plant Manager<\/td><td>Длительность непрерывной работы, масштаб, переход к промышленному проекту<\/td><\/tr><tr><td>Специалист по радиационной безопасности<\/td><td>Radiation Safety Officer<\/td><td>Лицензии, дозиметрия, обращение с отходами, опыт с Th и U<\/td><\/tr><tr><td>Инженер-эколог (сточные воды и газы)<\/td><td>Environmental / Effluent Engineer<\/td><td>Аммоний, фториды, сульфаты, SO₂; соответствие нормам<\/td><\/tr><tr><td>Технолог по переработке магнитов<\/td><td>Magnet Recycling Process Engineer<\/td><td>Короткий или длинный цикл, объёмы, чистота продукта<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Каким способом вскрывали концентрат и почему именно так?»<\/td><td>Связывает способ с минералом (монацит → щёлочь; бастнезит → кислотный обжиг), называет режимы<\/td><td>Не понимает, почему способы разные<\/td><\/tr><tr><td>«Какое извлечение по Nd, Pr, Dy и какие потери? Где терялся металл?»<\/td><td>Цифры по элементам, причины потерь<\/td><td>Только общий процент<\/td><\/tr><tr><td>«Как удаляли торий и уран, что делали с остатками?»<\/td><td>Метод удаления, классификация и хранение отходов, контроль<\/td><td>«Остатки вывозили»<\/td><\/tr><tr><td>(Растворы) «Какие объёмы раствора, концентрации, смолы или экстрагенты? Как не навредили основному процессу?»<\/td><td>Порядок объёмов (м³/ч), концентрации (мг/л), выбор смолы, контроль возвратного раствора<\/td><td>Опыт только с концентрированными растворами<\/td><\/tr><tr><td>«Какой у вас масштаб: лаборатория, пилот, промышленность?»<\/td><td>Честный ответ с длительностью и объёмами<\/td><td>Размывает ответ<\/td><\/tr><tr><td>«Какие разрешения по радиационной безопасности вы получали?»<\/td><td>Конкретные процедуры и органы<\/td><td>Не сталкивался<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Доноры для позиции «РЗЭ и рений из растворов»<\/h3>\n<ul><li><strong>Урановые предприятия СПВ:<\/strong> Навоийуран (Узбекистан, рядом и с понятным контекстом), Казатомпром и его СП (Казахстан), Cameco (США), Boss Energy (Австралия), Orano.<\/li><li><strong>РЗЭ-гидрометаллургия:<\/strong> Lynas (Калгурли, Куантан), Iluka, Energy Fuels, Saskatchewan Research Council, Neo Performance Materials (Silmet), Solvay.<\/li><li><strong>Попутное извлечение:<\/strong> проекты РЗЭ из фосфогипса и фосфорной кислоты (Rainbow Rare Earths в ЮАР и др.), скандий из попутных потоков, LKAB (апатит).<\/li><li><strong>Рений:<\/strong> Molymet, KGHM, медное и молибденовое производство АГМК.<\/li><li><strong>Испытания и наука:<\/strong> ANSTO Minerals (Австралия — большой опыт РЗЭ и урана), SGS, Mintek, KU Leuven (Solvomet — партнёр TMK), TU Bergakademie Freiberg (партнёр TMK), Colorado School of Mines, CSIRO.<\/li><li><strong>СНГ (с проверкой ограничений):<\/strong> институты Росатома, предприятия по переработке урановых и редкометалльных растворов.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Профиль позиции (45 мин).<\/strong> «Ведущий гидрометаллург — РЗЭ и рений из продуктивных растворов урановых месторождений (пилот → промышленный модуль), TMK, R&amp;D Park / площадка».<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Блок<\/th><th>Что написать<\/th><\/tr><\/thead><tbody><tr><td>Цель роли на 12 месяцев (результат, а не обязанности)<\/td><td>Например: «запустить пилотную установку и получить данные для проекта промышленного модуля»<\/td><\/tr><tr><td>Must-have (5)<\/td><td>Включите <strong>уровень масштаба<\/strong> (не ниже пилота), сорбцию или экстракцию из бедных растворов, радиационную безопасность<\/td><\/tr><tr><td>Nice-to-have (3–4)<\/td><td>Опыт с рением; русский язык; опыт работы с исследовательскими партнёрами (университетами)<\/td><\/tr><tr><td>Доноры (8)<\/td><td>Из блока 3.3 и ваших находок в LinkedIn<\/td><\/tr><tr><td>Вопросы скрининга (6)<\/td><td>С маркерами сильного ответа<\/td><\/tr><tr><td>Риски и как их снять<\/td><td>Например, учёный без промышленного опыта → сильный заместитель-эксплуатационник<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какой must-have в профиле из практики вы считаете самым трудным для поиска? Почему?<\/li><li>Что вы спросите у кандидата о радиационной безопасности?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 13: разделение и очистка РЗЭ».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы составили профиль, с которым TMK может выйти на рынок уже сейчас. Покажите его нанимающему менеджеру R&amp;D Park и спросите, что он изменил бы. Это и есть применение знаний в течение 48 часов.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>C. K. Gupta, N. Krishnamurthy, <em>Extractive Metallurgy of Rare Earths<\/em> — главы о вскрытии бастнезита, монацита, ионных глин.<\/li><li>Публикации ANSTO Minerals и Solvomet KU Leuven о переработке РЗЭ и попутном извлечении.<\/li><li>МАГАТЭ: публикации по обращению с NORM в горной промышленности и переработке РЗЭ.<\/li><li>Сборники конференции ALTA (раздел Uranium-REE) — источник и знаний, и имён экспертов.<\/li><\/ul>"},{"n":13,"module":3,"title":"Разделение и очистка РЗЭ: каскады экстракции и альтернативы","file":"module-03-ree-critical-minerals/day-13-ree-separation-purification.md","duration":"3,5 часа","challenge":"Подготовить <strong>банк из 12 вопросов<\/strong> для интервью с технологом разделения РЗЭ, с маркерами сильного ответа и «ловушками», которые выдают человека, читавшего о разделении, но не работавшего на нём.","why":"Технолог разделения РЗЭ вне Китая — одна из самых дорогих и редких ролей в отрасли. Ошибка в найме здесь стоит не месяцев, а лет: завод с сотнями смесителей-отстойников, который не выходит на чистоту, — это заморожённые десятки миллионов долларов. Ваша задача — уметь за 30 минут понять, вёл ли кандидат каскад сам.","checklist":[{"text":"Разминка: 5 вопросов по Дням 11–12 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: банк из 12 вопросов для технолога разделения (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Разделение РЗЭ","en":"Rare earth separation","def":"Получение индивидуальных элементов из смеси"},{"ru":"Экстракционный каскад","en":"Solvent extraction cascade","def":"Цепочка ступеней экстракции"},{"ru":"Ступень экстракции","en":"Extraction stage","def":"Один смеситель-отстойник"},{"ru":"Смеситель-отстойник","en":"Mixer-settler","def":"Основной аппарат завода разделения"},{"ru":"Противоточная экстракция","en":"Counter-current extraction","def":"Встречное движение фаз через ступени"},{"ru":"Омыление экстрагента","en":"Saponification","def":"Частичная нейтрализация кислотного экстрагента для роста ёмкости"},{"ru":"Коэффициент разделения","en":"Separation factor","def":"Мера селективности для пары элементов"},{"ru":"Лантаноидное сжатие","en":"Lanthanide contraction","def":"Уменьшение радиуса ионов вдоль ряда, причина сходства соседей"},{"ru":"Групповое разделение","en":"Group separation","def":"Разделение на лёгкую, среднюю, тяжёлую группы"},{"ru":"Пара разделения","en":"Split / separation pair","def":"Граница разделения двух элементов (например, Nd/Sm)"},{"ru":"Промывка (скруббинг)","en":"Scrubbing","def":"Удаление примесей из насыщенной органики"},{"ru":"Реэкстракция","en":"Stripping","def":"Возврат металла из органики в воду"},{"ru":"Рафинат","en":"Raffinate","def":"Водный поток после экстракции"},{"ru":"Межфазные образования","en":"Crud","def":"Эмульсионные отложения на границе фаз"},{"ru":"Унос органики","en":"Organic entrainment","def":"Потери экстрагента с водной фазой"},{"ru":"Окисление церия","en":"Cerium oxidation (Ce⁴⁺)","def":"Приём для отделения церия"},{"ru":"Восстановление европия","en":"Europium reduction (Eu²⁺)","def":"Приём для отделения европия"},{"ru":"Осаждение оксалатов","en":"Oxalate precipitation","def":"Выделение РЗЭ щавелевой кислотой"},{"ru":"Прокалка","en":"Calcination","def":"Перевод оксалатов или карбонатов в оксиды"},{"ru":"Индивидуальный оксид","en":"Separated (individual) oxide","def":"Продукт одного РЗЭ заданной чистоты"},{"ru":"Ионообменная хроматография","en":"Ion exchange chromatography","def":"Разделение на колоннах со смолами"},{"ru":"Хроматография с лигандами","en":"Ligand-assisted chromatography","def":"Метод разделения, разработанный в Purdue University"},{"ru":"Моделирование каскада","en":"Cascade modelling","def":"Расчёт балансов и профилей по ступеням"},{"ru":"Профиль концентраций","en":"Concentration profile","def":"Распределение элементов по ступеням каскада"},{"ru":"Запас органики","en":"Organic inventory","def":"Объём органической фазы в системе"},{"ru":"Пожарная безопасность экстракции","en":"SX fire protection","def":"Защита пожароопасной органики"},{"ru":"Спецификация продукта","en":"Product specification","def":"Требования покупателя к чистоте и примесям"},{"ru":"Матрица (в анализе)","en":"Matrix","def":"Основной компонент пробы, мешающий анализу примесей"},{"ru":"Сточные воды с аммонием","en":"Ammonium-bearing wastewater","def":"Экологическая проблема аммиачного омыления"},{"ru":"Выход каскада на режим","en":"Cascade equilibration","def":"Набор равновесного профиля после пуска"}],"quiz":[{"q":"Почему соседние лантаноиды так трудно разделить?","options":["Они радиоактивны, и работать с ними можно только малыми партиями","У них одинаковый заряд иона и очень близкие радиусы, химические свойства почти совпадают","Они нерастворимы в воде и кислотах, поэтому их нельзя перевести в раствор для экстракции","Их слишком мало в руде, и разделять практически нечего"],"answer":1,"explain":"Отсюда малые коэффициенты разделения и длинные каскады."},{"q":"Зачем кислотный экстрагент частично нейтрализуют (омыляют)?","options":["Чтобы снизить пожароопасность органической фазы","Чтобы удалить торий","Чтобы окислить церий","Чтобы увеличить ёмкость экстрагента"],"answer":3,"explain":"Обратная сторона аммиачного омыления — большие объёмы сточных вод с аммонием."},{"q":"Какой приём используют для отделения церия?","options":["Окисление до Ce⁴⁺","Восстановление до металла","Флотацию","Магнитную сепарацию"],"answer":0,"explain":"Четырёхвалентный церий резко отличается от трёхвалентных соседей. Для европия используют обратный приём — восстановление до Eu²⁺."},{"q":"Сколько ступеней экстракции обычно на заводе полного разделения РЗЭ?","options":["3–5 ступеней на весь завод","10–20 ступеней на весь завод","Сотни, на крупных заводах — больше тысячи","Ровно одна ступень на каждый элемент"],"answer":2,"explain":"Десятки ступеней на каждую пару соседей."},{"q":"Почему каскаду после пуска нужны месяцы до выхода на чистоту?","options":["Каскад должен набрать равновесный профиль концентраций по ступеням","Так требуют санитарные нормы для новых химических производств","Экстрагент должен «созреть» в баках несколько месяцев","Нужно дождаться повышения цен, чтобы пуск окупился"],"answer":0,"explain":"Поэтому опыт пуска и вывода каскада на режим особенно ценен."},{"q":"Какой продукт РЗЭ — главный для производства магнитов?","options":["Оксид лантана","NdPr-оксид","Оксид иттрия","Оксид церия"],"answer":1,"explain":"Смесь оксидов неодима и празеодима в заданном соотношении."},{"q":"Какая компания, партнёр TMK, коммерциализирует хроматографическое разделение РЗЭ, разработанное в Purdue University?","options":["Lynas Rare Earths","Solvay Special Chem","SGS Minerals Services","ReElement Technologies"],"answer":3,"explain":"ReElement Technologies; с TMK у неё соглашение о сотрудничестве по вольфраму и другим критическим элементам."},{"q":"Кандидат уверенно рассказывает о «прорывной технологии разделения». Лучший проверочный вопрос:","options":["«Сколько у вас патентов и в каких странах они действуют?»","«Кто был вашим научным руководителем, где вы защищались и в каких журналах вы публикуетесь чаще всего?»","«Какая непрерывная производительность на пилоте, какая чистота и стоимость на килограмм продукта?»","«Почему вы хотите работать именно в TMK и в Узбекистане?»"],"answer":2,"explain":"Новые технологии разделения — зона громких заявлений. Цифры непрерывной работы отделяют реальность от презентации."},{"q":"Почему в Neo Performance Materials (Silmet, Эстония) стоит искать особенно внимательно?","options":["Это крупнейший в мире завод разделения РЗЭ","Это предприятие разделения РЗЭ, где многие специалисты говорят по-русски","Там нет экспортных ограничений, санкционных рисков и конкуренции за специалистов","Там производят вольфрам и твёрдые сплавы"],"answer":1,"explain":"Опыт разделения плюс русский язык — редкое и ценное для TMK сочетание."},{"q":"Что выдаёт «теоретика» в интервью о разделении РЗЭ?","options":["Не может объяснить, как изменятся продукты каскада при изменении состава питания","Называет число ступеней в каждой секции каскада","Подробно рассказывает о конкретном сбое каскада, его диагностике и разборе с цифрами","Знает потери органики в ppm и меры по их снижению"],"answer":0,"explain":"Варианты Б, В, Г — признаки практика."}],"html":"<h2>0. Разминка: вспомнить Дни 11–12<\/h2>\n<ol><li>Какой способ вскрытия применяют для монацита и для бастнезита?<\/li><li>Что такое MREC и SEG-концентрат?<\/li><li>Почему в РЗЭ-проектах нужен специалист по радиационной безопасности?<\/li><li>В чём особенность извлечения РЗЭ из урановых растворов?<\/li><li>Чем короткий цикл переработки магнитов отличается от длинного?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Монацит — щелочное разложение NaOH (или сернокислотный обжиг); бастнезит — сернокислотный обжиг или окислительный обжиг с солянокислотным выщелачиванием.<\/li><li>MREC — смешанный карбонат РЗЭ; SEG — групповой концентрат самария, европия и гадолиния.<\/li><li>Торий, уран и продукты распада концентрируются в остатках, осадках и на оборудовании.<\/li><li>Малые концентрации в огромных объёмах; нельзя вредить основному урановому процессу.<\/li><li>Короткий — водородная обработка и повторное спекание без разделения; длинный — растворение и выделение оксидов.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Задача разделения<\/h3>\n<p>На входе — раствор смеси 10–15 РЗЭ (обычно хлоридный). На выходе — <strong>индивидуальные продукты<\/strong> заданной чистоты: NdPr-оксид, оксиды Dy, Tb, La, Ce, Sm, Eu, Gd, Y и др.<\/p>\n<p><strong>Почему это трудно:<\/strong> у лантаноидов одинаковый заряд иона (3+) и очень близкие радиусы ионов (лантаноидное сжатие). Химические свойства соседей почти совпадают. Поэтому разделение строится на <strong>многократном повторении<\/strong> маленького эффекта: каскады из десятков ступеней на каждое разделение.<\/p>\n<h3>1.2 Экстракционные каскады: как устроен завод разделения<\/h3>\n<p><strong>Экстрагенты и среды:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Экстрагент<\/th><th>Класс<\/th><th>Применение<\/th><\/tr><\/thead><tbody><tr><td><strong>P507 (PC88A)<\/strong> — эфир 2-этилгексилфосфоновой кислоты<\/td><td>Фосфорорганическая кислота<\/td><td><strong>Основа китайской технологии<\/strong>: разделение практически всех РЗЭ в хлоридных средах<\/td><\/tr><tr><td><strong>D2EHPA (P204)<\/strong><\/td><td>Фосфорорганическая кислота<\/td><td>Тяжёлые РЗЭ, групповые разделения<\/td><\/tr><tr><td>Cyanex 272<\/td><td>Фосфиновая кислота<\/td><td>Тяжёлые РЗЭ (лучшая селективность в части пар)<\/td><\/tr><tr><td>Нафтеновая кислота<\/td><td>Карбоновая кислота<\/td><td>Выделение иттрия<\/td><\/tr><tr><td>ТБФ (трибутилфосфат)<\/td><td>Нейтральный фосфорорганический<\/td><td>Нитратные среды; исторически — выделение церия(IV)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Омыление экстрагента<\/strong> (saponification): кислотный экстрагент частично нейтрализуют (аммиаком, NaOH) для увеличения ёмкости. Аммиачное омыление даёт огромные объёмы <strong>сточных вод с аммонием<\/strong> — экологическая проблема китайских заводов; переходят на натриевое и магниевое омыление и «безомылочные» схемы.<\/p>\n<p><strong>Химические «хитрости» для отдельных элементов:<\/strong><\/p>\n<ul><li><strong>церий<\/strong> окисляют до Ce⁴⁺ — он резко отличается от соседей и легко отделяется;<\/li><li><strong>европий<\/strong> восстанавливают до Eu²⁺ (например, цинком) — он ведёт себя иначе и отделяется осаждением или экстракцией.<\/li><\/ul>\n<p><strong>Типовая логика схемы<\/strong> (упрощённо):<\/p>\n<pre class=\"code\"><code>Смешанный хлорид РЗЭ\n→ разделение на лёгкую и средне-тяжёлую группы (например, по паре Nd/Sm)\n→ лёгкая группа: La | Ce | PrNd (NdPr-оксид — главный продукт для магнитов)\n→ средне-тяжёлая группа: SEG (Sm-Eu-Gd) | Tb | Dy | Ho–Lu | Y\n→ на каждой линии: экстракция → промывка (скруббинг) → реэкстракция\n→ осаждение (оксалаты или карбонаты) → фильтрация → ПРОКАЛКА (~800–1 000 °C) → оксиды<\/code><\/pre>\n<p><strong>Масштаб:<\/strong> на одну пару соседних элементов нужны <strong>десятки ступеней<\/strong>; полный завод — <strong>сотни, а на крупных предприятиях больше тысячи<\/strong> смесителей-отстойников. Запас органики — сотни кубометров (пожароопасность). Выход завода на заданную чистоту после пуска занимает <strong>месяцы<\/strong>: каскад должен «набрать» равновесный профиль концентраций.<\/p>\n<p><strong>Теория каскадов.<\/strong> Китайская школа (основоположник — химик Сюй Гуансянь, разработавший теорию противоточной экстракции РЗЭ в 1970-х) позволила рассчитывать и оптимизировать каскады. Это одна из причин доминирования Китая. Технолог, умеющий <strong>моделировать каскад<\/strong> (балансы по каждому элементу, профили концентраций, отклик на изменение питания), — редчайший специалист.<\/p>\n<h3>1.3 Чистота, продукты, аналитика<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Продукт<\/th><th>Типичная чистота<\/th><th>Ключевые примеси<\/th><\/tr><\/thead><tbody><tr><td>NdPr-оксид<\/td><td>TREO ≥ 99%, соотношение Pr:Nd по спецификации покупателя (часто около 25:75)<\/td><td>Fe, Si, Ca, Al, Cl, SO₄, другие РЗЭ<\/td><\/tr><tr><td>Dy-оксид, Tb-оксид<\/td><td>99,5–99,99% (2N5–4N)<\/td><td>Соседние РЗЭ (Ho, Gd), Fe, Ca<\/td><\/tr><tr><td>La-, Ce-оксиды<\/td><td>99–99,99%<\/td><td>Зависит от применения<\/td><\/tr><tr><td>Оксиды для люминофоров, лазеров, электроники<\/td><td>4N–5N и выше<\/td><td>Соседние РЗЭ на уровне ppm<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Аналитика:<\/strong><\/p>\n<ul><li><strong>ICP-OES и ICP-MS<\/strong> — содержание РЗЭ и примесей; в матрице одного РЗЭ анализ примесей других РЗЭ сложен (спектральные наложения), иногда требует предварительного отделения матрицы;<\/li><li><strong>XRF<\/strong> — быстрый контроль TREO и состава;<\/li><li><strong>газоанализаторы<\/strong> — углерод и сера в оксидах;<\/li><li>быстрая аналитика в ходе процесса — без неё каскадом нельзя управлять.<\/li><\/ul>\n<h3>1.4 Альтернативы экстракции<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Метод<\/th><th>Суть<\/th><th>Статус<\/th><\/tr><\/thead><tbody><tr><td><strong>Ионообменная хроматография<\/strong><\/td><td>Разделение на колоннах со смолами<\/td><td>Исторически — первые чистые РЗЭ (Ames Laboratory, 1940–50-е); сейчас — нишевые высокочистые продукты<\/td><\/tr><tr><td><strong>Хроматография с лигандами<\/strong> (ligand-assisted displacement chromatography)<\/td><td>Метод, разработанный в Purdue University<\/td><td>Коммерциализирует ReElement Technologies (США) — партнёр TMK<\/td><\/tr><tr><td><strong>Молекулярное распознавание<\/strong> (molecular recognition technology)<\/td><td>Высокоселективные лиганды на носителе<\/td><td>Коммерческие проекты (например, IBC Advanced Technologies)<\/td><\/tr><tr><td>Непрерывный ионный обмен<\/td><td>Карусели колонн<\/td><td>Применяется в смежных отраслях, пилоты в РЗЭ<\/td><\/tr><tr><td>Мембранная экстракция, биосорбция, электрохимические методы<\/td><td>Новые подходы<\/td><td>Исследования и пилоты<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Как к этому относиться при подборе:<\/strong> «новые технологии разделения» — зона громких заявлений. Спрашивайте о <strong>непрерывной работе на пилоте<\/strong>, производительности (кг/сутки), чистоте и стоимости, а не о «прорывной химии».<\/p>\n<h3>1.5 Эксплуатация завода разделения<\/h3>\n<ul><li><strong>Управление каскадом<\/strong>: постоянный контроль составов по ступеням, корректировка потоков, реакция на изменение питания.<\/li><li><strong>Межфазные образования (crud), унос органики<\/strong> — постоянные эксплуатационные проблемы; потери экстрагента — прямые деньги.<\/li><li><strong>Пожарная безопасность<\/strong> органики: системы пожаротушения, взрывозащищённое оборудование, процедуры.<\/li><li><strong>Радиационный контроль<\/strong> потоков с торием (если не удалён раньше).<\/li><li><strong>Сточные воды<\/strong>: аммоний, хлориды, остатки органики.<\/li><li><strong>KPI:<\/strong> извлечение по каждому элементу, доля продукта в спецификации, расход реагентов (HCl, NaOH или NH₃, щавелевая кислота) на кг продукта, потери органики, себестоимость $/кг, безопасность.<\/li><\/ul>\n<h3>1.6 Что это значит для TMK [Аналитика]<\/h3>\n<p>На ближайшем горизонте TMK, скорее всего, будет получать <strong>смешанные продукты РЗЭ<\/strong> из растворов (см. День 12). Решение о собственном разделении — отдельный большой шаг, требующий:<\/p>\n<ol><li>объёма сырья, оправдывающего завод;<\/li><li>технологического партнёра (KU Leuven, ReElement и др.);<\/li><li>команды из нескольких ключевых людей: технолог каскадного разделения, специалист по моделированию, начальник экстракционного участка, аналитик, специалист по радиационной безопасности.<\/li><\/ol>\n<p>Рекрутеру стоит <strong>заранее строить карту этих людей<\/strong>, даже если найм через 2–3 года: такие специалисты принимают решение о переходе долго.<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Разделение РЗЭ<\/td><td>Rare earth separation<\/td><td>Получение индивидуальных элементов из смеси<\/td><\/tr><tr><td>Экстракционный каскад<\/td><td>Solvent extraction cascade<\/td><td>Цепочка ступеней экстракции<\/td><\/tr><tr><td>Ступень экстракции<\/td><td>Extraction stage<\/td><td>Один смеситель-отстойник<\/td><\/tr><tr><td>Смеситель-отстойник<\/td><td>Mixer-settler<\/td><td>Основной аппарат завода разделения<\/td><\/tr><tr><td>Противоточная экстракция<\/td><td>Counter-current extraction<\/td><td>Встречное движение фаз через ступени<\/td><\/tr><tr><td>Омыление экстрагента<\/td><td>Saponification<\/td><td>Частичная нейтрализация кислотного экстрагента для роста ёмкости<\/td><\/tr><tr><td>Коэффициент разделения<\/td><td>Separation factor<\/td><td>Мера селективности для пары элементов<\/td><\/tr><tr><td>Лантаноидное сжатие<\/td><td>Lanthanide contraction<\/td><td>Уменьшение радиуса ионов вдоль ряда, причина сходства соседей<\/td><\/tr><tr><td>Групповое разделение<\/td><td>Group separation<\/td><td>Разделение на лёгкую, среднюю, тяжёлую группы<\/td><\/tr><tr><td>Пара разделения<\/td><td>Split / separation pair<\/td><td>Граница разделения двух элементов (например, Nd/Sm)<\/td><\/tr><tr><td>Промывка (скруббинг)<\/td><td>Scrubbing<\/td><td>Удаление примесей из насыщенной органики<\/td><\/tr><tr><td>Реэкстракция<\/td><td>Stripping<\/td><td>Возврат металла из органики в воду<\/td><\/tr><tr><td>Рафинат<\/td><td>Raffinate<\/td><td>Водный поток после экстракции<\/td><\/tr><tr><td>Межфазные образования<\/td><td>Crud<\/td><td>Эмульсионные отложения на границе фаз<\/td><\/tr><tr><td>Унос органики<\/td><td>Organic entrainment<\/td><td>Потери экстрагента с водной фазой<\/td><\/tr><tr><td>Окисление церия<\/td><td>Cerium oxidation (Ce⁴⁺)<\/td><td>Приём для отделения церия<\/td><\/tr><tr><td>Восстановление европия<\/td><td>Europium reduction (Eu²⁺)<\/td><td>Приём для отделения европия<\/td><\/tr><tr><td>Осаждение оксалатов<\/td><td>Oxalate precipitation<\/td><td>Выделение РЗЭ щавелевой кислотой<\/td><\/tr><tr><td>Прокалка<\/td><td>Calcination<\/td><td>Перевод оксалатов или карбонатов в оксиды<\/td><\/tr><tr><td>Индивидуальный оксид<\/td><td>Separated (individual) oxide<\/td><td>Продукт одного РЗЭ заданной чистоты<\/td><\/tr><tr><td>Ионообменная хроматография<\/td><td>Ion exchange chromatography<\/td><td>Разделение на колоннах со смолами<\/td><\/tr><tr><td>Хроматография с лигандами<\/td><td>Ligand-assisted chromatography<\/td><td>Метод разделения, разработанный в Purdue University<\/td><\/tr><tr><td>Моделирование каскада<\/td><td>Cascade modelling<\/td><td>Расчёт балансов и профилей по ступеням<\/td><\/tr><tr><td>Профиль концентраций<\/td><td>Concentration profile<\/td><td>Распределение элементов по ступеням каскада<\/td><\/tr><tr><td>Запас органики<\/td><td>Organic inventory<\/td><td>Объём органической фазы в системе<\/td><\/tr><tr><td>Пожарная безопасность экстракции<\/td><td>SX fire protection<\/td><td>Защита пожароопасной органики<\/td><\/tr><tr><td>Спецификация продукта<\/td><td>Product specification<\/td><td>Требования покупателя к чистоте и примесям<\/td><\/tr><tr><td>Матрица (в анализе)<\/td><td>Matrix<\/td><td>Основной компонент пробы, мешающий анализу примесей<\/td><\/tr><tr><td>Сточные воды с аммонием<\/td><td>Ammonium-bearing wastewater<\/td><td>Экологическая проблема аммиачного омыления<\/td><\/tr><tr><td>Выход каскада на режим<\/td><td>Cascade equilibration<\/td><td>Набор равновесного профиля после пуска<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли завода разделения<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Главный технолог разделения<\/td><td>Head of REE Separation / Chief Process Engineer<\/td><td>Спроектированные или запущенные каскады, чистота, извлечение, масштаб<\/td><td>★★★<\/td><\/tr><tr><td>Технолог каскада<\/td><td>SX Process Engineer (REE)<\/td><td>Какие пары вёл, число ступеней, реакция на сбои<\/td><td>★★★<\/td><\/tr><tr><td>Специалист по моделированию каскадов<\/td><td>Process Modelling Engineer (SX)<\/td><td>Модели балансов, ПО, верификация на реальном заводе<\/td><td>★★★<\/td><\/tr><tr><td>Начальник экстракционного участка<\/td><td>SX Plant Superintendent<\/td><td>Люди, смены, безопасность, потери органики<\/td><td>★★<\/td><\/tr><tr><td>Химик-аналитик РЗЭ<\/td><td>REE Analytical Chemist<\/td><td>ICP-MS в матрицах РЗЭ, методики, скорость анализа<\/td><td>★★<\/td><\/tr><tr><td>Инженер по пожарной безопасности экстракции<\/td><td>Fire Safety Engineer (SX)<\/td><td>Системы защиты, аудит, инциденты<\/td><td>★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Признаки человека, который сам вёл каскад<\/h3>\n<ul><li>называет <strong>конкретные пары<\/strong> разделения и <strong>число ступеней<\/strong> в каждой секции;<\/li><li>говорит о <strong>профиле концентраций<\/strong> и о том, как каскад реагирует на изменение состава питания;<\/li><li>знает, <strong>сколько времени<\/strong> каскад выходил на режим после пуска или остановки;<\/li><li>называет <strong>потери органики<\/strong> в ppm или кг на тонну и меры борьбы с crud;<\/li><li>объясняет <strong>экономику<\/strong>: расход кислоты, щёлочи и щавелевой кислоты на кг продукта;<\/li><li>рассказывает о <strong>конкретном сбое<\/strong> (смешение фаз, пожарная тревога, выход из спецификации) и его разборе.<\/li><\/ul>\n<p><strong>Ловушки для «теоретика»:<\/strong><\/p>\n<ul><li>спросите, <strong>что произойдёт со всеми продуктами каскада<\/strong>, если в питании выросла доля лантана. Практик ответит про смещение профилей и корректировку потоков; теоретик — общими словами;<\/li><li>попросите <strong>нарисовать секцию<\/strong> «экстракция — промывка — реэкстракция» с потоками. Практик рисует уверенно и с числами;<\/li><li>спросите про <strong>омыление<\/strong>: чем, в какой степени, что со сточными водами.<\/li><\/ul>\n<h3>3.3 Где искать<\/h3>\n<ul><li><strong>Lynas<\/strong> (Куантан, Малайзия): самый большой вне Китая пул операторов и инженеров каскадов; англоязычный.<\/li><li><strong>Solvay<\/strong> (Ла-Рошель, Франция): десятилетия опыта разделения; франкоязычная среда.<\/li><li><strong>Neo Performance Materials<\/strong> (Silmet, Силламяэ, Эстония): разделение; многие специалисты говорят по-русски — ценно для TMK.<\/li><li><strong>MP Materials, Energy Fuels<\/strong> (США), <strong>Iluka<\/strong> (Австралия), <strong>Saskatchewan Research Council<\/strong> (Канада), <strong>IREL<\/strong> (Индия).<\/li><li><strong>Наука и технологии:<\/strong> KU Leuven (Solvomet — партнёр TMK), Ames National Laboratory, Purdue University и ReElement Technologies (партнёр TMK), CSIRO, ANSTO.<\/li><li><strong>Китай:<\/strong> главный пул, но запрет экспорта технологий; любой такой найм — только после юридической оценки.<\/li><li><strong>СНГ<\/strong> (с санкционной проверкой): Соликамский магниевый завод, институты Росатома.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Банк вопросов (40 мин).<\/strong> Составьте 12 вопросов для интервью с кандидатом на роль «Технолог экстракционного разделения РЗЭ».<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>№<\/th><th>Вопрос<\/th><th>Что отвечает практик<\/th><th>Ловушка / красный флаг<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p>Требования:<\/p>\n<ul><li>4 вопроса о технологии каскада (пары, ступени, омыление, профиль);<\/li><li>3 — об эксплуатации (crud, потери органики, пожарная безопасность, выход на режим);<\/li><li>2 — о продукте и аналитике (спецификации, ICP-MS в матрице);<\/li><li>2 — о результатах и провалах (цифры «было → стало», разбор сбоя);<\/li><li>1 — об ограничениях на передачу технологий и конфиденциальности.<\/li><\/ul>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какой вопрос из вашего банка лучше всех отделяет практика от теоретика?<\/li><li>Почему карту специалистов по разделению стоит строить за 2–3 года до найма?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 14: металлы РЗЭ, сплавы и магниты».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы знаете о разделении РЗЭ больше, чем большинство менеджеров по найму в отрасли. Используйте это аккуратно: ваша сила — точные вопросы, а не лекции кандидату.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>C. K. Gupta, N. Krishnamurthy, <em>Extractive Metallurgy of Rare Earths<\/em> — главы о разделении.<\/li><li>Обзорные статьи K. Binnemans (KU Leuven) о разделении и переработке РЗЭ.<\/li><li>Материалы Ames National Laboratory (Critical Materials Innovation Hub) и Purdue University о хроматографическом разделении.<\/li><li>Видео: «rare earth solvent extraction plant», «mixer settler operation».<\/li><\/ul>"},{"n":14,"module":3,"title":"Металлы РЗЭ, сплавы и постоянные магниты","file":"module-03-ree-critical-minerals/day-14-ree-metals-alloys-magnets.md","duration":"3,5 часа","challenge":"Сопоставить технологию спечённых магнитов NdFeB с производством твёрдых сплавов в Чирчике и составить <strong>список переносимых навыков<\/strong> — какие специалисты TMK и Smart Powder могли бы со временем работать с магнитами и наоборот.","why":"Магниты — вершина цепочки РЗЭ и главная причина, по которой США, ЕС, Япония и Корея тратят миллиарды на РЗЭ. Технология спечённого магнита — это <strong>порошковая металлургия<\/strong>: порошок, прессование, спекание. Именно эту компетенцию TMK развивает в Чирчике и Smart Powder. Рекрутер, который видит эту связь, находит кандидатов там, где их не ищут конкуренты.","checklist":[{"text":"Разминка: 5 вопросов по Дням 12–13 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: переносимые навыки «твёрдые сплавы ↔ магниты» (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.2, 1.3, 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Металл РЗЭ","en":"Rare earth metal","def":"Металлический Nd, Pr, Dy и др."},{"ru":"Электролиз фторидного расплава","en":"Fluoride molten salt electrolysis","def":"Основной способ получения Nd и Pr"},{"ru":"Кальциетермическое восстановление","en":"Calciothermic reduction","def":"Получение тяжёлых РЗЭ-металлов кальцием"},{"ru":"Лигатура","en":"Master alloy","def":"Сплав-добавка (например, DyFe)"},{"ru":"Постоянный магнит","en":"Permanent magnet","def":"Материал, сохраняющий намагниченность"},{"ru":"Спечённый магнит NdFeB","en":"Sintered NdFeB magnet","def":"Самый массовый мощный магнит"},{"ru":"Связанный магнит","en":"Bonded magnet","d
