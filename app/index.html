ра (т/ч), метры бурения за смену, удельный расход ВВ, <strong>LTIFR / TRIFR<\/strong> (частота травм).<\/p>\n<h3>1.3 Подземные горные работы<\/h3>\n<p><strong>Вскрытие месторождения (access):<\/strong><\/p>\n<ul><li><strong>вертикальный ствол<\/strong> (shaft) с копром (headframe) и подъёмной машиной (hoist): скипы для руды, клети для людей и материалов; многоканатные (Koepe) и барабанные подъёмы;<\/li><li><strong>наклонный съезд / уклон<\/strong> (decline / ramp) — для самоходной техники;<\/li><li><strong>штольня<\/strong> (adit) — горизонтальный вход со склона горы.<\/li><\/ul>\n<p><strong>Подготовительные и нарезные выработки (development):<\/strong> штреки и орты (drifts / drives), квершлаги (crosscuts), восстающие (raises), рудоспуски (ore passes), камеры.<\/p>\n<p><strong>Проходческий цикл:<\/strong> бурение забоя (буровая установка, jumbo) → заряжание → взрыв → проветривание → оборка кровли (scaling) → уборка горной массы (ПДМ, LHD) → крепление (анкеры, сетка, торкрет-бетон) → маркшейдерский замер.<\/p>\n<p><strong>KPI проходки:<\/strong> <strong>метры проходки в месяц<\/strong> (development metres) — главный показатель подземного рудника на стадии подготовки.<\/p>\n<p><strong>Системы разработки<\/strong> (mining methods) — главная классификация, которую нужно знать:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Класс<\/th><th>Система (RU / EN)<\/th><th>Когда применяют<\/th><th>Особенности<\/th><\/tr><\/thead><tbody><tr><td>С открытым очистным пространством<\/td><td><strong>Камерно-столбовая<\/strong> (room and pillar)<\/td><td>Пологие пласты и залежи<\/td><td>Целики оставляют для поддержания кровли — потери руды<\/td><\/tr><tr><td><\/td><td><strong>Подэтажная (камерная) отбойка<\/strong> (sublevel open stoping / long-hole open stoping, LHOS)<\/td><td>Крутые, мощные залежи в устойчивых породах<\/td><td>Высокая производительность; часто с последующей закладкой<\/td><\/tr><tr><td><\/td><td>Магазинирование (shrinkage stoping)<\/td><td>Крутые жилы<\/td><td>Устаревшая, трудоёмкая<\/td><\/tr><tr><td>С закладкой выработанного пространства<\/td><td><strong>Слоевая выемка с закладкой<\/strong> (cut and fill), восходящая или нисходящая<\/td><td>Неправильные, крутые тела; слабые породы; высокоценная руда<\/td><td><strong>Высокая селективность, низкое разубоживание<\/strong>, но дорого<\/td><\/tr><tr><td><\/td><td>Камерная выемка с твердеющей (пастовой) закладкой (stoping with paste fill)<\/td><td>Ценные руды, нужно минимизировать потери<\/td><td>Нужна закладочная фабрика<\/td><\/tr><tr><td>С обрушением<\/td><td><strong>Подэтажное обрушение<\/strong> (sublevel caving)<\/td><td>Мощные крутые тела<\/td><td>Кируна (LKAB). Разубоживание выше<\/td><\/tr><tr><td><\/td><td><strong>Блоковое (панельное) обрушение<\/strong> (block / panel caving)<\/td><td>Огромные тела с низким содержанием<\/td><td>Самая низкая себестоимость тонны под землёй, но гигантские CAPEX и годы подготовки. Грасберг, Оюу-Толгой, Кадия<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Для вольфрамовых скарнов<\/strong> (неправильные крутые залежи с изменчивым содержанием) типичны селективные системы: подэтажная отбойка с закладкой, слоевая выемка с закладкой. Крупные скарновые вольфрамовые месторождения (Сандон в Корее, Кантунг в Канаде, исторически Ингичка и Койташ) отрабатывались или отрабатываются подземным способом. Ключевые проблемы — <strong>разубоживание<\/strong> и <strong>потери<\/strong> руды. Конкретный способ отработки нового комплекса TMK уточните у компании.<\/p>\n<p><strong>Крепление и геомеханика<\/strong> (ground support / geomechanics):<\/p>\n<ul><li>анкеры: фрикционные (split sets), сталеполимерные (resin rebar), канатные (cable bolts);<\/li><li>сетка, торкрет-бетон (shotcrete), арочная крепь;<\/li><li>рейтинговые классификации массивов <strong>RMR<\/strong> (Bieniawski) и <strong>Q<\/strong> (Barton);<\/li><li>на глубоких рудниках — горные удары и сейсмичность.<\/li><\/ul>\n<p><strong>Вентиляция:<\/strong> главные вентиляторные установки, вентиляторы местного проветривания, расчёт воздуха под дизельную технику, охлаждение глубоких рудников, «вентиляция по потребности» (ventilation on demand). Аккумуляторная техника (BEV) снижает потребность в воздухе — тренд последних лет.<\/p>\n<p><strong>Закладка<\/strong> (backfill): гидравлическая, твердеющая из породы и цемента (cemented rock fill), <strong>пастовая<\/strong> (paste fill: хвосты обогащения + 3–8% цемента). Плюсы: меньше хвостов на поверхности, выше извлечение руды из недр.<\/p>\n<p><strong>Безопасность:<\/strong> водоотлив (dewatering), энергоснабжение, связь и позиционирование людей под землёй, <strong>самоспасатели и камеры-убежища<\/strong> (self-rescuers, refuge chambers), газовый контроль, <strong>горноспасательная служба<\/strong> (в СНГ — ВГСЧ; mine rescue).<\/p>\n<p><strong>KPI подземных работ:<\/strong> метры проходки в месяц, добыча из очистных блоков, <strong>разубоживание и потери (%)<\/strong>, производительность ПДМ (т/ч), производительность труда (т на человеко-смену), себестоимость ($/т), LTIFR / TRIFR.<\/p>\n<h3>1.4 Другие способы добычи<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Способ<\/th><th>Суть<\/th><th>Где применяется<\/th><th>Связь с TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>Скважинное подземное выщелачивание<\/strong> (СПВ; in-situ recovery, ISR)<\/td><td>Через закачные скважины подают раствор (обычно серной кислоты), через откачные поднимают продуктивный раствор. Руду не вынимают<\/td><td>Уран Узбекистана и Казахстана<\/td><td>Растворы содержат рений и РЗЭ → проект TMK с Solvomet. Нужны <strong>геотехнологи СПВ<\/strong>, гидрогеологи, специалисты по сорбции<\/td><\/tr><tr><td>Добыча рассолов<\/td><td>Скважины + испарительные бассейны или прямое извлечение лития (DLE)<\/td><td>Литий Южной Америки и Китая<\/td><td>Литиевые проекты (по запросу)<\/td><\/tr><tr><td>Россыпная добыча<\/td><td>Драги, гидромониторы<\/td><td>Золото, олово, минеральные пески<\/td><td>—<\/td><\/tr><tr><td>Кучное выщелачивание<\/td><td>Руду складывают в штабель и орошают раствором<\/td><td>Золото, медь<\/td><td>См. День 8<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.5 Горное оборудование: карта для рекрутера<\/h3>\n<p><strong>Открытые работы:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Категория<\/th><th>Назначение<\/th><th>Производители (мировые / СНГ / Китай)<\/th><th>Кто работает с ним<\/th><\/tr><\/thead><tbody><tr><td>Буровые станки шарошечного и ударного бурения<\/td><td>Взрывные скважины<\/td><td>Epiroc (Pit Viper), Sandvik, Caterpillar; в СНГ — станки СБШ<\/td><td>Машинисты, инженер БВР, механики<\/td><\/tr><tr><td>Экскаваторы<\/td><td>Погрузка горной массы<\/td><td>Komatsu, Liebherr, Hitachi, Caterpillar; ИЗ-КАРТЭКС и Уралмашзавод (ЭКГ); XCMG, SANY<\/td><td>Машинисты, механики, электрики (ЭКГ — электрические машины)<\/td><\/tr><tr><td>Карьерные самосвалы<\/td><td>Транспорт<\/td><td>Caterpillar, Komatsu, Liebherr, Hitachi; <strong>БелАЗ<\/strong>; XCMG, SANY<\/td><td>Водители, механики, диспетчеры<\/td><\/tr><tr><td>Бульдозеры, грейдеры, погрузчики<\/td><td>Вспомогательные работы<\/td><td>Caterpillar, Komatsu, Liebherr; ЧТЗ (Россия); Shantui (Китай)<\/td><td>—<\/td><\/tr><tr><td>Системы управления и автономности<\/td><td>Диспетчеризация, автономная откатка<\/td><td>Modular Mining (Komatsu), Wenco (Hitachi), Cat MineStar, Hexagon<\/td><td>Инженеры АСУ, диспетчеры, аналитики данных<\/td><\/tr><tr><td>ПО для планирования<\/td><td>Проектирование и планирование<\/td><td>Deswik, Datamine, Maptek Vulcan, GEOVIA (Whittle, Surpac), Micromine, Hexagon MinePlan<\/td><td>Горные инженеры-плановики<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Подземные работы:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Категория<\/th><th>Назначение<\/th><th>Производители<\/th><th>Кто работает с ним<\/th><\/tr><\/thead><tbody><tr><td>Буровые установки для проходки (jumbo)<\/td><td>Бурение забоев<\/td><td>Sandvik, Epiroc (Boomer)<\/td><td>Машинисты, механики<\/td><\/tr><tr><td>Установки глубокого (веерного) бурения<\/td><td>Отбойка в очистных блоках<\/td><td>Sandvik, Epiroc (Simba)<\/td><td>—<\/td><\/tr><tr><td><strong>ПДМ — погрузочно-доставочные машины<\/strong> (LHD)<\/td><td>Погрузка и доставка руды<\/td><td>Sandvik, Epiroc (Scooptram), Caterpillar<\/td><td>Машинисты, механики; дистанционное управление (Sandvik AutoMine)<\/td><\/tr><tr><td>Подземные самосвалы<\/td><td>Транспорт<\/td><td>Sandvik, Epiroc (Minetruck)<\/td><td>—<\/td><\/tr><tr><td>Анкероустановщики, торкрет-машины, зарядные машины<\/td><td>Крепление, заряжание<\/td><td>Sandvik, Epiroc, <strong>Normet<\/strong><\/td><td>—<\/td><\/tr><tr><td>Подъёмные машины, вентиляторы, насосы<\/td><td>Стационарная инфраструктура<\/td><td>ABB, Siemens, FLSmidth и др.<\/td><td>Главный механик, главный энергетик<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Кто ещё влияет на найм:<\/strong> <strong>подрядчики подземных работ<\/strong> (contract mining) — Redpath, Byrnecut, Barminco (Perenti), Murray &amp; Roberts Cementation, Thiess, Macmahon. Многие рудники отдают проходку подрядчикам. Это большой пул опытных начальников участков и проходчиков.<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Открытые горные работы<\/td><td>Open pit mining / surface mining<\/td><td>Добыча с поверхности, карьером<\/td><\/tr><tr><td>Подземные горные работы<\/td><td>Underground mining<\/td><td>Добыча через подземные выработки<\/td><\/tr><tr><td>Карьер<\/td><td>Open pit<\/td><td>Горная выработка открытой добычи<\/td><\/tr><tr><td>Уступ<\/td><td>Bench<\/td><td>Ступень борта карьера<\/td><\/tr><tr><td>Борт карьера<\/td><td>Pit wall<\/td><td>Боковая поверхность карьера<\/td><\/tr><tr><td>Съезд<\/td><td>Ramp<\/td><td>Транспортный подъём в карьере<\/td><\/tr><tr><td>Отвал<\/td><td>Waste dump<\/td><td>Место складирования пустой породы<\/td><\/tr><tr><td>Вскрыша<\/td><td>Overburden / waste stripping<\/td><td>Удаление пустой породы над рудой<\/td><\/tr><tr><td>Коэффициент вскрыши<\/td><td>Stripping ratio<\/td><td>Пустая порода на тонну руды<\/td><\/tr><tr><td>Буровзрывные работы (БВР)<\/td><td>Drill and blast<\/td><td>Бурение скважин и взрывание<\/td><\/tr><tr><td>Удельный расход ВВ<\/td><td>Powder factor<\/td><td>Килограммы ВВ на кубометр или тонну<\/td><\/tr><tr><td>Дробление взрывом<\/td><td>Fragmentation<\/td><td>Крупность горной массы после взрыва<\/td><\/tr><tr><td>Карьерный самосвал<\/td><td>Haul truck<\/td><td>Большегрузный самосвал для карьера<\/td><\/tr><tr><td>Экскаватор (мехлопата)<\/td><td>Shovel / excavator<\/td><td>Машина для погрузки горной массы<\/td><\/tr><tr><td>Коэффициент технической готовности<\/td><td>Availability<\/td><td>Доля времени, когда машина исправна<\/td><\/tr><tr><td>Коэффициент использования<\/td><td>Utilization<\/td><td>Доля исправного времени, когда машина реально работает<\/td><\/tr><tr><td>Вертикальный ствол<\/td><td>Shaft<\/td><td>Вертикальная выработка с поверхности<\/td><\/tr><tr><td>Наклонный съезд (уклон)<\/td><td>Decline<\/td><td>Наклонная выработка для самоходной техники<\/td><\/tr><tr><td>Штольня<\/td><td>Adit<\/td><td>Горизонтальная выработка с поверхности<\/td><\/tr><tr><td>Проходка<\/td><td>Development<\/td><td>Сооружение подземных выработок<\/td><\/tr><tr><td>Очистная выемка<\/td><td>Stoping / production mining<\/td><td>Извлечение руды из блоков<\/td><\/tr><tr><td>Система разработки<\/td><td>Mining method<\/td><td>Способ подготовки и выемки руды<\/td><\/tr><tr><td>Слоевая выемка с закладкой<\/td><td>Cut and fill<\/td><td>Селективная система с заполнением пустот<\/td><\/tr><tr><td>Подэтажная отбойка<\/td><td>Sublevel open stoping / long-hole stoping<\/td><td>Высокопроизводительная система для крутых тел<\/td><\/tr><tr><td>Блоковое обрушение<\/td><td>Block caving<\/td><td>Массовая система с обрушением руды<\/td><\/tr><tr><td>Закладка<\/td><td>Backfill / paste fill<\/td><td>Заполнение выработанного пространства<\/td><\/tr><tr><td>Погрузочно-доставочная машина (ПДМ)<\/td><td>LHD (load-haul-dump)<\/td><td>Подземный погрузчик<\/td><\/tr><tr><td>Анкерное крепление<\/td><td>Rock bolting<\/td><td>Крепление выработок анкерами<\/td><\/tr><tr><td>Торкрет-бетон<\/td><td>Shotcrete<\/td><td>Набрызг-бетон для крепления<\/td><\/tr><tr><td>Вентиляция<\/td><td>Ventilation<\/td><td>Проветривание подземных выработок<\/td><\/tr><tr><td>Водоотлив<\/td><td>Dewatering<\/td><td>Откачка воды из рудника<\/td><\/tr><tr><td>Скважинное подземное выщелачивание (СПВ)<\/td><td>In-situ recovery (ISR) / in-situ leaching<\/td><td>Добыча через скважины растворами без выемки руды<\/td><\/tr><tr><td>Управление качеством руды<\/td><td>Grade control<\/td><td>Контроль содержания при добыче<\/td><\/tr><tr><td>Горноспасательная служба<\/td><td>Mine rescue<\/td><td>Аварийно-спасательные подразделения<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Горные роли и их западные аналоги<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Зона ответственности<\/th><th>Маркеры масштаба в резюме<\/th><\/tr><\/thead><tbody><tr><td>Директор / начальник рудника<\/td><td>Mine Manager / Mine General Manager<\/td><td>Весь рудник: производство, безопасность, люди, бюджет<\/td><td>Млн т/год, численность, бюджет, способ добычи<\/td><\/tr><tr><td>Начальник карьера / подземного участка<\/td><td>Mining Superintendent / Underground Superintendent<\/td><td>Производство на участке<\/td><td>Т/сутки, метры проходки, техника<\/td><\/tr><tr><td>Горный инженер-плановик (ПТО)<\/td><td>Mine Planning Engineer (long-term / short-term)<\/td><td>Планы горных работ<\/td><td>ПО, горизонт планирования, тип рудника<\/td><\/tr><tr><td>Инженер по БВР<\/td><td>Drill &amp; Blast Engineer<\/td><td>Паспорта БВР, дробление, безопасность взрывных работ<\/td><td>Объёмы ВВ, mine-to-mill проекты<\/td><\/tr><tr><td>Геомеханик<\/td><td>Geotechnical Engineer<\/td><td>Устойчивость бортов и выработок, крепление<\/td><td>Мониторинг, тип массивов, горные удары<\/td><\/tr><tr><td>Инженер по вентиляции<\/td><td>Ventilation Engineer<\/td><td>Проветривание, газовый режим<\/td><td>ПО (Ventsim), глубина и масштаб рудника<\/td><\/tr><tr><td>Маркшейдер<\/td><td>Mine Surveyor<\/td><td>Съёмка, учёт объёмов, контроль контуров, деформации<\/td><td>Методы (лазерное сканирование, дроны)<\/td><\/tr><tr><td>Горный мастер<\/td><td>Shift Supervisor / Shift Boss / Foreman<\/td><td>Смена: люди, безопасность, план<\/td><td>Численность смены<\/td><\/tr><tr><td>Механик горного оборудования<\/td><td>Mobile Maintenance Supervisor / Fleet Maintenance<\/td><td>Обслуживание техники<\/td><td>Парк (марки, количество), KPI готовности<\/td><\/tr><tr><td>Геотехнолог СПВ<\/td><td>ISR Wellfield Engineer / Geotechnologist<\/td><td>Полигон скважин, режимы закачки и откачки<\/td><td>Количество скважин, продуктивность растворов<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Как читать опыт горняка<\/h3>\n<ol><li><strong>Способ добычи совпадает?<\/strong> Открытые работы ≠ подземные. Переход возможен, но для руководителя это риск.<\/li><li><strong>Система разработки совпадает?<\/strong> Блоковое обрушение и слоевая выемка с закладкой — разные миры. Для вольфрамовых скарнов ищите селективные системы и закладку.<\/li><li><strong>Масштаб совпадает?<\/strong> 100 тыс. т/год и 10 млн т/год требуют разных навыков.<\/li><li><strong>Стадия совпадает?<\/strong> Строительство рудника и проходка ≠ стабильная эксплуатация ≠ оптимизация ≠ вывод из кризиса.<\/li><li><strong>Техника совпадает?<\/strong> Опыт с БелАЗами и ЭКГ ценен для СНГ, опыт с автономной техникой — для модернизации.<\/li><\/ol>\n<h3>3.3 Вопросы для скрининга начальника рудника<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Какая система разработки была на руднике и почему именно она?»<\/td><td>Связывает выбор с геологией, геомеханикой и экономикой<\/td><td>Называет систему, но не может объяснить выбор<\/td><\/tr><tr><td>«Какое было разубоживание? Что вы делали, чтобы его снизить?»<\/td><td>Цифры «было / стало», конкретные меры (паспорта БВР, контроль контуров, обучение)<\/td><td>«Нормальное», без цифр<\/td><\/tr><tr><td>«Сколько метров проходки в месяц вы выполняли? Какие были узкие места?»<\/td><td>Цифры, анализ цикла, решения<\/td><td>Не знает цифр проходки<\/td><\/tr><tr><td>«Опишите серьёзный инцидент по безопасности и что изменилось после него»<\/td><td>Честный разбор, системные изменения<\/td><td>«У нас инцидентов не было» — либо неправда, либо не его зона<\/td><\/tr><tr><td>«Как вы работали с обогатительной фабрикой по качеству руды?»<\/td><td>Знает связку дробления и содержания с извлечением; совместные KPI<\/td><td>«Это проблемы фабрики»<\/td><\/tr><tr><td>«Какой у вас был парк техники и коэффициент готовности?»<\/td><td>Марки, количество, % готовности, меры по повышению<\/td><td>Не знает показателей техники<\/td><\/tr><tr><td>«Работали ли вы с подрядчиками на проходке? Как управляли ими?»<\/td><td>Контракт, KPI, конфликты и решения<\/td><td>Только «контролировал»<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (20 мин). Видео.<\/strong> Посмотрите анимации на YouTube по запросам: «sublevel open stoping animation», «cut and fill mining method», «block caving explained», «open pit mining process». Нарисуйте от руки схемы двух систем разработки. Подпишите выработки по-русски и по-английски.<\/p>\n<p><strong>Задание 2 (30 мин). Профиль позиции.<\/strong> «Начальник подземного рудника, вольфрамовый скарновый рудник, проектная мощность — 0,5–1 млн т руды в год, стадия — подготовка к пуску». Заполните:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Блок<\/th><th>Содержание<\/th><\/tr><\/thead><tbody><tr><td>Must-have (4–5 пунктов)<\/td><td>Например: подземные работы с селективной системой разработки ≥ 5 лет, руководство участком или рудником ≥ 3 лет…<\/td><\/tr><tr><td>Nice-to-have (3–4 пункта)<\/td><td>Например: опыт пуска нового рудника, вольфрам или скарны, английский язык…<\/td><\/tr><tr><td>Компании-доноры (8–10)<\/td><td>Используйте материалы Дня 1 и этого дня<\/td><\/tr><tr><td>Красные флаги (3–4)<\/td><td><\/td><\/tr><tr><td>10 скрининговых вопросов с маркерами сильного ответа<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Назовите три вопроса, которые вы теперь зададите любому кандидату-горняку на первом звонке.<\/li><li>Какие три компании-подрядчика подземных работ вы добавите в карту доноров?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ я прохожу День 5 и итоговую проверку модуля».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> завтра — финал первого модуля. Финал отличает тех, кто «начинал учиться», от тех, кто доводит дело до конца. Вы в шаге от первого рубежа.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li><em>SME Mining Engineering Handbook<\/em> (SME) — главный справочник горного инженера.<\/li><li>W. Hustrulid, M. Kuchta, R. Martin, <em>Open Pit Mine Planning and Design<\/em>.<\/li><li>W. Hustrulid, R. Bullock (ed.), <em>Underground Mining Methods: Engineering Fundamentals and International Case Studies<\/em> (SME).<\/li><li>Ржевский В. В. «Открытые горные работы» — классика советской школы.<\/li><li>Отраслевые медиа по технике: International Mining (<a href=\"https://im-mining.com\" target=\"_blank\" rel=\"noopener\">im-mining.com<\/a>), Mining Magazine.<\/li><li>YouTube-каналы производителей: Epiroc, Sandvik Mining and Rock Solutions, Komatsu Mining, Caterpillar, Normet — анимации техники и процессов.<\/li><\/ul>"},{"n":5,"module":1,"title":"Как устроено горное предприятие: жизненный цикл, структура, карта ролей","file":"module-01-mining-fundamentals/day-05-mine-lifecycle-organization-roles.md","duration":"3,5–4 часа","challenge":"Кейс «TMK запускает вольфрамовый горнорудный комплекс». Нужно сделать оргструктуру, план волн найма и профили трёх ключевых позиций, а затем пройти итоговый тест модуля.","why":"У TMK в плане более сотни проектов. Каждый проходит путь «разведка → исследования → стройка → пуск → эксплуатация», и на каждой стадии нужны <strong>разные люди в разное время<\/strong>. Рекрутер, который мыслит стадиями проекта, приходит к нанимающему менеджеру с планом найма до того, как горит позиция. Так рекрутер из исполнителя заявок становится партнёром по бизнесу.","checklist":[{"text":"Разминка: 5 вопросов по Дням 1–4 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: сопоставление должностей, уровни, архетипы (35 мин)","minutes":35},{"text":"Кейс-финал модуля (45 мин)","minutes":45},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Итоговый тест модуля 1 ≥ 16/20 — см. <a href=\"#module-1\">README модуля<\/a> (20 мин)","minutes":20},{"text":"Teach-back: 10 минут объясняете коллеге или руководителю, как устроено горное предприятие","minutes":0},{"text":"Рефлексия (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.4 → тест дня. Кейс и итоговый тест модуля — обязательно в ближайший выходной, до начала Модуля 2.","terms":[{"ru":"Жизненный цикл рудника","en":"Mine life cycle","def":"Стадии от разведки до закрытия"},{"ru":"Стадийные ворота","en":"Stage-gate","def":"Формальные решения о переходе проекта на следующую стадию"},{"ru":"Решение об инвестициях","en":"Final investment decision (FID)","def":"Решение строить"},{"ru":"Подготовка к эксплуатации","en":"Operational readiness","def":"Найм, обучение и системы до пуска"},{"ru":"Пусконаладка","en":"Commissioning","def":"Проверка и запуск оборудования и систем"},{"ru":"Выход на проектную мощность","en":"Ramp-up","def":"Период от пуска до проектных показателей"},{"ru":"Проектная (паспортная) мощность","en":"Nameplate capacity","def":"Производительность по проекту"},{"ru":"Строительство под ключ","en":"EPC (Engineering, Procurement, Construction)","def":"Подрядчик отвечает за проектирование, закупки и стройку"},{"ru":"Управление проектом от имени владельца","en":"EPCM","def":"Инжиниринговая компания управляет стройкой, риск у владельца"},{"ru":"Команда владельца","en":"Owner's team","def":"Сотрудники заказчика на проекте"},{"ru":"Управление стоимостью и сроками","en":"Project controls","def":"Планирование, контроль бюджета и графика"},{"ru":"Оценка воздействия на окружающую среду (ОВОС)","en":"Environmental and social impact assessment (ESIA)","def":"Обязательная экологическая и социальная оценка проекта"},{"ru":"Рекультивация","en":"Rehabilitation / reclamation","def":"Восстановление земель после горных работ"},{"ru":"Закрытие рудника","en":"Mine closure","def":"Прекращение работ и приведение площадки в безопасное состояние"},{"ru":"Главный инженер","en":"Technical Director / Chief Operating Engineer (по смыслу)","def":"В СНГ — первый заместитель по производству и технологии"},{"ru":"Производственно-технический отдел (ПТО)","en":"Technical Services Department","def":"Планирование, проектная и техническая документация"},{"ru":"Главный механик","en":"Head of Maintenance / Chief Mechanical Engineer","def":"Руководитель службы ТОиР"},{"ru":"Главный энергетик","en":"Head of Electrical / Chief Power Engineer","def":"Руководитель энергослужбы"},{"ru":"Начальник цеха","en":"Area Manager / Superintendent","def":"Руководитель производственного подразделения"},{"ru":"Сменный мастер","en":"Shift Supervisor / Foreman","def":"Руководитель смены"},{"ru":"ИТР","en":"Engineering and technical staff","def":"Инженеры, техники, линейные руководители"},{"ru":"Техническое обслуживание и ремонт (ТОиР)","en":"Maintenance","def":"Обслуживание и ремонт оборудования"},{"ru":"Планово-предупредительный ремонт (ППР)","en":"Preventive maintenance","def":"Ремонты по графику до отказа"},{"ru":"Наработка на отказ","en":"MTBF (mean time between failures)","def":"Средняя наработка между отказами"},{"ru":"Вахтовый метод","en":"FIFO (fly-in fly-out) / rotation","def":"Работа сменами с проживанием у объекта"},{"ru":"Председатель правления","en":"Chairman of the Management Board (≈ CEO)","def":"Первое лицо исполнительного органа АО"}],"quiz":[{"q":"Что такое Operational Readiness?","options":["Сертификация оборудования","Найм, обучение и подготовка систем эксплуатации до пуска проекта","Экологическое разрешение","Финансовая готовность проекта"],"answer":1,"explain":"Операционную команду и системы (ТОиР, лаборатория, охрана труда, снабжение) готовят до пуска. Иначе выход на мощность затягивается."},{"q":"Как корректнее перевести «главный инженер комбината» в западный оффер?","options":["Chief Engineer","Senior Engineer","Engineering Intern","Technical Director / Deputy General Manager — Technical (по фактической зоне ответственности)"],"answer":3,"explain":"В СНГ главный инженер — первый заместитель по производству и технологии. «Chief Engineer» на Западе обычно эксперт, а не руководитель предприятия уровня заместителя директора."},{"q":"Кто на западном руднике обычно называется «metallurgist»?","options":["Металлург-плавильщик","Геолог","Технолог-обогатитель на фабрике","Механик"],"answer":2,"explain":"На горнодобывающих предприятиях «plant metallurgist» — специалист по обогащению. Это частая ловушка при переводе резюме."},{"q":"В модели EPCM риск перерасхода стоимости в основном несёт:","options":["EPCM-подрядчик","Банк","Поставщик оборудования","Владелец проекта"],"answer":3,"explain":"EPCM управляет проектом от имени владельца. Поэтому владельцу нужна сильная собственная команда: директор проекта, project controls, контракты."},{"q":"Что показывают «кривые МакНалти»?","options":["Динамику цен на металлы","Что проекты с новой или сложной технологией часто дольше и хуже выходят на проектную мощность","Рост численности персонала","Кривую затрат отрасли"],"answer":1,"explain":"Отсюда кадровый вывод: для пуска сложных переделов (гидрометаллургия, РЗЭ, APT) нужны люди с опытом пуска похожих установок."},{"q":"Какой KPI относится к службе ТОиР?","options":["MTBF — средняя наработка на отказ","Коэффициент вскрыши","Извлечение металла","Цена APT"],"answer":0,"explain":"MTBF, MTTR, готовность оборудования, доля плановых работ — ключевые KPI ремонтной службы."},{"q":"Правильный способ сопоставления должностей кандидатов из разных систем:","options":["По названию должности","По размеру зарплаты","По количеству лет опыта","По масштабу (люди, бюджет, тонны), подчинённости и зоне ответственности"],"answer":3,"explain":"Названия обманывают. «Начальник цеха» в СНГ может руководить большим подразделением, чем западный «superintendent», а может и меньшим."},{"q":"Для какой стадии TMK особенно ценен архетип «пусковик»?","options":["Только для геологоразведки","Для закрытия рудника","Для новых гидрометаллургических и порошковых производств, которые предстоит вывести на проектные показатели","Для бухгалтерии"],"answer":2,"explain":"Вывод новых установок на проектные показатели — отдельная компетенция, и на рынке она редкая."},{"q":"Председатель правления АО в Узбекистане по западной терминологии ближе всего к:","options":["CEO — первое лицо исполнительного органа","Chairman of the Board (председатель совета директоров)","CFO","Corporate Secretary"],"answer":0,"explain":"Правление — исполнительный орган. Председатель наблюдательного совета — другое лицо и другая роль."},{"q":"Когда обычно нанимают главного механика для нового рудника?","options":["После пуска, когда начнутся поломки","За 12–18 месяцев до пуска, чтобы участвовать в приёмке оборудования, системах ТОиР и закупке запчастей","Через год после пуска","Не нужен, если оборудование новое"],"answer":1,"explain":"Главный механик должен построить систему ТОиР, обеспечить запас критических запчастей и принять оборудование до пуска."}],"html":"<h2>0. Разминка: вспомнить Дни 1–4<\/h2>\n<ol><li>Назовите три системы подземной разработки и когда каждая применяется.<\/li><li>Что такое availability и utilization и кто за что отвечает?<\/li><li>Чем PFS отличается от FS по точности и назначению?<\/li><li>Где в мире самый большой пул Competent Persons по JORC?<\/li><li>Почему вольфрамовые скарны чаще отрабатывают селективными системами?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Например: слоевая выемка с закладкой (неправильные ценные тела), подэтажная отбойка (крутые мощные тела в устойчивых породах), блоковое обрушение (огромные бедные тела).<\/li><li>Availability — доля времени, когда техника исправна (ремонтная служба). Utilization — доля исправного времени в работе (производство).<\/li><li>PFS — ±20–25%, выбор варианта проекта. FS — ±10–15%, основа для решения об инвестициях и финансирования.<\/li><li>Австралия.<\/li><li>Залежи неправильной формы с изменчивым содержанием: важно минимизировать разубоживание и потери ценной руды.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Жизненный цикл горного проекта и «кадровая кривая»<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Стадия<\/th><th>Длительность (ориентир)<\/th><th>Ключевые решения<\/th><th>Кто нужен<\/th><th>Численность команды владельца<\/th><\/tr><\/thead><tbody><tr><td><strong>Разведка<\/strong><\/td><td>2–10+ лет<\/td><td>Есть ли месторождение<\/td><td>Геологи, геофизики, буровики<\/td><td>Единицы–десятки<\/td><\/tr><tr><td><strong>Исследования<\/strong> (PEA → PFS → FS)<\/td><td>2–5 лет<\/td><td>Метод добычи, технология, мощность, CAPEX<\/td><td>Менеджер исследований, ресурсники, горные инженеры, технологи (испытания), экологи, экономисты<\/td><td>10–50 + консультанты<\/td><\/tr><tr><td><strong>Разрешения и финансирование<\/strong><\/td><td>1–3 года (параллельно)<\/td><td>ОВОС, лицензии, кредиты, офтейк<\/td><td>Экологи, юристы, финансисты, специалисты по работе с сообществами<\/td><td>—<\/td><\/tr><tr><td><strong>Строительство<\/strong> (EPC/EPCM)<\/td><td>2–4 года<\/td><td>Бюджет, сроки, качество<\/td><td>Директор проекта, project controls, закупки и контракты, менеджеры по зонам строительства, охрана труда<\/td><td>Команда владельца — десятки–сотни; у подрядчиков на пике — тысячи<\/td><\/tr><tr><td><strong>Пусконаладка и выход на мощность<\/strong><\/td><td>0,5–3 года<\/td><td>Достижение проектных показателей<\/td><td>Руководитель пусконаладки, <strong>операционная команда, нанятая заранее<\/strong>, технологи с опытом пуска<\/td><td>Сотни<\/td><\/tr><tr><td><strong>Эксплуатация<\/strong><\/td><td>10–50+ лет<\/td><td>Оптимизация, расширение<\/td><td>Полная операционная структура<\/td><td>Сотни–тысячи<\/td><\/tr><tr><td><strong>Закрытие и рекультивация<\/strong><\/td><td>Годы–десятилетия<\/td><td>Безопасность, экология<\/td><td>Специалисты по закрытию и рекультивации<\/td><td>Десятки<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ключевые понятия:<\/strong><\/p>\n<ul><li><strong>Stage-gate<\/strong> (стадийные ворота) — проект переходит на следующую стадию только после формального решения. Каждый gate — триггер найма.<\/li><li><strong>Operational Readiness<\/strong> (подготовка к эксплуатации) — найм, обучение и подготовка систем <strong>до<\/strong> пуска. Ключевых операционных руководителей обычно нанимают за 12–18 месяцев до пуска, операторов — за 3–9 месяцев (ориентиры, зависят от проекта).<\/li><li><strong>Ramp-up<\/strong> (выход на проектную мощность). Новые технологии, особенно гидрометаллургические, выходят на мощность дольше и хуже. Это описывают «кривые МакНалти» (McNulty, 1998): проекты с новой или сложной технологией часто выходят на мощность годами, а некоторые не выходят никогда. Главный кадровый вывод: <strong>на пуск сложных переделов нужны люди, которые уже пускали похожие установки.<\/strong><\/li><\/ul>\n<blockquote><p><strong>TMK:<\/strong> у компании одновременно десятки проектов на разных стадиях. Значит, нужен <strong>план волн найма<\/strong>: кто нужен под какой проект и к какому сроку. Попросите у проектного офиса график stage-gate по проектам. Это ваш главный инструмент планирования.<\/p><\/blockquote>\n<h3>1.2 Как строят проекты: EPC, EPCM, владелец<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Модель<\/th><th>Суть<\/th><th>Риск стоимости<\/th><th>Кто нужен владельцу<\/th><\/tr><\/thead><tbody><tr><td><strong>EPC<\/strong> (под ключ)<\/td><td>Подрядчик проектирует, закупает и строит за фиксированную цену<\/td><td>В основном у подрядчика<\/td><td>Сильная команда контроля качества, приёмки и контрактов<\/td><\/tr><tr><td><strong>EPCM<\/strong><\/td><td>Инжиниринговая компания проектирует и управляет стройкой <strong>от имени владельца<\/strong><\/td><td>У владельца<\/td><td>Сильная команда владельца: директор проекта, project controls, интерфейсы<\/td><\/tr><tr><td><strong>Owner-managed<\/strong><\/td><td>Владелец управляет сам<\/td><td>У владельца<\/td><td>Полноценный проектный офис<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Роли проектной команды:<\/strong> директор проекта (Project Director), руководитель проекта (Project Manager), главный инженер проекта (Engineering Manager), руководитель строительства (Construction Manager), <strong>project controls<\/strong> (управление стоимостью и сроками; ПО Primavera P6), руководитель закупок и контрактов, руководитель пусконаладки (Commissioning Manager), менеджер по интерфейсам (Interface Manager), менеджер по охране труда.<\/p>\n<p><strong>Контекст Центральной Азии:<\/strong> крупные проекты часто строят китайские, турецкие и российские подрядчики. Поэтому ценится опыт <strong>управления иностранными подрядчиками<\/strong>: контракты (FIDIC), приёмка, документация, языковые и культурные интерфейсы.<\/p>\n<h3>1.3 Западная структура действующего рудника<\/h3>\n<pre class=\"code\"><code>CEO / Managing Director\n└── COO / Executive VP Operations\n    └── General Manager (Site) — директор предприятия\n        ├── Mining Manager — горное производство\n        │   ├── Mining Superintendent (карьер / подземка)\n        │   ├── Technical Services: Mine Planning, Geology, Geotechnical, Survey\n        │   └── Drill &amp; Blast\n        ├── Processing Manager — фабрика\n        │   ├── Plant Superintendent / Production\n        │   ├── Metallurgy (Senior Metallurgist, Plant Metallurgists)\n        │   └── Laboratory\n        ├── Maintenance Manager — ТОиР\n        │   ├── Mobile Maintenance (горная техника)\n        │   ├── Fixed Plant Maintenance (фабрика)\n        │   ├── Reliability &amp; Planning\n        │   └── Electrical / Instrumentation\n        ├── HSE Manager — охрана труда, промбезопасность, экология\n        ├── HR, Training\n        ├── Supply Chain — снабжение и склады\n        ├── Finance\n        └── Community &amp; Government Relations<\/code><\/pre>\n<h3>1.4 Структура комбината в традиции СНГ<\/h3>\n<pre class=\"code\"><code>Председатель правления / Генеральный директор\n├── Первый заместитель\n├── Главный инженер (технический директор) — производство, технология, промбезопасность\n│   ├── Производственно-технический отдел (ПТО)\n│   ├── Служба главного геолога\n│   ├── Служба главного маркшейдера\n│   ├── Отдел главного механика (ОГМ)\n│   ├── Отдел главного энергетика (ОГЭ)\n│   ├── Технологический отдел / главный технолог (главный металлург)\n│   ├── Отдел охраны труда и промышленной безопасности (ОТиПБ)\n│   └── Центральная заводская лаборатория (ЦЗЛ), ОТК\n├── Заместители: по экономике и финансам, по капитальному строительству, по коммерции (снабжение и сбыт), по персоналу, по безопасности\n└── Производственные подразделения: рудник, карьер, обогатительная фабрика (ОФ), металлургические цеха, ремонтные цеха, автобаза, энергоцех\n    └── Начальник цеха → начальник участка → сменный мастер → бригадир → рабочие<\/code><\/pre>\n<p><strong>Особенности, которые нужно знать:<\/strong><\/p>\n<ul><li><strong>Главный инженер в СНГ — это не «Chief Engineer» в западном смысле.<\/strong> Это фактически технический директор и первый заместитель руководителя по производству, лицо, лично ответственное за промышленную безопасность и технологию. На Западе «Chief Engineer» часто старший инженер-эксперт. Неправильный перевод — грубая ошибка в поиске и в оффере.<\/li><li><strong>Технологические «главные» специалисты<\/strong> (главный механик, главный энергетик, главный геолог, главный маркшейдер, главный технолог) — руководители функций уровня всего предприятия. На Западе им примерно соответствуют Head of / Manager / Superintendent в зависимости от масштаба.<\/li><li><strong>ИТР<\/strong> (инженерно-технические работники) — категория, которой нет в западной практике. Ближайшие аналоги — salaried technical staff, engineers and supervisors.<\/li><li><strong>ППР<\/strong> (планово-предупредительный ремонт) — советская система ТОиР. На Западе — preventive maintenance и reliability-centered maintenance (RCM), CMMS-системы (SAP PM, IBM Maximo).<\/li><li>В акционерных обществах Узбекистана с государственным участием первое лицо часто называется <strong>председатель правления<\/strong> (Chairman of the Management Board ≈ CEO). Не путайте с председателем <strong>наблюдательного совета<\/strong> (Chairman of the Supervisory Board ≈ Board Chair).<\/li><\/ul>\n<h3>1.5 Поддерживающие функции, без которых рудник не работает<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Функция<\/th><th>Что делает<\/th><th>Ключевые роли<\/th><th>KPI<\/th><\/tr><\/thead><tbody><tr><td>ТОиР (maintenance)<\/td><td>Обслуживание и ремонт техники и оборудования<\/td><td>Главный механик / Maintenance Manager, инженер по надёжности (Reliability Engineer), планировщик ремонтов<\/td><td>Готовность, MTBF (средняя наработка на отказ), MTTR (среднее время ремонта), доля плановых работ, затраты на ТОиР<\/td><\/tr><tr><td>Энергетика<\/td><td>Электроснабжение, подстанции, приводы<\/td><td>Главный энергетик / Electrical Superintendent<\/td><td>Надёжность энергоснабжения, удельный расход энергии<\/td><\/tr><tr><td>АСУ ТП и КИПиА<\/td><td>Автоматизация, контрольно-измерительные приборы<\/td><td>Инженер АСУ ТП / Process Control Engineer, Instrumentation Technician<\/td><td>Время работы систем, точность измерений<\/td><\/tr><tr><td>Охрана труда и промбезопасность<\/td><td>Безопасность, расследования, обучение<\/td><td>HSE Manager<\/td><td>LTIFR, TRIFR, отсутствие смертельных случаев<\/td><\/tr><tr><td>Экология<\/td><td>Разрешения, мониторинг, хвостохранилища<\/td><td>Environmental Manager, специалист по хвостохранилищам<\/td><td>Соответствие требованиям, инциденты<\/td><\/tr><tr><td>Снабжение и склады<\/td><td>Запчасти, реагенты, ВВ, логистика<\/td><td>Supply Chain Manager<\/td><td>Наличие критических запчастей, оборачиваемость запасов<\/td><\/tr><tr><td>Лаборатория<\/td><td>Анализы проб, контроль качества<\/td><td>Начальник ЦЗЛ / Laboratory Manager<\/td><td>Сроки анализов, точность, аккредитация<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.6 Итог модуля 1 на одной странице<\/h3>\n<pre class=\"code\"><code>ОТРАСЛЬ: цепочка «недра → концентрат → металл → изделие»; дефицит людей растёт к downstream\nГЕОЛОГИЯ: минерал → порода → руда (экономика!) → месторождение; три фильтра геолога: металл + стиль + тип работ\nРАЗВЕДКА: воронка стадий; ресурсы ≠ запасы; JORC/NI 43-101 ↔ ГКЗ; технические отчёты = источник экспертов\nДОБЫЧА: карьер (вскрыша, БВР, экскаватор-самосвал) или подземка (вскрытие, проходка, системы разработки)\nПРЕДПРИЯТИЕ: стадии проекта → волны найма; главный инженер ≠ Chief Engineer; ТОиР, энергетика, охрана труда — опора производства<\/code><\/pre>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Жизненный цикл рудника<\/td><td>Mine life cycle<\/td><td>Стадии от разведки до закрытия<\/td><\/tr><tr><td>Стадийные ворота<\/td><td>Stage-gate<\/td><td>Формальные решения о переходе проекта на следующую стадию<\/td><\/tr><tr><td>Решение об инвестициях<\/td><td>Final investment decision (FID)<\/td><td>Решение строить<\/td><\/tr><tr><td>Подготовка к эксплуатации<\/td><td>Operational readiness<\/td><td>Найм, обучение и системы до пуска<\/td><\/tr><tr><td>Пусконаладка<\/td><td>Commissioning<\/td><td>Проверка и запуск оборудования и систем<\/td><\/tr><tr><td>Выход на проектную мощность<\/td><td>Ramp-up<\/td><td>Период от пуска до проектных показателей<\/td><\/tr><tr><td>Проектная (паспортная) мощность<\/td><td>Nameplate capacity<\/td><td>Производительность по проекту<\/td><\/tr><tr><td>Строительство под ключ<\/td><td>EPC (Engineering, Procurement, Construction)<\/td><td>Подрядчик отвечает за проектирование, закупки и стройку<\/td><\/tr><tr><td>Управление проектом от имени владельца<\/td><td>EPCM<\/td><td>Инжиниринговая компания управляет стройкой, риск у владельца<\/td><\/tr><tr><td>Команда владельца<\/td><td>Owner's team<\/td><td>Сотрудники заказчика на проекте<\/td><\/tr><tr><td>Управление стоимостью и сроками<\/td><td>Project controls<\/td><td>Планирование, контроль бюджета и графика<\/td><\/tr><tr><td>Оценка воздействия на окружающую среду (ОВОС)<\/td><td>Environmental and social impact assessment (ESIA)<\/td><td>Обязательная экологическая и социальная оценка проекта<\/td><\/tr><tr><td>Рекультивация<\/td><td>Rehabilitation / reclamation<\/td><td>Восстановление земель после горных работ<\/td><\/tr><tr><td>Закрытие рудника<\/td><td>Mine closure<\/td><td>Прекращение работ и приведение площадки в безопасное состояние<\/td><\/tr><tr><td>Главный инженер<\/td><td>Technical Director / Chief Operating Engineer (по смыслу)<\/td><td>В СНГ — первый заместитель по производству и технологии<\/td><\/tr><tr><td>Производственно-технический отдел (ПТО)<\/td><td>Technical Services Department<\/td><td>Планирование, проектная и техническая документация<\/td><\/tr><tr><td>Главный механик<\/td><td>Head of Maintenance / Chief Mechanical Engineer<\/td><td>Руководитель службы ТОиР<\/td><\/tr><tr><td>Главный энергетик<\/td><td>Head of Electrical / Chief Power Engineer<\/td><td>Руководитель энергослужбы<\/td><\/tr><tr><td>Начальник цеха<\/td><td>Area Manager / Superintendent<\/td><td>Руководитель производственного подразделения<\/td><\/tr><tr><td>Сменный мастер<\/td><td>Shift Supervisor / Foreman<\/td><td>Руководитель смены<\/td><\/tr><tr><td>ИТР<\/td><td>Engineering and technical staff<\/td><td>Инженеры, техники, линейные руководители<\/td><\/tr><tr><td>Техническое обслуживание и ремонт (ТОиР)<\/td><td>Maintenance<\/td><td>Обслуживание и ремонт оборудования<\/td><\/tr><tr><td>Планово-предупредительный ремонт (ППР)<\/td><td>Preventive maintenance<\/td><td>Ремонты по графику до отказа<\/td><\/tr><tr><td>Наработка на отказ<\/td><td>MTBF (mean time between failures)<\/td><td>Средняя наработка между отказами<\/td><\/tr><tr><td>Вахтовый метод<\/td><td>FIFO (fly-in fly-out) / rotation<\/td><td>Работа сменами с проживанием у объекта<\/td><\/tr><tr><td>Председатель правления<\/td><td>Chairman of the Management Board (≈ CEO)<\/td><td>Первое лицо исполнительного органа АО<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Словарь сопоставления должностей: главные ловушки<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>СНГ<\/th><th>Ближайший западный аналог<\/th><th>Ловушка<\/th><\/tr><\/thead><tbody><tr><td>Главный инженер комбината<\/td><td>Technical Director, COO (site), Deputy GM — Technical<\/td><td>«Chief Engineer» на Западе — эксперт, а не первый заместитель<\/td><\/tr><tr><td>Технический директор<\/td><td>CTO / Technical Director / VP Technical Services<\/td><td>В горных компаниях CTO может означать и технологии, и техническое обслуживание. Уточняйте зону<\/td><\/tr><tr><td>Технолог (обогащение)<\/td><td><strong>Metallurgist / Process Engineer<\/strong><\/td><td>На Западе «metallurgist» на руднике — это <strong>обогатитель<\/strong>, а не металлург-плавильщик<\/td><\/tr><tr><td>Металлург<\/td><td>Extractive Metallurgist / Pyrometallurgist / Hydrometallurgist / Physical Metallurgist<\/td><td>Уточняйте: извлечение металла, плавка, гидрометаллургия или металловедение<\/td><\/tr><tr><td>Обогатитель<\/td><td>Mineral Processing Engineer / Metallurgist<\/td><td>Тот же «metallurgist»<\/td><\/tr><tr><td>Маркшейдер<\/td><td>Mine Surveyor<\/td><td>В СНГ шире: учёт запасов, деформации, контроль горных работ<\/td><\/tr><tr><td>Начальник цеха<\/td><td>Superintendent / Area Manager<\/td><td>Масштаб цеха в СНГ может быть больше, чем у западного superintendent<\/td><\/tr><tr><td>Начальник участка<\/td><td>Supervisor / Section Manager<\/td><td>—<\/td><\/tr><tr><td>Горный мастер<\/td><td>Shift Boss / Shift Supervisor<\/td><td>—<\/td><\/tr><tr><td>Начальник ПТО<\/td><td>Technical Services Manager / Mine Planning Superintendent<\/td><td>—<\/td><\/tr><tr><td>Главный геолог<\/td><td>Chief Geologist / Geology Manager<\/td><td>—<\/td><\/tr><tr><td>Ведущий специалист / главный специалист<\/td><td>Senior / Principal Engineer<\/td><td>В разных компаниях не совпадает. Сравнивайте задачи, а не названия<\/td><\/tr><tr><td>Директор по производству<\/td><td>Operations Director / VP Operations<\/td><td>—<\/td><\/tr><tr><td>Председатель правления (АО в Узбекистане)<\/td><td>CEO<\/td><td>Не путать с председателем наблюдательного совета<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Правило:<\/strong> <strong>никогда не сопоставляйте должности по названию.<\/strong> Сопоставляйте по масштабу (люди, бюджет, тонны), подчинённости и зоне ответственности.<\/p>\n<h3>3.2 Уровни и масштаб: как оценить «вес» кандидата<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Уровень (запад)<\/th><th>Уровень (СНГ)<\/th><th>Типичная зона ответственности<\/th><\/tr><\/thead><tbody><tr><td>Graduate / Engineer<\/td><td>Инженер, специалист<\/td><td>Задачи под руководством<\/td><\/tr><tr><td>Senior Engineer<\/td><td>Ведущий инженер<\/td><td>Самостоятельные проекты, наставничество<\/td><\/tr><tr><td>Principal / Lead<\/td><td>Главный специалист<\/td><td>Экспертиза уровня предприятия или корпорации<\/td><\/tr><tr><td>Superintendent<\/td><td>Начальник участка или цеха<\/td><td>Подразделение: десятки–сотни людей<\/td><\/tr><tr><td>Manager<\/td><td>Начальник крупного цеха, главный специалист-руководитель функции<\/td><td>Функция предприятия<\/td><\/tr><tr><td>General Manager<\/td><td>Директор предприятия / рудника<\/td><td>Всё предприятие<\/td><\/tr><tr><td>Director / VP / C-level<\/td><td>Директор по направлению, член правления<\/td><td>Несколько предприятий, стратегия<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Пять вопросов о масштабе<\/strong> (задавайте всегда):<\/p>\n<ol><li>Сколько людей было в прямом и общем подчинении?<\/li><li>Какой бюджет (OPEX, CAPEX) был под вашим контролем?<\/li><li>Какая производительность (т/год) и какая продукция?<\/li><li>Кому вы подчинялись?<\/li><li>Какие решения вы принимали сами, а какие согласовывали?<\/li><\/ol>\n<h3>3.3 Архетипы руководителей и стадии TMK<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Архетип<\/th><th>Сильная сторона<\/th><th>Когда нужен TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>Строитель<\/strong> (builder)<\/td><td>Проекты с нуля, стройка, пуск<\/td><td>Новые проекты: горнорудный комплекс, графит, TMK Chemicals<\/td><\/tr><tr><td><strong>Пусковик<\/strong> (commissioning &amp; ramp-up)<\/td><td>Вывод новых установок на проектные показатели<\/td><td>Новые гидрометаллургические и порошковые производства<\/td><\/tr><tr><td><strong>Эксплуатационник<\/strong> (operator)<\/td><td>Стабильность, дисциплина, системы<\/td><td>Действующие производства Чирчика<\/td><\/tr><tr><td><strong>Оптимизатор<\/strong> (improver)<\/td><td>Рост извлечения, снижение затрат<\/td><td>Модернизация советских переделов<\/td><\/tr><tr><td><strong>Кризисный руководитель<\/strong> (turnaround)<\/td><td>Вывод из провала<\/td><td>Проекты с задержками и проблемами<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Маркеры реального опыта<\/strong> (относятся к любому архетипу):<\/p>\n<ul><li>точные цифры: «было → стало», единицы измерения правильные;<\/li><li>причинно-следственные связи: почему было принято решение;<\/li><li>признанные ошибки и выводы из них;<\/li><li>названия оборудования, систем, реагентов, стандартов;<\/li><li>понимание связей между подразделениями (рудник ↔ фабрика ↔ ремонт ↔ лаборатория).<\/li><\/ul>\n<h3>3.4 Вопросы о релокации в Узбекистан (для иностранных кандидатов)<\/h3>\n<ul><li>Готовность к работе в Чирчике или на удалённой площадке; вахта или постоянное проживание. Распространённые графики для экспатов в СНГ — 28/28, 21/21, 14/14.<\/li><li>Семья: школы (в Ташкенте есть международные школы), медицина, работа для супруга или супруги.<\/li><li>Язык: русский, узбекский, английский. Нужен ли переводчик?<\/li><li>Структура вознаграждения: оклад, надбавка за удалённость, жильё, перелёты, медицинская страховка, бонус, налоги. Обсуждайте с HR и юристами TMK заранее.<\/li><li>Мотивация: почему Узбекистан? Сильные ответы — масштаб задачи, возможность построить с нуля, критические металлы. Слабые — «просто нужна работа» (риск раннего ухода).<\/li><\/ul>\n<hr>\n<h2>4. Кейс-финал модуля 1<\/h2>\n<p><strong>Ситуация.<\/strong> TMK объявляет о строительстве <strong>вольфрамового горнорудного комплекса в Самаркандской области<\/strong>: подземный рудник + обогатительная фабрика (гравитация + флотация шеелита). Пуск — через 24 месяца. Вас пригласили на совещание проектного офиса.<\/p>\n<p><strong>Задание (45 мин).<\/strong> Подготовьте документ на 2–3 страницы:<\/p>\n<ol><li><strong>Оргструктура<\/strong> эксплуатации, три верхних уровня — двумя названиями (СНГ и запад) для каждой позиции.<\/li><li><strong>План волн найма:<\/strong> 12 ключевых позиций, для каждой — за сколько месяцев до пуска нанимать и почему.<div class=\"table-wrap\"><table><thead><tr><th>Позиция (RU / EN)<\/th><th>Волна (за N месяцев до пуска)<\/th><th>Почему именно тогда<\/th><th>Дефицит (★–★★★)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div><\/li><\/ol>\n<ol><li><strong>Профили 3 позиций:<\/strong> начальник рудника, начальник ОФ, главный механик. Для каждой: must-have, nice-to-have, 6–8 компаний-доноров, красные флаги, 5 скрининговых вопросов.<\/li><li><strong>5 вопросов нанимающему менеджеру<\/strong>, без ответов на которые нельзя начинать поиск.<\/li><\/ol>\n<p><strong>Критерии качества:<\/strong><\/p>\n<ul><li>Волны найма логичны: руководители раньше операторов, ремонт и лаборатория до пуска, а не после.<\/li><li>В профилях есть цифры масштаба.<\/li><li>Доноры соответствуют металлу, стилю месторождения и типу работ.<\/li><li>Есть хотя бы один кандидатский пул из СНГ и хотя бы один международный.<\/li><\/ul>\n<details><summary>Ориентир для самопроверки (смотреть после выполнения)<\/summary>\n<ul><li><strong>За 18–24 месяца:<\/strong> директор комплекса (General Manager), начальник рудника, начальник ОФ (участие в приёмке проекта, выборе оборудования).<\/li><li><strong>За 12–18 месяцев:<\/strong> главный механик, главный энергетик, главный геолог, геомеханик, руководитель охраны труда, руководитель пусконаладки.<\/li><li><strong>За 6–12 месяцев:<\/strong> технологи ОФ, начальники участков, горные мастера, планировщики, начальник лаборатории.<\/li><li><strong>За 3–6 месяцев:<\/strong> операторы, машинисты, слесари, лаборанты (с обучением на симуляторах и у поставщиков оборудования).<\/li><li>Типичные ошибки: нанимать главного механика после пуска («оборудование новое, ломаться не будет»); забывать лабораторию — без анализов фабрика «слепая».<\/li><\/ul>\n<\/details>\n<hr>\n<h2>6. Рефлексия: итог модуля<\/h2>\n<ol><li>Пройдите <strong>входной тест из Дня 1<\/strong> ещё раз и сравните результат. Запишите оба результата в журнал прогресса.<\/li><li>Что из Модуля 1 я <strong>уже применила<\/strong> в реальной работе? Если ничего, выберите одну вакансию TMK и примените на этой неделе.<\/li><li><strong>Teach-back:<\/strong> объясните коллеге за 10 минут, как устроено горное предприятие и кто нужен на каждой стадии. Если споткнулись — это зона повторения.<\/li><li><strong>Обязательство:<\/strong> «Модуль 2 начинаю ___ (дата) в ___:___».<\/li><\/ol>\n<blockquote><p><strong>Правило модуля:<\/strong> вы прошли 5 дней из 30. Это одна шестая пути. Большинство людей, начавших самообучение, бросают на первой неделе. Вы её прошли. Награда — следующий модуль: переработка, где заканчивается горное дело и начинается настоящая экспертиза TMK.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Terry McNulty, «Developing innovative technology», <em>Mining Engineering<\/em> (1998) — классическая статья о выходе на мощность. Пересказы ищите по запросу «McNulty curves ramp-up».<\/li><li>AusIMM, <em>Australasian Mining and Metallurgical Operating Practices<\/em> (Monograph 28) — описания реальных рудников и фабрик: как устроены и как управляются.<\/li><li>Материалы по Operational Readiness: поиск «operational readiness mining project», публикации EY, McKinsey и Deloitte о горных проектах.<\/li><li>Профиль TMK: <a href=\"#tmk\">../00-start/tmk-profile.md<\/a><\/li><\/ul>"},{"n":6,"module":2,"title":"Рудоподготовка и основы обогащения: дробление, измельчение, баланс","file":"module-02-processing-metallurgy/day-06-comminution-beneficiation.md","duration":"3,5 часа","challenge":"Вручную посчитать <strong>извлечение и выход концентрата<\/strong> по формуле двух продуктов и объяснить результат так, как его объяснил бы начальник фабрики.","why":"Технолог-обогатитель живёт в трёх цифрах: <strong>качество концентрата, извлечение, производительность<\/strong>. Кандидат, который называет их без запинки и объясняет компромисс между ними, — практик. Кандидат, который говорит «мы улучшили показатели», — нет. Сегодня вы получите инструмент, чтобы отличать их за две минуты.","checklist":[{"text":"Разминка: 5 вопросов по Модулю 1 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Расчёт: формула двух продуктов, 3 задачи (20 мин)","minutes":20},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: схема фабрики + вопросы для начальника ОФ (25 мин)","minutes":25},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.3 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Обогатительная фабрика (ОФ)","en":"Concentrator / processing plant","def":"Предприятие по обогащению руды"},{"ru":"Рудоподготовка","en":"Comminution","def":"Дробление и измельчение"},{"ru":"Дробление","en":"Crushing","def":"Уменьшение крупности кусков руды"},{"ru":"Щековая дробилка","en":"Jaw crusher","def":"Дробилка крупного дробления с подвижной щекой"},{"ru":"Конусная дробилка","en":"Cone crusher / gyratory crusher","def":"Дробилка с вращающимся конусом"},{"ru":"Валковый пресс высокого давления","en":"HPGR (high pressure grinding rolls)","def":"Энергоэффективное измельчение между валками"},{"ru":"Грохот","en":"Screen","def":"Разделение материала по крупности на ситах"},{"ru":"Измельчение","en":"Grinding / milling","def":"Тонкое измельчение руды в мельницах"},{"ru":"Мельница полусамоизмельчения","en":"SAG mill (semi-autogenous grinding)","def":"Мельница, где руда измельчает сама себя с добавкой шаров"},{"ru":"Шаровая мельница","en":"Ball mill","def":"Мельница со стальными шарами"},{"ru":"Мелющие тела","en":"Grinding media","def":"Шары и стержни для измельчения"},{"ru":"Футеровка","en":"Liner","def":"Износостойкая облицовка мельниц"},{"ru":"Классификация","en":"Classification","def":"Разделение по крупности в потоке пульпы"},{"ru":"Гидроциклон","en":"Hydrocyclone","def":"Аппарат классификации центробежной силой"},{"ru":"Циркулирующая нагрузка","en":"Circulating load","def":"Материал, возвращаемый в мельницу"},{"ru":"Крупность 80%","en":"P80","def":"Размер, мельче которого 80% массы"},{"ru":"Индекс Бонда","en":"Bond Work Index","def":"Показатель трудности измельчения"},{"ru":"Раскрытие минералов","en":"Liberation","def":"Освобождение зёрен ценного минерала от породы"},{"ru":"Пульпа","en":"Slurry / pulp","def":"Смесь измельчённой руды с водой"},{"ru":"Концентрат","en":"Concentrate","def":"Продукт с высоким содержанием ценного минерала"},{"ru":"Хвосты","en":"Tailings","def":"Отходы обогащения"},{"ru":"Промпродукт","en":"Middlings","def":"Промежуточный продукт для доработки"},{"ru":"Выход концентрата","en":"Mass pull / yield","def":"Доля массы руды, перешедшая в концентрат"},{"ru":"Извлечение","en":"Recovery","def":"Доля металла, перешедшая в концентрат"},{"ru":"Качество концентрата","en":"Concentrate grade","def":"Содержание ценного компонента в концентрате"},{"ru":"Сгуститель","en":"Thickener","def":"Аппарат осаждения твёрдого из пульпы"},{"ru":"Фильтр-пресс","en":"Filter press","def":"Аппарат обезвоживания под давлением"},{"ru":"Хвостохранилище","en":"Tailings storage facility (TSF)","def":"Сооружение для хранения хвостов"},{"ru":"Сухое складирование хвостов","en":"Dry stacking","def":"Складирование отфильтрованных хвостов"},{"ru":"Металлургический баланс","en":"Metallurgical accounting / mass balance","def":"Учёт металла по продуктам фабрики"},{"ru":"Технологическая минералогия","en":"Process mineralogy","def":"Изучение минералогии для технологии"},{"ru":"Геометаллургия","en":"Geometallurgy","def":"Связка геологии и технологии переработки"}],"quiz":[{"q":"Чем обогащение отличается от металлургии?","options":["Ничем","Обогащение проводится только на руднике","Обогащение отделяет ценные минералы без изменения их химического состава; металлургия химически извлекает металл","Металлургия — это часть обогащения"],"answer":2,"explain":"Обогащение — физические и физико-химические методы разделения минералов. Металлургия — химические превращения (растворение, восстановление, плавка)."},{"q":"Руда — 0,5% WO₃, концентрат — 65% WO₃, хвосты — 0,1% WO₃. Извлечение примерно:","options":["50%","65%","80%","99%"],"answer":2,"explain":"R = 65 · (0,5 − 0,1) / [0,5 · (65 − 0,1)] ≈ 80%."},{"q":"Что такое P80?","options":["Размер, мельче которого 80% массы продукта","80% извлечения","Производительность 80 т/ч","80% загрузки мельницы"],"answer":0,"explain":"Главный параметр крупности помола. От него зависят раскрытие минералов и показатели обогащения."},{"q":"Зачем гидроциклон работает в замкнутом цикле с шаровой мельницей?","options":["Охлаждает мельницу","Удаляет воду из концентрата","Добавляет реагенты","Возвращает крупный материал на доизмельчение, а готовый по крупности отправляет дальше"],"answer":3,"explain":"Пески гидроциклона возвращаются в мельницу (циркулирующая нагрузка), слив идёт на обогащение."},{"q":"Что означает компромисс «качество — извлечение»?","options":["Качество и извлечение всегда растут вместе","Чем выше качество концентрата, тем, как правило, ниже извлечение, и наоборот","Это понятие из бухгалтерии","Извлечение не зависит от качества"],"answer":1,"explain":"Технолог ищет экономический оптимум с учётом цены, требований покупателя и штрафов за примеси."},{"q":"Какой процесс — крупнейший потребитель энергии на обогатительной фабрике?","options":["Флотация","Фильтрация","Освещение","Рудоподготовка (дробление и измельчение)"],"answer":3,"explain":"По оценкам CEEC, рудоподготовка может давать порядка половины энергопотребления горно-обогатительного предприятия."},{"q":"После какой аварии был принят глобальный стандарт по хвостохранилищам GISTM?","options":["Чернобыль","Фукусима","Брумадинью (Vale, Бразилия, 2019)","Олимпик-Дам"],"answer":2,"explain":"Катастрофа на дамбе в Брумадинью в 2019 г. и предыдущие аварии (Маунт-Полли, Фундан) привели к принятию GISTM в 2020 г."},{"q":"Почему переработка старых хвостов (как на Ингичке) — особая задача?","options":["Хвосты уже измельчены, минералы частично окислены и ошламованы, содержание низкое","Хвосты радиоактивны","Хвосты не содержат вольфрама","Это проще, чем переработка руды"],"answer":0,"explain":"Нужны технологи с опытом переработки тонкого, окисленного, бедного сырья, особенно по вольфраму."},{"q":"Технолог говорит: «Мы улучшили показатели фабрики». Лучший уточняющий вопрос:","options":["«Вам нравилась работа?»","«Какие именно показатели, с каких значений на какие, за счёт чего и какая ваша личная роль?»","«Сколько лет вы работали?»","«Какое у вас образование?»"],"answer":1,"explain":"Практик ответит цифрами и причинами. Поверхностный кандидат уйдёт в общие слова."},{"q":"Что изучает технологическая минералогия (QEMSCAN, MLA)?","options":["Цены на минералы","Историю месторождения","Минеральный состав, раскрытие и формы потерь металла для управления технологией","Химию воды"],"answer":2,"explain":"Она отвечает на вопрос «почему металл теряется» и связывает геологию с технологией (геометаллургия)."}],"html":"<h2>0. Разминка: вспомнить Модуль 1<\/h2>\n<ol><li>Почему «руда — понятие экономическое»?<\/li><li>Какие свойства минералов используют гравитация, магнитная сепарация и флотация?<\/li><li>Почему вольфрамовые минералы склонны к ошламованию и чем это грозит?<\/li><li>Что такое mine-to-mill?<\/li><li>Кто на западной фабрике называется metallurgist?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Порода становится рудой, только если извлечение металла выгодно при текущих ценах и технологиях.<\/li><li>Плотность, магнитная восприимчивость, свойства поверхности (гидрофобность).<\/li><li>Шеелит и вольфрамит хрупкие, легко переизмельчаются в тонкие шламы, которые плохо улавливаются. Растут потери, падает извлечение.<\/li><li>Оптимизация буровзрывных работ ради производительности и затрат фабрики.<\/li><li>Технолог-обогатитель.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Зачем обогащать: логика фабрики<\/h3>\n<p>Руда содержит доли процента ценного минерала. Везти её на металлургический завод или растворять целиком невыгодно. <strong>Обогащение<\/strong> (mineral processing, beneficiation) отделяет ценные минералы от пустой породы <strong>без изменения их химического состава<\/strong> (в отличие от металлургии). Получаются:<\/p>\n<ul><li><strong>концентрат<\/strong> (concentrate) — продукт с высоким содержанием ценного минерала;<\/li><li><strong>хвосты<\/strong> (tailings) — отходы обогащения;<\/li><li>иногда <strong>промпродукт<\/strong> (middlings) — промежуточный продукт для доработки.<\/li><\/ul>\n<p>Общая схема любой фабрики:<\/p>\n<pre class=\"code\"><code>Руда (ROM) → ДРОБЛЕНИЕ → ИЗМЕЛЬЧЕНИЕ + КЛАССИФИКАЦИЯ → РАЗДЕЛЕНИЕ (гравитация / флотация / магнитная сепарация)\n           → ОБЕЗВОЖИВАНИЕ концентрата (сгущение, фильтрация, сушка) → КОНЦЕНТРАТ\n           → ХВОСТЫ → сгущение → хвостохранилище (или сухое складирование, или закладка)<\/code><\/pre>\n<p><strong>Раскрытие<\/strong> (liberation) — главная идея. Ценный минерал «запечатан» в породе. Чтобы его отделить, руду нужно измельчить до крупности, при которой зёрна ценного минерала освобождаются от пустой породы. Измельчение не до конца — минерал остаётся в сростках и уходит в хвосты. Слишком тонкое — шламы и потери (особенно для вольфрама), а ещё лишние затраты энергии.<\/p>\n<h3>1.2 Три главных показателя и формула двух продуктов<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Показатель<\/th><th>Обозначение<\/th><th>Смысл<\/th><\/tr><\/thead><tbody><tr><td>Содержание в руде (питании)<\/td><td>f (feed grade)<\/td><td>% ценного компонента в исходной руде<\/td><\/tr><tr><td>Содержание в концентрате (качество)<\/td><td>c (concentrate grade)<\/td><td>% ценного компонента в концентрате<\/td><\/tr><tr><td>Содержание в хвостах<\/td><td>t (tailings grade)<\/td><td>% ценного компонента, ушедшего в отходы<\/td><\/tr><tr><td>Выход концентрата<\/td><td>γ (mass pull / yield)<\/td><td>Доля массы руды, перешедшая в концентрат<\/td><\/tr><tr><td><strong>Извлечение<\/strong><\/td><td>ε, R (recovery)<\/td><td>Доля <strong>металла<\/strong> руды, перешедшая в концентрат<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Формулы (баланс двух продуктов):<\/strong><\/p>\n<pre class=\"code\"><code>Выход концентрата  γ = (f − t) / (c − t)\nИзвлечение         R = c · (f − t) / [ f · (c − t) ] × 100%\nСтепень концентрации K = c / f<\/code><\/pre>\n<p><strong>Пример (вольфрам).<\/strong> f = 0,5% WO₃, c = 65% WO₃, t = 0,1% WO₃.<\/p>\n<ul><li>γ = (0,5 − 0,1) / (65 − 0,1) = 0,4 / 64,9 ≈ <strong>0,62%<\/strong>: из 1 000 т руды получается ≈ 6,2 т концентрата.<\/li><li>R = 65 · 0,4 / (0,5 · 64,9) = 26 / 32,45 ≈ <strong>80%<\/strong>: 80% вольфрама попало в концентрат, 20% ушло в хвосты.<\/li><\/ul>\n<p><strong>Компромисс «качество — извлечение»<\/strong> (grade-recovery trade-off). Хотите более чистый концентрат — потеряете часть металла в хвостах. Хотите извлечь больше — загрязните концентрат. Задача технолога — найти экономический оптимум. Сильный кандидат объясняет <strong>свою кривую<\/strong> «качество — извлечение» и где на ней работала фабрика.<\/p>\n<p><strong>Задачи для самопроверки:<\/strong><\/p>\n<ol><li>f = 1,0% Cu, c = 25% Cu, t = 0,1% Cu. Найдите γ и R.<\/li><li>Извлечение выросло с 75% до 80% при той же руде и производительности 500 тыс. т/год, f = 0,5% WO₃. Сколько дополнительных тонн WO₃ в год это даёт?<\/li><li>Почему для вольфрама снижение t с 0,10% до 0,08% — серьёзное достижение?<\/li><\/ol>\n<details><summary>Решения<\/summary>\n<ol><li>γ = (1,0 − 0,1) / (25 − 0,1) = 0,9 / 24,9 ≈ 3,6%; R = 25 · 0,9 / (1,0 · 24,9) ≈ 90,4%.<\/li><li>WO₃ в руде: 500 000 × 0,005 = 2 500 т/год. +5 п. п. извлечения = +125 т WO₃ в год (≈ 192 т концентрата с 65% WO₃). При высоких ценах на вольфрам это миллионы долларов.<\/li><li>При f = 0,5% это 0,02 п. п. в хвостах, или около 4% всего вольфрама руды. Вольфрамовые шламы трудно улавливать, поэтому каждая сотая доля процента в хвостах — результат серьёзной технологической работы.<\/li><\/ol>\n<\/details>\n<h3>1.3 Дробление (crushing)<\/h3>\n<p>Цель — уменьшить куски руды от сотен миллиметров (а после взрыва до 1–1,5 м) до крупности, подходящей для мельниц.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Стадия<\/th><th>Оборудование<\/th><th>Крупность (ориентир)<\/th><\/tr><\/thead><tbody><tr><td>Крупное (primary)<\/td><td><strong>Конусная дробилка крупного дробления<\/strong> (gyratory) — для больших потоков; <strong>щековая<\/strong> (jaw) — для меньших<\/td><td>До ~150–250 мм<\/td><\/tr><tr><td>Среднее и мелкое (secondary / tertiary)<\/td><td><strong>Конусные дробилки<\/strong> (cone crushers)<\/td><td>До ~10–50 мм<\/td><\/tr><tr><td>Высоконапорное измельчение<\/td><td><strong>Валковые прессы высокого давления<\/strong> (HPGR)<\/td><td>Мелкий продукт с микротрещинами; энергоэффективно<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Дополнительное оборудование: <strong>грохоты<\/strong> (screens) — разделяют по крупности; конвейеры; питатели; <strong>склад крупнодроблёной руды<\/strong> (stockpile) — буфер между рудником и фабрикой.<\/p>\n<p><strong>Производители:<\/strong> Metso (до 2024 г. — Metso Outotec), FLSmidth, Sandvik, Weir (Trio, Enduron), thyssenkrupp Polysius / KHD (HPGR), в СНГ — Уралмашзавод и др.<\/p>\n<h3>1.4 Измельчение и классификация (grinding &amp; classification)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Мельница<\/th><th>Как работает<\/th><th>Где применяется<\/th><\/tr><\/thead><tbody><tr><td><strong>Мельница самоизмельчения / полусамоизмельчения<\/strong> (AG / SAG)<\/td><td>Руда измельчает сама себя; в SAG добавляют немного шаров. Диаметр — до 40 футов (≈ 12 м)<\/td><td>Первая стадия измельчения на крупных фабриках<\/td><\/tr><tr><td><strong>Шаровая мельница<\/strong> (ball mill)<\/td><td>Стальные шары измельчают руду<\/td><td>Вторая стадия, тонкое измельчение<\/td><\/tr><tr><td><strong>Стержневая мельница<\/strong> (rod mill)<\/td><td>Стальные стержни<\/td><td>Старые схемы; на фабриках СНГ встречается<\/td><\/tr><tr><td><strong>Вертикальные / перемешивающие мельницы<\/strong> (stirred mills: Vertimill, IsaMill, HIGmill)<\/td><td>Мелющая среда перемешивается ротором<\/td><td>Доизмельчение и сверхтонкое измельчение (до десятков микрон и тоньше)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Типовые схемы:<\/strong><\/p>\n<ul><li><strong>SABC<\/strong> — SAG-мельница + шаровая мельница + дробилка для «галей» (pebble crusher);<\/li><li>HPGR + шаровая мельница;<\/li><li>классические схемы СНГ — многостадиальное дробление + стержневые и шаровые мельницы.<\/li><\/ul>\n<p><strong>Классификация<\/strong> — разделение по крупности: <strong>гидроциклоны<\/strong> (hydrocyclones) и тонкие грохоты. Мельница и гидроциклон работают в <strong>замкнутом цикле<\/strong>: крупная фракция (пески) возвращается в мельницу (<strong>циркулирующая нагрузка<\/strong>, часто 200–300%), тонкая (слив) идёт на обогащение.<\/p>\n<p><strong>Ключевые параметры:<\/strong><\/p>\n<ul><li><strong>P80<\/strong> — размер, мельче которого 80% массы продукта (например, P80 = 75 мкм). Главный параметр помола.<\/li><li><strong>F80<\/strong> — то же для питания.<\/li><li><strong>Индекс Бонда<\/strong> (Bond Work Index, кВт·ч/т) — показатель трудности измельчения руды. Тесты JK Drop Weight и SMC — для расчёта SAG-мельниц.<\/li><li><strong>Удельный расход энергии<\/strong> (кВт·ч/т), расход мелющих тел и футеровки (кг/т).<\/li><\/ul>\n<p><strong>Энергия.<\/strong> Рудоподготовка (дробление и измельчение) — крупнейший потребитель энергии на фабрике. По оценкам CEEC (Coalition for Eco-Efficient Comminution), на неё может приходиться порядка половины энергопотребления горно-обогатительного предприятия. Отсюда спрос на специалистов по оптимизации измельчения.<\/p>\n<p><strong>Мировая школа:<\/strong> <strong>JKMRC<\/strong> (University of Queensland) — центр исследований измельчения и флотации; программы симуляции JKSimMet и JKSimFloat. Упоминание JKMRC или JKTech в резюме — сильный сигнал.<\/p>\n<h3>1.5 Обезвоживание и хвосты (dewatering &amp; tailings)<\/h3>\n<ul><li><strong>Сгущение<\/strong> (thickening): сгустители (thickeners) — обычные, высокопроизводительные (high-rate), пастовые; флокулянты.<\/li><li><strong>Фильтрация<\/strong> (filtration): вакуумные дисковые и ленточные фильтры, <strong>фильтр-прессы<\/strong> (Metso Larox, FLSmidth, Diemme).<\/li><li><strong>Сушка<\/strong> (drying): сушильные барабаны и печи для концентратов, если нужна низкая влажность.<\/li><li><strong>Хвостохранилища<\/strong> (tailings storage facilities, TSF). Способы наращивания дамб: upstream (наиболее рискованный; после аварий в Бразилии запрещён в ряде стран), downstream, centerline. Альтернативы — <strong>сухое складирование<\/strong> (dry stacking) отфильтрованных хвостов и <strong>пастовые хвосты<\/strong>.<\/li><li>Крупные аварии изменили отрасль: Маунт-Полли (Канада, 2014), Фундан / Samarco (Бразилия, 2015), <strong>Брумадинью<\/strong> (Vale, Бразилия, 2019, более 270 погибших). После них появился <strong>GISTM<\/strong> (2020) — глобальный стандарт управления хвостохранилищами. Новая роль: <strong>Engineer of Record<\/strong> и <strong>Responsible Tailings Facility Engineer<\/strong>.<\/li><\/ul>\n<h3>1.6 Управление фабрикой: автоматизация и учёт<\/h3>\n<ul><li><strong>АСУ ТП<\/strong> (process control): DCS / PLC / SCADA (ABB 800xA, Siemens PCS 7, Emerson DeltaV, Honeywell Experion, Yokogawa).<\/li><li><strong>Анализаторы в потоке<\/strong> (on-stream analyzers): содержание металла в пульпе в реальном времени; гранулометрия слива гидроциклонов.<\/li><li><strong>Системы продвинутого управления<\/strong> (APC — advanced process control) — стабилизация и оптимизация мельниц и флотации.<\/li><li><strong>Металлургический баланс<\/strong> (metallurgical accounting) — учёт металла по фабрике: сколько пришло, сколько в концентрате, сколько в хвостах. Ответственность технолога.<\/li><li><strong>Технологическая минералогия<\/strong> (process mineralogy): автоматизированные системы QEMSCAN, MLA, TIMA. Показывают раскрытие и формы потерь металла. Связка геологии и обогащения называется <strong>геометаллургией<\/strong> (geometallurgy) — очень востребованное направление.<\/li><li><strong>KPI фабрики:<\/strong> производительность (т/ч), <strong>коэффициент готовности<\/strong> (availability, %), P80, извлечение, качество концентрата, удельный расход энергии, расход реагентов (г/т), расход воды (м³/т), содержание в хвостах.<\/li><\/ul>\n<blockquote><p><strong>TMK:<\/strong> Ингичкинская фабрика перерабатывает <strong>техногенные отходы<\/strong> (старые хвосты) вольфрамового рудника. Это особая задача: материал уже измельчён, минералы частично окислены и ошламованы, а содержание низкое. Для этого нужны технологи с опытом <strong>переработки хвостов<\/strong> (tailings retreatment) и тонкого вольфрамового материала. Планы TMK по росту выпуска концентрата с 300 до 14 950 т означают и новые фабрики, и большой найм обогатителей.<\/p><\/blockquote>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Обогатительная фабрика (ОФ)<\/td><td>Concentrator / processing plant<\/td><td>Предприятие по обогащению руды<\/td><\/tr><tr><td>Рудоподготовка<\/td><td>Comminution<\/td><td>Дробление и измельчение<\/td><\/tr><tr><td>Дробление<\/td><td>Crushing<\/td><td>Уменьшение крупности кусков руды<\/td><\/tr><tr><td>Щековая дробилка<\/td><td>Jaw crusher<\/td><td>Дробилка крупного дробления с подвижной щекой<\/td><\/tr><tr><td>Конусная дробилка<\/td><td>Cone crusher / gyratory crusher<\/td><td>Дробилка с вращающимся конусом<\/td><\/tr><tr><td>Валковый пресс высокого давления<\/td><td>HPGR (high pressure grinding rolls)<\/td><td>Энергоэффективное измельчение между валками<\/td><\/tr><tr><td>Грохот<\/td><td>Screen<\/td><td>Разделение материала по крупности на ситах<\/td><\/tr><tr><td>Измельчение<\/td><td>Grinding / milling<\/td><td>Тонкое измельчение руды в мельницах<\/td><\/tr><tr><td>Мельница полусамоизмельчения<\/td><td>SAG mill (semi-autogenous grinding)<\/td><td>Мельница, где руда измельчает сама себя с добавкой шаров<\/td><\/tr><tr><td>Шаровая мельница<\/td><td>Ball mill<\/td><td>Мельница со стальными шарами<\/td><\/tr><tr><td>Мелющие тела<\/td><td>Grinding media<\/td><td>Шары и стержни для измельчения<\/td><\/tr><tr><td>Футеровка<\/td><td>Liner<\/td><td>Износостойкая облицовка мельниц<\/td><\/tr><tr><td>Классификация<\/td><td>Classification<\/td><td>Разделение по крупности в потоке пульпы<\/td><\/tr><tr><td>Гидроциклон<\/td><td>Hydrocyclone<\/td><td>Аппарат классификации центробежной силой<\/td><\/tr><tr><td>Циркулирующая нагрузка<\/td><td>Circulating load<\/td><td>Материал, возвращаемый в мельницу<\/td><\/tr><tr><td>Крупность 80%<\/td><td>P80<\/td><td>Размер, мельче которого 80% массы<\/td><\/tr><tr><td>Индекс Бонда<\/td><td>Bond Work Index<\/td><td>Показатель трудности измельчения<\/td><\/tr><tr><td>Раскрытие минералов<\/td><td>Liberation<\/td><td>Освобождение зёрен ценного минерала от породы<\/td><\/tr><tr><td>Пульпа<\/td><td>Slurry / pulp<\/td><td>Смесь измельчённой руды с водой<\/td><\/tr><tr><td>Концентрат<\/td><td>Concentrate<\/td><td>Продукт с высоким содержанием ценного минерала<\/td><\/tr><tr><td>Хвосты<\/td><td>Tailings<\/td><td>Отходы обогащения<\/td><\/tr><tr><td>Промпродукт<\/td><td>Middlings<\/td><td>Промежуточный продукт для доработки<\/td><\/tr><tr><td>Выход концентрата<\/td><td>Mass pull / yield<\/td><td>Доля массы руды, перешедшая в концентрат<\/td><\/tr><tr><td>Извлечение<\/td><td>Recovery<\/td><td>Доля металла, перешедшая в концентрат<\/td><\/tr><tr><td>Качество концентрата<\/td><td>Concentrate grade<\/td><td>Содержание ценного компонента в концентрате<\/td><\/tr><tr><td>Сгуститель<\/td><td>Thickener<\/td><td>Аппарат осаждения твёрдого из пульпы<\/td><\/tr><tr><td>Фильтр-пресс<\/td><td>Filter press<\/td><td>Аппарат обезвоживания под давлением<\/td><\/tr><tr><td>Хвостохранилище<\/td><td>Tailings storage facility (TSF)<\/td><td>Сооружение для хранения хвостов<\/td><\/tr><tr><td>Сухое складирование хвостов<\/td><td>Dry stacking<\/td><td>Складирование отфильтрованных хвостов<\/td><\/tr><tr><td>Металлургический баланс<\/td><td>Metallurgical accounting / mass balance<\/td><td>Учёт металла по продуктам фабрики<\/td><\/tr><tr><td>Технологическая минералогия<\/td><td>Process mineralogy<\/td><td>Изучение минералогии для технологии<\/td><\/tr><tr><td>Геометаллургия<\/td><td>Geometallurgy<\/td><td>Связка геологии и технологии переработки<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли обогатительной фабрики<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Зона ответственности<\/th><th>Маркеры уровня<\/th><\/tr><\/thead><tbody><tr><td>Директор / начальник ОФ<\/td><td>Processing Manager / Concentrator Manager<\/td><td>Вся фабрика: производство, люди, бюджет, безопасность<\/td><td>Производительность (млн т/год), продукция, численность<\/td><\/tr><tr><td>Главный технолог / ведущий обогатитель<\/td><td>Chief / Senior Metallurgist<\/td><td>Технология, баланс, оптимизация, испытания<\/td><td>Проекты с цифрами «было → стало»<\/td><\/tr><tr><td>Технолог фабрики<\/td><td>Plant Metallurgist / Process Engineer<\/td><td>Ежедневная технология участка<\/td><td>Схема, реагенты, KPI участка<\/td><\/tr><tr><td>Начальник смены / участка<\/td><td>Shift Supervisor / Area Supervisor<\/td><td>Производство в смене<\/td><td>Численность, стабильность<\/td><\/tr><tr><td>Инженер по технологической минералогии<\/td><td>Process Mineralogist / Geometallurgist<\/td><td>Минералогия потерь, модели переработки<\/td><td>QEMSCAN/MLA, геометаллургические модели<\/td><\/tr><tr><td>Инженер АСУ ТП<\/td><td>Process Control Engineer<\/td><td>DCS, APC, контуры регулирования<\/td><td>Системы, проекты APC с эффектом<\/td><\/tr><tr><td>Инженер по хвостохранилищам<\/td><td>Tailings Engineer / Engineer of Record<\/td><td>Безопасность хвостохранилищ<\/td><td>GISTM, мониторинг, проектирование<\/td><\/tr><tr><td>Механик фабрики<\/td><td>Fixed Plant Maintenance Superintendent<\/td><td>ТОиР дробилок, мельниц, насосов<\/td><td>Готовность фабрики, крупные ремонты мельниц<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга технолога-обогатителя<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Назовите содержание в питании, качество концентрата, извлечение и производительность вашей фабрики»<\/td><td>Четыре цифры сразу, в правильных единицах, с разбросом по сменам<\/td><td>Не помнит или называет только одну цифру<\/td><\/tr><tr><td>«Где на кривой \"качество — извлечение\" работала фабрика и почему?»<\/td><td>Объясняет экономику: цена, штрафы за примеси, требования покупателя<\/td><td>Не понимает компромисса<\/td><\/tr><tr><td>«Какой P80 и как вы его контролировали?»<\/td><td>Цифра, анализаторы, циклоны, влияние на флотацию<\/td><td>«Помол нормальный»<\/td><\/tr><tr><td>«Где основные потери металла? Как вы это узнали?»<\/td><td>Классы крупности, минералогия потерь, сростки, шламы; данные QEMSCAN/MLA<\/td><td>«В хвостах» без анализа<\/td><\/tr><tr><td>«Какой проект улучшения вы вели лично? Какой результат?»<\/td><td>Конкретный проект, цифры, затраты, сроки, роль<\/td><td>Перечисляет обязанности вместо результатов<\/td><\/tr><tr><td>(Вольфрам) «Как вы боролись с потерями вольфрама в шламах?»<\/td><td>Щадящее измельчение, ранний вывод готового класса, тонкая гравитация, флотация шламов<\/td><td>Не знает, что это главная проблема вольфрама<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать обогатителей<\/h3>\n<ul><li><strong>Крупные медно-порфировые фабрики<\/strong> — мощная школа измельчения и флотации: АГМК (рядом и с понятным контекстом), Казахстан (KAZ Minerals — Актогай, Бозшаколь; Kazzinc), Монголия (Эрдэнэт, Оюу-Толгой), Чили, Перу.<\/li><li><strong>Вольфрам и олово:<\/strong> Almonty (Португалия, Корея), Wolfram Bergbau und Hütten (Миттерзиль, Австрия), Masan High-Tech Materials (Вьетнам), китайские фабрики (Цзянси, Хунань), Россия (Приморье — с проверкой санкционных ограничений).<\/li><li><strong>Поставщики оборудования и технологий:<\/strong> Metso, FLSmidth, Weir — у них работают тех
