":"Отсюда отдельные методы: HAZOP, LOPA, SIL, MOC."},{"q":"Что такое HAZOP?","options":["Ежегодная медицинская комиссия персонала опасных производств","Стандарт отчётности об устойчивом развитии для горных компаний","Программа поощрения работников за безопасное поведение на смене и за отчёты о нарушениях","Систематический разбор возможных отклонений процесса по узлам технологической схемы"],"answer":3,"explain":"Председатель HAZOP — квалифицированная роль; спрашивайте, сколько анализов кандидат провёл в этой роли."},{"q":"Какая мера в иерархии защиты считается последним рубежом?","options":["Средства индивидуальной защиты","Устранение опасности","Инженерные меры защиты","Замена опасного вещества менее опасным"],"answer":0,"explain":"Сильный HSE-руководитель начинает с устранения и инженерных мер, а не с касок и перчаток."},{"q":"Зачем нужно управление изменениями (MOC)?","options":["Чтобы согласовывать изменения штатного расписания, должностей и окладов с профсоюзом","Чтобы своевременно обновлять сайт и документы компании","Чтобы любое изменение процесса или оборудования проходило анализ рисков","Чтобы менять поставщиков оборудования без проведения тендера"],"answer":2,"explain":"Многие крупные аварии произошли после «небольших» изменений без анализа рисков."},{"q":"Какой статус получила TMK от Responsible Minerals Initiative в 2026 г.?","options":["Статус ISO 45001","Статус GISTM","Статус Equator Principles","RMAP Conformant"],"answer":3,"explain":"Этот статус важен западным покупателям вольфрама. Поддерживать его будут специалисты по прослеживаемости."},{"q":"Почему специалист по экспортному контролю нужен производителю вольфрама и рения?","options":["Чтобы снижать таможенные пошлины на импорт оборудования, реагентов и запасных частей для завода","Изделия из этих металлов могут иметь двойное назначение, а контрагенты — санкционные риски","Чтобы оформлять командировки сотрудников и визы иностранцев","Это обязательное требование стандарта ISO 9001 для экспортёров"],"answer":1,"explain":"Классификация товаров, проверка конечных пользователей, лицензии."},{"q":"Что такое стандарты деятельности IFC?","options":["Экологические и социальные требования, которые банки развития предъявляют к проектам","Стандарты бухгалтерского учёта и финансовой отчётности, обязательные для горных компаний в мире","Требования к аккредитации испытательных лабораторий","Правила торговли металлами на Лондонской бирже металлов"],"answer":0,"explain":"Это основа для финансирования от АБР, ЕБРР и других институтов."},{"q":"Кандидат на роль директора по HSE рассказывает об инциденте: «Работник нарушил инструкцию, мы его наказали». Вывод:","options":["Сильный руководитель: поддерживает дисциплину и наказывает нарушителей","Нейтральный ответ, который ничего не говорит о кандидате","Тревожный сигнал: нет анализа корневых причин и системных изменений","Это идеальный ответ для государственной компании с процедурами"],"answer":2,"explain":"Сильный ответ — разбор причин и изменение системы, чтобы инцидент не повторился."},{"q":"Какая отрасль — самая сильная школа процессной безопасности?","options":["Розничная торговля и логистика","Информационные технологии","Банковский сектор","Нефтегазохимия"],"answer":3,"explain":"Для TMK Chemicals и гидрометаллургии это главный пул специалистов процессной безопасности."},{"q":"Что такое охват 3 (Scope 3) в учёте выбросов?","options":["Прямые выбросы от собственных печей, котлов, автотранспорта и горной техники","Выбросы по цепочке создания стоимости — у поставщиков и потребителей","Выбросы, связанные с покупной электроэнергией и теплом","Выбросы только от хвостохранилищ и отвалов предприятия"],"answer":1,"explain":"Охват 1 — прямые выбросы, охват 2 — покупная энергия, охват 3 — цепочка создания стоимости."}],"html":"<h2>0. Разминка: вспомнить Дни 17–19<\/h2>\n<ol><li>Какой метод используют для сертификации 5N–6N?<\/li><li>Что такое неопределённость измерений и прослеживаемость?<\/li><li>Чем DCS отличается от ERP?<\/li><li>Как считается OEE?<\/li><li>Что такое система противоаварийной защиты (SIS)?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>GDMS.<\/li><li>Неопределённость — количественная оценка сомнения в результате; прослеживаемость — связь результата с эталонами через цепь калибровок.<\/li><li>DCS управляет технологическим процессом (уровень 2); ERP — финансы, закупки, кадры (уровень 4).<\/li><li>Готовность × производительность × качество.<\/li><li>Автоматическая защита, переводящая процесс в безопасное состояние при опасных отклонениях.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Охрана труда и безопасность: язык и показатели<\/h3>\n<ul><li><strong>Система менеджмента<\/strong> охраны здоровья и безопасности труда — <strong>ISO 45001<\/strong>.<\/li><li><strong>Иерархия мер защиты<\/strong>: устранение опасности → замена → инженерные меры → организационные меры → средства индивидуальной защиты (СИЗ). СИЗ — последний рубеж, а не первый.<\/li><li><strong>Критические риски и критические меры контроля<\/strong> (critical control management, подход ICMM): для опасностей с возможным смертельным исходом (обрушение, падение с высоты, транспорт, энергия, химия, взрывы) определяют меры, которые обязаны работать всегда, и проверяют их на месте.<\/li><li><strong>Показатели:<\/strong><ul><li><strong>запаздывающие<\/strong> (lagging): LTIFR (частота травм с потерей рабочего времени), TRIFR (частота всех регистрируемых травм; обычно на 1 млн отработанных часов), смертельные случаи, профзаболевания;<\/li><li><strong>опережающие<\/strong> (leading): проверки критических мер, наблюдения за безопасностью, закрытые корректирующие действия, обучение.<\/li><\/ul><\/li><li><strong>Культура безопасности<\/strong>: право остановить работу (stop work authority), расследование инцидентов без поиска виноватых, отчёты о «почти случившихся» происшествиях (near miss).<\/li><\/ul>\n<h3>1.2 Промышленная (процессная) безопасность для химии и металлургии<\/h3>\n<p><strong>Процессная безопасность<\/strong> (process safety) — предотвращение крупных аварий: пожаров, взрывов, выбросов токсичных веществ. Отличается от охраны труда: низкий LTIFR <strong>не гарантирует<\/strong> отсутствия крупной аварии.<\/p>\n<p><strong>Методы анализа:<\/strong><\/p>\n<ul><li><strong>HAZID<\/strong> — идентификация опасностей на ранней стадии проекта;<\/li><li><strong>HAZOP<\/strong> — систематический разбор отклонений процесса («больше давления», «нет потока») по узлам схемы;<\/li><li><strong>LOPA<\/strong> — анализ слоёв защиты;<\/li><li><strong>SIL<\/strong> — уровень полноты безопасности систем противоаварийной защиты;<\/li><li><strong>управление изменениями<\/strong> (MOC, management of change) — любое изменение процесса проходит анализ рисков.<\/li><\/ul>\n<p><strong>Опасности переделов TMK:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Объект<\/th><th>Ключевые опасности<\/th><\/tr><\/thead><tbody><tr><td>Восстановление W, Mo, Re<\/td><td><strong>Водород<\/strong> (взрыв), высокие температуры, мелкодисперсные порошки (пыль, возгорание)<\/td><\/tr><tr><td>Гидрометаллургия (APT, РЗЭ, Re)<\/td><td>Кислоты и щёлочи, аммиак, <strong>автоклавы<\/strong> (сосуды под давлением), H₂S, пожароопасная органика экстракции, радиоактивность<\/td><\/tr><tr><td>TMK Chemicals<\/td><td><strong>Серная кислота, SO₂, SO₃<\/strong>, сера (пожары), высокое давление пара, сосуды и трубопроводы<\/td><\/tr><tr><td>Порошковая металлургия<\/td><td>Пыль кобальта и вольфрама (здоровье), прессы (травмы рук), печи с защитными атмосферами<\/td><\/tr><tr><td>Рудник и фабрика<\/td><td>Обрушения, взрывные работы, транспорт, вентиляция, электричество, хвостохранилища<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.3 Окружающая среда и закрытие<\/h3>\n<ul><li><strong>Экологическая оценка проекта<\/strong> (ОВОС / ESIA) — обязательна для новых объектов.<\/li><li><strong>Водопользование и сбросы<\/strong>, <strong>выбросы в атмосферу<\/strong> (SO₂, пыль, фториды), <strong>отходы<\/strong> (включая радиоактивные — для РЗЭ и урановых потоков).<\/li><li><strong>Хвостохранилища<\/strong> — GISTM (2020) для проектов с хвостами (День 6).<\/li><li><strong>Рекультивация и закрытие<\/strong> — план закрытия и финансовое обеспечение с начала проекта.<\/li><li><strong>Система экологического менеджмента<\/strong> — ISO 14001.<\/li><\/ul>\n<h3>1.4 ESG, финансирование и отчётность<\/h3>\n<p><strong>ESG<\/strong> (environmental, social, governance) — рамка, через которую инвесторы, банки и покупатели оценивают компанию.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Инструмент<\/th><th>Что это<\/th><th>Почему важен TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>Стандарты деятельности IFC<\/strong> (Performance Standards) и <strong>Принципы экватора<\/strong><\/td><td>Экологические и социальные требования международных банков к проектам<\/td><td>Финансирование от АБР, ЕБРР, ЕАБР, DFC, коммерческих банков<\/td><\/tr><tr><td><strong>GRI<\/strong>, <strong>ISSB (IFRS S1/S2)<\/strong><\/td><td>Стандарты отчётности об устойчивом развитии<\/td><td>Выход на рынки капитала (TMK заявляет о таких планах)<\/td><\/tr><tr><td><strong>ICMM<\/strong>, <strong>IRMA<\/strong><\/td><td>Принципы и стандарты ответственной добычи<\/td><td>Ожидания западных партнёров и покупателей<\/td><\/tr><tr><td><strong>The Copper Mark<\/strong><\/td><td>Стандарт ответственного производства (медь, молибден, никель, цинк)<\/td><td>Молибден<\/td><\/tr><tr><td><strong>Права человека и сообщества<\/strong><\/td><td>Взаимодействие с местным населением, трудовые права<\/td><td>Социальная лицензия, требования покупателей<\/td><\/tr><tr><td><strong>Климат<\/strong><\/td><td>Учёт выбросов парниковых газов (охваты 1, 2, 3), энергоэффективность<\/td><td>Требования ЕС (в т. ч. углеродное регулирование импорта) и покупателей<\/td><\/tr><\/tbody><\/table><\/div>\n<p>На сайте TMK есть разделы ESG, стратегии устойчивого развития, комплаенса и документов по цепочке поставок — значит, функция уже существует и будет расти.<\/p>\n<h3>1.5 Прослеживаемость цепочки поставок<\/h3>\n<ul><li><strong>OECD Due Diligence Guidance<\/strong> — пятиступенчатая рамка проверки цепочек поставок минерального сырья (из конфликтных и высокорисковых районов).<\/li><li><strong>Responsible Minerals Initiative (RMI)<\/strong>:<ul><li><strong>RMAP<\/strong> — аудит плавильных и перерабатывающих предприятий; <strong>TMK — RMAP Conformant<\/strong> по вольфраму (2026);<\/li><li><strong>CMRT<\/strong> — шаблон раскрытия по 3TG (олово, тантал, вольфрам, золото);<\/li><li><strong>EMRT<\/strong> — шаблон по кобальту, слюде и другим минералам.<\/li><\/ul><\/li><li><strong>Требования покупателей<\/strong>: электроника, автопром, аэрокосмос требуют прослеживаемости до рудника. Для твёрдых сплавов и автодеталей TMK это вопрос доступа к рынку.<\/li><li><strong>Санкционный комплаенс и экспортный контроль<\/strong>: проверка контрагентов, конечных пользователей, двойного назначения (вольфрам, рений и их изделия используются в оборонной промышленности). Нужны специалисты по экспортному контролю.<\/li><\/ul>\n<h3>1.6 Итог модуля 4 на одной странице<\/h3>\n<pre class=\"code\"><code>ОБОРУДОВАНИЕ: тип, производитель, масштаб, атмосфера → быстрый фильтр реального опыта; OEM — пул кандидатов\nЛАБОРАТОРИЯ: вопрос → метод → прибор → специалист; пробоподготовка; GDMS для высокой чистоты\nКАЧЕСТВО: QA ≠ QC; ISO/IEC 17025, PT, неопределённость, прослеживаемость; IATF 16949 для Smart Powder\nПРОИЗВОДСТВЕННЫЕ СИСТЕМЫ: пирамида ISA-95; РСУ, ПАЗ, историк, MES, ERP; ППР → RCM; OEE, MTBF\nБЕЗОПАСНОСТЬ И ESG: ISO 45001, критические меры, HAZOP/LOPA/SIL, MOC; ESIA, GISTM; IFC PS, GRI/ISSB; RMI RMAP, OECD<\/code><\/pre>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Охрана труда<\/td><td>Occupational health and safety (OHS)<\/td><td>Защита здоровья и безопасности работников<\/td><\/tr><tr><td>Промышленная (процессная) безопасность<\/td><td>Process safety<\/td><td>Предотвращение крупных аварий<\/td><\/tr><tr><td>Иерархия мер защиты<\/td><td>Hierarchy of controls<\/td><td>От устранения опасности до СИЗ<\/td><\/tr><tr><td>Средства индивидуальной защиты (СИЗ)<\/td><td>Personal protective equipment (PPE)<\/td><td>Последний рубеж защиты<\/td><\/tr><tr><td>Критическая мера контроля<\/td><td>Critical control<\/td><td>Мера, предотвращающая смертельный исход<\/td><\/tr><tr><td>Частота травм с потерей времени<\/td><td>LTIFR<\/td><td>Травмы с потерей рабочего времени на 1 млн часов<\/td><\/tr><tr><td>Частота регистрируемых травм<\/td><td>TRIFR<\/td><td>Все регистрируемые травмы на 1 млн часов<\/td><\/tr><tr><td>Почти случившееся происшествие<\/td><td>Near miss<\/td><td>Событие без последствий, которое могло их иметь<\/td><\/tr><tr><td>Право остановить работу<\/td><td>Stop work authority<\/td><td>Право любого работника остановить опасную работу<\/td><\/tr><tr><td>Идентификация опасностей<\/td><td>HAZID<\/td><td>Ранний анализ опасностей проекта<\/td><\/tr><tr><td>Анализ опасностей и работоспособности<\/td><td>HAZOP<\/td><td>Разбор отклонений процесса по узлам<\/td><\/tr><tr><td>Анализ слоёв защиты<\/td><td>LOPA<\/td><td>Оценка достаточности защит<\/td><\/tr><tr><td>Уровень полноты безопасности<\/td><td>Safety integrity level (SIL)<\/td><td>Требование к надёжности ПАЗ<\/td><\/tr><tr><td>Управление изменениями<\/td><td>Management of change (MOC)<\/td><td>Анализ рисков любых изменений<\/td><\/tr><tr><td>Сосуд под давлением<\/td><td>Pressure vessel<\/td><td>Автоклавы, ресиверы и др.<\/td><\/tr><tr><td>Оценка воздействия на окружающую среду<\/td><td>ESIA / EIA (ОВОС)<\/td><td>Экологическая и социальная оценка проекта<\/td><\/tr><tr><td>План закрытия<\/td><td>Closure plan<\/td><td>План вывода объекта и рекультивации<\/td><\/tr><tr><td>Устойчивое развитие<\/td><td>Sustainability<\/td><td>Учёт экологических, социальных и управленческих факторов<\/td><\/tr><tr><td>Стандарты деятельности IFC<\/td><td>IFC Performance Standards<\/td><td>Экологические и социальные требования к проектам<\/td><\/tr><tr><td>Принципы экватора<\/td><td>Equator Principles<\/td><td>Требования банков к финансированию проектов<\/td><\/tr><tr><td>Отчётность об устойчивом развитии<\/td><td>Sustainability reporting (GRI, ISSB)<\/td><td>Раскрытие ESG-информации<\/td><\/tr><tr><td>Выбросы парниковых газов (охваты 1–3)<\/td><td>GHG emissions (Scope 1, 2, 3)<\/td><td>Прямые, энергетические и цепочечные выбросы<\/td><\/tr><tr><td>Социальная лицензия<\/td><td>Social licence to operate<\/td><td>Согласие местных сообществ<\/td><\/tr><tr><td>Прослеживаемость<\/td><td>Traceability<\/td><td>Подтверждение происхождения сырья<\/td><\/tr><tr><td>Комплексная проверка цепочки поставок<\/td><td>Supply chain due diligence<\/td><td>Проверка рисков у поставщиков<\/td><\/tr><tr><td>Процесс подтверждения ответственных минералов<\/td><td>RMAP (Responsible Minerals Assurance Process)<\/td><td>Аудит перерабатывающих предприятий RMI<\/td><\/tr><tr><td>Шаблон отчётности по конфликтным минералам<\/td><td>CMRT<\/td><td>Раскрытие источников 3TG<\/td><\/tr><tr><td>Экспортный контроль<\/td><td>Export control<\/td><td>Ограничения на экспорт товаров и технологий<\/td><\/tr><tr><td>Товары двойного назначения<\/td><td>Dual-use goods<\/td><td>Товары гражданского и военного применения<\/td><\/tr><tr><td>Санкционный комплаенс<\/td><td>Sanctions compliance<\/td><td>Соблюдение санкционных режимов<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Директор по охране труда и промбезопасности<\/td><td>HSE Director / Head of HSE<\/td><td>Снижение тяжёлых инцидентов, системы критических мер, культура<\/td><td>★★<\/td><\/tr><tr><td>Инженер по процессной безопасности<\/td><td>Process Safety Engineer<\/td><td>HAZOP (вёл как председатель), LOPA, SIL, MOC<\/td><td>★★★<\/td><\/tr><tr><td>Специалист по радиационной безопасности<\/td><td>Radiation Safety Officer<\/td><td>Лицензии, дозиметрия, NORM<\/td><td>★★★<\/td><\/tr><tr><td>Руководитель по экологии<\/td><td>Environmental Manager<\/td><td>ESIA, разрешения, мониторинг, хвостохранилища<\/td><td>★★<\/td><\/tr><tr><td>Директор по ESG / устойчивому развитию<\/td><td>ESG / Sustainability Director<\/td><td>Отчётность GRI/ISSB, требования банков, рейтинги<\/td><td>★★<\/td><\/tr><tr><td>Специалист по прослеживаемости<\/td><td>Supply Chain Due Diligence Manager<\/td><td>RMAP, CMRT/EMRT, аудиты поставщиков<\/td><td>★★<\/td><\/tr><tr><td>Специалист по экспортному контролю<\/td><td>Export Control / Trade Compliance Manager<\/td><td>Классификация, лицензии, двойное назначение<\/td><td>★★<\/td><\/tr><tr><td>Специалист по работе с сообществами<\/td><td>Community Relations Manager<\/td><td>Переселение, жалобы, социальные программы<\/td><td>★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>(HSE) «Какие критические риски были на вашем объекте и как вы проверяли критические меры?»<\/td><td>Конкретные риски, верификация на месте, данные проверок<\/td><td>Говорит только о СИЗ и инструктажах<\/td><\/tr><tr><td>«Расскажите о серьёзном инциденте и что изменилось в системе после него»<\/td><td>Разбор, корневые причины, системные изменения<\/td><td>Виноват работник, вывод — «наказали»<\/td><\/tr><tr><td>(Процессная безопасность) «Сколько HAZOP вы провели как председатель? Какие рекомендации внедрили?»<\/td><td>Число, объекты, примеры рекомендаций<\/td><td>Участвовал как слушатель<\/td><\/tr><tr><td>«Как устроено управление изменениями на вашем производстве?»<\/td><td>Процедура MOC, примеры, контроль<\/td><td>Не знает термина<\/td><\/tr><tr><td>(ESG) «Какие требования банков или покупателей вы закрывали? С какими стандартами работали?»<\/td><td>IFC PS, GRI/ISSB, RMAP, конкретные аудиты<\/td><td>Только «писал отчёт об устойчивом развитии»<\/td><\/tr><tr><td>(Прослеживаемость) «Как проходили аудит RMAP и что было самым сложным?»<\/td><td>Этапы, документы, поставщики, несоответствия<\/td><td>Не участвовал<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<ul><li><strong>HSE и процессная безопасность:<\/strong> нефтегазохимия (самая сильная школа процессной безопасности), крупные горные компании, металлургия; международные подрядчики.<\/li><li><strong>Радиационная безопасность:<\/strong> уранодобыча (Навоийуран, Казатомпром), атомная отрасль, РЗЭ-производства.<\/li><li><strong>ESG и отчётность:<\/strong> крупные горные компании, банки развития и консультанты (Big Four, ERM, WSP), компании, выходившие на международные рынки капитала.<\/li><li><strong>Прослеживаемость:<\/strong> производители вольфрама, тантала, олова, кобальта с опытом RMAP; электроника и автопром.<\/li><li><strong>Экспортный контроль:<\/strong> аэрокосмос, оборонная промышленность, металлургия специальных сплавов, крупные трейдеры.<\/li><\/ul>\n<hr>\n<h2>4. Кейс-финал модуля 4<\/h2>\n<p><strong>Карта обязательных компетенций по безопасности и ESG (40 мин).<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Объект<\/th><th>Главные опасности<\/th><th>Обязательные роли (RU / EN)<\/th><th>Обязательные стандарты и процедуры<\/th><th>Где искать<\/th><th>Когда нанимать относительно пуска<\/th><\/tr><\/thead><tbody><tr><td>Гидрометаллургический передел (APT, Re, РЗЭ)<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>TMK Chemicals (серная кислота)<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Вольфрамовый рудник и фабрика<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Критерии качества:<\/strong><\/p>\n<ul><li>опасности соответствуют технологии (водород, кислоты, автоклавы, радиоактивность, горные работы);<\/li><li>указаны и охрана труда, и процессная безопасность;<\/li><li>есть роли ESG и прослеживаемости, связанные с экспортом;<\/li><li>сроки найма — до пуска, а не после.<\/li><\/ul>\n<p><strong>Teach-back.<\/strong> Объясните коллеге за 10 минут разницу между охраной труда и процессной безопасностью и почему низкий LTIFR не гарантирует отсутствия крупной аварии.<\/p>\n<hr>\n<h2>6. Рефлексия: итог модуля 4<\/h2>\n<ol><li>Какая роль из модуля 4 (оборудование, лаборатория, системы, безопасность) для TMK самая срочная?<\/li><li>Пройдите заново тест Дня 16 без подсказок. Сколько баллов?<\/li><li><strong>Обязательство:<\/strong> «Модуль 5 начинаю ___ (дата) в ___:___».<\/li><\/ol>\n<blockquote><p><strong>Правило модуля:<\/strong> две трети программы позади. Вы понимаете отрасль, процессы, критические минералы и производственные системы. Следующие два модуля — то, ради чего всё это строилось: технический подбор и оценка кандидатов. Теперь знания начнут работать на ваших реальных вакансиях каждый день.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>ICMM: «Health and Safety Critical Control Management» (бесплатно).<\/li><li>CCPS (Center for Chemical Process Safety): материалы по HAZOP, LOPA, процессной безопасности.<\/li><li>IFC Performance Standards и Equator Principles (бесплатно).<\/li><li>RMI: описание RMAP, CMRT, EMRT (бесплатно на сайте RMI); OECD Due Diligence Guidance.<\/li><li>Разделы ESG, комплаенса и цепочек поставок на сайте TMK.<\/li><\/ul>"},{"n":21,"module":5,"title":"Анализ технической вакансии и профиль компетенций","file":"module-05-technical-recruitment-talent-intelligence/day-21-job-intake-competency-profile.md","duration":"3,5 часа","challenge":"Провести (реально или в симуляции) <strong>брифинг с нанимающим менеджером<\/strong> по одной вакансии TMK и выпустить <strong>одностраничный профиль позиции<\/strong> (role brief) с результатами на 12 месяцев, обязательными требованиями и оценочной картой.","why":"Половина неудачных поисков проваливается до первого звонка кандидату: заказчик хочет «технолога с опытом», а нужен человек, который <strong>запустит конкретный передел с конкретным масштабом за конкретный срок<\/strong>. Профиль, построенный на результатах, а не на обязанностях, сокращает поиск на месяцы и защищает от найма «хорошего, но не того» человека.","checklist":[{"text":"Разминка: 5 вопросов по Модулю 4 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: типичные ошибки брифинга (25 мин)","minutes":25},{"text":"Практика: брифинг + одностраничный профиль позиции (60 мин)","minutes":60},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.2, 1.3, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Нанимающий менеджер","en":"Hiring manager","def":"Руководитель, для которого ищут кандидата"},{"ru":"Брифинг по вакансии","en":"Intake meeting / briefing","def":"Встреча для формирования задачи поиска"},{"ru":"Профиль позиции","en":"Role brief / position specification","def":"Документ с задачей, требованиями и условиями"},{"ru":"Профиль успеха","en":"Success profile","def":"Описание результатов, по которым судят об успехе"},{"ru":"Описание вакансии","en":"Job description (JD)","def":"Публичный текст о вакансии"},{"ru":"Обязательные требования","en":"Must-haves","def":"Требования, без которых кандидат не подходит"},{"ru":"Желательные требования","en":"Nice-to-haves","def":"Требования, дающие преимущество"},{"ru":"Доучиваемое","en":"Trainable","def":"То, что можно освоить за 3–6 месяцев"},{"ru":"Стоп-фактор","en":"Deal-breaker / knock-out criterion","def":"Условие, исключающее кандидата"},{"ru":"Компетенция","en":"Competency","def":"Знания, навыки и поведение для результата"},{"ru":"Модель компетенций","en":"Competency model / framework","def":"Набор компетенций с описанием уровней"},{"ru":"Оценочная карта","en":"Scorecard","def":"Критерии с весами и шкалами для оценки"},{"ru":"Шкала с описанием уровней","en":"Behaviourally anchored rating scale (BARS)","def":"Шкала, где каждый балл описан поведением"},{"ru":"Стейкхолдер","en":"Stakeholder","def":"Заинтересованная сторона в найме"},{"ru":"Грейд","en":"Grade / job level","def":"Уровень должности в системе компании"},{"ru":"Вилка вознаграждения","en":"Salary range / compensation band","def":"Диапазон оплаты"},{"ru":"Бенчмаркинг вознаграждения","en":"Compensation benchmarking","def":"Сравнение с рынком"},{"ru":"Пакет экспата","en":"Expatriate package","def":"Оклад, надбавки, жильё, перелёты, страховка и др."},{"ru":"Ценностное предложение работодателя","en":"Employer value proposition (EVP)","def":"Почему кандидату стоит прийти"},{"ru":"Вахта","en":"Rotation / fly-in fly-out (FIFO)","def":"Работа сменами с проживанием у объекта"},{"ru":"Релокация","en":"Relocation","def":"Переезд кандидата и семьи"},{"ru":"Срок закрытия","en":"Time to fill / time to hire","def":"Время от открытия до выхода кандидата"},{"ru":"Преемник","en":"Successor","def":"Сотрудник, готовящийся занять роль"},{"ru":"Локализация кадров","en":"Workforce localization / nationalization","def":"Замена экспатов местными специалистами"},{"ru":"Консультант на время","en":"Interim / fractional expert","def":"Привлечение эксперта на срок проекта"}],"quiz":[{"q":"Что важнее всего получить на брифинге с нанимающим менеджером?","options":["Полный список обязанностей из должностной инструкции","Измеримые результаты, которых человек должен достичь, и масштаб роли","Список вузов, выпускников которых предпочитает заказчик","Перечень личных качеств: ответственность, коммуникабельность, стрессоустойчивость"],"answer":1,"explain":"Результаты и масштаб определяют, какой опыт искать и что спрашивать."},{"q":"Какие пять измерений технической роли используются в курсе?","options":["Возраст, образование, стаж, язык, гражданство","Зарплата, бонус, жильё, перелёты, страховка","Отрасль, город, график, отпуск, испытательный срок","Металл, процесс, стадия, масштаб, уровень роли"],"answer":3,"explain":"Задача брифинга — договориться, какие 2–3 измерения обязательны."},{"q":"Чем профиль успеха отличается от должностной инструкции?","options":["Описывает результаты, по которым судят об успехе, а не перечень обязанностей","Пишется только на английском языке для иностранных кандидатов","Содержит только требования к образованию, стажу и сертификатам","Нужен только для топ-менеджеров уровня совета директоров и председателя правления"],"answer":0,"explain":"Например: «за 6 месяцев вывести линию на 80% мощности» вместо «обеспечивать выполнение плана»."},{"q":"Заказчик называет 15 обязательных требований при бюджете ниже рынка. Ваш первый шаг:","options":["Начать поиск по всем 15 требованиям и надеяться на удачу","Отказаться от вакансии без объяснений, чтобы не тратить время на заведомо невозможный поиск","Попросить выбрать 3–5 действительно обязательных требований и показать данные рынка","Предложить заказчику самому найти кандидата через свои связи"],"answer":2,"explain":"«Единорога» лечат приоритизацией и данными."},{"q":"Зачем оценочная карта согласуется до интервью?","options":["Чтобы кандидат заранее знал правильные ответы на вопросы","Чтобы все оценивали по одним критериям и снизить субъективность","Это прямое требование трудового законодательства Узбекистана","Чтобы сократить число этапов интервью до одного разговора"],"answer":1,"explain":"Это главная защита от решений «понравился / не понравился»."},{"q":"Что такое шкала с описанием уровней (BARS)?","options":["Шкала, где каждый балл описан конкретным поведением или опытом","Шкала оплаты труда по грейдам и уровням должностей компании","Международный рейтинг университетов по инженерным направлениям","Шкала оценки знания английского языка по уровням от A1 до C2"],"answer":0,"explain":"Например: «1 — только эксплуатация; 3 — член команды пуска; 5 — руководил пуском и вывел на проектные показатели»."},{"q":"Какой вопрос в конце брифинга помогает выявить скрытые требования?","options":["«Когда вы хотите получить первых кандидатов?»","«Какой у вас бюджет на поиск?»","«Довольны ли вы прошлым рекрутером?»","«Что заставит вас отказать сильному кандидату?»"],"answer":3,"explain":"Так всплывают требования, о которых заказчик забыл сказать: язык, гражданство, конкретный опыт."},{"q":"Почему для международного поиска стоит использовать западное название должности?","options":["Это требование LinkedIn для публикации вакансий за рубежом","Иначе сильные кандидаты не узнают «свою» роль и не откликнутся","Западные названия всегда звучат солиднее и повышают статус","Местные названия должностей запрещено переводить в документах"],"answer":1,"explain":"Например, «главный инженер» → Technical Director, а не Chief Engineer (День 5)."},{"q":"Зачем честно называть кандидату риски работы в TMK?","options":["Чтобы сократить число откликов и сэкономить время","Это требование комплаенса для государственных компаний","Кандидат, который согласился, зная риски, уходит реже","Чтобы снизить ожидания кандидата по зарплате и пакету"],"answer":2,"explain":"«Проданная мечта» превращается в ранний уход и потерянные месяцы."},{"q":"Что делать, если бюджет ниже рынка для нужного профиля?","options":["Обсудить варианты: поднять бюджет, ослабить одно измерение, разделить роль или взять консультанта","Скрыть зарплату от кандидатов до последнего этапа, чтобы не отпугнуть сильных и сэкономить бюджет","Искать только среди безработных, которые согласятся на любые условия","Предложить кандидатам «опцион на будущее» вместо рыночного вознаграждения"],"answer":0,"explain":"Ваша задача — показать заказчику данные и варианты, а не тихо проваливать поиск."}],"html":"<h2>0. Разминка: вспомнить Модуль 4<\/h2>\n<ol><li>Чем процессная безопасность отличается от охраны труда?<\/li><li>Что такое ISO/IEC 17025 и зачем аккредитация лаборатории, которая продаёт услуги?<\/li><li>Почему руководителя АСУ ТП нанимают за 12–18 месяцев до пуска?<\/li><li>Какие риски у сервисного инженера производителя на роли владельца?<\/li><li>Что такое RMAP и почему он важен для TMK?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Охрана труда — травмы работников; процессная безопасность — предотвращение крупных аварий (пожары, взрывы, выбросы).<\/li><li>Стандарт компетентности лабораторий; без признанной аккредитации клиенты и покупатели могут не принимать результаты.<\/li><li>Ошибки архитектуры систем управления дорого исправлять после пуска.<\/li><li>Позиция поставщика, нет ответственности за KPI завода, знает одного производителя.<\/li><li>Аудит RMI для перерабатывающих предприятий; TMK — RMAP Conformant по вольфраму, это важно западным покупателям.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Брифинг: структура разговора с нанимающим менеджером<\/h3>\n<p><strong>Цель брифинга<\/strong> — договориться не о «требованиях», а о <strong>задаче, которую новый человек решит<\/strong>, и о том, как вы вместе поймёте, что нашли нужного.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Блок<\/th><th>Ключевые вопросы<\/th><th>Что вы должны получить<\/th><\/tr><\/thead><tbody><tr><td><strong>1. Бизнес-контекст<\/strong><\/td><td>Какой проект или передел? Какая стадия (проект, стройка, пуск, эксплуатация, кризис)? Почему позиция открыта сейчас?<\/td><td>Стадия и причина найма<\/td><\/tr><tr><td><strong>2. Результаты<\/strong><\/td><td>Что должно измениться через 3, 6, 12 месяцев? Как вы поймёте, что человек справился?<\/td><td>3–5 измеримых результатов<\/td><\/tr><tr><td><strong>3. Масштаб<\/strong><\/td><td>Люди в подчинении, бюджет, производительность, оборудование, подрядчики<\/td><td>Цифры масштаба<\/td><\/tr><tr><td><strong>4. Обязательный опыт<\/strong><\/td><td>Без чего человек не справится? Что можно доучить за 3–6 месяцев?<\/td><td>Must-have против trainable<\/td><\/tr><tr><td><strong>5. Окружение<\/strong><\/td><td>Кому подчиняется, с кем работает, какие сложные интерфейсы (партнёры, подрядчики, госорганы)<\/td><td>Карта стейкхолдеров<\/td><\/tr><tr><td><strong>6. Условия<\/strong><\/td><td>Локация (Чирчик, Самарканд, Бухара, Навои), график (вахта или постоянно), язык работы, бюджет, релокация<\/td><td>Рамки предложения<\/td><\/tr><tr><td><strong>7. Процесс решения<\/strong><\/td><td>Кто участвует в интервью, кто принимает решение, сроки, этапы оценки<\/td><td>Согласованный процесс<\/td><\/tr><tr><td><strong>8. Рынок и риски<\/strong><\/td><td>Что уже пробовали? Кого видели? Почему не подошли? Кто идеальный кандидат из знакомых?<\/td><td>Уроки прошлых попыток, первые имена<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Правило:<\/strong> если на брифинге нет цифр масштаба и результатов, поиск начинать рано. Лучше потратить ещё 30 минут сейчас, чем 3 месяца на «не тех» кандидатов.<\/p>\n<h3>1.2 Пять измерений технической роли<\/h3>\n<p>Это обобщение «трёх фильтров геолога» (День 2) для любой технической позиции TMK:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Измерение<\/th><th>Вопрос<\/th><th>Пример (технолог APT)<\/th><\/tr><\/thead><tbody><tr><td><strong>1. Металл / сырьё<\/strong><\/td><td>С каким сырьём и продуктом?<\/td><td>Вольфрам: шеелитовый и вольфрамитовый концентрат → APT<\/td><\/tr><tr><td><strong>2. Процесс / технология<\/strong><\/td><td>Какие переделы и методы?<\/td><td>Щелочное или содовое разложение, очистка от Mo, экстракция или ионный обмен, кристаллизация<\/td><\/tr><tr><td><strong>3. Стадия<\/strong><\/td><td>Проект, пуск, эксплуатация, оптимизация, кризис?<\/td><td>Пуск новой линии и вывод на мощность<\/td><\/tr><tr><td><strong>4. Масштаб<\/strong><\/td><td>Объём, люди, бюджет, оборудование<\/td><td>Сотни или тысячи тонн APT в год, команда 20–50 человек<\/td><\/tr><tr><td><strong>5. Уровень роли<\/strong><\/td><td>Специалист, руководитель, руководитель руководителей, топ<\/td><td>Руководитель передела, подчинение главному инженеру<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Совпадение по 5 из 5<\/strong> — редкость и, скорее всего, высокая цена. Задача брифинга — договориться, <strong>какие 2–3 измерения обязательны<\/strong>, а где допустим перенос (например, опыт с молибденом вместо вольфрама при том же типе гидрометаллургии).<\/p>\n<h3>1.3 Профиль успеха: результаты вместо обязанностей<\/h3>\n<p><strong>Плохо (список обязанностей):<\/strong> «Обеспечивать выполнение производственного плана. Контролировать соблюдение технологии. Руководить персоналом».<\/p>\n<p><strong>Хорошо (результаты):<\/strong><\/p>\n<ol><li>«За 6 месяцев вывести линию APT на 80% проектной мощности при чистоте продукта по спецификации покупателя».<\/li><li>«За 12 месяцев снизить содержание Mo в APT до уровня N ppm и извлечение W на переделе довести до N%».<\/li><li>«Подготовить двух местных преемников уровня начальника смены».<\/li><\/ol>\n<p>Результаты сразу подсказывают, <strong>какой опыт нужен<\/strong> (пуск, качество, обучение людей) и <strong>какие вопросы задавать<\/strong> на интервью.<\/p>\n<h3>1.4 Компетенции и оценочная карта<\/h3>\n<p><strong>Три группы компетенций:<\/strong><\/p>\n<ul><li><strong>технические<\/strong> (из модулей 1–4): процессы, оборудование, стандарты, KPI;<\/li><li><strong>управленческие<\/strong>: построение команды, управление подрядчиками, бюджет, планирование, принятие решений в неопределённости;<\/li><li><strong>поведенческие и культурные<\/strong>: лидерство в безопасности, способность строить с нуля, передача знаний, работа в межкультурной среде, адаптивность к государственной компании и её процедурам.<\/li><\/ul>\n<p><strong>Оценочная карта<\/strong> (scorecard) — 6–8 критериев с весами и шкалой 1–5 с описанием уровней (anchored scale). Пример критерия:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Критерий (вес)<\/th><th>1 — слабо<\/th><th>3 — достаточно<\/th><th>5 — сильно<\/th><\/tr><\/thead><tbody><tr><td>Пуск гидрометаллургического передела (25%)<\/td><td>Только эксплуатация готовых линий<\/td><td>Участвовал в пуске как член команды<\/td><td>Руководил пуском, вывел на проектные показатели, приводит цифры и уроки<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Карту согласуют <strong>до<\/strong> интервью со всеми, кто оценивает. Это главная защита от решений «понравился / не понравился» (подробно — Модуль 6).<\/p>\n<h3>1.5 Названия, уровни и вознаграждение<\/h3>\n<ul><li><strong>Название должности<\/strong> — в двух системах (СНГ и запад; День 5). Для международного поиска используйте западное название, иначе сильные кандидаты не узнают «свою» роль.<\/li><li><strong>Уровень<\/strong> — по масштабу, а не по названию.<\/li><li><strong>Вознаграждение:<\/strong> соберите рамку до поиска.<ul><li><strong>Местный рынок<\/strong> — данные о зарплатах в Узбекистане и соседних странах, внутренние грейды TMK.<\/li><li><strong>Международный рынок<\/strong> — обзоры вознаграждения (рекрутинговые компании, консалтинговые обзоры, отраслевые ассоциации, например обзоры AusIMM), данные от кандидатов.<\/li><li><strong>Структура пакета экспата<\/strong>: оклад, надбавка за удалённость, жильё, перелёты, медицинская страховка, обучение детей, бонус, налоговое выравнивание (подробно — День 24).<\/li><\/ul><\/li><\/ul>\n<p><strong>Честность о цене:<\/strong> если бюджет ниже рынка для нужного профиля, скажите об этом на брифинге с данными. Варианты: поднять бюджет, ослабить одно измерение (например, масштаб), разделить роль, привлечь консультанта на время.<\/p>\n<h3>1.6 Ценностное предложение TMK (EVP) — честно<\/h3>\n<p><strong>Сильные стороны для кандидата:<\/strong><\/p>\n<ul><li>масштаб программы: более сотни проектов, государственный приоритет;<\/li><li><strong>возможность построить с нуля<\/strong> и увидеть результат своей работы;<\/li><li>критические минералы — стратегически важная, «модная» тема с международными партнёрами (США, ЕС, Корея, Япония);<\/li><li>полная цепочка в одной компании: от рудника до изделия;<\/li><li>роль в развитии страны и подготовке местных кадров.<\/li><\/ul>\n<p><strong>Честные риски, которые нужно обсуждать:<\/strong><\/p>\n<ul><li>процедуры государственной компании и скорость решений;<\/li><li>язык и культура (русский, узбекский, английский);<\/li><li>локации вне Ташкента;<\/li><li>инфраструктура для семьи экспата;<\/li><li>восприятие региона и санкционных рисков международными кандидатами.<\/li><\/ul>\n<p>Кандидат, которому вы честно назвали риски и который согласился, уходит реже, чем тот, кому «продали мечту».<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Нанимающий менеджер<\/td><td>Hiring manager<\/td><td>Руководитель, для которого ищут кандидата<\/td><\/tr><tr><td>Брифинг по вакансии<\/td><td>Intake meeting / briefing<\/td><td>Встреча для формирования задачи поиска<\/td><\/tr><tr><td>Профиль позиции<\/td><td>Role brief / position specification<\/td><td>Документ с задачей, требованиями и условиями<\/td><\/tr><tr><td>Профиль успеха<\/td><td>Success profile<\/td><td>Описание результатов, по которым судят об успехе<\/td><\/tr><tr><td>Описание вакансии<\/td><td>Job description (JD)<\/td><td>Публичный текст о вакансии<\/td><\/tr><tr><td>Обязательные требования<\/td><td>Must-haves<\/td><td>Требования, без которых кандидат не подходит<\/td><\/tr><tr><td>Желательные требования<\/td><td>Nice-to-haves<\/td><td>Требования, дающие преимущество<\/td><\/tr><tr><td>Доучиваемое<\/td><td>Trainable<\/td><td>То, что можно освоить за 3–6 месяцев<\/td><\/tr><tr><td>Стоп-фактор<\/td><td>Deal-breaker / knock-out criterion<\/td><td>Условие, исключающее кандидата<\/td><\/tr><tr><td>Компетенция<\/td><td>Competency<\/td><td>Знания, навыки и поведение для результата<\/td><\/tr><tr><td>Модель компетенций<\/td><td>Competency model / framework<\/td><td>Набор компетенций с описанием уровней<\/td><\/tr><tr><td>Оценочная карта<\/td><td>Scorecard<\/td><td>Критерии с весами и шкалами для оценки<\/td><\/tr><tr><td>Шкала с описанием уровней<\/td><td>Behaviourally anchored rating scale (BARS)<\/td><td>Шкала, где каждый балл описан поведением<\/td><\/tr><tr><td>Стейкхолдер<\/td><td>Stakeholder<\/td><td>Заинтересованная сторона в найме<\/td><\/tr><tr><td>Грейд<\/td><td>Grade / job level<\/td><td>Уровень должности в системе компании<\/td><\/tr><tr><td>Вилка вознаграждения<\/td><td>Salary range / compensation band<\/td><td>Диапазон оплаты<\/td><\/tr><tr><td>Бенчмаркинг вознаграждения<\/td><td>Compensation benchmarking<\/td><td>Сравнение с рынком<\/td><\/tr><tr><td>Пакет экспата<\/td><td>Expatriate package<\/td><td>Оклад, надбавки, жильё, перелёты, страховка и др.<\/td><\/tr><tr><td>Ценностное предложение работодателя<\/td><td>Employer value proposition (EVP)<\/td><td>Почему кандидату стоит прийти<\/td><\/tr><tr><td>Вахта<\/td><td>Rotation / fly-in fly-out (FIFO)<\/td><td>Работа сменами с проживанием у объекта<\/td><\/tr><tr><td>Релокация<\/td><td>Relocation<\/td><td>Переезд кандидата и семьи<\/td><\/tr><tr><td>Срок закрытия<\/td><td>Time to fill / time to hire<\/td><td>Время от открытия до выхода кандидата<\/td><\/tr><tr><td>Преемник<\/td><td>Successor<\/td><td>Сотрудник, готовящийся занять роль<\/td><\/tr><tr><td>Локализация кадров<\/td><td>Workforce localization / nationalization<\/td><td>Замена экспатов местными специалистами<\/td><\/tr><tr><td>Консультант на время<\/td><td>Interim / fractional expert<\/td><td>Привлечение эксперта на срок проекта<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Пять типичных ошибок брифинга<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Ошибка<\/th><th>Как выглядит<\/th><th>Как исправить<\/th><\/tr><\/thead><tbody><tr><td><strong>«Хочу такого же, как Иванов»<\/strong><\/td><td>Заказчик описывает предыдущего сотрудника<\/td><td>Спросите, какие задачи изменились; профиль строится на будущих результатах<\/td><\/tr><tr><td><strong>«Единорог»<\/strong><\/td><td>15 обязательных требований, совпадение по всем пяти измерениям, низкий бюджет<\/td><td>Попросите выбрать 3–5 must-have; покажите данные рынка<\/td><\/tr><tr><td><strong>Обязанности вместо результатов<\/strong><\/td><td>«Обеспечивать, контролировать, руководить»<\/td><td>Задайте вопрос: «Что изменится через 12 месяцев?»<\/td><\/tr><tr><td><strong>Нет владельца решения<\/strong><\/td><td>«Посмотрят все, решим вместе»<\/td><td>Зафиксируйте, кто принимает решение и в какой срок<\/td><\/tr><tr><td><strong>Скрытые требования<\/strong><\/td><td>После шорт-листа появляется «а ещё он должен знать китайский»<\/td><td>Спросите в конце брифинга: «Что заставит вас отказать сильному кандидату?»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы, которые стоит задать на каждом брифинге TMK<\/h3>\n<ol><li>Какой проект, какая стадия и какой срок пуска?<\/li><li>Какие три результата должны появиться через 12 месяцев?<\/li><li>Какие два-три измерения из пяти обязательны, а где возможен перенос?<\/li><li>Что человек должен уметь с первого дня, а что можно доучить?<\/li><li>Какой язык работы и какие требования к документации?<\/li><li>Какие ограничения по странам и компаниям (санкции, экспортный контроль, политика TMK)?<\/li><li>Кто из ваших знакомых или бывших коллег был бы идеальным кандидатом? Почему?<\/li><li>Кто входит в комиссию, кто принимает решение, сколько этапов, какие сроки?<\/li><\/ol>\n<h3>3.3 Как работать с заказчиком, который «сам знает, кого ищет»<\/h3>\n<ul><li>Опирайтесь на знания модулей 1–4: задайте 2–3 точных технических вопроса. Доверие технического директора появляется после первого вопроса, который показывает, что вы понимаете процесс.<\/li><li>Предлагайте <strong>данные<\/strong>: размер пула кандидатов, конкурирующие работодатели, вилки рынка.<\/li><li>Фиксируйте договорённости письменно: одностраничный профиль, утверждённый заказчиком, — ваш контракт на поиск.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Брифинг и профиль позиции (60 мин).<\/strong><\/p>\n<ol><li>Выберите реальную вакансию TMK (лучше всего) или одну из учебных: «Главный технолог APT», «Директор вольфрамового горнорудного комплекса», «Руководитель нано-аналитической лаборатории», «Начальник участка разделения РЗЭ».<\/li><li>Проведите брифинг с нанимающим менеджером по структуре 1.1 (или проведите его сами с собой письменно, отвечая за менеджера).<\/li><li>Выпустите <strong>одностраничный профиль позиции<\/strong>:<\/li><\/ol>\n<pre class=\"code\"><code>ПОЗИЦИЯ (RU / EN) · ПОДРАЗДЕЛЕНИЕ · ПОДЧИНЕНИЕ · ЛОКАЦИЯ · ГРАФИК · ЯЗЫК\nКОНТЕКСТ: проект, стадия, почему сейчас\nРЕЗУЛЬТАТЫ (3, 6, 12 месяцев): 3–5 измеримых пунктов\nМАСШТАБ: люди, бюджет, производительность, оборудование\nПЯТЬ ИЗМЕРЕНИЙ: металл · процесс · стадия · масштаб · уровень — что обязательно, где возможен перенос\nMUST-HAVE (3–5) · NICE-TO-HAVE (3–4) · СТОП-ФАКТОРЫ\nОЦЕНОЧНАЯ КАРТА: 6–8 критериев с весами\nВОЗНАГРАЖДЕНИЕ: рамка, структура пакета\nЦЕННОСТНОЕ ПРЕДЛОЖЕНИЕ И ЧЕСТНЫЕ РИСКИ\nПРОЦЕСС: этапы, участники, сроки, кто решает<\/code><\/pre>\n<ol><li>Если брифинг реальный — отправьте профиль заказчику на утверждение.<\/li><\/ol>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какой блок брифинга дался тяжелее всего? Почему?<\/li><li>Какие 2–3 измерения из пяти вы определили обязательными для выбранной вакансии?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 22: карта талантов и компании-доноры».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> одностраничный профиль, утверждённый заказчиком, — это ваш контракт на поиск. С ним вы перестаёте быть «исполнителем заявки» и становитесь партнёром, который управляет поиском.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>G. Smart, R. Street, <em>Who: The A Method for Hiring<\/em> — профиль успеха (scorecard) и структурированный отбор.<\/li><li>L. Adler, <em>Hire With Your Head<\/em> — «performance profiles»: описание вакансии через результаты.<\/li><li>Материалы SHRM и CIPD о брифинге с нанимающим менеджером (intake meeting).<\/li><li>Обзоры вознаграждения рекрутинговых компаний и отраслевых ассоциаций (например, обзоры AusIMM) — для понимания рынка.<\/li><\/ul>"},{"n":22,"module":5,"title":"Карта талантов: компании-доноры, география и размер рынка кандидатов","file":"module-05-technical-recruitment-talent-intelligence/day-22-talent-mapping-donor-companies.md","duration":"3,5 часа","challenge":"Построить <strong>карту талантов<\/strong> для одной позиции TMK: 25–30 целевых компаний, сгруппированных по приоритету, оценка размера пула, конкурирующие работодатели, первые 20 имён.","why":"Executive Search отличается от «размещения вакансии» тем, что вы <strong>идёте к людям, которые не ищут работу<\/strong>. Чтобы их найти, нужна карта: где они работают, сколько их, кто ещё за ними охотится. Карта талантов — главный актив рекрутера отрасли: построенная один раз, она работает на десятки вакансий TMK.","checklist":[{"text":"Разминка: 5 вопросов по Дню 21 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: качество карты (25 мин)","minutes":25},{"text":"Практика: карта талантов на 25–30 компаний и 20 имён (60 мин)","minutes":60},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.2, 1.3, 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Карта талантов","en":"Talent map / market map","def":"Структурированное описание рынка кандидатов"},{"ru":"Компания-донор (целевая компания)","en":"Target company / source company","def":"Компания, где работают нужные специалисты"},{"ru":"Список целевых компаний","en":"Target company list","def":"Перечень доноров с приоритетами"},{"ru":"Исследование рынка","en":"Market research / talent intelligence","def":"Сбор данных о кандидатах и компаниях"},{"ru":"Картирование оргструктуры","en":"Org charting / organizational mapping","def":"Восстановление структуры подразделений донора"},{"ru":"Пассивный кандидат","en":"Passive candidate","def":"Специалист, который не ищет работу"},{"ru":"Активный кандидат","en":"Active candidate","def":"Специалист в поиске"},{"ru":"Пул кандидатов","en":"Talent pool","def":"Совокупность потенциальных кандидатов"},{"ru":"Размер рынка талантов","en":"Talent pool sizing","def":"Оценка числа подходящих людей"},{"ru":"Лонг-лист","en":"Long list","def":"Широкий список потенциальных кандидатов"},{"ru":"Шорт-лист","en":"Shortlist","def":"Отобранные кандидаты для заказчика"},{"ru":"Смежная отрасль","en":"Adjacent industry","def":"Отрасль с переносимым опытом"},{"ru":"Переносимые навыки","en":"Transferable skills","def":"Навыки, применимые в другой роли"},{"ru":"Досягаемость","en":"Accessibility / poachability","def":"Возможность привлечь кандидата"},{"ru":"Запрет на переманивание","en":"Non-solicitation clause","def":"Договорное ограничение на найм сотрудников"},{"ru":"Запрет на конкуренцию","en":"Non-compete clause","def":"Ограничение работы у конкурента"},{"ru":"Удерживающий бонус","en":"Retention bonus","def":"Выплата за то, чтобы сотрудник остался"},{"ru":"Рыночный сигнал","en":"Market signal / trigger event","def":"Событие, открывающее доступ к кандидатам"},{"ru":"Конкурент за таланты","en":"Talent competitor","def":"Работодатель, ищущий тех же людей"},{"ru":"Диаспора и соотечественники","en":"Diaspora / returnees","def":"Специалисты из страны, работающие за рубежом"},{"ru":"Рекомендация","en":"Referral","def":"Кандидат по совету другого человека"},{"ru":"Отраслевое сообщество","en":"Professional community / network","def":"Ассоциации, конференции, группы"},{"ru":"Конверсия","en":"Conversion rate","def":"Доля перешедших на следующий этап"},{"ru":"Конфиденциальный поиск","en":"Confidential search","def":"Поиск без раскрытия заказчика"},{"ru":"Аналитика рынка труда","en":"Labour market intelligence","def":"Данные о зарплатах, спросе, предложении"}],"quiz":[{"q":"Чем Executive Search принципиально отличается от размещения вакансии?","options":["Использует только LinkedIn и платные базы резюме","Работает только с безработными и активно ищущими кандидатами","Не требует брифинга с заказчиком и профиля позиции","Целенаправленно выходит на людей, которые сейчас не ищут работу"],"answer":3,"explain":"Отсюда необходимость карты: нужно знать, где эти люди работают."},{"q":"Главный критерий выбора компании-донора:","options":["Известность бренда компании на мировом рынке","Совпадение процесса (передела), а не только металла","Расположение головного офиса компании в столице","Число подписчиков страницы компании в LinkedIn"],"answer":1,"explain":"Компания может работать с вольфрамом, но не иметь нужного передела (например, только торговля)."},{"q":"Что такое кольцо 2 в карте талантов?","options":["Компании со смежными процессами и переносимым опытом","Прямые аналоги TMK по процессу","Компании, с которыми запрещено работать","Компании, где работают бывшие сотрудники TMK"],"answer":0,"explain":"Например, молибден вместо вольфрама или гидрометаллургия урана для задач по РЗЭ."},{"q":"Почему важно оценить размер пула до начала поиска?","options":["Чтобы определить стоимость рекламы вакансии на сайтах","Чтобы выбрать цвет и шаблон презентации для заказчика","Чтобы управлять ожиданиями заказчика по срокам и решить, нужно ли расширять поиск","Это требование трудового законодательства при найме иностранных специалистов в Узбекистане"],"answer":2,"explain":"Если в реальном пуле 3–7 человек, заказчик должен знать это до старта."},{"q":"Какой канал особенно ценен для TMK и часто недооценён?","options":["Объявления в газетах","Кадровые агентства временного персонала и аутстаффинга","Студенты первого курса","Узбекские специалисты, работающие за рубежом"],"answer":3,"explain":"Мотивация вернуться, язык, культура и международный опыт."},{"q":"Какое событие — сигнал доступности кандидатов?","options":["Закрытие завода или сокращения у компании-донора","Рекордная прибыль компании-донора","Повышение зарплат в компании-доноре","Выплата сотрудникам донора удерживающих бонусов на два года"],"answer":0,"explain":"Б, В и Г — наоборот, сигналы трудного поиска."},{"q":"Что нельзя использовать при построении карты?","options":["Программы конференций и списки докладчиков","Конфиденциальные документы бывших работодателей кандидатов","Годовые отчёты, пресс-релизы и презентации компаний для инвесторов","Публичные технические отчёты NI 43-101 и JORC"],"answer":1,"explain":"Это неэтично и создаёт юридические риски для TMK."},{"q":"Какие ограничения нужно отметить для каждой компании в карте?","options":["Цвет логотипа, шрифт сайта и стиль корпоративных материалов и презентаций","Количество офисов компании в мире и их адреса","Год основания компании и имена её основателей","Санкции, экспортный контроль, договорные ограничения, исключения заказчика"],"answer":3,"explain":"Эти ограничения определяют досягаемость кандидатов."},{"q":"Заказчик ждёт «пять сильных кандидатов за две недели», а реальный пул в кольце 1 — 20 человек. Ваш шаг:","options":["Согласиться на срок и начать поиск, чтобы не спорить с заказчиком","Отказаться от вакансии, потому что сроки нереалистичны","Показать размер пула и конкурентов, предложить реалистичный срок и работу с кольцом 2","Предложить заказчику понизить требования до любого инженера с опытом в металлургии"],"answer":2,"explain":"Управление ожиданиями на данных — ключевой навык эксперта по поиску."},{"q":"Почему карта талантов — актив TMK, а не одной вакансии?","options":["Однотипные потребности TMK повторяются, и одна карта обслуживает много вакансий","Карту можно выгодно продать конкурентам и агентствам","Карта нужна только для ежеквартального отчёта руководству о работе отдела подбора","Карту требуют аудиторы при проверке отчётности по МСФО"],"answer":0,"explain":"Живая карта сокращает каждый следующий поиск."}],"html":"<h2>0. Разминка: вспомнить День 21<\/h2>\n<ol><li>Какие восемь блоков у брифинга с нанимающим менеджером?<\/li><li>Назовите пять измерений технической роли.<\/li><li>Чем профиль успеха отличается от должностной инструкции?<\/li><li>Что такое оценочная карта и шкала BARS?<\/li><li>Какой вопрос выявляет скрытые требования заказчика?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Бизнес-контекст, результаты, масштаб, обязательный опыт, окружение, условия, процесс решения, рынок и риски.<\/li><li>Металл, процесс, стадия, масштаб, уровень роли.<\/li><li>Описывает результаты, а не обязанности.<\/li><li>Критерии с весами и шкалой, где каждый балл описан поведением или опытом.<\/li><li>«Что заставит вас отказать сильному кандидату?»<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Что такое карта талантов<\/h3>\n<p><strong>Карта талантов<\/strong> (talent map, market map) — структурированное описание рынка кандидатов для роли или семейства ролей:<\/p>\n<ul><li><strong>целевые компании<\/strong> (компании-доноры), где работают нужные люди;<\/li><li><strong>структура подразделений<\/strong> в этих компаниях: где сидит роль, кому подчиняется;<\/li><li><strong>имена<\/strong> людей на нужных позициях и уровнях;<\/li><li><strong>оценка пула<\/strong>: сколько таких людей реально существует и сколько из них досягаемы;<\/li><li><strong>рыночные сигналы<\/strong>: кто увольняется, где закрытия и слияния, кто конкурирует за тех же людей.<\/li><\/ul>\n<p><strong>Зачем это TMK:<\/strong> у TMK десятки однотипных потребностей (технологи W/Mo, гидрометаллурги, специалисты по качеству). Одна карта «вольфрамовая цепочка» обслуживает много вакансий подряд и становится <strong>конкурентным преимуществом компании<\/strong>.<\/p>\n<h3>1.2 Как выбирать компании-доноры<\/h3>\n<p><strong>Шесть критериев совпадения<\/strong> (из пяти измерений роли плюс культура):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Критерий<\/th><th>Вопрос<\/th><\/tr><\/thead><tbody><tr><td>Процесс<\/td><td>Есть ли в компании тот же передел (не просто тот же металл)?<\/td><\/tr><tr><td>Масштаб<\/td><td>Сопоставим ли объём производства и команды?<\/td><\/tr><tr><td>Стадия<\/td><td>Есть ли опыт пуска, проекта, эксплуатации — какой нужен?<\/td><\/tr><tr><td>Стандарты<\/td><td>Работает ли компания по нужным стандартам (JORC, ISO/IEC 17025, IATF 16949, RMAP)?<\/td><\/tr><tr><td>Культура и язык<\/td><td>Насколько легко человеку адаптироваться в Узбекистане и государственной компании?<\/td><\/tr><tr><td>Досягаемость<\/td><td>Можно ли переманить: санкции, экспортный контроль, юридические ограничения, лояльность, вознаграждение?<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Приоритизация<\/strong> — три кольца:<\/p>\n<ul><li><strong>кольцо 1<\/strong> — прямые аналоги TMK по процессу (например, производители APT и твёрдых сплавов);<\/li><li><strong>кольцо 2<\/strong> — смежные процессы (молибден вместо вольфрама; гидрометаллургия урана для РЗЭ из растворов; магниты для порошковой металлургии);<\/li><li><strong>кольцо 3<\/strong> — «переносимые» отрасли (химия для процессной безопасности, автопром для качества Smart Powder, коммерческие лаборатории для аналитиков).<\/li><\/ul>\n<h3>1.3 География и источники кандидатов для TMK<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Регион<\/th><th>Сильные стороны<\/th><th>Ограничения<\/th><\/tr><\/thead><tbody><tr><td><strong>Узбекистан<\/strong><\/td><td>Язык, культура, семья рядом; АГМК, НГМК, Навоийуран, химия, университеты<\/td><td>Узкий пул по редким переделам; конкуренция внутри страны<\/td><\/tr><tr><td><strong>Узбекистанцы за рубежом<\/strong> (Россия, Казахстан, Корея, Турция, ЕС, США)<\/td><td>Возвращение домой, язык, понимание культуры, международный опыт<\/td><td>Нужна точечная работа; часть живёт за рубежом с семьями<\/td><\/tr><tr><td><strong>Казахстан<\/strong><\/td><td>Русский язык, советская школа, международные стандарты (KAZRC, западные компании)<\/td><td>Конкуренция местных проектов, в том числе вольфрамовых<\/td><\/tr><tr><td><strong>Россия<\/strong><\/td><td>Большой пул по W, Mo, РЗЭ, твёрдым сплавам, урану<\/td><td>Санкционный и репутационный комплаенс, ограничения партнёров TMK<\/td><\/tr><tr><td><strong>Монголия, Армения, Кыргызстан<\/strong><\/td><td>Медь-молибден, золото; русский язык<\/td><td>Небольшие пулы<\/td><\/tr><tr><td><strong>Китай<\/strong><\/td><td>Крупнейший пул по W и РЗЭ<\/td><td>Экспортные запреты на технологии, язык, юридические риски<\/td><\/tr><tr><td><strong>Корея, Япония<\/strong><\/td><td>Твёрдые сплавы, магниты, материалы; партнёры TMK (KIGAM, JOGMEC, корейские партнёры Smart Powder)<\/td><td>Язык, уровень вознаграждения<\/td><\/tr><tr><td><strong>Вьетнам<\/strong><\/td><td>Masan High-Tech Materials (вольфрам)<\/td><td>Язык<\/td><\/tr><tr><td><strong>Европа<\/strong> (Австрия, Германия, Швеция, Финляндия, Бельгия, Эстония, Польша)<\/td><td>Plansee, H.C. Starck Tungsten, Sandvik, Umicore, Solvay, Neo Performance Materials, KGHM<\/td><td>Вознаграждение, мотивация к переезду<\/td><\/tr><tr><td><strong>Австралия, Канада, ЮАР<\/strong><\/td><td>Горное дело, гидрометаллургия, JORC, РЗЭ, литий, крупный пул экспатов<\/td><td>Вознаграждение, дальность<\/td><\/tr><tr><td><strong>Турция, Индия<\/strong><\/td><td>Металлургия, автокомпоненты, химия; Турция — подрядчики в регионе<\/td><td>Отбор по уровню стандартов<\/td><\/tr><tr><td><strong>Ближний Восток<\/strong> (Саудовская Аравия, Оман)<\/td><td>Ma'aden и проекты региона; много экспатов-горняков<\/td><td>Конкуренция за тех же экспатов<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Отдельный канал — соотечественники.<\/strong> Узбекские специалисты за рубежом (выпускники зарубежных вузов, инженеры международных компаний) — сильная аудитория для TMK: мотивация вернуться, язык, культура. Ищите через сообщества выпускников, профессиональные сети, государственные программы поддержки талантов и диаспоры.<\/p>\n<h3>1.4 Оценка размера пула<\/h3>\n<p>Простая воронка «сверху вниз» для одной роли:<\/p>\n<pre class=\"code\"><code>Компаний с нужным переделом в мире → людей на нужном уровне в каждой → всего людей в «целевой роли»\n→ минус недосягаемые (санкции, юридические ограничения, недавно сменили работу, слишком высокий уровень вознаграждения)\n→ минус несовместимые по языку и релокации\n→ РЕАЛЬНЫЙ ПУЛ → ожидаемая конверсия в «интересно» (часто 10–30% для сложных переездов) → ожидаемое число кандидатов в шорт-листе<\/code><\/pre>\n<p><strong>Пример расчёта (иллюстрация, а не факт).<\/strong> Технолог APT уровня руководителя передела: 15 предприятий вне Китая × 2–3 человека = 30–45 человек → после ограничений 20–30 → интерес 15–25% → 3–7 реальных кандидатов. <strong>Вывод для заказчика:<\/strong> поиск займёт месяцы, а каждое имя ценно. Нужно работать и с кольцом 2.<\/p>\n<h3>1.5 Источники информации для карты<\/h3>\n<ul><li><strong>Сайты компаний<\/strong>, годовые отчёты, пресс-релизы, презентации для инвесторов (структура, руководители, проекты).<\/li><li><strong>Технические отчёты<\/strong> NI 43-101 и JORC (День 3) — имена экспертов.<\/li><li><strong>LinkedIn<\/strong>: страницы компаний, сотрудники по ключевым словам, изменения должностей.<\/li><li><strong>Конференции и выставки<\/strong>: программы и списки докладчиков (ITIA, IMOA, REIA, ALTA, Plansee Seminar, PowderMet, Euro PM, Mining &amp; Metals Central Asia, UIMF, MINEX).<\/li><li><strong>Патенты и публикации<\/strong> (День 23): изобретатели и авторы с аффилиацией.<\/li><li><strong>Отраслевые ассоциации<\/strong>: списки членов, комитеты, рабочие группы.<\/li><li><strong>Новости и рыночные сигналы<\/strong>: закрытия, слияния, задержки проектов, смены руководства.<\/li><li><strong>Собственная сеть<\/strong>: рекомендации кандидатов и экспертов («кого вы считаете лучшим в этом процессе?»).<\/li><\/ul>\n<h3>1.6 Конкуренты за таланты и рыночные сигналы<\/h3>\n<ul><li><strong>Кто ещё нанимает:<\/strong> западные вольфрамовые и РЗЭ-проекты (США, ЕС, Корея, Казахстан, Австралия), производители батарейных материалов, государственные программы.<\/li><li><strong>Сигналы доступности кандидатов:<\/strong> сокращения в литии и никеле 2023–2025 гг., закрытия заводов, слияния и поглощения (например, смена владельца H.C. Starck Tungsten в 2024 г.), завершение строительства крупных проектов.<\/li><li><strong>Сигналы риска:<\/strong> компания-донор только что подняла зарплаты; кандидаты получили удерживающие бонусы; запрет на найм бывших сотрудников по договорам.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Карта талантов<\/td><td>Talent map / market map<\/td><td>Структурированное описание рынка кандидатов<\/td><\/tr><tr><td>Компания-донор (целевая компания)<\/td><td>Target company / source company<\/td><td>Компания, где работают нужные специалисты<\/td><\/tr><tr><td>Список целевых компаний<\/td><td>Target company list<\/td><td>Перечень доноров с приоритетами<\/td><\/tr><tr><td>Исследование рынка<\/td><td>Market research / talent intelligence<\/td><td>Сбор данных о кандидатах и компаниях<\/td><\/tr><tr><td>Картирование оргструктуры<\/td><td>Org charting / organizational mapping<\/td><td>Восстановление структуры подразделений донора<\/td><\/tr><tr><td>Пассивный кандидат<\/td><td>Passive candidate<\/td><td>Специалист, который не ищет работу<\/td><\/tr><tr><td>Активный кандидат<\/td><td>Active candidate<\/td><td>Специалист в поиске<\/td><\/tr><tr><td>Пул кандидатов<\/td><td>Talent pool<\/td><td>Совокупность потенциальных кандидатов<\/td><\/tr><tr><td>Размер рынка талантов<\/td><td>Talent pool sizing<\/td><td>Оценка числа подходящих людей<\/td><\/tr><tr><td>Лонг-лист<\/td><td>Long list<\/td><td>Широкий список потенциальных кандидатов<\/td><\/tr><tr><td>Шорт-лист<\/td><td>Shortlist<\/td><td>Отобранные кандидаты для заказчика<\/td><\/tr><tr><td>Смежная отрасль<\/td><td>Adjacent industry<\/td><td>Отрасль с переносимым опытом<\/td><\/tr><tr><td>Переносимые навыки<\/td><td>Transferable skills<\/td><td>Навыки, применимые в другой роли<\/td><\/tr><tr><td>Досягаемость<\/td><td>Accessibility / poachability<\/td><td>Возможность привлечь кандидата<\/td><\/tr><tr><td>Запрет на переманивание<\/td><td>Non-solicitation clause<\/td><td>Договорное ограничение на найм сотрудников<\/td><\/tr><tr><td>Запрет на конкуренцию<\/td><td>Non-compete clause<\/td><td>Ограничение работы у конкурента<\/td><\/tr><tr><td>Удерживающий бонус<\/td><td>Retention bonus<\/td><td>Выплата за то, чтобы сотрудник остался<\/td><\/tr><tr><td>Рыночный сигнал<\/td><td>Market signal / trigger event<\/td><td>Событие, открывающее доступ к кандидатам<\/td><\/tr><tr><td>Конкурент за таланты<\/td><td>Talent competitor<\/td><td>Работодатель, ищущий тех же людей<\/td><\/tr><tr><td>Диаспора и соотечественники<\/td><td>Diaspora / returnees<\/td><td>Специалисты из страны, работающие за рубежом<\/td><\/tr><tr><td>Рекомендация<\/td><td>Referral<\/td><td>Кандидат по совету другого человека<\/td><\/tr><tr><td>Отраслевое сообщество<\/td><td>Professional community / network<\/td><td>Ассоциации, конференции, группы<\/td><\/tr><tr><td>Конверсия<\/td><td>Conversion rate<\/td><td>Доля перешедших на следующий этап<\/td><\/tr><tr><td>Конфиденциальный поиск<\/td><td>Confidential search<\/td><td>Поиск без раскрытия заказчика<\/td><\/tr><tr><td>Аналитика рынка труда<\/td><td>Labour market intelligence<\/td><td>Данные о зарплатах, спросе, предложении<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Признаки качественной карты<\/h3>\n<ul><li><strong>Компании выбраны по процессу<\/strong>, а не только по металлу или отрасли.<\/li><li><strong>Три кольца<\/strong> с приоритетами и логикой «почему эта компания».<\/li><li>Для ключевых доноров восстановлена <strong>структура подразделений<\/strong>: кто на каком уровне.<\/li><li><strong>Оценка размера пула<\/strong> с явными допущениями.<\/li><li><strong>Ограничения<\/strong> отмечены: санкции, экспортный контроль, договорные ограничения.<\/li><li><strong>Конкуренты за таланты<\/strong> названы.<\/li><li>Карта <strong>живёт<\/strong>: обновляется после каждого разговора и каждого рыночного сигнала.<\/li><\/ul>\n<h3>3.2 Как использовать карту в разговоре с заказчиком<\/h3>\n<ul><li>Покажите размер пула и конкурентов <strong>до<\/strong> начала поиска — это лучший способ управлять ожиданиями по срокам и бюджету.<\/li><li>Попросите заказчика отметить <strong>компании-исключения<\/strong> (партнёры, клиенты, компании с договорённостями).<\/li><li>Используйте карту как <strong>аргумент<\/strong>: «В кольце 1 реальный пул — около 25 человек, из них интерес к переезду проявят 4–6. Предлагаю параллельно работать с кольцом 2».<\/li><\/ul>\n<h3>3.3 Этика и ограничения<\/h3>\n<ul><li><strong>Не используйте конфиденциальную информацию<\/strong> бывших работодателей кандидатов (оргструктуры, зарплаты из закрытых документов).<\/li><li><strong>Уважайте договорённости TMK<\/strong> с партнёрами и клиентами (исключения из поиска).<\/li><li><strong>Персональные данные:<\/strong> соблюдайте законодательство о персональных данных (в Узбекистане — Закон «О персональных данных»; для кандидатов из ЕС — GDPR). Храните данные кандидатов в утверждённых системах TMK.<\/li><li><strong>Санкционные проверки<\/strong> — с комплаенс-службой TMK, до активного контакта с кандидатами из рискованных юрисдикций.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Карта талантов (60 мин).<\/strong> Позиция — из Дня 21 или «Главный технолог APT / Head of APT Production».<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Кольцо<\/th><th>Компания<\/th><th>Страна<\/th><th>Почему донор (процесс, масштаб, стадия)<\/th><th>Ограничения<\/th><th>Целевые роли и уровни<\/th><th>Источник<\/th><th>Имена (кол-во)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p>Требования:<\/p>\n<ul><li>25–30 компаний: кольцо 1 — 8–10, кольцо 2 — 10–12, кольцо 3 — 5–8;<\/li><li>оценка размера пула по воронке 1.4 (с допущениями);<\/li><li>3 конкурирующих работодателя;<\/li><li>первые 20 имён (LinkedIn, технические отчёты, конференции) с отметкой уровня и релевантности.<\/li><\/ul>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какой размер реального пула получился для вашей позиции? Чем это грозит срокам?<\/li><li>Какую компанию из кольца 2 вы раньше бы не рассматривали?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 23: поиск — Boolean, X-ray, патенты, публикации».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> с этого дня у вас есть первая настоящая карта талантов. Каждый разговор с кандидатом или экспертом — ещё одна строка в ней. Через полгода это будет самая ценная база данных в вашей работе.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Руководства LinkedIn Talent Solutions по talent insights и картированию рынка.<\/li><li>Программы отраслевых конференций (ITIA, IMOA, REIA, ALTA, Plansee Seminar, PowderMet, Mining &amp; Metals Central Asia, UIMF) — источник имён.<\/li><li>Отчёты консалтинговых компаний о рынке труда в горной отрасли (обзоры дефицита кадров в горной промышленности публикуют крупные консалтинговые и рекрутинговые компании).<\/li><li>Профиль TMK: <a href=\"#tmk\">../00-start/tmk-profile.md<\/a>, раздел 4 — стартовая карта потребностей.<\/li><\/ul>"},{"n":23,"module":5,"title":"Поиск кандидатов: Boolean, X-ray, патенты, публикации, конференции","file":"module-05-technical-recruitment-talent-intelligence/day-23-sourcing-boolean-xray-patents.md","duration":"3,5 часа","challenge":"Собрать <strong>набор поисковых строк<\/strong> (LinkedIn, Google X-ray, патенты, публикации) для одной позиции TMK на русском и английском и найти <strong>10 новых имён<\/strong>, которых не было в карте талантов из Дня 22.","why":"Лучшие технологи редко пишут в профиле «ищу работу», а многие вообще не обновляют LinkedIn. Их видно по патентам, статьям, докладам на конференциях, техническим отчётам. Рекрутер, который умеет искать по изобретателям и авторам, находит людей, которых не видят конкуренты, — и звонит им первым.","checklist":[{"text":"Разминка: 5 вопросов по Дню 22 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (80 мин)","minutes":80},{"text":"Термины: 25 карточек RU↔EN (20 мин)","minutes":20},{"text":"Взгляд Executive Search: качество поиска и этика (20 мин)","minutes":20},{"text":"Практика: набор поисковых строк + 10 новых имён (65 мин)","minutes":65},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Поиск кандидатов","en":"Sourcing","def":"Выявление потенциальных кандидатов"},{"ru":"Булев поиск","en":"Boolean search","def":"Поиск с операторами AND, OR, NOT"},{"ru":"Поисковая строка","en":"Search string","def":"Запрос с операторами и синонимами"},{"ru":"Словарь синонимов","en":"Synonym list / keyword taxonomy","def":"Варианты написания одного опыта"},{"ru":"X-ray поиск","en":"X-ray search","def":"Поиск по одному сайту через Google (site:)"},{"ru":"Поиск по бывшим сотрудникам","en":"Alumni / past company search","def":"Поиск людей, ушедших из компании"},{"ru":"Изобретатель","en":"Inventor","def":"Автор изобретения в патенте"},{"ru":"Патентный заявитель","en":"Patent applicant / assignee","def":"Компания, подавшая патент"},{"ru":"Патентная классификация","en":"Patent classification (CPC / IPC)","def":"Коды областей техники"},{"ru":"Патентная база","en":"Patent database","def":"Google Patents, Espacenet, Lens.org"},{"ru":"Научная публикация","en":"Scientific publication","def":"Статья в журнале или сборнике"},{"ru":"Аффилиация","en":"Affiliation","def":"Организация автора"},{"ru":"Индекс цитирования","en":"Citation index","def":"Scopus, Web of Science"},{"ru":"Доклад на конференции","en":"Conference presentation / paper","def":"Выступление с публикацией тезисов"},{"ru":"Список докладчиков","en":"Speaker list","def":"Источник имён практиков"},{"ru":"База резюме","en":"CV database / resume database","def":"hh.uz, hh.kz и др."},{"ru":"Пассивный поиск","en":"Passive sourcing","def":"Поиск людей, не ищущих работу"},{"ru":"Выход на кандидата","en":"Approach / outreach","def":"Первый контакт"},{"ru":"Персональные данные","en":"Personal data","def":"Информация о кандидате"},{"ru":"Согласие на обработку данных","en":"Consent to data processing","def":"Законное основание обработки"},{"ru":"Право на удаление","en":"Right to erasure","def":"Право кандидата удалить свои данные"},{"ru":"Система управления кандидатами","en":"Applicant tracking system (ATS) / CRM","def":"Хранилище данных о кандидатах"},{"ru":"Журнал поиска","en":"Sourcing log","def":"Запись запросов, источников и результатов"},{"ru":"Ложноположительный результат","en":"False positive","def":"Нерелевантный профиль в выдаче"},{"ru":"Охват поиска","en":"Search coverage / recall","def":"Доля найденных релевантных людей"}],"quiz":[{"q":"Зачем в поисковой строке группировать синонимы через OR в скобках?","options":["Чтобы сократить число результатов до одного самого точного профиля","Чтобы исключить нерелевантные профили из выдачи поиска","Чтобы найти людей, которые описывают тот же опыт разными словами","Чтобы поиск работал только по англоязычным профилям"],"answer":2,"explain":"Например, cemented carbide, hardmetal, tungsten carbide, твёрдые сплавы."},{"q":"Что такое X-ray поиск?","options":["Поиск по одному сайту через Google с оператором site:","Рентгеновская проверка подлинности документов кандидата","Поиск только по закрытым платным базам резюме","Поиск кандидатов по номерам телефонов в мессенджерах"],"answer":0,"explain":"Например, <code>site:linkedin.com/in \"rare earth\" \"solvent extraction\"<\/code>."},{"q":"Почему изобретатели в патентах — ценный источник кандидатов?","options":["Все изобретатели активно ищут работу после подачи патента","Патенты содержат номера телефонов и адреса всех авторов","Патенты публикуются только университетами и институтами","Это практики технологии с указанием компании, страны и даты"],"answer":3,"explain":"Повторяющиеся имена изобретателей — лидеры технологии в компании."},{"q":"Какой код патентной классификации относится к получению редкоземельных металлов?","options":["B22F","C22B 59","C22C 29","H01F 1/057"],"answer":1,"explain":"B22F — порошковая металлургия, C22C 29 — твёрдые сплавы на основе карбидов, H01F 1/057 — магниты R–Fe–B."},{"q":"Почему аббревиатура APT опасна в поиске без уточнений?","options":["Её нельзя писать латиницей в русскоязычном поиске","LinkedIn не поддерживает поиск по аббревиатурам","Она многозначна — например, означает и тип кибератаки","Её используют только в Китае и Вьетнаме"],"answer":2,"explain":"Добавляйте полное название и контекст: ammonium paratungstate, tungsten."},{"q":"Какой признак говорит о прикладном опыте автора научной статьи?","options":["Большое число цитирований статьи другими авторами","Публикация в журнале на английском языке с высоким рейтингом","Наличие учёной степени доктора или кандидата наук","Соавторство с производственной компанией или аффилиация с ней"],"answer":3,"explain":"Университетский автор без связи с производством чаще имеет лабораторный масштаб опыта."},{"q":"Какой канал обычно даёт самую высокую вероятность ответа от сильного специалиста?","options":["Рекомендация от уважаемого им коллеги","Массовая рассылка шаблонного сообщения","Размещение вакансии на сайте компании","Публикация в общем телеграм-канале вакансий"],"answer":0,"explain":"Поэтому вопрос «кого вы считаете лучшим?» задают каждому эксперту."},{"q":"Что нельзя делать с ИИ-ассистентами при поиске?","options":["Использовать их для составления списка синонимов, вариантов названий должностей и технологий","Загружать персональные данные кандидатов и конфиденциальную информацию в неодобренные сервисы","Просить черновик поисковой строки и затем проверять его вручную","Использовать их для перевода профиля кандидата с другого языка"],"answer":1,"explain":"Плюс всегда проверяйте факты: ИИ может уверенно ошибаться."},{"q":"Зачем вести журнал поиска?","options":["Это требование LinkedIn для владельцев платных аккаунтов","Чтобы отчитываться о количестве просмотренных профилей за день","Чтобы доказать трудовую занятость рекрутера руководству","Чтобы повторять и улучшать поиск и показывать заказчику охват рынка"],"answer":3,"explain":"Журнал превращает поиск из искусства в управляемый процесс."},{"q":"Какой фильтр LinkedIn особенно полезен после закрытия завода у компании-донора?","options":["Фильтр по числу контактов","Фильтр по наличию фото в профиле","Поиск по бывшей компании (Past company)","Фильтр по дате регистрации в LinkedIn"],"answer":2,"explain":"Так вы находите всю команду, которая сейчас решает, куда идти дальше."}],"html":"<h2>0. Разминка: вспомнить День 22<\/h2>\n<ol><li>Что входит в карту талантов?<\/li><li>Чем кольцо 1 отличается от кольца 2 и 3?<\/li><li>Какие шесть критериев выбора компании-донора?<\/li><li>Как оценить размер реального пула?<\/li><li>Какие источники нельзя использовать при картировании?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Целевые компании, структура подразделений, имена, оценка пула, рыночные сигналы и конкуренты.<\/li><li>Кольцо 1 — прямые аналоги по процессу; 2 — смежные процессы; 3 — переносимые отрасли.<\/li><li>Процесс, масштаб, стадия, стандарты, культура и язык, досягаемость.<\/li><li>Компании с переделом × люди на уровне → минус недосягаемые и несовместимые → ожидаемая конверсия.<\/li><li>Конфиденциальные документы бывших работодателей кандидатов.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Логика Boolean-поиска<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Оператор<\/th><th>Что делает<\/th><th>Пример<\/th><\/tr><\/thead><tbody><tr><td><code>AND<\/code><\/td><td>Оба условия<\/td><td><code>tungsten AND hydrometallurgy<\/code><\/td><\/tr><tr><td><code>OR<\/code><\/td><td>Любое из условий (синонимы)<\/td><td><code>(\"cemented carbide\" OR hardmetal OR \"tungsten carbide\")<\/code><\/td><\/tr><tr><td><code>NOT<\/code> (в Google — минус)<\/td><td>Исключение<\/td><td><code>NOT sales<\/code>, <code>-jobs<\/code><\/td><\/tr><tr><td><code>\" \"<\/code><\/td><td>Точная фраза<\/td><td><code>\"ammonium paratungstate\"<\/code><\/td><\/tr><tr><td><code>( )<\/code><\/td><td>Группировка<\/td><td><code>(APT OR \"ammonium paratungstate\") AND (process OR production)<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Главный приём — словарь синонимов.<\/strong> Один и тот же опыт пишут по-разному:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Понятие<\/th><th>Варианты написания (EN / RU)<\/th><\/tr><\/thead><tbody><tr><td>Твёрдые сплавы<\/td><td>cemented carbide, hardmetal, hard metal, tungsten carbide, WC-Co, carbide inserts / твёрдые сплавы, твердосплавный, ВК8<\/td><\/tr><tr><td>APT<\/td><td>APT, ammonium paratungstate, tungsten chemicals / паравольфрамат аммония, ПВА<\/td><\/tr><tr><td>Обогатитель<\/td><td>metallurgist, process engineer, mineral processing, concentrator, beneficiation / технолог-обогатитель, обогатительная фабрика<\/td><\/tr><tr><td>Гидрометаллургия<\/td><td>hydrometallurgy, hydromet, leaching, solvent extraction, SX, ion exchange, IX / гидрометаллургия, выщелачивание, экстракция, сорбция<\/td><\/tr><tr><td>Разделение РЗЭ<\/td><td>rare earth separation, REE separation, SX circuit, lanthanide separation / разделение РЗЭ, редкоземельные<\/td><\/tr><tr><td>Порошковая металлургия<\/td><td>powder metallurgy, PM, press and sinter, sintering, MIM / порошковая металлургия, спекание, прессование<\/td><\/tr><tr><td>Начальник смены<\/td><td>shift supervisor, shift boss, foreman / сменный мастер, начальник смены<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ловушки Boolean:<\/strong><\/p>\n<ul><li>аббревиатуры многозначны: APT — это и «advanced persistent threat» в кибербезопасности; РЗЭ ищ
