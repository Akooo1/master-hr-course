ef":"Магнитный порошок в полимерной матрице"},{"ru":"Горячедеформированный магнит","en":"Hot-deformed magnet","def":"Магнит из деформированного быстрозакалённого материала"},{"ru":"Самарий-кобальтовый магнит","en":"SmCo magnet","def":"Магнит для высоких температур"},{"ru":"Ленточное литьё","en":"Strip casting","def":"Получение тонких чешуек сплава"},{"ru":"Водородное охрупчивание","en":"Hydrogen decrepitation (HD)","def":"Разрушение сплава водородом перед размолом"},{"ru":"Струйная мельница","en":"Jet mill","def":"Размол порошка в струе инертного газа"},{"ru":"Прессование в магнитном поле","en":"Pressing in a magnetic field (alignment)","def":"Ориентация частиц при формовании"},{"ru":"Вакуумное спекание","en":"Vacuum sintering","def":"Спекание без доступа воздуха"},{"ru":"Зернограничная диффузия","en":"Grain boundary diffusion (GBD)","def":"Введение Dy/Tb по границам зёрен для роста коэрцитивной силы"},{"ru":"Остаточная индукция","en":"Remanence (Br)","def":"«Сила» магнита"},{"ru":"Коэрцитивная сила","en":"Coercivity (HcJ)","def":"Сопротивление размагничиванию"},{"ru":"Максимальное энергетическое произведение","en":"Maximum energy product (BH)max","def":"Главная характеристика магнита"},{"ru":"Гистерезисграф","en":"Hysteresisgraph","def":"Прибор для измерения магнитных свойств"},{"ru":"Марка магнита","en":"Magnet grade (N42SH и т. п.)","def":"Энергия и класс температуры"},{"ru":"Пирофорный порошок","en":"Pyrophoric powder","def":"Порошок, самовозгорающийся на воздухе"},{"ru":"Покрытие магнита","en":"Magnet coating","def":"Защита от коррозии (Ni–Cu–Ni и др.)"},{"ru":"Выход годного","en":"Yield","def":"Доля годной продукции"},{"ru":"Шлам механообработки","en":"Machining swarf","def":"Отходы шлифовки, сырьё для переработки"},{"ru":"Тяговый двигатель","en":"Traction motor","def":"Двигатель электромобиля"},{"ru":"Генератор с прямым приводом","en":"Direct-drive generator","def":"Ветрогенератор без редуктора"},{"ru":"Быстрозакалённый порошок","en":"Melt-spun powder","def":"Порошок для связанных магнитов"},{"ru":"Тантал (тигли)","en":"Tantalum crucibles","def":"Тигли для металлотермии РЗЭ"},{"ru":"Инженер по применению","en":"Application engineer","def":"Специалист по использованию магнитов в изделиях"},{"ru":"Магнитные измерения","en":"Magnetic testing","def":"Контроль Br, HcJ, (BH)max"}],"quiz":[{"q":"Как получают металлический неодим и празеодим в промышленности?","options":["Флотацией","Кучным выщелачиванием","Электролизом фторидного расплава с подачей оксида","Восстановлением водородом при комнатной температуре"],"answer":2,"explain":"При ~1 000–1 100 °C, с графитовым анодом и вольфрамовым или молибденовым катодом."},{"q":"Какое звено технологии спечённого магнита идёт сразу после ленточного литья?","options":["Водородное охрупчивание сплава","Нанесение защитного покрытия Ni–Cu–Ni","Намагничивание и контроль свойств","Электролиз фторидного расплава"],"answer":0,"explain":"Затем — струйный размол, прессование в поле, спекание."},{"q":"Что даёт зернограничная диффузия Dy или Tb?","options":["Снижение плотности магнита и его массы","Возможность получить готовый магнит без спекания и механической обработки","Защиту поверхности магнита от коррозии","Рост коэрцитивной силы при меньшем расходе тяжёлых РЗЭ"],"answer":3,"explain":"Dy или Tb вводят по границам зёрен готового магнита, а не во весь объём сплава."},{"q":"Что означает буквенный суффикс в марке N42SH?","options":["Страну производства и год выпуска магнита","Класс коэрцитивной силы и допустимой рабочей температуры","Тип защитного покрытия поверхности магнита","Размер и форму магнита по каталогу производителя"],"answer":1,"explain":"Цифра — энергетическое произведение, буквы M, H, SH, UH, EH, AH — классы по коэрцитивности и температуре."},{"q":"Почему порошок NdFeB обрабатывают в инертной атмосфере?","options":["Чтобы порошок не намагнитился раньше прессования в поле","Чтобы снизить расход электроэнергии на размол","Чтобы ускорить прессование и уменьшить износ пресс-форм","Он пирофорен, а кислород ухудшает магнитные свойства"],"answer":3,"explain":"Контроль кислорода — один из главных признаков реального опыта магнитного производства."},{"q":"Какие магниты выбирают для высоких температур и оборонной техники?","options":["Ферритовые","Связанные NdFeB","Самарий-кобальтовые","Резиновые"],"answer":2,"explain":"SmCo сохраняют свойства при высоких температурах и устойчивы к коррозии."},{"q":"Какая доля мирового производства спечённых магнитов NdFeB приходится на Китай?","options":["Около 90%","Около 30%","Около 50%","Около 10%"],"answer":0,"explain":"Следующая по величине — Япония."},{"q":"Почему технологи твёрдых сплавов — потенциальный пул для магнитного производства и наоборот?","options":["Оба производства используют флотацию для подготовки порошков","Оба — порошковая металлургия: порошок, прессование, вакуумное спекание, обработка, контроль","В обоих используют кобальт как основной материал продукта","Это одинаковые заводы, которые просто выпускают разную продукцию на одном и том же оборудовании"],"answer":1,"explain":"Переходу нужно доучиться: пирофорный порошок, ориентация в поле, магнитные измерения, покрытия."},{"q":"Как TMK может участвовать в цепочке РЗЭ уже сейчас, ещё до собственного разделения?","options":["Закупая магниты в Китае и перепродавая их в Европу","Производя электромобили на собственных мощностях в Узбекистане","Поставляя вольфрамовые и молибденовые катоды, тигли и оснастку производителям металлов и магнитов","Никак: участие в цепочке РЗЭ возможно только после строительства собственного завода разделения и магнитов"],"answer":2,"explain":"Это вывод из технологии: электролиз РЗЭ использует W и Mo катоды, спекание — тугоплавкую оснастку печей."},{"q":"Кандидат на роль технолога магнитов говорит: «Брака почти не было». Ваша реакция:","options":["Сразу рекомендовать: стабильное качество без брака — это отличный результат для любого технолога","Завершить интервью: кандидат явно преувеличивает","Перейти к вопросу о зарплате и сроках выхода на работу","Уточнить цифры выхода годного и основные причины потерь — без цифр это красный флаг"],"answer":3,"explain":"Практик знает выход годного и причины потерь: трещины, коробление, отходы механообработки."}],"html":"<h2>0. Разминка: вспомнить Дни 12–13<\/h2>\n<ol><li>Почему каскаду разделения нужны месяцы для выхода на чистоту?<\/li><li>Какие «химические хитрости» используют для отделения церия и европия?<\/li><li>Какой опыт ближе всего к задаче TMK по РЗЭ из урановых растворов?<\/li><li>Что выдаёт «теоретика» в интервью о разделении?<\/li><li>Чем опасно аммиачное омыление экстрагента?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Каскад должен набрать равновесный профиль концентраций по ступеням.<\/li><li>Церий окисляют до Ce⁴⁺, европий восстанавливают до Eu²⁺.<\/li><li>Сорбция и десорбция на полигонах скважинного подземного выщелачивания урана.<\/li><li>Не может объяснить, как изменятся продукты каскада при изменении питания; не называет ступени, потери органики, конкретные сбои.<\/li><li>Огромные объёмы сточных вод с аммонием.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Получение металлов РЗЭ<\/h3>\n<p>Оксид РЗЭ — это ещё не металл. Металл получают тремя основными способами:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Способ<\/th><th>Как<\/th><th>Для каких металлов<\/th><\/tr><\/thead><tbody><tr><td><strong>Электролиз расплавленных солей<\/strong><\/td><td>Оксид растворяют во фторидном расплаве (~1 000–1 100 °C); графитовый анод, <strong>вольфрамовый или молибденовый катод<\/strong>; металл собирается в жидком виде<\/td><td><strong>Nd, Pr, NdPr<\/strong>, La, Ce — массовые лёгкие металлы<\/td><\/tr><tr><td><strong>Металлотермия<\/strong> (кальциетермия)<\/td><td>Фторид РЗЭ восстанавливают кальцием в танталовых тиглях<\/td><td><strong>Dy, Tb, Gd<\/strong> и другие тяжёлые<\/td><\/tr><tr><td><strong>Лантанотермия + дистилляция<\/strong><\/td><td>Восстановление лантаном с отгонкой летучего металла<\/td><td><strong>Sm<\/strong>, Eu, Yb (высокое давление паров)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Дополнительно: вакуумная дистилляция и сублимация для очистки; получение лигатур, например <strong>DyFe<\/strong> (диспрозий-железо), удобных для магнитного производства.<\/p>\n<p><strong>Связь с TMK:<\/strong> вольфрамовые и молибденовые катоды и тигли — расходные материалы электролиза РЗЭ. Производители металлов РЗЭ — потенциальные клиенты продукции Чирчика.<\/p>\n<h3>1.2 Какие бывают постоянные магниты<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Состав<\/th><th>Сильные стороны<\/th><th>Применение<\/th><\/tr><\/thead><tbody><tr><td><strong>Спечённые NdFeB<\/strong><\/td><td>Nd₂Fe₁₄B (+ Pr, Dy, Tb, Co, Cu, Ga…)<\/td><td>Самые сильные магниты; высокое энергетическое произведение<\/td><td>Тяговые двигатели электромобилей, ветрогенераторы, промышленные двигатели, электроника, робототехника<\/td><\/tr><tr><td><strong>Связанные NdFeB<\/strong> (bonded)<\/td><td>Быстрозакалённый порошок NdFeB + полимер<\/td><td>Сложная форма, точные размеры<\/td><td>Малые двигатели, датчики<\/td><\/tr><tr><td><strong>Горячедеформированные NdFeB<\/strong><\/td><td>Деформация быстрозакалённого материала<\/td><td>Мелкое зерно, меньше тяжёлых РЗЭ<\/td><td>Двигатели<\/td><\/tr><tr><td><strong>SmCo<\/strong> (SmCo₅, Sm₂Co₁₇)<\/td><td>Самарий-кобальт<\/td><td>Работа при высоких температурах, коррозионная стойкость<\/td><td>Авиация, оборона, высокотемпературные двигатели<\/td><\/tr><tr><td>Ферриты<\/td><td>Оксиды железа с Sr или Ba<\/td><td>Дёшевы, без РЗЭ<\/td><td>Массовые изделия<\/td><\/tr><tr><td>AlNiCo<\/td><td>Al–Ni–Co–Fe<\/td><td>Термостабильность<\/td><td>Датчики, приборы<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>История:<\/strong> магнит NdFeB изобретён почти одновременно в начале 1980-х в Sumitomo Special Metals (спечённый) и General Motors (быстрозакалённый).<\/p>\n<h3>1.3 Технология спечённого магнита NdFeB<\/h3>\n<pre class=\"code\"><code>Плавка сплава в вакууме → ЛЕНТОЧНОЕ ЛИТЬЁ (strip casting, тонкие чешуйки сплава)\n→ ВОДОРОДНОЕ ОХРУПЧИВАНИЕ (hydrogen decrepitation) — сплав рассыпается на крупку\n→ СТРУЙНЫЙ РАЗМОЛ (jet milling) в инертном газе до ~3–5 мкм\n→ ОРИЕНТАЦИЯ В МАГНИТНОМ ПОЛЕ и прессование (в пресс-форме или изостатически)\n→ ВАКУУМНОЕ СПЕКАНИЕ (~1 050–1 100 °C) → отжиг (старение)\n→ МЕХАНИЧЕСКАЯ ОБРАБОТКА (шлифовка, резка, электроэрозия) — значительная часть массы уходит в шлам\n→ [ЗЕРНОГРАНИЧНАЯ ДИФФУЗИЯ Dy/Tb] → ПОКРЫТИЕ (Ni–Cu–Ni, эпоксид, цинк, алюминий)\n→ НАМАГНИЧИВАНИЕ → КОНТРОЛЬ (гистерезисграф: Br, HcJ, (BH)max)<\/code><\/pre>\n<p><strong>Ключевые технологические тонкости<\/strong> (то, о чём говорит практик):<\/p>\n<ul><li><strong>кислород — враг<\/strong>: порошок NdFeB пирофорен (самовозгорается на воздухе), содержание кислорода в магните ухудшает свойства. Всё — в инертной атмосфере;<\/li><li><strong>размер и распределение частиц<\/strong> после струйной мельницы определяют коэрцитивную силу;<\/li><li><strong>степень ориентации<\/strong> в поле определяет остаточную индукцию;<\/li><li><strong>зернограничная диффузия<\/strong> (grain boundary diffusion, GBD): Dy или Tb наносят на поверхность готового магнита и диффундируют по границам зёрен — коэрцитивная сила растёт при меньшем расходе дорогих тяжёлых РЗЭ;<\/li><li><strong>выход годного<\/strong> и <strong>отходы механообработки<\/strong> — главные статьи себестоимости.<\/li><\/ul>\n<p><strong>Связь с Чирчиком:<\/strong> порошок → прессование → вакуумное спекание → механообработка → контроль — <strong>та же логика, что в твёрдых сплавах WC–Co<\/strong>. Отличия: пирофорный порошок, ориентация в магнитном поле, магнитные измерения, покрытия.<\/p>\n<h3>1.4 Марки и характеристики<\/h3>\n<ul><li><strong>Br<\/strong> (остаточная индукция) — «сила» магнита, Тл.<\/li><li><strong>HcJ<\/strong> (коэрцитивная сила по намагниченности) — сопротивление размагничиванию, кА/м; растёт с добавками Dy и Tb.<\/li><li><strong>(BH)max<\/strong> (максимальное энергетическое произведение) — главная характеристика, кДж/м³ или МГс·Э.<\/li><li><strong>Марки NdFeB:<\/strong> N35 … N52 и выше — цифра соответствует (BH)max в МГс·Э; буквы M, H, SH, UH, EH, AH — классы коэрцитивной силы и, соответственно, допустимой рабочей температуры (от ~100 °C до ~200 °C и выше).<\/li><li>Тяговым двигателям нужны высококоэрцитивные марки (SH, UH и выше) — отсюда спрос на Dy и Tb.<\/li><\/ul>\n<h3>1.5 Рынок магнитов и игроки вне Китая<\/h3>\n<ul><li><strong>Китай<\/strong> производит около 90% спечённых магнитов NdFeB в мире. Крупные производители — JL Mag, Ningbo Yunsheng, Zhong Ke San Huan и другие.<\/li><li><strong>Япония:<\/strong> <strong>Proterial<\/strong> (бывш. Hitachi Metals), <strong>Shin-Etsu Chemical<\/strong>, <strong>TDK<\/strong>, <strong>Daido Electronics<\/strong> (горячедеформированные магниты).<\/li><li><strong>Европа:<\/strong> <strong>VAC<\/strong> (Vacuumschmelze, Германия; завод eVAC Magnetics в США), <strong>Neo Performance Materials<\/strong> (завод магнитов в Нарве, Эстония), Magnequench (порошки для связанных магнитов, компания группы Neo).<\/li><li><strong>США:<\/strong> <strong>MP Materials<\/strong> (Форт-Уэрт), Noveon Magnetics (магниты из переработанного сырья), USA Rare Earth (проект), производители SmCo (Arnold Magnetic Technologies, Electron Energy).<\/li><li><strong>Спрос:<\/strong> электромобили (каждый тяговый двигатель с постоянными магнитами содержит порядка 1–2 кг магнитов), ветроэнергетика (генераторы с прямым приводом), промышленные двигатели, бытовая техника, электроника, робототехника, оборона.<\/li><\/ul>\n<h3>1.6 Где здесь TMK [Аналитика]<\/h3>\n<ul><li><strong>Прямо сейчас:<\/strong> TMK — потенциальный поставщик <strong>вольфрамовых и молибденовых изделий<\/strong> (катоды, тигли, оснастка печей) для производителей металлов РЗЭ и магнитов.<\/li><li><strong>Среднесрочно:<\/strong> если цепочка РЗЭ TMK дойдёт до смешанных продуктов и оксидов — партнёрства с разделителями и металлургами.<\/li><li><strong>Кадровая синергия:<\/strong> специалисты по порошковой металлургии (вакуумное спекание, прессование, контроль) переносимы между твёрдыми сплавами, конструкционной PM (Smart Powder) и магнитами. Это расширяет пул поиска для Чирчика: <strong>технологи магнитных заводов<\/strong> — потенциальные кандидаты в твёрдые сплавы, и наоборот.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Металл РЗЭ<\/td><td>Rare earth metal<\/td><td>Металлический Nd, Pr, Dy и др.<\/td><\/tr><tr><td>Электролиз фторидного расплава<\/td><td>Fluoride molten salt electrolysis<\/td><td>Основной способ получения Nd и Pr<\/td><\/tr><tr><td>Кальциетермическое восстановление<\/td><td>Calciothermic reduction<\/td><td>Получение тяжёлых РЗЭ-металлов кальцием<\/td><\/tr><tr><td>Лигатура<\/td><td>Master alloy<\/td><td>Сплав-добавка (например, DyFe)<\/td><\/tr><tr><td>Постоянный магнит<\/td><td>Permanent magnet<\/td><td>Материал, сохраняющий намагниченность<\/td><\/tr><tr><td>Спечённый магнит NdFeB<\/td><td>Sintered NdFeB magnet<\/td><td>Самый массовый мощный магнит<\/td><\/tr><tr><td>Связанный магнит<\/td><td>Bonded magnet<\/td><td>Магнитный порошок в полимерной матрице<\/td><\/tr><tr><td>Горячедеформированный магнит<\/td><td>Hot-deformed magnet<\/td><td>Магнит из деформированного быстрозакалённого материала<\/td><\/tr><tr><td>Самарий-кобальтовый магнит<\/td><td>SmCo magnet<\/td><td>Магнит для высоких температур<\/td><\/tr><tr><td>Ленточное литьё<\/td><td>Strip casting<\/td><td>Получение тонких чешуек сплава<\/td><\/tr><tr><td>Водородное охрупчивание<\/td><td>Hydrogen decrepitation (HD)<\/td><td>Разрушение сплава водородом перед размолом<\/td><\/tr><tr><td>Струйная мельница<\/td><td>Jet mill<\/td><td>Размол порошка в струе инертного газа<\/td><\/tr><tr><td>Прессование в магнитном поле<\/td><td>Pressing in a magnetic field (alignment)<\/td><td>Ориентация частиц при формовании<\/td><\/tr><tr><td>Вакуумное спекание<\/td><td>Vacuum sintering<\/td><td>Спекание без доступа воздуха<\/td><\/tr><tr><td>Зернограничная диффузия<\/td><td>Grain boundary diffusion (GBD)<\/td><td>Введение Dy/Tb по границам зёрен для роста коэрцитивной силы<\/td><\/tr><tr><td>Остаточная индукция<\/td><td>Remanence (Br)<\/td><td>«Сила» магнита<\/td><\/tr><tr><td>Коэрцитивная сила<\/td><td>Coercivity (HcJ)<\/td><td>Сопротивление размагничиванию<\/td><\/tr><tr><td>Максимальное энергетическое произведение<\/td><td>Maximum energy product (BH)max<\/td><td>Главная характеристика магнита<\/td><\/tr><tr><td>Гистерезисграф<\/td><td>Hysteresisgraph<\/td><td>Прибор для измерения магнитных свойств<\/td><\/tr><tr><td>Марка магнита<\/td><td>Magnet grade (N42SH и т. п.)<\/td><td>Энергия и класс температуры<\/td><\/tr><tr><td>Пирофорный порошок<\/td><td>Pyrophoric powder<\/td><td>Порошок, самовозгорающийся на воздухе<\/td><\/tr><tr><td>Покрытие магнита<\/td><td>Magnet coating<\/td><td>Защита от коррозии (Ni–Cu–Ni и др.)<\/td><\/tr><tr><td>Выход годного<\/td><td>Yield<\/td><td>Доля годной продукции<\/td><\/tr><tr><td>Шлам механообработки<\/td><td>Machining swarf<\/td><td>Отходы шлифовки, сырьё для переработки<\/td><\/tr><tr><td>Тяговый двигатель<\/td><td>Traction motor<\/td><td>Двигатель электромобиля<\/td><\/tr><tr><td>Генератор с прямым приводом<\/td><td>Direct-drive generator<\/td><td>Ветрогенератор без редуктора<\/td><\/tr><tr><td>Быстрозакалённый порошок<\/td><td>Melt-spun powder<\/td><td>Порошок для связанных магнитов<\/td><\/tr><tr><td>Тантал (тигли)<\/td><td>Tantalum crucibles<\/td><td>Тигли для металлотермии РЗЭ<\/td><\/tr><tr><td>Инженер по применению<\/td><td>Application engineer<\/td><td>Специалист по использованию магнитов в изделиях<\/td><\/tr><tr><td>Магнитные измерения<\/td><td>Magnetic testing<\/td><td>Контроль Br, HcJ, (BH)max<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><th>Дефицит<\/th><\/tr><\/thead><tbody><tr><td>Электрохимик (расплавы РЗЭ)<\/td><td>Molten Salt Electrolysis Engineer (REE metals)<\/td><td>Тип ячеек, ток, выход по току, чистота металла, материалы электродов<\/td><td>★★★<\/td><\/tr><tr><td>Металлург РЗЭ-металлов<\/td><td>Rare Earth Metals Metallurgist<\/td><td>Кальциетермия, дистилляция, лигатуры<\/td><td>★★★<\/td><\/tr><tr><td>Технолог магнитного производства<\/td><td>Magnet Process Engineer (sintered NdFeB)<\/td><td>Этапы процесса, контроль кислорода, GBD, выход годного<\/td><td>★★★<\/td><\/tr><tr><td>Специалист по магнитным материалам<\/td><td>Magnetic Materials Scientist<\/td><td>Микроструктура, коэрцитивность, марки<\/td><td>★★★<\/td><\/tr><tr><td>Инженер по магнитным измерениям и качеству<\/td><td>Magnetic Testing / Quality Engineer<\/td><td>Гистерезисграф, стандарты, требования автопрома<\/td><td>★★<\/td><\/tr><tr><td>Инженер по применению магнитов<\/td><td>Application Engineer (motors)<\/td><td>Проектирование двигателей, работа с клиентами<\/td><td>★★<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы для скрининга технолога магнитов<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Какие марки вы выпускали и для каких применений?»<\/td><td>Конкретные марки (например, N48SH, 45UH), клиенты по отраслям<\/td><td>«Разные магниты»<\/td><\/tr><tr><td>«Как вы контролировали кислород в процессе?»<\/td><td>Инертные атмосферы, содержание O в ppm, влияние на свойства<\/td><td>Не знает о пирофорности порошка<\/td><\/tr><tr><td>«Какая крупность после струйной мельницы и как она влияет на коэрцитивную силу?»<\/td><td>Микроны, распределение, связь с HcJ<\/td><td>Общие слова<\/td><\/tr><tr><td>«Применяли ли вы зернограничную диффузию? Насколько снизили расход Dy/Tb?»<\/td><td>Метод нанесения, режимы, проценты экономии<\/td><td>Не знает метода<\/td><\/tr><tr><td>«Какой выход годного и где основные потери?»<\/td><td>Цифры, причины: трещины, коробление, отходы механообработки<\/td><td>«Брака почти не было»<\/td><\/tr><tr><td>«С какими требованиями автопроизводителей работали?»<\/td><td>IATF 16949, PPAP, аудиты<\/td><td>Не знает автомобильных стандартов<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.3 Где искать<\/h3>\n<ul><li><strong>Япония:<\/strong> Proterial, Shin-Etsu, TDK, Daido Electronics — сильнейшая школа вне Китая; языковой барьер.<\/li><li><strong>Европа:<\/strong> VAC (Германия), Neo Performance Materials (Эстония; русскоязычные специалисты), Magnequench, университеты TU Darmstadt и Birmingham (магнитные материалы).<\/li><li><strong>США:<\/strong> MP Materials, eVAC Magnetics, Noveon, Ames National Laboratory.<\/li><li><strong>Корея:<\/strong> производители двигателей и компонентов для электромобилей; KIGAM и KIMS (научные партнёры).<\/li><li><strong>Смежные пулы:<\/strong> технологи твёрдых сплавов и конструкционной порошковой металлургии — для переходов «магниты ↔ PM».<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Переносимые навыки (40 мин).<\/strong> Заполните таблицу сопоставления трёх производств:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Этап<\/th><th>Твёрдые сплавы WC–Co (Чирчик)<\/th><th>Конструкционная PM (Smart Powder)<\/th><th>Спечённые магниты NdFeB<\/th><th>Переносимые навыки<\/th><\/tr><\/thead><tbody><tr><td>Порошок<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Подготовка смеси<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Формование<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Спекание<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Обработка<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Контроль<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Затем сформулируйте <strong>3 вывода для поиска<\/strong>: в каких компаниях искать технологов спекания для Чирчика, кроме производителей твёрдых сплавов; какие вопросы задать «магнитчику», который претендует на роль в твёрдых сплавах; какие пробелы ему придётся закрыть.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какие три переносимых навыка между твёрдыми сплавами и магнитами вы выделили?<\/li><li>В каких двух компаниях вы начнёте искать технолога спекания для Чирчика, кроме производителей твёрдых сплавов?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 15: литий, графит, никель, кобальт и рынки W–Mo–Re. Финал модуля».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы только что расширили пул поиска для Чирчика целой отраслью. Именно такие связи отличают эксперта по поиску от исполнителя: вы видите людей там, где другие видят «не тот профиль».<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>J. M. D. Coey, <em>Magnetism and Magnetic Materials<\/em> (Cambridge University Press) — фундамент по магнитным материалам.<\/li><li>Отчёты Adamas Intelligence и Benchmark Mineral Intelligence по рынку магнитов (частично платные; бесплатные обзоры).<\/li><li>Сайты производителей (Proterial, Shin-Etsu, VAC, Neo Performance Materials) — описания марок и технологий.<\/li><li>Видео: «how neodymium magnets are made», «grain boundary diffusion magnets».<\/li><\/ul>"},{"n":15,"module":3,"title":"Литий, графит, никель, кобальт и рынки W–Mo–Re: критические минералы для TMK","file":"module-03-ree-critical-minerals/day-15-critical-minerals-markets.md","duration":"4 часа","challenge":"Собрать <strong>карту критических минералов TMK<\/strong>. Для каждого металла: какое звено цепочки целит TMK, ключевые роли, доноры, конкурирующие работодатели и дефицит. Затем пройти итоговый тест модуля.","why":"В портфеле TMK больше 25 видов сырья. Нанимающие менеджеры будут приходить с позициями по литию, графиту, никелю, кобальту, селену, теллуру, германию. Вам не нужно быть технологом каждого металла. Нужно за 10 минут понимать цепочку, ключевые переделы и где искать людей. Сегодня вы получаете этот каркас.","checklist":[{"text":"Разминка: 5 вопросов по Дням 13–14 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Кейс-финал: карта критических минералов TMK (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Итоговый тест модуля 3 ≥ 16/20 — см. <a href=\"#module-3\">README модуля<\/a> (20 мин)","minutes":20},{"text":"Teach-back: 10 минут объясняете коллеге цепочку РЗЭ и место TMK в ней","minutes":0},{"text":"Рефлексия (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.5 → тест дня. Кейс и итоговый тест модуля — до начала Модуля 4.","terms":[{"ru":"Сподуменовый концентрат","en":"Spodumene concentrate (SC6)","def":"Концентрат с ~6% Li₂O"},{"ru":"Карбонат лития","en":"Lithium carbonate","def":"Литиевый продукт для батарей и промышленности"},{"ru":"Гидроксид лития","en":"Lithium hydroxide monohydrate","def":"Продукт для высоконикелевых катодов"},{"ru":"Эквивалент карбоната лития","en":"Lithium carbonate equivalent (LCE)","def":"Единица объёма литиевой продукции"},{"ru":"Прямое извлечение лития","en":"Direct lithium extraction (DLE)","def":"Извлечение лития из рассолов сорбцией или экстракцией"},{"ru":"Испарительные бассейны","en":"Evaporation ponds","def":"Концентрирование рассола солнцем"},{"ru":"Сферический графит","en":"Spherical graphite","def":"Округлённые частицы графита для анодов"},{"ru":"Очищенный сферический графит","en":"Spherical purified graphite (SPG)","def":"Сферический графит ≥ 99,95% C"},{"ru":"Анодный материал","en":"Anode active material (AAM)","def":"Материал отрицательного электрода батареи"},{"ru":"Синтетический графит","en":"Synthetic graphite","def":"Графит из кокса, графитизация при ~3 000 °C"},{"ru":"Графитизация","en":"Graphitization","def":"Высокотемпературное превращение углерода в графит"},{"ru":"Смешанный гидроксидный осадок","en":"Mixed hydroxide precipitate (MHP)","def":"Промежуточный продукт Ni–Co"},{"ru":"Никелевый чугун","en":"Nickel pig iron (NPI)","def":"Продукт пирометаллургии латеритов для нержавеющей стали"},{"ru":"Прекурсор катодного материала","en":"Precursor cathode active material (pCAM)","def":"Полупродукт для катодов батарей"},{"ru":"Катодный материал","en":"Cathode active material (CAM)","def":"Материал положительного электрода батареи"},{"ru":"Анодный шлам","en":"Anode slimes","def":"Источник Se, Te, Au, Ag"},{"ru":"Германий / галлий / индий","en":"Germanium / gallium / indium","def":"Малые металлы с экспортными ограничениями Китая"},{"ru":"Ферровольфрам","en":"Ferrotungsten","def":"Сплав W–Fe для сталей"},{"ru":"Технический оксид молибдена","en":"Technical molybdenum oxide (roasted concentrate)","def":"Продукт обжига молибденита"},{"ru":"Перренат аммония","en":"Ammonium perrhenate (APR)","def":"Основное товарное соединение рения"},{"ru":"Переработка твёрдосплавного лома","en":"Hardmetal scrap recycling","def":"Возврат вольфрама и кобальта из лома"},{"ru":"Цинковый процесс","en":"Zinc process","def":"Переработка твёрдого сплава расплавом цинка"},{"ru":"Вторичное сырьё","en":"Secondary raw materials / scrap","def":"Сырьё из лома и отходов"},{"ru":"Закон ЕС о критическом сырье","en":"EU Critical Raw Materials Act (CRMA)","def":"Цели ЕС по добыче, переработке, рециклингу"},{"ru":"Закон США о снижении инфляции","en":"Inflation Reduction Act (IRA)","def":"Требования к происхождению батарейных минералов"},{"ru":"Шаблон отчётности о минералах","en":"CMRT / EMRT","def":"Шаблоны RMI для раскрытия источников сырья"},{"ru":"Ответственное горное дело","en":"Responsible mining (IRMA)","def":"Стандарт ответственной добычи"},{"ru":"Ценовое агентство","en":"Price reporting agency (PRA)","def":"Fastmarkets, Argus и др."},{"ru":"Стратегический проект","en":"Strategic project","def":"Статус проектов по CRMA с ускоренной поддержкой"},{"ru":"Батарейное качество","en":"Battery grade","def":"Высокая чистота для батарейных материалов"}],"quiz":[{"q":"Что такое SC6?","options":["Сподуменовый концентрат с ~6% Li₂O","Марка магнита","Сорт синтетического графита","Класс чистоты карбоната лития батарейного качества"],"answer":0,"explain":"SC6 — товарный концентрат литиевых пегматитов."},{"q":"Почему графит для анодов батарей требует сфероидизации и очистки?","options":["Чтобы увеличить размер чешуек до класса jumbo","Чтобы графит стал магнитным и лучше отделялся от примесей на сепараторах","Аноду нужны округлые частицы и чистота не ниже 99,95% C","Чтобы снизить цену концентрата для экспорта"],"answer":2,"explain":"Флотационного концентрата (94–97% C) для анодов недостаточно."},{"q":"Какая страна даёт больше половины мировой добычи никеля?","options":["Австралия","Канада","Россия","Индонезия"],"answer":3,"explain":"За счёт китайских инвестиций в пирометаллургию и HPAL."},{"q":"Почему кобальт важен для TMK уже сейчас?","options":["TMK добывает кобальт на Ингичке","Кобальт — связка твёрдых сплавов ВК6 и ВК8","Кобальт используют для флотации шеелита","Кобальт нужен для производства серной кислоты"],"answer":1,"explain":"TMK — потребитель кобальта, а значит, его цена и поставки влияют на себестоимость твёрдых сплавов."},{"q":"Откуда в основном получают селен и теллур?","options":["Из анодного шлама медного рафинирования","Из рассолов солёных озёр","Из бокситов при производстве глинозёма","Из урановых растворов после сорбции"],"answer":0,"explain":"Поэтому производство Se и Te привязано к медной отрасли."},{"q":"Какая цель ЕС по Critical Raw Materials Act касается переработки?","options":["10% потребности за счёт переработки в ЕС к 2030 г.","100% потребности за счёт переработки в ЕС к 2030 г.","Полный запрет переработки сырья за пределами ЕС","40% потребности за счёт переработки в ЕС к 2030 г."],"answer":3,"explain":"Также 10% — добыча, 25% — вторичное сырьё, не более 65% из одной страны."},{"q":"Почему переработка твёрдосплавного лома важна для вольфрамового рынка?","options":["Лом не содержит вольфрама в извлекаемых количествах, поэтому его не перерабатывают вообще","Значительная доля спроса покрывается вторичным вольфрамом, а лом содержит и кобальт","Переработка лома запрещена экспортным контролем Китая","Лом используют только как наполнитель в строительстве"],"answer":1,"explain":"Для TMK это возможный источник сырья и отдельный профиль кадров."},{"q":"Кандидат на коммерческую роль не знает, какие индексы использовались в контрактах его компании. Вывод:","options":["Это нормально: формулы цены и индексы — забота финансистов, а не коммерческого руководителя","Это плюс: он сфокусирован на клиентах, а не на цифрах","Красный флаг: коммерческий руководитель должен понимать ценообразование своего продукта","Это не важно, сначала нужно проверить его английский"],"answer":2,"explain":"Формулы цены, премии и скидки за качество — основа работы в малых металлах."},{"q":"Что такое DLE?","options":["Прямое извлечение лития из рассолов сорбцией, ионным обменом или экстракцией","Метод разделения РЗЭ на ионообменных колоннах","Стандарт прослеживаемости литиевого сырья","Тип литиевого аккумулятора с жидким электролитом для электромобилей и накопителей"],"answer":0,"explain":"DLE ускоряет переработку рассолов по сравнению с испарительными бассейнами."},{"q":"Что означает для подбора каждое новое международное партнёрство TMK?","options":["Ничего: подбор от партнёрств не зависит","Только больше командировок для руководителей","Сокращение штата за счёт приглашения иностранных специалистов на ключевые должности","Рост спроса на людей с опытом международных стандартов, аудитов и отчётности"],"answer":3,"explain":"ESG, due diligence, качество, коммерческие роли с опытом западных рынков."}],"html":"<h2>0. Разминка: вспомнить Дни 13–14<\/h2>\n<ol><li>Какие этапы проходит спечённый магнит NdFeB от сплава до изделия?<\/li><li>Что дают Dy и Tb и что такое зернограничная диффузия?<\/li><li>Почему технологи твёрдых сплавов — потенциальный пул для магнитного производства?<\/li><li>Сколько ступеней экстракции нужно на одну пару соседних РЗЭ?<\/li><li>Какой продукт РЗЭ главный для магнитов?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Плавка и ленточное литьё → водородное охрупчивание → струйный размол → прессование в магнитном поле → вакуумное спекание и отжиг → механообработка → (GBD) → покрытие → намагничивание и контроль.<\/li><li>Рост коэрцитивной силы (работа при нагреве); GBD — введение Dy/Tb по границам зёрен с меньшим расходом.<\/li><li>Оба производства — порошковая металлургия с вакуумным спеканием, прессованием и контролем.<\/li><li>Десятки.<\/li><li>NdPr-оксид.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Литий: от руды и рассола до гидроксида<\/h3>\n<p><strong>Два мира сырья:<\/strong><\/p>\n<ul><li><strong>твёрдые руды<\/strong> (сподуменовые пегматиты; Австралия, Африка, Канада, Китай, Бразилия): обогащение (тяжёлые среды + флотация) → <strong>сподуменовый концентрат SC6<\/strong> → декрепитация → сернокислотный обжиг → выщелачивание → очистка → <strong>карбонат или гидроксид лития<\/strong>;<\/li><li><strong>рассолы<\/strong> (Чили, Аргентина, Боливия, Китай): испарительные бассейны (месяцы) → концентрат → карбонат лития. <strong>Прямое извлечение лития<\/strong> (DLE — сорбенты, ионный обмен, экстракция) ускоряет процесс и повышает извлечение; первые промышленные проекты DLE запущены в Аргентине.<\/li><\/ul>\n<p><strong>Продукты:<\/strong> карбонат лития и <strong>моногидрат гидроксида лития<\/strong> батарейного качества (содержание примесей на уровне ppm); измеряется в тоннах <strong>LCE<\/strong> (эквивалент карбоната лития).<\/p>\n<p><strong>Рынок:<\/strong> после бума 2021–2022 гг. цены упали в 2023–2024 гг., часть проектов в Австралии и других странах остановили или отложили. <strong>Переработка вне Китая трудна<\/strong>: заводы гидроксида лития в Австралии выходили на мощность годами (кривые МакНалти в действии).<\/p>\n<p><strong>Кадровый вывод:<\/strong> технологи литиевых заводов, переживших трудный пуск, — ценнейший опыт. После сокращений 2023–2025 гг. часть таких людей доступна.<\/p>\n<h3>1.2 Графит: от чешуйки до анода<\/h3>\n<pre class=\"code\"><code>Руда (3–20% Cg) → флотация с многостадийной перечисткой → КОНЦЕНТРАТ (94–97% C)\n→ (для батарей) СФЕРОИДИЗАЦИЯ (округление частиц; выход 30–50% — остальное мелочь)\n→ ОЧИСТКА до ≥ 99,95% C: плавиковой кислотой (HF — Китай), термическая (2 500–3 000 °C), щелочная\n→ ПОКРЫТИЕ углеродом → АНОДНЫЙ МАТЕРИАЛ для литий-ионных батарей\nСинтетический графит: нефтяной кокс / пек → графитизация при ~3 000 °C → анод<\/code><\/pre>\n<ul><li>Китай доминирует и в природном графите, и особенно в <strong>производстве анодов<\/strong> (более 90%). С декабря 2023 г. экспорт графита из Китая лицензируется.<\/li><li>Компании вне Китая: Syrah Resources (Мозамбик; завод анодов в США), NextSource (Мадагаскар), Nouveau Monde Graphite (Канада), Talga (Швеция), <strong>POSCO Future M<\/strong> (Корея — аноды), Novonix (синтетический графит, США), Imerys Graphite &amp; Carbon, SGL Carbon.<\/li><li><strong>TMK — Тасказган:<\/strong> ближайшая цель — экспортный концентрат, к 2030 г. — полная цепочка. Значит, сначала нужны геологи (JORC) и флотаторы графита, затем — специалисты по сфероидизации, очистке и анодам (★★★ вне Китая).<\/li><\/ul>\n<h3>1.3 Никель и кобальт<\/h3>\n<ul><li><strong>Никель:<\/strong> нержавеющая сталь (основной спрос) и батареи. Индонезия даёт больше половины мировой добычи за счёт китайских инвестиций (пирометаллургия NPI/RKEF и автоклавное выщелачивание HPAL). Падение цен в 2023–2024 гг. привело к закрытиям в Австралии (BHP Nickel West, 2024) и других странах.<\/li><li><strong>Кобальт:<\/strong> попутный продукт меди (ДР Конго — около трёх четвертей мировой добычи) и никеля. В 2025 г. ДР Конго ограничивала экспорт кобальта, что повлияло на цены. Кобальт — <strong>связка твёрдых сплавов<\/strong> (ВК6, ВК8), так что TMK — его потребитель.<\/li><li><strong>Батарейные продукты:<\/strong> MHP (смешанный гидроксидный осадок) → сульфаты никеля и кобальта → прекурсоры (pCAM) → катодные материалы (CAM).<\/li><li><strong>Кадровые пулы:<\/strong> HPAL (Sumitomo Metal Mining, Glencore Murrin Murrin, проекты в Индонезии), сульфидная переработка (Норильск — с санкционной проверкой; Vale, Glencore, Boliden), рафинирование кобальта (Umicore; завод в Кокколе, Финляндия — бывш. Freeport Cobalt, затем Jervois, проверяйте актуального владельца), переработка батарей.<\/li><\/ul>\n<h3>1.4 Селен, теллур, германий, галлий, индий — «малые металлы»<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл<\/th><th>Источник<\/th><th>Применение<\/th><th>Особенность рынка<\/th><\/tr><\/thead><tbody><tr><td><strong>Селен<\/strong><\/td><td>Анодный шлам медного рафинирования<\/td><td>Стекло, металлургия, электроника, сельское хозяйство<\/td><td>Привязан к выпуску меди<\/td><\/tr><tr><td><strong>Теллур<\/strong><\/td><td>Анодный шлам медного рафинирования<\/td><td>Солнечные модули CdTe, термоэлектрика<\/td><td>Китай ограничил экспорт в 2025 г.<\/td><\/tr><tr><td><strong>Германий<\/strong><\/td><td>Цинковые концентраты, угольная зола<\/td><td>Оптоволокно, ИК-оптика, полупроводники<\/td><td>Экспортные ограничения Китая с 2023 г.<\/td><\/tr><tr><td><strong>Галлий<\/strong><\/td><td>Глинозёмное производство (байеровские растворы)<\/td><td>Полупроводники (GaN, GaAs)<\/td><td>Экспортные ограничения Китая с 2023 г.<\/td><\/tr><tr><td><strong>Индий<\/strong><\/td><td>Цинковое производство<\/td><td>ITO-покрытия экранов<\/td><td>Китай ограничил экспорт в 2025 г.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Связь с TMK:<\/strong> первый транш 2026 г. — высокочистые <strong>селен, теллур, рений<\/strong>; в соглашении с American Resources и ReElement упомянут <strong>германий<\/strong>. Нужны химики-технологи аффинажа и аналитики следовых примесей (см. День 9).<\/p>\n<h3>1.5 Рынки вольфрама, молибдена и рения<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл<\/th><th>Ключевые продукты и единицы<\/th><th>Как формируется цена<\/th><th>Особенности<\/th><\/tr><\/thead><tbody><tr><td><strong>Вольфрам<\/strong><\/td><td>Концентрат (65% WO₃), <strong>APT<\/strong> ($/mtu WO₃), ферровольфрам ($/кг W), порошки, карбид<\/td><td>Оценки Fastmarkets, Argus, Asian Metal; переговоры<\/td><td>Китай ≈ 80% добычи; экспортный контроль с февраля 2025 г.; цена APT в Европе выросла примерно на 900% год к году к маю 2026 г. Значительная доля спроса покрывается <strong>переработкой лома<\/strong>, особенно твёрдосплавного<\/td><\/tr><tr><td><strong>Молибден<\/strong><\/td><td>Обожжённый концентрат (технический оксид, $/фунт Mo), ферромолибден ($/кг Mo), химические соединения, металл<\/td><td>Оценки ценовых агентств<\/td><td>Основная часть — попутная добыча из медных руд; экспортный контроль Китая с 2025 г.<\/td><\/tr><tr><td><strong>Рений<\/strong><\/td><td>Перренат аммония, гранулы и порошок ($/кг)<\/td><td>Переговоры; рынок мал<\/td><td>Мировой выпуск — десятки тонн в год; главные потребители — суперсплавы и катализаторы; крупнейший производитель — Molymet<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Переработка вольфрамового лома<\/strong> (особенно твёрдосплавного) — важное направление: «цинковый процесс» (возврат порошка) и химическая переработка до APT. Plansee, H.C. Starck Tungsten, Sandvik и другие активно перерабатывают лом. Для TMK это потенциальный источник сырья и <strong>ещё один профиль кадров<\/strong>.<\/p>\n<h3>1.6 Политика и партнёрства: кто кому что предлагает<\/h3>\n<ul><li><strong>США:<\/strong> Inflation Reduction Act (2022) — требования к происхождению батарейных минералов; инвестиции Министерства обороны и Министерства энергетики; с Узбекистаном — Joint Investment Framework (февраль 2026 г.) и инвестиционная платформа DFC–EXIM (июнь 2026 г.).<\/li><li><strong>ЕС:<\/strong> Critical Raw Materials Act (2024): к 2030 г. — 10% потребности за счёт добычи в ЕС, 40% — переработки, 25% — вторичного сырья; не более 65% любого стратегического сырья из одной страны. С Узбекистаном — расширенное соглашение о партнёрстве (EPCA, октябрь 2025 г.).<\/li><li><strong>Япония<\/strong> (JOGMEC), <strong>Корея<\/strong> (KOMIR, KIGAM), <strong>Великобритания<\/strong> (дорожная карта с TMK на 2026–2028 гг.).<\/li><li><strong>Прослеживаемость:<\/strong> OECD Due Diligence Guidance, RMI (RMAP; шаблоны CMRT для 3TG и EMRT для кобальта, слюды и других минералов), стандарты IRMA, The Copper Mark (медь, молибден, никель, цинк).<\/li><\/ul>\n<p><strong>Кадровый вывод:<\/strong> каждое партнёрство TMK означает международные стандарты, аудиты и отчётность. Отсюда спрос на <strong>ESG-менеджеров, специалистов по due diligence и коммерческих директоров<\/strong> с опытом западных рынков (подробно — в День 20).<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Сподуменовый концентрат<\/td><td>Spodumene concentrate (SC6)<\/td><td>Концентрат с ~6% Li₂O<\/td><\/tr><tr><td>Карбонат лития<\/td><td>Lithium carbonate<\/td><td>Литиевый продукт для батарей и промышленности<\/td><\/tr><tr><td>Гидроксид лития<\/td><td>Lithium hydroxide monohydrate<\/td><td>Продукт для высоконикелевых катодов<\/td><\/tr><tr><td>Эквивалент карбоната лития<\/td><td>Lithium carbonate equivalent (LCE)<\/td><td>Единица объёма литиевой продукции<\/td><\/tr><tr><td>Прямое извлечение лития<\/td><td>Direct lithium extraction (DLE)<\/td><td>Извлечение лития из рассолов сорбцией или экстракцией<\/td><\/tr><tr><td>Испарительные бассейны<\/td><td>Evaporation ponds<\/td><td>Концентрирование рассола солнцем<\/td><\/tr><tr><td>Сферический графит<\/td><td>Spherical graphite<\/td><td>Округлённые частицы графита для анодов<\/td><\/tr><tr><td>Очищенный сферический графит<\/td><td>Spherical purified graphite (SPG)<\/td><td>Сферический графит ≥ 99,95% C<\/td><\/tr><tr><td>Анодный материал<\/td><td>Anode active material (AAM)<\/td><td>Материал отрицательного электрода батареи<\/td><\/tr><tr><td>Синтетический графит<\/td><td>Synthetic graphite<\/td><td>Графит из кокса, графитизация при ~3 000 °C<\/td><\/tr><tr><td>Графитизация<\/td><td>Graphitization<\/td><td>Высокотемпературное превращение углерода в графит<\/td><\/tr><tr><td>Смешанный гидроксидный осадок<\/td><td>Mixed hydroxide precipitate (MHP)<\/td><td>Промежуточный продукт Ni–Co<\/td><\/tr><tr><td>Никелевый чугун<\/td><td>Nickel pig iron (NPI)<\/td><td>Продукт пирометаллургии латеритов для нержавеющей стали<\/td><\/tr><tr><td>Прекурсор катодного материала<\/td><td>Precursor cathode active material (pCAM)<\/td><td>Полупродукт для катодов батарей<\/td><\/tr><tr><td>Катодный материал<\/td><td>Cathode active material (CAM)<\/td><td>Материал положительного электрода батареи<\/td><\/tr><tr><td>Анодный шлам<\/td><td>Anode slimes<\/td><td>Источник Se, Te, Au, Ag<\/td><\/tr><tr><td>Германий / галлий / индий<\/td><td>Germanium / gallium / indium<\/td><td>Малые металлы с экспортными ограничениями Китая<\/td><\/tr><tr><td>Ферровольфрам<\/td><td>Ferrotungsten<\/td><td>Сплав W–Fe для сталей<\/td><\/tr><tr><td>Технический оксид молибдена<\/td><td>Technical molybdenum oxide (roasted concentrate)<\/td><td>Продукт обжига молибденита<\/td><\/tr><tr><td>Перренат аммония<\/td><td>Ammonium perrhenate (APR)<\/td><td>Основное товарное соединение рения<\/td><\/tr><tr><td>Переработка твёрдосплавного лома<\/td><td>Hardmetal scrap recycling<\/td><td>Возврат вольфрама и кобальта из лома<\/td><\/tr><tr><td>Цинковый процесс<\/td><td>Zinc process<\/td><td>Переработка твёрдого сплава расплавом цинка<\/td><\/tr><tr><td>Вторичное сырьё<\/td><td>Secondary raw materials / scrap<\/td><td>Сырьё из лома и отходов<\/td><\/tr><tr><td>Закон ЕС о критическом сырье<\/td><td>EU Critical Raw Materials Act (CRMA)<\/td><td>Цели ЕС по добыче, переработке, рециклингу<\/td><\/tr><tr><td>Закон США о снижении инфляции<\/td><td>Inflation Reduction Act (IRA)<\/td><td>Требования к происхождению батарейных минералов<\/td><\/tr><tr><td>Шаблон отчётности о минералах<\/td><td>CMRT / EMRT<\/td><td>Шаблоны RMI для раскрытия источников сырья<\/td><\/tr><tr><td>Ответственное горное дело<\/td><td>Responsible mining (IRMA)<\/td><td>Стандарт ответственной добычи<\/td><\/tr><tr><td>Ценовое агентство<\/td><td>Price reporting agency (PRA)<\/td><td>Fastmarkets, Argus и др.<\/td><\/tr><tr><td>Стратегический проект<\/td><td>Strategic project<\/td><td>Статус проектов по CRMA с ускоренной поддержкой<\/td><\/tr><tr><td>Батарейное качество<\/td><td>Battery grade<\/td><td>Высокая чистота для батарейных материалов<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Сжатая карта по металлам<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл<\/th><th>Звено, ближайшее для TMK<\/th><th>Ключевые роли<\/th><th>Где искать<\/th><th>С кем конкурируем за людей<\/th><\/tr><\/thead><tbody><tr><td>Литий<\/td><td>Геология, концентрат, далее химия<\/td><td>Геолог по пегматитам, технолог DMS и флотации, химик литиевого завода<\/td><td>Австралия, Канада, Зимбабве, Аргентина, Китай<\/td><td>Австралийские и американские проекты, Европа<\/td><\/tr><tr><td>Графит<\/td><td>Концентрат (Тасказган), позже аноды<\/td><td>Геолог (JORC), флотатор графита, технолог сфероидизации и очистки<\/td><td>Мозамбик, Мадагаскар, Канада, Швеция, Корея<\/td><td>POSCO Future M, проекты США и ЕС<\/td><\/tr><tr><td>Никель, кобальт<\/td><td>Пока проекты; кобальт — сырьё для твёрдых сплавов<\/td><td>Гидрометаллург HPAL и сульфатов, специалист по закупкам кобальта<\/td><td>Австралия, Индонезия, Филиппины, Финляндия, Канада<\/td><td>Индонезийские проекты, батарейные компании<\/td><\/tr><tr><td>Se, Te, Re, Ge<\/td><td>Высокочистые продукты (2026)<\/td><td>Химик аффинажа, вакуумная дистилляция, аналитик GDMS<\/td><td>5N Plus, Umicore, JX Metals, медные и цинковые заводы<\/td><td>Производители полупроводниковых материалов<\/td><\/tr><tr><td>W, Mo<\/td><td>Вся цепочка, плюс переработка лома<\/td><td>См. Модуль 2 и профиль TMK; добавьте специалистов по переработке лома<\/td><td>Plansee, H.C. Starck, Sandvik, Kennametal, Molymet<\/td><td>Западные вольфрамовые проекты (Корея, Казахстан, Европа, США)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Вопросы о рыночной грамотности (для руководителей и коммерческих ролей)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Как формируется цена на ваш продукт и какие индексы вы использовали в контрактах?»<\/td><td>Называет агентства, формулы, премии и скидки за качество<\/td><td>«Цену определял отдел продаж»<\/td><\/tr><tr><td>«Как экспортный контроль Китая повлиял на ваш бизнес?»<\/td><td>Конкретные эффекты: цены, клиенты, логистика, решения<\/td><td>Не следит за рынком<\/td><\/tr><tr><td>«Какие требования к прослеживаемости предъявляли западные покупатели?»<\/td><td>RMAP, CMRT/EMRT, аудиты, ESG-анкеты<\/td><td>Не сталкивался<\/td><\/tr><tr><td>«Кто ваши главные конкуренты и где они на кривой затрат?»<\/td><td>Называет и объясняет преимущества<\/td><td>Не знает<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Кейс-финал модуля 3: карта критических минералов TMK<\/h2>\n<p><strong>Задание (40 мин).<\/strong> Таблица на одну-две страницы:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл / направление<\/th><th>Звено, которое целит TMK (по публичным данным)<\/th><th>2–3 ключевые роли (RU / EN)<\/th><th>Дефицит<\/th><th>5 доноров<\/th><th>Главный конкурирующий работодатель<\/th><th>Риск поиска (санкции, язык, релокация)<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p>Строки: вольфрам; молибден и рений; РЗЭ из растворов; графит; литий; никель и кобальт; Se и Te; переработка лома.<\/p>\n<p><strong>Критерии качества:<\/strong><\/p>\n<ul><li>звенья соответствуют публичным данным TMK (профиль, День 1), а не фантазиям;<\/li><li>у каждой роли есть английское название;<\/li><li>доноры соответствуют звену, а не только металлу;<\/li><li>явно отмечены юрисдикции с санкционными или экспортными рисками.<\/li><\/ul>\n<p><strong>Teach-back.<\/strong> Покажите карту руководителю или эксперту TMK. Спросите: «Какие две строки для вас самые срочные?» Ответ — ваш приоритет поиска на квартал.<\/p>\n<hr>\n<h2>6. Рефлексия: итог модуля 3<\/h2>\n<ol><li>Какие две строки карты критических минералов руководитель назвал самыми срочными?<\/li><li>Какой металл из портфеля TMK для вас пока самый «тёмный»? Запланируйте 30 минут на USGS-справку по нему.<\/li><li><strong>Обязательство:<\/strong> «Модуль 4 начинаю ___ (дата) в ___:___».<\/li><\/ol>\n<blockquote><p><strong>Правило модуля:<\/strong> половина программы пройдена. Вы знаете цепочки от недр до магнита и анода. Следующий модуль — оборудование, лаборатории и производственные системы: то, на чём держится каждый передел. Дальше — сам технический подбор, ради которого всё это строилось.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>USGS Mineral Commodity Summaries: Lithium, Graphite, Nickel, Cobalt, Selenium, Tellurium, Germanium, Gallium, Indium, Tungsten, Molybdenum, Rhenium.<\/li><li>IEA Global Critical Minerals Outlook — сценарии спроса и концентрация переработки.<\/li><li>Benchmark Mineral Intelligence, Fastmarkets — бесплатные обзоры и вебинары по литию, графиту, никелю, кобальту.<\/li><li>Тексты EU Critical Raw Materials Act и OECD Due Diligence Guidance (бесплатно).<\/li><\/ul>"},{"n":16,"module":4,"title":"Технологическое оборудование и производители (OEM): от дробилки до печи спекания","file":"module-04-equipment-lab-production-systems/day-16-process-equipment-oem.md","duration":"3,5 часа","challenge":"Составить <strong>карту оборудования одного передела TMK<\/strong> (например, «APT → порошок W → твёрдый сплав») с ключевыми единицами, их производителями и ролями специалистов, которые это оборудование выбирают, запускают и обслуживают.","why":"Кандидат, который «работал на печах», мог стоять у муфельной печи в лаборатории или запускать линию проходных печей восстановления водородом на 2 000 т в год. Названия оборудования и производителей в резюме — самый быстрый фильтр реального масштаба. Кроме того, производители оборудования — недооценённый пул кандидатов: их сервисные и пусконаладочные инженеры видели десятки заводов.","checklist":[{"text":"Разминка: 5 вопросов по Модулю 3 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: карта оборудования передела TMK (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.4, 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Производитель оборудования","en":"OEM (original equipment manufacturer)","def":"Компания, проектирующая и выпускающая оборудование"},{"ru":"Технологическое оборудование","en":"Process equipment","def":"Оборудование основных переделов"},{"ru":"Реактор с перемешиванием","en":"Agitated reactor / tank","def":"Аппарат для выщелачивания и осаждения"},{"ru":"Автоклав","en":"Autoclave / pressure vessel","def":"Реактор под давлением"},{"ru":"Выпарной аппарат","en":"Evaporator","def":"Концентрирование растворов выпариванием"},{"ru":"Кристаллизатор","en":"Crystallizer","def":"Аппарат получения кристаллов"},{"ru":"Механическая рекомпрессия пара","en":"Mechanical vapour recompression (MVR)","def":"Энергоэффективное выпаривание"},{"ru":"Вращающаяся печь","en":"Rotary kiln","def":"Барабанная печь для обжига и прокалки"},{"ru":"Многоподовая печь","en":"Multiple hearth furnace","def":"Печь обжига молибденита"},{"ru":"Толкательная печь","en":"Pusher furnace","def":"Проходная печь восстановления водородом"},{"ru":"Вакуумная печь","en":"Vacuum furnace","def":"Печь спекания и термообработки в вакууме"},{"ru":"Спекание с газостатом","en":"Sinter-HIP","def":"Спекание и горячее изостатическое прессование в одной печи"},{"ru":"Ленточная печь","en":"Mesh belt furnace","def":"Проходная печь для порошковых деталей"},{"ru":"Аттритор","en":"Attritor mill","def":"Мельница с перемешиванием для размола смесей"},{"ru":"Распылительная сушилка","en":"Spray dryer","def":"Получение гранул из суспензии"},{"ru":"Пресс с ЧПУ","en":"CNC powder press","def":"Пресс для формования порошковых изделий"},{"ru":"Пресс-инструмент","en":"Tooling (dies and punches)","def":"Матрицы и пуансоны"},{"ru":"Горячее изостатическое прессование","en":"Hot isostatic pressing (HIP)","def":"Уплотнение при высоких температуре и давлении газа"},{"ru":"Шламовый насос","en":"Slurry pump","def":"Насос для абразивных пульп"},{"ru":"Запорная арматура","en":"Valves","def":"Задвижки, клапаны, краны"},{"ru":"Приёмочные испытания у изготовителя","en":"Factory acceptance test (FAT)","def":"Проверка оборудования до отгрузки"},{"ru":"Приёмочные испытания на площадке","en":"Site acceptance test (SAT)","def":"Проверка после монтажа"},{"ru":"Шеф-монтаж / шеф-наладка","en":"Supervision of installation / commissioning","def":"Надзор производителя за монтажом и пуском"},{"ru":"Долгопоставляемое оборудование","en":"Long-lead items","def":"Позиции с долгим сроком изготовления"},{"ru":"Опросный лист","en":"Equipment data sheet","def":"Технические требования к единице оборудования"},{"ru":"Критичные запасные части","en":"Critical spares","def":"Запчасти, без которых остановится производство"},{"ru":"Коррозионностойкие материалы","en":"Corrosion-resistant materials","def":"Титан, дуплексные стали, Hastelloy и др."},{"ru":"Водородная станция","en":"Hydrogen generation / supply system","def":"Получение и подача водорода для печей"},{"ru":"Сервисный инженер","en":"Field service engineer","def":"Инженер производителя на площадках клиентов"},{"ru":"Пусконаладочный инженер","en":"Commissioning engineer","def":"Специалист по пуску оборудования"}],"quiz":[{"q":"В какой печи обычно восстанавливают оксид вольфрама до порошка вольфрама?","options":["В многоподовой печи окислительного обжига","В доменной печи с коксом и известняком","В руднотермической печи с дуговым нагревом","В толкательной печи в токе водорода"],"answer":3,"explain":"Лодочки с оксидом проталкиваются через трубу в токе водорода. Многоподовая печь — для обжига молибденита."},{"q":"Что такое sinter-HIP?","options":["Спекание и газостатическое уплотнение в одной печи","Холодное прессование порошка в резиновой форме","Химическое осаждение покрытия из газовой фазы","Нагрев деталей на сетчатой ленте в азоте"],"answer":0,"explain":"Даёт практически беспористый твёрдый сплав. Б — холодное изостатическое прессование, В — CVD, Г — ленточная печь."},{"q":"Зачем аттритор в производстве твёрдых сплавов?","options":["Для спекания пластин в вакууме при 1 450 °C","Для нанесения износостойкого PVD-покрытия","Для интенсивного размола и смешивания WC с кобальтом","Для намагничивания готовых изделий перед упаковкой"],"answer":2,"explain":"Аттритор — мельница с перемешиванием для подготовки однородной смеси."},{"q":"Что такое FAT?","options":["Испытания оборудования после монтажа на площадке заказчика перед подписанием акта приёмки","Приёмочные испытания оборудования на заводе-изготовителе до отгрузки","Финансовый аудит поставщика перед подписанием контракта","Плановый капитальный ремонт после гарантийного периода"],"answer":1,"explain":"После монтажа проводят SAT — испытания на площадке."},{"q":"Какой главный риск при найме сервисного инженера производителя на роль владельца?","options":["Он плохо знает оборудование своего же производителя","Он никогда не бывал на действующих промышленных площадках","Он не способен работать в командировках и на удалённых объектах","Позиция поставщика и нет опыта ответственности за KPI завода"],"answer":3,"explain":"Это не стоп-фактор, но зона проверки на интервью."},{"q":"Почему водородная станция критична для Чирчика?","options":["Водород — восстановитель в печах получения порошков W, Mo, Re","Водород нужен как собиратель при флотации шеелита на Ингичке","Водородом охлаждают фильтр-прессы гидрометаллургического цеха","Водород применяют как топливо для сушки концентратов"],"answer":0,"explain":"Отсюда же жёсткие требования к безопасности: водород взрывоопасен."},{"q":"Кандидат пишет в резюме «опыт работы с печами». Лучший уточняющий вопрос:","options":["«Нравилось ли вам работать с высокими температурами и в горячих цехах?»","«Сколько лет вы проработали на последнем месте и почему уходите?»","«Какие печи: тип, производитель, атмосфера, производительность, сколько единиц?»","«Есть ли у вас допуск к работе на высоте и к сосудам под давлением?»"],"answer":2,"explain":"Тип и масштаб печей сразу показывают, лабораторный это опыт или промышленный."},{"q":"Что такое долгопоставляемые позиции (long-lead items)?","options":["Расходные материалы с длинным сроком хранения на складе завода","Оборудование с долгим сроком изготовления, определяющее график проекта","Запасные части, которые редко выходят из строя и не нужны на складе","Позиции бюджета проекта, которые оплачиваются в длительную рассрочку"],"answer":1,"explain":"Автоклавы, крупные печи, трансформаторы. Их заказывают в первую очередь."},{"q":"Какая компания специализируется на прессах для порошковой металлургии?","options":["Weir Minerals — шламовые насосы и гидроциклоны для пульп","Quintus Technologies — установки горячего изостатического прессования","Hosokawa Alpine — струйные мельницы и классификаторы порошков","Dorst Technologies — прессы порошковой металлургии"],"answer":3,"explain":"Также Osterwalder, Gasbarre, Komage."},{"q":"Почему опыт пусконаладки китайского оборудования ценен в Центральной Азии?","options":["Его массово поставляют в регион, а пуск требует особых навыков взаимодействия","Китайское оборудование не требует пусконаладки, его просто включают после монтажа","Пусконаладку китайского оборудования запрещено проводить местным специалистам","Это требование стандарта JORC для любых горных и металлургических проектов"],"answer":0,"explain":"Документация, язык, работа с китайскими шеф-инженерами, приёмка — отдельная компетенция."}],"html":"<h2>0. Разминка: вспомнить Модуль 3<\/h2>\n<ol><li>Какие звенья цепочки РЗЭ сконцентрированы в Китае сильнее всего?<\/li><li>Что такое MREC и NdPr-оксид?<\/li><li>Почему технологи твёрдых сплавов — пул для магнитного производства?<\/li><li>Что такое SC6 и LCE?<\/li><li>Какие металлы из первого транша TMK на 2026 г. требуют аффинажа до высокой чистоты?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Разделение и производство магнитов (около 90%).<\/li><li>MREC — смешанный карбонат РЗЭ; NdPr-оксид — смесь оксидов неодима и празеодима, главный продукт для магнитов.<\/li><li>Оба производства — порошковая металлургия с вакуумным спеканием, прессованием и контролем.<\/li><li>SC6 — сподуменовый концентрат ~6% Li₂O; LCE — эквивалент карбоната лития.<\/li><li>Селен, теллур, рений.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Как классифицировать оборудование<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Группа<\/th><th>Примеры<\/th><th>Где у TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>Рудоподготовка и обогащение<\/strong><\/td><td>Дробилки, грохоты, мельницы, гидроциклоны, флотомашины, концентрационные столы, сепараторы, сгустители, фильтры<\/td><td>Ингичка, новый вольфрамовый комплекс, Тасказган<\/td><\/tr><tr><td><strong>Гидрометаллургия<\/strong><\/td><td>Реакторы с мешалками, автоклавы, фильтр-прессы, экстракторы (смесители-отстойники), ионообменные колонны, выпарные аппараты и кристаллизаторы, сушилки<\/td><td>APT, рений, РЗЭ из растворов, R&amp;D Park<\/td><\/tr><tr><td><strong>Пирометаллургия<\/strong><\/td><td>Вращающиеся печи, многоподовые печи, электропечи, индукционные печи, <strong>проходные печи восстановления водородом<\/strong>, вакуумные печи, газоочистка<\/td><td>Обжиг молибденита, восстановление W, Mo, Re, ферромолибден<\/td><\/tr><tr><td><strong>Порошковая металлургия<\/strong><\/td><td>Смесители, шаровые мельницы и аттриторы, распылительные сушилки, <strong>прессы<\/strong>, <strong>печи спекания<\/strong> (вакуумные, sinter-HIP, проходные), шлифовальные станки<\/td><td>Твёрдые сплавы Чирчика, Smart Powder<\/td><\/tr><tr><td><strong>Химическое производство<\/strong><\/td><td>Печи сжигания серы, контактные аппараты, абсорберы, теплообменники, насосы для кислот<\/td><td>TMK Chemicals (серная кислота)<\/td><\/tr><tr><td><strong>Транспорт материалов<\/strong><\/td><td>Насосы (шламовые, химические), конвейеры, питатели, пневмотранспорт, трубопроводы, арматура<\/td><td>Везде<\/td><\/tr><tr><td><strong>Инфраструктура и энергетика<\/strong><\/td><td>Подстанции, приводы, компрессоры, котлы, водоподготовка, <strong>производство водорода и азота<\/strong>, системы охлаждения<\/td><td>Везде; водород — критичен для Чирчика<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.2 Оборудование гидрометаллургии: что важно знать<\/h3>\n<ul><li><strong>Реакторы с перемешиванием<\/strong> — объём, материал (сталь с покрытием, нержавеющая, титан), тип мешалки; основная единица выщелачивания и осаждения.<\/li><li><strong>Автоклавы<\/strong> — сосуды под давлением; жёсткие требования промышленной безопасности, отдельная квалификация персонала.<\/li><li><strong>Фильтр-прессы и вакуумные фильтры<\/strong> — разделение твёрдого и жидкого; частое «узкое место».<\/li><li><strong>Экстракционные установки<\/strong> (смесители-отстойники, колонны) — пожароопасность органики.<\/li><li><strong>Ионообменные колонны<\/strong> — неподвижный слой, карусели, непрерывный противоток.<\/li><li><strong>Выпарные аппараты и кристаллизаторы<\/strong> (в т. ч. с механической рекомпрессией пара, MVR) — для APT, сульфатов, солей лития; энергоёмки.<\/li><li><strong>Материалы и коррозия<\/strong> — постоянная тема: стеклопластик, гуммированная сталь, дуплексные стали, титан, сплавы Hastelloy.<\/li><\/ul>\n<h3>1.3 Печи: язык пирометаллурга и специалиста порошковой металлургии<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип печи<\/th><th>Принцип<\/th><th>Применение у TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>Вращающаяся трубчатая печь<\/strong> (rotary kiln)<\/td><td>Наклонный вращающийся барабан с газовым или электрическим нагревом<\/td><td>Прокалка, обжиг; декрепитация сподумена<\/td><\/tr><tr><td><strong>Многоподовая печь<\/strong> (multiple hearth furnace)<\/td><td>Вертикальная печь с подами и гребками<\/td><td>Обжиг молибденитового концентрата<\/td><\/tr><tr><td><strong>Проходная (толкательная) печь восстановления<\/strong> (pusher furnace)<\/td><td>Лодочки с оксидом проталкиваются через трубу в токе водорода<\/td><td>Восстановление WO₃ → W, MoO₂ → Mo, перренат → Re<\/td><\/tr><tr><td><strong>Вакуумная печь спекания<\/strong><\/td><td>Нагрев в вакууме или защитном газе<\/td><td>Спекание твёрдых сплавов, магнитов<\/td><\/tr><tr><td><strong>Sinter-HIP<\/strong><\/td><td>Спекание с последующим газостатическим давлением в одной печи<\/td><td>Беспористый твёрдый сплав<\/td><\/tr><tr><td><strong>Проходная ленточная печь<\/strong> (mesh belt)<\/td><td>Детали на сетчатой ленте в защитной атмосфере<\/td><td>Конструкционная порошковая металлургия (Smart Powder)<\/td><\/tr><tr><td><strong>Индукционная печь<\/strong><\/td><td>Нагрев вихревыми токами<\/td><td>Плавка, получение сплавов<\/td><\/tr><tr><td><strong>Электродуговая / руднотермическая печь<\/strong><\/td><td>Нагрев дугой<\/td><td>Ферросплавы, переработка шлаков<\/td><\/tr><tr><td><strong>Печь «сварки» штабиков<\/strong><\/td><td>Прямой нагрев током<\/td><td>Спекание вольфрамовых и молибденовых штабиков<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Что спрашивать про печь:<\/strong> тип, производительность (кг/ч или т/год), атмосфера (H₂, N₂–H₂, вакуум, аргон), максимальная температура, система безопасности по водороду, кто производитель, сколько единиц было в подчинении.<\/p>\n<h3>1.4 Оборудование порошковой металлургии<\/h3>\n<ul><li><strong>Подготовка смесей:<\/strong> шаровые мельницы и <strong>аттриторы<\/strong> (размол WC–Co), <strong>распылительные сушилки<\/strong> (получение гранул), смесители.<\/li><li><strong>Формование:<\/strong> механические, гидравлические и электрические <strong>прессы<\/strong> с ЧПУ; изостатические прессы (CIP); прессы для инжекционного формования (MIM); экструдеры.<\/li><li><strong>Пресс-инструмент (оснастка):<\/strong> матрицы и пуансоны из твёрдого сплава и инструментальной стали — отдельная инженерная дисциплина.<\/li><li><strong>Спекание:<\/strong> вакуумные печи, sinter-HIP, проходные печи.<\/li><li><strong>Обработка:<\/strong> шлифовальные станки (алмазный инструмент), электроэрозия, станки для заточки, установки нанесения покрытий (CVD, PVD).<\/li><li><strong>Контроль:<\/strong> координатно-измерительные машины (КИМ), металлография, твердомеры, магнитные приборы (коэрцитиметры для твёрдых сплавов).<\/li><\/ul>\n<h3>1.5 Производители оборудования (OEM): карта для рекрутера<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Производители (примеры)<\/th><\/tr><\/thead><tbody><tr><td>Дробление, измельчение, обогащение<\/td><td><strong>Metso<\/strong>, <strong>FLSmidth<\/strong>, <strong>Weir<\/strong> (насосы, мельницы, гидроциклоны), Sandvik, thyssenkrupp Polysius, KHD (валковые прессы), Eriez (сепараторы, флотация), TOMRA (сортировка), Multotec; китайские CITIC Heavy Industries и другие<\/td><\/tr><tr><td>Сгущение и фильтрация<\/td><td>Metso, FLSmidth, <strong>Andritz<\/strong>, Diemme<\/td><\/tr><tr><td>Гидрометаллургия и химия<\/td><td>Andritz, Metso (экстракция, автоклавы), <strong>GEA<\/strong> и <strong>Sulzer<\/strong> (выпаривание, кристаллизация, насосы), Veolia Water Technologies, производители реакторов и мешалок (Ekato и др.)<\/td><\/tr><tr><td>Печи и термообработка<\/td><td><strong>ALD Vacuum Technologies<\/strong>, <strong>PVA TePla<\/strong>, <strong>Seco/Warwick<\/strong>, <strong>Ipsen<\/strong>, <strong>Nabertherm<\/strong>, <strong>Harper International<\/strong> (вращающиеся и толкательные печи для специальных материалов), Linn High Therm<\/td><\/tr><tr><td>Изостатическое прессование (HIP)<\/td><td><strong>Quintus Technologies<\/strong>; услуги HIP — Bodycote<\/td><\/tr><tr><td>Прессы порошковой металлургии<\/td><td><strong>Dorst Technologies<\/strong>, <strong>Osterwalder<\/strong>, Gasbarre, Komage<\/td><\/tr><tr><td>Измельчение и классификация порошков<\/td><td><strong>Hosokawa Alpine<\/strong> (струйные мельницы), Netzsch (мельницы и термоанализ)<\/td><\/tr><tr><td>Автоматизация и энергетика<\/td><td><strong>ABB<\/strong>, <strong>Siemens<\/strong>, Schneider Electric, Emerson, Honeywell, Rockwell, Yokogawa<\/td><\/tr><tr><td>Производство газов<\/td><td>Air Liquide, Linde (водород, азот, аргон; установки на площадке)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.6 Жизненный цикл оборудования и роли вокруг него<\/h3>\n<pre class=\"code\"><code>Технологический выбор → техническое задание и опросные листы → тендер, оценка предложений\n→ изготовление, приёмочные испытания у производителя (FAT) → поставка, монтаж\n→ пусконаладка: холодная, горячая, испытания на площадке (SAT) → гарантийный период\n→ эксплуатация, ТОиР, запасные части → модернизация → вывод из эксплуатации<\/code><\/pre>\n<ul><li><strong>FAT/SAT<\/strong> (factory / site acceptance test) — приёмочные испытания; человек, который их проводил, понимает и оборудование, и проект.<\/li><li><strong>Ведомость критичных запасных частей<\/strong> и <strong>долгопоставляемые позиции<\/strong> (long-lead items: автоклавы, крупные печи, трансформаторы) определяют сроки проекта.<\/li><li><strong>Шеф-монтаж и шеф-наладка<\/strong> производителя — в СНГ это часто первая встреча завода с иностранной техникой.<\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Производитель оборудования<\/td><td>OEM (original equipment manufacturer)<\/td><td>Компания, проектирующая и выпускающая оборудование<\/td><\/tr><tr><td>Технологическое оборудование<\/td><td>Process equipment<\/td><td>Оборудование основных переделов<\/td><\/tr><tr><td>Реактор с перемешиванием<\/td><td>Agitated reactor / tank<\/td><td>Аппарат для выщелачивания и осаждения<\/td><\/tr><tr><td>Автоклав<\/td><td>Autoclave / pressure vessel<\/td><td>Реактор под давлением<\/td><\/tr><tr><td>Выпарной аппарат<\/td><td>Evaporator<\/td><td>Концентрирование растворов выпариванием<\/td><\/tr><tr><td>Кристаллизатор<\/td><td>Crystallizer<\/td><td>Аппарат получения кристаллов<\/td><\/tr><tr><td>Механическая рекомпрессия пара<\/td><td>Mechanical vapour recompression (MVR)<\/td><td>Энергоэффективное выпаривание<\/td><\/tr><tr><td>Вращающаяся печь<\/td><td>Rotary kiln<\/td><td>Барабанная печь для обжига и прокалки<\/td><\/tr><tr><td>Многоподовая печь<\/td><td>Multiple hearth furnace<\/td><td>Печь обжига молибденита<\/td><\/tr><tr><td>Толкательная печь<\/td><td>Pusher furnace<\/td><td>Проходная печь восстановления водородом<\/td><\/tr><tr><td>Вакуумная печь<\/td><td>Vacuum furnace<\/td><td>Печь спекания и термообработки в вакууме<\/td><\/tr><tr><td>Спекание с газостатом<\/td><td>Sinter-HIP<\/td><td>Спекание и горячее изостатическое прессование в одной печи<\/td><\/tr><tr><td>Ленточная печь<\/td><td>Mesh belt furnace<\/td><td>Проходная печь для порошковых деталей<\/td><\/tr><tr><td>Аттритор<\/td><td>Attritor mill<\/td><td>Мельница с перемешиванием для размола смесей<\/td><\/tr><tr><td>Распылительная сушилка<\/td><td>Spray dryer<\/td><td>Получение гранул из суспензии<\/td><\/tr><tr><td>Пресс с ЧПУ<\/td><td>CNC powder press<\/td><td>Пресс для формования порошковых изделий<\/td><\/tr><tr><td>Пресс-инструмент<\/td><td>Tooling (dies and punches)<\/td><td>Матрицы и пуансоны<\/td><\/tr><tr><td>Горячее изостатическое прессование<\/td><td>Hot isostatic pressing (HIP)<\/td><td>Уплотнение при высоких температуре и давлении газа<\/td><\/tr><tr><td>Шламовый насос<\/td><td>Slurry pump<\/td><td>Насос для абразивных пульп<\/td><\/tr><tr><td>Запорная арматура<\/td><td>Valves<\/td><td>Задвижки, клапаны, краны<\/td><\/tr><tr><td>Приёмочные испытания у изготовителя<\/td><td>Factory acceptance test (FAT)<\/td><td>Проверка оборудования до отгрузки<\/td><\/tr><tr><td>Приёмочные испытания на площадке<\/td><td>Site acceptance test (SAT)<\/td><td>Проверка после монтажа<\/td><\/tr><tr><td>Шеф-монтаж / шеф-наладка<\/td><td>Supervision of installation / commissioning<\/td><td>Надзор производителя за монтажом и пуском<\/td><\/tr><tr><td>Долгопоставляемое оборудование<\/td><td>Long-lead items<\/td><td>Позиции с долгим сроком изготовления<\/td><\/tr><tr><td>Опросный лист<\/td><td>Equipment data sheet<\/td><td>Технические требования к единице оборудования<\/td><\/tr><tr><td>Критичные запасные части<\/td><td>Critical spares<\/td><td>Запчасти, без которых остановится производство<\/td><\/tr><tr><td>Коррозионностойкие материалы<\/td><td>Corrosion-resistant materials<\/td><td>Титан, дуплексные стали, Hastelloy и др.<\/td><\/tr><tr><td>Водородная станция<\/td><td>Hydrogen generation / supply system<\/td><td>Получение и подача водорода для печей<\/td><\/tr><tr><td>Сервисный инженер<\/td><td>Field service engineer<\/td><td>Инженер производителя на площадках клиентов<\/td><\/tr><tr><td>Пусконаладочный инженер<\/td><td>Commissioning engineer<\/td><td>Специалист по пуску оборудования<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Роли «вокруг оборудования»<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Роль (RU)<\/th><th>Title (EN)<\/th><th>Маркеры реального опыта<\/th><\/tr><\/thead><tbody><tr><td>Главный механик проекта / завода<\/td><td>Head of Mechanical Engineering / Maintenance Manager<\/td><td>Перечень оборудования, бюджеты ТОиР, крупные ремонты<\/td><\/tr><tr><td>Инженер-технолог по оборудованию<\/td><td>Process Equipment Engineer<\/td><td>Подбор, опросные листы, тендеры, FAT/SAT<\/td><\/tr><tr><td>Инженер по печам<\/td><td>Furnace Engineer<\/td><td>Типы печей, атмосферы, футеровка, безопасность по водороду<\/td><\/tr><tr><td>Пусконаладочный инженер<\/td><td>Commissioning Engineer<\/td><td>Сколько пусков, какого оборудования, какие проблемы решал<\/td><\/tr><tr><td>Сервисный инженер производителя<\/td><td>Field Service Engineer (OEM)<\/td><td>Сколько площадок видел, какое оборудование, регионы<\/td><\/tr><tr><td>Специалист по закупкам оборудования<\/td><td>Equipment Procurement / Expediting Specialist<\/td><td>Тендеры, контракты с OEM, сроки поставки<\/td><\/tr><tr><td>Инженер по надёжности<\/td><td>Reliability Engineer<\/td><td>Анализ отказов, стратегии ТОиР (День 19)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Производители оборудования как пул кандидатов<\/h3>\n<p><strong>Плюсы:<\/strong><\/p>\n<ul><li>видели десятки заводов и типовые проблемы;<\/li><li>глубоко знают оборудование, часто — технологию;<\/li><li>привыкли к командировкам и разным культурам, часто — многоязычны.<\/li><\/ul>\n<p><strong>Риски:<\/strong><\/p>\n<ul><li><strong>позиция поставщика<\/strong>: «оборудование хорошее, это заказчик его неправильно эксплуатирует»;<\/li><li>не отвечали за производственные KPI завода целиком;<\/li><li>могут знать только своего производителя.<\/li><\/ul>\n<p><strong>Проверочные вопросы:<\/strong><\/p>\n<ul><li>«Какой завод вы бы запустили иначе, если бы были владельцем? Почему?»<\/li><li>«Когда оборудование не выходило на гарантийные показатели, что вы делали и кто в итоге был прав?»<\/li><li>«С оборудованием каких других производителей вы работали?»<\/li><\/ul>\n<h3>3.3 Вопросы о масштабе оборудования (для любого технического кандидата)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Какое оборудование было в вашей зоне ответственности? Производитель, количество, производительность?»<\/td><td>Конкретные модели, единицы, т/ч или кг/ч<\/td><td>«Разное оборудование»<\/td><\/tr><tr><td>«Участвовали ли вы в выборе оборудования и тендерах? Как сравнивали предложения?»<\/td><td>Критерии, TCO (стоимость владения), опыт с производителями<\/td><td>Только эксплуатировал готовое<\/td><\/tr><tr><td>«Расскажите о пуске нового оборудования: что пошло не так?»<\/td><td>Конкретные проблемы, решения, сроки<\/td><td>«Всё прошло хорошо»<\/td><\/tr><tr><td>«Как была организована работа с запасными частями?»<\/td><td>Критичные запчасти, складской запас, сроки поставки<\/td><td>Не знает<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.4 Особенности СНГ<\/h3>\n<ul><li>На многих предприятиях работает советское и российское оборудование рядом с европейским и китайским. Кандидат, знающий обе «школы», ценен.<\/li><li>Документация на русском и стандарты ГОСТ против документации на английском и стандартов EN, ASME, API. Спросите, с какими нормами кандидат реально работал.<\/li><li>Китайское оборудование стало массовым в регионе: опыт пусконаладки китайских поставок с китайскими специалистами — отдельный ценный навык.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Карта оборудования передела (40 мин).<\/strong> Выберите один передел TMK: «APT → порошок W → твёрдый сплав ВК8» или «молибденитовый концентрат → обжиг → ферромолибден».<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Операция<\/th><th>Единица оборудования (RU / EN)<\/th><th>Ключевые параметры<\/th><th>2–3 производителя<\/th><th>Кто выбирает<\/th><th>Кто эксплуатирует и обслуживает<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p>Затем выпишите <strong>3 «узких места»<\/strong> (что, вероятнее всего, будет останавливать передел) и роль, которая отвечает за каждое.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какие три «узких места» вы нашли в выбранном переделе?<\/li><li>Каких двух производителей оборудования вы добавите в карту доноров как источник кандидатов?<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ — День 17: аналитическая лаборатория».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> слова «опыт с оборудованием» больше не обманут вас. Вы спрашиваете тип, производителя, атмосферу, производительность и количество. Так выглядит рекрутер, которому технические директора доверяют поиск.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Каталоги и технические описания производителей (Metso, FLSmidth, ALD, PVA TePla, Dorst, Quintus) — лучший бесплатный учебник по оборудованию.<\/li><li>R. German, <em>Powder Metallurgy Science<\/em> — главы об оборудовании формования и спекания.<\/li><li>Отраслевые журналы: International Mining (оборудование горно-обогатительных предприятий), Powder Metallurgy Review (оборудование PM, бесплатный журнал).<\/li><li>Видео: «pusher furnace hydrogen reduction», «sinter HIP furnace», «powder compaction press».<\/li><\/ul>"},{"n":17,"module":4,"title":"Аналитическая лаборатория: какие методы на какие вопросы отвечают","file":"module-04-equipment-lab-production-systems/day-17-analytical-lab-methods.md","duration":"3,5 часа","challenge":"Составить <strong>матрицу «вопрос → метод → прибор → специалист»<\/strong> для лаборатории TMK: от содержания WO₃ в руде до примесей в рении 99,99%.","why":"У TMK в плане — Центральная нано-аналитическая лаборатория с SGS (по плану до 1 000 проб в сутки), химико-аналитические лаборатории на фабриках, контроль высокочистых Se, Te, Re. Без лаборатории фабрика «слепая», а высокочистый металл невозможно продать. Аналитиков с опытом ICP-MS, GDMS и автоматизированной минералогии мало, и вам придётся их искать. Сегодня вы научитесь понимать, кто что умеет.","checklist":[{"text":"Разминка: 5 вопросов по Дню 16 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (30 мин)","minutes":30},{"text":"Практика: матрица «вопрос → метод → прибор → специалист» (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.2, 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Пробоподготовка","en":"Sample preparation","def":"Сушка, дробление, сокращение, истирание пробы"},{"ru":"Представительность пробы","en":"Sample representativeness","def":"Соответствие пробы партии"},{"ru":"Сокращение пробы","en":"Sample splitting / reduction","def":"Уменьшение массы пробы без потери представительности"},{"ru":"Истирание","en":"Pulverizing","def":"Измельчение пробы до аналитической крупности"},{"ru":"Кислотное разложение","en":"Acid digestion","def":"Растворение пробы смесью кислот"},{"ru":"Сплавление","en":"Fusion","def":"Разложение упорных проб плавнем"},{"ru":"Рентгенофлуоресцентный анализ","en":"X-ray fluorescence (XRF)","def":"Быстрый многоэлементный анализ твёрдых проб"},{"ru":"Портативный XRF","en":"Portable XRF (pXRF)","def":"Ручной анализатор для поля и склада"},{"ru":"Атомно-эмиссионная спектрометрия с ИСП","en":"ICP-OES","def":"Многоэлементный анализ растворов"},{"ru":"Масс-спектрометрия с ИСП","en":"ICP-MS","def":"Анализ следов и РЗЭ"},{"ru":"Лазерная абляция","en":"Laser ablation (LA-ICP-MS)","def":"Локальный анализ твёрдого образца"},{"ru":"Атомно-абсорбционная спектрометрия","en":"Atomic absorption spectrometry (AAS)","def":"Анализ отдельных элементов в растворах"},{"ru":"Пробирный анализ","en":"Fire assay","def":"Анализ на Au, Ag, платиноиды"},{"ru":"Газовый анализатор","en":"Combustion / inert gas fusion analyzer","def":"Определение C, S, O, N, H"},{"ru":"Масс-спектрометрия тлеющего разряда","en":"Glow discharge mass spectrometry (GDMS)","def":"Примеси в высокочистых металлах"},{"ru":"Рентгеновская дифракция","en":"X-ray diffraction (XRD)","def":"Фазовый анализ"},{"ru":"Метод Ритвельда","en":"Rietveld refinement","def":"Количественный
