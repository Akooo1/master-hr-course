о и связка в твёрдом сплаве ВК8 (8% Co). Значит, TMK покупает кобальт для своих твёрдых сплавов. Такие связи между металлами вы будете замечать всё чаще. Это признак отраслевого мышления.<\/p><\/blockquote>\n<h3>1.6 Где TMK на этой карте<\/h3>\n<p><strong>Ближайшие аналоги TMK в мире<\/strong> — интегрированные производители тугоплавких и редких металлов:<\/p>\n<ul><li><strong>Plansee Group<\/strong> (Австрия; W и Mo, твёрдые сплавы через Ceratizit, порошки через Global Tungsten &amp; Powders).<\/li><li><strong>Masan High-Tech Materials<\/strong> (Вьетнам; рудник Нуй Фао и химическая переработка вольфрама).<\/li><li><strong>Xiamen Tungsten, China Tungsten High-Tech<\/strong> (Китай; полная вольфрамовая цепочка).<\/li><li><strong>Молимет<\/strong> (Чили; переработка молибдена и производство рения).<\/li><li><strong>Ульбинский металлургический завод<\/strong> (Казахстан; тантал, ниобий, бериллий).<\/li><\/ul>\n<p><strong>Уникальность TMK [Аналитика]:<\/strong><\/p>\n<ol><li>Советская база тугоплавких металлов в Чирчике (стандарты ГОСТ, марки ВК).<\/li><li>Синергия с АГМК: медно-молибденовое сырьё, рений, селен, теллур.<\/li><li>Доступ к растворам урановых месторождений с РЗЭ и рением.<\/li><li>Государственный приоритет и финансирование.<\/li><li>Партнёрства одновременно с США, ЕС, Кореей, Японией и Китаем.<\/li><\/ol>\n<p><strong>Кадровое следствие:<\/strong> лучшие кандидаты для TMK — люди, которые <strong>уже проходили путь «руда → металл → изделие» в специализированных металлах<\/strong>. Их ищут в компаниях-аналогах и у их поставщиков.<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Горнодобывающая промышленность<\/td><td>Mining industry<\/td><td>Отрасль добычи твёрдых полезных ископаемых<\/td><\/tr><tr><td>Горно-металлургический комбинат (ГМК)<\/td><td>Mining and metallurgical complex<\/td><td>Интегрированное предприятие: добыча, обогащение и металлургия<\/td><\/tr><tr><td>Цепочка создания стоимости<\/td><td>Value chain<\/td><td>Последовательность переделов от недр до изделия<\/td><\/tr><tr><td>Передел<\/td><td>Processing stage / conversion step<\/td><td>Отдельная стадия переработки сырья<\/td><\/tr><tr><td>Добыча<\/td><td>Mining / extraction<\/td><td>Извлечение руды из недр<\/td><\/tr><tr><td>Обогащение<\/td><td>Mineral processing / beneficiation<\/td><td>Повышение содержания ценного минерала в продукте<\/td><\/tr><tr><td>Концентрат<\/td><td>Concentrate<\/td><td>Продукт обогащения с высоким содержанием ценного компонента<\/td><\/tr><tr><td>Рафинирование<\/td><td>Refining<\/td><td>Очистка металла от примесей до заданной чистоты<\/td><\/tr><tr><td>Полуфабрикат<\/td><td>Semi-finished product / mill product<\/td><td>Прутки, листы, проволока, порошки для дальнейшей обработки<\/td><\/tr><tr><td>Критическое сырьё<\/td><td>Critical raw materials (CRM)<\/td><td>Экономически важное сырьё с высоким риском поставок<\/td><\/tr><tr><td>Малые металлы<\/td><td>Minor metals<\/td><td>Металлы с небольшим рынком без биржевой торговли (W, Mo, Re, In и др.)<\/td><\/tr><tr><td>Тугоплавкие металлы<\/td><td>Refractory metals<\/td><td>W, Mo, Ta, Nb, Re: металлы с очень высокой температурой плавления<\/td><\/tr><tr><td>Редкоземельные элементы (РЗЭ)<\/td><td>Rare earth elements (REE)<\/td><td>15 лантаноидов, плюс иттрий и скандий<\/td><\/tr><tr><td>Мейджор<\/td><td>Major (mining major)<\/td><td>Крупнейшая диверсифицированная горнодобывающая компания<\/td><\/tr><tr><td>Юниор<\/td><td>Junior (exploration company)<\/td><td>Небольшая компания на стадии разведки или развития проекта<\/td><\/tr><tr><td>Компания среднего размера<\/td><td>Mid-tier producer<\/td><td>Производитель среднего масштаба<\/td><\/tr><tr><td>Государственная компания<\/td><td>State-owned enterprise (SOE)<\/td><td>Компания под контролем государства<\/td><\/tr><tr><td>Трейдер<\/td><td>Trader / trading house<\/td><td>Покупает и продаёт сырьё и металлы, финансирует поставки<\/td><\/tr><tr><td>EPCM-подрядчик<\/td><td>EPCM contractor<\/td><td>Проектирует, закупает и управляет строительством от имени владельца<\/td><\/tr><tr><td>Производитель оборудования<\/td><td>OEM (Original Equipment Manufacturer)<\/td><td>Производитель техники (Caterpillar, Metso и др.)<\/td><\/tr><tr><td>Офтейк-контракт<\/td><td>Offtake agreement<\/td><td>Долгосрочный договор на покупку будущей продукции<\/td><\/tr><tr><td>Капитальные затраты<\/td><td>CAPEX (capital expenditure)<\/td><td>Затраты на строительство и оборудование<\/td><\/tr><tr><td>Операционные затраты<\/td><td>OPEX (operating expenditure)<\/td><td>Затраты на эксплуатацию<\/td><\/tr><tr><td>Полная себестоимость поддержания<\/td><td>AISC (all-in sustaining cost)<\/td><td>Себестоимость с учётом поддерживающих капзатрат<\/td><\/tr><tr><td>Кривая затрат<\/td><td>Cost curve<\/td><td>Ранжирование производителей по себестоимости<\/td><\/tr><tr><td>Метрическая тонна-единица<\/td><td>mtu (metric tonne unit)<\/td><td>10 кг WO₃; единица цены вольфрамовых продуктов<\/td><\/tr><tr><td>Паравольфрамат аммония<\/td><td>APT (ammonium paratungstate)<\/td><td>Ключевой промежуточный продукт вольфрамовой цепочки; по его цене считают остальные<\/td><\/tr><tr><td>Сырьевой цикл<\/td><td>Commodity cycle<\/td><td>Волнообразные колебания цен и инвестиций<\/td><\/tr><tr><td>Социальная лицензия<\/td><td>Social licence to operate<\/td><td>Согласие местного сообщества на работу предприятия<\/td><\/tr><tr><td>Прослеживаемость цепочки поставок<\/td><td>Supply chain traceability / due diligence<\/td><td>Подтверждение происхождения сырья и ответственной добычи<\/td><\/tr><tr><td>Импортозамещение<\/td><td>Import substitution<\/td><td>Замена импортной продукции собственной<\/td><\/tr><tr><td>Конечные отрасли<\/td><td>End-use sectors / end markets<\/td><td>Отрасли-потребители металла<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Как «родная» компания формирует кандидата<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Откуда кандидат<\/th><th>Сильные стороны<\/th><th>Риски для TMK<\/th><th>Проверочный вопрос<\/th><\/tr><\/thead><tbody><tr><td>Мейджор<\/td><td>Системы, охрана труда, масштаб, процессы<\/td><td>Мог только «эксплуатировать готовое»; узкий участок<\/td><td>«Что вы построили или изменили сами, а что получили готовым?»<\/td><\/tr><tr><td>Узкопрофильный производитель<\/td><td>Редкая глубокая технология<\/td><td>Маленький масштаб, мало управленческого опыта<\/td><td>«Какой масштаб производства и сколько людей было в вашей зоне ответственности?»<\/td><\/tr><tr><td>Юниор<\/td><td>Предприимчивость, широкий профиль<\/td><td>Нет опыта эксплуатации и пуска<\/td><td>«Доводили ли вы проект до пуска и эксплуатации?»<\/td><\/tr><tr><td>Китайская компания<\/td><td>Практические технологии W и РЗЭ<\/td><td>Язык, ограничения на передачу технологий, иная культура документирования<\/td><td>«Какие процессы вы вели сами и на каком оборудовании?»<\/td><\/tr><tr><td>Предприятие СНГ<\/td><td>Практика, ГОСТ, устойчивость к сложным условиям<\/td><td>Мало опыта с международными стандартами<\/td><td>«С какими международными стандартами и аудитами работали?»<\/td><\/tr><tr><td>Консультант<\/td><td>Широкий кругозор, сильная аналитика и отчёты<\/td><td>Мало ответственности за результат на площадке<\/td><td>«Отвечали ли вы за производственные KPI на площадке не менее 2 лет?»<\/td><\/tr><tr><td>OEM<\/td><td>Глубокое знание оборудования<\/td><td>Мышление поставщика, а не владельца<\/td><td>«Как вы решали проблемы клиента, когда оборудование не выходило на паспортные показатели?»<\/td><\/tr><tr><td>НИИ или университет<\/td><td>Глубокая наука, методики<\/td><td>Нет опыта масштабирования и производства<\/td><td>«Какой ваш самый большой масштаб: лаборатория, пилотная установка или промышленность?»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Ловушка масштаба<\/h3>\n<p>Генеральный директор медного рудника на 50 млн т в год не обязательно хорош для вольфрамового рудника на 0,5 млн т. Отличаются задачи, бюджеты, системы и даже тип мышления. Всегда сравнивайте:<\/p>\n<ul><li><strong>масштаб<\/strong> (тонны, люди, бюджет);<\/li><li><strong>стадию<\/strong> (стройка, пуск, стабильная работа, кризис);<\/li><li><strong>технологию<\/strong> (металл и тип переработки).<\/li><\/ul>\n<h3>3.3 Сигналы рынка, по которым начинают поиск<\/h3>\n<ul><li><strong>Закрытие или приостановка производства<\/strong> → освобождается целая команда. Подключайтесь в первые недели.<\/li><li><strong>Слияния и поглощения<\/strong> → неопределённость и дублирование ролей; люди открыты к предложениям.<\/li><li><strong>Задержка или перерасход проекта<\/strong> → смена руководства, недовольство команды.<\/li><li><strong>Окончание строительства<\/strong> → строители проекта ищут следующий проект.<\/li><li><strong>Обвал цены на металл<\/strong> (например, литий в 2023–2024 гг.) → сокращения в целом сегменте.<\/li><\/ul>\n<h3>3.4 Первые вопросы, которые показывают уровень кандидата<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Что отвечает сильный кандидат<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Опишите цепочку от руды до продукта на вашем предприятии. Где были вы?»<\/td><td>Точная схема, цифры: производительность, содержание, извлечение, качество продукта<\/td><td>Общие слова без цифр; «мы», но непонятно, что делал сам<\/td><\/tr><tr><td>«Какие KPI были у вашего подразделения? Что вы изменили?»<\/td><td>2–3 KPI с базой и результатом: «извлечение с 72 до 78%»<\/td><td>Не помнит цифр; перечисляет обязанности вместо результатов<\/td><\/tr><tr><td>«Как цена металла влияла на решения компании?»<\/td><td>Понимает связь цены, бортового содержания, плана и затрат<\/td><td>«Это не моя зона» — для руководителя это плохой знак<\/td><\/tr><tr><td>«Кто ваши основные конкуренты и где они на кривой затрат?»<\/td><td>Называет конкурентов и их преимущества<\/td><td>Не знает рынок своего продукта<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика: карта компаний-доноров v1.0<\/h2>\n<p><strong>Задание (40 мин).<\/strong> Создайте таблицу (Excel, Google Sheets или Notion) по направлению <strong>«вольфрам: от концентрата до твёрдого сплава»<\/strong>.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Компания<\/th><th>Страна<\/th><th>Архетип<\/th><th>Звено цепочки<\/th><th>Роли, которые там можно найти<\/th><th>Язык<\/th><th>Риски (санкции, экспортный контроль)<\/th><th>Источник<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p><strong>Требования к результату:<\/strong><\/p>\n<ul><li>20 компаний, минимум 4 архетипа из таблицы 1.2.<\/li><li>Минимум 5 компаний из СНГ и Азии и минимум 5 из ЕС, Северной Америки и Австралии.<\/li><li>По каждой компании — минимум 2 конкретные роли (например, «технолог гидрометаллургического участка APT»).<\/li><li>Используйте LinkedIn (поиск по «ammonium paratungstate», «APT», «tungsten carbide», «cemented carbide»), сайты компаний, сайт ITIA, раздел о вольфраме в USGS Mineral Commodity Summaries.<\/li><\/ul>\n<p><strong>Критерии качества (самопроверка):<\/strong> можно ли по вашей таблице завтра начать прямой поиск? Если в строке нет ролей и источника, строка не готова.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<p>Запишите в журнал прогресса (5 минут, письменно):<\/p>\n<ol><li>Три вещи, которые я сегодня поняла и могу объяснить коллеге без шпаргалки.<\/li><li>Одна вещь, которая осталась непонятной (вопрос эксперту TMK).<\/li><li><strong>Обязательство на завтра:<\/strong> «Завтра в ___:___ в ___ (место) я начинаю День 2 с разминки». Конкретное время и место повышают вероятность, что вы действительно сядете заниматься.<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы только что сделали то, что большинство откладывает, — начали. Завтра будет легче, потому что у вас уже есть карта. Не дайте ей остыть: День 2 — в течение 24 часов.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li><strong>USGS Mineral Commodity Summaries<\/strong> (ежегодный, бесплатный) — по 2 страницы на металл: вольфрам, молибден, рений, РЗЭ, литий, графит, никель, кобальт, селен, теллур. <a href=\"https://www.usgs.gov/centers/national-minerals-information-center\" target=\"_blank\" rel=\"noopener\">usgs.gov/centers/national-minerals-information-center<\/a><\/li><li><strong>IEA Global Critical Minerals Outlook<\/strong> (ежегодный) — спрос, предложение и концентрация переработки.<\/li><li><strong>ITIA<\/strong> — <a href=\"https://www.itia.info\" target=\"_blank\" rel=\"noopener\">itia.info<\/a> (вольфрам); <strong>IMOA<\/strong> — <a href=\"https://www.imoa.info\" target=\"_blank\" rel=\"noopener\">imoa.info<\/a> (молибден).<\/li><li><strong>PwC «Mine»<\/strong> — ежегодный обзор 40 крупнейших горнодобывающих компаний мира.<\/li><li>Новости отрасли: Mining.com, Mining Journal, Mining Weekly, Fastmarkets (часть материалов платная).<\/li><li>Книга: Victor Rudenno, <em>The Mining Valuation Handbook<\/em> — экономика горных проектов простым языком.<\/li><li>Профиль TMK: <a href=\"#tmk\">../00-start/tmk-profile.md<\/a><\/li><\/ul>"},{"n":2,"module":1,"title":"Геология, минералогия и типы месторождений","file":"module-01-mining-fundamentals/day-02-geology-mineralogy-deposits.md","duration":"3,5 часа","challenge":"Составить <strong>«паспорта сырья»<\/strong> для трёх металлов TMK (вольфрам, графит, РЗЭ): минералы, типы месторождений, мировые примеры, главная технологическая сложность и <strong>какой геолог нужен<\/strong>.","why":"Геолог по медным порфировым месторождениям и геолог по вольфрамовым скарнам — разные специалисты, хотя в резюме у обоих написано «геолог, 15 лет». Международные кодексы (JORC) требуют от Competent Person опыта именно в данном <strong>стиле минерализации<\/strong>. Рекрутер, который понимает разницу, не тратит недели на нерелевантных кандидатов.","checklist":[{"text":"Разминка: 5 вопросов по Дню 1 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search: как читать резюме геолога (35 мин)","minutes":35},{"text":"Практика: 3 паспорта сырья + разбор 5 профилей (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.3, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Минерал","en":"Mineral","def":"Природное кристаллическое соединение определённого состава"},{"ru":"Горная порода","en":"Rock","def":"Природный агрегат минералов"},{"ru":"Руда","en":"Ore","def":"Порода, из которой экономически выгодно извлекать ценный компонент"},{"ru":"Пустая порода","en":"Waste rock","def":"Порода без ценного компонента, идёт в отвал"},{"ru":"Жильные (нерудные) минералы","en":"Gangue minerals","def":"Неценные минералы внутри руды"},{"ru":"Рудное тело","en":"Orebody","def":"Геологическое тело, сложенное рудой"},{"ru":"Месторождение","en":"Deposit","def":"Скопление полезного ископаемого, пригодное для отработки"},{"ru":"Рудопроявление","en":"Occurrence / prospect","def":"Признаки оруденения без доказанной экономики"},{"ru":"Содержание","en":"Grade","def":"Доля ценного компонента (%, г/т, ppm)"},{"ru":"Бортовое содержание","en":"Cut-off grade","def":"Минимальное содержание, при котором материал считается рудой"},{"ru":"Разубоживание","en":"Dilution","def":"Подмешивание пустой породы к руде при добыче"},{"ru":"Потери руды","en":"Ore loss","def":"Руда, не извлечённая из недр или ушедшая в отвал"},{"ru":"Извлечение","en":"Recovery","def":"Доля металла, перешедшая из руды в продукт"},{"ru":"Магматические породы","en":"Igneous rocks","def":"Породы, образованные из магмы"},{"ru":"Осадочные породы","en":"Sedimentary rocks","def":"Породы, образованные из осадков"},{"ru":"Метаморфические породы","en":"Metamorphic rocks","def":"Породы, изменённые давлением и температурой"},{"ru":"Скарн","en":"Skarn","def":"Порода на контакте интрузии с известняком; среда для шеелита"},{"ru":"Грейзен","en":"Greisen","def":"Изменённый гранит; среда для вольфрамита и олова"},{"ru":"Метасоматические изменения","en":"Alteration","def":"Изменение пород гидротермальными растворами"},{"ru":"Гидротермальный","en":"Hydrothermal","def":"Связанный с горячими рудоносными растворами"},{"ru":"Порфировое месторождение","en":"Porphyry deposit","def":"Крупное месторождение Cu–Mo–Au с низким содержанием"},{"ru":"Пегматит","en":"Pegmatite","def":"Крупнокристаллическая порода; источник лития и тантала"},{"ru":"Карбонатит","en":"Carbonatite","def":"Магматическая карбонатная порода; источник РЗЭ и Nb"},{"ru":"Россыпь","en":"Placer","def":"Скопление тяжёлых минералов в рыхлых отложениях"},{"ru":"Латерит","en":"Laterite","def":"Кора выветривания; источник Ni, Co, Al"},{"ru":"Шеелит","en":"Scheelite","def":"CaWO₄, главный минерал вольфрама в скарнах"},{"ru":"Вольфрамит","en":"Wolframite","def":"(Fe,Mn)WO₄, вольфрамовый минерал жил и грейзенов"},{"ru":"Молибденит","en":"Molybdenite","def":"MoS₂, главный минерал молибдена и носитель рения"},{"ru":"Бастнезит / монацит / ксенотим","en":"Bastnäsite / monazite / xenotime","def":"Главные минералы РЗЭ"},{"ru":"Сподумен","en":"Spodumene","def":"Главный литиевый минерал пегматитов"},{"ru":"Чешуйчатый графит","en":"Flake graphite","def":"Наиболее ценный тип природного графита"},{"ru":"Ошламование","en":"Sliming / overgrinding","def":"Переизмельчение хрупких минералов в тонкий шлам, ведущее к потерям"},{"ru":"Плотность (удельный вес)","en":"Specific gravity (SG) / density","def":"Основа гравитационного обогащения"}],"quiz":[{"q":"Почему руда — понятие экономическое?","options":["Потому что руду продают на бирже, а горную породу — нет, и цену руды определяют торги","Потому что порода становится рудой, только если извлечение металла выгодно при текущих ценах и технологиях","Потому что руду оценивают экономисты компании, а геологи описывают только горные породы, минералы и их происхождение","Потому что рудой по стандарту считается порода с содержанием металла выше 1%"],"answer":1,"explain":"При росте цен или появлении новой технологии бывшая пустая порода или хвосты могут стать рудой. Поэтому TMK может перерабатывать техногенные отходы Ингички."},{"q":"Какой минерал — главный носитель рения?","options":["Шеелит","Сподумен","Монацит","Молибденит"],"answer":3,"explain":"Рений изоморфно замещает молибден в молибдените. При окислительном обжиге молибденитового концентрата рений возгоняется, и его улавливают из газов."},{"q":"Какое свойство шеелита помогает геологам находить его в керне?","options":["Голубое свечение под коротковолновым ультрафиолетом","Сильный магнетизм, заметный при поднесении магнита к керну","Ярко-красный цвет и металлический блеск на свежем сколе","Быстрое растворение в воде при промывке керна"],"answer":0,"explain":"Шеелит люминесцирует под коротковолновым УФ. Вопрос про УФ-лампу — хороший маркер реального опыта работы с шеелитовыми рудами."},{"q":"В каком типе месторождений классически образуется шеелит?","options":["Латериты","Скарны","Рассолы","Россыпи монацита"],"answer":1,"explain":"Скарны формируются на контакте гранитоидных интрузий с известняками. Примеры — Сандон (Корея), Кантунг (Канада), Ингичка и Койташ (Узбекистан)."},{"q":"Какое свойство вольфрамита позволяет отделить его от шеелита и касситерита магнитной сепарацией?","options":["Вольфрамит легче воды и всплывает в пульпе","Вольфрамит гидрофобен и сам прилипает к пузырькам","Вольфрамит растворяется в воде","Вольфрамит слабомагнитный (парамагнитный)"],"answer":3,"explain":"Вольфрамит содержит железо и марганец и поэтому парамагнитен. Шеелит и касситерит практически немагнитны."},{"q":"Почему сырьё РЗЭ часто требует радиационного контроля?","options":["Минералы РЗЭ (например, монацит) часто содержат торий и уран","РЗЭ сами по себе радиоактивны, особенно неодим и празеодим","Высокая температура переработки делает минералы радиоактивными","Это требование только китайского законодательства"],"answer":0,"explain":"Монацит содержит торий, многие руды РЗЭ — уран. Это источник природной радиоактивности (NORM) в продуктах и отходах."},{"q":"Кандидат — сильный геолог-разведчик по медно-порфировым месторождениям, 15 лет опыта. Что верно для проекта TMK по вольфрамовым скарнам?","options":["Идеальный кандидат: геология везде одинаковая, а 15 лет опыта гарантируют результат на любом месторождении","Не подходит ни при каких условиях: опыт по меди никак не связан с вольфрамом и скарнами","Подходит при условии, что свободно говорит по-английски и имеет статус Competent Person","Совпадение только по типу работ; металл и стиль минерализации другие — нужна глубокая проверка релевантности"],"answer":3,"explain":"Три фильтра: металл, стиль, тип работ. Здесь совпадает только тип работ. Кандидат может подойти при наличии смежного опыта (например, скарны в окружении порфировых систем), но это нужно проверить."},{"q":"В каких единицах обычно выражают содержание в литиевых рудах?","options":["г/т Li","% Li₂O","% LCE","мг/л"],"answer":1,"explain":"Для твёрдых руд — % Li₂O (концентрат SC6 = 6% Li₂O). Мг/л используют для рассолов, LCE (эквивалент карбоната лития) — для продукции и рыночных объёмов."},{"q":"Какой тип месторождений связан с идеей TMK извлекать РЗЭ и рений из растворов?","options":["Скарновые вольфрамовые месторождения Самаркандской области, отрабатываемые подземным способом","Россыпи с монацитом, отрабатываемые дражным способом","Медно-порфировые месторождения Алмалыкского рудного района","Песчаниковые урановые, отрабатываемые скважинным подземным выщелачиванием"],"answer":3,"explain":"В песчаниковых урановых месторождениях Кызылкумов вместе с ураном присутствуют рений, РЗЭ и другие элементы. После извлечения урана они остаются в растворах. Об этом соглашение TMK с Solvomet KU Leuven."},{"q":"Почему тонкое переизмельчение (ошламование) особенно опасно для вольфрамовых руд?","options":["Вольфрам окисляется при измельчении и переходит в растворимую форму, которую нельзя уловить","Вольфрамовые минералы хрупкие и уходят в тонкие шламы, которые плохо извлекаются, — растут потери","Тонкие шламы вольфрама взрывоопасны и требуют остановки мельниц","Это не проблема: тонкие частицы флотируются лучше крупных"],"answer":1,"explain":"Шеелит и вольфрамит хрупкие. Тонкие частицы плохо улавливаются гравитацией и флотацией, поэтому исторически извлечение вольфрама ниже, чем у многих других металлов. Опыт борьбы с потерями в шламах — сильный маркер технолога-обогатителя по вольфраму."}],"html":"<h2>0. Разминка: вспомнить День 1<\/h2>\n<p>Ответьте вслух или письменно <strong>до<\/strong> чтения нового материала. Попытка вспомнить закрепляет знание сильнее, чем повторное чтение.<\/p>\n<ol><li>Назовите звенья цепочки вольфрама от руды до изделия.<\/li><li>Что такое APT и в каких единицах торгуют вольфрамом?<\/li><li>Назовите 3 компании-аналога TMK.<\/li><li>Какие два критерия делают минерал «критическим»?<\/li><li>Почему консультант не всегда подходит на операционную роль?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Руда → концентрат → APT → оксиды → порошок W → WC → твёрдый сплав → изделие.<\/li><li>Паравольфрамат аммония; цена — в $/mtu WO₃ (1 mtu = 10 кг WO₃).<\/li><li>Plansee Group, Masan High-Tech Materials, Xiamen Tungsten / China Tungsten High-Tech (также Molymet, Ульбинский металлургический завод).<\/li><li>Экономическая важность и высокий риск поставок.<\/li><li>Консультант не отвечал ежедневно за производственные KPI, безопасность и людей на площадке.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Базовая лестница понятий: от минерала до месторождения<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Понятие<\/th><th>Определение<\/th><th>Пример<\/th><\/tr><\/thead><tbody><tr><td><strong>Химический элемент<\/strong><\/td><td>То, что в итоге продаёт TMK<\/td><td>W, Mo, Re, Nd<\/td><\/tr><tr><td><strong>Минерал<\/strong> (mineral)<\/td><td>Природное кристаллическое соединение определённого состава<\/td><td>Шеелит CaWO₄, молибденит MoS₂<\/td><\/tr><tr><td><strong>Горная порода<\/strong> (rock)<\/td><td>Природный агрегат минералов<\/td><td>Гранит, известняк, скарн<\/td><\/tr><tr><td><strong>Руда<\/strong> (ore)<\/td><td>Порода, из которой <strong>экономически выгодно<\/strong> извлекать ценный компонент при текущих ценах и технологиях<\/td><td>Скарн с 0,5% WO₃<\/td><\/tr><tr><td><strong>Пустая порода<\/strong> (waste rock) / <strong>жильные минералы<\/strong> (gangue)<\/td><td>Порода без ценности / неценные минералы внутри руды<\/td><td>Кварц, кальцит, флюорит в вольфрамовой руде<\/td><\/tr><tr><td><strong>Рудное тело<\/strong> (orebody)<\/td><td>Геологическое тело, сложенное рудой<\/td><td>Скарновая залежь длиной 300 м<\/td><\/tr><tr><td><strong>Месторождение<\/strong> (deposit)<\/td><td>Скопление полезного ископаемого, пригодное для отработки<\/td><td>Ингичка, Калмакыр<\/td><\/tr><tr><td><strong>Рудопроявление<\/strong> (occurrence, prospect)<\/td><td>Признаки оруденения, масштаб и экономика не доказаны<\/td><td>Точка на карте с повышенным W<\/td><\/tr><tr><td><strong>Рудное поле → рудный район → металлогенический пояс<\/strong><\/td><td>Всё более крупные территории с похожим оруденением<\/td><td>Алмалыкский рудный район; Тянь-Шаньский пояс<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Главная мысль:<\/strong> <strong>руда — понятие экономическое, а не геологическое.<\/strong> Если цена на вольфрам выросла на 900%, вчерашняя «пустая порода» с низким содержанием может стать рудой. Поэтому TMK может перерабатывать <strong>техногенные отходы<\/strong> Ингички: при новых ценах и технологиях старые хвосты становятся сырьём.<\/p>\n<h3>1.2 Содержание: язык цифр геолога<\/h3>\n<p>Содержание (grade) — доля ценного компонента. Для каждого металла своя единица. Если кандидат путает единицы своего металла, это сигнал.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл<\/th><th>Единица<\/th><th>Типичное содержание в руде<\/th><th>Типичный концентрат или продукт<\/th><\/tr><\/thead><tbody><tr><td>Вольфрам<\/td><td>% WO₃<\/td><td>0,2–1%<\/td><td>65% WO₃ (торговый стандарт)<\/td><\/tr><tr><td>Молибден<\/td><td>% Mo или % MoS₂<\/td><td>0,01–0,05% Mo (попутно в медно-порфировых рудах); 0,1–0,3% в собственно молибденовых<\/td><td>45–58% Mo<\/td><\/tr><tr><td>Медь<\/td><td>% Cu<\/td><td>0,3–1% (порфировые)<\/td><td>20–30% Cu<\/td><\/tr><tr><td>Золото<\/td><td>г/т<\/td><td>0,5–10 г/т<\/td><td>—<\/td><\/tr><tr><td>РЗЭ<\/td><td>% TREO (сумма оксидов РЗЭ)<\/td><td>от 0,05–0,2% (ионно-адсорбционные глины) до 5–8% (богатые карбонатиты)<\/td><td>30–60% TREO<\/td><\/tr><tr><td>Литий<\/td><td>% Li₂O (руда), мг/л (рассолы)<\/td><td>1–1,5% Li₂O; рассолы — сотни–тысячи мг/л<\/td><td>Сподуменовый концентрат 6% Li₂O (SC6)<\/td><\/tr><tr><td>Графит<\/td><td>% Cg (графитовый углерод)<\/td><td>3–20% Cg<\/td><td>94–97% C; батарейный анод ≥ 99,95% C<\/td><\/tr><tr><td>Никель<\/td><td>% Ni<\/td><td>0,5–2%<\/td><td>Сульфидный концентрат 10–20% Ni<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ключевые параметры, которые встречаются в резюме:<\/strong><\/p>\n<ul><li><strong>Бортовое содержание<\/strong> (cut-off grade) — минимальное содержание, при котором материал считается рудой.<\/li><li><strong>Разубоживание<\/strong> (dilution) — подмешивание пустой породы при добыче, снижает содержание.<\/li><li><strong>Потери<\/strong> (ore loss) — руда, оставленная в недрах или отправленная в отвал.<\/li><li><strong>Извлечение<\/strong> (recovery) — какая доля металла из руды попала в продукт.<\/li><\/ul>\n<h3>1.3 Горные породы и геологические процессы (минимум для разговора)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип породы<\/th><th>Как образуется<\/th><th>Примеры<\/th><th>Связь с полезными ископаемыми<\/th><\/tr><\/thead><tbody><tr><td><strong>Магматические<\/strong> (igneous) — интрузивные<\/td><td>Кристаллизация магмы на глубине<\/td><td>Гранит, гранодиорит, сиенит, <strong>карбонатит<\/strong><\/td><td>Граниты дают W, Sn, Mo, Li; карбонатиты и щелочные породы — РЗЭ, Nb<\/td><\/tr><tr><td><strong>Магматические<\/strong> — эффузивные (вулканические)<\/td><td>Излияние лавы на поверхность<\/td><td>Базальт, андезит, риолит<\/td><td>Эпитермальное золото, вулканогенные сульфиды<\/td><\/tr><tr><td><strong>Осадочные<\/strong> (sedimentary)<\/td><td>Накопление осадков<\/td><td>Песчаник, известняк, фосфорит, соли<\/td><td>Уран (в песчаниках), фосфаты, литиевые рассолы; <strong>известняк + гранит → скарн<\/strong><\/td><\/tr><tr><td><strong>Метаморфические<\/strong> (metamorphic)<\/td><td>Преобразование пород давлением и температурой<\/td><td>Сланец, гнейс, мрамор, <strong>скарн<\/strong><\/td><td>Чешуйчатый графит (в гнейсах и сланцах), скарновые W, Cu, Fe<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Гидротермальные процессы.<\/strong> Горячие растворы, отделяющиеся от магмы, переносят металлы и отлагают их в трещинах и пористых породах. Попутно они изменяют вмещающие породы. Названия этих изменений встречаются в резюме геологов:<\/p>\n<ul><li><strong>Метасоматоз / изменение пород<\/strong> (alteration): калишпатизация (potassic), серицитизация (phyllic), пропилитизация (propylitic), аргиллизация (argillic) — зоны порфировых месторождений.<\/li><li><strong>Скарнирование<\/strong> (skarn formation) — реакция магматических растворов с известняками. Классическая среда для <strong>шеелита<\/strong>.<\/li><li><strong>Грейзенизация<\/strong> (greisenization) — изменение гранитов с образованием кварц-слюдистых пород. Среда для <strong>вольфрамита<\/strong>, олова, лития.<\/li><\/ul>\n<h3>1.4 Минералогия: свойства минерала определяют технологию<\/h3>\n<p>Это самая полезная связь дня. <strong>Каждое физическое или химическое свойство минерала — это «ручка», за которую его можно отделить от пустой породы.<\/strong> Модуль 2 целиком построен на этой идее.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Свойство минерала<\/th><th>Метод переработки, который его использует<\/th><\/tr><\/thead><tbody><tr><td>Плотность (density, удельный вес)<\/td><td>Гравитационное обогащение (отсадка, концентрационные столы, спирали, тяжёлые среды)<\/td><\/tr><tr><td>Магнитная восприимчивость<\/td><td>Магнитная сепарация<\/td><\/tr><tr><td>Свойства поверхности (смачиваемость водой)<\/td><td>Флотация<\/td><\/tr><tr><td>Электропроводность<\/td><td>Электростатическая сепарация<\/td><\/tr><tr><td>Люминесценция, рентгеновская плотность, цвет<\/td><td>Сортировка руды (sensor-based sorting)<\/td><\/tr><tr><td>Растворимость в кислотах и щелочах<\/td><td>Выщелачивание (гидрометаллургия)<\/td><\/tr><tr><td>Летучесть соединений, температура плавления<\/td><td>Пирометаллургия (обжиг, возгонка, плавка)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Главные рудные минералы металлов TMK:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл<\/th><th>Минерал<\/th><th>Формула<\/th><th>Плотность, г/см³<\/th><th>Что важно знать<\/th><\/tr><\/thead><tbody><tr><td><strong>W<\/strong><\/td><td><strong>Шеелит<\/strong> (scheelite)<\/td><td>CaWO₄<\/td><td>≈ 6,1<\/td><td>Светится голубым под коротковолновым УФ: геологи ищут его ночью с УФ-лампой. Немагнитный. Хрупкий, легко <strong>ошламовывается<\/strong> (переизмельчается в тонкий шлам)<\/td><\/tr><tr><td><strong>W<\/strong><\/td><td><strong>Вольфрамит<\/strong> (wolframite)<\/td><td>(Fe,Mn)WO₄<\/td><td>≈ 7,1–7,5<\/td><td>Слабомагнитный (парамагнитный) → магнитная сепарация. Крайние члены ряда: ферберит FeWO₄ и гюбнерит MnWO₄<\/td><\/tr><tr><td><strong>Mo<\/strong><\/td><td><strong>Молибденит<\/strong> (molybdenite)<\/td><td>MoS₂<\/td><td>≈ 4,7<\/td><td>Очень мягкий, «жирный» на ощупь, <strong>природно гидрофобный<\/strong> (легко флотируется). Главный носитель <strong>рения<\/strong><\/td><\/tr><tr><td><strong>Re<\/strong><\/td><td>Собственных промышленных минералов нет<\/td><td>—<\/td><td>—<\/td><td>Изоморфно замещает Mo в молибдените; встречается в песчаниковых урановых месторождениях; улавливается из газов обжига молибденита и медного производства<\/td><\/tr><tr><td><strong>РЗЭ<\/strong><\/td><td><strong>Бастнезит<\/strong> (bastnäsite)<\/td><td>(Ce,La,Nd)CO₃F<\/td><td>≈ 4,9–5,2<\/td><td>Главный минерал лёгких РЗЭ (Маунтин-Пасс, Баян-Обо)<\/td><\/tr><tr><td><strong>РЗЭ<\/strong><\/td><td><strong>Монацит<\/strong> (monazite)<\/td><td>(Ce,La,Nd,Th)PO₄<\/td><td>≈ 5,0–5,3<\/td><td>Содержит <strong>торий<\/strong> → радиоактивность; характерен для россыпей<\/td><\/tr><tr><td><strong>РЗЭ<\/strong><\/td><td><strong>Ксенотим<\/strong> (xenotime)<\/td><td>YPO₄<\/td><td>≈ 4,4–5,1<\/td><td>Источник <strong>тяжёлых РЗЭ<\/strong> и иттрия<\/td><\/tr><tr><td><strong>РЗЭ<\/strong><\/td><td>Лопарит, эвдиалит, апатит; ионно-адсорбционные глины<\/td><td>—<\/td><td>—<\/td><td>Лопарит — Ловозеро (Россия). В глинах РЗЭ не образуют минералов, а адсорбированы на поверхности глинистых частиц<\/td><\/tr><tr><td><strong>Li<\/strong><\/td><td><strong>Сподумен<\/strong> (spodumene)<\/td><td>LiAlSi₂O₆<\/td><td>≈ 3,1–3,2<\/td><td>Теоретически 8,03% Li₂O; главный литиевый минерал пегматитов<\/td><\/tr><tr><td><strong>Li<\/strong><\/td><td>Лепидолит, петалит; литиевые рассолы<\/td><td>—<\/td><td>—<\/td><td>Рассолы — литий в растворе; добывают скважинами<\/td><\/tr><tr><td><strong>C<\/strong><\/td><td><strong>Графит<\/strong> (graphite)<\/td><td>C<\/td><td>≈ 2,1–2,2<\/td><td>Гидрофобный, проводит ток (хорошо виден электроразведкой). Типы: чешуйчатый (flake), жильный (vein), аморфный<\/td><\/tr><tr><td><strong>Ni<\/strong><\/td><td>Пентландит (сульфидные руды); никелевые латериты<\/td><td>(Fe,Ni)₉S₈<\/td><td>≈ 4,6–5,0<\/td><td>В латеритах Ni рассеян в гётите и серпентине, отдельного минерала часто нет<\/td><\/tr><tr><td><strong>Co<\/strong><\/td><td>Карролит, гетерогенит; примесь в Ni-сульфидах<\/td><td>—<\/td><td>—<\/td><td>Обычно попутный металл (медь в Конго, никель)<\/td><\/tr><tr><td><strong>Cu<\/strong> (контекст АГМК)<\/td><td>Халькопирит<\/td><td>CuFeS₂<\/td><td>≈ 4,1–4,3<\/td><td>Главный медный минерал; при рафинировании меди попутно получают Se, Te, Au, Ag<\/td><\/tr><tr><td><strong>Ta, Nb<\/strong><\/td><td>Колумбит-танталит, пирохлор<\/td><td>—<\/td><td>5,2–8,0<\/td><td>Входят в задачи TMK<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Вредные спутники<\/strong> (с ними связаны технологические проблемы, а значит — опыт кандидатов):<\/p>\n<ul><li><strong>Кальцит, флюорит, апатит<\/strong> — «главные враги» шеелита во флотации: у них похожая поверхностная химия (все — кальциевые минералы).<\/li><li><strong>Слюды и глинистые минералы<\/strong> — образуют шламы, ухудшают флотацию и фильтрацию.<\/li><li><strong>Пирит, пирротин<\/strong> — дают кислые дренажные воды (экология).<\/li><li><strong>Торий и уран<\/strong> — радиоактивность в сырье РЗЭ: нужна радиационная безопасность.<\/li><\/ul>\n<h3>1.5 Типы месторождений: что, где и почему это важно<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Металлы<\/th><th>Мировые примеры<\/th><th>Центральная Азия<\/th><th>Особенности для добычи и переработки<\/th><\/tr><\/thead><tbody><tr><td><strong>Порфировые<\/strong> (porphyry) Cu–Mo–Au<\/td><td>Cu, Mo, Au, <strong>Re<\/strong><\/td><td>Эскондида, Чукикамата (Чили), Грасберг (Индонезия), Оюу-Толгой (Монголия), Бингем-Каньон (США)<\/td><td><strong>Калмакыр, Дальнее (Алмалык)<\/strong>, Актогай (Казахстан)<\/td><td>Огромные объёмы, низкое содержание. Карьеры или блоковое обрушение. Mo и Re — попутные продукты<\/td><\/tr><tr><td>Порфировые Mo (тип Climax)<\/td><td>Mo<\/td><td>Клаймакс, Хендерсон (США)<\/td><td>—<\/td><td>Собственно молибденовые руды<\/td><\/tr><tr><td><strong>Скарновые<\/strong> (skarn)<\/td><td><strong>W (шеелит)<\/strong>, Cu, Fe, Zn, Mo<\/td><td>Сандон (Корея), Кантунг (Канада), Тырныауз (Россия, W–Mo)<\/td><td><strong>Ингичка, Койташ (Узбекистан)<\/strong><\/td><td>Неправильные залежи, сильная изменчивость содержания → селективная, часто подземная добыча<\/td><\/tr><tr><td><strong>Грейзеновые, жильные, штокверковые<\/strong><\/td><td><strong>W (вольфрамит)<\/strong>, Sn, Mo, Li<\/td><td>Панаскейра (Португалия), месторождения Цзянси (Китай), Хемердон (Великобритания)<\/td><td>Верхнее Кайракты (Казахстан, крупное вольфрамовое)<\/td><td>Жилы — подземная добыча; штокверки — крупные карьеры с низким содержанием<\/td><\/tr><tr><td><strong>Пегматиты<\/strong> (LCT-pegmatites)<\/td><td><strong>Li<\/strong>, Ta, Cs, Sn, Be<\/td><td>Гринбушес, Пилганура (Австралия), Маноно (ДР Конго)<\/td><td>Казахстан (Восточный)<\/td><td>Обычно карьеры; переработка — тяжёлые среды + флотация<\/td><\/tr><tr><td><strong>Рассолы<\/strong> (brines)<\/td><td><strong>Li<\/strong>, K, B, Mg<\/td><td>Салар-де-Атакама (Чили), Омбре-Муэрто (Аргентина)<\/td><td>—<\/td><td>Скважины, испарительные бассейны или DLE (прямое извлечение лития)<\/td><\/tr><tr><td><strong>Карбонатиты и щелочные комплексы<\/strong><\/td><td><strong>РЗЭ<\/strong>, Nb, P<\/td><td>Баян-Обо (Китай), Маунтин-Пасс (США), Маунт-Уэлд (Австралия), Ловозеро, Хибины, Томтор (Россия)<\/td><td>—<\/td><td>Сложная минералогия, торий и уран. Длинная цепочка от руды до оксидов<\/td><\/tr><tr><td><strong>Ионно-адсорбционные глины<\/strong><\/td><td><strong>Тяжёлые РЗЭ<\/strong><\/td><td>Южный Китай, Мьянма, Серра-Верде (Бразилия)<\/td><td>—<\/td><td>Низкое содержание, но простое выщелачивание солевыми растворами<\/td><\/tr><tr><td><strong>Россыпи и минеральные пески<\/strong> (placers, mineral sands)<\/td><td>Ti, Zr, <strong>РЗЭ (монацит)<\/strong>, Au, Sn<\/td><td>Энеабба (Австралия), Керала (Индия)<\/td><td>—<\/td><td>Гравитация, магнитная и электростатическая сепарация<\/td><\/tr><tr><td><strong>Магматические сульфидные<\/strong> Cu–Ni–ЭПГ<\/td><td><strong>Ni<\/strong>, Cu, Co, платиноиды<\/td><td>Норильск-Талнах, Садбери (Канада), Войсис-Бей (Канада), Цзиньчуань (Китай)<\/td><td>—<\/td><td>Подземная добыча, флотация, плавка на штейн<\/td><\/tr><tr><td><strong>Латериты<\/strong><\/td><td><strong>Ni–Co<\/strong>, бокситы, РЗЭ (Маунт-Уэлд)<\/td><td>Индонезия, Филиппины, Новая Каледония<\/td><td>—<\/td><td>Автоклавное выщелачивание (HPAL) или пирометаллургия<\/td><\/tr><tr><td><strong>Стратиформные медные<\/strong> (sediment-hosted)<\/td><td>Cu, <strong>Co<\/strong>, Ag, <strong>Re<\/strong><\/td><td>Медный пояс ДР Конго и Замбии, Удокан (Россия)<\/td><td>Жезказган (Казахстан; известен попутным рением)<\/td><td>Подземные и открытые работы<\/td><\/tr><tr><td><strong>Песчаниковые урановые<\/strong> (roll-front)<\/td><td>U, <strong>Re<\/strong>, Se, V, Sc, <strong>РЗЭ<\/strong><\/td><td>—<\/td><td><strong>Кызылкумы (Узбекистан)<\/strong>, Шу-Сарысу (Казахстан)<\/td><td>Скважинное подземное выщелачивание (СПВ/ISR). Отсюда идея TMK извлекать РЗЭ и рений из растворов<\/td><\/tr><tr><td><strong>Орогенные золоторудные<\/strong><\/td><td>Au<\/td><td>—<\/td><td><strong>Мурунтау<\/strong> (одно из крупнейших золоторудных месторождений мира, НГМК), Кумтор (Кыргызстан)<\/td><td>Не профиль TMK, но крупнейший работодатель горняков в Узбекистане — пул кандидатов<\/td><\/tr><tr><td><strong>Графитовые<\/strong><\/td><td>Графит<\/td><td>Балама (Мозамбик), Моло (Мадагаскар); жильный графит Шри-Ланки<\/td><td><strong>Тасказган (Бухарская обл.)<\/strong><\/td><td>Карьеры; флотация с многократной перечисткой<\/td><\/tr><tr><td><strong>Фосфориты<\/strong><\/td><td>P, иногда U, РЗЭ (особенно Y)<\/td><td>—<\/td><td>Центральные Кызылкумы<\/td><td>Потенциальный попутный источник РЗЭ<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.6 Геология Узбекистана за пять минут<\/h3>\n<ul><li><strong>Тянь-Шаньский складчатый пояс<\/strong> — один из богатейших металлогенических поясов мира. Узбекистан занимает его западную часть.<\/li><li><strong>Кызылкумы<\/strong> — золото (Мурунтау и др.), уран (песчаниковый, отрабатывается методом СПВ), фосфориты.<\/li><li><strong>Кураминский и Чаткальский хребты (Ташкентская обл.)<\/strong> — Алмалыкский рудный район: медно-порфировые месторождения с Mo, Au, Re (Калмакыр, Дальнее). Рядом угленосный и каолиновый Ангренский район.<\/li><li><strong>Зарафшано-Нуратинская зона<\/strong> — скарновые вольфрамовые месторождения (Ингичка в Самаркандской обл., Койташ в Джизакской обл.).<\/li><li><strong>Бухарская обл.<\/strong> — Тасказганский графитовый проект.<\/li><\/ul>\n<blockquote><p><strong>TMK:<\/strong> на карте активов компании — Чирчик, Ахангаранский район и Самаркандская область. Самаркандская обл. — это вольфрам (Ингичка и новый горнорудный комплекс). Чирчик — металлургия и изделия. Назначение площадки в Ахангаранском районе публично не детализировано: уточните внутри компании.<\/p><\/blockquote>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Минерал<\/td><td>Mineral<\/td><td>Природное кристаллическое соединение определённого состава<\/td><\/tr><tr><td>Горная порода<\/td><td>Rock<\/td><td>Природный агрегат минералов<\/td><\/tr><tr><td>Руда<\/td><td>Ore<\/td><td>Порода, из которой экономически выгодно извлекать ценный компонент<\/td><\/tr><tr><td>Пустая порода<\/td><td>Waste rock<\/td><td>Порода без ценного компонента, идёт в отвал<\/td><\/tr><tr><td>Жильные (нерудные) минералы<\/td><td>Gangue minerals<\/td><td>Неценные минералы внутри руды<\/td><\/tr><tr><td>Рудное тело<\/td><td>Orebody<\/td><td>Геологическое тело, сложенное рудой<\/td><\/tr><tr><td>Месторождение<\/td><td>Deposit<\/td><td>Скопление полезного ископаемого, пригодное для отработки<\/td><\/tr><tr><td>Рудопроявление<\/td><td>Occurrence / prospect<\/td><td>Признаки оруденения без доказанной экономики<\/td><\/tr><tr><td>Содержание<\/td><td>Grade<\/td><td>Доля ценного компонента (%, г/т, ppm)<\/td><\/tr><tr><td>Бортовое содержание<\/td><td>Cut-off grade<\/td><td>Минимальное содержание, при котором материал считается рудой<\/td><\/tr><tr><td>Разубоживание<\/td><td>Dilution<\/td><td>Подмешивание пустой породы к руде при добыче<\/td><\/tr><tr><td>Потери руды<\/td><td>Ore loss<\/td><td>Руда, не извлечённая из недр или ушедшая в отвал<\/td><\/tr><tr><td>Извлечение<\/td><td>Recovery<\/td><td>Доля металла, перешедшая из руды в продукт<\/td><\/tr><tr><td>Магматические породы<\/td><td>Igneous rocks<\/td><td>Породы, образованные из магмы<\/td><\/tr><tr><td>Осадочные породы<\/td><td>Sedimentary rocks<\/td><td>Породы, образованные из осадков<\/td><\/tr><tr><td>Метаморфические породы<\/td><td>Metamorphic rocks<\/td><td>Породы, изменённые давлением и температурой<\/td><\/tr><tr><td>Скарн<\/td><td>Skarn<\/td><td>Порода на контакте интрузии с известняком; среда для шеелита<\/td><\/tr><tr><td>Грейзен<\/td><td>Greisen<\/td><td>Изменённый гранит; среда для вольфрамита и олова<\/td><\/tr><tr><td>Метасоматические изменения<\/td><td>Alteration<\/td><td>Изменение пород гидротермальными растворами<\/td><\/tr><tr><td>Гидротермальный<\/td><td>Hydrothermal<\/td><td>Связанный с горячими рудоносными растворами<\/td><\/tr><tr><td>Порфировое месторождение<\/td><td>Porphyry deposit<\/td><td>Крупное месторождение Cu–Mo–Au с низким содержанием<\/td><\/tr><tr><td>Пегматит<\/td><td>Pegmatite<\/td><td>Крупнокристаллическая порода; источник лития и тантала<\/td><\/tr><tr><td>Карбонатит<\/td><td>Carbonatite<\/td><td>Магматическая карбонатная порода; источник РЗЭ и Nb<\/td><\/tr><tr><td>Россыпь<\/td><td>Placer<\/td><td>Скопление тяжёлых минералов в рыхлых отложениях<\/td><\/tr><tr><td>Латерит<\/td><td>Laterite<\/td><td>Кора выветривания; источник Ni, Co, Al<\/td><\/tr><tr><td>Шеелит<\/td><td>Scheelite<\/td><td>CaWO₄, главный минерал вольфрама в скарнах<\/td><\/tr><tr><td>Вольфрамит<\/td><td>Wolframite<\/td><td>(Fe,Mn)WO₄, вольфрамовый минерал жил и грейзенов<\/td><\/tr><tr><td>Молибденит<\/td><td>Molybdenite<\/td><td>MoS₂, главный минерал молибдена и носитель рения<\/td><\/tr><tr><td>Бастнезит / монацит / ксенотим<\/td><td>Bastnäsite / monazite / xenotime<\/td><td>Главные минералы РЗЭ<\/td><\/tr><tr><td>Сподумен<\/td><td>Spodumene<\/td><td>Главный литиевый минерал пегматитов<\/td><\/tr><tr><td>Чешуйчатый графит<\/td><td>Flake graphite<\/td><td>Наиболее ценный тип природного графита<\/td><\/tr><tr><td>Ошламование<\/td><td>Sliming / overgrinding<\/td><td>Переизмельчение хрупких минералов в тонкий шлам, ведущее к потерям<\/td><\/tr><tr><td>Плотность (удельный вес)<\/td><td>Specific gravity (SG) / density<\/td><td>Основа гравитационного обогащения<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Специализации геологов: кто есть кто<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Специализация (RU)<\/th><th>Title (EN)<\/th><th>Чем занимается<\/th><th>Где нужна в TMK<\/th><\/tr><\/thead><tbody><tr><td>Геолог-разведчик, геолог-съёмщик<\/td><td>Exploration Geologist / Field Geologist<\/td><td>Картирование, поиски, документация керна<\/td><td>Новые месторождения, Тасказган<\/td><\/tr><tr><td>Структурный геолог<\/td><td>Structural Geologist<\/td><td>Разломы и складки, контролирующие оруденение<\/td><td>Скарны и жилы: оруденение контролируется структурой<\/td><\/tr><tr><td>Геохимик<\/td><td>Geochemist<\/td><td>Геохимические съёмки, интерпретация анализов<\/td><td>Поиски W, Li, РЗЭ<\/td><\/tr><tr><td>Геофизик<\/td><td>Geophysicist<\/td><td>Магнито-, электро-, гравиразведка, радиометрия<\/td><td>Графит (электроразведка), скарны (магниторазведка)<\/td><\/tr><tr><td>Минералог, технологический минералог<\/td><td>Mineralogist / Process Mineralogist<\/td><td>Состав руды, раскрытие минералов, QEMSCAN/MLA<\/td><td>Связка геологии и переработки; дефицитная роль<\/td><\/tr><tr><td>Геолог-ресурсник, геостатистик<\/td><td>Resource Geologist / Geostatistician<\/td><td>Геологическая модель, подсчёт ресурсов<\/td><td>Все проекты, отчёты по JORC<\/td><\/tr><tr><td>Участковый (рудничный) геолог<\/td><td>Mine Geologist / Grade Control Geologist<\/td><td>Контроль качества руды при добыче<\/td><td>Действующие рудники<\/td><\/tr><tr><td>Гидрогеолог<\/td><td>Hydrogeologist<\/td><td>Подземные воды, водоотлив, СПВ<\/td><td>Рудники, урановые растворы<\/td><\/tr><tr><td>Инженер-геолог, геотехник<\/td><td>Engineering Geologist / Geotechnical Engineer<\/td><td>Устойчивость бортов и выработок<\/td><td>Карьеры и подземные рудники<\/td><\/tr><tr><td>Главный геолог<\/td><td>Chief Geologist / Head of Geology<\/td><td>Вся геологическая служба, запасы, отчётность<\/td><td>Каждое добывающее предприятие<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Три фильтра релевантности геолога<\/h3>\n<ol><li><strong>Металл<\/strong> (commodity): W, Li, РЗЭ, Cu, Au…<\/li><li><strong>Стиль минерализации<\/strong> (style of mineralisation): скарн, порфир, пегматит, карбонатит…<\/li><li><strong>Тип работ<\/strong> (type of activity): разведка, оценка ресурсов, эксплуатация, контроль качества руды.<\/li><\/ol>\n<p>Совпадение по всем трём — идеальный кандидат. Совпадение по 2 из 3 — рабочий вариант с адаптацией. Совпадение только по «геолог, N лет» — почти всегда пустая трата времени нанимающего менеджера.<\/p>\n<blockquote><p>Этот же принцип заложен в JORC: Competent Person должен иметь не менее 5 лет опыта, <strong>относящегося к рассматриваемому стилю минерализации и типу месторождения<\/strong> и к виду деятельности (подробнее — в Дне 3).<\/p><\/blockquote>\n<h3>3.3 Вопросы, которые отличают практика от теоретика<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Сильный ответ<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Опишите месторождение, на котором вы работали: тип, морфология рудных тел, главные рудные минералы»<\/td><td>Точный тип, размеры и форма тел, минералы, вмещающие породы, структурный контроль<\/td><td>Общие слова; не может назвать минералы<\/td><\/tr><tr><td>«Какое было бортовое содержание и среднее содержание?»<\/td><td>Конкретные цифры в правильных единицах (% WO₃ для вольфрама)<\/td><td>Путает единицы; «не помню»<\/td><\/tr><tr><td>«Какие минералы осложняли переработку?»<\/td><td>Для шеелита — кальцит, флюорит, апатит; для РЗЭ — торий; для графита — слюды<\/td><td>Не понимает связи геологии и переработки<\/td><\/tr><tr><td>«Пользовались ли вы УФ-лампой при документации?» (вольфрам)<\/td><td>Да: шеелит светится голубым; описывает, как оценивали содержание визуально<\/td><td>Не знает, зачем это нужно — значит, с шеелитом реально не работал<\/td><\/tr><tr><td>«Каким был состав РЗЭ: доля Nd+Pr, Dy+Tb, минералы-носители, радиационный фон?» (РЗЭ)<\/td><td>Знает распределение и экономическое значение магнитных РЗЭ<\/td><td>«Просто TREO» — поверхностное знакомство<\/td><\/tr><tr><td>«Какое распределение чешуек по размеру и какое содержание Cg?» (графит)<\/td><td>Знает, что крупная чешуя дороже, приводит цифры<\/td><td>Не знает классов крупности<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.4 Откуда брать геологов для проектов TMK<\/h3>\n<ul><li><strong>Вольфрамовые скарны:<\/strong> Almonty (Сандон, Корея), действовавшие и закрытые скарновые рудники Канады (Кантунг), Китай (Хунань, Цзянси), Россия (Приморье, Тырныауз — проверка санкционных ограничений), ветераны Ингички и Койташа, геологи АГМК.<\/li><li><strong>Литиевые пегматиты:<\/strong> Австралия (огромный пул после спада 2023–2024 гг.), Канада, Зимбабве, Казахстан.<\/li><li><strong>РЗЭ:<\/strong> Австралия (Lynas, Arafura, Iluka), США (MP Materials), Канада, Гренландия, Скандинавия (LKAB), Россия (Ловозеро — проверка санкционных ограничений), Китай.<\/li><li><strong>Графит:<\/strong> Мозамбик, Мадагаскар, Канада, Австралия.<\/li><li><strong>Узбекистан:<\/strong> НГМК, АГМК, Институт минеральных ресурсов, Институт геологии и геофизики АН РУз, выпускники НГГТУ (Навои) и ТашГТУ.<\/li><\/ul>\n<hr>\n<h2>4. Практика<\/h2>\n<p><strong>Задание 1 (25 мин). Паспорта сырья.<\/strong> Для вольфрама, графита и РЗЭ заполните по одной карточке:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Поле<\/th><th>Вольфрам<\/th><th>Графит<\/th><th>РЗЭ<\/th><\/tr><\/thead><tbody><tr><td>Главные минералы<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Типы месторождений<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>3 мировых примера<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Пример в Центральной Азии<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Главная технологическая сложность<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Какой геолог нужен TMK (металл + стиль + тип работ)<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>3 поисковых запроса для LinkedIn<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Задание 2 (15 мин). Разбор профилей.<\/strong> Найдите в LinkedIn 5 профилей по запросам вроде <code>\"tungsten\" AND \"skarn\" AND geologist<\/code> или <code>\"rare earth\" AND (carbonatite OR monazite) AND geologist<\/code>. По каждому определите: металл, стиль минерализации, тип работ, уровень (junior / senior / lead / head). Отметьте, кто подходит под вольфрамовый проект TMK по всем трём фильтрам.<\/p>\n<p><strong>Бонус (по желанию).<\/strong> Задайте геологу TMK два вопроса: «Какой тип оруденения на Ингичке?» и «Какие минералы мешают переработке?». Сравните ответы с теорией. Это ваша первая информационная встреча с внутренним экспертом.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<ol><li>Какие три свойства минералов я теперь связываю с методами переработки?<\/li><li>Какой геолог нужен для вольфрамового проекта TMK? Сформулируйте в одном предложении через три фильтра.<\/li><li><strong>Обязательство:<\/strong> «Завтра в ___:___ я открываю День 3 и сначала делаю разминку».<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы уже знаете больше, чем рекрутер, который ищет «геолога с опытом». Завтра вы научитесь читать технические отчёты, где <strong>прямо указаны имена и компании<\/strong> нужных специалистов. Это самый сильный приём поиска во всём модуле. Не пропустите.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li><strong>Mindat.org<\/strong> — бесплатная база минералов и месторождений (фото, формулы, свойства, примеры): <a href=\"https://www.mindat.org\" target=\"_blank\" rel=\"noopener\">mindat.org<\/a><\/li><li><strong>USGS Mineral Deposit Models<\/strong> — описания типов месторождений (porphyry, skarn, REE и др.), бесплатно на <a href=\"https://pubs.usgs.gov\" target=\"_blank\" rel=\"noopener\">pubs.usgs.gov<\/a><\/li><li>Laurence Robb, <em>Introduction to Ore-Forming Processes<\/em> — классический учебник по рудообразованию.<\/li><li>Смирнов В. И. «Геология полезных ископаемых» — классика советской школы. Терминология совпадает с той, на которой говорят геологи СНГ.<\/li><li>Видео: ищите на YouTube «skarn deposit formation», «porphyry copper deposit explained», «scheelite UV fluorescence».<\/li><\/ul>"},{"n":3,"module":1,"title":"Геологоразведка и оценка минеральных ресурсов","file":"module-01-mining-fundamentals/day-03-exploration-resource-estimation.md","duration":"3,5 часа","challenge":"Найти публичный технический отчёт (NI 43-101 или JORC) по вольфрамовому или редкометалльному проекту и вытащить из него <strong>лонг-лист из 5 специалистов<\/strong> с их экспертизой и компаниями.","why":"В каждом таком отчёте поимённо указаны Qualified/Competent Persons и разделы, за которые они отвечают. Это готовый, проверенный регулятором список экспертов по конкретному металлу и типу месторождения. Большинство рекрутеров об этом не знают. Сегодня вы научитесь пользоваться этим источником.","checklist":[{"text":"Разминка: 5 вопросов по Дням 1–2 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (35 мин)","minutes":35},{"text":"Практика: разбор технического отчёта + лонг-лист (45 мин)","minutes":45},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.3, 1.4, 1.5 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Геологоразведка","en":"Exploration","def":"Поиск и оценка месторождений"},{"ru":"Поисковые работы","en":"Prospecting / target generation","def":"Выявление перспективных участков"},{"ru":"Детальная разведка","en":"Resource definition drilling / infill drilling","def":"Сгущение сети бурения для подсчёта"},{"ru":"Эксплуатационная разведка","en":"Grade control / near-mine exploration","def":"Разведка в контуре действующего рудника"},{"ru":"Геохимическая съёмка","en":"Geochemical survey","def":"Опробование почв, донных отложений, пород"},{"ru":"Магниторазведка","en":"Magnetic survey","def":"Измерение магнитного поля"},{"ru":"Электроразведка методом ВП","en":"Induced polarization (IP) survey","def":"Метод, чувствительный к сульфидам и графиту"},{"ru":"Гамма-спектрометрия","en":"Radiometric survey","def":"Измерение естественной радиоактивности"},{"ru":"Колонковое бурение","en":"Diamond core drilling","def":"Бурение с отбором керна"},{"ru":"Бурение с обратной продувкой","en":"Reverse circulation (RC) drilling","def":"Бурение с отбором шлама"},{"ru":"Керн","en":"Drill core","def":"Цилиндрический образец породы из скважины"},{"ru":"Документация керна","en":"Core logging","def":"Описание керна геологом"},{"ru":"Опробование","en":"Sampling","def":"Отбор проб для анализа"},{"ru":"Пробоподготовка","en":"Sample preparation","def":"Дробление, истирание, сокращение проб"},{"ru":"Пробирный анализ","en":"Fire assay","def":"Классический анализ на золото"},{"ru":"Контроль качества анализов","en":"QA/QC","def":"Система проверки точности и воспроизводимости анализов"},{"ru":"Стандартный образец","en":"Certified reference material (CRM)","def":"Проба с известным содержанием для контроля точности"},{"ru":"Холостая проба","en":"Blank","def":"Проба без полезного компонента для контроля загрязнения"},{"ru":"Внешний контроль","en":"Umpire / check assays","def":"Повторный анализ в независимой лаборатории"},{"ru":"Блочная модель","en":"Block model","def":"Цифровая модель месторождения из блоков"},{"ru":"Кригинг","en":"Kriging","def":"Геостатистический метод интерполяции содержаний"},{"ru":"Вариограмма","en":"Variogram","def":"Описание пространственной изменчивости содержаний"},{"ru":"Урезка ураганных проб","en":"Top-cutting / capping","def":"Ограничение аномально высоких содержаний"},{"ru":"Минеральные ресурсы","en":"Mineral Resources","def":"Измеренные, выявленные, предполагаемые"},{"ru":"Рудные запасы","en":"Ore Reserves / Mineral Reserves","def":"Доказанные и вероятные"},{"ru":"Модифицирующие факторы","en":"Modifying factors","def":"Горные, технологические, экономические и др. факторы перевода ресурсов в запасы"},{"ru":"Компетентное лицо","en":"Competent Person (CP) / Qualified Person (QP)","def":"Эксперт, лично отвечающий за публичную оценку"},{"ru":"Кондиции","en":"Economic parameters for reserve estimation","def":"Утверждаемые параметры подсчёта запасов в системе ГКЗ"},{"ru":"ТЭО","en":"Feasibility study","def":"Технико-экономическое обоснование"},{"ru":"Предварительная экономическая оценка","en":"Scoping study / PEA","def":"Ранняя оценка экономики (±30–50%)"},{"ru":"Сверка","en":"Reconciliation","def":"Сравнение модели с фактической добычей и переработкой"},{"ru":"Окончательное инвестиционное решение","en":"Final investment decision (FID)","def":"Решение строить проект"}],"quiz":[{"q":"Чем минеральные ресурсы отличаются от рудных запасов?","options":["Запасы — экономически извлекаемая часть ресурсов Measured и Indicated с учётом модифицирующих факторов","Ничем: это синонимы, разные кодексы просто используют разные слова для одного и того же","Ресурсы всегда ровно в 10 раз больше запасов, потому что извлекается только десятая часть","Запасы — это ресурсы категории Inferred, по которым уже получены лицензии на добычу"],"answer":0,"explain":"Для перевода ресурсов в запасы нужно учесть горные, технологические, экономические, юридические, экологические и социальные факторы, обычно не ниже уровня PFS."},{"q":"Что из перечисленного НЕЛЬЗЯ переводить в рудные запасы по JORC?","options":["Measured","Indicated","Inferred","Можно всё"],"answer":2,"explain":"Предполагаемые (Inferred) ресурсы слишком недостоверны для запасов. Сначала их нужно доразведать до Indicated или Measured."},{"q":"Минимальный опыт Competent Person по JORC в соответствующем стиле минерализации:","options":["1 год","3 года","5 лет","10 лет"],"answer":2,"explain":"Не менее 5 лет опыта, относящегося к стилю минерализации, типу месторождения и виду работ, плюс членство в признанной профессиональной организации."},{"q":"Какой метод геофизики наиболее логичен для поисков графита?","options":["Гравиразведка","Гамма-спектрометрия","Электроразведка (ВП, ЭМ)","Сейсморазведка"],"answer":2,"explain":"Графит электропроводен и поляризуется. На Тасказгане TMK применила магниторазведку и электроразведку методом ВП."},{"q":"Зачем в поток проб вставляют стандартные образцы (CRM)?","options":["Чтобы проверять точность лаборатории (отсутствие систематической ошибки)","Чтобы увеличить количество проб и снизить стоимость одного анализа","Чтобы контролировать загрязнение проб при дроблении и истирании","Чтобы сэкономить на анализах, заменив часть проб стандартами"],"answer":0,"explain":"CRM проверяют точность. Загрязнение проверяют холостые пробы (blanks), воспроизводимость — дубликаты."},{"q":"Почему пробы на W, Ta, Nb, РЗЭ часто анализируют после сплавления, а не кислотного разложения?","options":["Сплавление дешевле кислотного разложения и быстрее на больших потоках проб","Минералы этих элементов устойчивы к кислотам; без сплавления содержание будет занижено","Так требует JORC для всех металлов, кроме золота и платиноидов","Кислоты опасны для персонала, а сплавление полностью безопасно"],"answer":1,"explain":"Шеелит, колумбит-танталит, монацит, циркон плохо растворяются в кислотах. Неполное разложение даёт заниженные результаты."},{"q":"Ориентировочный аналог категории C₂ по ГКЗ в системе CRIRSCO:","options":["Proved","Measured","Inferred","Probable"],"answer":2,"explain":"C₂ — предварительно оценённые запасы, по достоверности ближе к Inferred. Соответствие ориентировочное: системы по-разному учитывают экономику."},{"q":"Точность оценки затрат на стадии Pre-Feasibility Study обычно:","options":["±5%","±10–15%","±20–25%","±50–100%"],"answer":2,"explain":"Scoping/PEA — ±30–50%, PFS — ±20–25%, FS — ±10–15%."},{"q":"В каком разделе отчёта NI 43-101 описаны методы переработки (технологическая схема)?","options":["Item 7","Item 14","Item 17","Item 27"],"answer":2,"explain":"Item 17 — Recovery Methods. Item 13 — технологические испытания, Item 14 — ресурсы, Item 27 — список литературы."},{"q":"Кандидат-ресурсник говорит: «Я строил модели в Micromine, но в сверке с добычей не участвовал». Главный риск:","options":["Micromine — устаревшая программа, и модели в ней не принимают международные аудиторы","Ресурснику сверка не нужна: это задача маркшейдеров и обогатительной фабрики","Риска нет: модели в профессиональных программах всегда точны","Его модели ни разу не проверялись реальной добычей: качество и самокритичность не подтверждены"],"answer":3,"explain":"Сверка показывает, насколько модель соответствует реальности. Без неё нельзя судить о качестве работы. Это не стоп-фактор, но обязательная зона проверки на интервью."}],"html":"<h2>0. Разминка: вспомнить Дни 1–2<\/h2>\n<ol><li>Чем рудное тело отличается от месторождения?<\/li><li>Какие три фильтра определяют релевантность геолога?<\/li><li>Какое свойство минерала использует флотация? А гравитация?<\/li><li>Почему вольфрамит можно отделить от шеелита магнитной сепарацией?<\/li><li>Почему знание о разделении РЗЭ вне Китая — сверхдефицит?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Рудное тело — отдельное геологическое тело из руды. Месторождение — экономически значимое скопление, которое может включать несколько рудных тел.<\/li><li>Металл, стиль минерализации, тип работ.<\/li><li>Флотация — свойства поверхности (гидрофобность). Гравитация — плотность.<\/li><li>Вольфрамит парамагнитен (содержит Fe и Mn), шеелит практически немагнитен.<\/li><li>Технологии разделения сконцентрированы в Китае, а с 2023 г. Китай запрещает экспорт технологий извлечения и разделения РЗЭ.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Стадии геологоразведки<\/h3>\n<p>Геологоразведка — воронка: из тысяч перспективных участков в рудник превращаются единицы. По разным оценкам, до добычи доходит менее 1% проектов.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Стадия (запад)<\/th><th>Стадия (СНГ)<\/th><th>Что делают<\/th><th>Результат<\/th><th>Кто ведёт<\/th><\/tr><\/thead><tbody><tr><td>Generative / Grassroots<\/td><td>Региональные работы (масштаб 1:200 000 – 1:50 000)<\/td><td>Анализ карт и архивов, дистанционное зондирование, региональная геохимия и геофизика<\/td><td>Перспективные площади<\/td><td>Геологи, геофизики, геохимики<\/td><\/tr><tr><td>Target generation<\/td><td>Поисковые работы<\/td><td>Картирование, геохимические съёмки, наземная геофизика, канавы<\/td><td>Цели для бурения<\/td><td>Геолог проекта, геофизик<\/td><\/tr><tr><td>Target testing<\/td><td>Поисково-оценочные работы<\/td><td>Первое бурение по целям<\/td><td>Открытие или отказ<\/td><td>Менеджер по разведке<\/td><\/tr><tr><td>Resource definition<\/td><td>Оценочные и разведочные работы<\/td><td>Сгущение сети бурения, технологические пробы<\/td><td>Подсчёт ресурсов / запасов<\/td><td>Геолог-ресурсник, Competent Person<\/td><\/tr><tr><td>Advanced / Feasibility<\/td><td>Детальная разведка, ТЭО<\/td><td>Инженерные изыскания, гидрогеология, геотехника<\/td><td>Решение об инвестициях<\/td><td>Менеджер исследований (Study Manager)<\/td><\/tr><tr><td>Near-mine / Brownfield<\/td><td>Эксплуатационная разведка<\/td><td>Доразведка флангов и глубоких горизонтов<\/td><td>Продление жизни рудника<\/td><td>Рудничный геолог<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>1.2 Методы геологоразведки<\/h3>\n<p><strong>Дистанционные и геологические методы:<\/strong><\/p>\n<ul><li><strong>Дистанционное зондирование<\/strong> (remote sensing): спутниковые снимки, мультиспектральная и гиперспектральная съёмка — поиск зон изменённых пород.<\/li><li><strong>Геологическое картирование<\/strong> (geological mapping) — основа всего: породы, структуры, проявления оруденения.<\/li><\/ul>\n<p><strong>Геохимия<\/strong> (geochemistry) — поиск аномальных содержаний элементов:<\/p>\n<ul><li>литохимические съёмки по почвам (soil sampling), донным отложениям (stream sediments) и коренным породам (rock chips);<\/li><li>портативный рентгенофлуоресцентный анализатор (pXRF) для экспресс-анализа в поле.<\/li><\/ul>\n<p><strong>Геофизика<\/strong> (geophysics) — измерение физических полей, которые меняются над рудными телами:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Метод<\/th><th>Что измеряет<\/th><th>Для каких руд<\/th><\/tr><\/thead><tbody><tr><td>Магниторазведка (magnetics), в т. ч. с дронов и самолётов<\/td><td>Магнитное поле<\/td><td>Магнетитовые скарны, структуры, интрузии<\/td><\/tr><tr><td>Гравиразведка (gravity)<\/td><td>Плотность пород<\/td><td>Массивные руды, структуры<\/td><\/tr><tr><td>Электроразведка: ВП и сопротивление (IP / resistivity)<\/td><td>Поляризуемость и сопротивление<\/td><td>Вкрапленные сульфиды, <strong>графит<\/strong><\/td><\/tr><tr><td>Электромагнитные методы (EM)<\/td><td>Проводимость<\/td><td>Массивные сульфиды, <strong>графит<\/strong><\/td><\/tr><tr><td>Радиометрия, гамма-спектрометрия (radiometrics)<\/td><td>Естественная радиоактивность (U, Th, K)<\/td><td>Уран; <strong>РЗЭ<\/strong> (через связь с торием)<\/td><\/tr><tr><td>Скважинная геофизика (downhole logging)<\/td><td>Свойства пород в скважине<\/td><td>Уран при СПВ (гамма-каротаж), геотехника<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p><strong>TMK:<\/strong> на Тасказганском графитовом проекте применены магниторазведка с дронов и электроразведка методом ВП. Логика понятна: графит проводит ток и хорошо виден электроразведкой. У шеелита яркой геофизической «подписи» нет, поэтому для него важнее геохимия (W) и УФ-лампа.<\/p><\/blockquote>\n<p><strong>Горные выработки<\/strong> (classic СНГ-школа): канавы (trenches), шурфы (pits), штольни (adits) — вскрытие руды для документации и проб.<\/p>\n<p><strong>Бурение<\/strong> (drilling) — главный и самый дорогой инструмент:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Что получают<\/th><th>Плюсы<\/th><th>Минусы<\/th><\/tr><\/thead><tbody><tr><td><strong>Колонковое (алмазное) бурение<\/strong> (diamond core drilling)<\/td><td>Керн — цилиндр породы<\/td><td>Видна структура и минералогия; геотехника; лучшие пробы<\/td><td>Дорого, медленно<\/td><\/tr><tr><td><strong>RC — бурение с обратной продувкой<\/strong> (reverse circulation)<\/td><td>Шлам (обломки)<\/td><td>Быстро, дешевле; хорошие пробы для анализа<\/td><td>Нет структуры<\/td><\/tr><tr><td>RAB, aircore<\/td><td>Шлам с малых глубин<\/td><td>Дёшево<\/td><td>Только приповерхностные данные<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Диаметры керна в стандартной системе Q (wireline): <strong>BQ ≈ 36,5 мм, NQ ≈ 47,6 мм, HQ ≈ 63,5 мм, PQ ≈ 85 мм<\/strong>. Это проверочная деталь: практик-разведчик называет диаметры без раздумий.<\/p>\n<p><strong>Документация керна<\/strong> (core logging): литология, изменения, минерализация, структуры (в т. ч. ориентированный керн), геотехнические параметры (<strong>RQD<\/strong> — показатель качества породы), фотографирование. Затем — опробование: керн распиливают пополам, одна половина идёт на анализ, вторая хранится.<\/p>\n<p><strong>Анализ проб<\/strong> (assaying):<\/p>\n<ul><li>пробирный анализ (fire assay) — золото и платиноиды;<\/li><li>кислотное разложение + ICP-OES/ICP-MS — многоэлементный анализ;<\/li><li><strong>сплавление<\/strong> (с перекисью натрия или боратом лития) + ICP или XRF — для «упорных» минералов: <strong>W, Sn, Ta, Nb, РЗЭ, Li<\/strong>. Если кандидат по РЗЭ не знает, почему нужно сплавление, а не кислотное разложение, это сигнал;<\/li><li>анализаторы LECO — углерод и сера, включая графитовый углерод (Cg).<\/li><\/ul>\n<p><strong>QA/QC — контроль качества анализов.<\/strong> В поток проб вставляют контрольные материалы:<\/p>\n<ul><li><strong>стандартные образцы<\/strong> (CRM, certified reference materials) — проверяют точность;<\/li><li><strong>холостые пробы<\/strong> (blanks) — проверяют загрязнение;<\/li><li><strong>дубликаты<\/strong> (duplicates) — проверяют воспроизводимость;<\/li><li><strong>внешний контроль<\/strong> в независимой лаборатории (umpire / check assays).<\/li><\/ul>\n<p>В советской практике это называлось внутренним и внешним геологическим контролем анализов. Принцип тот же, документирование другое.<\/p>\n<h3>1.3 От данных к ресурсам: как подсчитывают<\/h3>\n<pre class=\"code\"><code>Данные бурения + анализы + плотность\n  → Проверка базы данных (validation)\n  → Геологическая интерпретация: каркасы рудных тел, домены (wireframes / domains)\n  → Композитирование проб и урезка ураганных содержаний (compositing / top-cutting)\n  → Статистика и вариография (variography): как содержание меняется в пространстве\n  → Блочная модель (block model)\n  → Интерполяция: кригинг (ordinary kriging), метод обратных расстояний (IDW)\n  → Проверка модели (validation: swath plots, визуальная проверка)\n  → Классификация ресурсов по достоверности\n  → Отчёт выше бортового содержания<\/code><\/pre>\n<p><strong>Программы, которые встречаются в резюме:<\/strong><\/p>\n<ul><li>геологическое моделирование и подсчёт: <strong>Leapfrog Geo<\/strong> (Seequent), <strong>Datamine Studio RM<\/strong>, <strong>Micromine<\/strong>, <strong>Maptek Vulcan<\/strong>, <strong>GEOVIA Surpac<\/strong>;<\/li><li>геостатистика: <strong>Isatis.neo<\/strong>, <strong>Supervisor<\/strong>;<\/li><li>базы данных: <strong>acQuire<\/strong>, Datamine Fusion, MX Deposit.<\/li><\/ul>\n<p>В СНГ очень распространён Micromine. Хороший признак — владение несколькими пакетами и понимание методики, а не только кнопок.<\/p>\n<p><strong>Сверка<\/strong> (reconciliation) на действующем руднике: сравнение «модель → горный план → фабрика». Специалисты говорят о коэффициентах F1, F2, F3. Если ресурсник ни разу не участвовал в сверке, его модели могли ни разу не проверяться реальностью.<\/p>\n<h3>1.4 Ресурсы и запасы: международные кодексы (CRIRSCO)<\/h3>\n<p><strong>Минеральные ресурсы<\/strong> (Mineral Resources) — концентрация полезного ископаемого с <strong>разумными перспективами экономически оправданной отработки<\/strong> (RPEEE). Классы по возрастанию геологической достоверности:<\/p>\n<ul><li><strong>Inferred<\/strong> — предполагаемые;<\/li><li><strong>Indicated<\/strong> — выявленные;<\/li><li><strong>Measured<\/strong> — измеренные.<\/li><\/ul>\n<p><strong>Рудные запасы<\/strong> (Ore Reserves в JORC; Mineral Reserves в NI 43-101) — экономически извлекаемая часть ресурсов Measured и Indicated после учёта <strong>модифицирующих факторов<\/strong> (modifying factors): горных, технологических (металлургических), экономических, рыночных, юридических, экологических, социальных, государственных. Требуют исследования не ниже уровня PFS. Классы:<\/p>\n<ul><li><strong>Probable<\/strong> — вероятные;<\/li><li><strong>Proved<\/strong> — доказанные.<\/li><\/ul>\n<pre class=\"code\"><code>РЕСУРСЫ                         ЗАПАСЫ\nInferred\nIndicated   ──(модифицирующие факторы)──►  Probable\nMeasured    ──(модифицирующие факторы)──►  Proved (или Probable)<\/code><\/pre>\n<p><strong>Exploration Target<\/strong> (JORC) — диапазон тонн и содержаний для цели разведки. Это <strong>не<\/strong> ресурс, и выдавать его за ресурс запрещено.<\/p>\n<p><strong>Семейство кодексов CRIRSCO<\/strong> — сопоставимые стандарты публичной отчётности:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Кодекс<\/th><th>Юрисдикция<\/th><th>Квалифицированный эксперт<\/th><\/tr><\/thead><tbody><tr><td><strong>JORC Code<\/strong><\/td><td>Австралия, Новая Зеландия<\/td><td>Competent Person (член AusIMM, AIG или признанной организации)<\/td><\/tr><tr><td><strong>NI 43-101<\/strong> + CIM Definition Standards<\/td><td>Канада<\/td><td>Qualified Person<\/td><\/tr><tr><td><strong>S-K 1300<\/strong><\/td><td>США (SEC)<\/td><td>Qualified Person<\/td><\/tr><tr><td><strong>SAMREC<\/strong><\/td><td>ЮАР<\/td><td>Competent Person<\/td><\/tr><tr><td><strong>PERC<\/strong><\/td><td>Европа<\/td><td>Competent Person<\/td><\/tr><tr><td><strong>Кодекс НАЭН<\/strong><\/td><td>Россия<\/td><td>Компетентное лицо<\/td><\/tr><tr><td><strong>KAZRC<\/strong><\/td><td>Казахстан<\/td><td>Компетентное лицо<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Требование к Competent/Qualified Person:<\/strong> не менее <strong>5 лет<\/strong> опыта, относящегося к стилю минерализации и типу месторождения, а также к виду работ, за которые эксперт отвечает. Плюс членство в признанной профессиональной организации (AusIMM, AIG, SME, EFG/EurGeol, IOM3, провинциальные ассоциации Канады и др.). <strong>Это проверяемые данные:<\/strong> у профессиональных организаций есть публичные реестры членов, а имена CP/QP указаны в отчётах.<\/p>\n<h3>1.5 Советская (ГКЗ) классификация и её соответствие CRIRSCO<\/h3>\n<p>В Узбекистане и большинстве стран СНГ исторически применяется система ГКЗ:<\/p>\n<ul><li><strong>Запасы:<\/strong> категории A, B, C₁ (разведанные), C₂ (предварительно оценённые).<\/li><li><strong>Прогнозные ресурсы:<\/strong> P₁, P₂, P₃.<\/li><li>Запасы делят на <strong>балансовые<\/strong> (экономически эффективные) и <strong>забалансовые<\/strong>.<\/li><li>Экономические параметры (бортовое содержание, минимальная мощность и др.) задаются <strong>кондициями<\/strong>, которые обосновывают в <strong>ТЭО кондиций<\/strong> и утверждают в ГКЗ.<\/li><li>Плотность разведочной сети зависит от <strong>группы сложности геологического строения<\/strong> месторождения (1–4).<\/li><\/ul>\n<p><strong>Ориентировочное соответствие.<\/strong> Прямой эквивалентности нет: системы по-разному учитывают экономику, поэтому пересчёт всегда делает эксперт.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>ГКЗ<\/th><th>CRIRSCO (ориентир)<\/th><\/tr><\/thead><tbody><tr><td>A + B<\/td><td>Measured → Proved (при выполнении модифицирующих факторов)<\/td><\/tr><tr><td>C₁<\/td><td>Indicated → Probable<\/td><\/tr><tr><td>C₂<\/td><td>Inferred<\/td><\/tr><tr><td>P₁–P₃<\/td><td>Не отчитываются как ресурсы; ближе к Exploration Target и выше по неопределённости<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p><strong>TMK:<\/strong> для инвесторов и партнёров из США, ЕС, Кореи и Японии нужна отчётность по JORC или NI 43-101. Внутри страны — по ГКЗ. Тасказганский проект прямо заявлен как работающий по JORC. Отсюда дефицитный профиль: <strong>геолог-ресурсник, свободно работающий в обеих системах<\/strong> (в идеале — Competent Person по JORC или KAZRC с советской школой).<\/p><\/blockquote>\n<h3>1.6 Стадии исследований: от идеи к решению об инвестициях<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Исследование<\/th><th>Точность оценки затрат<\/th><th>На каких ресурсах основано<\/th><th>Зачем<\/th><\/tr><\/thead><tbody><tr><td><strong>Scoping Study / PEA<\/strong> (Preliminary Economic Assessment)<\/td><td>±30–50%<\/td><td>Можно включать Inferred (с оговорками)<\/td><td>Стоит ли продолжать<\/td><\/tr><tr><td><strong>Pre-Feasibility Study (PFS)<\/strong><\/td><td>±20–25%<\/td><td>Measured + Indicated → Probable Reserves<\/td><td>Выбор варианта (метод добычи, технология, мощность)<\/td><\/tr><tr><td><strong>Feasibility Study (FS, DFS, BFS)<\/strong><\/td><td>±10–15%<\/td><td>Запасы, детальный инжиниринг<\/td><td>Решение об инвестициях (FID) и финансирование<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Аналог в СНГ:<\/strong> обоснование инвестиций → <strong>ТЭО<\/strong> → проект → рабочая документация.<\/p>\n<p><strong>Экономические показатели исследования:<\/strong> NPV (чистая приведённая стоимость, обычно при ставке дисконтирования 8%), IRR, срок окупаемости, CAPEX, OPEX на тонну, AISC, срок жизни рудника (LOM), среднее содержание в руде, извлечение, коэффициент вскрыши, чувствительность к цене.<\/p>\n<p><strong>Структура технического отчёта NI 43-101 (Form 43-101F1)<\/strong> — 27 стандартных разделов. Для рекрутера самые полезные:<\/p>\n<ul><li><strong>Item 7–8<\/strong> — геология и тип месторождения;<\/li><li><strong>Item 10–12<\/strong> — бурение, опробование, проверка данных;<\/li><li><strong>Item 13<\/strong> — технологические испытания;<\/li><li><strong>Item 14<\/strong> — оценка ресурсов;<\/li><li><strong>Item 15<\/strong> — запасы;<\/li><li><strong>Item 16<\/strong> — горные работы;<\/li><li><strong>Item 17<\/strong> — методы переработки (Recovery Methods);<\/li><li><strong>Item 21–22<\/strong> — затраты и экономика.<\/li><\/ul>\n<p>В начале отчёта и в сертификатах QP указано, <strong>кто за какой раздел отвечает<\/strong>.<\/p>\n<p>В отчётах JORC аналог — <strong>Table 1<\/strong> (разделы: опробование и данные; результаты разведки; оценка ресурсов; оценка запасов) и указание Competent Person в каждом публичном сообщении.<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Геологоразведка<\/td><td>Exploration<\/td><td>Поиск и оценка месторождений<\/td><\/tr><tr><td>Поисковые работы<\/td><td>Prospecting / target generation<\/td><td>Выявление перспективных участков<\/td><\/tr><tr><td>Детальная разведка<\/td><td>Resource definition drilling / infill drilling<\/td><td>Сгущение сети бурения для подсчёта<\/td><\/tr><tr><td>Эксплуатационная разведка<\/td><td>Grade control / near-mine exploration<\/td><td>Разведка в контуре действующего рудника<\/td><\/tr><tr><td>Геохимическая съёмка<\/td><td>Geochemical survey<\/td><td>Опробование почв, донных отложений, пород<\/td><\/tr><tr><td>Магниторазведка<\/td><td>Magnetic survey<\/td><td>Измерение магнитного поля<\/td><\/tr><tr><td>Электроразведка методом ВП<\/td><td>Induced polarization (IP) survey<\/td><td>Метод, чувствительный к сульфидам и графиту<\/td><\/tr><tr><td>Гамма-спектрометрия<\/td><td>Radiometric survey<\/td><td>Измерение естественной радиоактивности<\/td><\/tr><tr><td>Колонковое бурение<\/td><td>Diamond core drilling<\/td><td>Бурение с отбором керна<\/td><\/tr><tr><td>Бурение с обратной продувкой<\/td><td>Reverse circulation (RC) drilling<\/td><td>Бурение с отбором шлама<\/td><\/tr><tr><td>Керн<\/td><td>Drill core<\/td><td>Цилиндрический образец породы из скважины<\/td><\/tr><tr><td>Документация керна<\/td><td>Core logging<\/td><td>Описание керна геологом<\/td><\/tr><tr><td>Опробование<\/td><td>Sampling<\/td><td>Отбор проб для анализа<\/td><\/tr><tr><td>Пробоподготовка<\/td><td>Sample preparation<\/td><td>Дробление, истирание, сокращение проб<\/td><\/tr><tr><td>Пробирный анализ<\/td><td>Fire assay<\/td><td>Классический анализ на золото<\/td><\/tr><tr><td>Контроль качества анализов<\/td><td>QA/QC<\/td><td>Система проверки точности и воспроизводимости анализов<\/td><\/tr><tr><td>Стандартный образец<\/td><td>Certified reference material (CRM)<\/td><td>Проба с известным содержанием для контроля точности<\/td><\/tr><tr><td>Холостая проба<\/td><td>Blank<\/td><td>Проба без полезного компонента для контроля загрязнения<\/td><\/tr><tr><td>Внешний контроль<\/td><td>Umpire / check assays<\/td><td>Повторный анализ в независимой лаборатории<\/td><\/tr><tr><td>Блочная модель<\/td><td>Block model<\/td><td>Цифровая модель месторождения из блоков<\/td><\/tr><tr><td>Кригинг<\/td><td>Kriging<\/td><td>Геостатистический метод интерполяции содержаний<\/td><\/tr><tr><td>Вариограмма<\/td><td>Variogram<\/td><td>Описание пространственной изменчивости содержаний<\/td><\/tr><tr><td>Урезка ураганных проб<\/td><td>Top-cutting / capping<\/td><td>Ограничение аномально высоких содержаний<\/td><\/tr><tr><td>Минеральные ресурсы<\/td><td>Mineral Resources<\/td><td>Измеренные, выявленные, предполагаемые<\/td><\/tr><tr><td>Рудные запасы<\/td><td>Ore Reserves / Mineral Reserves<\/td><td>Доказанные и вероятные<\/td><\/tr><tr><td>Модифицирующие факторы<\/td><td>Modifying factors<\/td><td>Горные, технол
