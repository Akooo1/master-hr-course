<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Mining &amp; Metallurgy Executive Search Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky status bar + one reading column (max 880px). The dashboard reads like an assay sheet:
   KPI strip, a 28-day activity chain, and a 30-cell grid of days styled as element cells (day number = "atomic number").
   Accent = scheelite under a UV lamp: deep electric blue in light theme, a soft blue glow in dark theme. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF3; --ink:#131820; --ink-2:#4B5665; --ink-3:#6B7684;
  --line:#D6DDE5; --accent:#2B4ACB; --accent-ink:#FFFFFF; --accent-soft:#E4E9FB;
  --ok:#17704A; --ok-soft:#DFF2E8; --warn:#85560D; --warn-soft:#FBEFD9; --bad:#B93A33; --bad-soft:#FBE4E2;
  --glow:none;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#151A21; --surface-2:#1C232C; --ink:#E6EBF1; --ink-2:#A3AEBB; --ink-3:#808B98;
    --line:#29323D; --accent:#8FA3FF; --accent-ink:#0D1015; --accent-soft:#1B2350;
    --ok:#53C892; --ok-soft:#10301F; --warn:#E5B54A; --warn-soft:#33260C; --bad:#F27A72; --bad-soft:#3B1614;
    --glow:0 0 16px rgba(143,163,255,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151A21; --surface-2:#1C232C; --ink:#E6EBF1; --ink-2:#A3AEBB; --ink-3:#808B98;
  --line:#29323D; --accent:#8FA3FF; --accent-ink:#0D1015; --accent-soft:#1B2350;
  --ok:#53C892; --ok-soft:#10301F; --warn:#E5B54A; --warn-soft:#33260C; --bad:#F27A72; --bad-soft:#3B1614;
  --glow:0 0 16px rgba(143,163,255,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.cell-mark{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;font-weight:700;position:relative;flex:none}
.cell-mark small{position:absolute;top:1px;left:3px;font-family:var(--f-mono);font-size:8px;font-weight:600}
.brand-text{font-weight:600;font-size:14px;line-height:1.2}
.brand-text span{display:block;color:var(--ink-3);font-weight:400;font-size:12px}
.status{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs a{flex:none;padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs a:hover{color:var(--ink)}

main{padding-block:20px 120px}
main:focus{outline:none}
h1,h2,h3{text-wrap:balance;line-height:1.25}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.2vw,30px);margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:20px;margin:28px 0 10px}
h3{font-size:17px;margin:22px 0 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.lede{color:var(--ink-2);margin:0 0 14px;max-width:68ch}
.stack{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flat{border:none;background:transparent;padding:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-3)}
.small{font-size:14px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{font-size:13px;padding:5px 10px;min-height:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Alerts */
.alert{border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.alert strong{font-size:16px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert p{margin:0;color:var(--ink)}
.alert ol{margin:4px 0 0;padding-left:20px;color:var(--ink)}

/* Hero (today) */
.today-hero{display:grid;gap:12px}
.today-hero .challenge{background:var(--surface-2);border-radius:6px;padding:12px 14px}
.today-hero .challenge b{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:13px;color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}

/* Activity chain */
.chain{display:grid;grid-template-columns:repeat(28,minmax(0,1fr));gap:3px}
.chain i{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.chain i.on{background:var(--accent);box-shadow:var(--glow)}
.chain i.gap{background:transparent;outline:1.5px dashed var(--warn);outline-offset:-2px}
.chain i.broken{background:var(--bad-soft);outline:1.5px solid var(--bad);outline-offset:-2px}
.chain i.today{outline:2px solid var(--ink);outline-offset:-2px}
.chain-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:8px}
.chain-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--surface-2)}
.chain-legend .l-on::before{background:var(--accent)}
.chain-legend .l-gap::before{background:transparent;outline:1.5px dashed var(--warn);outline-offset:-2px}
.chain-legend .l-broken::before{background:var(--bad-soft);outline:1.5px solid var(--bad);outline-offset:-2px}

/* Day grid — element cells */
.grid30{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dcell{position:relative;display:grid;gap:2px;align-content:start;min-height:92px;padding:8px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.dcell .no{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-3)}
.dcell .sym{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.1}
.dcell .nm{font-size:11px;line-height:1.25;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dcell .sc{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:11px;font-weight:600}
.dcell.open{border-color:var(--accent)}
.dcell.open .sym{color:var(--accent)}
.dcell.current{outline:3px solid var(--accent-soft)}
.dcell.passed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.dcell.passed .no,.dcell.passed .nm,.dcell.passed .sc{color:var(--accent-ink)}
.dcell.locked,.dcell.soon{background:var(--surface-2);border-style:dashed;color:var(--ink-3)}
.dcell.locked .sym,.dcell.soon .sym{color:var(--ink-3)}
.mod-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin:18px 0 8px}
.mod-head h3{margin:0}
.bar-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent)}

/* Badges */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);font-size:13px;color:var(--ink-3);background:var(--surface)}
.badge.got{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.badge b{font-family:var(--f-mono);font-size:11px}

/* Day view */
.day-head{display:grid;gap:10px}
.day-meta{display:flex;gap:8px;flex-wrap:wrap}
.callout{border-radius:6px;padding:12px 14px;background:var(--surface-2)}
.callout .lbl{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink-2);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checklist li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;background:var(--surface-2)}
.checklist li.done{opacity:.7}
.checklist li.done .ct{text-decoration:line-through}
.checklist input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.checklist .ct{flex:1;min-width:0}
.checklist .tm{flex:none}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:6px}
.subtabs button{appearance:none;border:0;background:none;font:inherit;font-weight:600;font-size:15px;color:var(--ink-3);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;flex:none}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.subtabs .cnt{font-family:var(--f-mono);font-size:12px;margin-left:4px}

/* Rendered course content */
.content{min-width:0}
.content h2{font-size:21px;border-top:1px solid var(--line);padding-top:22px;margin-top:30px}
.content h2:first-child{border-top:0;margin-top:8px;padding-top:0}
.content h3{font-size:17px}
.content p,.content li{max-width:72ch}
.content ul,.content ol{padding-left:22px}
.content li{margin:3px 0}
.content blockquote{margin:14px 0;padding:12px 16px;background:var(--accent-soft);border-radius:6px}
.content blockquote p{margin:6px 0}
.content hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.content code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.content pre.code{background:var(--surface-2);border-radius:6px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.5}
.content pre.code code{background:none;padding:0}
.table-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.table-wrap table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.table-wrap th,.table-wrap td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.table-wrap th{background:var(--surface-2);font-weight:600;font-size:13px}
.table-wrap tr:last-child td{border-bottom:0}
details{margin:10px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
details summary{cursor:pointer;padding:8px 12px;font-weight:600;color:var(--accent);list-style-position:inside}
details[open] summary{border-bottom:1px solid var(--line)}
details > :not(summary){margin-left:12px;margin-right:12px}
details > :last-child{margin-bottom:12px}
.task input{vertical-align:-2px}

/* Quiz */
.quiz{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.q .qn{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-bottom:4px}
.q .qt{font-weight:600;margin-bottom:10px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;border:1px solid var(--line);margin-top:6px;cursor:pointer;background:var(--surface)}
.q label:hover{border-color:var(--ink-3)}
.q input{margin-top:4px;accent-color:var(--accent);flex:none}
.q .lt{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);flex:none}
.q label.right{border-color:var(--ok);background:var(--ok-soft)}
.q label.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .ex{margin-top:10px;font-size:14px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.q.is-wrong{border-color:var(--bad)}
.stamp{display:inline-grid;place-items:center;padding:10px 18px;border:3px solid currentColor;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok)}
.stamp.bad{color:var(--bad)}
@media (prefers-reduced-motion: no-preference){ .stamp{animation:stamp .35s ease-out} @keyframes stamp{from{transform:rotate(-4deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}} }

/* Flashcards */
.fc-wrap{display:grid;gap:14px;max-width:620px}
.fc{min-height:220px;display:grid;align-content:center;gap:10px;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:24px 20px}
.fc .side{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fc .term{font-family:var(--f-display);font-size:clamp(18px,4vw,24px);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.fc .answer{font-size:18px;font-weight:600;color:var(--accent);overflow-wrap:anywhere}
.fc .def{color:var(--ink-2);font-size:15px}
.fc .from{font-size:12px;color:var(--ink-3)}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.boxes div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.boxes b{display:block;font-family:var(--f-display);font-size:18px}
.boxes span{font-size:11px;color:var(--ink-3)}

/* Forms */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.err{color:var(--bad);font-size:13px;font-weight:600}

/* Timer pill + toast */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
.timer .t{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.timer .l{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.timer .btn{background:transparent;color:var(--bg);border-color:rgba(127,127,127,.5);min-height:30px;padding:4px 10px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left-width:1px;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:14px;max-width:min(520px,calc(100vw - 32px))}
.sync{font-size:12px;color:var(--ink-3)}
.lockbox{display:grid;gap:10px;justify-items:start}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:520px){
  .bar{position:static}
  .sync{display:none}
  .brand-text span{display:none}
  .kpi .v{font-size:22px}
  .grid30{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .dcell{min-height:80px}
  .dcell .nm{display:none}
}
</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <a class="brand" href="#today" aria-label="На главную">
        <span class="cell-mark" aria-hidden="true"><small>74</small>W</span>
        <span class="brand-text">Mining &amp; Metallurgy Executive Search Academy<span>30 дней · подготовка Executive Search Specialist · TMK</span></span>
      </a>
      <div class="status" id="status"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Разделы">
      <a href="#today">Сегодня</a>
      <a href="#program">Программа</a>
      <a href="#cards">Карточки</a>
      <a href="#journal">Журнал</a>
      <a href="#tmk">TMK</a>
      <a href="#contract">Контракт</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>
<div class="timer" id="timer" hidden aria-live="polite"></div>

<script>
const DATA = {"version":1,"totalDays":30,"modules":[{"n":1,"title":"Mining Industry Fundamentals","from":1,"to":5,"dir":"module-01-mining-fundamentals","ready":true,"goal":"вы понимаете, как устроено современное горнодобывающее предприятие и какие специалисты необходимы на каждом этапе.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов, без подсказок, 20 минут. Порог прохождения — <strong>16 из 20<\/strong>. Не прошли — повторите дни, где были ошибки, и пройдите тест снова через сутки. Модуль 2 открывается после прохождения.<\/p>\n<ol><li>Почему дефицит специалистов растёт от upstream к downstream?<\/li><li>Что такое mtu и сколько это в килограммах WO₃?<\/li><li>Назовите три компании-аналога TMK и объясните, чем каждая похожа.<\/li><li>Какие два критерия делают сырьё критическим?<\/li><li>Чем руда отличается от горной породы?<\/li><li>Назовите главные минералы вольфрама и одно технологическое отличие между ними.<\/li><li>Какой минерал — главный источник рения и как рений из него извлекают (в общих словах)?<\/li><li>Почему сырьё РЗЭ часто требует радиационного контроля?<\/li><li>Назовите три фильтра релевантности геолога.<\/li><li>Чем Measured, Indicated и Inferred отличаются от Proved и Probable?<\/li><li>Ориентировочно сопоставьте категории A+B, C₁, C₂ с CRIRSCO.<\/li><li>Какие требования предъявляются к Competent Person по JORC?<\/li><li>В каком разделе отчёта NI 43-101 искать технологическую схему и зачем рекрутеру этот раздел?<\/li><li>Что такое коэффициент вскрыши и как он влияет на выбор способа добычи?<\/li><li>Назовите систему разработки для неправильных ценных крутых тел и объясните почему.<\/li><li>Что такое СПВ и как оно связано с проектами TMK по РЗЭ и рению?<\/li><li>Чем availability отличается от utilization?<\/li><li>Что такое Operational Readiness и когда нанимают ключевых руководителей эксплуатации?<\/li><li>Почему нельзя переводить «главный инженер» как «Chief Engineer»?<\/li><li>Назовите пять вопросов о масштабе, которые нужно задать любому кандидату-руководителю.<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>Чем глубже передел, тем меньше компаний в мире им владеют и тем закрытее технологии. Горных инженеров — сотни тысяч, технологов APT вне Китая — единицы.<\/li><li>Metric tonne unit; 1 mtu = 10 кг WO₃.<\/li><li>Например: Plansee (W и Mo от порошка до изделий), Masan High-Tech Materials (рудник + химическая переработка W), Xiamen Tungsten / China Tungsten High-Tech (полная цепочка), Molymet (Mo и Re), Ульбинский металлургический завод (редкие металлы, госкомпания в СНГ).<\/li><li>Экономическая важность и высокий риск поставок.<\/li><li>Руда — порода, из которой экономически выгодно извлекать металл при текущих ценах и технологиях.<\/li><li>Шеелит CaWO₄ (немагнитный, светится под УФ, флотация с жирными кислотами) и вольфрамит (Fe,Mn)WO₄ (парамагнитный, тяжелее, гравитация + магнитная сепарация).<\/li><li>Молибденит MoS₂. При окислительном обжиге концентрата рений возгоняется в виде оксида, его улавливают из газов (мокрая очистка), затем извлекают сорбцией или экстракцией в перренат аммония.<\/li><li>Минералы РЗЭ (монацит и др.) содержат торий и уран — природные радионуклиды.<\/li><li>Металл, стиль минерализации, тип работ.<\/li><li>Ресурсы классифицируют по геологической достоверности. Запасы — экономически извлекаемая часть ресурсов Measured и Indicated после учёта модифицирующих факторов.<\/li><li>A+B ≈ Measured (→ Proved), C₁ ≈ Indicated (→ Probable), C₂ ≈ Inferred. Соответствие ориентировочное, пересчёт делает эксперт.<\/li><li>Не менее 5 лет опыта в данном стиле минерализации, типе месторождения и виде работ; членство в признанной профессиональной организации.<\/li><li>Item 17 — Recovery Methods. Показывает, какие процессы нужны (а значит, какой опыт искать) и кто их проектировал.<\/li><li>Количество пустой породы на единицу руды. При слишком высоком коэффициенте выгоднее подземная добыча.<\/li><li>Слоевая выемка с закладкой (cut and fill): максимальная селективность, минимальное разубоживание.<\/li><li>Скважинное подземное выщелачивание: металл добывают раствором через скважины. Растворы урановых месторождений содержат рений и РЗЭ — их TMK планирует извлекать (соглашение с Solvomet KU Leuven).<\/li><li>Availability — доля времени, когда техника исправна. Utilization — доля исправного времени, когда она реально работает.<\/li><li>Найм, обучение и подготовка систем до пуска. Ключевых руководителей — обычно за 12–18 месяцев (и раньше) до пуска.<\/li><li>В СНГ главный инженер — первый заместитель по производству и технологии. На Западе «Chief Engineer» — чаще эксперт, а не руководитель уровня заместителя директора.<\/li><li>Сколько людей в подчинении; какой бюджет; какая производительность и продукция; кому подчинялся; какие решения принимал сам.<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>Перед Модулем 2 договоритесь о 15-минутной встрече с руководителем или инженером TMK и расскажите:<\/p>\n<ol><li>как устроено горное предприятие от разведки до закрытия;<\/li><li>как вы будете планировать найм под вольфрамовый комплекс (по стадиям);<\/li><li>какие три открытия про подбор технических специалистов вы сделали за неделю.<\/li><\/ol>\n<p>Попросите задать вам 3 каверзных вопроса. Где не смогли ответить — там зона повторения.<\/p>"},{"n":2,"title":"Mineral Processing & Metallurgy","from":6,"to":10,"dir":"module-02-processing-metallurgy","ready":true,"goal":"вы понимаете путь «руда → концентрат → металл → изделие» и можете профессионально говорить с обогатителями, гидро- и пирометаллургами и технологами порошковой металлургии TMK. Вы отличаете реальный промышленный опыт от лабораторного и знаете, где искать каждый профиль.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов, без подсказок, 20 минут. Порог прохождения — <strong>16 из 20<\/strong>. Модуль 3 открывается после прохождения.<\/p>\n<ol><li>Чем обогащение отличается от металлургии?<\/li><li>Руда — 0,8% WO₃, концентрат — 65% WO₃, хвосты — 0,12% WO₃. Посчитайте извлечение.<\/li><li>Что такое P80 и раскрытие минералов?<\/li><li>Почему для вольфрама опасно переизмельчение и как с этим борются?<\/li><li>Назовите три класса флотационных реагентов и по одному примеру.<\/li><li>Чем флотация шеелита отличается от флотации медных сульфидов? Что такое процесс Петрова?<\/li><li>Как получают молибденовый концентрат из медно-молибденовой руды?<\/li><li>Почему вольфрамит отделяют от касситерита магнитной сепарацией?<\/li><li>Каким методом обогащают крупный класс сподумена и почему?<\/li><li>Перечислите шаги схемы «вольфрамовый концентрат → APT».<\/li><li>Как извлекают рений и в каком соединении его кристаллизуют?<\/li><li>Что такое HPAL и с каким сырьём он работает?<\/li><li>Назовите шесть уровней шкалы масштаба гидрометаллурга. Какой самый редкий?<\/li><li>Опишите цикл жидкостной экстракции (три стадии).<\/li><li>Почему разделение РЗЭ — «высшая лига» экстракции и какой экстрагент — основа китайских каскадов?<\/li><li>Откуда берутся селен и теллур?<\/li><li>Что означают 3N, 3N5, 5N? Каким методом подтверждают 5N в твёрдом металле?<\/li><li>Опишите путь от порошка W до твёрдосплавной пластины ВК8.<\/li><li>Что происходит при окислительном обжиге молибденита (продукты и попутные компоненты)?<\/li><li>Какие стандарты и процедуры нужны Smart Powder для поставок автодеталей?<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>Обогащение физически разделяет минералы без изменения химического состава; металлургия химически извлекает металл.<\/li><li>R = 65 · (0,8 − 0,12) / [0,8 · (65 − 0,12)] = 44,2 / 51,9 ≈ 85,2%.<\/li><li>P80 — размер, мельче которого 80% массы продукта. Раскрытие — освобождение зёрен ценного минерала от сростков с породой.<\/li><li>Хрупкие W-минералы уходят в шламы, которые плохо улавливаются. Меры: щадящее и стадиальное измельчение, ранний вывод готового класса, тонкая гравитация (центробежные концентраторы), флотация шламов.<\/li><li>Собиратели (ксантогенат, жирные кислоты), пенообразователи (MIBC), депрессоры (жидкое стекло, NaHS); также активаторы и регуляторы среды.<\/li><li>Шеелит — несульфидный (солевой) минерал: жирные кислоты, жидкое стекло, проблема кальцита, флюорита и апатита. Процесс Петрова — доводка чернового концентрата с прогревом и высоким расходом жидкого стекла для десорбции собирателя с кальциевых минералов.<\/li><li>Коллективная Cu–Mo флотация → подавление медных минералов NaHS → флотация молибденита аполярным собирателем → перечистки (часто в колоннах) → Mo-концентрат 45–55% Mo.<\/li><li>Вольфрамит парамагнитен (Fe, Mn), касситерит практически немагнитен.<\/li><li>В тяжёлых средах (DMS): сподумен (≈ 3,1–3,2 г/см³) тяжелее кварца и полевых шпатов (≈ 2,6–2,7).<\/li><li>Разложение (сода или NaOH) → раствор вольфрамата натрия → очистка (Si, P, As, Mo) → экстракция или ионный обмен → вольфрамат аммония → выпарная кристаллизация → APT.<\/li><li>Из газов обжига молибденита (мокрая газоочистка) или растворов (медное производство, СПВ урана) — сорбцией или экстракцией, затем кристаллизуют перренат аммония NH₄ReO₄.<\/li><li>Автоклавное сернокислотное выщелачивание при ≈ 250 °C; никелевые (кобальтовые) латериты.<\/li><li>Лаборатория → укрупнённые испытания → пилот → проектирование → пуск и вывод на мощность → стабильная эксплуатация. Самый редкий — пуск и вывод на мощность.<\/li><li>Экстракция (металл в органику) → промывка (удаление примесей) → реэкстракция (металл в чистый водный раствор).<\/li><li>Соседние РЗЭ почти одинаковы химически, коэффициенты разделения малы, нужны каскады из сотен и тысяч ступеней. Основа — P507 / PC88A.<\/li><li>Из анодного шлама электролитического рафинирования меди.<\/li><li>99,9%; 99,95%; 99,999%. GDMS.<\/li><li>W + сажа → карбидизация → WC → смесь с 8% Co (+ ингибиторы, пластификатор) → размол → распылительная сушка → прессование → жидкофазное спекание (вакуум или sinter-HIP) → шлифовка, покрытия → пластина.<\/li><li>MoS₂ → MoO₃ (технический оксид молибдена) + SO₂ (→ серная кислота); рений возгоняется в виде Re₂O₇ и улавливается в газоочистке.<\/li><li>IATF 16949, процедуры PPAP и APQP; стандарты материалов (например, MPIF Standard 35).<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>До начала Модуля 3 проведите 15–20 минут с технологом TMK (Чирчик или Ингичка):<\/p>\n<ol><li>Объясните одну цепочку TMK от концентрата до продукта.<\/li><li>Попросите оценить точность по шкале 1–10 и исправить ошибки.<\/li><li>Спросите: «Какой профиль специалиста вам сейчас нужнее всего и почему его трудно найти?»<\/li><\/ol>\n<p>Ответ на третий вопрос запишите в профиль TMK (<a href=\"#tmk\">../00-start/tmk-profile.md<\/a>, раздел 5). Это прямой вклад обучения в вашу работу.<\/p>"},{"n":3,"title":"Rare Earth Elements & Critical Minerals","from":11,"to":15,"topics":"Геология и минералы РЗЭ; вскрытие и выщелачивание; разделение и очистка; металлы, сплавы и магниты NdFeB; литий, графит, Ni–Co, W–Mo–Re: рынки, цепочки поставок, экспортные ограничения Китая","ready":false},{"n":4,"title":"Equipment, Laboratory & Production Systems","from":16,"to":20,"topics":"Технологическое оборудование и OEM; аналитическая лаборатория (XRF, ICP-OES/MS, XRD, SEM-EDS, автоматизированная минералогия, GDMS, LECO), QA/QC, ISO/IEC 17025, LIMS; АСУ ТП и цифровизация; ТОиР и надёжность; охрана труда, ESG, RMAP, GISTM","ready":false},{"n":5,"title":"Technical Recruitment & Talent Intelligence","from":21,"to":25,"topics":"Анализ технических вакансий и профили компетенций; сопоставление должностей; компании-доноры и география; источники (LinkedIn, X-ray, технические отчёты, патенты, публикации, конференции); работа с кандидатом: релокация в Узбекистан, вознаграждение, мотивация","ready":false},{"n":6,"title":"Technical Screening & Stakeholder Management","from":26,"to":30,"topics":"Структурированный технический скрининг; реальный и поверхностный опыт; оценка релевантности международного опыта для TMK; работа с техническими директорами, главными инженерами и учёными; финальный проект — полный цикл поиска","ready":false}],"days":[{"n":1,"module":1,"title":"Мировая горно-металлургическая отрасль: структура, игроки, место TMK","file":"module-01-mining-fundamentals/day-01-global-mining-industry.md","duration":"3,5 часа","challenge":"К вечеру у вас должна быть первая версия <strong>карты компаний-доноров для TMK<\/strong>: 20 компаний, 5 архетипов, по каждой — какие роли там искать.","why":"В ближайшие годы TMK запускает больше сотни проектов. Тех немногих специалистов по вольфраму, молибдену, рению и РЗЭ вне Китая одновременно ищут компании из США, ЕС, Кореи, Японии и Австралии. Рекрутер, который знает отраслевую карту, звонит нужному человеку раньше конкурентов. Сегодня вы рисуете эту карту.","checklist":[{"text":"Входной тест: 10 вопросов, без подсказок (10 мин). Результат записать в журнал прогресса","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (35 мин)","minutes":35},{"text":"Практика: карта доноров, 20 компаний (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"входной тест → блоки 1.1, 1.2 и 1.5 → тест дня. Подходит, если сегодня нет 3,5 часа; полная версия догоняется в выходной. Главное правило академии — <strong>никогда не пропускать два дня подряд<\/strong>.","terms":[{"ru":"Горнодобывающая промышленность","en":"Mining industry","def":"Отрасль добычи твёрдых полезных ископаемых"},{"ru":"Горно-металлургический комбинат (ГМК)","en":"Mining and metallurgical complex","def":"Интегрированное предприятие: добыча, обогащение и металлургия"},{"ru":"Цепочка создания стоимости","en":"Value chain","def":"Последовательность переделов от недр до изделия"},{"ru":"Передел","en":"Processing stage / conversion step","def":"Отдельная стадия переработки сырья"},{"ru":"Добыча","en":"Mining / extraction","def":"Извлечение руды из недр"},{"ru":"Обогащение","en":"Mineral processing / beneficiation","def":"Повышение содержания ценного минерала в продукте"},{"ru":"Концентрат","en":"Concentrate","def":"Продукт обогащения с высоким содержанием ценного компонента"},{"ru":"Рафинирование","en":"Refining","def":"Очистка металла от примесей до заданной чистоты"},{"ru":"Полуфабрикат","en":"Semi-finished product / mill product","def":"Прутки, листы, проволока, порошки для дальнейшей обработки"},{"ru":"Критическое сырьё","en":"Critical raw materials (CRM)","def":"Экономически важное сырьё с высоким риском поставок"},{"ru":"Малые металлы","en":"Minor metals","def":"Металлы с небольшим рынком без биржевой торговли (W, Mo, Re, In и др.)"},{"ru":"Тугоплавкие металлы","en":"Refractory metals","def":"W, Mo, Ta, Nb, Re: металлы с очень высокой температурой плавления"},{"ru":"Редкоземельные элементы (РЗЭ)","en":"Rare earth elements (REE)","def":"15 лантаноидов, плюс иттрий и скандий"},{"ru":"Мейджор","en":"Major (mining major)","def":"Крупнейшая диверсифицированная горнодобывающая компания"},{"ru":"Юниор","en":"Junior (exploration company)","def":"Небольшая компания на стадии разведки или развития проекта"},{"ru":"Компания среднего размера","en":"Mid-tier producer","def":"Производитель среднего масштаба"},{"ru":"Государственная компания","en":"State-owned enterprise (SOE)","def":"Компания под контролем государства"},{"ru":"Трейдер","en":"Trader / trading house","def":"Покупает и продаёт сырьё и металлы, финансирует поставки"},{"ru":"EPCM-подрядчик","en":"EPCM contractor","def":"Проектирует, закупает и управляет строительством от имени владельца"},{"ru":"Производитель оборудования","en":"OEM (Original Equipment Manufacturer)","def":"Производитель техники (Caterpillar, Metso и др.)"},{"ru":"Офтейк-контракт","en":"Offtake agreement","def":"Долгосрочный договор на покупку будущей продукции"},{"ru":"Капитальные затраты","en":"CAPEX (capital expenditure)","def":"Затраты на строительство и оборудование"},{"ru":"Операционные затраты","en":"OPEX (operating expenditure)","def":"Затраты на эксплуатацию"},{"ru":"Полная себестоимость поддержания","en":"AISC (all-in sustaining cost)","def":"Себестоимость с учётом поддерживающих капзатрат"},{"ru":"Кривая затрат","en":"Cost curve","def":"Ранжирование производителей по себестоимости"},{"ru":"Метрическая тонна-единица","en":"mtu (metric tonne unit)","def":"10 кг WO₃; единица цены вольфрамовых продуктов"},{"ru":"Паравольфрамат аммония","en":"APT (ammonium paratungstate)","def":"Ключевой промежуточный продукт вольфрамовой цепочки; по его цене считают остальные"},{"ru":"Сырьевой цикл","en":"Commodity cycle","def":"Волнообразные колебания цен и инвестиций"},{"ru":"Социальная лицензия","en":"Social licence to operate","def":"Согласие местного сообщества на работу предприятия"},{"ru":"Прослеживаемость цепочки поставок","en":"Supply chain traceability / due diligence","def":"Подтверждение происхождения сырья и ответственной добычи"},{"ru":"Импортозамещение","en":"Import substitution","def":"Замена импортной продукции собственной"},{"ru":"Конечные отрасли","en":"End-use sectors / end markets","def":"Отрасли-потребители металла"}],"quiz":[{"q":"Какое утверждение о цепочке создания стоимости верно?","options":["Дефицит специалистов, как правило, растёт от upstream к downstream","Количество специалистов в мире растёт от upstream к downstream","Добавленная стоимость максимальна на стадии добычи руды","Downstream — это геологоразведка"],"answer":0,"explain":"Горных инженеров в мире очень много, а технологов, которые запускали, например, производство APT вне Китая, — единицы. Добавленная стоимость, наоборот, растёт к downstream."},{"q":"Что такое mtu в торговле вольфрамом?","options":["1 тонна вольфрамового концентрата","1 кг металлического вольфрама","100 кг APT","10 кг WO₃"],"answer":3,"explain":"Metric tonne unit = 1% от метрической тонны = 10 кг WO₃. Цена APT указывается в $/mtu WO₃."},{"q":"Какая компания — ближайший мировой аналог TMK по модели?","options":["Plansee Group","Caterpillar","Trafigura","SRK Consulting"],"answer":0,"explain":"Plansee — интегрированная группа по вольфраму и молибдену: порошки, полуфабрикаты, твёрдые сплавы (через Ceratizit). Caterpillar — производитель оборудования, Trafigura — трейдер, SRK — консультант."},{"q":"Кандидат 10 лет работал в консалтинговой компании и писал отчёты по оценке ресурсов. Главный риск для роли начальника рудника:","options":["Не знает геологию","Не говорит по-английски","Слишком мало работал","Нет опыта ответственности за производственные KPI на площадке"],"answer":3,"explain":"Консультант видит много проектов, но не отвечает ежедневно за тонны, безопасность и людей. Для операционной роли это ключевой пробел, который нужно проверить."},{"q":"Почему кобальт важен для вольфрамовой цепочки TMK?","options":["Кобальт добывают вместе с вольфрамом на Ингичке","Кобальт — связка в твёрдых сплавах WC–Co (например, ВК8)","Кобальт используют для флотации шеелита","Связи нет"],"answer":1,"explain":"В твёрдом сплаве зёрна карбида вольфрама связаны кобальтом. Цифра в марке ВК8 — это процент кобальта."},{"q":"Какое событие — лучший триггер для начала поиска кандидатов?","options":["Рекордная прибыль конкурента","Публикация годового отчёта","Отраслевая выставка","Приостановка рудника или проекта у потенциальной компании-донора"],"answer":3,"explain":"При остановке производства освобождаются целые команды, люди открыты к предложениям. Пример — приостановка Nickel West компанией BHP в 2024 г."},{"q":"Что из перечисленного — стандарт ответственных цепочек поставок, по которому TMK получила статус в 2026 г.?","options":["JORC","RMI RMAP","GISTM","ISO 9001"],"answer":1,"explain":"RMAP (Responsible Minerals Assurance Process) — программа аудита плавильных и перерабатывающих предприятий в рамках Responsible Minerals Initiative. Вольфрам входит в группу 3TG."},{"q":"Как формируется цена на вольфрам (APT)?","options":["Оценками ценовых агентств и прямыми переговорами, вне биржи","На Лондонской бирже металлов (LME)","Устанавливается правительством Китая","По цене на медь"],"answer":0,"explain":"Вольфрам — малый металл без биржевой торговли. Ориентиры дают ценовые агентства (Fastmarkets, Argus и др.), сделки заключаются напрямую."},{"q":"Сколько в среднем занимает путь от открытия месторождения до начала добычи (оценка МЭА)?","options":["1–2 года","4–5 лет","Около 16 лет","40 лет"],"answer":2,"explain":"Поэтому кадровое планирование в горной отрасли идёт на годы вперёд, а опыт «довести проект до пуска» особенно ценен."},{"q":"Что значит «критический минерал»?","options":["Экономически важный минерал с высоким риском перебоев в поставках","Минерал, опасный для здоровья","Любой минерал, который добывают в Китае","Минерал с высокой ценой"],"answer":0,"explain":"Два критерия: экономическая важность и риск поставок. Цена сама по себе не делает минерал критическим."}],"html":"<h2>0. Входной тест (до чтения теории)<\/h2>\n<p>Ответьте письменно, <strong>не подглядывая<\/strong>. Неправильные ответы — это нормально. Это точка отсчёта: на 10-й день вы пройдёте этот тест снова и увидите разницу.<\/p>\n<ol><li>Чем руда отличается от горной породы?<\/li><li>Что такое концентрат и чем он отличается от металла?<\/li><li>Назовите три крупнейшие диверсифицированные горнодобывающие компании мира.<\/li><li>Что делает EPCM-подрядчик?<\/li><li>Почему вольфрам считается критическим металлом?<\/li><li>Чем «юниор» отличается от «мейджора»?<\/li><li>Что такое offtake-контракт?<\/li><li>Что такое JORC?<\/li><li>Какую долю мировой добычи вольфрама даёт Китай: 30%, 50% или 80%?<\/li><li>Кто в горной компании отвечает за то, чтобы руда стала концентратом?<\/li><\/ol>\n<details><summary>Ответы (смотреть после попытки)<\/summary>\n<ol><li>Руда — это порода, из которой <strong>экономически выгодно<\/strong> извлекать металл при текущих ценах и технологиях. Руда — понятие экономическое.<\/li><li>Концентрат — продукт обогащения с повышенным содержанием ценного минерала (например, 65% WO₃). Металл получают из концентрата металлургическими переделами.<\/li><li>Например: BHP, Rio Tinto, Glencore (также Anglo American, Vale).<\/li><li>EPCM — Engineering, Procurement, Construction Management: проектирует, закупает и управляет строительством от имени владельца. Риск стоимости остаётся у владельца.<\/li><li>Высокая экономическая важность (твёрдые сплавы, оборона, электроника) при высоком риске поставок: около 80% добычи — Китай, плюс экспортный контроль с 2025 г.<\/li><li>Юниор — небольшая компания на стадии разведки или развития, без собственной добычи. Мейджор — крупная диверсифицированная добывающая компания.<\/li><li>Долгосрочный договор на покупку будущей продукции проекта. Часто нужен для получения финансирования.<\/li><li>Австралазийский кодекс публичной отчётности о результатах разведки, минеральных ресурсах и рудных запасах.<\/li><li>Около 80% (≈ 67 из 85 тыс. т в 2025 г.).<\/li><li>Обогатительная фабрика (Processing Plant): начальник фабрики, технологи-обогатители (в западной терминологии — metallurgists).<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Цепочка создания стоимости: от недр до изделия<\/h3>\n<p>Любой металл проходит одну и ту же цепочку. На каждом шаге меняются продукт, технологии, компании и люди.<\/p>\n<pre class=\"code\"><code>UPSTREAM (сырьё)                MIDSTREAM (металл)                  DOWNSTREAM (изделие)\nГеологоразведка → Проект →      Металлургия → Рафинирование →       Полуфабрикаты → Изделия →\nСтроительство → Добыча →        Химические соединения               Конечные отрасли\nОбогащение → КОНЦЕНТРАТ                                              + Переработка вторсырья (recycling)<\/code><\/pre>\n<p>Пример цепочки для вольфрама, ключевого металла TMK:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Передел<\/th><th>Продукт<\/th><th>Типичное содержание<\/th><th>Кто это делает<\/th><\/tr><\/thead><tbody><tr><td>Добыча<\/td><td>Руда<\/td><td>0,2–1% WO₃<\/td><td>Горняки, геологи, взрывники, механики<\/td><\/tr><tr><td>Обогащение<\/td><td>Вольфрамовый концентрат (шеелитовый или вольфрамитовый)<\/td><td>50–70% WO₃ (торговый стандарт — 65%)<\/td><td>Технологи-обогатители (metallurgists)<\/td><\/tr><tr><td>Гидрометаллургия<\/td><td>Паравольфрамат аммония (APT)<\/td><td>≈ 88,5% WO₃, высокая чистота<\/td><td>Химики-технологи, гидрометаллурги<\/td><\/tr><tr><td>Термическая обработка и восстановление<\/td><td>Оксиды вольфрама → порошок W → карбид вольфрама WC<\/td><td>99,9%+<\/td><td>Металлурги, специалисты по порошкам<\/td><\/tr><tr><td>Порошковая металлургия<\/td><td>Твёрдый сплав (WC–Co), штабики, проволока<\/td><td>—<\/td><td>Технологи порошковой металлургии, инженеры по качеству<\/td><\/tr><tr><td>Изделие<\/td><td>Режущие пластины, буровые коронки, фрезы, электроды<\/td><td>—<\/td><td>Конструкторы, технологи, продажи<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Три закона цепочки, которые нужно запомнить:<\/strong><\/p>\n<ol><li><strong>Стоимость растёт на каждом переделе.<\/strong> Тонна концентрата стоит дешевле тонны APT, а та — дешевле тонны твёрдосплавных пластин. Поэтому стратегия TMK «месторождение — металл — рынок» — это стратегия удержания добавленной стоимости внутри страны. В TMK говорят, что дообогащение вольфрамового концентрата позволяет удвоить добавленную стоимость.<\/li><li><strong>Чем дальше по цепочке, тем меньше людей в мире умеют это делать.<\/strong> Горных инженеров — сотни тысяч. Технологов, которые запускали производство APT вне Китая, — единицы. Для подбора это главный закон: <strong>дефицит растёт к downstream<\/strong>.<\/li><li><strong>На каждом переделе свой язык.<\/strong> Геолог думает в «% WO₃ и тоннах руды», обогатитель — в «извлечении и качестве концентрата», металлург — в «примесях и чистоте», продавец — в «$/mtu и спецификациях». Рекрутер должен переключаться между этими языками.<\/li><\/ol>\n<blockquote><p><strong>TMK:<\/strong> на сайте компании цепочка описана так: upstream — добыча и концентраты, midstream — производство металлов, downstream — готовые изделия. У TMK есть все три звена: Ингичка (концентрат) → Чирчик (металл, твёрдые сплавы) → Smart Powder и изделия. Редкий случай полной вертикали в одной компании.<\/p><\/blockquote>\n<h3>1.2 Кто есть кто: десять архетипов компаний<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Архетип<\/th><th>Примеры<\/th><th>Особенности<\/th><th>Что это значит для подбора<\/th><\/tr><\/thead><tbody><tr><td><strong>Мейджоры<\/strong> (majors)<\/td><td>BHP, Rio Tinto, Glencore, Anglo American, Vale, Freeport-McMoRan, Zijin Mining<\/td><td>Огромный масштаб, зрелые системы, сильная культура охраны труда, структурированные карьерные лестницы<\/td><td>Сильные «системные» руководители и узкие эксперты. Риск: привыкли к большим бюджетам и готовым процессам<\/td><\/tr><tr><td><strong>Компании среднего размера<\/strong> (mid-tiers)<\/td><td>Boliden, KGHM, Lundin Mining, First Quantum, Solidcore Resources (бывш. Polymetal), ERG, Kazzinc<\/td><td>Меньше бюрократии, люди отвечают за более широкий круг задач<\/td><td>Хороший баланс системности и универсальности<\/td><\/tr><tr><td><strong>Узкопрофильные производители критических металлов<\/strong><\/td><td>Almonty, Masan High-Tech Materials, Molymet, Lynas, MP Materials, Iluka, Albemarle, SQM, Syrah, Plansee<\/td><td>Редкие технологии, маленькие команды<\/td><td><strong>Главный пул доноров для TMK.<\/strong> Пул кандидатов крошечный, поиск долгий, нужен точечный подход<\/td><\/tr><tr><td><strong>Юниоры<\/strong> (juniors)<\/td><td>Сотни компаний на биржах ASX, TSX-V, AIM<\/td><td>Разведка и подготовка проектов, 5–50 человек<\/td><td>Предприимчивые геологи и руководители проектов. Опыта эксплуатации обычно нет<\/td><\/tr><tr><td><strong>Государственные компании и национальные чемпионы<\/strong><\/td><td>Codelco, Казатомпром, Тау-Кен Самрук, Ma'aden, OCP, China Minmetals, АГМК, НГМК, TMK<\/td><td>Государственные KPI, сетки окладов, сильные локальные связи<\/td><td>Локальные лидеры, знающие регуляторику. Риск: медленная культура изменений<\/td><\/tr><tr><td><strong>Металлургические и рафинировочные компании<\/strong><\/td><td>Umicore, Aurubis, Korea Zinc, JX Metals, Sumitomo Metal Mining, Mitsubishi Materials, 5N Plus, H.C. Starck Tungsten<\/td><td>Глубокая химия и металлургия, высокая чистота<\/td><td>Доноры для Чирчика: технологи, химики, специалисты по качеству<\/td><\/tr><tr><td><strong>Трейдеры<\/strong><\/td><td>Glencore, Trafigura, Mercuria, IXM, CRONIMET, Traxys<\/td><td>Логистика, финансирование, маркетинг<\/td><td>Коммерческие директора, специалисты по продажам и маркетингу металлов<\/td><\/tr><tr><td><strong>EPC/EPCM-компании и инжиниринг<\/strong><\/td><td>Hatch, Worley, Fluor, Bechtel, Ausenco, Wood, Lycopodium, DRA; китайские ENFI, NFC, BGRIMM<\/td><td>Проектирование и строительство<\/td><td>Директора проектов, project controls, руководители пусконаладки<\/td><\/tr><tr><td><strong>Консультанты<\/strong><\/td><td>SRK, AMC, WSP (Golder), SLR, Snowden Optiro, ERM (CSA Global), Wardell Armstrong, Micon<\/td><td>Оценка ресурсов, исследования, due diligence<\/td><td>Геологи-ресурсники, Competent Persons. Риск: нет опыта ответственности за результат на площадке<\/td><\/tr><tr><td><strong>Производители оборудования (OEM) и технологий<\/strong><\/td><td>Caterpillar, Komatsu, Liebherr, Sandvik, Epiroc, Metso, FLSmidth, Weir, БелАЗ<\/td><td>Оборудование, сервис, технологии<\/td><td>Эксперты по оборудованию и надёжности. Риск: позиция поставщика, а не владельца<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Отдельные категории, о которых часто забывают:<\/p>\n<ul><li><strong>Лаборатории и центры испытаний<\/strong> — SGS, ALS, Bureau Veritas, Intertek, ANSTO, Mintek. Отсюда приходят аналитики и технологи пилотных установок для R&amp;D Park.<\/li><li><strong>НИИ и университеты<\/strong> — Colorado School of Mines, TU Bergakademie Freiberg, JKMRC (Квинсленд), НИТУ МИСИС, Горный университет (Санкт-Петербург), Central South University (Чанша).<\/li><li><strong>Финансовые институты<\/strong> — IFC, ЕБРР, АБР, ЕАБР, DFC (США), JOGMEC (Япония), KOMIR (Корея). Здесь работают технические эксперты по оценке проектов, которые иногда переходят в компании.<\/li><\/ul>\n<h3>1.3 Как отрасль зарабатывает: циклы, цены и люди<\/h3>\n<p><strong>Сырьевой цикл (commodity cycle).<\/strong> Цены на металлы ходят волнами. Механика простая: высокие цены → компании запускают проекты и <strong>массово нанимают<\/strong> → через 5–15 лет предложение растёт → цены падают → проекты замораживают, людей <strong>сокращают<\/strong>.<\/p>\n<p><strong>Почему это важно для рекрутера:<\/strong><\/p>\n<ul><li><strong>Во время спада появляется доступный пул кандидатов.<\/strong> Пример: падение цен на литий в 2023–2024 гг. и на никель (из-за роста индонезийского предложения). Ряд австралийских проектов и рудников остановили, в том числе BHP приостановила Nickel West в октябре 2024 г. Сильные специалисты внезапно стали доступны.<\/li><li><strong>Во время бума за специалистов идёт война<\/strong>, и зарплаты растут. Сейчас бум по вольфраму и РЗЭ (см. профиль TMK).<\/li><li><strong>Правило:<\/strong> следите за новостями о закрытиях, сокращениях, слияниях и задержках проектов. Это лучшие триггеры для начала поиска.<\/li><\/ul>\n<p><strong>Как устроены цены:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Металлы<\/th><th>Где формируется цена<\/th><th>Единицы<\/th><\/tr><\/thead><tbody><tr><td>Биржевые<\/td><td>Медь, алюминий, цинк, никель, свинец, олово, кобальт<\/td><td>LME (Лондонская биржа металлов), COMEX, SHFE<\/td><td>$/т<\/td><\/tr><tr><td>Внебиржевые (малые металлы, minor metals)<\/td><td>Вольфрам, молибден, рений, РЗЭ, литиевые соединения, графит, селен, теллур<\/td><td>Оценки ценовых агентств (Fastmarkets, Argus, Asian Metal, SMM, Benchmark), прямые переговоры<\/td><td>APT: $/mtu WO₃ (1 mtu = 10 кг WO₃); Mo: $/фунт или $/кг; Re: $/кг; NdPr-оксид: $/кг; литий: $/т LCE<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ключевые экономические показатели<\/strong> (кандидаты-руководители говорят на этом языке):<\/p>\n<ul><li><strong>CAPEX<\/strong> — капитальные затраты (построить). <strong>OPEX<\/strong> — операционные затраты (эксплуатировать).<\/li><li><strong>C1 cash cost / AISC<\/strong> (all-in sustaining cost) — себестоимость единицы продукции.<\/li><li><strong>Кривая затрат (cost curve)<\/strong> — ранжирование производителей по себестоимости. Кто в первом квартиле, тот выживает при падении цен.<\/li><li><strong>NPV, IRR, payback<\/strong> — стоимость проекта, его доходность и срок окупаемости.<\/li><li><strong>Срок реализации.<\/strong> От открытия месторождения до начала добычи проходит в среднем около 16 лет (оценка МЭА). Поэтому кадровое планирование в отрасли — на годы вперёд.<\/li><\/ul>\n<h3>1.4 ESG и прослеживаемость: новые «пропуска» на рынок<\/h3>\n<p>Западные покупатели и финансисты требуют подтверждений ответственной добычи. Для TMK это вопрос экспорта, а не имиджа.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Стандарт или инициатива<\/th><th>Суть<\/th><th>Почему важно для TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>RMI / RMAP<\/strong> (Responsible Minerals Initiative)<\/td><td>Аудит ответственных цепочек поставок, особенно для 3TG (олово, тантал, вольфрам, золото)<\/td><td>TMK получила статус RMAP Conformant (2026). Нужны люди, которые этот статус поддерживают<\/td><\/tr><tr><td><strong>OECD Due Diligence Guidance<\/strong><\/td><td>Руководство по проверке цепочек поставок минерального сырья<\/td><td>Основа RMAP и требований покупателей<\/td><\/tr><tr><td><strong>GISTM<\/strong> (Global Industry Standard on Tailings Management, 2020)<\/td><td>Глобальный стандарт управления хвостохранилищами, принят после катастрофы в Брумадинью (Vale, 2019)<\/td><td>Любой новый проект TMK с хвостами<\/td><\/tr><tr><td><strong>IRMA, ICMM<\/strong><\/td><td>Стандарт ответственной добычи; принципы Международного совета по горному делу и металлам<\/td><td>Ожидания крупных партнёров<\/td><\/tr><tr><td><strong>EU Critical Raw Materials Act<\/strong> (2024)<\/td><td>Закон ЕС о критическом сырье: цели по добыче, переработке и диверсификации поставок<\/td><td>Возможность для TMK стать поставщиком ЕС<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Новые роли, которые из этого следуют:<\/strong> ESG-менеджер, специалист по due diligence цепочек поставок, менеджер по взаимодействию с местными сообществами, специалист по хвостохранилищам (Responsible Tailings Facility Engineer).<\/p>\n<h3>1.5 Критические минералы: металлы TMK на одной странице<\/h3>\n<p>Критическим минерал называют, когда он <strong>экономически важен<\/strong> и при этом <strong>есть высокий риск перебоев в поставках<\/strong>. Списки критических минералов ведут ЕС, США, Япония, Корея, Австралия и другие страны.<\/p>\n<p>Доли ниже приблизительные. Это ориентиры по данным USGS, МЭА и отраслевых ассоциаций за последние годы.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл<\/th><th>Главные применения<\/th><th>Кто доминирует в поставках<\/th><th>Почему критичен<\/th><\/tr><\/thead><tbody><tr><td><strong>Вольфрам (W)<\/strong><\/td><td>Твёрдые сплавы для режущего и горного инструмента (больше половины спроса), оборона, электроника, тяжёлые сплавы<\/td><td>Китай ≈ 80% добычи<\/td><td>Нет полноценной замены в твёрдых сплавах; экспортный контроль Китая<\/td><\/tr><tr><td><strong>Молибден (Mo)<\/strong><\/td><td>Легирование сталей (около 80% спроса), катализаторы, химия, металлический Mo<\/td><td>Китай, Чили, США, Перу<\/td><td>Основная часть — попутная добыча из медных руд<\/td><\/tr><tr><td><strong>Рений (Re)<\/strong><\/td><td>Жаропрочные никелевые суперсплавы для турбинных лопаток, Pt–Re катализаторы риформинга<\/td><td>Чили (Molymet) — крупнейший производитель; мировой выпуск — десятки тонн в год<\/td><td>Только попутное производство (из молибденита и медного сырья), крошечный рынок<\/td><\/tr><tr><td><strong>РЗЭ (REE)<\/strong><\/td><td>Постоянные магниты NdFeB (электродвигатели, ветрогенераторы, оборона), катализаторы, полировка, люминофоры<\/td><td>Китай ≈ 70% добычи и ≈ 90% разделения и производства магнитов<\/td><td>Технологии разделения сконцентрированы в Китае<\/td><\/tr><tr><td><strong>Литий (Li)<\/strong><\/td><td>Аккумуляторы (основной спрос), стекло, керамика, смазки<\/td><td>Добыча — Австралия, Чили, Китай, Аргентина, Зимбабве; переработка — Китай ≈ 60–65%<\/td><td>Взрывной рост спроса, концентрация переработки в Китае<\/td><\/tr><tr><td><strong>Графит (C)<\/strong><\/td><td>Аноды аккумуляторов, огнеупоры, электроды<\/td><td>Китай доминирует в добыче природного графита и производстве анодов<\/td><td>Аноды почти полностью производятся в Китае<\/td><\/tr><tr><td><strong>Никель (Ni)<\/strong><\/td><td>Нержавеющая сталь, аккумуляторы, суперсплавы<\/td><td>Индонезия ≈ более половины добычи<\/td><td>Концентрация в одной стране<\/td><\/tr><tr><td><strong>Кобальт (Co)<\/strong><\/td><td>Аккумуляторы, суперсплавы, <strong>связка в твёрдых сплавах WC–Co<\/strong><\/td><td>ДР Конго ≈ 70–75% добычи; Китай — большая часть рафинирования<\/td><td>Страновой и этический риск<\/td><\/tr><tr><td><strong>Селен, теллур (Se, Te)<\/strong><\/td><td>Стекло и электроника; солнечные модули CdTe, термоэлектрика<\/td><td>Попутные продукты рафинирования меди<\/td><td>Объём зависит от выпуска меди<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p><strong>Связь, которую нужно увидеть:<\/strong> кобальт — это не только аккумуляторы, но и связка в твёрдом сплаве ВК8 (8% Co). Значит, TMK покупает кобальт для своих твёрдых сплавов. Такие связи между металлами вы будете замечать всё чаще. Это признак отраслевого мышления.<\/p><\/blockquote>\n<h3>1.6 Где TMK на этой карте<\/h3>\n<p><strong>Ближайшие аналоги TMK в мире<\/strong> — интегрированные производители тугоплавких и редких металлов:<\/p>\n<ul><li><strong>Plansee Group<\/strong> (Австрия; W и Mo, твёрдые сплавы через Ceratizit, порошки через Global Tungsten &amp; Powders).<\/li><li><strong>Masan High-Tech Materials<\/strong> (Вьетнам; рудник Нуй Фао и химическая переработка вольфрама).<\/li><li><strong>Xiamen Tungsten, China Tungsten High-Tech<\/strong> (Китай; полная вольфрамовая цепочка).<\/li><li><strong>Молимет<\/strong> (Чили; переработка молибдена и производство рения).<\/li><li><strong>Ульбинский металлургический завод<\/strong> (Казахстан; тантал, ниобий, бериллий).<\/li><\/ul>\n<p><strong>Уникальность TMK [Аналитика]:<\/strong><\/p>\n<ol><li>Советская база тугоплавких металлов в Чирчике (стандарты ГОСТ, марки ВК).<\/li><li>Синергия с АГМК: медно-молибденовое сырьё, рений, селен, теллур.<\/li><li>Доступ к растворам урановых месторождений с РЗЭ и рением.<\/li><li>Государственный приоритет и финансирование.<\/li><li>Партнёрства одновременно с США, ЕС, Кореей, Японией и Китаем.<\/li><\/ol>\n<p><strong>Кадровое следствие:<\/strong> лучшие кандидаты для TMK — люди, которые <strong>уже проходили путь «руда → металл → изделие» в специализированных металлах<\/strong>. Их ищут в компаниях-аналогах и у их поставщиков.<\/p>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Горнодобывающая промышленность<\/td><td>Mining industry<\/td><td>Отрасль добычи твёрдых полезных ископаемых<\/td><\/tr><tr><td>Горно-металлургический комбинат (ГМК)<\/td><td>Mining and metallurgical complex<\/td><td>Интегрированное предприятие: добыча, обогащение и металлургия<\/td><\/tr><tr><td>Цепочка создания стоимости<\/td><td>Value chain<\/td><td>Последовательность переделов от недр до изделия<\/td><\/tr><tr><td>Передел<\/td><td>Processing stage / conversion step<\/td><td>Отдельная стадия переработки сырья<\/td><\/tr><tr><td>Добыча<\/td><td>Mining / extraction<\/td><td>Извлечение руды из недр<\/td><\/tr><tr><td>Обогащение<\/td><td>Mineral processing / beneficiation<\/td><td>Повышение содержания ценного минерала в продукте<\/td><\/tr><tr><td>Концентрат<\/td><td>Concentrate<\/td><td>Продукт обогащения с высоким содержанием ценного компонента<\/td><\/tr><tr><td>Рафинирование<\/td><td>Refining<\/td><td>Очистка металла от примесей до заданной чистоты<\/td><\/tr><tr><td>Полуфабрикат<\/td><td>Semi-finished product / mill product<\/td><td>Прутки, листы, проволока, порошки для дальнейшей обработки<\/td><\/tr><tr><td>Критическое сырьё<\/td><td>Critical raw materials (CRM)<\/td><td>Экономически важное сырьё с высоким риском поставок<\/td><\/tr><tr><td>Малые металлы<\/td><td>Minor metals<\/td><td>Металлы с небольшим рынком без биржевой торговли (W, Mo, Re, In и др.)<\/td><\/tr><tr><td>Тугоплавкие металлы<\/td><td>Refractory metals<\/td><td>W, Mo, Ta, Nb, Re: металлы с очень высокой температурой плавления<\/td><\/tr><tr><td>Редкоземельные элементы (РЗЭ)<\/td><td>Rare earth elements (REE)<\/td><td>15 лантаноидов, плюс иттрий и скандий<\/td><\/tr><tr><td>Мейджор<\/td><td>Major (mining major)<\/td><td>Крупнейшая диверсифицированная горнодобывающая компания<\/td><\/tr><tr><td>Юниор<\/td><td>Junior (exploration company)<\/td><td>Небольшая компания на стадии разведки или развития проекта<\/td><\/tr><tr><td>Компания среднего размера<\/td><td>Mid-tier producer<\/td><td>Производитель среднего масштаба<\/td><\/tr><tr><td>Государственная компания<\/td><td>State-owned enterprise (SOE)<\/td><td>Компания под контролем государства<\/td><\/tr><tr><td>Трейдер<\/td><td>Trader / trading house<\/td><td>Покупает и продаёт сырьё и металлы, финансирует поставки<\/td><\/tr><tr><td>EPCM-подрядчик<\/td><td>EPCM contractor<\/td><td>Проектирует, закупает и управляет строительством от имени владельца<\/td><\/tr><tr><td>Производитель оборудования<\/td><td>OEM (Original Equipment Manufacturer)<\/td><td>Производитель техники (Caterpillar, Metso и др.)<\/td><\/tr><tr><td>Офтейк-контракт<\/td><td>Offtake agreement<\/td><td>Долгосрочный договор на покупку будущей продукции<\/td><\/tr><tr><td>Капитальные затраты<\/td><td>CAPEX (capital expenditure)<\/td><td>Затраты на строительство и оборудование<\/td><\/tr><tr><td>Операционные затраты<\/td><td>OPEX (operating expenditure)<\/td><td>Затраты на эксплуатацию<\/td><\/tr><tr><td>Полная себестоимость поддержания<\/td><td>AISC (all-in sustaining cost)<\/td><td>Себестоимость с учётом поддерживающих капзатрат<\/td><\/tr><tr><td>Кривая затрат<\/td><td>Cost curve<\/td><td>Ранжирование производителей по себестоимости<\/td><\/tr><tr><td>Метрическая тонна-единица<\/td><td>mtu (metric tonne unit)<\/td><td>10 кг WO₃; единица цены вольфрамовых продуктов<\/td><\/tr><tr><td>Паравольфрамат аммония<\/td><td>APT (ammonium paratungstate)<\/td><td>Ключевой промежуточный продукт вольфрамовой цепочки; по его цене считают остальные<\/td><\/tr><tr><td>Сырьевой цикл<\/td><td>Commodity cycle<\/td><td>Волнообразные колебания цен и инвестиций<\/td><\/tr><tr><td>Социальная лицензия<\/td><td>Social licence to operate<\/td><td>Согласие местного сообщества на работу предприятия<\/td><\/tr><tr><td>Прослеживаемость цепочки поставок<\/td><td>Supply chain traceability / due diligence<\/td><td>Подтверждение происхождения сырья и ответственной добычи<\/td><\/tr><tr><td>Импортозамещение<\/td><td>Import substitution<\/td><td>Замена импортной продукции собственной<\/td><\/tr><tr><td>Конечные отрасли<\/td><td>End-use sectors / end markets<\/td><td>Отрасли-потребители металла<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search<\/h2>\n<h3>3.1 Как «родная» компания формирует кандидата<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Откуда кандидат<\/th><th>Сильные стороны<\/th><th>Риски для TMK<\/th><th>Проверочный вопрос<\/th><\/tr><\/thead><tbody><tr><td>Мейджор<\/td><td>Системы, охрана труда, масштаб, процессы<\/td><td>Мог только «эксплуатировать готовое»; узкий участок<\/td><td>«Что вы построили или изменили сами, а что получили готовым?»<\/td><\/tr><tr><td>Узкопрофильный производитель<\/td><td>Редкая глубокая технология<\/td><td>Маленький масштаб, мало управленческого опыта<\/td><td>«Какой масштаб производства и сколько людей было в вашей зоне ответственности?»<\/td><\/tr><tr><td>Юниор<\/td><td>Предприимчивость, широкий профиль<\/td><td>Нет опыта эксплуатации и пуска<\/td><td>«Доводили ли вы проект до пуска и эксплуатации?»<\/td><\/tr><tr><td>Китайская компания<\/td><td>Практические технологии W и РЗЭ<\/td><td>Язык, ограничения на передачу технологий, иная культура документирования<\/td><td>«Какие процессы вы вели сами и на каком оборудовании?»<\/td><\/tr><tr><td>Предприятие СНГ<\/td><td>Практика, ГОСТ, устойчивость к сложным условиям<\/td><td>Мало опыта с международными стандартами<\/td><td>«С какими международными стандартами и аудитами работали?»<\/td><\/tr><tr><td>Консультант<\/td><td>Широкий кругозор, сильная аналитика и отчёты<\/td><td>Мало ответственности за результат на площадке<\/td><td>«Отвечали ли вы за производственные KPI на площадке не менее 2 лет?»<\/td><\/tr><tr><td>OEM<\/td><td>Глубокое знание оборудования<\/td><td>Мышление поставщика, а не владельца<\/td><td>«Как вы решали проблемы клиента, когда оборудование не выходило на паспортные показатели?»<\/td><\/tr><tr><td>НИИ или университет<\/td><td>Глубокая наука, методики<\/td><td>Нет опыта масштабирования и производства<\/td><td>«Какой ваш самый большой масштаб: лаборатория, пилотная установка или промышленность?»<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>3.2 Ловушка масштаба<\/h3>\n<p>Генеральный директор медного рудника на 50 млн т в год не обязательно хорош для вольфрамового рудника на 0,5 млн т. Отличаются задачи, бюджеты, системы и даже тип мышления. Всегда сравнивайте:<\/p>\n<ul><li><strong>масштаб<\/strong> (тонны, люди, бюджет);<\/li><li><strong>стадию<\/strong> (стройка, пуск, стабильная работа, кризис);<\/li><li><strong>технологию<\/strong> (металл и тип переработки).<\/li><\/ul>\n<h3>3.3 Сигналы рынка, по которым начинают поиск<\/h3>\n<ul><li><strong>Закрытие или приостановка производства<\/strong> → освобождается целая команда. Подключайтесь в первые недели.<\/li><li><strong>Слияния и поглощения<\/strong> → неопределённость и дублирование ролей; люди открыты к предложениям.<\/li><li><strong>Задержка или перерасход проекта<\/strong> → смена руководства, недовольство команды.<\/li><li><strong>Окончание строительства<\/strong> → строители проекта ищут следующий проект.<\/li><li><strong>Обвал цены на металл<\/strong> (например, литий в 2023–2024 гг.) → сокращения в целом сегменте.<\/li><\/ul>\n<h3>3.4 Первые вопросы, которые показывают уровень кандидата<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Вопрос<\/th><th>Что отвечает сильный кандидат<\/th><th>Красный флаг<\/th><\/tr><\/thead><tbody><tr><td>«Опишите цепочку от руды до продукта на вашем предприятии. Где были вы?»<\/td><td>Точная схема, цифры: производительность, содержание, извлечение, качество продукта<\/td><td>Общие слова без цифр; «мы», но непонятно, что делал сам<\/td><\/tr><tr><td>«Какие KPI были у вашего подразделения? Что вы изменили?»<\/td><td>2–3 KPI с базой и результатом: «извлечение с 72 до 78%»<\/td><td>Не помнит цифр; перечисляет обязанности вместо результатов<\/td><\/tr><tr><td>«Как цена металла влияла на решения компании?»<\/td><td>Понимает связь цены, бортового содержания, плана и затрат<\/td><td>«Это не моя зона» — для руководителя это плохой знак<\/td><\/tr><tr><td>«Кто ваши основные конкуренты и где они на кривой затрат?»<\/td><td>Называет конкурентов и их преимущества<\/td><td>Не знает рынок своего продукта<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Практика: карта компаний-доноров v1.0<\/h2>\n<p><strong>Задание (40 мин).<\/strong> Создайте таблицу (Excel, Google Sheets или Notion) по направлению <strong>«вольфрам: от концентрата до твёрдого сплава»<\/strong>.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Компания<\/th><th>Страна<\/th><th>Архетип<\/th><th>Звено цепочки<\/th><th>Роли, которые там можно найти<\/th><th>Язык<\/th><th>Риски (санкции, экспортный контроль)<\/th><th>Источник<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<p><strong>Требования к результату:<\/strong><\/p>\n<ul><li>20 компаний, минимум 4 архетипа из таблицы 1.2.<\/li><li>Минимум 5 компаний из СНГ и Азии и минимум 5 из ЕС, Северной Америки и Австралии.<\/li><li>По каждой компании — минимум 2 конкретные роли (например, «технолог гидрометаллургического участка APT»).<\/li><li>Используйте LinkedIn (поиск по «ammonium paratungstate», «APT», «tungsten carbide», «cemented carbide»), сайты компаний, сайт ITIA, раздел о вольфраме в USGS Mineral Commodity Summaries.<\/li><\/ul>\n<p><strong>Критерии качества (самопроверка):<\/strong> можно ли по вашей таблице завтра начать прямой поиск? Если в строке нет ролей и источника, строка не готова.<\/p>\n<hr>\n<h2>6. Рефлексия и обязательство на завтра<\/h2>\n<p>Запишите в журнал прогресса (5 минут, письменно):<\/p>\n<ol><li>Три вещи, которые я сегодня поняла и могу объяснить коллеге без шпаргалки.<\/li><li>Одна вещь, которая осталась непонятной (вопрос эксперту TMK).<\/li><li><strong>Обязательство на завтра:<\/strong> «Завтра в ___:___ в ___ (место) я начинаю День 2 с разминки». Конкретное время и место повышают вероятность, что вы действительно сядете заниматься.<\/li><\/ol>\n<blockquote><p><strong>Правило дня:<\/strong> вы только что сделали то, что большинство откладывает, — начали. Завтра будет легче, потому что у вас уже есть карта. Не дайте ей остыть: День 2 — в течение 24 часов.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li><strong>USGS Mineral Commodity Summaries<\/strong> (ежегодный, бесплатный) — по 2 страницы на металл: вольфрам, молибден, рений, РЗЭ, литий, графит, никель, кобальт, селен, теллур. <a href=\"https://www.usgs.gov/centers/national-minerals-information-center\" target=\"_blank\" rel=\"noopener\">usgs.gov/centers/national-minerals-information-center<\/a><\/li><li><strong>IEA Global Critical Minerals Outlook<\/strong> (ежегодный) — спрос, предложение и концентрация переработки.<\/li><li><strong>ITIA<\/strong> — <a href=\"https://www.itia.info\" target=\"_blank\" rel=\"noopener\">itia.info<\/a> (вольфрам); <strong>IMOA<\/strong> — <a href=\"https://www.imoa.info\" target=\"_blank\" rel=\"noopener\">imoa.info<\/a> (молибден).<\/li><li><strong>PwC «Mine»<\/strong> — ежегодный обзор 40 крупнейших горнодобывающих компаний мира.<\/li><li>Новости отрасли: Mining.com, Mining Journal, Mining Weekly, Fastmarkets (часть материалов платная).<\/li><li>Книга: Victor Rudenno, <em>The Mining Valuation Handbook<\/em> — экономика горных проектов простым языком.<\/li><li>Профиль TMK: <a href=\"#tmk\">../00-start/tmk-profile.md<\/a><\/li><\/ul>"},{"n":2,"module":1,"title":"Геология, минералогия и типы месторождений","file":"module-01-mining-fundamentals/day-02-geology-mineralogy-deposits.md","duration":"3,5 часа","challenge":"Составить <strong>«паспорта сырья»<\/strong> для трёх металлов TMK (вольфрам, графит, РЗЭ): минералы, типы месторождений, мировые примеры, главная технологическая сложность и <strong>какой геолог нужен<\/strong>.","why":"Геолог по медным порфировым месторождениям и геолог по вольфрамовым скарнам — разные специалисты, хотя в резюме у обоих написано «геолог, 15 лет». Международные кодексы (JORC) требуют от Competent Person опыта именно в данном <strong>стиле минерализации<\/strong>. Рекрутер, который понимает разницу, не тратит недели на нерелевантных кандидатов.","checklist":[{"text":"Разминка: 5 вопросов по Дню 1 (10 мин)","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search: как читать резюме геолога (35 мин)","minutes":35},{"text":"Практика: 3 паспорта сырья + разбор 5 профилей (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"разминка → блоки 1.1, 1.3, 1.4 → тест дня. Никогда не пропускайте два дня подряд.","terms":[{"ru":"Минерал","en":"Mineral","def":"Природное кристаллическое соединение определённого состава"},{"ru":"Горная порода","en":"Rock","def":"Природный агрегат минералов"},{"ru":"Руда","en":"Ore","def":"Порода, из которой экономически выгодно извлекать ценный компонент"},{"ru":"Пустая порода","en":"Waste rock","def":"Порода без ценного компонента, идёт в отвал"},{"ru":"Жильные (нерудные) минералы","en":"Gangue minerals","def":"Неценные минералы внутри руды"},{"ru":"Рудное тело","en":"Orebody","def":"Геологическое тело, сложенное рудой"},{"ru":"Месторождение","en":"Deposit","def":"Скопление полезного ископаемого, пригодное для отработки"},{"ru":"Рудопроявление","en":"Occurrence / prospect","def":"Признаки оруденения без доказанной экономики"},{"ru":"Содержание","en":"Grade","def":"Доля ценного компонента (%, г/т, ppm)"},{"ru":"Бортовое содержание","en":"Cut-off grade","def":"Минимальное содержание, при котором материал считается рудой"},{"ru":"Разубоживание","en":"Dilution","def":"Подмешивание пустой породы к руде при добыче"},{"ru":"Потери руды","en":"Ore loss","def":"Руда, не извлечённая из недр или ушедшая в отвал"},{"ru":"Извлечение","en":"Recovery","def":"Доля металла, перешедшая из руды в продукт"},{"ru":"Магматические породы","en":"Igneous rocks","def":"Породы, образованные из магмы"},{"ru":"Осадочные породы","en":"Sedimentary rocks","def":"Породы, образованные из осадков"},{"ru":"Метаморфические породы","en":"Metamorphic rocks","def":"Породы, изменённые давлением и температурой"},{"ru":"Скарн","en":"Skarn","def":"Порода на контакте интрузии с известняком; среда для шеелита"},{"ru":"Грейзен","en":"Greisen","def":"Изменённый гранит; среда для вольфрамита и олова"},{"ru":"Метасоматические изменения","en":"Alteration","def":"Изменение пород гидротермальными растворами"},{"ru":"Гидротермальный","en":"Hydrothermal","def":"Связанный с горячими рудоносными растворами"},{"ru":"Порфировое месторождение","en":"Porphyry deposit","def":"Крупное месторождение Cu–Mo–Au с низким содержанием"},{"ru":"Пегматит","en":"Pegmatite","def":"Крупнокристаллическая порода; источник лития и тантала"},{"ru":"Карбонатит","en":"Carbonatite","def":"Магматическая карбонатная порода; источник РЗЭ и Nb"},{"ru":"Россыпь","en":"Placer","def":"Скопление тяжёлых минералов в рыхлых отложениях"},{"ru":"Латерит","en":"Laterite","def":"Кора выветривания; источник Ni, Co, Al"},{"ru":"Шеелит","en":"Scheelite","def":"CaWO₄, главный минерал вольфрама в скарнах"},{"ru":"Вольфрамит","en":"Wolframite","def":"(Fe,Mn)WO₄, вольфрамовый минерал жил и грейзенов"},{"ru":"Молибденит","en":"Molybdenite","def":"MoS₂, главный минерал молибдена и носитель рения"},{"ru":"Бастнезит / монацит / ксенотим","en":"Bastnäsite / monazite / xenotime","def":"Главные минералы РЗЭ"},{"ru":"Сподумен","en":"Spodumene","def":"Главный литиевый минерал пегматитов"},{"ru":"Чешуйчатый графит","en":"Flake graphite","def":"Наиболее ценный тип природного графита"},{"ru":"Ошламование","en":"Sliming / overgrinding","def":"Переизмельчение хрупких минералов в тонкий шлам, ведущее к потерям"},{"ru":"Плотность (удельный вес)","en":"Specific gravity (SG) / density","def":"Основа гравитационного обогащения"}],"quiz":[{"q":"Почему руда — понятие экономическое?","options":["Потому что руду продают на бирже","Потому что порода становится рудой, только если извлечение металла выгодно при текущих ценах и технологиях","Потому что руду оценивают экономисты, а не геологи","Потому что содержание металла в руде всегда выше 1%"],"answer":1,"explain":"При росте цен или появлении новой технологии бывшая пустая порода или хвосты могут стать рудой. Поэтому TMK может перерабатывать техногенные отходы Ингички."},{"q":"Какой минерал — главный носитель рения?","options":["Шеелит","Сподумен","Монацит","Молибденит"],"answer":3,"explain":"Рений изоморфно замещает молибден в молибдените. При окислительном обжиге молибденитового концентрата рений возгоняется, и его улавливают из газов."},{"q":"Какое свойство шеелита помогает геологам находить его в керне?","options":["Голубое свечение под коротковолновым ультрафиолетом","Сильный магнетизм","Красный цвет","Растворимость в воде"],"answer":0,"explain":"Шеелит люминесцирует под коротковолновым УФ. Вопрос про УФ-лампу — хороший маркер реального опыта работы с шеелитовыми рудами."},{"q":"В каком типе месторождений классически образуется шеелит?","options":["Латериты","Скарны","Рассолы","Россыпи монацита"],"answer":1,"explain":"Скарны формируются на контакте гранитоидных интрузий с известняками. Примеры — Сандон (Корея), Кантунг (Канада), Ингичка и Койташ (Узбекистан)."},{"q":"Какое свойство вольфрамита позволяет отделить его от шеелита и касситерита магнитной сепарацией?","options":["Вольфрамит легче воды","Вольфрамит гидрофобен","Вольфрамит растворяется в воде","Вольфрамит слабомагнитный (парамагнитный)"],"answer":3,"explain":"Вольфрамит содержит железо и марганец и поэтому парамагнитен. Шеелит и касситерит практически немагнитны."},{"q":"Почему сырьё РЗЭ часто требует радиационного контроля?","options":["Минералы РЗЭ (например, монацит) часто содержат торий и уран","РЗЭ сами по себе радиоактивны","Из-за высокой температуры переработки","Это требование только китайского законодательства"],"answer":0,"explain":"Монацит содержит торий, многие руды РЗЭ — уран. Это источник природной радиоактивности (NORM) в продуктах и отходах."},{"q":"Кандидат — сильный геолог-разведчик по медно-порфировым месторождениям, 15 лет опыта. Что верно для проекта TMK по вольфрамовым скарнам?","options":["Идеальный кандидат: геология везде одинаковая","Не подходит ни при каких условиях","Подходит, если знает английский","Совпадение только по типу работ; металл и стиль минерализации другие — нужна глубокая проверка релевантности"],"answer":3,"explain":"Три фильтра: металл, стиль, тип работ. Здесь совпадает только тип работ. Кандидат может подойти при наличии смежного опыта (например, скарны в окружении порфировых систем), но это нужно проверить."},{"q":"В каких единицах обычно выражают содержание в литиевых рудах?","options":["г/т Li","% Li₂O","% LCE","мг/л"],"answer":1,"explain":"Для твёрдых руд — % Li₂O (концентрат SC6 = 6% Li₂O). Мг/л используют для рассолов, LCE (эквивалент карбоната лития) — для продукции и рыночных объёмов."},{"q":"Какой тип месторождений связан с идеей TMK извлекать РЗЭ и рений из растворов?","options":["Скарновые вольфрамовые","Россыпи","Медно-порфировые","Песчаниковые урановые, отрабатываемые скважинным подземным выщелачиванием"],"answer":3,"explain":"В песчаниковых урановых месторождениях Кызылкумов вместе с ураном присутствуют рений, РЗЭ и другие элементы. После извлечения урана они остаются в растворах. Об этом соглашение TMK с Solvomet KU Leuven."},{"q":"Почему тонкое переизмельчение (ошламование) особенно опасно для вольфрамовых руд?","options":["Вольфрам окисляется при измельчении","Вольфрамовые минералы хрупкие и уходят в тонкие шламы, которые плохо извлекаются, — растут потери","Шламы взрывоопасны","Это не проблема"],"answer":1,"explain":"Шеелит и вольфрамит хрупкие. Тонкие частицы плохо улавливаются гравитацией и флотацией, поэтому исторически извлечение вольфрама ниже, чем у многих других металлов. Опыт борьбы с потерями в шламах — сильный маркер технолога-обогатителя по вольфраму."}],"html":"<h2>0. Разминка: вспомнить День 1<\/h2>\n<p>Ответьте вслух или письменно <strong>до<\/strong> чтения нового материала. Попытка вспомнить закрепляет знание сильнее, чем повторное чтение.<\/p>\n<ol><li>Назовите звенья цепочки вольфрама от руды до изделия.<\/li><li>Что такое APT и в каких единицах торгуют вольфрамом?<\/li><li>Назовите 3 компании-аналога TMK.<\/li><li>Какие два критерия делают минерал «критическим»?<\/li><li>Почему консультант не всегда подходит на операционную роль?<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Руда → концентрат → APT → оксиды → порошок W → WC → твёрдый сплав → изделие.<\/li><li>Паравольфрамат аммония; цена — в $/mtu WO₃ (1 mtu = 10 кг WO₃).<\/li><li>Plansee Group, Masan High-Tech Materials, Xiamen Tungsten / China Tungsten High-Tech (также Molymet, Ульбинский металлургический завод).<\/li><li>Эко
