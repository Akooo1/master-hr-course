<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Mining &amp; Metallurgy Executive Search Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky status bar + one reading column (max 880px). The dashboard reads like an assay sheet:
   KPI strip, a 28-day activity chain, and a 30-cell grid of days styled as element cells (day number = "atomic number").
   Accent = scheelite under a UV lamp: deep electric blue in light theme, a soft blue glow in dark theme. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF3; --ink:#131820; --ink-2:#4B5665; --ink-3:#6B7684;
  --line:#D6DDE5; --accent:#2B4ACB; --accent-ink:#FFFFFF; --accent-soft:#E4E9FB;
  --ok:#17704A; --ok-soft:#DFF2E8; --warn:#85560D; --warn-soft:#FBEFD9; --bad:#B93A33; --bad-soft:#FBE4E2;
  --glow:none;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#151A21; --surface-2:#1C232C; --ink:#E6EBF1; --ink-2:#A3AEBB; --ink-3:#808B98;
    --line:#29323D; --accent:#8FA3FF; --accent-ink:#0D1015; --accent-soft:#1B2350;
    --ok:#53C892; --ok-soft:#10301F; --warn:#E5B54A; --warn-soft:#33260C; --bad:#F27A72; --bad-soft:#3B1614;
    --glow:0 0 16px rgba(143,163,255,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151A21; --surface-2:#1C232C; --ink:#E6EBF1; --ink-2:#A3AEBB; --ink-3:#808B98;
  --line:#29323D; --accent:#8FA3FF; --accent-ink:#0D1015; --accent-soft:#1B2350;
  --ok:#53C892; --ok-soft:#10301F; --warn:#E5B54A; --warn-soft:#33260C; --bad:#F27A72; --bad-soft:#3B1614;
  --glow:0 0 16px rgba(143,163,255,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.cell-mark{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;font-weight:700;position:relative;flex:none}
.cell-mark small{position:absolute;top:1px;left:3px;font-family:var(--f-mono);font-size:8px;font-weight:600}
.brand-text{font-weight:600;font-size:14px;line-height:1.2}
.brand-text span{display:block;color:var(--ink-3);font-weight:400;font-size:12px}
.status{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs a{flex:none;padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs a:hover{color:var(--ink)}

main{padding-block:20px 120px}
main:focus{outline:none}
h1,h2,h3{text-wrap:balance;line-height:1.25}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.2vw,30px);margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:20px;margin:28px 0 10px}
h3{font-size:17px;margin:22px 0 8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.lede{color:var(--ink-2);margin:0 0 14px;max-width:68ch}
.stack{display:grid;gap:16px}
/* Grid columns must not grow to the min-content width of wide tables or code blocks */
.stack,.quiz,.fc-wrap,.form,.today-hero,.day-head,.lockbox{grid-template-columns:minmax(0,1fr)}
.stack>*,.quiz>*,.day-head>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flat{border:none;background:transparent;padding:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-3)}
.small{font-size:14px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{font-size:13px;padding:5px 10px;min-height:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Alerts */
.alert{border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.alert strong{font-size:16px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert p{margin:0;color:var(--ink)}
.alert ol{margin:4px 0 0;padding-left:20px;color:var(--ink)}

/* Hero (today) */
.today-hero{display:grid;gap:12px}
.today-hero .challenge{background:var(--surface-2);border-radius:6px;padding:12px 14px}
.today-hero .challenge b{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .k{font-size:13px;color:var(--ink-3)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}

/* Activity chain */
.chain{display:grid;grid-template-columns:repeat(28,minmax(0,1fr));gap:3px}
.chain i{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.chain i.on{background:var(--accent);box-shadow:var(--glow)}
.chain i.gap{background:transparent;outline:1.5px dashed var(--warn);outline-offset:-2px}
.chain i.broken{background:var(--bad-soft);outline:1.5px solid var(--bad);outline-offset:-2px}
.chain i.today{outline:2px solid var(--ink);outline-offset:-2px}
.chain-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:8px}
.chain-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--surface-2)}
.chain-legend .l-on::before{background:var(--accent)}
.chain-legend .l-gap::before{background:transparent;outline:1.5px dashed var(--warn);outline-offset:-2px}
.chain-legend .l-broken::before{background:var(--bad-soft);outline:1.5px solid var(--bad);outline-offset:-2px}

/* Day grid — element cells */
.grid30{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dcell{position:relative;display:grid;gap:2px;align-content:start;min-height:92px;padding:8px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.dcell .no{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-3)}
.dcell .sym{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.1}
.dcell .nm{font-size:11px;line-height:1.25;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dcell .sc{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:11px;font-weight:600}
.dcell.open{border-color:var(--accent)}
.dcell.open .sym{color:var(--accent)}
.dcell.current{outline:3px solid var(--accent-soft)}
.dcell.passed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.dcell.passed .no,.dcell.passed .nm,.dcell.passed .sc{color:var(--accent-ink)}
.dcell.locked,.dcell.soon{background:var(--surface-2);border-style:dashed;color:var(--ink-3)}
.dcell.locked .sym,.dcell.soon .sym{color:var(--ink-3)}
.mod-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin:18px 0 8px}
.mod-head h3{margin:0}
.bar-track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent)}

/* Badges */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);font-size:13px;color:var(--ink-3);background:var(--surface)}
.badge.got{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.badge b{font-family:var(--f-mono);font-size:11px}

/* Day view */
.day-head{display:grid;gap:10px}
.day-meta{display:flex;gap:8px;flex-wrap:wrap}
.callout{border-radius:6px;padding:12px 14px;background:var(--surface-2)}
.callout .lbl{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink-2);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checklist li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;background:var(--surface-2)}
.checklist li.done{opacity:.7}
.checklist li.done .ct{text-decoration:line-through}
.checklist input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.checklist .ct{flex:1;min-width:0}
.checklist .tm{flex:none}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:6px}
.subtabs button{appearance:none;border:0;background:none;font:inherit;font-weight:600;font-size:15px;color:var(--ink-3);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;flex:none}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.subtabs .cnt{font-family:var(--f-mono);font-size:12px;margin-left:4px}

/* Rendered course content */
.content{min-width:0}
.content h2{font-size:21px;border-top:1px solid var(--line);padding-top:22px;margin-top:30px}
.content h2:first-child{border-top:0;margin-top:8px;padding-top:0}
.content h3{font-size:17px}
.content p,.content li{max-width:72ch}
.content ul,.content ol{padding-left:22px}
.content li{margin:3px 0}
.content blockquote{margin:14px 0;padding:12px 16px;background:var(--accent-soft);border-radius:6px}
.content blockquote p{margin:6px 0}
.content hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.content code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.content pre.code{background:var(--surface-2);border-radius:6px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.5}
.content pre.code code{background:none;padding:0}
.table-wrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.table-wrap table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.table-wrap th,.table-wrap td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.table-wrap th{background:var(--surface-2);font-weight:600;font-size:13px}
.table-wrap tr:last-child td{border-bottom:0}
details{margin:10px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
details summary{cursor:pointer;padding:8px 12px;font-weight:600;color:var(--accent);list-style-position:inside}
details[open] summary{border-bottom:1px solid var(--line)}
details > :not(summary){margin-left:12px;margin-right:12px}
details > :last-child{margin-bottom:12px}
.task input{vertical-align:-2px}

/* Quiz */
.quiz{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.q .qn{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-bottom:4px}
.q .qt{font-weight:600;margin-bottom:10px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;border:1px solid var(--line);margin-top:6px;cursor:pointer;background:var(--surface)}
.q label:hover{border-color:var(--ink-3)}
.q input{margin-top:4px;accent-color:var(--accent);flex:none}
.q .lt{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);flex:none}
.q label.right{border-color:var(--ok);background:var(--ok-soft)}
.q label.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .ex{margin-top:10px;font-size:14px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.q.is-wrong{border-color:var(--bad)}
.stamp{display:inline-grid;place-items:center;padding:10px 18px;border:3px solid currentColor;border-radius:6px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;transform:rotate(-4deg)}
.stamp.ok{color:var(--ok)}
.stamp.bad{color:var(--bad)}
@media (prefers-reduced-motion: no-preference){ .stamp{animation:stamp .35s ease-out} @keyframes stamp{from{transform:rotate(-4deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}} }

/* Flashcards */
.fc-wrap{display:grid;gap:14px;max-width:620px}
.fc{min-height:220px;display:grid;align-content:center;gap:10px;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:24px 20px}
.fc .side{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fc .term{font-family:var(--f-display);font-size:clamp(18px,4vw,24px);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.fc .answer{font-size:18px;font-weight:600;color:var(--accent);overflow-wrap:anywhere}
.fc .def{color:var(--ink-2);font-size:15px}
.fc .from{font-size:12px;color:var(--ink-3)}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.boxes div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.boxes b{display:block;font-family:var(--f-display);font-size:18px}
.boxes span{font-size:11px;color:var(--ink-3)}

/* Forms */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.err{color:var(--bad);font-size:13px;font-weight:600}

/* Timer pill + toast */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
.timer .t{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.timer .l{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.timer .btn{background:transparent;color:var(--bg);border-color:rgba(127,127,127,.5);min-height:30px;padding:4px 10px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left-width:1px;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:14px;max-width:min(520px,calc(100vw - 32px))}
.sync{font-size:12px;color:var(--ink-3)}
.lockbox{display:grid;gap:10px;justify-items:start}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:520px){
  .bar{position:static}
  .sync{display:none}
  .brand-text span{display:none}
  .kpi .v{font-size:22px}
  .grid30{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .dcell{min-height:80px}
  .dcell .nm{display:none}
}
</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <a class="brand" href="#today" aria-label="На главную">
        <span class="cell-mark" aria-hidden="true"><small>74</small>W</span>
        <span class="brand-text">Mining &amp; Metallurgy Executive Search Academy<span>30 дней · подготовка Executive Search Specialist · TMK</span></span>
      </a>
      <div class="status" id="status"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Разделы">
      <a href="#today">Сегодня</a>
      <a href="#program">Программа</a>
      <a href="#cards">Карточки</a>
      <a href="#journal">Журнал</a>
      <a href="#tmk">TMK</a>
      <a href="#contract">Контракт</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>
<div class="timer" id="timer" hidden aria-live="polite"></div>

<script>
const DATA = {"version":1,"totalDays":30,"modules":[{"n":1,"title":"Mining Industry Fundamentals","from":1,"to":5,"dir":"module-01-mining-fundamentals","ready":true,"goal":"вы понимаете, как устроено современное горнодобывающее предприятие и какие специалисты необходимы на каждом этапе.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов, без подсказок, 20 минут. Порог прохождения — <strong>16 из 20<\/strong>. Не прошли — повторите дни, где были ошибки, и пройдите тест снова через сутки. Модуль 2 открывается после прохождения.<\/p>\n<ol><li>Почему дефицит специалистов растёт от upstream к downstream?<\/li><li>Что такое mtu и сколько это в килограммах WO₃?<\/li><li>Назовите три компании-аналога TMK и объясните, чем каждая похожа.<\/li><li>Какие два критерия делают сырьё критическим?<\/li><li>Чем руда отличается от горной породы?<\/li><li>Назовите главные минералы вольфрама и одно технологическое отличие между ними.<\/li><li>Какой минерал — главный источник рения и как рений из него извлекают (в общих словах)?<\/li><li>Почему сырьё РЗЭ часто требует радиационного контроля?<\/li><li>Назовите три фильтра релевантности геолога.<\/li><li>Чем Measured, Indicated и Inferred отличаются от Proved и Probable?<\/li><li>Ориентировочно сопоставьте категории A+B, C₁, C₂ с CRIRSCO.<\/li><li>Какие требования предъявляются к Competent Person по JORC?<\/li><li>В каком разделе отчёта NI 43-101 искать технологическую схему и зачем рекрутеру этот раздел?<\/li><li>Что такое коэффициент вскрыши и как он влияет на выбор способа добычи?<\/li><li>Назовите систему разработки для неправильных ценных крутых тел и объясните почему.<\/li><li>Что такое СПВ и как оно связано с проектами TMK по РЗЭ и рению?<\/li><li>Чем availability отличается от utilization?<\/li><li>Что такое Operational Readiness и когда нанимают ключевых руководителей эксплуатации?<\/li><li>Почему нельзя переводить «главный инженер» как «Chief Engineer»?<\/li><li>Назовите пять вопросов о масштабе, которые нужно задать любому кандидату-руководителю.<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>Чем глубже передел, тем меньше компаний в мире им владеют и тем закрытее технологии. Горных инженеров — сотни тысяч, технологов APT вне Китая — единицы.<\/li><li>Metric tonne unit; 1 mtu = 10 кг WO₃.<\/li><li>Например: Plansee (W и Mo от порошка до изделий), Masan High-Tech Materials (рудник + химическая переработка W), Xiamen Tungsten / China Tungsten High-Tech (полная цепочка), Molymet (Mo и Re), Ульбинский металлургический завод (редкие металлы, госкомпания в СНГ).<\/li><li>Экономическая важность и высокий риск поставок.<\/li><li>Руда — порода, из которой экономически выгодно извлекать металл при текущих ценах и технологиях.<\/li><li>Шеелит CaWO₄ (немагнитный, светится под УФ, флотация с жирными кислотами) и вольфрамит (Fe,Mn)WO₄ (парамагнитный, тяжелее, гравитация + магнитная сепарация).<\/li><li>Молибденит MoS₂. При окислительном обжиге концентрата рений возгоняется в виде оксида, его улавливают из газов (мокрая очистка), затем извлекают сорбцией или экстракцией в перренат аммония.<\/li><li>Минералы РЗЭ (монацит и др.) содержат торий и уран — природные радионуклиды.<\/li><li>Металл, стиль минерализации, тип работ.<\/li><li>Ресурсы классифицируют по геологической достоверности. Запасы — экономически извлекаемая часть ресурсов Measured и Indicated после учёта модифицирующих факторов.<\/li><li>A+B ≈ Measured (→ Proved), C₁ ≈ Indicated (→ Probable), C₂ ≈ Inferred. Соответствие ориентировочное, пересчёт делает эксперт.<\/li><li>Не менее 5 лет опыта в данном стиле минерализации, типе месторождения и виде работ; членство в признанной профессиональной организации.<\/li><li>Item 17 — Recovery Methods. Показывает, какие процессы нужны (а значит, какой опыт искать) и кто их проектировал.<\/li><li>Количество пустой породы на единицу руды. При слишком высоком коэффициенте выгоднее подземная добыча.<\/li><li>Слоевая выемка с закладкой (cut and fill): максимальная селективность, минимальное разубоживание.<\/li><li>Скважинное подземное выщелачивание: металл добывают раствором через скважины. Растворы урановых месторождений содержат рений и РЗЭ — их TMK планирует извлекать (соглашение с Solvomet KU Leuven).<\/li><li>Availability — доля времени, когда техника исправна. Utilization — доля исправного времени, когда она реально работает.<\/li><li>Найм, обучение и подготовка систем до пуска. Ключевых руководителей — обычно за 12–18 месяцев (и раньше) до пуска.<\/li><li>В СНГ главный инженер — первый заместитель по производству и технологии. На Западе «Chief Engineer» — чаще эксперт, а не руководитель уровня заместителя директора.<\/li><li>Сколько людей в подчинении; какой бюджет; какая производительность и продукция; кому подчинялся; какие решения принимал сам.<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>Перед Модулем 2 договоритесь о 15-минутной встрече с руководителем или инженером TMK и расскажите:<\/p>\n<ol><li>как устроено горное предприятие от разведки до закрытия;<\/li><li>как вы будете планировать найм под вольфрамовый комплекс (по стадиям);<\/li><li>какие три открытия про подбор технических специалистов вы сделали за неделю.<\/li><\/ol>\n<p>Попросите задать вам 3 каверзных вопроса. Где не смогли ответить — там зона повторения.<\/p>"},{"n":2,"title":"Mineral Processing & Metallurgy","from":6,"to":10,"dir":"module-02-processing-metallurgy","ready":true,"goal":"вы понимаете путь «руда → концентрат → металл → изделие» и можете профессионально говорить с обогатителями, гидро- и пирометаллургами и технологами порошковой металлургии TMK. Вы отличаете реальный промышленный опыт от лабораторного и знаете, где искать каждый профиль.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов, без подсказок, 20 минут. Порог прохождения — <strong>16 из 20<\/strong>. Модуль 3 открывается после прохождения.<\/p>\n<ol><li>Чем обогащение отличается от металлургии?<\/li><li>Руда — 0,8% WO₃, концентрат — 65% WO₃, хвосты — 0,12% WO₃. Посчитайте извлечение.<\/li><li>Что такое P80 и раскрытие минералов?<\/li><li>Почему для вольфрама опасно переизмельчение и как с этим борются?<\/li><li>Назовите три класса флотационных реагентов и по одному примеру.<\/li><li>Чем флотация шеелита отличается от флотации медных сульфидов? Что такое процесс Петрова?<\/li><li>Как получают молибденовый концентрат из медно-молибденовой руды?<\/li><li>Почему вольфрамит отделяют от касситерита магнитной сепарацией?<\/li><li>Каким методом обогащают крупный класс сподумена и почему?<\/li><li>Перечислите шаги схемы «вольфрамовый концентрат → APT».<\/li><li>Как извлекают рений и в каком соединении его кристаллизуют?<\/li><li>Что такое HPAL и с каким сырьём он работает?<\/li><li>Назовите шесть уровней шкалы масштаба гидрометаллурга. Какой самый редкий?<\/li><li>Опишите цикл жидкостной экстракции (три стадии).<\/li><li>Почему разделение РЗЭ — «высшая лига» экстракции и какой экстрагент — основа китайских каскадов?<\/li><li>Откуда берутся селен и теллур?<\/li><li>Что означают 3N, 3N5, 5N? Каким методом подтверждают 5N в твёрдом металле?<\/li><li>Опишите путь от порошка W до твёрдосплавной пластины ВК8.<\/li><li>Что происходит при окислительном обжиге молибденита (продукты и попутные компоненты)?<\/li><li>Какие стандарты и процедуры нужны Smart Powder для поставок автодеталей?<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>Обогащение физически разделяет минералы без изменения химического состава; металлургия химически извлекает металл.<\/li><li>R = 65 · (0,8 − 0,12) / [0,8 · (65 − 0,12)] = 44,2 / 51,9 ≈ 85,2%.<\/li><li>P80 — размер, мельче которого 80% массы продукта. Раскрытие — освобождение зёрен ценного минерала от сростков с породой.<\/li><li>Хрупкие W-минералы уходят в шламы, которые плохо улавливаются. Меры: щадящее и стадиальное измельчение, ранний вывод готового класса, тонкая гравитация (центробежные концентраторы), флотация шламов.<\/li><li>Собиратели (ксантогенат, жирные кислоты), пенообразователи (MIBC), депрессоры (жидкое стекло, NaHS); также активаторы и регуляторы среды.<\/li><li>Шеелит — несульфидный (солевой) минерал: жирные кислоты, жидкое стекло, проблема кальцита, флюорита и апатита. Процесс Петрова — доводка чернового концентрата с прогревом и высоким расходом жидкого стекла для десорбции собирателя с кальциевых минералов.<\/li><li>Коллективная Cu–Mo флотация → подавление медных минералов NaHS → флотация молибденита аполярным собирателем → перечистки (часто в колоннах) → Mo-концентрат 45–55% Mo.<\/li><li>Вольфрамит парамагнитен (Fe, Mn), касситерит практически немагнитен.<\/li><li>В тяжёлых средах (DMS): сподумен (≈ 3,1–3,2 г/см³) тяжелее кварца и полевых шпатов (≈ 2,6–2,7).<\/li><li>Разложение (сода или NaOH) → раствор вольфрамата натрия → очистка (Si, P, As, Mo) → экстракция или ионный обмен → вольфрамат аммония → выпарная кристаллизация → APT.<\/li><li>Из газов обжига молибденита (мокрая газоочистка) или растворов (медное производство, СПВ урана) — сорбцией или экстракцией, затем кристаллизуют перренат аммония NH₄ReO₄.<\/li><li>Автоклавное сернокислотное выщелачивание при ≈ 250 °C; никелевые (кобальтовые) латериты.<\/li><li>Лаборатория → укрупнённые испытания → пилот → проектирование → пуск и вывод на мощность → стабильная эксплуатация. Самый редкий — пуск и вывод на мощность.<\/li><li>Экстракция (металл в органику) → промывка (удаление примесей) → реэкстракция (металл в чистый водный раствор).<\/li><li>Соседние РЗЭ почти одинаковы химически, коэффициенты разделения малы, нужны каскады из сотен и тысяч ступеней. Основа — P507 / PC88A.<\/li><li>Из анодного шлама электролитического рафинирования меди.<\/li><li>99,9%; 99,95%; 99,999%. GDMS.<\/li><li>W + сажа → карбидизация → WC → смесь с 8% Co (+ ингибиторы, пластификатор) → размол → распылительная сушка → прессование → жидкофазное спекание (вакуум или sinter-HIP) → шлифовка, покрытия → пластина.<\/li><li>MoS₂ → MoO₃ (технический оксид молибдена) + SO₂ (→ серная кислота); рений возгоняется в виде Re₂O₇ и улавливается в газоочистке.<\/li><li>IATF 16949, процедуры PPAP и APQP; стандарты материалов (например, MPIF Standard 35).<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>До начала Модуля 3 проведите 15–20 минут с технологом TMK (Чирчик или Ингичка):<\/p>\n<ol><li>Объясните одну цепочку TMK от концентрата до продукта.<\/li><li>Попросите оценить точность по шкале 1–10 и исправить ошибки.<\/li><li>Спросите: «Какой профиль специалиста вам сейчас нужнее всего и почему его трудно найти?»<\/li><\/ol>\n<p>Ответ на третий вопрос запишите в профиль TMK (<a href=\"#tmk\">../00-start/tmk-profile.md<\/a>, раздел 5). Это прямой вклад обучения в вашу работу.<\/p>"},{"n":3,"title":"Rare Earth Elements & Critical Minerals","from":11,"to":15,"dir":"module-03-ree-critical-minerals","ready":true,"goal":"вы понимаете цепочку РЗЭ от сырья до магнита, особенности вскрытия, разделения и металлургии РЗЭ, рынки лития, графита, никеля, кобальта и малых металлов. Вы можете описать позиции TMK в этих направлениях и найти для них людей с учётом экспортных и санкционных ограничений.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов, без подсказок, 20 минут. Порог прохождения — <strong>16 из 20<\/strong>. Модуль 4 открывается после прохождения.<\/p>\n<ol><li>Сколько элементов относят к РЗЭ и какие именно?<\/li><li>Какие РЗЭ называют магнитными и зачем нужен каждый?<\/li><li>Почему объём рынка РЗЭ определяют La и Ce, а стоимость — магнитные элементы?<\/li><li>Какие доли Китая (ориентировочно) в добыче, разделении и производстве магнитов?<\/li><li>Какие экспортные ограничения ввёл Китай в 2023 и 2025 гг.?<\/li><li>Назовите пять компаний вне Китая на разных звеньях цепочки РЗЭ.<\/li><li>Какой способ вскрытия применяют для монацита и для концентратов Маунт-Уэлд или Баян-Обо?<\/li><li>Как извлекают РЗЭ из ионно-адсорбционных глин и какие экологические проблемы это создаёт?<\/li><li>Чем особенно извлечение РЗЭ и рения из растворов урановых месторождений?<\/li><li>Что требует радиационная безопасность в РЗЭ-проекте и кто за неё отвечает?<\/li><li>Почему разделение соседних РЗЭ требует длинных каскадов и сколько ступеней бывает на заводе?<\/li><li>Что такое омыление экстрагента и какая с ним экологическая проблема?<\/li><li>Как отделяют церий и европий?<\/li><li>Назовите три признака технолога, который сам вёл каскад разделения.<\/li><li>Как получают металлические Nd/Pr и тяжёлые РЗЭ-металлы?<\/li><li>Перечислите этапы производства спечённого магнита NdFeB.<\/li><li>Что такое зернограничная диффузия и зачем она нужна?<\/li><li>Чем путь сподумен → гидроксид лития отличается от пути рассол → карбонат лития?<\/li><li>Что такое сферический очищенный графит и почему аноды почти полностью производятся в Китае?<\/li><li>Как формируется цена APT и почему переработка твёрдосплавного лома важна для TMK?<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>17: 15 лантаноидов (La–Lu), иттрий и скандий.<\/li><li>Nd и Pr — основа магнитов NdFeB; Dy и Tb — сохранение свойств при нагреве; Sm — магниты SmCo.<\/li><li>La и Ce составляют большую часть массы сырья, но дёшевы; магнитные элементы дороги и определяют стоимость корзины.<\/li><li>Добыча — около двух третей; разделение — около 90%; спечённые магниты — около 90%.<\/li><li>2023 — запрет экспорта технологий извлечения, разделения и производства магнитов; апрель 2025 — лицензирование экспорта семи средних и тяжёлых РЗЭ и магнитов; октябрь 2025 — объявлено расширение, часть мер, по сообщениям, отложена.<\/li><li>Например: Lynas, MP Materials, Iluka, Solvay, Neo Performance Materials, Energy Fuels, Proterial, Shin-Etsu, VAC.<\/li><li>Монацит — щелочное разложение NaOH (или сернокислотный обжиг); Маунт-Уэлд и Баян-Обо — сернокислотный обжиг с водным выщелачиванием.<\/li><li>Солевым раствором (сульфат аммония или магния) — ионный обмен на поверхности глин. Проблемы: аммоний в водах, оползни, загрязнение.<\/li><li>Малые концентрации в огромных объёмах; нужны ионный обмен или экстракция; нельзя вредить основному урановому процессу; радиационная безопасность; рений — ценный попутный компонент.<\/li><li>Лицензии на обращение с NORM, дозиметрия, контроль радона и сбросов, обращение с отходами; Radiation Safety Officer.<\/li><li>Одинаковый заряд и близкие радиусы ионов → малые коэффициенты разделения; десятки ступеней на пару, сотни — более тысячи на заводе.<\/li><li>Частичная нейтрализация кислотного экстрагента для роста ёмкости; аммиачное омыление даёт сточные воды с аммонием.<\/li><li>Церий окисляют до Ce⁴⁺; европий восстанавливают до Eu²⁺.<\/li><li>Называет пары и число ступеней; объясняет профиль концентраций и реакцию на изменение питания; знает потери органики и время выхода на режим; разбирает конкретный сбой.<\/li><li>Nd/Pr — электролиз фторидного расплава с подачей оксида (W или Mo катод); тяжёлые — кальциетермия фторидов.<\/li><li>Плавка и ленточное литьё → водородное охрупчивание → струйный размол → прессование в магнитном поле → вакуумное спекание и отжиг → механообработка → (GBD) → покрытие → намагничивание и контроль.<\/li><li>Введение Dy/Tb по границам зёрен готового магнита: рост коэрцитивной силы при меньшем расходе тяжёлых РЗЭ.<\/li><li>Сподумен: обогащение → декрепитация → сернокислотный обжиг → выщелачивание → очистка → гидроксид или карбонат. Рассол: испарение (или DLE) → концентрат → карбонат.<\/li><li>Сферический графит, очищенный до ≥ 99,95% C (HF, термически или щелочью), с последующим покрытием. Китай доминирует в сфероидизации, очистке и анодах (масштаб, технологии, HF-очистка).<\/li><li>Цену APT формируют оценки ценовых агентств и переговоры ($/mtu WO₃). Лом даёт значительную долю вольфрама и содержит кобальт — источник сырья и отдельный профиль кадров для TMK.<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>До начала Модуля 4 проведите 15–20 минут с экспертом TMK (R&amp;D Park, технолог или руководитель проекта):<\/p>\n<ol><li>Объясните цепочку РЗЭ и почему ранний вход TMK — извлечение из растворов.<\/li><li>Покажите карту критических минералов TMK из Дня 15.<\/li><li>Спросите: «Какие две позиции по критическим минералам вам понадобятся первыми и какой опыт для них обязателен?»<\/li><\/ol>\n<p>Ответ внесите в профиль TMK (<a href=\"#tmk\">../00-start/tmk-profile.md<\/a>, раздел 5).<\/p>"},{"n":4,"title":"Equipment, Laboratory & Production Systems","from":16,"to":20,"dir":"module-04-equipment-lab-production-systems","ready":true,"goal":"вы разбираетесь в технологическом оборудовании и его производителях, методах лабораторного анализа, системах качества, автоматизации, ТОиР и безопасности. Вы можете проверить реальный масштаб опыта кандидата по оборудованию и системам и знаете, кого и когда нанимать для запуска и эксплуатации производств TMK.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов, без подсказок, 20 минут. Порог прохождения — <strong>16 из 20<\/strong>. Модуль 5 открывается после прохождения.<\/p>\n<ol><li>Назовите группы технологического оборудования TMK и по два примера в каждой.<\/li><li>В какой печи восстанавливают оксиды вольфрама и почему это требует особой безопасности?<\/li><li>Что такое sinter-HIP и зачем он в производстве твёрдых сплавов?<\/li><li>Что такое FAT, SAT и долгопоставляемые позиции?<\/li><li>Плюсы и риски сервисного инженера производителя как кандидата на роль владельца.<\/li><li>Какие пять вопросов отвечает аналитическая лаборатория?<\/li><li>Чем ICP-OES отличается от ICP-MS? Какой метод для сертификации 5N–6N?<\/li><li>Что показывают XRD и автоматизированная минералогия?<\/li><li>Почему пробоподготовка — источник половины ошибок? Приведите пример загрязнения.<\/li><li>Чем QA отличается от QC? Назовите три инструмента QC.<\/li><li>Назовите пять требований ISO/IEC 17025.<\/li><li>Что такое проверка квалификации и z-оценка?<\/li><li>Что такое арбитражный анализ и сертификат анализа?<\/li><li>Опишите пять уровней пирамиды автоматизации с примерами систем.<\/li><li>Чем RCM отличается от ППР?<\/li><li>Что такое OEE, MTBF, MTTR?<\/li><li>Чем процессная безопасность отличается от охраны труда?<\/li><li>Что такое HAZOP, LOPA, SIL, MOC?<\/li><li>Какие требования ESG и прослеживаемости важны для экспорта и финансирования TMK?<\/li><li>Каких специалистов по безопасности и ESG нужно нанять до пуска TMK Chemicals и почему?<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>Рудоподготовка и обогащение (мельницы, флотомашины); гидрометаллургия (реакторы, автоклавы); пирометаллургия (вращающиеся печи, толкательные печи восстановления); порошковая металлургия (прессы, вакуумные печи); химическое производство (контактные аппараты, абсорберы); транспорт материалов (насосы, конвейеры); инфраструктура (водородные станции, подстанции).<\/li><li>В толкательной (проходной) печи в токе водорода; водород взрывоопасен — нужны системы безопасности, контроль, процедуры.<\/li><li>Спекание с газостатическим уплотнением в одной печи; даёт практически беспористый твёрдый сплав.<\/li><li>FAT — испытания у изготовителя; SAT — на площадке после монтажа; long-lead items — позиции с долгим сроком изготовления, определяющие график проекта.<\/li><li>Плюсы: видел много площадок, глубоко знает оборудование. Риски: позиция поставщика, нет ответственности за KPI завода, знает одного производителя.<\/li><li>Сколько? В какой форме? Как распределено? Какие свойства? Можно ли доверять результату?<\/li><li>ICP-OES — многоэлементный анализ растворов (% … ppm); ICP-MS — следы, РЗЭ, изотопы (ppm … ppt). Для 5N–6N — GDMS.<\/li><li>XRD — кристаллические фазы и их количество; автоматизированная минералогия — минеральный состав, раскрытие, ассоциации, причины потерь.<\/li><li>Ошибки отбора, сокращения и загрязнения не исправит ни один прибор. Пример: истирание вольфрамовых проб в чашах из карбида вольфрама.<\/li><li>QC — проверка конкретных результатов; QA — система надёжности процесса. QC: стандартные образцы, холостые пробы, дубликаты, контрольные карты.<\/li><li>Беспристрастность, компетентность персонала, валидация методик, неопределённость, прослеживаемость, участие в PT, управление оборудованием и записями, внутренние аудиты.<\/li><li>Внешняя проверка лаборатории сравнением с другими; z-оценка: |z| ≤ 2 удовлетворительно, &gt; 3 — неудовлетворительно.<\/li><li>При расхождении анализов продавца и покупателя пробу анализирует независимая лаборатория, её результат обязателен. Сертификат анализа (CoA) — документ о составе партии.<\/li><li>0 — датчики и механизмы; 1 — ПЛК; 2 — DCS, SCADA, APC; 3 — MES, LIMS, историк данных, ТОиР; 4 — ERP.<\/li><li>ППР — ремонты по графику; RCM — выбор стратегии для каждой единицы по последствиям отказов.<\/li><li>OEE = готовность × производительность × качество; MTBF — наработка на отказ; MTTR — среднее время восстановления.<\/li><li>Охрана труда — травмы и профзаболевания работников; процессная безопасность — предотвращение крупных аварий (пожары, взрывы, выбросы). Низкий LTIFR не гарантирует отсутствия крупной аварии.<\/li><li>HAZOP — разбор отклонений процесса; LOPA — анализ слоёв защиты; SIL — уровень полноты безопасности ПАЗ; MOC — анализ рисков любых изменений.<\/li><li>Стандарты IFC и Принципы экватора (банки), GRI/ISSB (отчётность), ICMM, IRMA, The Copper Mark, RMI RMAP и шаблоны CMRT/EMRT, OECD Due Diligence, экспортный контроль.<\/li><li>Инженер по процессной безопасности (HAZOP, LOPA, SIL), руководитель HSE, инженер ПАЗ и КИПиА, эколог (выбросы SO₂, разрешения). Нанимать до пуска: участие в HAZOP проекта, процедуры, обучение.<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>До начала Модуля 5 проведите 15–20 минут с руководителем лаборатории, главным механиком или специалистом по охране труда TMK:<\/p>\n<ol><li>Покажите карту компетенций по безопасности и ESG (День 20).<\/li><li>Спросите: «Какие роли, по вашему опыту, нанимают слишком поздно и чем это обходится?»<\/li><li>Запишите ответ в профиль TMK (<a href=\"#tmk\">../00-start/tmk-profile.md<\/a>, раздел 5).<\/li><\/ol>"},{"n":5,"title":"Technical Recruitment & Talent Intelligence","from":21,"to":25,"dir":"module-05-technical-recruitment-talent-intelligence","ready":true,"goal":"вы самостоятельно анализируете технические вакансии и формируете профили компетенций, строите карты талантов и компании-доноры, находите кандидатов на международном рынке (включая скрытых — через патенты, публикации, конференции), ведёте кандидата до выхода на работу и управляете проектом поиска с метриками и отчётностью.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов, без подсказок, 20 минут. Порог прохождения — <strong>16 из 20<\/strong>. Модуль 6 открывается после прохождения.<\/p>\n<ol><li>Назовите восемь блоков брифинга с нанимающим менеджером.<\/li><li>Назовите пять измерений технической роли и приведите пример для технолога APT.<\/li><li>Чем профиль успеха отличается от должностной инструкции? Приведите пример результата.<\/li><li>Что такое оценочная карта и шкала BARS?<\/li><li>Пять типичных ошибок брифинга и как их исправить.<\/li><li>Какой вопрос в конце брифинга выявляет скрытые требования?<\/li><li>Что входит в карту талантов?<\/li><li>Шесть критериев выбора компании-донора.<\/li><li>Что такое три кольца карты? Приведите пример компании в каждом кольце для технолога APT.<\/li><li>Как оценить размер реального пула кандидатов?<\/li><li>Какие сигналы рынка открывают доступ к кандидатам, а какие говорят о трудном поиске?<\/li><li>Приведите Boolean-строку для поиска технолога твёрдых сплавов на LinkedIn.<\/li><li>Как искать кандидатов по патентам? Назовите два кода CPC, относящихся к TMK.<\/li><li>Формула первого сообщения кандидату.<\/li><li>Факторы «от» и «к»: по три примера.<\/li><li>Какие элементы входят в пакет экспата?<\/li><li>Как подготовить кандидата к контрпредложению?<\/li><li>Девять этапов проекта поиска.<\/li><li>Что входит в еженедельный отчёт заказчику?<\/li><li>Из чего состоит пайплайн талантов для 120 проектов TMK?<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>Бизнес-контекст; результаты; масштаб; обязательный опыт (must-have / trainable); окружение; условия; процесс решения; рынок и риски.<\/li><li>Металл, процесс, стадия, масштаб, уровень. Пример: вольфрам; разложение, очистка от Mo, экстракция или ионный обмен, кристаллизация; пуск; сотни–тысячи тонн APT в год; руководитель передела.<\/li><li>Профиль успеха описывает результаты. Пример: «за 6 месяцев вывести линию APT на 80% проектной мощности при чистоте по спецификации».<\/li><li>6–8 критериев с весами и шкалой 1–5, где каждый уровень описан поведением или опытом.<\/li><li>«Такого же, как Иванов» → будущие результаты; «единорог» → приоритизация и данные; обязанности → результаты; нет владельца решения → зафиксировать; скрытые требования → вопрос в конце.<\/li><li>«Что заставит вас отказать сильному кандидату?»<\/li><li>Целевые компании, структура подразделений, имена, размер пула, рыночные сигналы, конкуренты за таланты.<\/li><li>Процесс, масштаб, стадия, стандарты, культура и язык, досягаемость.<\/li><li>Кольцо 1 — прямые аналоги (Masan High-Tech Materials, H.C. Starck Tungsten); кольцо 2 — смежные процессы (Molymet, гидрометаллургия урана); кольцо 3 — переносимые отрасли (химия, коммерческие лаборатории).<\/li><li>Компании с переделом × люди на уровне → минус недосягаемые и несовместимые → ожидаемая конверсия в интерес → кандидаты в шорт-листе.<\/li><li>Доступ: закрытия, сокращения, слияния, завершение проектов. Трудный поиск: повышение зарплат, удерживающие бонусы, договорные ограничения.<\/li><li>Например: <code>(\"cemented carbide\" OR hardmetal OR \"tungsten carbide\" OR \"твёрдые сплавы\") AND (sintering OR \"sinter-HIP\" OR pressing) AND (engineer OR technologist OR manager OR технолог)<\/code>.<\/li><li>Запрос по коду CPC + ключевые слова + период → изобретатели → аффилиация → LinkedIn, публикации. Коды: C22B 34/36 (вольфрам), C22B 59 (РЗЭ), C22C 29 (твёрдые сплавы), B22F (порошковая металлургия), C01G 41 (соединения вольфрама).<\/li><li>Почему именно вы → задача на его языке → почему интересно → честная рамка → маленький шаг.<\/li><li>«От»: застой, сокращения, конфликт с руководством. «К»: масштаб задачи, полномочия, вознаграждение, близость к дому.<\/li><li>Оклад, надбавка за удалённость, бонус, жильё, перелёты, медстраховка, обучение детей, налоги, релокационный пакет, разрешения на работу, удержание.<\/li><li>Заранее обсудить, что он ответит, и напомнить о его причинах ухода; деньги редко решают факторы «от».<\/li><li>Брифинг и профиль; стратегия и карта; поиск и выход; скрининг и оценка; шорт-лист; интервью заказчика; рекомендации и оффер; срок уведомления и выход; адаптация.<\/li><li>Статус; воронка в цифрах; ключевые кандидаты; что узнали о рынке; решения, нужные от заказчика; план на неделю.<\/li><li>Карты по семействам ролей, сообщество кандидатов, план волн найма по стадиям проектов, внутренние преемники, студенты и дуальное обучение, соотечественники, бренд работодателя.<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>До начала Модуля 6 проведите 15–20 минут с руководителем HR или нанимающим менеджером TMK:<\/p>\n<ol><li>Покажите стратегию поиска из Дня 25.<\/li><li>Предложите запустить по ней одну реальную вакансию с еженедельным отчётом.<\/li><li>Спросите: «Какой информации вам обычно не хватает от подбора, чтобы быстрее принимать решения?»<\/li><\/ol>\n<p>Ответ внесите в профиль TMK (<a href=\"#tmk\">../00-start/tmk-profile.md<\/a>, раздел 5).<\/p>"},{"n":6,"title":"Technical Screening, Assessment & Stakeholder Management","from":26,"to":30,"dir":"module-06-screening-assessment-stakeholders","ready":true,"goal":"вы проводите структурированный технический скрининг, отличаете реальный технологический опыт от поверхностного, оцениваете релевантность международного опыта для проектов TMK, профессионально взаимодействуете с техническими директорами, главными инженерами, учёными и руководителями проектов и ведёте полный цикл Executive Search.","testHtml":"<p><strong>Правила:<\/strong> 20 вопросов по всей программе, без подсказок, 25 минут. Порог прохождения — <strong>16 из 20<\/strong>. После прохождения программа считается завершённой (при выполненных финальном проекте и teach-back).<\/p>\n<ol><li>Объясните цепочку «недра → концентрат → металл → изделие» на примере вольфрама TMK и где растёт дефицит специалистов.<\/li><li>Почему геолога оценивают по трём фильтрам? Назовите их.<\/li><li>Чем ресурсы отличаются от запасов и как ГКЗ соотносится с JORC (ориентировочно)?<\/li><li>Почему для вольфрамовых скарнов характерны селективные системы подземной разработки?<\/li><li>Почему нельзя переводить «главный инженер» как «Chief Engineer»?<\/li><li>Посчитайте извлечение: f = 0,6% WO₃, c = 65% WO₃, t = 0,1% WO₃.<\/li><li>Чем флотация шеелита отличается от флотации медных сульфидов?<\/li><li>Опишите путь «концентрат → APT → W → WC → ВК8» и назовите две роли на этом пути.<\/li><li>Почему ранний вход TMK в РЗЭ — извлечение из растворов, и какой опыт для этого нужен?<\/li><li>Почему разделение РЗЭ — дефицитная экспертиза и какие юридические риски есть при найме из Китая?<\/li><li>Чем процессная безопасность отличается от охраны труда и какие методы ей нужны?<\/li><li>Зачем лаборатории, продающей услуги, аккредитация по ISO/IEC 17025?<\/li><li>Пять измерений технической роли и профиль успеха: приведите пример для одной роли TMK.<\/li><li>Как построить карту талантов в три кольца и оценить размер реального пула?<\/li><li>Как найти кандидатов, которых не видят конкуренты?<\/li><li>Формула первого сообщения и главный вопрос о мотивации.<\/li><li>Метод воронки и «правило двух уровней».<\/li><li>Пять признаков реального опыта и пять — поверхностного.<\/li><li>Восемь измерений переноса международного опыта; как писать вывод для заказчика.<\/li><li>Формула возражения заказчику на данных; приведите пример.<\/li><\/ol>\n<details><summary>Ключ (смотреть после попытки)<\/summary>\n<ol><li>Руда (0,2–1% WO₃) → концентрат (65% WO₃) → APT → оксиды → порошок W → WC → твёрдый сплав ВК8 → инструмент. Дефицит растёт к downstream: технологов APT и твёрдых сплавов вне Китая мало.<\/li><li>Металл, стиль минерализации, тип работ — опыт переносится не автоматически (это заложено и в требованиях JORC к Competent Person).<\/li><li>Запасы — экономически извлекаемая часть ресурсов Measured и Indicated после учёта модифицирующих факторов. A+B ≈ Measured, C₁ ≈ Indicated, C₂ ≈ Inferred (ориентировочно).<\/li><li>Неправильные крутые залежи с изменчивым содержанием: нужно минимизировать разубоживание и потери (слоевая выемка с закладкой, подэтажная отбойка с закладкой).<\/li><li>В СНГ главный инженер — первый заместитель по производству и технологии; на Западе Chief Engineer — чаще эксперт.<\/li><li>R = 65 · (0,6 − 0,1) / [0,6 · (65 − 0,1)] = 32,5 / 38,94 ≈ 83,5%.<\/li><li>Шеелит — несульфидный кальциевый минерал: жирные кислоты, жидкое стекло, проблема кальцита, флюорита, апатита, процесс Петрова. Сульфиды — ксантогенаты, известь.<\/li><li>Разложение (сода или NaOH) → очистка от Mo → экстракция или ионный обмен → кристаллизация APT → прокалка → восстановление водородом → порошок W → карбидизация → смесь с Co → прессование → жидкофазное спекание → шлифовка. Роли: технолог гидрометаллургии APT, технолог восстановления порошков, технолог твёрдых сплавов, инженер по качеству.<\/li><li>Соглашение с Solvomet KU Leuven; малые концентрации в больших объёмах растворов урановых месторождений. Нужен опыт сорбции и экстракции на больших потоках (СПВ урана), пилотных установок, радиационной безопасности, извлечения рения.<\/li><li>Соседние РЗЭ почти одинаковы, каскады из сотен ступеней, технологии сконцентрированы в Китае. Китай запрещает экспорт технологий извлечения и разделения РЗЭ — найм требует юридической оценки рисков передачи технологий.<\/li><li>Процессная безопасность предотвращает крупные аварии (пожары, взрывы, выбросы); охрана труда — травмы работников. Методы: HAZID, HAZOP, LOPA, SIL, MOC, ПАЗ.<\/li><li>Подтверждает компетентность и достоверность результатов; без признанной аккредитации клиенты и покупатели могут не принимать результаты.<\/li><li>Металл, процесс, стадия, масштаб, уровень. Пример: главный технолог APT — вольфрам; разложение, очистка, ионный обмен, кристаллизация; пуск; сотни–тысячи тонн в год; руководитель передела. Результат: «за 6 месяцев вывести линию на 80% мощности при чистоте по спецификации».<\/li><li>Кольцо 1 — прямые аналоги по процессу, 2 — смежные процессы, 3 — переносимые отрасли. Пул: компании × люди на уровне → минус недосягаемые и несовместимые → ожидаемая конверсия.<\/li><li>Патенты (изобретатели, коды CPC), публикации (авторы из компаний), программы конференций, технические отчёты NI 43-101 / JORC, рекомендации, бывшие сотрудники закрытых производств.<\/li><li>Почему именно вы → задача на его языке → почему интересно → честная рамка → маленький шаг. «Что должно измениться в вашей работе, чтобы вы серьёзно рассмотрели переход?»<\/li><li>От общего к конкретному, к личной роли, деталям, цифрам, причинам и урокам; практик отвечает на 2–3 уровня вглубь, поверхностный кандидат обрывается на втором.<\/li><li>Реальный: цифры «было → стало», диапазоны, компромиссы, провалы и уроки, естественный язык, границы знания, связи подразделений. Поверхностный: модные слова, «мы» вместо «я», широта без глубины, обрыв на втором уровне, только позитив, несогласованные цифры.<\/li><li>Технология, масштаб, стадия, стандарты, ресурсы, команда, язык и культура, принятие решений. Вывод: рекомендация по роли, что переносится, пробелы, меры поддержки, риски удержания.<\/li><li>Признать цель → показать данные → предложить варианты → попросить решение. Пример: срок «за месяц» при пуле в 10 досягаемых человек → три варианта (срок 4–5 месяцев; технолог + временный эксперт на пуск; временный эксперт сейчас + постоянный поиск).<\/li><\/ol>\n<\/details>\n<hr>","teachHtml":"<p>Проведите 20–30 минут с руководителем HR или нанимающим менеджером TMK:<\/p>\n<ol><li>Защитите финальный проект (День 30) и попросите оценить его по таблице критериев.<\/li><li>Договоритесь, какую реальную вакансию вы ведёте по этому пакету следующей.<\/li><li>Спросите: «Что мне развивать в первую очередь, чтобы стать для вас экспертом по подбору технических специалистов?»<\/li><\/ol>\n<p>Ответ внесите в личный план развития на 90 дней.<\/p>"}],"days":[{"n":1,"module":1,"title":"Мировая горно-металлургическая отрасль: структура, игроки, место TMK","file":"module-01-mining-fundamentals/day-01-global-mining-industry.md","duration":"3,5 часа","challenge":"К вечеру у вас должна быть первая версия <strong>карты компаний-доноров для TMK<\/strong>: 20 компаний, 5 архетипов, по каждой — какие роли там искать.","why":"В ближайшие годы TMK запускает больше сотни проектов. Тех немногих специалистов по вольфраму, молибдену, рению и РЗЭ вне Китая одновременно ищут компании из США, ЕС, Кореи, Японии и Австралии. Рекрутер, который знает отраслевую карту, звонит нужному человеку раньше конкурентов. Сегодня вы рисуете эту карту.","checklist":[{"text":"Входной тест: 10 вопросов, без подсказок (10 мин). Результат записать в журнал прогресса","minutes":10},{"text":"Теория: блоки 1.1–1.6 (90 мин)","minutes":90},{"text":"Термины: 30 карточек RU↔EN (25 мин)","minutes":25},{"text":"Взгляд Executive Search (35 мин)","minutes":35},{"text":"Практика: карта доноров, 20 компаний (40 мин)","minutes":40},{"text":"Тест дня ≥ 8/10 (15 мин)","minutes":15},{"text":"Рефлексия и обязательство на завтра (5 мин)","minutes":5}],"minVersion":"входной тест → блоки 1.1, 1.2 и 1.5 → тест дня. Подходит, если сегодня нет 3,5 часа; полная версия догоняется в выходной. Главное правило академии — <strong>никогда не пропускать два дня подряд<\/strong>.","terms":[{"ru":"Горнодобывающая промышленность","en":"Mining industry","def":"Отрасль добычи твёрдых полезных ископаемых"},{"ru":"Горно-металлургический комбинат (ГМК)","en":"Mining and metallurgical complex","def":"Интегрированное предприятие: добыча, обогащение и металлургия"},{"ru":"Цепочка создания стоимости","en":"Value chain","def":"Последовательность переделов от недр до изделия"},{"ru":"Передел","en":"Processing stage / conversion step","def":"Отдельная стадия переработки сырья"},{"ru":"Добыча","en":"Mining / extraction","def":"Извлечение руды из недр"},{"ru":"Обогащение","en":"Mineral processing / beneficiation","def":"Повышение содержания ценного минерала в продукте"},{"ru":"Концентрат","en":"Concentrate","def":"Продукт обогащения с высоким содержанием ценного компонента"},{"ru":"Рафинирование","en":"Refining","def":"Очистка металла от примесей до заданной чистоты"},{"ru":"Полуфабрикат","en":"Semi-finished product / mill product","def":"Прутки, листы, проволока, порошки для дальнейшей обработки"},{"ru":"Критическое сырьё","en":"Critical raw materials (CRM)","def":"Экономически важное сырьё с высоким риском поставок"},{"ru":"Малые металлы","en":"Minor metals","def":"Металлы с небольшим рынком без биржевой торговли (W, Mo, Re, In и др.)"},{"ru":"Тугоплавкие металлы","en":"Refractory metals","def":"W, Mo, Ta, Nb, Re: металлы с очень высокой температурой плавления"},{"ru":"Редкоземельные элементы (РЗЭ)","en":"Rare earth elements (REE)","def":"15 лантаноидов, плюс иттрий и скандий"},{"ru":"Мейджор","en":"Major (mining major)","def":"Крупнейшая диверсифицированная горнодобывающая компания"},{"ru":"Юниор","en":"Junior (exploration company)","def":"Небольшая компания на стадии разведки или развития проекта"},{"ru":"Компания среднего размера","en":"Mid-tier producer","def":"Производитель среднего масштаба"},{"ru":"Государственная компания","en":"State-owned enterprise (SOE)","def":"Компания под контролем государства"},{"ru":"Трейдер","en":"Trader / trading house","def":"Покупает и продаёт сырьё и металлы, финансирует поставки"},{"ru":"EPCM-подрядчик","en":"EPCM contractor","def":"Проектирует, закупает и управляет строительством от имени владельца"},{"ru":"Производитель оборудования","en":"OEM (Original Equipment Manufacturer)","def":"Производитель техники (Caterpillar, Metso и др.)"},{"ru":"Офтейк-контракт","en":"Offtake agreement","def":"Долгосрочный договор на покупку будущей продукции"},{"ru":"Капитальные затраты","en":"CAPEX (capital expenditure)","def":"Затраты на строительство и оборудование"},{"ru":"Операционные затраты","en":"OPEX (operating expenditure)","def":"Затраты на эксплуатацию"},{"ru":"Полная себестоимость поддержания","en":"AISC (all-in sustaining cost)","def":"Себестоимость с учётом поддерживающих капзатрат"},{"ru":"Кривая затрат","en":"Cost curve","def":"Ранжирование производителей по себестоимости"},{"ru":"Метрическая тонна-единица","en":"mtu (metric tonne unit)","def":"10 кг WO₃; единица цены вольфрамовых продуктов"},{"ru":"Паравольфрамат аммония","en":"APT (ammonium paratungstate)","def":"Ключевой промежуточный продукт вольфрамовой цепочки; по его цене считают остальные"},{"ru":"Сырьевой цикл","en":"Commodity cycle","def":"Волнообразные колебания цен и инвестиций"},{"ru":"Социальная лицензия","en":"Social licence to operate","def":"Согласие местного сообщества на работу предприятия"},{"ru":"Прослеживаемость цепочки поставок","en":"Supply chain traceability / due diligence","def":"Подтверждение происхождения сырья и ответственной добычи"},{"ru":"Импортозамещение","en":"Import substitution","def":"Замена импортной продукции собственной"},{"ru":"Конечные отрасли","en":"End-use sectors / end markets","def":"Отрасли-потребители металла"}],"quiz":[{"q":"Какое утверждение о цепочке создания стоимости верно?","options":["Дефицит специалистов, как правило, растёт от upstream к downstream","Количество специалистов в мире растёт от upstream к downstream","Добавленная стоимость максимальна на стадии добычи руды","Downstream — это геологоразведка"],"answer":0,"explain":"Горных инженеров в мире очень много, а технологов, которые запускали, например, производство APT вне Китая, — единицы. Добавленная стоимость, наоборот, растёт к downstream."},{"q":"Что такое mtu в торговле вольфрамом?","options":["1 тонна вольфрамового концентрата","1 кг металлического вольфрама","100 кг APT","10 кг WO₃"],"answer":3,"explain":"Metric tonne unit = 1% от метрической тонны = 10 кг WO₃. Цена APT указывается в $/mtu WO₃."},{"q":"Какая компания — ближайший мировой аналог TMK по модели?","options":["Plansee Group","Caterpillar","Trafigura","SRK Consulting"],"answer":0,"explain":"Plansee — интегрированная группа по вольфраму и молибдену: порошки, полуфабрикаты, твёрдые сплавы (через Ceratizit). Caterpillar — производитель оборудования, Trafigura — трейдер, SRK — консультант."},{"q":"Кандидат 10 лет работал в консалтинговой компании и писал отчёты по оценке ресурсов. Главный риск для роли начальника рудника:","options":["Не знает геологию и методы оценки ресурсов на нужном уровне","Не сможет работать на английском с иностранными партнёрами","Слишком мало работал, чтобы руководить крупным коллективом","Нет опыта ответственности за производственные KPI на площадке"],"answer":3,"explain":"Консультант видит много проектов, но не отвечает ежедневно за тонны, безопасность и людей. Для операционной роли это ключевой пробел, который нужно проверить."},{"q":"Почему кобальт важен для вольфрамовой цепочки TMK?","options":["Кобальт добывают вместе с вольфрамом на Ингичке","Кобальт — связка в твёрдых сплавах WC–Co (например, ВК8)","Кобальт используют как депрессор кальцита при флотации шеелита","Связи нет"],"answer":1,"explain":"В твёрдом сплаве зёрна карбида вольфрама связаны кобальтом. Цифра в марке ВК8 — это процент кобальта."},{"q":"Какое событие — лучший триггер для начала поиска кандидатов?","options":["Рекордная прибыль конкурента по итогам прошлого года","Публикация годового отчёта компании-донора с планами","Отраслевая выставка, где собираются все крупные игроки и их руководители","Приостановка рудника или проекта у потенциальной компании-донора"],"answer":3,"explain":"При остановке производства освобождаются целые команды, люди открыты к предложениям. Пример — приостановка Nickel West компанией BHP в 2024 г."},{"q":"Что из перечисленного — стандарт ответственных цепочек поставок, по которому TMK получила статус в 2026 г.?","options":["JORC","RMI RMAP","GISTM","ISO 9001"],"answer":1,"explain":"RMAP (Responsible Minerals Assurance Process) — программа аудита плавильных и перерабатывающих предприятий в рамках Responsible Minerals Initiative. Вольфрам входит в группу 3TG."},{"q":"Как формируется цена на вольфрам (APT)?","options":["Оценками ценовых агентств и прямыми переговорами, вне биржи","Котировками Лондонской биржи металлов (LME) по итогам торгов","Ежегодно устанавливается правительством Китая для всего мира","По цене на медь"],"answer":0,"explain":"Вольфрам — малый металл без биржевой торговли. Ориентиры дают ценовые агентства (Fastmarkets, Argus и др.), сделки заключаются напрямую."},{"q":"Сколько в среднем занимает путь от открытия месторождения до начала добычи (оценка МЭА)?","options":["1–2 года","4–5 лет","Около 16 лет","40 лет"],"answer":2,"explain":"Поэтому кадровое планирование в горной отрасли идёт на годы вперёд, а опыт «довести проект до пуска» особенно ценен."},{"q":"Что значит «критический минерал»?","options":["Экономически важный минерал с высоким риском перебоев в поставках","Минерал, опасный для здоровья при добыче и переработке","Любой минерал, который добывают или перерабатывают в Китае","Минерал с самой высокой ценой на мировом рынке за тонну"],"answer":0,"explain":"Два критерия: экономическая важность и риск поставок. Цена сама по себе не делает минерал критическим."}],"html":"<h2>0. Входной тест (до чтения теории)<\/h2>\n<p>Ответьте письменно, <strong>не подглядывая<\/strong>. Неправильные ответы — это нормально. Это точка отсчёта: на 10-й день вы пройдёте этот тест снова и увидите разницу.<\/p>\n<ol><li>Чем руда отличается от горной породы?<\/li><li>Что такое концентрат и чем он отличается от металла?<\/li><li>Назовите три крупнейшие диверсифицированные горнодобывающие компании мира.<\/li><li>Что делает EPCM-подрядчик?<\/li><li>Почему вольфрам считается критическим металлом?<\/li><li>Чем «юниор» отличается от «мейджора»?<\/li><li>Что такое offtake-контракт?<\/li><li>Что такое JORC?<\/li><li>Какую долю мировой добычи вольфрама даёт Китай: 30%, 50% или 80%?<\/li><li>Кто в горной компании отвечает за то, чтобы руда стала концентратом?<\/li><\/ol>\n<details><summary>Ответы (смотреть после попытки)<\/summary>\n<ol><li>Руда — это порода, из которой <strong>экономически выгодно<\/strong> извлекать металл при текущих ценах и технологиях. Руда — понятие экономическое.<\/li><li>Концентрат — продукт обогащения с повышенным содержанием ценного минерала (например, 65% WO₃). Металл получают из концентрата металлургическими переделами.<\/li><li>Например: BHP, Rio Tinto, Glencore (также Anglo American, Vale).<\/li><li>EPCM — Engineering, Procurement, Construction Management: проектирует, закупает и управляет строительством от имени владельца. Риск стоимости остаётся у владельца.<\/li><li>Высокая экономическая важность (твёрдые сплавы, оборона, электроника) при высоком риске поставок: около 80% добычи — Китай, плюс экспортный контроль с 2025 г.<\/li><li>Юниор — небольшая компания на стадии разведки или развития, без собственной добычи. Мейджор — крупная диверсифицированная добывающая компания.<\/li><li>Долгосрочный договор на покупку будущей продукции проекта. Часто нужен для получения финансирования.<\/li><li>Австралазийский кодекс публичной отчётности о результатах разведки, минеральных ресурсах и рудных запасах.<\/li><li>Около 80% (≈ 67 из 85 тыс. т в 2025 г.).<\/li><li>Обогатительная фабрика (Processing Plant): начальник фабрики, технологи-обогатители (в западной терминологии — metallurgists).<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория<\/h2>\n<h3>1.1 Цепочка создания стоимости: от недр до изделия<\/h3>\n<p>Любой металл проходит одну и ту же цепочку. На каждом шаге меняются продукт, технологии, компании и люди.<\/p>\n<pre class=\"code\"><code>UPSTREAM (сырьё)                MIDSTREAM (металл)                  DOWNSTREAM (изделие)\nГеологоразведка → Проект →      Металлургия → Рафинирование →       Полуфабрикаты → Изделия →\nСтроительство → Добыча →        Химические соединения               Конечные отрасли\nОбогащение → КОНЦЕНТРАТ                                              + Переработка вторсырья (recycling)<\/code><\/pre>\n<p>Пример цепочки для вольфрама, ключевого металла TMK:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Передел<\/th><th>Продукт<\/th><th>Типичное содержание<\/th><th>Кто это делает<\/th><\/tr><\/thead><tbody><tr><td>Добыча<\/td><td>Руда<\/td><td>0,2–1% WO₃<\/td><td>Горняки, геологи, взрывники, механики<\/td><\/tr><tr><td>Обогащение<\/td><td>Вольфрамовый концентрат (шеелитовый или вольфрамитовый)<\/td><td>50–70% WO₃ (торговый стандарт — 65%)<\/td><td>Технологи-обогатители (metallurgists)<\/td><\/tr><tr><td>Гидрометаллургия<\/td><td>Паравольфрамат аммония (APT)<\/td><td>≈ 88,5% WO₃, высокая чистота<\/td><td>Химики-технологи, гидрометаллурги<\/td><\/tr><tr><td>Термическая обработка и восстановление<\/td><td>Оксиды вольфрама → порошок W → карбид вольфрама WC<\/td><td>99,9%+<\/td><td>Металлурги, специалисты по порошкам<\/td><\/tr><tr><td>Порошковая металлургия<\/td><td>Твёрдый сплав (WC–Co), штабики, проволока<\/td><td>—<\/td><td>Технологи порошковой металлургии, инженеры по качеству<\/td><\/tr><tr><td>Изделие<\/td><td>Режущие пластины, буровые коронки, фрезы, электроды<\/td><td>—<\/td><td>Конструкторы, технологи, продажи<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Три закона цепочки, которые нужно запомнить:<\/strong><\/p>\n<ol><li><strong>Стоимость растёт на каждом переделе.<\/strong> Тонна концентрата стоит дешевле тонны APT, а та — дешевле тонны твёрдосплавных пластин. Поэтому стратегия TMK «месторождение — металл — рынок» — это стратегия удержания добавленной стоимости внутри страны. В TMK говорят, что дообогащение вольфрамового концентрата позволяет удвоить добавленную стоимость.<\/li><li><strong>Чем дальше по цепочке, тем меньше людей в мире умеют это делать.<\/strong> Горных инженеров — сотни тысяч. Технологов, которые запускали производство APT вне Китая, — единицы. Для подбора это главный закон: <strong>дефицит растёт к downstream<\/strong>.<\/li><li><strong>На каждом переделе свой язык.<\/strong> Геолог думает в «% WO₃ и тоннах руды», обогатитель — в «извлечении и качестве концентрата», металлург — в «примесях и чистоте», продавец — в «$/mtu и спецификациях». Рекрутер должен переключаться между этими языками.<\/li><\/ol>\n<blockquote><p><strong>TMK:<\/strong> на сайте компании цепочка описана так: upstream — добыча и концентраты, midstream — производство металлов, downstream — готовые изделия. У TMK есть все три звена: Ингичка (концентрат) → Чирчик (металл, твёрдые сплавы) → Smart Powder и изделия. Редкий случай полной вертикали в одной компании.<\/p><\/blockquote>\n<h3>1.2 Кто есть кто: десять архетипов компаний<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Архетип<\/th><th>Примеры<\/th><th>Особенности<\/th><th>Что это значит для подбора<\/th><\/tr><\/thead><tbody><tr><td><strong>Мейджоры<\/strong> (majors)<\/td><td>BHP, Rio Tinto, Glencore, Anglo American, Vale, Freeport-McMoRan, Zijin Mining<\/td><td>Огромный масштаб, зрелые системы, сильная культура охраны труда, структурированные карьерные лестницы<\/td><td>Сильные «системные» руководители и узкие эксперты. Риск: привыкли к большим бюджетам и готовым процессам<\/td><\/tr><tr><td><strong>Компании среднего размера<\/strong> (mid-tiers)<\/td><td>Boliden, KGHM, Lundin Mining, First Quantum, Solidcore Resources (бывш. Polymetal), ERG, Kazzinc<\/td><td>Меньше бюрократии, люди отвечают за более широкий круг задач<\/td><td>Хороший баланс системности и универсальности<\/td><\/tr><tr><td><strong>Узкопрофильные производители критических металлов<\/strong><\/td><td>Almonty, Masan High-Tech Materials, Molymet, Lynas, MP Materials, Iluka, Albemarle, SQM, Syrah, Plansee<\/td><td>Редкие технологии, маленькие команды<\/td><td><strong>Главный пул доноров для TMK.<\/strong> Пул кандидатов крошечный, поиск долгий, нужен точечный подход<\/td><\/tr><tr><td><strong>Юниоры<\/strong> (juniors)<\/td><td>Сотни компаний на биржах ASX, TSX-V, AIM<\/td><td>Разведка и подготовка проектов, 5–50 человек<\/td><td>Предприимчивые геологи и руководители проектов. Опыта эксплуатации обычно нет<\/td><\/tr><tr><td><strong>Государственные компании и национальные чемпионы<\/strong><\/td><td>Codelco, Казатомпром, Тау-Кен Самрук, Ma'aden, OCP, China Minmetals, АГМК, НГМК, TMK<\/td><td>Государственные KPI, сетки окладов, сильные локальные связи<\/td><td>Локальные лидеры, знающие регуляторику. Риск: медленная культура изменений<\/td><\/tr><tr><td><strong>Металлургические и рафинировочные компании<\/strong><\/td><td>Umicore, Aurubis, Korea Zinc, JX Metals, Sumitomo Metal Mining, Mitsubishi Materials, 5N Plus, H.C. Starck Tungsten<\/td><td>Глубокая химия и металлургия, высокая чистота<\/td><td>Доноры для Чирчика: технологи, химики, специалисты по качеству<\/td><\/tr><tr><td><strong>Трейдеры<\/strong><\/td><td>Glencore, Trafigura, Mercuria, IXM, CRONIMET, Traxys<\/td><td>Логистика, финансирование, маркетинг<\/td><td>Коммерческие директора, специалисты по продажам и маркетингу металлов<\/td><\/tr><tr><td><strong>EPC/EPCM-компании и инжиниринг<\/strong><\/td><td>Hatch, Worley, Fluor, Bechtel, Ausenco, Wood, Lycopodium, DRA; китайские ENFI, NFC, BGRIMM<\/td><td>Проектирование и строительство<\/td><td>Директора проектов, project controls, руководители пусконаладки<\/td><\/tr><tr><td><strong>Консультанты<\/strong><\/td><td>SRK, AMC, WSP (Golder), SLR, Snowden Optiro, ERM (CSA Global), Wardell Armstrong, Micon<\/td><td>Оценка ресурсов, исследования, due diligence<\/td><td>Геологи-ресурсники, Competent Persons. Риск: нет опыта ответственности за результат на площадке<\/td><\/tr><tr><td><strong>Производители оборудования (OEM) и технологий<\/strong><\/td><td>Caterpillar, Komatsu, Liebherr, Sandvik, Epiroc, Metso, FLSmidth, Weir, БелАЗ<\/td><td>Оборудование, сервис, технологии<\/td><td>Эксперты по оборудованию и надёжности. Риск: позиция поставщика, а не владельца<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Отдельные категории, о которых часто забывают:<\/p>\n<ul><li><strong>Лаборатории и центры испытаний<\/strong> — SGS, ALS, Bureau Veritas, Intertek, ANSTO, Mintek. Отсюда приходят аналитики и технологи пилотных установок для R&amp;D Park.<\/li><li><strong>НИИ и университеты<\/strong> — Colorado School of Mines, TU Bergakademie Freiberg, JKMRC (Квинсленд), НИТУ МИСИС, Горный университет (Санкт-Петербург), Central South University (Чанша).<\/li><li><strong>Финансовые институты<\/strong> — IFC, ЕБРР, АБР, ЕАБР, DFC (США), JOGMEC (Япония), KOMIR (Корея). Здесь работают технические эксперты по оценке проектов, которые иногда переходят в компании.<\/li><\/ul>\n<h3>1.3 Как отрасль зарабатывает: циклы, цены и люди<\/h3>\n<p><strong>Сырьевой цикл (commodity cycle).<\/strong> Цены на металлы ходят волнами. Механика простая: высокие цены → компании запускают проекты и <strong>массово нанимают<\/strong> → через 5–15 лет предложение растёт → цены падают → проекты замораживают, людей <strong>сокращают<\/strong>.<\/p>\n<p><strong>Почему это важно для рекрутера:<\/strong><\/p>\n<ul><li><strong>Во время спада появляется доступный пул кандидатов.<\/strong> Пример: падение цен на литий в 2023–2024 гг. и на никель (из-за роста индонезийского предложения). Ряд австралийских проектов и рудников остановили, в том числе BHP приостановила Nickel West в октябре 2024 г. Сильные специалисты внезапно стали доступны.<\/li><li><strong>Во время бума за специалистов идёт война<\/strong>, и зарплаты растут. Сейчас бум по вольфраму и РЗЭ (см. профиль TMK).<\/li><li><strong>Правило:<\/strong> следите за новостями о закрытиях, сокращениях, слияниях и задержках проектов. Это лучшие триггеры для начала поиска.<\/li><\/ul>\n<p><strong>Как устроены цены:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Тип<\/th><th>Металлы<\/th><th>Где формируется цена<\/th><th>Единицы<\/th><\/tr><\/thead><tbody><tr><td>Биржевые<\/td><td>Медь, алюминий, цинк, никель, свинец, олово, кобальт<\/td><td>LME (Лондонская биржа металлов), COMEX, SHFE<\/td><td>$/т<\/td><\/tr><tr><td>Внебиржевые (малые металлы, minor metals)<\/td><td>Вольфрам, молибден, рений, РЗЭ, литиевые соединения, графит, селен, теллур<\/td><td>Оценки ценовых агентств (Fastmarkets, Argus, Asian Metal, SMM, Benchmark), прямые переговоры<\/td><td>APT: $/mtu WO₃ (1 mtu = 10 кг WO₃); Mo: $/фунт или $/кг; Re: $/кг; NdPr-оксид: $/кг; литий: $/т LCE<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Ключевые экономические показатели<\/strong> (кандидаты-руководители говорят на этом языке):<\/p>\n<ul><li><strong>CAPEX<\/strong> — капитальные затраты (построить). <strong>OPEX<\/strong> — операционные затраты (эксплуатировать).<\/li><li><strong>C1 cash cost / AISC<\/strong> (all-in sustaining cost) — себестоимость единицы продукции.<\/li><li><strong>Кривая затрат (cost curve)<\/strong> — ранжирование производителей по себестоимости. Кто в первом квартиле, тот выживает при падении цен.<\/li><li><strong>NPV, IRR, payback<\/strong> — стоимость проекта, его доходность и срок окупаемости.<\/li><li><strong>Срок реализации.<\/strong> От открытия месторождения до начала добычи проходит в среднем около 16 лет (оценка МЭА). Поэтому кадровое планирование в отрасли — на годы вперёд.<\/li><\/ul>\n<h3>1.4 ESG и прослеживаемость: новые «пропуска» на рынок<\/h3>\n<p>Западные покупатели и финансисты требуют подтверждений ответственной добычи. Для TMK это вопрос экспорта, а не имиджа.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Стандарт или инициатива<\/th><th>Суть<\/th><th>Почему важно для TMK<\/th><\/tr><\/thead><tbody><tr><td><strong>RMI / RMAP<\/strong> (Responsible Minerals Initiative)<\/td><td>Аудит ответственных цепочек поставок, особенно для 3TG (олово, тантал, вольфрам, золото)<\/td><td>TMK получила статус RMAP Conformant (2026). Нужны люди, которые этот статус поддерживают<\/td><\/tr><tr><td><strong>OECD Due Diligence Guidance<\/strong><\/td><td>Руководство по проверке цепочек поставок минерального сырья<\/td><td>Основа RMAP и требований покупателей<\/td><\/tr><tr><td><strong>GISTM<\/strong> (Global Industry Standard on Tailings Management, 2020)<\/td><td>Глобальный стандарт управления хвостохранилищами, принят после катастрофы в Брумадинью (Vale, 2019)<\/td><td>Любой новый проект TMK с хвостами<\/td><\/tr><tr><td><strong>IRMA, ICMM<\/strong><\/td><td>Стандарт ответственной добычи; принципы Международного совета по горному делу и металлам<\/td><td>Ожидания крупных партнёров<\/td><\/tr><tr><td><strong>EU Critical Raw Materials Act<\/strong> (2024)<\/td><td>Закон ЕС о критическом сырье: цели по добыче, переработке и диверсификации поставок<\/td><td>Возможность для TMK стать поставщиком ЕС<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Новые роли, которые из этого следуют:<\/strong> ESG-менеджер, специалист по due diligence цепочек поставок, менеджер по взаимодействию с местными сообществами, специалист по хвостохранилищам (Responsible Tailings Facility Engineer).<\/p>\n<h3>1.5 Критические минералы: металлы TMK на одной странице<\/h3>\n<p>Критическим минерал называют, когда он <strong>экономически важен<\/strong> и при этом <strong>есть высокий риск перебоев в поставках<\/strong>. Списки критических минералов ведут ЕС, США, Япония, Корея, Австралия и другие страны.<\/p>\n<p>Доли ниже приблизительные. Это ориентиры по данным USGS, МЭА и отраслевых ассоциаций за последние годы.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Металл<\/th><th>Главные применения<\/th><th>Кто доминирует в поставках<\/th><th>Почему критичен<\/th><\/tr><\/thead><tbody><tr><td><strong>Вольфрам (W)<\/strong><\/td><td>Твёрдые сплавы для режущего и горного инструмента (больше половины спроса), оборона, электроника, тяжёлые сплавы<\/td><td>Китай ≈ 80% добычи<\/td><td>Нет полноценной замены в твёрдых сплавах; экспортный контроль Китая<\/td><\/tr><tr><td><strong>Молибден (Mo)<\/strong><\/td><td>Легирование сталей (около 80% спроса), катализаторы, химия, металлический Mo<\/td><td>Китай, Чили, США, Перу<\/td><td>Основная часть — попутная добыча из медных руд<\/td><\/tr><tr><td><strong>Рений (Re)<\/strong><\/td><td>Жаропрочные никелевые суперсплавы для турбинных лопаток, Pt–Re катализаторы риформинга<\/td><td>Чили (Molymet) — крупнейший производитель; мировой выпуск — десятки тонн в год<\/td><td>Только попутное производство (из молибденита и медного сырья), крошечный рынок<\/td><\/tr><tr><td><strong>РЗЭ (REE)<\/strong><\/td><td>Постоянные магниты NdFeB (электродвигатели, ветрогенераторы, оборона), катализаторы, полировка, люминофоры<\/td><td>Китай ≈ 70% добычи и ≈ 90% разделения и производства магнитов<\/td><td>Технологии разделения сконцентрированы в Китае<\/td><\/tr><tr><td><strong>Литий (Li)<\/strong><\/td><td>Аккумуляторы (основной спрос), стекло, керамика, смазки<\/td><td>Добыча — Австралия, Чили, Китай, Аргентина, Зимбабве; переработка — Китай ≈ 60–65%<\/td><td>Взрывной рост спроса, концентрация переработки в Китае<\/td><\/tr><tr><td><strong>Графит (C)<\/strong><\/td><td>Аноды аккумуляторов, огнеупоры, электроды<\/td><td>Китай доминирует в добыче природного графита и производстве анодов<\/td><td>Аноды почти полностью производятся в Китае<\/td><\/tr><tr><td><strong>Никель (Ni)<\/strong><\/td><td>Нержавеющая сталь, аккумуляторы, суперсплавы<\/td><td>Индонезия ≈ более половины добычи<\/td><td>Концентрация в одной стране<\/td><\/tr><tr><td><strong>Кобальт (Co)<\/strong><\/td><td>Аккумуляторы, суперсплавы, <strong>связка в твёрдых сплавах WC–Co<\/strong><\/td><td>ДР Конго ≈ 70–75% добычи; Китай — большая часть рафинирования<\/td><td>Страновой и этический риск<\/td><\/tr><tr><td><strong>Селен, теллур (Se, Te)<\/strong><\/td><td>Стекло и электроника; солнечные модули CdTe, термоэлектрика<\/td><td>Попутные продукты рафинирования меди<\/td><td>Объём зависит от выпуска меди<\/td><\/tr><\/tbody><\/table><\/div>\n<blockquote><p><strong>Связь, которую нужно увидеть:<\/strong> кобальт — это не только аккумуляторы, н
