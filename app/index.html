спертов","Пройти ещё один курс по другой отрасли, чтобы расширить кругозор и не зацикливаться на горной отрасли","Ничего: знания после 30 дней сохранятся сами собой"],"answer":1,"explain":"Отсюда личный план развития на 90 дней."}],"html":"<h2>0. Разминка: вся программа за 15 минут<\/h2>\n<ol><li>Почему дефицит специалистов растёт от upstream к downstream?<\/li><li>Три фильтра релевантности геолога.<\/li><li>Чем ресурсы отличаются от запасов?<\/li><li>Формула извлечения через содержания f, c, t.<\/li><li>Почему разделение РЗЭ требует сотен ступеней?<\/li><li>Что такое шкала масштаба гидрометаллурга?<\/li><li>Чем QA отличается от QC?<\/li><li>Пять измерений технической роли.<\/li><li>Что такое метод воронки и «правило двух уровней»?<\/li><li>Восемь измерений карты переноса контекста.<\/li><\/ol>\n<details><summary>Проверить себя<\/summary>\n<ol><li>Чем глубже передел, тем меньше компаний им владеют и тем закрытее технологии.<\/li><li>Металл, стиль минерализации, тип работ.<\/li><li>Запасы — экономически извлекаемая часть ресурсов Measured и Indicated после учёта модифицирующих факторов.<\/li><li>R = c · (f − t) / [f · (c − t)] × 100%.<\/li><li>Соседние лантаноиды почти одинаковы, коэффициенты разделения малы.<\/li><li>Лаборатория → укрупнённые испытания → пилот → проектирование → пуск и вывод на мощность → эксплуатация.<\/li><li>QC — проверка конкретных результатов; QA — система надёжности процесса.<\/li><li>Металл, процесс, стадия, масштаб, уровень роли.<\/li><li>Уточнение от общего к цифрам и причинам; практик отвечает на 2–3 уровня вглубь.<\/li><li>Технология, масштаб, стадия, стандарты, ресурсы, команда, язык и культура, принятие решений.<\/li><\/ol>\n<\/details>\n<hr>\n<h2>1. Теория: программа на одной странице<\/h2>\n<h3>1.1 Что вы теперь знаете<\/h3>\n<pre class=\"code\"><code>МОДУЛЬ 1 — ОТРАСЛЬ: цепочка «недра → концентрат → металл → изделие»; архетипы компаний; геология и типы месторождений;\n          ресурсы и запасы (JORC ↔ ГКЗ); горные работы; жизненный цикл и волны найма; сопоставление должностей\nМОДУЛЬ 2 — ПЕРЕРАБОТКА: рудоподготовка, флотация, гравитация, магнитная сепарация; гидро- и пирометаллургия;\n          экстракция, электролиз, рафинирование; порошковая металлургия; цепочки W, Mo, Re\nМОДУЛЬ 3 — РЗЭ И КРИТИЧЕСКИЕ МИНЕРАЛЫ: цепочка «рудник → магнит»; вскрытие, разделение, металлы, магниты;\n          литий, графит, Ni–Co, малые металлы; рынки и политика\nМОДУЛЬ 4 — ОБОРУДОВАНИЕ И СИСТЕМЫ: оборудование и OEM; лабораторные методы; качество и ISO/IEC 17025;\n          АСУ ТП и ТОиР; безопасность, ESG, прослеживаемость\nМОДУЛЬ 5 — ПОДБОР: брифинг и профиль успеха; карта талантов; поиск (Boolean, патенты, публикации); работа с кандидатом;\n          управление проектом поиска\nМОДУЛЬ 6 — ОЦЕНКА И ЗАКАЗЧИКИ: структурированное интервью; реальный опыт против поверхностного;\n          перенос международного опыта; работа со стейкхолдерами<\/code><\/pre>\n<h3>1.2 Сквозная логика эксперта по поиску<\/h3>\n<ol><li><strong>Понять задачу<\/strong> через процесс, а не через название должности (модули 1–4).<\/li><li><strong>Сформулировать роль<\/strong> через результаты и пять измерений (День 21).<\/li><li><strong>Найти людей<\/strong> там, где они реально работают, включая скрытых (Дни 22–23).<\/li><li><strong>Вести кандидата<\/strong> честно, через его мотивацию (День 24).<\/li><li><strong>Оценить<\/strong> по свидетельствам, а не по впечатлению (Дни 26–28).<\/li><li><strong>Довести решение<\/strong> до конца с заказчиками (Дни 25, 29).<\/li><li><strong>Построить систему<\/strong>: карты, пайплайн, ретроспективы (День 25).<\/li><\/ol>\n<h3>1.3 Критерии выпуска<\/h3>\n<p>Программа считается пройденной, когда выполнено всё:<\/p>\n<ul><li><span class=\"task\"><input type=\"checkbox\" disabled> сданы тесты всех 30 дней (≥ 8/10);<\/span><\/li><li><span class=\"task\"><input type=\"checkbox\" disabled> сданы итоговые тесты шести модулей (≥ 16/20), включая выпускной экзамен;<\/span><\/li><li><span class=\"task\"><input type=\"checkbox\" disabled> проведены teach-back по всем модулям;<\/span><\/li><li><span class=\"task\"><input type=\"checkbox\" disabled> выполнен и защищён финальный проект;<\/span><\/li><li><span class=\"task\"><input type=\"checkbox\" disabled> составлен личный план развития на 90 дней.<\/span><\/li><\/ul>\n<hr>\n<h2>2. Терминология RU — EN<\/h2>\n<p>Сегодня — повторение ключевых терминов Executive Search, которые встречаются в финальном проекте.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Русский<\/th><th>English<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody><tr><td>Полный цикл поиска<\/td><td>End-to-end search / full-cycle search<\/td><td>Поиск от брифинга до адаптации<\/td><\/tr><tr><td>Пакет поиска<\/td><td>Search pack<\/td><td>Комплект документов проекта поиска<\/td><\/tr><tr><td>Профиль позиции<\/td><td>Position specification<\/td><td>Задача, требования и условия<\/td><\/tr><tr><td>Оценочная карта<\/td><td>Scorecard<\/td><td>Критерии с весами и шкалами<\/td><\/tr><tr><td>Карта талантов<\/td><td>Talent map<\/td><td>Компании, имена, размер пула<\/td><\/tr><tr><td>Стратегия поиска<\/td><td>Search strategy<\/td><td>Каналы, доноры, сроки<\/td><\/tr><tr><td>Лонг-лист<\/td><td>Long list<\/td><td>Широкий список кандидатов<\/td><\/tr><tr><td>Шорт-лист<\/td><td>Shortlist<\/td><td>Отобранные кандидаты<\/td><\/tr><tr><td>Гайд интервью<\/td><td>Interview guide<\/td><td>План структурированного интервью<\/td><\/tr><tr><td>Презентация кандидата<\/td><td>Candidate report<\/td><td>Документ для заказчика<\/td><\/tr><tr><td>Сравнительная матрица<\/td><td>Comparison matrix<\/td><td>Кандидаты против критериев<\/td><\/tr><tr><td>Проверка рекомендаций<\/td><td>Reference check<\/td><td>Разговоры о фактах и поведении<\/td><\/tr><tr><td>Предложение о работе<\/td><td>Offer<\/td><td>Условия для кандидата<\/td><\/tr><tr><td>План адаптации на 90 дней<\/td><td>90-day onboarding plan<\/td><td>Цели и шаги первых месяцев<\/td><\/tr><tr><td>Ретроспектива<\/td><td>Retrospective / post-mortem<\/td><td>Разбор после закрытия поиска<\/td><\/tr><tr><td>Качество найма<\/td><td>Quality of hire<\/td><td>Результаты и удержание<\/td><\/tr><tr><td>Личный план развития<\/td><td>Personal development plan (PDP)<\/td><td>Цели обучения на следующий период<\/td><\/tr><tr><td>Профессиональное сообщество<\/td><td>Professional network<\/td><td>Ассоциации, конференции, эксперты<\/td><\/tr><tr><td>Отраслевая экспертиза<\/td><td>Industry expertise<\/td><td>Глубокое знание отрасли<\/td><\/tr><tr><td>Доверенный советник<\/td><td>Trusted advisor<\/td><td>Партнёр, к мнению которого прислушиваются<\/td><\/tr><tr><td>Защита проекта<\/td><td>Project defence / presentation<\/td><td>Представление результата руководителю<\/td><\/tr><tr><td>Сертификат о прохождении<\/td><td>Certificate of completion<\/td><td>Подтверждение окончания программы<\/td><\/tr><tr><td>Непрерывное обучение<\/td><td>Continuous learning<\/td><td>Регулярное обновление знаний<\/td><\/tr><tr><td>Наставничество<\/td><td>Mentoring<\/td><td>Передача опыта младшим коллегам<\/td><\/tr><tr><td>Экспертная позиция<\/td><td>Expert positioning<\/td><td>Репутация специалиста в отрасли<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>3. Взгляд Executive Search: как будет оцениваться финальный проект<\/h2>\n<p>Попросите руководителя или опытного коллегу оценить проект по шкале 1–5:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Критерий<\/th><th>1 — слабо<\/th><th>3 — достаточно<\/th><th>5 — сильно<\/th><\/tr><\/thead><tbody><tr><td>Профиль позиции<\/td><td>Обязанности, нет масштаба<\/td><td>Результаты и must-have есть<\/td><td>Результаты, пять измерений, оценочная карта, честные риски<\/td><\/tr><tr><td>Карта талантов<\/td><td>Список известных компаний<\/td><td>Три кольца, имена<\/td><td>Три кольца с логикой, размер пула, конкуренты, ограничения<\/td><\/tr><tr><td>Поиск<\/td><td>Только LinkedIn<\/td><td>Несколько каналов<\/td><td>Синонимы RU/EN, патенты, публикации, конференции, журнал поиска<\/td><\/tr><tr><td>Работа с кандидатом<\/td><td>Шаблонные сообщения<\/td><td>Персонализация<\/td><td>Мотивация, возражения, пакет, контрпредложение<\/td><\/tr><tr><td>Оценка<\/td><td>Свободная беседа<\/td><td>Вопросы по критериям<\/td><td>Гайд, воронка, проверка опыта, перенос контекста, рекомендации<\/td><\/tr><tr><td>Работа с заказчиком<\/td><td>Отправка резюме<\/td><td>Отчёт и шорт-лист<\/td><td>Карта стейкхолдеров, данные рынка, управляемое решение<\/td><\/tr><tr><td>Техническая грамотность<\/td><td>Ошибки в терминах<\/td><td>Термины верные<\/td><td>Точные вопросы по процессу, вызывающие доверие технологов<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>4. Финальный проект: полный пакет поиска<\/h2>\n<p><strong>Выберите позицию.<\/strong> Лучше всего — реальную вакансию TMK. Если её нет, выберите одну из:<\/p>\n<ul><li>«Главный технолог гидрометаллургии вольфрама (APT) / Head of APT Production»;<\/li><li>«Директор вольфрамового горнорудного комплекса / General Manager — Tungsten Mine &amp; Concentrator»;<\/li><li>«Руководитель направления РЗЭ и рения из растворов / Head of REE &amp; Rhenium Recovery»;<\/li><li>«Руководитель Центральной нано-аналитической лаборатории / Head of Central Analytical Laboratory».<\/li><\/ul>\n<p><strong>Соберите пакет (150 мин):<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>№<\/th><th>Документ<\/th><th>Опора<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Одностраничный профиль позиции с результатами на 3/6/12 месяцев и пятью измерениями<\/td><td>День 21<\/td><\/tr><tr><td>2<\/td><td>Оценочная карта: 6–8 критериев, веса, уровни 1/3/5<\/td><td>Дни 21, 26<\/td><\/tr><tr><td>3<\/td><td>Карта талантов: 25–30 компаний в трёх кольцах, размер пула, конкуренты, ограничения<\/td><td>День 22<\/td><\/tr><tr><td>4<\/td><td>Набор поисковых строк RU/EN + патентный и публикационный запросы + 15 имён<\/td><td>День 23<\/td><\/tr><tr><td>5<\/td><td>Три первых сообщения (разные профили кандидатов)<\/td><td>День 24<\/td><\/tr><tr><td>6<\/td><td>Гайд структурированного интервью на 60 минут + технический кейс<\/td><td>Дни 26–27<\/td><\/tr><tr><td>7<\/td><td>План проверки: рекомендации, документы, публичные следы<\/td><td>День 27<\/td><\/tr><tr><td>8<\/td><td>Шаблон вывода о переносе международного опыта<\/td><td>День 28<\/td><\/tr><tr><td>9<\/td><td>Карта стейкхолдеров и график решений<\/td><td>День 29<\/td><\/tr><tr><td>10<\/td><td>Структура оффера и пакета, план адаптации на 90 дней<\/td><td>День 24<\/td><\/tr><tr><td>11<\/td><td>График поиска, метрики воронки, формат еженедельного отчёта<\/td><td>День 25<\/td><\/tr><tr><td>12<\/td><td>Риски поиска и план действий<\/td><td>Дни 22, 25<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Защита (teach-back, 20 мин).<\/strong> Представьте пакет руководителю. Попросите оценить по таблице раздела 3 и задать три трудных вопроса. Запишите оценки и замечания.<\/p>\n<hr>\n<h2>6. Личный план развития на 90 дней и итоговая рефлексия<\/h2>\n<p><strong>План развития (15 мин):<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление<\/th><th>Цель на 90 дней<\/th><th>Конкретные шаги<\/th><th>Как пойму, что получилось<\/th><\/tr><\/thead><tbody><tr><td>Техническая глубина<\/td><td>Например: уверенно говорить о переделах Чирчика<\/td><td>Еженедельно 1 час с технологом TMK; посещение цехов<\/td><td>Технологи сами зовут на брифинги<\/td><\/tr><tr><td>Сеть и рынок<\/td><td>Например: 100 контактов в картах W и РЗЭ<\/td><td>5 разговоров в неделю, 1 конференция за квартал<\/td><td>Рекомендации приходят без запроса<\/td><\/tr><tr><td>Процесс<\/td><td>Например: каждый поиск — с профилем, картой, отчётом<\/td><td>Шаблоны из финального проекта<\/td><td>Сроки и доля принятых офферов улучшаются<\/td><\/tr><tr><td>Обучение<\/td><td>Например: один курс или книга в месяц<\/td><td>Список из материалов курса<\/td><td>Конспекты, применение в работе<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Источники для непрерывного обучения:<\/strong> отраслевые ассоциации (ITIA, IMOA, REIA, International Lithium Association — TMK является их членом), конференции (UIMF, MINEX, Mining &amp; Metals Central Asia, Plansee Seminar, ALTA), USGS и МЭА, внутренние эксперты TMK, партнёры (KU Leuven, TU Freiberg, МИСИС, KIGAM, JOGMEC).<\/p>\n<p><strong>Итоговая рефлексия (10 мин):<\/strong><\/p>\n<ol><li>Пройдите <strong>входной тест из Дня 1<\/strong> в последний раз. Сравните с первым результатом.<\/li><li>Что вы сейчас делаете на интервью иначе, чем 30 дней назад?<\/li><li>Какую вакансию TMK вы закрыли или закроете быстрее благодаря курсу?<\/li><\/ol>\n<blockquote><p><strong>Выпуск.<\/strong> Вы прошли 30 дней. Вы понимаете отрасль от недр до изделия, говорите с технологами на их языке, видите кандидатов там, где их не видят конкуренты, и отличаете реальный опыт от красивого рассказа. Это то, что делает Executive Search Specialist экспертом. Дальше — практика. Каждая вакансия TMK теперь — ваш следующий модуль.<\/p><\/blockquote>\n<hr>\n<h2>7. Материалы для углубления<\/h2>\n<ul><li>Все разделы «Материалы для углубления» Дней 1–29 — ваша библиотека на год.<\/li><li>Профиль TMK (<a href=\"#tmk\">../00-start/tmk-profile.md<\/a>) — обновляйте после каждого teach-back и брифинга.<\/li><li>Сводный <a href=\"#today\">глоссарий<\/a> и карточки в приложении — повторяйте термины еженедельно.<\/li><\/ul>"}],"profileHtml":"<h1>Профиль TMK для Executive Search<\/h1>\n<blockquote><p><strong>Что это.<\/strong> Выжимка публичной информации об АО «Узбекский комбинат технологических металлов» (ТМК, UzTMK) и выводы из неё для подбора. <strong>Срез данных:<\/strong> сайт <a href=\"https://uztmk.uz/ru\" target=\"_blank\" rel=\"noopener\">uztmk.uz/ru<\/a> (просмотрен 02.11.2026) и публикации 2024–2026 гг. (ссылки в конце). <strong>Как читать.<\/strong> Факты даны со ссылкой на источник. Всё, что помечено <strong>[Аналитика]<\/strong>, — это мои выводы для подбора, а не официальная позиция компании. Цифры из СМИ и пресс-релизов — это заявления и планы, а не проверенная отчётность.<\/p><\/blockquote>\n<hr>\n<h2>1. TMK за 60 секунд<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Параметр<\/th><th>Что известно<\/th><\/tr><\/thead><tbody><tr><td>Полное название<\/td><td>АО «Узбекский комбинат технологических металлов» (ТМК / UzTMK / UKTM)<\/td><\/tr><tr><td>Создание<\/td><td>Июнь 2024 г., постановлением Президента, на базе НПО «Редкие металлы и твердые сплавы», входившего в АО «Алмалыкский ГМК» (АГМК). По данным ЕГРПО на момент создания учредитель — АГМК (100%), уставный капитал — 257 млрд сумов<\/td><\/tr><tr><td>Историческая база<\/td><td>Чирчикское производство тугоплавких металлов и твёрдых сплавов. Узбекский комбинат тугоплавких и жаропрочных металлов (УзКТЖМ) был присоединён к АГМК (отражено в бизнес-плане АГМК на 2017 г.), затем работал как НПО «Редкие металлы и твердые сплавы» в составе АГМК, а в 2024 г. на его базе создан ТМК<\/td><\/tr><tr><td>Штаб-квартира<\/td><td>Ташкентская обл., г. Чирчик, ул. Вохида Хайдарова, 1<\/td><\/tr><tr><td>Площадки на карте активов (сайт)<\/td><td>г. Чирчик · Ахангаранский район · Самаркандская область<\/td><\/tr><tr><td>Бизнес-модель<\/td><td>Вертикальная интеграция «месторождение — металл — рынок»: upstream (добыча → концентраты), midstream (производство металлов), downstream (готовые изделия)<\/td><\/tr><tr><td>Масштаб планов<\/td><td>2026–2030 гг.: 120 инвестиционных проектов на $4,2 млрд по данным правительства (на сайте указано «более 140 проектов» и «свыше 30 видов стратегического сырья»). Цель — выпуск на $1 млрд к 2028 г. и $2 млрд к 2030 г.<\/td><\/tr><tr><td>Первый транш (2026)<\/td><td>12 проектов на $166 млн: высокочистые селен, теллур и рений; 21 импортозамещающий продукт, включая автодетали методом порошковой металлургии и серную кислоту<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Главная мысль для рекрутера.<\/strong> TMK — не «ещё одна горнодобывающая компания». Это <strong>государственный интегратор критических металлов<\/strong>, который одновременно:<\/p>\n<ol><li>Модернизирует советскую базу тугоплавких металлов (вольфрам, молибден, твёрдые сплавы по ГОСТ).<\/li><li>Строит новые переделы: рений, Se/Te, графит, серная кислота, порошковая металлургия, РЗЭ и рений из растворов.<\/li><li>Выходит на рынки США, ЕС, Кореи и Японии с их стандартами: JORC, RMI/RMAP, ESG, прослеживаемость.<\/li><\/ol>\n<p>Отсюда главный кадровый вызов: нужны люди, которые <strong>соединяют советскую инженерную школу и международные стандарты<\/strong>. Таких на рынке очень мало.<\/p>\n<hr>\n<h2>2. Активы, продукты и проекты<\/h2>\n<h3>2.1 Действующая продукция (по каталогу на сайте)<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Группа<\/th><th>Продукты и характеристики<\/th><th>Что это говорит о технологиях<\/th><\/tr><\/thead><tbody><tr><td><strong>Вольфрам<\/strong><\/td><td>Штабики W ≥ 99,8%; спечённые брикеты W ≥ 99,29%; твёрдые сплавы марок ВК6/ВК8 по ГОСТ 3882-74: напаиваемые пластины, сменные многогранные пластины, изделия для горного инструмента, волоки (фильеры), свёрла, фрезы; иттрированные прутки СВИ-1 (W + 1,5–2,3% Y₂O₃); композиционный наплавочный пруток (ВК8 + латунь + никель)<\/td><td>Восстановление оксидов водородом → порошок W → прессование и спекание → штабики. Карбидизация → WC → твёрдый сплав WC–Co → прессование, спекание, шлифовка. Это <strong>порошковая металлургия тугоплавких металлов<\/strong> — редкая компетенция<\/td><\/tr><tr><td><strong>Молибден<\/strong><\/td><td>Брикеты Mo 99,8%; штабики Mo 99,95%; ферромолибден ФМо60/ФМо70 (ГОСТ 4759-91)<\/td><td>Химико-металлургическая переработка молибденового сырья → порошок Mo → спекание. Металлотермия для ферромолибдена<\/td><\/tr><tr><td><strong>Рений<\/strong><\/td><td>Рений металлический (порошок, средний диаметр частиц по Фишеру 3,0–7,5 мкм; классы 99,906% / 99,829%; отдельная марка 99,54%). Применение — катализаторы нефтепереработки, легирование. Первый экспорт металлического рения 99,9% — июль 2025 г. (покупатель из Эстонии)<\/td><td>Улавливание рения (обычно из газов обжига молибденитового концентрата) → сорбция или экстракция → перренат аммония → восстановление водородом<\/td><\/tr><tr><td><strong>Прочее<\/strong><\/td><td>Буровые коронки; огнеупорная и футеровочная продукция<\/td><td>Горный инструмент (твёрдый сплав) и огнеупоры для металлургических печей<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>2.2 Дочерние структуры и проекты<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Структура / проект<\/th><th>Что известно<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><strong>Ингичка<\/strong> (Самаркандская обл.) — вольфрам<\/td><td>Ингичкинская обогатительная фабрика перерабатывает техногенные отходы вольфрамового рудника. 1-я очередь — 2022 г. (100 т концентрата в год), 2-я очередь — август 2024 г. (+120 рабочих мест, химико-аналитическая лаборатория, опытный цех обогащения). Планы: горнорудный вольфрамовый комплекс в регионе; рост выпуска вольфрамового концентрата с 300 т до 14 950 т после выхода новых проектов на мощность<\/td><td>gov.uz/mingeo, Kursiv (2026)<\/td><\/tr><tr><td><strong>Технопарк «Металлы будущего»<\/strong> (Kelajak metallari)<\/td><td>Индустриальная зона глубокой переработки критических и редких металлов. TMK обеспечивает резидентов сырьём (W, Mo и др.). Для резидентов — One-Stop-Shop и юридические механизмы на основе английского права. Цель — более 18 тыс. рабочих мест<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>R&amp;D Park<\/strong><\/td><td>Центральная нано-аналитическая лаборатория (фазовый состав, кристаллическая структура, свойства на наноуровне; цифровая LIMS; по плану — до 1 000 проб в сутки). Центр технологических испытаний (пробоподготовка руд и концентратов, гидрометаллургическое выделение элементов, лабораторные и опытно-промышленные испытания). Центр коммерциализации. Лабораторию создают с SGS<\/td><td>uztmk.uz, yuz.uz<\/td><\/tr><tr><td><strong>Smart Powder<\/strong><\/td><td>Порошковая металлургия: прецизионные металлические изделия. Технологии внедряются с корейскими партнёрами. План экспорта — Корея, США, Малайзия, Мексика. Есть практический учебный центр для инженеров и техников<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>TMK Chemicals<\/strong><\/td><td>Серная кислота высокой чистоты, 500 тыс. т в год. Строится в Карманинском районе Навоийской обл., вместе с 2,5 км железной дороги<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>Тасказганский графитовый проект<\/strong><\/td><td>Пешкунский район, Бухарская обл. Оператор — СП «Graphtech Mining and Production» в составе ТМК. Разведка ведётся по JORC (магниторазведка с дронов, электроразведка методом ВП/IP, геотехника). Продукт — экспортный графитовый концентрат. К 2030 г. — полная цепочка на основе графита<\/td><td>uztmk.uz<\/td><\/tr><tr><td><strong>РЗЭ и рений из растворов<\/strong><\/td><td>Соглашение с Solvomet (KU Leuven, Бельгия), старт — январь 2026 г. Цель — извлечение РЗЭ и рения из продуктивных растворов (после извлечения урана) месторождений U–РЗЭ–Re Узбекистана<\/td><td>solvomet.eu<\/td><\/tr><tr><td><strong>Портфель «прочих» металлов<\/strong><\/td><td>Литий, никель, кобальт, селен, теллур, тантал-ниобий, магний, германий и др. Детали большинства проектов публично не раскрыты<\/td><td>uztmk.uz, spot.uz, timesca.com<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>2.3 Партнёры, членства, статусы<\/h3>\n<ul><li><strong>Научные и технологические партнёры (по сайту):<\/strong> НИТУ МИСИС (Россия), TU Bergakademie Freiberg (Германия), KIGAM (Корея), Пизанский университет (Италия), Стамбульский технический университет (Турция), Университет Обуда (Венгрия), JOGMEC (Япония), USGS (США). Отдельно — Solvomet KU Leuven.<\/li><li><strong>Коммерческие и финансовые соглашения (по публикациям):<\/strong><ul><li>American Resources Corp. и ReElement Technologies (США): вольфрамовый концентрат и его рафинирование в США, ноябрь 2025.<\/li><li>Cove Capital (США): меморандум.<\/li><li>SGS: лаборатория.<\/li><li>Shaanxi Non-ferrous Metals Holding Group (Китай): меморандум.<\/li><li>Евразийский банк развития: меморандум и обсуждение финансирования.<\/li><li>Великобритания: дорожная карта на 2026–2028 гг.<\/li><li>CRONIMET (Германия): переговоры, октябрь 2026.<\/li><\/ul><\/li><li><strong>Членства:<\/strong> ITIA (Международная ассоциация вольфрамовой промышленности; с марта 2025 г., первая компания Центральной Азии), MMTA, IMOA, International Lithium Association, Rare Earth Industry Association, International Magnesium Association, Critical Minerals Institute, European Critical Raw Materials Alliance, европейская ассоциация по графиту и углеродным материалам.<\/li><li><strong>Статус RMI:<\/strong> RMAP Conformant (новость от 31.10.2026). Это аудит ответственных цепочек поставок, важный для западных покупателей вольфрама.<\/li><li><strong>Кадры:<\/strong> дуальное обучение с ТашГТУ; при ТМК открыты кафедры металлургии и материаловедения; 64 студента на практике (2026). Издание Times of Central Asia прямо пишет, что этого недостаточно для 120 проектов.<\/li><\/ul>\n<hr>\n<h2>3. Рыночный контекст: почему за этих людей идёт война<\/h2>\n<ul><li><strong>Вольфрам.<\/strong> В 2025 г. мировая добыча составила около 85 тыс. т, из них Китай — около 67 тыс. т. С февраля 2025 г. Китай ввёл экспортный контроль на вольфрам, молибден, теллур, висмут и индий. К маю 2026 г. цена APT в Европе выросла примерно до $3 185 за mtu, то есть на ~900% за год (Kursiv, 2026).<\/li><li><strong>РЗЭ.<\/strong> В апреле 2025 г. Китай ограничил экспорт ряда средних и тяжёлых РЗЭ и магнитов, а с конца 2023 г. — экспорт технологий извлечения и разделения РЗЭ. Практическое следствие: <strong>знания о разделении РЗЭ вне Китая — сверхдефицит<\/strong>.<\/li><li><strong>Последствие для TMK [Аналитика].<\/strong> Проекты в США, ЕС, Корее, Японии, Австралии и Казахстане ищут тех же немногих специалистов по вольфраму, молибдену, рению и РЗЭ вне Китая, что и TMK. Выигрывает компания, чей рекрутер:<ol><li>Говорит с кандидатом на его профессиональном языке с первой минуты.<\/li><li>Знает, где эти люди работают (компании-доноры).<\/li><li>Умеет быстро отличить практика от «презентационного» эксперта.<\/li><\/ol>\n<p>Этому и учит программа.<\/p><\/li><\/ul>\n<hr>\n<h2>4. Карта потребностей в талантах [Аналитика]<\/h2>\n<p>Это гипотеза для проверки на интервью с нанимающими менеджерами, а не утверждённый план найма.<\/p>\n<p>Дефицит: ★ — на рынке хватает · ★★ — сложно · ★★★ — единицы на рынке.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Направление TMK<\/th><th>Ключевые роли<\/th><th>Дефицит<\/th><th>Где искать в первую очередь<\/th><\/tr><\/thead><tbody><tr><td>Вольфрам: добыча и концентрат (Самаркандская обл.)<\/td><td>Начальник рудника (подземные работы), главный геолог (опыт со скарнами, статус JORC CP), геомеханик, начальник ОФ, технолог-обогатитель (гравитация + флотация шеелита)<\/td><td>★★–★★★<\/td><td>Almonty (Сандон, Корея; Панаскейра, Португалия), Wolfram Bergbau und Hütten (Миттерзиль, Sandvik), Masan High-Tech Materials (Нуй Фао, Вьетнам), EQ Resources (Mt Carbine), Group 6 Metals, вольфрамовые проекты Казахстана, АГМК и НГМК (горные кадры)<\/td><\/tr><tr><td>Металлургия W/Mo/Re и твёрдые сплавы (Чирчик)<\/td><td>Технологи по гидрометаллургии вольфрама (APT), специалисты по восстановлению водородом и карбидизации, технологи твёрдых сплавов, специалисты по обжигу молибденита, химики по извлечению рения, инженеры по качеству<\/td><td>★★★<\/td><td>Plansee Group (вкл. Ceratizit и Global Tungsten &amp; Powders), H.C. Starck Tungsten (с 2024 г. — Mitsubishi Materials), Wolfram Bergbau und Hütten, Kennametal, Sandvik Coromant, Molymet, Climax Molybdenum (Freeport), Japan New Metals, A.L.M.T. (Sumitomo Electric), предприятия твёрдых сплавов СНГ (см. примечание о санкциях)<\/td><\/tr><tr><td>Smart Powder (порошковые изделия)<\/td><td>Технолог порошковой металлургии, специалист по спеканию, конструктор пресс-инструмента, инженер по качеству (IATF 16949, PPAP), начальник производства<\/td><td>★★<\/td><td>GKN Powder Metallurgy, Miba, Sumitomo Electric Sintered Alloy, Höganäs, кор /* ===================== Utilities ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const fmtDate = s => { if (!s) return "—"; const d = parseYmd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; };

const DAY = n => DAYS.find(d => d.n === n);
const MODULE = n => DATA.modules.find(m => m.n === n);
const moduleOfDay = n => DATA.modules.find(m => n >= m.from && n <= m.to);

const LEITNER = [0, 1, 2, 4, 8, 16];

/* ===================== State & persistence ===================== */
const LS_KEY = "mmesa-academy-v1";
function defaultState() {
  return { v: 1, createdAt: ymd(), updatedAt: 0, contract: null, days: {}, modules: {}, cards: {}, activity: {}, best: 0, settings: { sound: true }, timer: null };
}
function migrate(s) {
  const d = defaultState();
  if (!s || typeof s !== "object") return d;
  for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
  return s;
}
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? migrate(JSON.parse(raw)) : null; } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
let state = loadLocal() || defaultState();

const remote = { ref: null, writing: false, pending: false, timer: null, status: "local" };
function persist() {
  state.updatedAt = Date.now();
  saveLocal();
  if (remote.ref) { clearTimeout(remote.timer); remote.timer = setTimeout(pushRemote, 1200); }
}
async function pushRemote() {
  if (!remote.ref) return;
  if (remote.writing) { remote.pending = true; return; }
  remote.writing = true;
  try { await remote.ref.set({ state: clone(state) }); setSync("synced"); }
  catch (e) { setSync(e && e.code === "quota_exceeded" ? "full" : "error"); }
  remote.writing = false;
  if (remote.pending) { remote.pending = false; pushRemote(); }
}
function setSync(s) { remote.status = s; renderStatus(); }
async function connectRemote() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/academy");
    remote.ref = ref; setSync("connecting");
    const t = setTimeout(() => { if (remote.status === "connecting") setSync("slow"); }, 10000);
    ref.onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(t);
      const data = snap.exists ? snap.data() : null;
      const incoming = data && data.state;
      if (incoming && (incoming.updatedAt || 0) > (state.updatedAt || 0)) {
        flushJournal(); state = migrate(clone(incoming)); saveLocal(); render();
      }
      if (!snap.metadata.fromCache) setSync("synced");
    }, () => { clearTimeout(t); remote.ref = null; setSync("local"); });
  } catch (e) { /* stay local */ }
}

/* ===================== Activity, streak, unlocks ===================== */
const today = () => ymd();
function bump(kind, amount = 1) {
  const t = today();
  const a = state.activity[t] || (state.activity[t] = { checks: 0, cards: 0, focus: 0, tests: 0, newCards: 0 });
  a[kind] = (a[kind] || 0) + amount;
}
function isActive(date) {
  const a = state.activity[date];
  return !!a && (a.tests >= 1 || a.checks >= 2 || a.cards >= 15 || a.focus >= 20);
}
function firstActivity() { const ks = Object.keys(state.activity).filter(isActive).sort(); return ks[0] || null; }
function streakInfo() {
  const start = firstActivity();
  if (!start) return { current: 0, best: state.best || 0, missedYesterday: false, broken: false, activeToday: false };
  const t = today();
  const activeToday = isActive(t);
  let current = 0, gap = 0, d = activeToday ? t : addDays(t, -1);
  // Walk back: single missed days are tolerated, two in a row end the chain.
  while (diffDays(start, d) >= 0) {
    if (isActive(d)) { current++; gap = 0; } else { gap++; if (gap >= 2) break; }
    d = addDays(d, -1);
  }
  const y1 = addDays(t, -1), y2 = addDays(t, -2);
  const missedYesterday = !activeToday && !isActive(y1) && diffDays(start, y1) >= 0;
  const broken = !activeToday && !isActive(y1) && !isActive(y2) && diffDays(start, y2) >= 0;
  if (broken) current = 0;
  const best = Math.max(state.best || 0, current);
  if (best !== state.best) { state.best = best; saveLocal(); }
  return { current, best, missedYesterday, broken, activeToday };
}
const dayState = n => state.days[n] || (state.days[n] = { checks: {}, quiz: { best: null, attempts: 0, lastFailAt: 0, passedAt: null }, journal: {}, minutes: 0, mode: "full", completedAt: null });
const passed = n => { const s = state.days[n]; return !!(s && s.quiz && s.quiz.passedAt); };
const modulePassed = m => !!(state.modules[m] && state.modules[m].passedAt);
function unlockReason(n) {
  const d = DAY(n);
  if (!d) return "soon";
  if (n === 1) return null;
  if (!passed(n - 1)) return `Сначала сдайте тест Дня ${n - 1} на ${PASS}/10 или выше.`;
  const m = moduleOfDay(n);
  if (m && m.from === n && m.n > 1 && !modulePassed(m.n - 1)) return `Сначала сдайте итоговый тест Модуля ${m.n - 1} (${MODULE_PASS}/20 или выше).`;
  return null;
}
const isOpen = n => !!DAY(n) && unlockReason(n) === null;
function currentDay() {
  for (const d of DAYS) if (isOpen(d.n) && !passed(d.n)) return d.n;
  for (const d of DAYS) if (!isOpen(d.n)) return d.n;
  return null;
}
function nextAction() {
  const cd = currentDay();
  if (cd && isOpen(cd)) return { kind: "day", n: cd };
  if (cd && !isOpen(cd)) {
    const m = moduleOfDay(cd);
    if (m && m.n > 1 && !modulePassed(m.n - 1) && passed(cd - 1)) return { kind: "module", n: m.n - 1 };
  }
  const lastReady = DATA.modules.filter(m => m.ready).pop();
  if (lastReady && !modulePassed(lastReady.n)) return { kind: "module", n: lastReady.n };
  return { kind: "done" };
}
const avgScore = () => { const s = DAYS.map(d => state.days[d.n]?.quiz?.best).filter(v => v != null); return s.length ? Math.round(s.reduce((a, b) => a + b, 0) / s.length * 10) : null; };

/* ===================== Flashcards (Leitner) ===================== */
function allCards() {
  const out = [];

let daySub = "content";
let quizRun = null;
function viewDay(n) {

  let body = "";

  else if (daySub === "terms") body = termsHtml(d);
  else body = finishHtml(d, ds);
  return `<div class="stack">
    <section class="day-head">
      <p class="eyebrow">Модуль ${d.module} · День ${d.n} из ${DATA.totalDays} · ${esc(d.duration)}</p>
      <h1>${esc(d.title)}</h1>
      <div class="day-meta">${passed(n) ? `<span class="pill ok">Тест сдан: ${q.best}/10</span>` : `<span class="pill warn">Тест не сдан</span>`}${ds.completedAt ? `<span class="pill ok">День завершён ${fmtDate(ds.completedAt)}</span>` : ""}<span class="pill">В фокусе: ${ds.minutes || 0} мин</span></div>
      <div class="callout"><span class="lbl">Вызов дня</span>${d.challenge}</div>
      <div class="callout"><span class="lbl">Зачем это вам</span>${d.why}</div>
    </section>
    <section class="panel">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Чек-лист дня <span class="mono small muted">${doneCount}/${d.checklist.length}</span></h2>
        <div class="seg" role="group" aria-label="Версия дня"><button type="button" data-act="mode" data-day="${n}" data-mode="full" aria-pressed="${ds.mode !== "min"}">Полная</button><button type="button" data-act="mode" data-day="${n}" data-mode="min" aria-pressed="${ds.mode === "min"}">Минимальная</button></div></div>
      ${ds.mode === "min" ? `<div class="alert warn" style="margin-top:12px"><strong>Минимальная версия (40 мин)</strong><p>${d.minVersion}</p><p>Полную версию догоните в выходной. Минимум сохраняет серию — это главное.</p></div>` : ""}

function navDayHtml(n) {
  const prev = n > 1 ? `<a class="btn ghost" href="#day-${n - 1}">← День ${n - 1}</a>` : "";
  const next = DAY(n + 1) ? (isOpen(n + 1) ? `<a class="btn primary" href="#day-${n + 1}">День ${n + 1} →</a>` : `<span class="btn" aria-disabled="true">${lockSvg()} День ${n + 1}</span>`) : "";

}
function quizHtml(d, ds) {
  const q = ds.quiz; const now = Date.now();
  const cooldownLeft = q.lastFailAt && !q.passedAt ? q.lastFailAt + COOLDOWN_MIN * 60000 - now : 0;
  if (quizRun && quizRun.day === d.n && quizRun.submitted) return quizResultHtml(d, ds);
  if (!(quizRun && quizRun.day === d.n)) {
    let head = `<div class="panel"><h2 style="margin-top:0">Тест дня · 10 вопросов</h2><p class="lede">Порог — ${PASS}/10. Варианты ответов перемешиваются при каждой попытке. После неудачи повтор откроется через ${COOLDOWN_MIN} минут: за это время перечитайте блоки по ошибкам.</p>`;
    if (q.passedAt) head += `<div class="alert ok"><strong>Тест сдан: лучший результат ${q.best}/10.</strong><p>Можно пройти ещё раз для закрепления — результат не понизится.</p></div>`;
    if (cooldownLeft > 0) {
      const mins = Math.ceil(cooldownLeft / 60000);
      head += `<div class="alert warn"><strong>Повтор через ${mins} мин.</strong><p>Перечитайте разделы по вопросам с ошибками${q.wrong && q.wrong.length ? ": " + q.wrong.map(i => "В" + (i + 1)).join(", ") : ""}. Повтор сразу после ошибки проверяет память на ответы, а не понимание.</p></div><div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="sub" data-sub="content">Открыть материал</button></div></div>`;
      return head;
    }
    head += `<div class="row" style="margin-top:12px"><button class="btn primary" type="button" data-act="quiz-start" data-day="${d.n}">${q.attempts ? "Начать новую попытку" : "Начать тест"}</button>${q.attempts ? `<span class="small muted">Попыток: ${q.attempts}</span>` : ""}</div></div>`;
    return head;
  }
  const items = d.quiz.map((qq, i) => {
    const order = quizRun.order[i];
    return `<fieldset class="q" style="margin:0"><legend class="qn">Вопрос ${i + 1} из ${d.quiz.length}</legend><div class="qt">${qq.q}</div>${order.map((oi, k) => `<label><input type="radio" name="q${i}" value="${oi}" data-act="quiz-pick" data-i="${i}" ${quizRun.answers[i] === oi ? "checked" : ""}><span class="lt">${"АБВГ"[k]})</span><span>${qq.options[oi]}</span></label>`).join("")}</fieldset>`;
  }).join("");
  const answered = quizRun.answers.filter(a => a != null).length;
  return `<form class="quiz" data-form="quiz" onsubmit="return false">${items}<div class="row"><button class="btn primary" type="button" data-act="quiz-submit" ${answered < d.quiz.length ? "disabled" : ""}>Сдать тест (${answered}/${d.quiz.length})</button><button class="btn ghost" type="button" data-act="quiz-cancel">Отменить попытку</button></div></form>`;
}
function quizResultHtml(d, ds) {
  const score = quizRun.score; const ok = score >= PASS;
  const items = d.quiz.map((qq, i) => {

}

function viewContract() {
  const c = state.contract || {};
  const signed = !!state.contract;
  const start = c.start || today(); const end = c.end || addDays(start, 29);
  return `<div class="stack"><div><p class="eyebrow">Контракт с собой</p><h1>${signed ? "Контракт подписан" : "Подпишите контракт"}</h1><p class="lede">Конкретные время и место заранее повышают шанс, что занятие состоится. Человек, которому вы отчитываетесь, делает пропуск дороже.</p></div>
    ${signed ? `<section class="panel"><p style="margin:0">Я прохожу программу с <strong>${fmtDate(c.start)}</strong> по <strong>${fmtDate(c.end)}</strong>. Мой ежедневный слот: <strong>${esc(c.from)}–${esc(c.to)}</strong>, место: <strong>${esc(c.place)}</strong>. Раз в неделю отчитываюсь: <strong>${esc(c.partner)}</strong>. Зачем мне это: <strong>${esc(c.why)}</strong>. Если пропущу день: <strong>${esc(c.ifMiss)}</strong>.</p><p class="small muted" style="margin-bottom:0">Подписан ${fmtDate(c.signedAt)}.</p></section>` : ""}
    <section class="panel"><form class="form" onsubmit="return false">
      <div class="two"><div class="field"><label for="c-start">Начало</label><input type="date" id="c-start" value="${esc(start)}"></div><div class="field"><label for="c-end">Финиш</label><input type="date" id="c-end" value="${esc(end)}"><span class="hint">По умолчанию — 30 дней от начала</span></div></div>
      <div class="two"><div class="field"><label for="c-from">Ежедневный слот: с</label><input type="time" id="c-from" value="${esc(c.from || "07:00")}"></div><div class="field"><label for="c-to">до</label><input type="time" id="c-to" value="${esc(c.to || "10:30")}"></div></div>
      <div class="field"><label for="c-name">Имя (для свидетельства о выпуске)</label><input type="text" id="c-name" value="${esc(c.name || "")}" placeholder="как написать в свидетельстве"></div>
      <div class="field"><label for="c-place">Место</label><input type="text" id="c-place" value="${esc(c.place || "")}" placeholder="где вас никто не отвлекает"></div>
      <div class="field"><label for="c-partner">Кому отчитываюсь раз в неделю</label><input type="text" id="c-partner" value="${esc(c.partner || "")}" placeholder="руководитель, коллега-инженер, наставник"></div>
      <div class="field"><label for="c-why">Зачем мне это (одной фразой)</label><input type="text" id="c-why" value="${esc(c.why || "")}" placeholder="например, вести поиск технологов для проектов TMK самостоятельно"></div>
      <div class="field"><label for="c-miss">Если я пропущу день</label><input type="text" id="c-miss" value="${esc(c.ifMiss || "на следующий день делаю минимальную версию, два пропуска подряд не допускаю")}"></div>
      <div id="c-err" class="err" hidden></div>
      <div class="row"><button class="btn primary" type="button" data-act="sign">${signed ? "Обновить контракт" : "Подписать"}</button></div>
    </form></section></div>`;
}

/* ===================== Events ===================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act; const n = +el.dataset.day;
  switch (act) {
    case "start-warmup": { const d = DAY(n); daySub = "content"; dayState(n); persist(); if (!state.timer) startTimer(n, 0, d.checklist[0].minutes || 10, "Разминка"); if (location.hash === "#day-" + n) renderView(); break; }
    case "min-mode": { dayState(n).mode = "min"; daySub = "content"; persist(); if (location.hash === "#day-" + n) renderView(); break; }
    case "mode": { dayState(n).mode = el.dataset.mode; persist(); renderView(); break; }
    case "sub": { daySub = el.dataset.sub; if (daySub !== "quiz" && quizRun && quizRun.submitted) quizRun = null; renderView(); window.scrollTo({ top: $(".subtabs") ? $(".subtabs").offsetTop - 80 : 0 }); break; }
    case "timer": { if (state.timer) { toast("Таймер уже идёт. Остановите его, чтобы начать другой блок."); break; } const d = DAY(n); const i = +el.dataset.idx; startTimer(n, i, +el.dataset.min, plainText(d.checklist[i].text)); break; }
    case "timer-stop": stopTimer(false); break;
    case "quiz-start": { const d = DAY(n); quizRun = { day: n, order: d.quiz.map(q => shuffle(q.options.map((_, i) => i))), answers: d.quiz.map(() => null), submitted: false }; renderView(); break; }
    case "quiz-cancel": quizRun = null; renderView(); break;
    case "quiz-submit": submitQuiz(); break;
    case "finish": finishDay(n); break;
    case "module-score": saveModuleScore(+el.dataset.m); break;
    case "fc-show": fcSession.shown = true; renderView(); break;
    case "fc-grade": gradeCard(el.dataset.ok === "1"); break;
    case "fc-dir": fcSession.dir = el.dataset.dir; fcSession.shown = false; renderView(); break;
    case "fc-restart": fcSession = null; renderView(); break;
    case "sign": signContract(); break;
    case "export": exportFile(); break;
    case "copy": copyBackup(); break;
    case "import-yes": doImport(); break;
    case "import-no": pendingImport = null; $("#import-confirm").hidden = true; break;
    case "reset": $("#reset-confirm").hidden = false; break;
    case "reset-no": $("#reset-confirm").hidden = true; break;
    case "reset-yes": { const c = state.contract; state = defaultState(); state.contract = c; quizRun = null; fcSession = null; persist(); render(); toast("Прогресс сброшен. Контракт сохранён."); break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "check") {
    const ds = dayState(+el.dataset.day); const i = +el.dataset.idx;
    ds.checks[i] = el.checked; if (el.checked) bump("checks");
    persist(); renderView(); renderStatus();
  } else if (el.dataset.act === "quiz-pick") {
    quizRun.answers[+el.dataset.i] = +el.value;
    const answered = quizRun.answers.filter(a => a != null).length; const btn = $('[data-act="quiz-submit"]');
    if (btn) { btn.disabled = answered < quizRun.answers.length; btn.textContent = `Сдать тест (${answered}/${quizRun.answers.length})`; }
  } else if (el.dataset.act === "teach") {
    const m = +el.dataset.m; state.modules[m] = state.modules[m] || {}; state.modules[m].teach = el.checked; persist(); toast(el.checked ? "Teach-back отмечен. Сильный ход." : "Отметка снята.");
  } else if (el.dataset.act === "sound") {
    state.settings.sound = el.checked; persist();
  } else if (el.id === "import-file" && el.files && el.files[0]) {
    readImport(el.files[0]);
  } else if (el.dataset.j) {
    saveJournalField(el);
  }
});
let journalTimer = null;
document.addEventListener("input", e => { const el = e.target; if (el.dataset.j) { clearTimeout(journalTimer); journalTimer = setTimeout(() => saveJournalField(el), 700); } });
function flushJournal() { document.querySelectorAll('[data-form="journal"] [data-j]').forEach(saveJournalField); }
function saveJournalField(el) {
  const form = el.closest('[data-form="journal"]'); if (!form) return;
  const ds = dayState(+form.dataset.day); ds.journal = ds.journal || {};
  if (ds.journal[el.dataset.j] === el.value) return;
  ds.journal[el.dataset.j] = el.value; persist();
}
document.addEventListener("keydown", e => {
  if (route() !== "cards" || !fcSession || e.target.closest("input,textarea")) return;
  if (e.key === " " && !fcSession.shown && fcSession.queue[fcSession.idx]) { e.preventDefault(); fcSession.shown = true; renderView(); }
  else if (fcSession.shown && (e.key === "1" || e.key === "2")) gradeCard(e.key === "2");
});
window.addEventListener("hashchange", () => { daySub = "content"; quizRun = null; renderView(); window.scrollTo(0, 0); $("#main").focus({ preventScroll: true }); });

function plainText(htmlStr) { const t = document.createElement("div"); t.innerHTML = htmlStr; return t.textContent.replace(/\s*\(\d+\s*мин\)\s*$/, "").trim(); }
function submitQuiz() {
  const d = DAY(quizRun.day); const ds = dayState(d.n);
  const wrong = []; let score = 0;
  d.quiz.forEach((q, i) => { if (quizRun.answers[i] === q.answer) score++; else wrong.push(i); });
  quizRun.submitted = true; quizRun.score = score;
  ds.quiz.attempts = (ds.quiz.attempts || 0) + 1;
  ds.quiz.best = Math.max(ds.quiz.best ?? 0, score);
  ds.quiz.wrong = wrong;
  if (score >= PASS) { if (!ds.quiz.passedAt) ds.quiz.passedAt = today(); ds.quiz.lastFailAt = 0; }
  else if (!ds.quiz.passedAt) ds.quiz.lastFailAt = Date.now();
  bump("tests"); persist(); renderView(); renderStatus();
  window.scrollTo({ top: $(".subtabs") ? $(".subtabs").offsetTop - 80 : 0 });
}
function finishDay(n) {
  const ds = dayState(n); const j = ds.journal || {}; const err = $("#finish-err");
  document.querySelectorAll('[data-form="journal"] [data-j]').forEach(el => { j[el.dataset.j] = el.value; });
  ds.journal = j;
  const problems = [];
  if (!passed(n)) problems.push("сдайте тест дня");
  if (!j.insights || j.insights.trim().length < 20) problems.push("запишите три вывода (хотя бы пару предложений)");
  if (!j.commitTime) problems.push("укажите время, когда начнёте завтра");
  if (problems.length) { err.textContent = "Чтобы завершить день: " + problems.join("; ") + "."; err.hidden = false; persist(); return; }
  ds.completedAt = ds.completedAt || today(); j.promiseDate = addDays(today(), 1);
  persist(); renderView(); renderStatus();
  toast(`День ${n} завершён. Завтра в ${j.commitTime} — День ${n + 1}. Обещание записано.`);
}
function saveModuleScore(m) {
  const v = parseInt($("#mscore").value, 10); const err = $("#mod-err");
  if (isNaN(v) || v < 0 || v > 20) { err.textContent = "Введите число от 0 до 20."; err.hidden = false; return; }
  state.modules[m] = state.modules[m] || {};
  state.modules[m].score = Math.max(state.modules[m].score ?? 0, v);
  if (v >= MODULE_PASS && !state.modules[m].passedAt) state.modules[m].passedAt = today();
  bump("tests"); persist(); renderView(); renderStatus();
  toast(v >= MODULE_PASS ? `Модуль ${m} зачтён: ${v}/20. Следующий модуль открыт.` : `${v}/20 — нужно ${MODULE_PASS}. Повторите дни с ошибками и пройдите тест завтра.`);
}
function signContract() {
  const g = id => $("#" + id).value.trim();
  const c = { name: g("c-name"), start: g("c-start"), end: g("c-end"), from: g("c-from"), to: g("c-to"), place: g("c-place"), partner: g("c-partner"), why: g("c-why"), ifMiss: g("c-miss") };
  const missing = [["start", "дату начала"], ["end", "дату финиша"], ["from", "время начала слота"], ["place", "место"], ["partner", "человека, которому отчитываетесь"], ["why", "зачем вам это"]].filter(([k]) => !c[k]).map(([, l]) => l);
  const err = $("#c-err");
  if (missing.length) { err.textContent = "Заполните: " + missing.join(", ") + "."; err.hidden = false; return; }
  if (c.end < c.start) { err.textContent = "Финиш не может быть раньше начала."; err.hidden = false; return; }
  c.signedAt = (state.contract && state.contract.signedAt) || today();
  state.contract = c; persist(); renderView(); renderStatus(); toast("Контракт подписан. Теперь — разминка Дня 1.");
}
async function exportFile() {
  const filename = `academy-progress-${today()}.json`; const data = JSON.stringify(state, null, 2);
  const inViewer = !!(window.claude && window.claude.use);
  if (inViewer) {
    let dl = null;
    try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
    if (!dl) { toast("Сохранение файла здесь недоступно. Используйте «Скопировать копию в буфер»."); return; }
    try { await dl.save({ filename, data }); toast("Копия сохранена."); } catch (e) { toast("Сохранение отменено или недоступно."); }
    return;
  }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast("Копия сохранена в загрузки."); }
  catch (e) { toast("Не удалось сохранить файл. Используйте «Скопировать копию в буфер»."); }
}
async function copyBackup() {
  const data = JSON.stringify(state);
  try { await navigator.clipboard.writeText(data); toast("Копия прогресса скопирована в буфер обмена."); }
  catch (e) { toast("Буфер обмена недоступен. Используйте сохранение в файл."); }
}
let pendingImport = null;
function readImport(file) {
  const r = new FileReader();
  r.onload = () => { try { const s = JSON.parse(r.result); if (!s || s.v !== 1 || typeof s.days !== "object") throw 0; pendingImport = s; $("#import-confirm").hidden = false; } catch (e) { toast("Файл не похож на копию прогресса академии."); } };
  r.readAsText(file);
}
function doImport() { if (!pendingImport) return; state = migrate(pendingImport); pendingImport = null; quizRun = null; fcSession = null; persist(); render(); toast("Прогресс восстановлен из файла."); }

/* ===================== Boot ===================== */
function start() {
  render();
  connectRemote();
  setInterval(() => { renderStatus(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) flushJournal(); else render(); });
}
start();
</script>

</body>
</html>
